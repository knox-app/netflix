<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Smart TV Remote</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0d0e11;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    /* Phone / Remote Container */
    .remote-card {
      width: 100%;
      max-width: 380px;
      height: 820px;
      background: #000000;
      border-radius: 44px;
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px #1a1a1a;
      position: relative;
      overflow: hidden;
    }

    /* Device Status Indicator */
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8e8e93;
      display: inline-block;
      margin-right: 4px;
    }
    .status-dot.connected {
      background: #00e676;
      box-shadow: 0 0 8px #00e676;
    }

    /* Top Selector: Target Device */
    .header-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      width: fit-content;
      margin: 0 auto 6px;
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      color: #e5e5e7;
      transition: background 0.2s;
    }

    .header-pill:active {
      background: rgba(255, 255, 255, 0.18);
    }

    .chevron-down {
      width: 12px;
      height: 12px;
      fill: #8e8e93;
    }

    .now-playing-sub {
      text-align: center;
      font-size: 11.5px;
      color: #8e8e93;
      margin-bottom: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 10px;
    }

    /* Top Action Bar (Mute, Menu, Power) */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      margin-bottom: 16px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 50%;
      transition: transform 0.1s, opacity 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.9);
      opacity: 0.7;
    }

    .icon-btn svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* Central Touchpad Area */
    .touchpad-container {
      flex: 1;
      margin-bottom: 24px;
      display: flex;
    }

    .touchpad {
      flex: 1;
      background-color: #27282b;
      border-radius: 36px;
      cursor: grab;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: none;
      transition: background-color 0.2s;
    }

    .touchpad:active {
      cursor: grabbing;
      background-color: #2e3034;
    }

    .touchpad-hint {
      font-size: 12px;
      color: #8e8e93;
      pointer-events: none;
      font-weight: 500;
    }

    .touchpad-ripple {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      transform: scale(0);
      pointer-events: none;
      transition: transform 0.35s ease-out, opacity 0.35s ease-out;
    }

    /* Bottom Control Section */
    .bottom-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      height: 160px;
    }

    /* Left Column: Display & Play/Pause */
    .left-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .circle-btn-sm {
      width: 62px;
      height: 62px;
      background: #25272a;
      border-radius: 50%;
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s, transform 0.1s;
    }

    .circle-btn-sm:active {
      background: #35383e;
      transform: scale(0.92);
    }

    .circle-btn-sm svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Center: Large Circular Back Button */
    .center-col {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-btn-lg {
      width: 120px;
      height: 120px;
      background: #25272a;
      border-radius: 50%;
      border: none;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .back-btn-lg:active {
      background: #35383e;
      transform: scale(0.94);
    }

    .back-btn-lg svg {
      width: 32px;
      height: 32px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Right Column: Dynamic Rocker (CH or VOL) */
    .right-col {
      height: 100%;
      display: flex;
      align-items: center;
    }

    .rocker-pill {
      width: 62px;
      height: 154px;
      background: #25272a;
      border-radius: 36px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
    }

    .rocker-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0;
      transition: transform 0.1s, opacity 0.2s;
    }

    .rocker-btn:active {
      transform: scale(0.85);
      opacity: 0.6;
    }

    .rocker-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .rocker-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    /* Device Selector Modal */
    .device-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(14px);
      z-index: 100;
      border-radius: 44px;
      padding: 30px 20px;
      display: none;
      flex-direction: column;
    }
    .device-modal.show { display: flex; }
    .device-modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .device-modal-title span { color: #fff; }
    .device-modal-close {
      background: none;
      border: none;
      color: #8e8e93;
      font-size: 18px;
      cursor: pointer;
    }
    .device-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    .device-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #1c1d22;
      border-radius: 14px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .device-item.active {
      border-color: #0072ef;
      background: rgba(0, 114, 239, 0.15);
    }
    .device-item:active { transform: scale(0.98); }
    .dev-name { font-size: 14px; font-weight: 600; color: #fff; }
    .dev-info { font-size: 11px; color: #8e8e93; margin-top: 2px; }

    /* Toast */
    .remote-toast {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30, 32, 38, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 90;
    }
    .remote-toast.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="remote-card">
    
    <!-- Toast Feedback -->
    <div class="remote-toast" id="remoteToast">Connected</div>

    <!-- Header: Selected Device -->
    <div>
      <div class="header-pill" id="roomSelector">
        <span class="status-dot" id="statusDot"></span>
        <span id="targetDeviceLabel">Select Device</span>
        <svg class="chevron-down" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
      <div class="now-playing-sub" id="nowPlayingText">No active stream</div>
    </div>

    <!-- Top Action Row -->
    <div class="top-bar">
      <!-- Mute Button -->
      <button class="icon-btn" id="muteBtn" title="Mute">
        <svg viewBox="0 0 24 24">
          <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
      </button>

      <!-- Menu Button -->
      <button class="icon-btn" id="menuBtn" title="Menu">
        <svg viewBox="0 0 24 24">
          <path d="M4 6h2v2H4V6zm0 5h2v2H4v-2zm0 5h2v2H4v-2zm4-10h12v2H8V6zm0 5h12v2H8v-2zm0 5h12v2H8v-2z"/>
        </svg>
      </button>

      <!-- Power Button -->
      <button class="icon-btn" id="powerBtn" title="Power">
        <svg viewBox="0 0 24 24">
          <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
        </svg>
      </button>
    </div>

    <!-- Center Swipe/Touch Pad -->
    <div class="touchpad-container">
      <div class="touchpad" id="touchpad">
        <div class="touchpad-ripple" id="ripple"></div>
        <div class="touchpad-hint" id="touchpadHint">Tap to Play/Pause • Swipe to Seek</div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
      <!-- Left Column -->
      <div class="left-col">
        <button class="circle-btn-sm" id="inputBtn" title="Input / Episodes">
          <svg viewBox="0 0 24 24">
            <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
          </svg>
        </button>
        <button class="circle-btn-sm" id="playBtn" title="Play / Pause">
          <svg id="playPauseIcon" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>
      </div>

      <!-- Center Back Button -->
      <div class="center-col">
        <button class="back-btn-lg" id="backBtn" title="Back">
          <svg viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
      </div>

      <!-- Right Column: Dynamic Rocker (CH or VOL) -->
      <div class="right-col">
        <div class="rocker-pill">
          <button class="rocker-btn" id="rockerUpBtn" title="Up">
            <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
          </button>
          <span class="rocker-label" id="rockerLabel">CH</span>
          <button class="rocker-btn" id="rockerDownBtn" title="Down">
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Device Picker Sheet -->
    <div class="device-modal" id="deviceModal">
      <div class="device-modal-title">
        <span>Select Active Screen</span>
        <button class="device-modal-close" id="closeDeviceModal">✕</button>
      </div>
      <div class="device-list" id="deviceListContainer">
        <div style="color:#8e8e93; font-size:13px; text-align:center; padding:20px;">Scanning for player screens...</div>
      </div>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, collection, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const authConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase",
      storageBucket: "question-metabase.firebasestorage.app",
      messagingSenderId: "770698198753",
      appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
      measurementId: "G-6ZP1FPMKSJ"
    };
    const authApp = initializeApp(authConfig, "authApp");
    const authDb = getFirestore(authApp);

    let currentUser = null;
    let targetDeviceId = localStorage.getItem('remote_target_device') || null;
    let targetDeviceData = null;
    let devicesListener = null;
    let targetDeviceListener = null;
    let currentVolume = 1.0;
    let isMuted = false;

    try {
      const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
      currentUser = stored ? JSON.parse(stored) : null;
    } catch(e) { currentUser = null; }

    const uid = currentUser?.Lotus || currentUser?.Email || currentUser?.id || 'default_user';

    function triggerHaptic() {
      if (navigator.vibrate) navigator.vibrate(15);
    }

    function showToast(msg) {
      const toast = document.getElementById("remoteToast");
      toast.innerText = msg;
      toast.classList.add("show");
      setTimeout(() => toast.classList.remove("show"), 1800);
    }

    // Attach click haptic feedback
    document.querySelectorAll("button, .header-pill").forEach((btn) => {
      btn.addEventListener("click", () => triggerHaptic());
    });

    // Device Picker Management
    const roomSelector = document.getElementById("roomSelector");
    const deviceModal = document.getElementById("deviceModal");
    const closeDeviceModal = document.getElementById("closeDeviceModal");
    const deviceListContainer = document.getElementById("deviceListContainer");
    const targetDeviceLabel = document.getElementById("targetDeviceLabel");
    const statusDot = document.getElementById("statusDot");
    const nowPlayingText = document.getElementById("nowPlayingText");
    const rockerLabel = document.getElementById("rockerLabel");
    const touchpadHint = document.getElementById("touchpadHint");
    const playPauseIcon = document.getElementById("playPauseIcon");

    roomSelector.onclick = () => {
      deviceModal.classList.add("show");
      fetchAndRenderDevices();
    };

    closeDeviceModal.onclick = () => {
      deviceModal.classList.remove("show");
    };

    function fetchAndRenderDevices() {
      const devCol = collection(authDb, "UARM", uid, "ActiveDevices");
      if (devicesListener) devicesListener();

      devicesListener = onSnapshot(devCol, (snap) => {
        let html = '';
        let count = 0;
        snap.forEach(dSnap => {
          const d = dSnap.data();
          count++;
          const isSelected = d.deviceId === targetDeviceId;
          html += `
            <div class="device-item ${isSelected ? 'active' : ''}" onclick="window.selectTargetDevice('${d.deviceId}', '${d.deviceType}')">
              <div style="flex:1;">
                <div class="dev-name">${d.deviceType} ${isSelected ? '• Connected' : ''}</div>
                <div class="dev-info">${d.contentTitle ? 'Playing: ' + d.contentTitle : 'Active / Ready'}</div>
              </div>
            </div>
          `;
        });

        if (count === 0) {
          deviceListContainer.innerHTML = '<div style="color:#8e8e93; font-size:13px; text-align:center; padding:20px;">No screens found. Open the player on your TV or browser.</div>';
        } else {
          deviceListContainer.innerHTML = html;
        }
      });
    }

    window.selectTargetDevice = function(devId, devType) {
      targetDeviceId = devId;
      localStorage.setItem('remote_target_device', devId);
      targetDeviceLabel.innerText = devType;
      deviceModal.classList.remove("show");
      showToast(`Connected to ${devType}`);
      listenToTargetDevice();
    };

    function listenToTargetDevice() {
      if (!targetDeviceId) {
        statusDot.classList.remove("connected");
        targetDeviceLabel.innerText = "Select Device";
        nowPlayingText.innerText = "No device paired";
        return;
      }

      if (targetDeviceListener) targetDeviceListener();

      const targetRef = doc(authDb, "UARM", uid, "ActiveDevices", targetDeviceId);
      targetDeviceListener = onSnapshot(targetRef, (snap) => {
        if (!snap.exists()) {
          statusDot.classList.remove("connected");
          targetDeviceLabel.innerText = "Device Offline";
          nowPlayingText.innerText = "Disconnected";
          return;
        }

        targetDeviceData = snap.data();
        statusDot.classList.add("connected");
        targetDeviceLabel.innerText = targetDeviceData.deviceType || "Smart TV";
        nowPlayingText.innerText = targetDeviceData.contentTitle ? `Watching: ${targetDeviceData.contentTitle}` : 'Player Ready';

        // Adapt Rocker UI based on Content Type
        const isLive = targetDeviceData.contentType === 'live' || !targetDeviceData.contentType;
        if (isLive) {
          rockerLabel.innerText = "CH";
          touchpadHint.innerText = "Tap for OK • Swipe for Channels";
        } else {
          rockerLabel.innerText = "VOL";
          touchpadHint.innerText = "Tap for Play/Pause • Swipe to Seek";
        }

        // Update Play/Pause Icon state
        if (targetDeviceData.paused) {
          playPauseIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        } else {
          playPauseIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        }
      });
    }

    async function sendCommand(action, value = null) {
      if (!targetDeviceId) {
        showToast("Please select a device first");
        deviceModal.classList.add("show");
        fetchAndRenderDevices();
        return;
      }

      const targetRef = doc(authDb, "UARM", uid, "ActiveDevices", targetDeviceId);
      try {
        await updateDoc(targetRef, {
          remoteCommand: {
            action: action,
            value: value,
            timestamp: Date.now()
          }
        });
      } catch(e) {
        showToast("Command failed");
      }
    }

    // Touchpad Gestures
    const touchpad = document.getElementById("touchpad");
    const ripple = document.getElementById("ripple");
    let startX = 0, startY = 0;

    touchpad.addEventListener("pointerdown", (e) => {
      startX = e.clientX;
      startY = e.clientY;

      const rect = touchpad.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      ripple.style.left = `${x - 30}px`;
      ripple.style.top = `${y - 30}px`;
      ripple.style.transform = "scale(2)";
      ripple.style.opacity = "1";
    });

    touchpad.addEventListener("pointerup", (e) => {
      const diffX = e.clientX - startX;
      const diffY = e.clientY - startY;
      const threshold = 35;

      const isLive = targetDeviceData?.contentType === 'live' || !targetDeviceData?.contentType;

      if (Math.abs(diffX) > threshold || Math.abs(diffY) > threshold) {
        if (Math.abs(diffX) > Math.abs(diffY)) {
          // Horizontal Swipe -> Seek backward/forward
          const cur = targetDeviceData?.currentTime || 0;
          const seekTo = diffX > 0 ? (cur + 15) : Math.max(0, cur - 15);
          sendCommand('SEEK', seekTo);
          showToast(diffX > 0 ? "+15s Forward" : "-15s Rewind");
        } else {
          // Vertical Swipe -> Volume Up/Down or Next Episode
          if (diffY < 0) {
            currentVolume = Math.min(1.0, currentVolume + 0.1);
            sendCommand('VOLUME', currentVolume);
            showToast(`Volume: ${Math.round(currentVolume * 100)}%`);
          } else {
            currentVolume = Math.max(0, currentVolume - 0.1);
            sendCommand('VOLUME', currentVolume);
            showToast(`Volume: ${Math.round(currentVolume * 100)}%`);
          }
        }
      } else {
        // Tap -> Toggle Play / Pause
        if (targetDeviceData?.paused) {
          sendCommand('PLAY');
          showToast("Play");
        } else {
          sendCommand('PAUSE');
          showToast("Pause");
        }
      }

      ripple.style.transform = "scale(0)";
      ripple.style.opacity = "0";
      triggerHaptic();
    });

    // Button Actions
    document.getElementById("playBtn").onclick = () => {
      if (targetDeviceData?.paused) {
        sendCommand('PLAY');
        showToast("Play");
      } else {
        sendCommand('PAUSE');
        showToast("Pause");
      }
    };

    document.getElementById("muteBtn").onclick = () => {
      isMuted = !isMuted;
      sendCommand('VOLUME', isMuted ? 0 : currentVolume);
      showToast(isMuted ? "Muted" : "Unmuted");
    };

    document.getElementById("powerBtn").onclick = () => {
      sendCommand('PAUSE');
      showToast("Turned Off Screen");
    };

    document.getElementById("backBtn").onclick = () => {
      sendCommand('BACK');
      showToast("Back");
    };

    document.getElementById("inputBtn").onclick = () => {
      if (targetDeviceData?.contentType === 'show') {
        const nextIdx = (targetDeviceData?.episodeIdx || 0) + 1;
        sendCommand('SELECT_EPISODE', nextIdx);
        showToast(`Next Episode (${nextIdx + 1})`);
      } else {
        showToast("Opening Menu...");
      }
    };

    // Rocker Actions (Dynamic: Channel or Volume)
    document.getElementById("rockerUpBtn").onclick = () => {
      const isLive = targetDeviceData?.contentType === 'live' || !targetDeviceData?.contentType;
      if (isLive) {
        sendCommand('CHANNEL_UP');
        showToast("Channel Up");
      } else {
        currentVolume = Math.min(1.0, currentVolume + 0.1);
        sendCommand('VOLUME', currentVolume);
        showToast(`Volume ${Math.round(currentVolume * 100)}%`);
      }
    };

    document.getElementById("rockerDownBtn").onclick = () => {
      const isLive = targetDeviceData?.contentType === 'live' || !targetDeviceData?.contentType;
      if (isLive) {
        sendCommand('CHANNEL_DOWN');
        showToast("Channel Down");
      } else {
        currentVolume = Math.max(0, currentVolume - 0.1);
        sendCommand('VOLUME', currentVolume);
        showToast(`Volume ${Math.round(currentVolume * 100)}%`);
      }
    };

    // Start listening on boot
    listenToTargetDevice();
  </script>
</body>
</html>
