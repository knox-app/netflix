<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Smart Multi-Device Remote</title>
  <style>
    :root {
      --bg-color: #0b0c0e;
      --remote-bg: #000000;
      --card-color: #1a1c22;
      --accent-blue: #0072ef;
      --btn-active: #2a2e38;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    .remote-card {
      width: 100%;
      max-width: 390px;
      height: 840px;
      background: var(--remote-bg);
      border-radius: 46px;
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px #1a1a1a;
      position: relative;
    }

    /* Google TV Device Switcher Pill */
    .header-pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.08);
      width: fit-content;
      margin: 0 auto 10px;
      padding: 7px 18px;
      border-radius: 24px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 8px #34c759;
    }
    .status-dot.offline { background: #ff3b30; box-shadow: none; }

    .media-info-tag {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      margin-bottom: 12px;
    }
    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border-radius: 50%;
    }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn svg { width: 24px; height: 24px; fill: currentColor; }

    /* Touchpad Area (Google TV / Apple TV Style) */
    .touchpad-container {
      flex: 1;
      margin-bottom: 20px;
      display: flex;
    }
    .touchpad {
      flex: 1;
      background-color: var(--card-color);
      border-radius: 36px;
      cursor: grab;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .touchpad:active { background-color: var(--btn-active); }
    .touchpad-center-guide {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 1.5px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Bottom Control Section */
    .bottom-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
      height: 160px;
    }

    .left-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }
    .circle-btn-sm {
      width: 62px;
      height: 62px;
      background: var(--card-color);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .circle-btn-sm:active { background: var(--btn-active); transform: scale(0.92); }
    .circle-btn-sm svg { width: 22px; height: 22px; fill: currentColor; }

    .center-col { display: flex; align-items: center; justify-content: center; }
    .back-btn-lg {
      width: 120px;
      height: 120px;
      background: var(--card-color);
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .back-btn-lg:active { background: var(--btn-active); transform: scale(0.94); }
    .back-btn-lg svg { width: 34px; height: 34px; stroke: currentColor; stroke-width: 2.5; fill: none; }

    /* Right Column Dynamic Rocker (CH for Live TV, VOL for Movies/Shows) */
    .right-col { height: 100%; display: flex; align-items: center; }
    .rocker-pill {
      width: 64px;
      height: 154px;
      background: var(--card-color);
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
    }
    .rocker-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0;
    }
    .rocker-btn svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 3; fill: none; }
    .rocker-label { font-size: 13px; font-weight: 800; }

    /* Multi-Device Picker Modal */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(14px);
      z-index: 100;
      display: none;
      flex-direction: column;
      padding: 24px;
      border-radius: 46px;
    }
    .modal-overlay.active { display: flex; }
    .device-item-card {
      background: #181a20;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .device-item-card.selected { border-color: var(--accent-blue); background: rgba(0, 114, 239, 0.15); }
    .device-item-card svg { width: 26px; height: 26px; fill: var(--accent-blue); flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="remote-card">
    <!-- Header Multi-Device Selector -->
    <div>
      <div class="header-pill" id="roomSelector">
        <div class="status-dot" id="targetStatusDot"></div>
        <span id="targetDeviceName">Select Screen</span>
        <svg style="width:12px;height:12px;fill:var(--text-muted);" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </div>
      <div class="media-info-tag" id="mediaInfoTag">Syncing across account devices...</div>
    </div>

    <!-- Top Action Row -->
    <div class="top-bar">
      <button class="icon-btn" id="muteBtn"><svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></button>
      <button class="icon-btn" id="menuBtn"><svg viewBox="0 0 24 24"><path d="M4 6h2v2H4V6zm0 5h2v2H4v-2zm0 5h2v2H4v-2zm4-10h12v2H8V6zm0 5h12v2H8v-2zm0 5h12v2H8v-2z"/></svg></button>
      <button class="icon-btn" id="powerBtn"><svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/></svg></button>
    </div>

    <!-- Center Gestures Touchpad -->
    <div class="touchpad-container">
      <div class="touchpad" id="touchpad">
        <div class="touchpad-center-guide">
          <svg style="width:22px;height:22px;fill:rgba(255,255,255,0.4);" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
        </div>
      </div>
    </div>

    <!-- Bottom Controls -->
    <div class="bottom-controls">
      <div class="left-col">
        <button class="circle-btn-sm" id="btnCastSwitch"><svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg></button>
        <button class="circle-btn-sm" id="playBtn"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
      </div>

      <div class="center-col">
        <button class="back-btn-lg" id="backBtn"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      </div>

      <div class="right-col">
        <div class="rocker-pill">
          <button class="rocker-btn" id="rockerUpBtn"><svg id="iconRockerUp" viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg></button>
          <span class="rocker-label" id="rockerLabel">CH</span>
          <button class="rocker-btn" id="rockerDownBtn"><svg id="iconRockerDown" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
        </div>
      </div>
    </div>

    <!-- Multi-Device Selection Modal -->
    <div class="modal-overlay" id="deviceModal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:17px; font-weight:700;">Select Target Device</h3>
        <button class="icon-btn" id="closeDeviceModal">✕</button>
      </div>
      <div id="deviceListEl" style="overflow-y:auto; flex:1;"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const authConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase"
    };
    const authApp = initializeApp(authConfig);
    const rtdb = getDatabase(authApp);

    let currentUser = null;
    try {
      const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
      currentUser = stored ? JSON.parse(stored) : null;
    } catch(e) { currentUser = null; }

    const urlParams = new URLSearchParams(window.location.search);
    let targetDeviceId = urlParams.get('target');
    let activeScreens = {};
    let isLiveTV = true;

    function getUserKey() {
      return currentUser?.Lotus || currentUser?.Email?.replace(/[.#$[\]]/g, '_') || "default_user";
    }

    function sendCommand(action, payload = {}) {
      if (!targetDeviceId) {
        openDeviceModal();
        return;
      }
      if (navigator.vibrate) navigator.vibrate(15);
      
      const uKey = getUserKey();
      const cmdRef = ref(rtdb, `commands/${uKey}/${targetDeviceId}`);
      set(cmdRef, { action, timestamp: Date.now(), ...payload });
    }

    function updateRocker(isLive) {
      isLiveTV = isLive;
      document.getElementById('rockerLabel').innerText = isLive ? 'CH' : 'VOL';
      document.getElementById('iconRockerUp').innerHTML = isLive 
        ? '<polyline points="18 15 12 9 6 15"></polyline>' 
        : '<line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line>';
      document.getElementById('iconRockerDown').innerHTML = isLive 
        ? '<polyline points="6 9 12 15 18 9"></polyline>' 
        : '<line x1="5" y1="12" x2="19" y2="12"></line>';
    }

    function syncActiveDevices() {
      const uKey = getUserKey();
      const devRef = ref(rtdb, `devices/${uKey}`);

      onValue(devRef, (snap) => {
        activeScreens = snap.val() || {};
        const keys = Object.keys(activeScreens);

        if (keys.length === 0) {
          document.getElementById('targetDeviceName').innerText = "No Screens Found";
          document.getElementById('targetStatusDot').classList.add('offline');
          document.getElementById('mediaInfoTag').innerText = "Open player on any device";
          return;
        }

        if (!targetDeviceId || !activeScreens[targetDeviceId]) {
          targetDeviceId = keys[0];
        }

        const dev = activeScreens[targetDeviceId];
        document.getElementById('targetDeviceName').innerText = dev.name;
        document.getElementById('targetStatusDot').classList.remove('offline');
        document.getElementById('mediaInfoTag').innerText = dev.title || "Ready to Stream";
        updateRocker(dev.title ? !dev.title.includes("Movie") : true);
      });
    }

    syncActiveDevices();

    // Touchpad Gesture Tracking (Scrubbing / Tap / Volume)
    const touchpad = document.getElementById("touchpad");
    let startX = 0, startY = 0, startTime = 0;

    touchpad.addEventListener("pointerdown", (e) => {
      startX = e.clientX; startY = e.clientY; startTime = Date.now();
    });

    touchpad.addEventListener("pointerup", (e) => {
      const diffX = e.clientX - startX;
      const diffY = e.clientY - startY;
      const elapsed = Date.now() - startTime;

      if (Math.abs(diffX) > 30 || Math.abs(diffY) > 30) {
        if (Math.abs(diffX) > Math.abs(diffY)) {
          // Horizontal Scrubbing
          sendCommand('SEEK', { seconds: diffX > 0 ? (elapsed < 200 ? 30 : 10) : (elapsed < 200 ? -30 : -10) });
        } else {
          // Vertical Navigation
          sendCommand(diffY < 0 ? (isLiveTV ? 'CHANNEL_UP' : 'VOLUME') : (isLiveTV ? 'CHANNEL_DOWN' : 'VOLUME'), { delta: diffY < 0 ? 0.1 : -0.1 });
        }
      } else {
        sendCommand('TOGGLE_PLAY');
      }
    });

    // Control Buttons
    document.getElementById("powerBtn").onclick = () => sendCommand('TOGGLE_PLAY');
    document.getElementById("muteBtn").onclick = () => sendCommand('MUTE');
    document.getElementById("playBtn").onclick = () => sendCommand('TOGGLE_PLAY');
    document.getElementById("backBtn").onclick = () => sendCommand('BACK');

    document.getElementById("rockerUpBtn").onclick = () => sendCommand(isLiveTV ? 'CHANNEL_UP' : 'VOLUME', { delta: 0.1 });
    document.getElementById("rockerDownBtn").onclick = () => sendCommand(isLiveTV ? 'CHANNEL_DOWN' : 'VOLUME', { delta: -0.1 });

    function openDeviceModal() {
      const modal = document.getElementById('deviceModal');
      const list = document.getElementById('deviceListEl');
      modal.classList.add('active');

      const keys = Object.keys(activeScreens);
      if (keys.length === 0) {
        list.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">No online devices detected.</div>';
        return;
      }

      list.innerHTML = keys.map(k => `
        <div class="device-item-card ${k === targetDeviceId ? 'selected' : ''}" onclick="window.setTarget('${k}')">
          <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
          <div>
            <div style="font-size:14px; font-weight:700;">${activeScreens[k].name}</div>
            <div style="font-size:11px; color:var(--text-muted);">${activeScreens[k].title || 'Idle'}</div>
          </div>
        </div>
      `).join('');
    }

    window.setTarget = function(id) {
      targetDeviceId = id;
      document.getElementById('deviceModal').classList.remove('active');
      const dev = activeScreens[id];
      if (dev) {
        document.getElementById('targetDeviceName').innerText = dev.name;
        document.getElementById('mediaInfoTag').innerText = dev.title || "Ready to Stream";
      }
    };

    document.getElementById('roomSelector').onclick = openDeviceModal;
    document.getElementById('btnCastSwitch').onclick = openDeviceModal;
    document.getElementById('closeDeviceModal').onclick = () => document.getElementById('deviceModal').classList.remove('active');
  </script>
</body>
</html>
