<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Space | Disney+ Hotstar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-dark: #0f1014;
      --card-bg: #16181f;
      --card-border: rgba(255, 255, 255, 0.05);
      --text-white: #ffffff;
      --text-gray: #8f98b2;
      --text-dim: #646b80;
      --accent-blue: #0264f6;
      --btn-gradient: linear-gradient(90deg, #0165f6 0%, #8a24bd 55%, #df157e 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 74px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 12px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0 2px;
    }

    .brand-star svg {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    .settings-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .settings-btn i {
      font-size: 14px;
      color: #94a3b8;
    }

    /* COMPACT PLAN CARD */
    .plan-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
    }

    .plan-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
      flex: 1;
    }

    .plan-header {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-white);
    }

    .plan-header i {
      font-size: 10px;
      color: var(--text-gray);
      margin-top: 1px;
    }

    .ticker-container {
      height: 16px;
      position: relative;
      overflow: hidden;
    }

    .ticker-item {
      font-size: 12px;
      color: var(--text-gray);
      font-weight: 400;
      transition: all 0.35s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      transform: translateY(10px);
    }

    .ticker-item.active {
      opacity: 1;
      transform: translateY(0);
    }

    .upgrade-btn {
      background: var(--btn-gradient);
      border: none;
      color: #ffffff;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      display: none;
    }

    /* SECTION TITLE */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .section-title {
      font-size: 16.5px;
      font-weight: 700;
      color: var(--text-white);
      letter-spacing: -0.2px;
    }

    .edit-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: none;
      color: var(--text-gray);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .edit-btn i {
      font-size: 11px;
    }

    /* COMPACT PROFILES ROW */
    .profiles-row {
      display: flex;
      align-items: flex-start;
      gap: 16px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 0 6px;
    }

    .profiles-row::-webkit-scrollbar {
      display: none;
    }

    .profile-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      min-width: 54px;
      max-width: 68px;
    }

    .avatar-box {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e222e;
      border: 1.5px solid transparent;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    .profile-item.active .avatar-box {
      border-color: #0284c7;
      box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Kids specific avatar circle fallback */
    .kids-avatar-circle {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #e11d48, #9333ea);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .add-box {
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
      color: #cbd5e1;
      font-size: 18px;
    }

    .profile-name {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-gray);
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      width: 100%;
    }

    .profile-item.active .profile-name {
      color: var(--text-white);
      font-weight: 600;
    }

    /* SLEEK WATCHLIST (16:9 ASPECT RATIO) */
    .watchlist-section {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .watchlist-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 6px;
    }

    .watchlist-row::-webkit-scrollbar {
      display: none;
    }

    .movie-card {
      flex: 0 0 148px;
      aspect-ratio: 16 / 9;
      border-radius: 6px;
      overflow: hidden;
      background: #191c25;
      position: relative;
      cursor: pointer;
    }

    .movie-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .movie-card .movie-badge {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.65);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 500;
      color: #fff;
    }

    .status-msg {
      color: var(--text-gray);
      font-size: 12.5px;
      padding: 6px 0;
    }

    /* FULLSCREEN OVERLAY MODAL (IMAGE 2) */
    .plan-modal {
      position: fixed;
      inset: 0;
      background: #090a0e;
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 16px 18px 30px;
      overflow-y: auto;
    }

    .plan-modal.active {
      display: flex;
    }

    .plan-modal-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-close-bar {
      display: flex;
      justify-content: flex-end;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-brand-icon {
      display: flex;
      justify-content: center;
      margin-top: -6px;
    }

    .modal-brand-icon svg {
      width: 42px;
      height: 42px;
      fill: #ffffff;
    }

    .modal-plan-title {
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
    }

    .modal-plan-subtext {
      font-size: 12.5px;
      color: var(--text-gray);
      margin-top: 3px;
    }

    .modal-upgrade-btn {
      background: var(--btn-gradient);
      border: none;
      color: #ffffff;
      padding: 8px 22px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      width: fit-content;
      margin-top: 10px;
    }

    .modal-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 4px 0 8px;
    }

    .registered-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 2px;
    }

    .registered-title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
    }

    .registered-subtitle {
      font-size: 12px;
      color: var(--text-gray);
      margin-top: 2px;
    }

    .update-btn {
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    /* SLEEK DEVICE CARDS */
    .device-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .device-card-header {
      font-size: 14.5px;
      font-weight: 600;
      color: #ffffff;
    }

    .device-card-body {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .device-meta {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .device-icon-box {
      font-size: 20px;
      color: #94a3b8;
      display: flex;
      align-items: center;
    }

    .device-details h6 {
      font-size: 13px;
      font-weight: 500;
      color: #ffffff;
    }

    .device-details p {
      font-size: 11.5px;
      color: var(--text-gray);
      margin-top: 2px;
    }

    .logout-btn {
      background: #202430;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }

    /* SLIM BOTTOM NAV BAR */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 54px;
      background: rgba(15, 16, 20, 0.96);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      max-width: 480px;
      margin: 0 auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #64748b;
      gap: 3px;
      text-decoration: none;
      width: 33.33%;
      cursor: pointer;
      position: relative;
      height: 100%;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
    }

    .nav-item i {
      font-size: 17px;
    }

    .nav-avatar-sm {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      object-fit: cover;
    }

    .nav-label {
      font-size: 10.5px;
      font-weight: 600;
    }

    .nav-item.active {
      color: #ffffff;
    }

    .nav-item.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      width: 42px;
      height: 2.5px;
      background: #0284c7;
      border-radius: 2px 2px 0 0;
      box-shadow: 0 -1px 8px #0284c7;
    }
  </style>
</head>
<body>

  <div class="app-container" id="mainContainer">
    
    <!-- TOP BAR -->
    <header class="top-bar">
      <div class="brand-star">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
        </svg>
      </div>
      <button class="settings-btn" onclick="alert('Help & Settings')">
        <i class="fa-solid fa-gear"></i>
        <span>Help & Settings</span>
      </button>
    </header>

    <!-- COMPACT SUBSCRIPTION BAR -->
    <div class="plan-card" id="planCard" onclick="window.openPlanModal()">
      <div class="plan-info">
        <div class="plan-header">
          <span id="planNameLabel">Plan</span>
          <i class="fa-solid fa-chevron-down"></i>
        </div>
        <div class="ticker-container">
          <span class="ticker-item active" id="tickerEmail">Loading...</span>
          <span class="ticker-item" id="tickerMessage">Upgrade For More Benefits</span>
        </div>
      </div>
      <button class="upgrade-btn" id="upgradeBtn" onclick="event.stopPropagation(); window.openPlanModal();">Upgrade</button>
    </div>

    <!-- PROFILES SECTION -->
    <section>
      <div class="section-header">
        <h3 class="section-title">Profiles</h3>
        <button class="edit-btn" onclick="alert('Edit Profiles')">
          <i class="fa-solid fa-pencil"></i>
          <span>Edit</span>
        </button>
      </div>
      <div class="profiles-row" id="profilesRow">
        <div class="status-msg">Loading profiles...</div>
      </div>
    </section>

    <!-- 16:9 SLEEK WATCHLIST -->
    <section class="watchlist-section">
      <div class="section-header">
        <h3 class="section-title">Watchlist</h3>
      </div>
      <div class="watchlist-row" id="watchlistRow">
        <div class="status-msg">Loading watchlist...</div>
      </div>
    </section>

  </div>

  <!-- PLAN DETAILS OVERLAY (SCREENSHOT 2) -->
  <div class="plan-modal" id="planModal">
    <div class="plan-modal-container">
      <div class="modal-close-bar">
        <button class="modal-close-btn" onclick="window.closePlanModal()">&times;</button>
      </div>

      <div class="modal-brand-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
        </svg>
      </div>

      <div>
        <h2 class="modal-plan-title" id="modalPlanTitle">Plan Name</h2>
        <p class="modal-plan-subtext" id="modalPlanSubtext">Plan active</p>
        <button class="modal-upgrade-btn" id="modalUpgradeBtn">Upgrade</button>
      </div>

      <div class="modal-divider"></div>

      <div class="registered-section">
        <div>
          <h3 class="registered-title" id="modalPhoneTitle">+91 0000000000</h3>
          <p class="registered-subtitle">Registered Mobile Number</p>
        </div>
        <button class="update-btn" onclick="alert('Update mobile number')">
          <i class="fa-solid fa-pencil"></i> Update
        </button>
      </div>

      <!-- THIS DEVICE -->
      <div class="device-card">
        <h4 class="device-card-header">This Device</h4>
        <div class="device-card-body">
          <div class="device-meta">
            <div class="device-icon-box">
              <i class="fa-solid fa-mobile-screen-button"></i>
            </div>
            <div class="device-details">
              <h6>Android Phone/Tablet</h6>
              <p>Last used : Today</p>
            </div>
          </div>
          <button class="logout-btn" onclick="window.logout()">Log Out</button>
        </div>
      </div>

      <!-- OTHER DEVICES -->
      <div class="device-card">
        <h4 class="device-card-header">Other Devices</h4>
        <div class="device-card-body">
          <div class="device-meta">
            <div class="device-icon-box">
              <i class="fa-solid fa-mobile-screen-button"></i>
            </div>
            <div class="device-details">
              <h6>Android Phone/Tablet</h6>
              <p>Last used : Today</p>
            </div>
          </div>
          <button class="logout-btn" onclick="alert('Device logged out')">Log Out</button>
        </div>
      </div>

    </div>
  </div>

  <!-- BOTTOM NAV BAR -->
  <nav class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='home.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
        <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"/>
      </svg>
    </div>
    <div class="nav-item" onclick="window.location.href='home.html#search'">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
    <div class="nav-item active">
      <img id="navActiveAvatar" class="nav-avatar-sm" src="https://img1.hotstarext.com/image/upload/w_auto,c_fill/v1/feature/profile/27.png" alt="Profile" />
      <span class="nav-label">My Space</span>
    </div>
  </nav>

  <!-- FIREBASE MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Users and Plans Project
    const usersConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase",
      storageBucket: "question-metabase.firebasestorage.app",
      messagingSenderId: "770698198753",
      appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
      measurementId: "G-6ZP1FPMKSJ"
    };

    // Movies Project
    const moviesConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };

    const userApp = initializeApp(usersConfig, "userApp");
    const userDb = getFirestore(userApp);

    const moviesApp = initializeApp(moviesConfig, "moviesApp");
    const moviesDb = getFirestore(moviesApp);

    let activeUserData = null;
    let activeProfileIndex = 0;
    let currentPlanData = null;
    let tickerInterval = null;

    async function loadUserData() {
      const urlParams = new URLSearchParams(window.location.search);
      const lotusParam = urlParams.get('lotus') || urlParams.get('Lotus');

      const rawUser = localStorage.getItem('active_user') || localStorage.getItem('UARM');
      let localUser = rawUser ? JSON.parse(rawUser) : null;
      let userData = null;

      try {
        if (lotusParam) {
          const q = query(collection(userDb, "UARM"), where("Lotus", "==", lotusParam));
          const snap = await getDocs(q);
          if (!snap.empty) userData = { id: snap.docs[0].id, ...snap.docs[0].data() };
        } else if (localUser?.Lotus) {
          const q = query(collection(userDb, "UARM"), where("Lotus", "==", localUser.Lotus));
          const snap = await getDocs(q);
          if (!snap.empty) userData = { id: snap.docs[0].id, ...snap.docs[0].data() };
        } else if (localUser?.id) {
          const snap = await getDoc(doc(userDb, "UARM", localUser.id));
          if (snap.exists()) userData = { id: snap.id, ...snap.data() };
        }

        if (!userData && localUser) userData = localUser;

        if (!userData || !Array.isArray(userData.Profiles)) {
          document.getElementById('mainContainer').innerHTML = `
            <div style="background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.2); color:#f87171; padding:12px; border-radius:6px; font-size:13px; text-align:center;">
              Please sign in to view your profile. <a href="onboarding.html" style="color:#38bdf8; font-weight:600; margin-left:4px;">Sign In</a>
            </div>
          `;
          return;
        }

        activeUserData = userData;
        localStorage.setItem('active_user', JSON.stringify(userData));

        // Read active profile index
        const hashMatch = window.location.hash.match(/user#(\d+)/);
        const storedIndex = localStorage.getItem('active_profile_index');

        if (hashMatch && hashMatch[1] !== undefined) {
          activeProfileIndex = parseInt(hashMatch[1], 10);
        } else if (storedIndex !== null && activeUserData.Profiles[parseInt(storedIndex, 10)]) {
          activeProfileIndex = parseInt(storedIndex, 10);
        } else {
          activeProfileIndex = 0;
        }

        syncProfileToLocalStorage(activeProfileIndex);
        await fetchPlanDetails(activeUserData);

        renderProfiles(activeUserData.Profiles);
        renderWatchlist(activeUserData.Profiles[activeProfileIndex]);

      } catch (err) {
        console.error("Error loading My Space data:", err);
      }
    }

    function syncProfileToLocalStorage(idx) {
      if (!activeUserData || !activeUserData.Profiles[idx]) return;
      const selected = activeUserData.Profiles[idx];

      activeProfileIndex = idx;
      localStorage.setItem('active_profile_index', idx.toString());
      localStorage.setItem('active_profile', JSON.stringify(selected));

      activeUserData.active_profile = selected;
      localStorage.setItem('active_user', JSON.stringify(activeUserData));
    }

    async function fetchPlanDetails(user) {
      const planId = (user.Plans && user.Plans.length > 0) ? user.Plans[0] : null;

      if (planId) {
        try {
          const planSnap = await getDoc(doc(userDb, "Plans & Subscriptions", planId));
          if (planSnap.exists()) {
            currentPlanData = planSnap.data();
          }
        } catch (e) {
          console.error("Could not fetch plan:", e);
        }
      }

      setupSubscriptionBar(user, currentPlanData);
    }

    function setupSubscriptionBar(user, plan) {
      const planNameLabel = document.getElementById('planNameLabel');
      const tickerEmail = document.getElementById('tickerEmail');
      const tickerMessage = document.getElementById('tickerMessage');
      const upgradeBtn = document.getElementById('upgradeBtn');

      const planName = plan?.Name || (user.Plans && user.Plans[0]) || "Super Plan";
      planNameLabel.textContent = planName;
      tickerEmail.textContent = user.Email || "No Email ID Linked";

      // Max condition check
      const isMax = (plan?.Max === "True" || plan?.Max === true || user?.Max === true || user?.Max === "True");

      if (isMax) {
        upgradeBtn.style.display = "none";
        tickerMessage.style.display = "none";
        tickerEmail.classList.add('active');
        if (tickerInterval) clearInterval(tickerInterval);
      } else {
        upgradeBtn.style.display = "block";
        tickerMessage.style.display = "block";

        if (tickerInterval) clearInterval(tickerInterval);
        let showEmail = true;
        tickerInterval = setInterval(() => {
          if (showEmail) {
            tickerEmail.classList.remove('active');
            tickerMessage.classList.add('active');
          } else {
            tickerMessage.classList.remove('active');
            tickerEmail.classList.add('active');
          }
          showEmail = !showEmail;
        }, 3500);
      }

      setupModalData(user, plan, isMax, planName);
    }

    function setupModalData(user, plan, isMax, planName) {
      document.getElementById('modalPlanTitle').textContent = planName;
      document.getElementById('modalPlanSubtext').textContent = user.lastUpdated ? `Plan active` : `Plan active`;

      const modalUpgradeBtn = document.getElementById('modalUpgradeBtn');
      modalUpgradeBtn.style.display = isMax ? 'none' : 'block';

      const rawPhone = user['Phone Number'] || user.Phone || user.PhoneNumber || "8005811475";
      const formattedPhone = String(rawPhone).startsWith('+') ? rawPhone : `+91 ${rawPhone}`;
      document.getElementById('modalPhoneTitle').textContent = formattedPhone;
    }

    window.openPlanModal = function() {
      document.getElementById('planModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    window.closePlanModal = function() {
      document.getElementById('planModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    };

    window.logout = function() {
      localStorage.removeItem('active_user');
      localStorage.removeItem('UARM');
      localStorage.removeItem('active_profile');
      localStorage.removeItem('active_profile_index');
      window.location.href = 'onboarding.html';
    };

    function renderProfiles(profiles) {
      const container = document.getElementById('profilesRow');

      let html = profiles.map((p, idx) => {
        const isActive = idx === activeProfileIndex;
        const isKids = String(p.Kids).toLowerCase() === "true" || String(p.Type).toLowerCase() === "kids";
        const avatar = p.Avatar;

        return `
          <div class="profile-item ${isActive ? 'active' : ''}" onclick="window.selectMySpaceProfile(${idx})">
            <div class="avatar-box">
              ${isKids && !avatar ? 
                `<div class="kids-avatar-circle">KIDS</div>` :
                `<img src="${avatar || 'https://img1.hotstarext.com/image/upload/w_auto,c_fill/v1/feature/profile/27.png'}" class="avatar-img" alt="${p.Name}" />`
              }
            </div>
            <span class="profile-name">${p.Name}</span>
          </div>
        `;
      }).join('');

      html += `
        <div class="profile-item" onclick="alert('Add Profile')">
          <div class="avatar-box add-box">
            <i class="fa-solid fa-plus"></i>
          </div>
          <span class="profile-name">Add</span>
        </div>
      `;

      container.innerHTML = html;

      const currentProfile = profiles[activeProfileIndex];
      if (currentProfile && currentProfile.Avatar) {
        document.getElementById('navActiveAvatar').src = currentProfile.Avatar;
      }
    }

    window.selectMySpaceProfile = function(idx) {
      syncProfileToLocalStorage(idx);
      renderProfiles(activeUserData.Profiles);
      renderWatchlist(activeUserData.Profiles[idx]);
    };

    // Sleek 16:9 Watchlist Cards with Poster.h
    async function renderWatchlist(profile) {
      const container = document.getElementById('watchlistRow');
      container.innerHTML = `<div class="status-msg">Loading watchlist...</div>`;

      const list = profile?.Watchlist;

      if (!Array.isArray(list) || list.length === 0) {
        container.innerHTML = `<div class="status-msg">No titles in watchlist for ${profile.Name || 'this profile'}.</div>`;
        return;
      }

      try {
        const moviePromises = list.map(async (movieId) => {
          try {
            const snap = await getDoc(doc(moviesDb, "Movies", movieId));
            if (snap.exists()) {
              return { id: snap.id, ...snap.data() };
            }

            const q = query(collection(moviesDb, "Movies"), where("__name__", "==", movieId.toLowerCase()));
            const qSnap = await getDocs(q);
            if (!qSnap.empty) {
              return { id: qSnap.docs[0].id, ...qSnap.docs[0].data() };
            }
          } catch (e) {
            console.error("Could not fetch movie:", movieId, e);
          }
          return null;
        });

        const fetchedMovies = await Promise.all(moviePromises);
        const validMovies = fetchedMovies.filter(m => m !== null);

        if (validMovies.length === 0) {
          container.innerHTML = `<div class="status-msg">No watchlist movies found.</div>`;
          return;
        }

        container.innerHTML = validMovies.map(movie => {
          const posterH = movie['Poster.h'] || movie?.Poster?.h || movie.Banner || "https://img10.hotstar.com/image/upload/f_auto,q_90,w_1920/sources/r1/cms/prod/7519/1097519-h-7ee61a6b0942";
          const title = movie.Name || movie.id;
          const badge = movie.Language || movie.Genres || "";

          return `
            <div class="movie-card" onclick="window.location.href='watch.html?id=${encodeURIComponent(movie.id)}'">
              <img src="${posterH}" alt="${title}" loading="lazy" />
              ${badge ? `<span class="movie-badge">${badge}</span>` : ''}
            </div>
          `;
        }).join('');

      } catch (err) {
        console.error("Watchlist fetch error:", err);
        container.innerHTML = `<div class="status-msg" style="color:#ef4444;">Failed to load watchlist items.</div>`;
      }
    }

    loadUserData();
  </script>
</body>
</html>
