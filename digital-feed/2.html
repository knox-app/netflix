<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Live TV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .tv-player-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Dual Video Players for Gapless Switching */
    .video-engine {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: contain;
      transition: opacity 0.4s ease;
    }
    .video-engine.hidden { opacity: 0; pointer-events: none; z-index: 1; }
    .video-engine.active { opacity: 1; z-index: 2; }

    /* REAL TV OVERLAY (LEFT SIDE ONLY - NO LOGO) */
    .tv-broadcast-left {
      position: absolute;
      bottom: 75px;
      left: 20px;
      z-index: 15;
      display: flex;
      flex-direction: column;
      gap: 4px;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .tv-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 4px 12px;
      border-radius: 4px;
      border-left: 3px solid #e50914;
      max-width: 80vw;
    }

    .tv-line.next-line {
      border-left: 3px solid #888888;
      background: rgba(0, 0, 0, 0.35);
      font-size: 12px;
      color: #cccccc;
    }

    .lbl-now { color: #e50914; font-weight: 800; font-size: 11px; letter-spacing: 1px; }
    .lbl-next { color: #aaaaaa; font-weight: 800; font-size: 10px; letter-spacing: 1px; }
    .txt-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Custom Player Controls Overlay */
    .controls-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, transparent 25%, transparent 75%, rgba(0,0,0,0.85) 100%);
      transition: opacity 0.3s ease;
      opacity: 1;
    }
    .controls-overlay.hide-ui { opacity: 0; pointer-events: none; }

    /* Top Bar: Live Badge ONLY (No Logo) */
    .top-bar { display: flex; align-items: center; }
    .live-pill {
      background: #e50914; color: #fff;
      padding: 4px 10px; font-weight: bold; font-size: 11px;
      border-radius: 4px; letter-spacing: 1.5px;
      display: flex; align-items: center; gap: 6px;
    }
    .live-dot { width: 6px; height: 6px; background: #fff; border-radius: 50%; animation: pulse 1s infinite alternate; }
    @keyframes pulse { from { opacity: 0.2; } to { opacity: 1; } }

    /* Bottom Player Bar */
    .bottom-controls { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    
    .progress-track {
      width: 100%; height: 4px; background: rgba(255,255,255,0.2);
      border-radius: 2px; overflow: hidden;
    }
    .progress-fill { height: 100%; background: #e50914; width: 0%; transition: width 0.2s linear; }

    .ctrl-row { display: flex; justify-content: space-between; align-items: center; }
    .ctrl-group { display: flex; align-items: center; gap: 12px; }
    
    .ctrl-btn {
      background: none; border: none; color: white;
      font-size: 18px; cursor: pointer; padding: 6px;
      display: flex; align-items: center; justify-content: center;
    }

    .time-display { font-size: 12px; color: #ddd; font-family: monospace; }

    /* Tap-to-Start Overlay */
    .start-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      color: white; z-index: 100;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      cursor: pointer; text-align: center; padding: 20px;
    }
    .start-btn {
      background: #e50914; color: white; border: none;
      padding: 14px 32px; font-size: 16px; font-weight: bold;
      border-radius: 30px; margin-top: 15px; cursor: pointer;
      box-shadow: 0 4px 15px rgba(229,9,20,0.5);
    }

    @media (max-width: 600px) {
      .tv-broadcast-left { bottom: 65px; left: 12px; }
      .tv-line { font-size: 12px; padding: 3px 8px; }
      .tv-line.next-line { font-size: 11px; }
    }
  </style>
</head>
<body>

<div class="tv-player-wrapper" id="playerWrapper" onclick="handleUserTap()">

  <!-- Initial Autoplay Unmute Screen -->
  <div class="start-overlay" id="startOverlay" onclick="startStream(event)">
    <h2>LIVE DIGITAL BROADCAST</h2>
    <p style="color: #aaa; font-size: 13px; margin-top: 6px;">Tap to watch live with sound</p>
    <button class="start-btn">▶ JOIN STREAM</button>
  </div>

  <!-- Dual Video Engines -->
  <video id="playerA" class="video-engine active" playsinline webkit-playsinline></video>
  <video id="playerB" class="video-engine hidden" playsinline webkit-playsinline></video>

  <!-- TV BROADCAST TEXT OVERLAY (LEFT SIDE ONLY) -->
  <div class="tv-broadcast-left">
    <div class="tv-line">
      <span class="lbl-now">NOW:</span>
      <span class="txt-title" id="txtNow">Loading...</span>
    </div>
    <div class="tv-line next-line">
      <span class="lbl-next">NEXT:</span>
      <span class="txt-title" id="txtNext">Loading...</span>
    </div>
  </div>

  <!-- CUSTOM CONTROLS OVERLAY -->
  <div class="controls-overlay" id="controlsOverlay">
    <div class="top-bar">
      <div class="live-pill">
        <div class="live-dot"></div> LIVE
      </div>
    </div>

    <div class="bottom-controls">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="ctrl-row">
        <div class="ctrl-group">
          <button class="ctrl-btn" id="btnPlay" onclick="togglePlayPause(event)">❚❚</button>
          <button class="ctrl-btn" id="btnMute" onclick="toggleMute(event)">🔊</button>
          <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
        </div>
        <div class="ctrl-group">
          <button class="ctrl-btn" onclick="toggleFullscreen(event)">⛶</button>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728",
    storageBucket: "internal-systems-46728.firebasestorage.app",
    messagingSenderId: "172177452674",
    appId: "1:172177452674:web:155a2417da5531dd7ece9b",
    measurementId: "G-Y87B8VRQ1N"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  let scheduleData = null;
  let activePlayer = 'A';
  let playerA = document.getElementById('playerA');
  let playerB = document.getElementById('playerB');
  let hlsA = null, hlsB = null;
  let syncTimer = null;
  let uiTimer = null;

  async function initPlayer() {
    try {
      const doc = await db.collection("schedules").doc("live_tv").get();
      if (!doc.exists) {
        alert("No stream schedule found. Run 1.html first.");
        return;
      }
      scheduleData = doc.data();
      syncPlayback();
    } catch (e) {
      console.error(e);
    }
  }

  function formatTime(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
  }

  function calculateOffset(schedule) {
    const now = Date.now();
    const elapsed = Math.floor((now - schedule.epochStartTime) / 1000);
    let cycleTime = elapsed % schedule.totalDuration;
    if (cycleTime < 0) cycleTime += schedule.totalDuration;

    let acc = 0;
    for (let i = 0; i < schedule.items.length; i++) {
      const item = schedule.items[i];
      if (cycleTime >= acc && cycleTime < (acc + item.duration)) {
        const nextItem = schedule.items[(i + 1) % schedule.items.length];
        return {
          current: item,
          offset: cycleTime - acc,
          remaining: item.duration - (cycleTime - acc),
          next: nextItem
        };
      }
      acc += item.duration;
    }
    return { current: schedule.items[0], offset: 0, remaining: schedule.items[0].duration, next: schedule.items[1] || schedule.items[0] };
  }

  function loadMedia(videoEl, url) {
    if (url.includes('.m3u8') && Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(videoEl);
      return hls;
    } else {
      videoEl.src = url;
      return null;
    }
  }

  function syncPlayback() {
    if (!scheduleData) return;

    const data = calculateOffset(scheduleData);
    
    // Update TV Overlay Text (Left side)
    document.getElementById('txtNow').innerText = data.current.name;
    document.getElementById('txtNext').innerText = data.next.name;

    const activeEl = activePlayer === 'A' ? playerA : playerB;

    if (activePlayer === 'A') {
      hlsA = loadMedia(playerA, data.current.stream);
    } else {
      hlsB = loadMedia(playerB, data.current.stream);
    }

    activeEl.currentTime = data.offset;
    activeEl.play().catch(() => console.log("Waiting for user tap"));

    // Real-time progress and clock update
    activeEl.ontimeupdate = () => {
      const pct = (activeEl.currentTime / data.current.duration) * 100;
      document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
      document.getElementById('timeDisplay').innerText = `${formatTime(activeEl.currentTime)} / ${formatTime(data.current.duration)}`;
    };

    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => {
      switchPlayer();
    }, data.remaining * 1000);
  }

  function switchPlayer() {
    const nextType = activePlayer === 'A' ? 'B' : 'A';
    const curEl = activePlayer === 'A' ? playerA : playerB;
    const nextEl = nextType === 'A' ? playerA : playerB;

    activePlayer = nextType;
    nextEl.classList.remove('hidden');
    nextEl.classList.add('active');
    curEl.classList.remove('active');
    curEl.classList.add('hidden');

    syncPlayback();
  }

  /* Control Handlers */
  function togglePlayPause(e) {
    if(e) e.stopPropagation();
    const activeEl = activePlayer === 'A' ? playerA : playerB;
    const btn = document.getElementById('btnPlay');
    if (activeEl.paused) {
      activeEl.play();
      btn.innerText = '❚❚';
    } else {
      activeEl.pause();
      btn.innerText = '▶';
    }
  }

  function toggleMute(e) {
    if(e) e.stopPropagation();
    const activeEl = activePlayer === 'A' ? playerA : playerB;
    const btn = document.getElementById('btnMute');
    activeEl.muted = !activeEl.muted;
    btn.innerText = activeEl.muted ? '🔇' : '🔊';
  }

  function toggleFullscreen(e) {
    if(e) e.stopPropagation();
    const wrapper = document.getElementById('playerWrapper');
    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
      if (wrapper.requestFullscreen) {
        wrapper.requestFullscreen();
      } else if (wrapper.webkitRequestFullscreen) {
        wrapper.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }
  }

  function handleUserTap() {
    const overlay = document.getElementById('controlsOverlay');
    overlay.classList.remove('hide-ui');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => {
      overlay.classList.add('hide-ui');
    }, 3500);
  }

  function startStream(e) {
    if(e) e.stopPropagation();
    document.getElementById('startOverlay').style.display = 'none';
    playerA.play();
    playerB.play();
    handleUserTap();
  }

  window.onload = initPlayer;
</script>
</body>
</html>
