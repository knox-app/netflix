<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live TV Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #playerContainer {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video, iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 16px;
      border-radius: 4px;
      pointer-events: none;
    }
    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      margin-right: 6px;
    }
    .message {
      color: #71717a;
      font-size: 1.25rem;
    }
  </style>
</head>
<body>

<div id="playerContainer">
  <div class="overlay" id="channelInfo" style="display: none;">
    <span class="badge"></span>
    <span id="nowPlaying">Loading Channel...</span>
  </div>
  <div id="emptyMessage" class="message">Connecting to stream...</div>
  <video id="hlsPlayer" class="hidden" controls autoplay playsinline></video>
  <div id="ytPlayerContainer" style="width: 100%; height: 100%; display: none;"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728",
    storageBucket: "internal-systems-46728.firebasestorage.app",
    messagingSenderId: "172177452674",
    appId: "1:172177452674:web:155a2417da5531dd7ece9b",
    measurementId: "G-Y87B8VRQ1N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const channelSlug = urlParams.get("channel");

  const emptyMessage = document.getElementById("emptyMessage");
  const hlsVideo = document.getElementById("hlsPlayer");
  const ytContainer = document.getElementById("ytPlayerContainer");
  const channelInfo = document.getElementById("channelInfo");
  const nowPlaying = document.getElementById("nowPlaying");

  let currentSlot = null;
  let ytPlayer = null;
  let hlsInstance = null;

  // Convert "HH:MM" format to minutes since midnight
  function timeToMinutes(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  }

  // Calculate current slot & relative playback seconds
  function getActiveSlot(schedule) {
    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();
    const currentSecondsIntoSlot = (now.getMinutes() % 60) * 60 + now.getSeconds();

    for (let slot of schedule) {
      const start = timeToMinutes(slot.from);
      const end = timeToMinutes(slot.to);

      let isActive = false;
      if (start < end) {
        isActive = currentMinutes >= start && currentMinutes < end;
      } else {
        // Crosses midnight
        isActive = currentMinutes >= start || currentMinutes < end;
      }

      if (isActive) {
        const elapsedMinutes = currentMinutes >= start ? (currentMinutes - start) : (1440 - start + currentMinutes);
        const elapsedSeconds = (elapsedMinutes * 60) + now.getSeconds();
        return { slot, elapsedSeconds };
      }
    }
    return null;
  }

  async function initChannel() {
    if (!channelSlug) {
      emptyMessage.innerText = "No channel specified. Append ?channel=SLUG to URL";
      return;
    }

    const docRef = doc(db, "Live TV", channelSlug);
    const snap = await getDoc(docRef);

    if (!snap.exists()) {
      emptyMessage.innerText = "Channel not found.";
      return;
    }

    const channelData = snap.data();
    syncPlayback(channelData.schedule);
    setInterval(() => syncPlayback(channelData.schedule), 15000); // Check loop every 15s
  }

  function syncPlayback(schedule) {
    const active = getActiveSlot(schedule);

    if (!active) {
      emptyMessage.style.display = "block";
      emptyMessage.innerText = "Off Air. Channel is currently inactive.";
      stopAllPlayers();
      return;
    }

    emptyMessage.style.display = "none";
    channelInfo.style.display = "block";
    nowPlaying.innerText = `NOW PLAYING: ${active.slot.title}`;

    if (currentSlot && currentSlot.title === active.slot.title) {
      return; // Slot has not changed
    }

    currentSlot = active.slot;
    stopAllPlayers();

    if (active.slot.type === "movie") {
      playMovie(active.slot.streamUrl, active.elapsedSeconds);
    } else {
      playTV(active.slot.playlistId, active.slot.mode, active.slot.startIndex, active.elapsedSeconds);
    }
  }

  function stopAllPlayers() {
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    hlsVideo.pause();
    hlsVideo.src = "";
    hlsVideo.style.display = "none";
    ytContainer.style.display = "none";
    ytContainer.innerHTML = "";
  }

  function playMovie(streamUrl, seekTime) {
    hlsVideo.style.display = "block";

    if (Hls.isSupported() && streamUrl.includes(".m3u8")) {
      hlsInstance = new Hls({ startPosition: seekTime });
      hlsInstance.loadSource(streamUrl);
      hlsInstance.attachMedia(hlsVideo);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        hlsVideo.play();
      });
    } else {
      hlsVideo.src = streamUrl;
      hlsVideo.currentTime = seekTime;
      hlsVideo.play();
    }
  }

  function playTV(playlistId, mode, startIndex, seekTime) {
    ytContainer.style.display = "block";
    const ytDiv = document.createElement("div");
    ytDiv.id = "ytPlayer";
    ytContainer.appendChild(ytDiv);

    let listType = "playlist";
    let listId = playlistId;

    ytPlayer = new YT.Player("ytPlayer", {
      height: "100%",
      width: "100%",
      playerVars: {
        listType: listType,
        list: listId,
        autoplay: 1,
        index: startIndex || 0,
        start: seekTime
      },
      events: {
        onReady: (event) => {
          if (mode === "random") {
            event.target.setShuffle(true);
            event.target.nextVideo();
          }
          event.target.playVideo();
        }
      }
    });
  }

  // Load YouTube IFrame API
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  const firstScriptTag = document.getElementsByTagName("script")[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  window.onYouTubeIframeAPIReady = () => {
    initChannel();
  };
</script>
</body>
</html>
