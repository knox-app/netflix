<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Disney+ Live Stream Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    /* Fullscreen Player Container */
    .stream-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
    }

    .player-frame {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      pointer-events: none; /* Block direct YouTube interactions for broadcast feel */
      transition: opacity 0.5s ease-in-out;
    }

    #playerA { z-index: 2; opacity: 1; }
    #playerB { z-index: 1; opacity: 0; }

    /* Disney+ Integrated TV Overlay Bar */
    .tv-broadcast-bar {
      position: absolute;
      top: 25px;
      left: 30px;
      right: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      pointer-events: none;
    }

    /* Left Side Integrated Broadcast Pill */
    .broadcast-info-pill {
      display: flex;
      align-items: center;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 114, 210, 0.4);
      border-radius: 30px;
      padding: 4px 6px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .live-tag {
      background: linear-gradient(135deg, #0072d2, #004494);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .show-meta {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 0 16px;
      color: #fff;
      font-size: 13px;
    }

    .now-title { font-weight: 700; color: #ffffff; }
    .next-divider { color: rgba(255,255,255,0.3); }
    .next-title { color: rgba(255, 255, 255, 0.7); font-weight: 400; }

    /* Right Side Disney+ Logo */
    .disney-logo {
      height: 45px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.7));
    }

    /* Click to Play Autoplay Overlay */
    #startOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(15,24,48,0.95) 0%, rgba(5,7,12,0.98) 100%);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      cursor: pointer;
    }

    #startOverlay img { height: 75px; margin-bottom: 25px; }
    #startOverlay h1 { font-size: 28px; font-weight: 600; letter-spacing: 1px; }
    #startOverlay p { margin-top: 10px; color: #0072d2; font-size: 14px; letter-spacing: 0.5px; }

    /* Custom Player Control Bar (Bottom Overlay) */
    .controls-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px 30px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .stream-viewport:hover .controls-overlay { opacity: 1; }

    .control-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      backdrop-filter: blur(5px);
      transition: background 0.2s;
    }

    .control-btn:hover { background: var(--accent-blue, #0072d2); }
  </style>
</head>
<body>

<div id="startOverlay" onclick="initializeAudioAndStart()">
  <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Disney+">
  <h1>JOIN LIVE STREAM</h1>
  <p>CLICK TO START BROADCAST</p>
</div>

<div class="stream-viewport">
  <!-- Disney+ Integrated TV Bar -->
  <div class="tv-broadcast-bar">
    <div class="broadcast-info-pill">
      <div class="live-tag">LIVE</div>
      <div class="show-meta">
        <span class="now-title" id="nowText">NOW: Loading...</span>
        <span class="next-divider">|</span>
        <span class="next-title" id="nextText">NEXT: ...</span>
      </div>
    </div>
    <img class="disney-logo" src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Disney+">
  </div>

  <!-- Dual Player Iframe Slots for Gapless Prebuffering -->
  <div id="playerA" class="player-frame"></div>
  <div id="playerB" class="player-frame"></div>

  <!-- Custom Player Controls -->
  <div class="controls-overlay">
    <button class="control-btn" onclick="toggleMute()" id="muteBtn">MUTE</button>
    <button class="control-btn" onclick="toggleFullscreen()">FULLSCREEN</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728",
    storageBucket: "internal-systems-46728.firebasestorage.app",
    messagingSenderId: "172177452674",
    appId: "1:172177452674:web:155a2417da5531dd7ece9b",
    measurementId: "G-Y87B8VRQ1N"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  // Get Channel Slug from URL parameter (2.html?watch=channelId)
  const urlParams = new URLSearchParams(window.location.search);
  const channelId = urlParams.get('watch') || 'main';

  let playerA, playerB;
  let activePlayer = 'A';
  let scheduleData = null;
  let prebufferTimer = null;
  let transitionTimer = null;
  let isMuted = false;

  // Load YouTube IFrame API
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

  function onYouTubeIframeAPIReady() {
    fetchChannelSchedule();
  }

  async function fetchChannelSchedule() {
    try {
      const doc = await db.collection("channels").doc(channelId).get();
      if (!doc.exists) {
        document.getElementById('nowText').innerText = `Channel '${channelId}' not found. Setup in 1.html first.`;
        return;
      }
      scheduleData = doc.data();
      initPlayers();
    } catch (e) {
      console.error(e);
      document.getElementById('nowText').innerText = "Error loading live stream.";
    }
  }

  function calculatePlaybackState(schedule) {
    const now = Date.now();
    const elapsedSeconds = Math.floor((now - schedule.epochStartTime) / 1000);
    
    let cycleTime = elapsedSeconds % schedule.totalDuration;
    if (cycleTime < 0) cycleTime += schedule.totalDuration;

    let accumulatedTime = 0;
    for (let i = 0; i < schedule.videos.length; i++) {
      const video = schedule.videos[i];
      if (cycleTime >= accumulatedTime && cycleTime < (accumulatedTime + video.duration)) {
        const offset = cycleTime - accumulatedTime;
        const nextIndex = (i + 1) % schedule.videos.length;
        return {
          currentIndex: i,
          video: video,
          offset: offset,
          remaining: video.duration - offset,
          nextVideo: schedule.videos[nextIndex]
        };
      }
      accumulatedTime += video.duration;
    }
    return { currentIndex: 0, video: schedule.videos[0], offset: 0, remaining: schedule.videos[0].duration, nextVideo: schedule.videos[1] || schedule.videos[0] };
  }

  function initPlayers() {
    const current = calculatePlaybackState(scheduleData);
    updateOverlayTitles(current.video.title, current.nextVideo.title);

    // Player A (Active)
    playerA = new YT.Player('playerA', {
      videoId: current.video.id,
      playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0, 'start': Math.floor(current.offset) },
      events: { 'onReady': (e) => e.target.playVideo() }
    });

    // Player B (Background Standby for Gapless Buffer)
    playerB = new YT.Player('playerB', {
      videoId: current.nextVideo.id,
      playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0 },
      events: { 'onReady': () => setupNextPrebuffer(current) }
    });
  }

  function updateOverlayTitles(nowTitle, nextTitle) {
    document.getElementById('nowText').innerText = "NOW: " + nowTitle;
    document.getElementById('nextText').innerText = "NEXT: " + nextTitle;
  }

  function setupNextPrebuffer(current) {
    clearTimeout(prebufferTimer);
    clearTimeout(transitionTimer);

    // Preload next video in background player 10 seconds before current ends
    const prebufferDelay = Math.max(0, (current.remaining - 10)) * 1000;
    prebufferTimer = setTimeout(() => {
      const state = calculatePlaybackState(scheduleData);
      const standbyPlayer = activePlayer === 'A' ? playerB : playerA;
      standbyPlayer.cueVideoById(state.nextVideo.id, 0);
    }, prebufferDelay);

    // Exact transition timer when current video ends
    transitionTimer = setTimeout(() => {
      switchGaplessPlayer();
    }, current.remaining * 1000);
  }

  function switchGaplessPlayer() {
    const current = calculatePlaybackState(scheduleData);
    updateOverlayTitles(current.video.title, current.nextVideo.title);

    const currentPlayerObj = activePlayer === 'A' ? playerA : playerB;
    const nextPlayerObj = activePlayer === 'A' ? playerB : playerA;
    const currentFrame = document.getElementById(activePlayer === 'A' ? 'playerA' : 'playerB');
    const nextFrame = document.getElementById(activePlayer === 'A' ? 'playerB' : 'playerA');

    // Smooth Gapless Switch
    nextPlayerObj.playVideo();
    nextFrame.style.opacity = '1';
    nextFrame.style.zIndex = '2';

    currentFrame.style.opacity = '0';
    currentFrame.style.zIndex = '1';
    currentPlayerObj.pauseVideo();

    activePlayer = activePlayer === 'A' ? 'B' : 'A';

    setupNextPrebuffer(current);
  }

  function initializeAudioAndStart() {
    document.getElementById('startOverlay').style.display = 'none';
    if (playerA && playerA.playVideo) playerA.playVideo();
    if (playerB && playerB.playVideo) playerB.playVideo();
  }

  function toggleMute() {
    const p = activePlayer === 'A' ? playerA : playerB;
    if (!p) return;
    if (isMuted) {
      p.unMute();
      document.getElementById('muteBtn').innerText = "MUTE";
    } else {
      p.mute();
      document.getElementById('muteBtn').innerText = "UNMUTE";
    }
    isMuted = !isMuted;
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }
</script>
</body>
</html>
