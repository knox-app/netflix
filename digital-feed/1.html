<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital TV Admin - Schedule Stream</title>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f12; color: #fff; padding: 30px; }
    .card { background: #18181c; padding: 25px; border-radius: 10px; max-width: 650px; margin: auto; box-shadow: 0 8px 24px rgba(0,0,0,0.6); border: 1px solid #2a2a30; }
    h2 { color: #e50914; margin-bottom: 20px; }
    label { font-size: 13px; font-weight: bold; margin-top: 15px; display: block; color: #aaa; text-transform: uppercase; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #333; box-sizing: border-box; font-size: 14px; }
    input, select { background: #222226; color: #fff; }
    .checkbox-container { display: flex; align-items: center; gap: 10px; margin-top: 15px; cursor: pointer; }
    .checkbox-container input { width: auto; margin: 0; }
    button { background: #e50914; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 25px; border: none; transition: 0.2s; }
    button:hover { background: #b80710; }
    #status { margin-top: 20px; padding: 12px; border-radius: 6px; background: #222226; font-size: 14px; line-height: 1.5; display: none; }
  </style>
</head>
<body>

<div class="card">
  <h2>📺 Digital Live TV Scheduler</h2>
  
  <label>1. Select Collection Source:</label>
  <select id="collectionSelect">
    <option value="Movies">Movies</option>
    <option value="Shows">Shows</option>
  </select>

  <label>2. Filter by Studio (Optional):</label>
  <input type="text" id="studioInput" placeholder="e.g. Disney India (Leave blank for All)">

  <label>3. Cap by Age Rating (Optional):</label>
  <input type="text" id="ageRatingInput" placeholder="e.g. U, PG, 13+ (Leave blank for All)">

  <label>4. Default Duration per item (Minutes):</label>
  <input type="number" id="durationInput" value="90" min="5" placeholder="Default duration if missing in DB">

  <div class="checkbox-container">
    <input type="checkbox" id="randomizeCheck" checked>
    <span>Randomize / Shuffle Playlist Order</span>
  </div>

  <button onclick="generateSchedule()">🚀 Publish Live TV Broadcast</button>

  <div id="status"></div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728",
    storageBucket: "internal-systems-46728.firebasestorage.app",
    messagingSenderId: "172177452674",
    appId: "1:172177452674:web:155a2417da5531dd7ece9b",
    measurementId: "G-Y87B8VRQ1N"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  async function generateSchedule() {
    const statusDiv = document.getElementById('status');
    statusDiv.style.display = "block";
    statusDiv.style.color = "#fff";
    statusDiv.innerText = "Querying database...";

    const collectionName = document.getElementById('collectionSelect').value;
    const studioFilter = document.getElementById('studioInput').value.trim().toLowerCase();
    const ageFilter = document.getElementById('ageRatingInput').value.trim().toLowerCase();
    const defaultDurationSec = parseInt(document.getElementById('durationInput').value || 90) * 60;
    const shouldRandomize = document.getElementById('randomizeCheck').checked;

    try {
      const snapshot = await db.collection(collectionName).get();
      if (snapshot.empty) {
        throw new Error(`No items found in collection '${collectionName}'`);
      }

      let items = [];

      snapshot.forEach(doc => {
        const data = doc.data();
        
        // Match Studio filter if provided
        if (studioFilter && (!data.Studio || !data.Studio.toLowerCase().includes(studioFilter))) {
          return;
        }

        // Match Age Rating filter if provided
        if (ageFilter && (!data.Age_Rating || !data.Age_Rating.toLowerCase().includes(ageFilter))) {
          return;
        }

        // Must have a valid video stream URL (Stream or Trailer)
        const streamUrl = data.Stream || data.Trailer;
        if (!streamUrl) return;

        items.push({
          id: doc.id,
          name: data.Name || doc.id,
          stream: streamUrl,
          poster: data['Poster.h'] || data['Poster.v'] || data.Banner || '',
          logo: data.Logo || '',
          studio: data.Studio || 'Digital TV',
          ageRating: data.Age_Rating || 'U',
          description: data.Discription || '',
          duration: data.Duration ? parseInt(data.Duration) : defaultDurationSec
        });
      });

      if (items.length === 0) {
        throw new Error("No items matched your studio / age rating filters.");
      }

      // Randomize if requested
      if (shouldRandomize) {
        items = shuffle(items);
      }

      const totalDuration = items.reduce((acc, item) => acc + item.duration, 0);

      statusDiv.innerText = "Saving schedule to Firestore...";

      // Save global schedule doc
      await db.collection("schedules").doc("live_tv").set({
        epochStartTime: Date.now(),
        totalDuration: totalDuration,
        items: items,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      statusDiv.innerHTML = `<span style="color:#00ff00;">✅ Schedule Published Successfully!<br>
      • Matches: <b>${items.length} items</b><br>
      • Total Loop Duration: <b>${Math.round(totalDuration/3600 * 10)/10} Hours</b></span>`;

    } catch (err) {
      console.error(err);
      statusDiv.style.color = "#ff4444";
      statusDiv.innerText = "Error: " + err.message;
    }
  }
</script>
</body>
</html>
