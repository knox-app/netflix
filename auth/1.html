<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Hotstar Auth</title>
    <style>
        :root {
            --bg-color: #0f1017;
            --surface: #191b26;
            --text-primary: #ffffff;
            --text-secondary: #8f98b2;
            --input-border: #2e344d;
            --input-focus: #1f80e0;
            --gradient-btn: linear-gradient(90deg, #0284c7 0%, #6366f1 50%, #ec4899 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
            padding: 30px 24px;
            background: var(--surface);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
        p.subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 28px; line-height: 1.5; }

        .input-group { position: relative; margin-bottom: 24px; text-align: left; }
        .input-group label {
            position: absolute;
            top: -10px;
            left: 14px;
            background: var(--surface);
            padding: 0 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            outline: none;
            background-color: transparent;
            color: var(--text-primary);
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: var(--input-focus); }

        .btn {
            background: var(--gradient-btn);
            color: #fff;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn:hover { opacity: 0.95; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sign In</h1>
    <p class="subtitle">Use your registered email or phone to access Hotstar streaming services.</p>

    <div class="input-group">
        <label>Email or Mobile</label>
        <input type="text" id="identifier" placeholder="e.g. user@domain.com" autocomplete="off">
    </div>

    <button class="btn" id="continueBtn">Continue</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "question-metabase",
        storageBucket: "question-metabase.firebasestorage.app",
        messagingSenderId: "770698198753",
        appId: "1:770698198753:web:59ae49d78b6013bab5c1a0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Persistent Device Identifier
    function getDeviceId() {
        let deviceId = localStorage.getItem('device_fingerprint_id');
        if (!deviceId) {
            deviceId = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Date.now();
            localStorage.setItem('device_fingerprint_id', deviceId);
        }
        return deviceId;
    }

    // 10-digit Alphanumeric Session Generator
    function generate10DigitSession() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < 10; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    document.getElementById('continueBtn').addEventListener('click', async () => {
        const btn = document.getElementById('continueBtn');
        let identifier = document.getElementById('identifier').value.trim();
        if (!identifier) return alert("Please enter your email or mobile number.");

        const isMobile = /^\+?\d+$/.test(identifier);
        btn.disabled = true;
        btn.innerText = "Verifying...";

        try {
            const uarmRef = collection(db, "UARM");
            let q = isMobile 
                ? query(uarmRef, where("Phone Number", "==", identifier))
                : query(uarmRef, where("Email", "==", identifier));

            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                alert("Account not found in our database.");
                btn.disabled = false;
                btn.innerText = "Continue";
                return;
            }

            const userDoc = querySnapshot.docs[0];
            const userData = userDoc.data();
            const email = userData["Email"] || identifier;
            const deviceId = getDeviceId();

            // 1. If user already registered and has Hotstar profiles setup
            if (userData.Hotstar === true && userData.Profiles && userData.Profiles.length > 0) {
                window.location.href = "https://abc.xyz";
                return;
            }

            // 2. Generate 10-digit Alphanumeric Session locked to this device
            const sessionId = generate10DigitSession();

            await setDoc(doc(db, "ASPX Keys", sessionId), {
                sessionId: sessionId,
                email: email,
                deviceId: deviceId,
                uarmId: userDoc.id,
                userName: userData["First Name"] || (userData["Name"] || "User"),
                createdAt: new Date().toISOString()
            });

            // Store local authentication state
            localStorage.setItem('current_hotstar_session', sessionId);
            localStorage.setItem('current_user_email', email);

            // Redirect to profile setup
            window.location.href = `2.html?session=${sessionId}`;

        } catch (error) {
            console.error("Auth error:", error);
            alert("Connection error occurred. Please try again.");
            btn.disabled = false;
            btn.innerText = "Continue";
        }
    });
</script>
</body>
</html>
