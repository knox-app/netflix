<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Hotstar</title>
    <style>
        :root {
            --bg-color: #0f1017;
            --card-bg: #151823;
            --text-primary: #ffffff;
            --text-secondary: #8f98b2;
            --input-border: #2e3447;
            --input-focus: #1f80e0;
            --btn-gradient: linear-gradient(90deg, #0d75ec, #c82479);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 32px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 22px;
            text-align: left;
        }

        .input-group label {
            position: absolute;
            top: -10px;
            left: 14px;
            background: var(--card-bg);
            padding: 0 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 15px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            outline: none;
            background-color: transparent;
            color: var(--text-primary);
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--input-focus);
        }

        .btn {
            background: var(--btn-gradient);
            color: #ffffff;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sign In</h1>
    <p class="subtitle">Enter your registered Email or Mobile number to continue.</p>

    <div class="input-group">
        <label>Email or Mobile</label>
        <input type="text" id="identifier" placeholder="e.g. user@example.com" autocomplete="off">
    </div>

    <button class="btn" id="continueBtn">Continue</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "question-metabase",
        storageBucket: "question-metabase.firebasestorage.app",
        messagingSenderId: "770698198753",
        appId: "1:770698198753:web:59ae49d78b6013bab5c1a0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Get or create a unique Device ID stored on this physical device
    function getOrCreateDeviceId() {
        let deviceId = localStorage.getItem("hotstar_device_id");
        if (!deviceId) {
            deviceId = "dev_" + Math.random().toString(36).substring(2, 12) + Date.now().toString(36);
            localStorage.setItem("hotstar_device_id", deviceId);
        }
        return deviceId;
    }

    // Generate a 10-character alphanumeric session token
    function generateAlphanumericSession(length = 10) {
        const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        let result = "";
        for (let i = 0; i < length; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    document.getElementById('continueBtn').addEventListener('click', async () => {
        const btn = document.getElementById('continueBtn');
        let identifier = document.getElementById('identifier').value.trim();
        if (!identifier) return alert("Please enter your registered Email or Mobile");

        const isMobile = /^\+?\d+$/.test(identifier);
        if (!isMobile && !identifier.includes('@')) {
            identifier += '@perplexity.com';
        }

        btn.disabled = true;
        btn.innerText = "Verifying...";

        try {
            let q = isMobile 
                ? query(collection(db, "UARM"), where("Phone Number", "==", identifier))
                : query(collection(db, "UARM"), where("Email", "==", identifier));

            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                alert("Account not found in our database.");
                btn.disabled = false;
                btn.innerText = "Continue";
                return;
            }

            const userDoc = querySnapshot.docs[0];
            const userData = userDoc.data();
            const email = userData["Email"] || identifier;

            // Check if user already completed Hotstar profile onboarding
            if (userData["Hotstar"] && userData["Hotstar"].profileCompleted === true) {
                window.location.href = "https://abc.xyz";
                return;
            }

            // Create 10-digit alphanumeric session linked to device ID & Email
            const sessionId = generateAlphanumericSession(10);
            const deviceId = getOrCreateDeviceId();

            await setDoc(doc(db, "ASPX Keys", sessionId), {
                sessionId: sessionId,
                email: email,
                deviceId: deviceId,
                uarmDocId: userDoc.id,
                createdAt: new Date()
            });

            // Redirect to 2.html with the generated session
            window.location.href = `2.html?session=${sessionId}`;
        } catch (err) {
            console.error(err);
            alert("An error occurred during verification. Please try again.");
            btn.disabled = false;
            btn.innerText = "Continue";
        }
    });
</script>
</body>
</html>
