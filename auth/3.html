<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Disney+ Hotstar - My Space</title>
    <style>
        :root {
            --bg-color: #0b0c13;
            --surface-color: #141522;
            --card-bg: #191b28;
            --text-primary: #ffffff;
            --text-secondary: #8f98b2;
            --accent-blue: #1f80e0;
            --gold-accent: #f5a623;
            --gradient-upgrade: linear-gradient(90deg, #1f80e0 0%, #a824e8 50%, #e5097f 100%);
            --gradient-promo: linear-gradient(90deg, #62003c 0%, #1e0033 60%, #0e1c38 100%);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            padding-bottom: 75px; /* space for bottom nav */
        }

        .main-wrapper {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Bar */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            position: sticky;
            top: 0;
            background: rgba(11, 12, 19, 0.95);
            backdrop-filter: blur(10px);
            z-index: 50;
        }

        .hotstar-logo-star {
            display: flex;
            align-items: center;
        }

        .help-settings-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: #d1d6e6;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Subscription & Account Info Section */
        .account-card {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 18px 20px;
        }

        .plan-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .plan-title-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .plan-title {
            color: var(--gold-accent);
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .phone-number {
            color: var(--text-secondary);
            font-size: 12.5px;
            font-weight: 400;
        }

        .upgrade-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .upgrade-btn {
            background: var(--gradient-upgrade);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 9px 24px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(229, 9, 127, 0.35);
            transition: transform 0.1s ease;
        }
        .upgrade-btn:active { transform: scale(0.96); }

        .upgrade-subtext {
            font-size: 10.5px;
            color: var(--text-secondary);
            text-align: center;
            max-width: 95px;
            line-height: 1.2;
        }

        .divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 18px 18px;
        }

        /* Profiles Section */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px 14px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .edit-profile-btn {
            background: none;
            border: none;
            color: #d1d6e6;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .profiles-carousel {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            overflow-x: auto;
            padding: 0 18px 18px;
            scrollbar-width: none;
        }
        .profiles-carousel::-webkit-scrollbar { display: none; }

        .profile-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: 72px;
            flex-shrink: 0;
        }

        .profile-avatar {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            position: relative;
            margin-bottom: 8px;
            transition: transform 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-item:active .profile-avatar { transform: scale(0.94); }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-avatar.active-ring {
            box-shadow: 0 0 0 2.5px #1f80e0;
        }

        .profile-avatar.kids-avatar {
            background: radial-gradient(circle, #e5097f 0%, #7928ca 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 0.5px;
            color: #fff;
            text-transform: uppercase;
        }

        .profile-avatar.add-avatar {
            background: #1c1e29;
            border: 1px solid var(--border-color);
            color: #ffffff;
        }

        .profile-name {
            font-size: 12px;
            font-weight: 500;
            color: #ffffff;
            text-align: center;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Promo Banner (Jeeto Dhan Dhana Dhan) */
        .promo-banner {
            margin: 0 18px 18px;
            background: var(--gradient-promo);
            border-radius: 12px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
        }

        .promo-text-wrap h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .promo-text-wrap span {
            font-size: 12px;
            color: #f5a623;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .promo-badge {
            background: linear-gradient(135deg, #e5097f, #8e24aa);
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 11px;
            text-align: center;
            line-height: 1.1;
            text-transform: uppercase;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* Notifications Row */
        .notification-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            cursor: pointer;
        }

        .notif-info h3 {
            font-size: 15.5px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .notif-info p {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Continue Watching Section */
        .continue-watching-section {
            margin-top: 14px;
        }

        .continue-carousel {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 0 18px 20px;
            scrollbar-width: none;
        }
        .continue-carousel::-webkit-scrollbar { display: none; }

        .watch-card {
            width: 200px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .watch-thumbnail-wrap {
            position: relative;
            width: 100%;
            height: 112px;
            border-radius: 8px;
            overflow: hidden;
            background: #1c1e29;
            margin-bottom: 8px;
        }

        .watch-thumbnail-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay-btn {
            position: absolute;
            bottom: 8px;
            left: 8px;
            width: 26px;
            height: 26px;
            background: rgba(0, 0, 0, 0.65);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-bar-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3.5px;
            background: rgba(255, 255, 255, 0.3);
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent-blue);
        }

        .watch-meta {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
        }

        .watch-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 165px;
        }

        .watch-sub {
            font-size: 11.5px;
            color: var(--accent-blue);
            font-weight: 500;
        }
        .watch-sub.time-left {
            color: var(--text-secondary);
        }

        .options-dots {
            background: none;
            border: none;
            color: var(--text-secondary);
            padding: 2px;
            cursor: pointer;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 62px;
            background: #090a10;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }

        .nav-item.active {
            color: #ffffff;
        }

        .nav-avatar-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            object-fit: cover;
        }

        .nav-avatar-icon.kids-nav {
            background: radial-gradient(circle, #e5097f 0%, #7928ca 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 7px;
            font-weight: 900;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Top App Bar -->
        <header class="header">
            <div class="hotstar-logo-star">
                <!-- 4-point Sparkle / Disney+ Hotstar Star -->
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
                    <path d="M12 0L14.2 9.8L24 12L14.2 14.2L12 24L9.8 14.2L0 12L9.8 9.8L12 0Z" fill="#ffffff"/>
                </svg>
            </div>
            <button class="help-settings-btn" id="helpSettingsBtn">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Help & Settings
            </button>
        </header>

        <!-- Account Subscription Header -->
        <section class="account-card">
            <div class="plan-info">
                <div class="plan-title-wrap">
                    <span class="plan-title" id="userPlanTitle">Super 1 Month (Airtel)</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f5a623" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
                </div>
                <div class="phone-number" id="userPhoneDisplay">+91 9784669701</div>
            </div>
            <div class="upgrade-section">
                <button class="upgrade-btn">Upgrade</button>
                <span class="upgrade-subtext">Upgrade for more benefits</span>
            </div>
        </section>

        <div class="divider"></div>

        <!-- Profiles Section -->
        <section>
            <div class="section-header">
                <h2 class="section-title">Profiles</h2>
                <button class="edit-profile-btn" id="editProfilesBtn">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    Edit
                </button>
            </div>
            <div class="profiles-carousel" id="profilesContainer">
                <!-- Dynamically populated profiles will appear here -->
            </div>
        </section>

        <!-- Promotional Banner -->
        <section class="promo-banner" id="promoBanner">
            <div class="promo-text-wrap">
                <h4>Played Jeeto Dhan Dhana Dhan?</h4>
                <span>See Winnings &raquo;</span>
            </div>
            <div class="promo-badge">
                JEETO<br>DHAN DHANA<br>DHAN
            </div>
        </section>

        <!-- Notifications Link Row -->
        <section class="notification-row" id="notificationsRow">
            <div class="notif-info">
                <h3>Notifications</h3>
                <p>No new notifications. You're all caught up!</p>
            </div>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8f98b2" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
        </section>

        <!-- Continue Watching Section -->
        <section class="continue-watching-section">
            <div class="section-header">
                <h2 class="section-title" id="continueWatchingTitle" style="font-size: 16.5px;">Continue Watching for You</h2>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8f98b2" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <div class="continue-carousel">
                <!-- Card 1 -->
                <div class="watch-card">
                    <div class="watch-thumbnail-wrap">
                        <img src="https://img10.hotstar.com/image/upload/f_auto,q_90,w_384/v1651815123/sources/r1/cms/prod/2673/1232673-h-829d5b780447" alt="Home Shanti">
                        <div class="play-overlay-btn">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        </div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 45%;"></div></div>
                    </div>
                    <div class="watch-meta">
                        <div>
                            <div class="watch-title">S1 E3</div>
                            <div class="watch-sub">Next Episode</div>
                        </div>
                        <button class="options-dots"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="watch-card">
                    <div class="watch-thumbnail-wrap">
                        <img src="https://img10.hotstar.com/image/upload/f_auto,q_90,w_384/v1670524942/sources/r1/cms/prod/4253/1364253-h-565b9a89d1ec" alt="Kesari">
                        <div class="play-overlay-btn">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        </div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: 25%;"></div></div>
                    </div>
                    <div class="watch-meta">
                        <div>
                            <div class="watch-title">Kesari Chapter 2</div>
                            <div class="watch-sub time-left">2h 1m left</div>
                        </div>
                        <button class="options-dots"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg></button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 0L14.2 9.8L24 12L14.2 14.2L12 24L9.8 14.2L0 12L9.8 9.8L12 0Z" fill="currentColor"/></svg>
        </button>
        <button class="nav-item active">
            <div id="bottomNavAvatar">
                <!-- Nav avatar icon injected dynamically -->
            </div>
            <span>My Space</span>
        </button>
    </nav>

    <!-- Firebase Integration Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
            authDomain: "question-metabase.firebaseapp.com",
            databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "question-metabase",
            storageBucket: "question-metabase.firebasestorage.app",
            messagingSenderId: "770698198753",
            appId: "1:770698198753:web:59ae49d78b6013bab5c1a0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const getAvatarUrl = (id) => `https://img1.hotstarext.com/image/upload/,c_fill/v2/feature/profile/${id}.png`;

        async function initMySpace() {
            let uarmDocId = localStorage.getItem('hotstar_uarm_doc_id');

            const urlParams = new URLSearchParams(window.location.search);
            const session = urlParams.get('session');

            if (session) {
                try {
                    const sessionSnap = await getDoc(doc(db, "ASPX Keys", session));
                    if (sessionSnap.exists()) {
                        uarmDocId = sessionSnap.data().uarmId;
                        localStorage.setItem('hotstar_uarm_doc_id', uarmDocId);
                    }
                } catch(e) { console.error(e); }
            }

            let userData = null;
            if (uarmDocId) {
                try {
                    const userSnap = await getDoc(doc(db, "UARM", uarmDocId));
                    if (userSnap.exists()) {
                        userData = userSnap.data();
                    }
                } catch(e) { console.error(e); }
            }

            renderDashboard(userData);
        }

        function renderDashboard(data) {
            // 1. Phone / Account Details
            if (data && data.Mobile) {
                document.getElementById('userPhoneDisplay').innerText = data.Mobile.startsWith('+') ? data.Mobile : `+91 ${data.Mobile}`;
            }

            // 2. Profiles rendering
            const profilesContainer = document.getElementById('profilesContainer');
            profilesContainer.innerHTML = '';

            let profiles = (data && data.Profiles && data.Profiles.length > 0) ? data.Profiles : [
                { id: '1', name: data ? (data["First Name"] || data["Name"] || "Vinayak N...") : "Vinayak", avatarId: 38, isKids: false },
                { id: '2', name: "Research", avatarId: 10, isKids: false },
                { id: '3', name: "Kids", isKids: true }
            ];

            let activeProfileId = localStorage.getItem('active_hotstar_profile') || profiles[0].id;
            let currentActiveProfile = profiles.find(p => p.id === activeProfileId) || profiles[0];

            // Update "Continue Watching for [Name]"
            document.getElementById('continueWatchingTitle').innerText = `Continue Watching for ${currentActiveProfile.name}`;

            profiles.forEach(p => {
                const item = document.createElement('div');
                item.className = 'profile-item';

                let avatarHtml = '';
                const isActive = p.id === currentActiveProfile.id;

                if (p.isKids || p.name.toLowerCase() === 'kids') {
                    avatarHtml = `<div class="profile-avatar kids-avatar ${isActive ? 'active-ring' : ''}">KIDS</div>`;
                } else {
                    const url = p.avatarUrl || getAvatarUrl(p.avatarId || 38);
                    avatarHtml = `<div class="profile-avatar ${isActive ? 'active-ring' : ''}"><img src="${url}"></div>`;
                }

                item.innerHTML = `
                    ${avatarHtml}
                    <div class="profile-name">${p.name}</div>
                `;

                item.addEventListener('click', () => {
                    localStorage.setItem('active_hotstar_profile', p.id);
                    renderDashboard(data);
                });

                profilesContainer.appendChild(item);
            });

            // Add Profile item
            const addItem = document.createElement('div');
            addItem.className = 'profile-item';
            addItem.innerHTML = `
                <div class="profile-avatar add-avatar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </div>
                <div class="profile-name">Add</div>
            `;
            addItem.addEventListener('click', () => {
                window.location.href = "create_profile.html?action=new";
            });
            profilesContainer.appendChild(addItem);

            // 3. Bottom Nav Thumbnail Sync
            const navAvatarBox = document.getElementById('bottomNavAvatar');
            if (currentActiveProfile.isKids || currentActiveProfile.name.toLowerCase() === 'kids') {
                navAvatarBox.innerHTML = `<div class="nav-avatar-icon kids-nav">KIDS</div>`;
            } else {
                const navUrl = currentActiveProfile.avatarUrl || getAvatarUrl(currentActiveProfile.avatarId || 38);
                navAvatarBox.innerHTML = `<img class="nav-avatar-icon" src="${navUrl}">`;
            }
        }

        // Action Handlers
        document.getElementById('editProfilesBtn').addEventListener('click', () => {
            window.location.href = "create_profile.html?action=edit";
        });

        initMySpace();
    </script>
</body>
</html>
