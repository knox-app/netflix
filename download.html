<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Downloads - Hotstar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #090a0f;
      --surface-bg: #121520;
      --card-bg: #161924;
      --accent-blue: #1480f0;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.09);
      --danger: #ef4444;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 64px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(9, 10, 15, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
    }
    @media (max-width: 699px) { .topbar { padding: 0 16px; } }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .back-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.18s ease, transform 0.18s ease;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.16); transform: scale(1.05); }
    .back-btn svg { width: 20px; height: 20px; fill: currentColor; }

    .page-title { font-size: 20px; font-weight: 800; }

    .status-pill {
      font-size: 12.5px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .status-pill.ready {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.35);
      color: #34d399;
    }
    .status-pill.offline {
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.4);
      color: #fbbf24;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 28px 60px;
    }
    @media (max-width: 699px) { .container { padding: 18px 16px 50px; } }

    .storage-bar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 22px;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--surface-bg);
      border: 1px solid var(--border-color);
    }
    .storage-info { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .storage-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

    /* Offline Player Box */
    .player-stage {
      display: none;
      margin-bottom: 28px;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
    }
    .player-stage.active { display: block; }
    .player-stage video {
      width: 100%;
      max-height: 70vh;
      display: block;
      background: #000;
    }
    .player-meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
      background: var(--surface-bg);
    }
    .player-title { font-size: 17px; font-weight: 800; }
    .player-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
    .close-player-btn {
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Downloads Grid */
    .downloads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .dl-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.22s var(--ease-out), border-color 0.22s ease;
    }
    .dl-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .dl-thumb-wrap {
      position: relative;
      aspect-ratio: 16/9;
      background: #0e1017;
      cursor: pointer;
      overflow: hidden;
    }
    .dl-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .dl-thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 700;
      background: linear-gradient(135deg, #131724, #0c0e15);
    }
    .dl-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }
    .dl-thumb-wrap:hover .dl-play-overlay { background: rgba(0, 0, 0, 0.2); }
    .dl-play-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(20, 128, 240, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(20, 128, 240, 0.45);
    }
    .dl-play-circle svg { width: 22px; height: 22px; fill: #fff; margin-left: 2px; }

    .dl-size-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
    }

    .dl-body {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .dl-meta { flex: 1; min-width: 0; cursor: pointer; }
    .dl-title {
      font-size: 15.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dl-sub {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .dl-delete-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.18s ease;
    }
    .dl-delete-btn:hover { background: rgba(239, 68, 68, 0.24); }
    .dl-delete-btn svg { width: 18px; height: 18px; fill: currentColor; }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }
    .empty-state h2 { font-size: 20px; color: #fff; margin-bottom: 8px; }
    .empty-state p { font-size: 14px; max-width: 380px; margin: 0 auto; line-height: 1.5; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <button class="back-btn" onclick="window.history.back()" title="Back">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="page-title">Offline Downloads</div>
    </div>
    <div class="status-pill" id="networkStatusPill">Checking...</div>
  </div>

  <div class="container">
    <div class="storage-bar-row">
      <div>
        <div class="storage-info" id="storageCount">Loading saved videos...</div>
        <div class="storage-sub">Page & videos are stored privately inside browser storage (hidden from device Gallery)</div>
      </div>
    </div>

    <!-- Offline Video Player -->
    <div class="player-stage" id="playerStage">
      <video id="offlineVideoPlayer" controls playsinline></video>
      <div class="player-meta-bar">
        <div>
          <div class="player-title" id="playerTitle"></div>
          <div class="player-sub" id="playerSub"></div>
        </div>
        <button class="close-player-btn" id="closePlayerBtn">Close Player</button>
      </div>
    </div>

    <div class="downloads-grid" id="downloadsGrid"></div>
    <div class="empty-state" id="emptyState" style="display: none;">
      <h2>No Offline Videos Yet</h2>
      <p>Tap the Download icon on any movie or episode to watch it here anytime without internet.</p>
    </div>
  </div>

  <script>
    const CACHE_NAME = 'hotstar-offline-shell-v2';
    const OFFLINE_DB_NAME = 'HotstarOfflineDB';
    const OFFLINE_STORE = 'downloads';
    let currentVideoObjectUrl = null;
    const thumbObjectUrls = [];
    let isPageCachedOffline = false;

    async function ensurePageCachedLocally() {
      const pill = document.getElementById('networkStatusPill');

      // 1. Register Service Worker so fresh visits offline load from local cache
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('./sw.js');
          await navigator.serviceWorker.ready;
        } catch (e) {}
      }

      // 2. Also explicitly save download.html into Cache Storage on first visit
      if ('caches' in window) {
        try {
          const cache = await caches.open(CACHE_NAME);
          const pageUrl = new URL('./download.html', window.location.href).href;
          if (navigator.onLine) {
            await cache.add(pageUrl);
          }
          const matched = await cache.match(pageUrl);
          isPageCachedOffline = Boolean(matched);
        } catch (e) {}
      }

      updateNetworkBadge();
    }

    function updateNetworkBadge() {
      const pill = document.getElementById('networkStatusPill');
      if (!navigator.onLine) {
        pill.innerText = 'Offline Mode';
        pill.className = 'status-pill offline';
      } else if (isPageCachedOffline) {
        pill.innerText = 'Offline Ready';
        pill.className = 'status-pill ready';
      } else {
        pill.innerText = 'Online';
        pill.className = 'status-pill';
      }
    }

    window.addEventListener('online', updateNetworkBadge);
    window.addEventListener('offline', updateNetworkBadge);
    ensurePageCachedLocally();

    function openOfflineDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(OFFLINE_DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(OFFLINE_STORE)) {
            db.createObjectStore(OFFLINE_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getAllOfflineVideos() {
      const db = await openOfflineDB();
      return new Promise((resolve) => {
        const tx = db.transaction(OFFLINE_STORE, 'readonly');
        const req = tx.objectStore(OFFLINE_STORE).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    async function deleteOfflineVideo(id) {
      const db = await openOfflineDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE, 'readwrite');
        tx.objectStore(OFFLINE_STORE).delete(id);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 MB';
      const mb = bytes / (1024 * 1024);
      if (mb >= 1024) return `${(mb / 1024).toFixed(2)} GB`;
      return `${mb.toFixed(1)} MB`;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function playRecord(rec) {
      const stage = document.getElementById('playerStage');
      const videoEl = document.getElementById('offlineVideoPlayer');

      if (currentVideoObjectUrl) {
        URL.revokeObjectURL(currentVideoObjectUrl);
        currentVideoObjectUrl = null;
      }

      currentVideoObjectUrl = URL.createObjectURL(rec.videoBlob);
      videoEl.src = currentVideoObjectUrl;
      document.getElementById('playerTitle').innerText = rec.title || 'Offline Video';
      document.getElementById('playerSub').innerText = rec.subtext || formatBytes(rec.sizeBytes);
      stage.classList.add('active');
      videoEl.play().catch(() => {});
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('closePlayerBtn').onclick = () => {
      const stage = document.getElementById('playerStage');
      const videoEl = document.getElementById('offlineVideoPlayer');
      videoEl.pause();
      videoEl.removeAttribute('src');
      videoEl.load();
      if (currentVideoObjectUrl) {
        URL.revokeObjectURL(currentVideoObjectUrl);
        currentVideoObjectUrl = null;
      }
      stage.classList.remove('active');
    };

    async function renderDownloads() {
      thumbObjectUrls.forEach(u => URL.revokeObjectURL(u));
      thumbObjectUrls.length = 0;

      const records = await getAllOfflineVideos();
      records.sort((a, b) => (b.downloadedAt || 0) - (a.downloadedAt || 0));

      const grid = document.getElementById('downloadsGrid');
      const emptyEl = document.getElementById('emptyState');
      const countEl = document.getElementById('storageCount');

      const totalBytes = records.reduce((acc, r) => acc + (r.sizeBytes || 0), 0);
      countEl.innerText = `${records.length} Video${records.length === 1 ? '' : 's'} Saved • ${formatBytes(totalBytes)} used`;

      if (records.length === 0) {
        grid.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
      }

      emptyEl.style.display = 'none';
      grid.innerHTML = records.map((rec, idx) => {
        let thumbHtml = `<div class="dl-thumb-placeholder">Offline Video</div>`;
        if (rec.thumbBlob) {
          const tUrl = URL.createObjectURL(rec.thumbBlob);
          thumbObjectUrls.push(tUrl);
          thumbHtml = `<img src="${tUrl}" alt="${escapeHtml(rec.title)}">`;
        }

        return `
          <div class="dl-card" data-idx="${idx}">
            <div class="dl-thumb-wrap" data-play-idx="${idx}">
              ${thumbHtml}
              <div class="dl-play-overlay">
                <div class="dl-play-circle">
                  <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                </div>
              </div>
              <span class="dl-size-badge">${formatBytes(rec.sizeBytes)}</span>
            </div>
            <div class="dl-body">
              <div class="dl-meta" data-play-idx="${idx}">
                <div class="dl-title">${escapeHtml(rec.title || 'Untitled')}</div>
                <div class="dl-sub">${escapeHtml(rec.subtext || 'Ready offline')}</div>
              </div>
              <button class="dl-delete-btn" data-del-id="${escapeHtml(rec.id)}" title="Delete Download">
                <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
              </button>
            </div>
          </div>
        `;
      }).join('');

      grid.querySelectorAll('[data-play-idx]').forEach(el => {
        el.onclick = () => {
          const rec = records[Number(el.dataset.playIdx)];
          if (rec) playRecord(rec);
        };
      });

      grid.querySelectorAll('[data-del-id]').forEach(btn => {
        btn.onclick = async () => {
          await deleteOfflineVideo(btn.dataset.delId);
          renderDownloads();
        };
      });

      const playId = new URLSearchParams(window.location.search).get('play');
      if (playId) {
        const target = records.find(r => r.id === playId);
        if (target) playRecord(target);
      }
    }

    renderDownloads();
  </script>
</body>
</html>
