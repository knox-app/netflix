<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Sync Channel or Playlist</title>
  <style>
    body { font-family: Arial, sans-serif; background: #121212; color: #fff; padding: 30px; }
    .card { background: #1e1e1e; padding: 25px; border-radius: 8px; max-width: 650px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    label { font-size: 14px; font-weight: bold; margin-top: 15px; display: block; color: #ddd; }
    input, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 5px; border: none; box-sizing: border-box; }
    input { background: #2d2d2d; color: #fff; font-size: 15px; }
    button { background: #ff0000; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 20px; }
    button:hover { background: #cc0000; }
    #status { margin-top: 15px; font-size: 14px; word-break: break-all; line-height: 1.4; }
    .note { font-size: 12px; color: #aaa; margin-top: 3px; }
  </style>
</head>
<body>

<div class="card">
  <h2>YouTube Live Stream Setup</h2>
  
  <label>1. YouTube Channel or Playlist URL / Handle:</label>
  <input type="text" id="sourceInput" placeholder="e.g. Playlist URL, Channel URL, or @handle">
  <div class="note">Supports: Playlist URLs, Channel URLs, Handles (@name), or Playlist/Channel IDs</div>

  <label>2. Title Filter Keyword (Optional):</label>
  <input type="text" id="filterInput" placeholder="e.g. doraemon, shinchan, episode">
  <div class="note">Only videos matching keyword(s) will be included (comma-separated for multiple)</div>

  <button onclick="fetchFilterShuffleSave()">Filter, Randomize & Sync Stream</button>
  <div id="status"></div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728",
    storageBucket: "internal-systems-46728.firebasestorage.app",
    messagingSenderId: "172177452674",
    appId: "1:172177452674:web:155a2417da5531dd7ece9b",
    measurementId: "G-Y87B8VRQ1N"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const YT_API_KEY = "AIzaSyB9esPb8otx99iGcttUGPEbn1Vm0h14l-w";

  // Helper: Convert ISO 8601 Duration to Seconds
  function parseISO8601Duration(duration) {
    const match = duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
    const hours = parseInt(match[1] || 0);
    const minutes = parseInt(match[2] || 0);
    const seconds = parseInt(match[3] || 0);
    return (hours * 3600) + (minutes * 60) + seconds;
  }

  // Fisher-Yates Array Shuffle Logic
  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  // Resolves Input into a YouTube Playlist ID (Works for Channels & Playlists)
  async function resolveToPlaylistId(input) {
    input = input.trim();

    // 1. Check if input contains a Playlist ID (e.g. list=PL123... or direct PL...)
    let playlistMatch = input.match(/[?&]list=([a-zA-Z0-9_-]+)/);
    if (playlistMatch) return playlistMatch[1];
    if ((input.startsWith('PL') || input.startsWith('UU')) && input.length >= 18) {
      return input;
    }

    // 2. Direct Channel ID (UC...)
    let channelId = null;
    if (input.startsWith('UC') && input.length === 24) {
      channelId = input;
    } else {
      // 3. Extract Handle (@username)
      let handleMatch = input.match(/@([\w.-]+)/);
      let handle = handleMatch ? handleMatch[1] : (input.startsWith('@') ? input.slice(1) : null);

      if (handle) {
        const res = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&forHandle=${handle}&key=${YT_API_KEY}`);
        const data = await res.json();
        if (data.items && data.items.length > 0) {
          return data.items[0].contentDetails.relatedPlaylists.uploads;
        }
      }

      // 4. Extract channel/UC... from full Channel URL
      let channelMatch = input.match(/channel\/(UC[\w-]+)/);
      if (channelMatch) channelId = channelMatch[1];
    }

    if (channelId) {
      const chRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id=${channelId}&key=${YT_API_KEY}`);
      const chData = await chRes.json();
      if (chData.items && chData.items.length > 0) {
        return chData.items[0].contentDetails.relatedPlaylists.uploads;
      }
    }

    throw new Error("Could not resolve Playlist or Channel ID. Please check the URL.");
  }

  async function fetchFilterShuffleSave() {
    const rawInput = document.getElementById('sourceInput').value;
    const filterText = document.getElementById('filterInput').value.trim().toLowerCase();
    const statusDiv = document.getElementById('status');

    if (!rawInput) return alert('Please enter a Playlist URL, Channel URL, or Handle');

    statusDiv.style.color = "#fff";
    statusDiv.innerText = "Resolving Playlist ID...";

    try {
      // 1. Resolve to Playlist ID
      const playlistId = await resolveToPlaylistId(rawInput);
      statusDiv.innerText = `Playlist ID found: ${playlistId}. Fetching videos...`;

      // 2. Fetch up to 50 videos from the Playlist
      const plRes = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=contentDetails&playlistId=${playlistId}&maxResults=50&key=${YT_API_KEY}`);
      const plData = await plRes.json();

      if (!plData.items || plData.items.length === 0) {
        throw new Error("No videos found in this playlist.");
      }

      const videoIds = plData.items.map(item => item.contentDetails.videoId).join(',');

      // 3. Fetch details & durations
      const vRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,snippet&id=${videoIds}&key=${YT_API_KEY}`);
      const vData = await vRes.json();

      // Split filter keywords if comma-separated
      const keywords = filterText ? filterText.split(',').map(k => k.trim()).filter(k => k.length > 0) : [];

      // 4. Filter videos based on keywords
      let videos = vData.items.map(v => ({
        id: v.id,
        title: v.snippet.title,
        duration: parseISO8601Duration(v.contentDetails.duration)
      })).filter(v => {
        if (v.duration <= 0) return false; // Exclude live streams / zero duration
        if (keywords.length === 0) return true; // Keep all if no filter

        const titleLower = v.title.toLowerCase();
        return keywords.some(keyword => titleLower.includes(keyword));
      });

      if (videos.length === 0) {
        throw new Error("No videos matched your keyword filter.");
      }

      // 5. RANDOMIZE / SHUFFLE VIDEOS
      videos = shuffleArray(videos);

      // Calculate Total Loop Duration
      const totalDuration = videos.reduce((acc, v) => acc + v.duration, 0);

      statusDiv.innerText = `Matched ${videos.length} videos. Saving schedule to Firestore...`;

      // 6. Save to Firestore DB
      await db.collection("schedules").doc("main").set({
        epochStartTime: Date.now(),
        totalDuration: totalDuration,
        videos: videos,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      });

      statusDiv.innerHTML = `<span style="color:#00ff00;">Success! Matched & randomized <b>${videos.length}</b> videos.<br>Total Loop Duration: ${Math.round(totalDuration/60)} Mins.</span>`;

    } catch (err) {
      console.error(err);
      statusDiv.style.color = "#ff4444";
      statusDiv.innerText = "Error: " + err.message;
    }
  }
</script>
</body>
</html>
