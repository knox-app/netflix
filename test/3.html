<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro HLS Multi-Language Runner</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --accent: #00ff88; --bg: #0a0a0a; --card: #161616; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        .container { width: 100%; max-width: 900px; }
        
        .header { text-align: left; margin-bottom: 20px; border-left: 4px solid var(--accent); padding-left: 15px; }
        h1 { margin: 0; font-size: 24px; }
        
        .input-panel { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; }
        input { width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: var(--accent); border-radius: 6px; box-sizing: border-box; }
        
        .btn-group { display: flex; gap: 10px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-main { background: var(--accent); color: black; }
        .btn-proxy { background: #333; color: white; }
        button:hover { opacity: 0.8; transform: translateY(-1px); }

        .video-wrapper { background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); aspect-ratio: 16/9; }
        video { width: 100%; height: 100%; }

        .track-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .control-box { background: var(--card); padding: 15px; border-radius: 10px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: #888; margin-bottom: 8px; letter-spacing: 1px; }
        select { width: 100%; background: #222; color: white; border: 1px solid #444; padding: 10px; border-radius: 5px; outline: none; }

        .status-bar { margin-top: 15px; font-size: 13px; padding: 10px; border-radius: 5px; background: rgba(255,255,255,0.05); display: none; }
        .error { color: #ff4444; border-left: 3px solid #ff4444; }
        .success { color: var(--accent); border-left: 3px solid var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>M3U8 Runner</h1>
        <small style="color: #666;">Multi-Language & CORS Bypass Support</small>
    </div>

    <div class="input-panel">
        <input type="text" id="streamUrl" placeholder="Enter .m3u8 URL...">
        <div class="btn-group">
            <button class="btn-main" onclick="loadStream(false)">DIRECT PLAY</button>
            <button class="btn-proxy" onclick="loadStream(true)">PLAY VIA PROXY (Fix Localhost Error)</button>
        </div>
    </div>

    <div class="video-wrapper">
        <video id="video" controls></video>
    </div>

    <div id="status" class="status-bar"></div>

    <div class="track-controls">
        <div class="control-box">
            <label>Audio Language</label>
            <select id="audioTracks" onchange="changeAudio()"><option value="-1">Auto</option></select>
        </div>
        <div class="control-box">
            <label>Subtitles</label>
            <select id="subtitleTracks" onchange="changeSubtitle()"><option value="-1">None</option></select>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const audioSelect = document.getElementById('audioTracks');
    const subSelect = document.getElementById('subtitleTracks');
    let hls = null;

    function showStatus(msg, isError) {
        status.style.display = 'block';
        status.innerText = msg;
        status.className = 'status-bar ' + (isError ? 'error' : 'success');
    }

    function loadStream(useProxy) {
        let url = document.getElementById('streamUrl').value.trim();
        if (!url) return;

        // Apply CORS Proxy if selected
        if (useProxy) {
            url = "https://corsproxy.io/?" + encodeURIComponent(url);
            showStatus("Attempting to bypass CORS using Proxy...", false);
        } else {
            showStatus("Loading stream directly...", false);
        }

        if (hls) hls.destroy();

        if (Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90
            });

            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                showStatus("Manifest loaded successfully!", false);
                video.play();
            });

            // Populate Multi-Language Audio
            hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, (event, data) => {
                audioSelect.innerHTML = hls.audioTracks.map((track, id) => 
                    `<option value="${id}">${track.name || track.lang || 'Track ' + id}</option>`
                ).join('');
            });

            // Populate Subtitles
            hls.on(Hls.Events.SUBTITLE_TRACKS_UPDATED, (event, data) => {
                let options = '<option value="-1">None</option>';
                options += hls.subtitleTracks.map((track, id) => 
                    `<option value="${id}">${track.name || track.lang || 'Subtitle ' + id}</option>`
                ).join('');
                subSelect.innerHTML = options;
            });

            // Error Handling
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    showStatus("Network Error: " + data.details + ". Try 'PLAY VIA PROXY'.", true);
                    console.error(data);
                }
            });

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Fallback for Safari
            video.src = url;
            showStatus("Native Playback (Safari)", false);
        }
    }

    function changeAudio() {
        hls.audioTrack = parseInt(audioSelect.value);
    }

    function changeSubtitle() {
        const id = parseInt(subSelect.value);
        hls.subtitleTrack = id;
        hls.subtitleDisplay = (id !== -1);
    }

    // Auto-fill your URL for testing
    window.onload = () => {
        document.getElementById('streamUrl').value = "https://upcloud.animanga.fun/proxy?url=https%3A%2F%2Fcdn.watching.onl%2Fanime%2Fd30960ce77e83d896503d43ba249caf7%2F979b1b166a74bfdba8203e77c6a37cb4%2Fmaster.m3u8&headers=%7B%22user-agent%22%3A%22Mozilla%2F5.0+%28Windows+NT+10.0%3B+Win64%3B+x64%3B+rv%3A137.0%29+Gecko%2F20100101+Firefox%2F137.0%22%2C%22accept%22%3A%22*%2F*%22%2C%22accept-language%22%3A%22en-US%2Cen%3Bq%3D0.5%22%2C%22sec-fetch-dest%22%3A%22empty%22%2C%22sec-fetch-mode%22%3A%22cors%22%2C%22sec-fetch-site%22%3A%22cross-site%22%2C%22origin%22%3A%22https%3A%2F%2Fmegaplay.buzz%22%2C%22referer%22%3A%22https%3A%2F%2Fmegaplay.buzz%2F%22%7D";
    };
</script>

</body>
</html>
