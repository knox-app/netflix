<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Full Screen HLS Player</title>
    
    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh; /* Dynamic Viewport for Mobile Phones */
            background-color: #000000;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        /* Full Screen Container */
        .player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
        }

        /* Video element filling viewport cleanly */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Maintains correct aspect ratio without distortion */
            outline: none;
        }

        /* Top Overlay Controls Bar */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            padding: 12px 16px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: opacity 0.3s ease;
        }

        .url-row {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .url-row input {
            flex: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            backdrop-filter: blur(8px);
        }

        .url-row button, .icon-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.8rem;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 23, 42, 0.7);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            cursor: pointer;
        }

        select {
            background-color: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 10px;
            border-radius: 6px;
            outline: none;
            font-size: 0.8rem;
        }

        /* Overlays for Play / Errors */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 30;
        }

        .play-btn {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }

        .error-box {
            color: #ef4444;
        }

        .error-box p {
            color: #94a3b8;
            margin-top: 8px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <div class="player-wrapper" id="playerContainer">
        
        <!-- Top Overlay Controls Bar -->
        <div class="top-bar" id="topBar">
            <div class="url-row">
                <input type="text" id="streamUrlInput" placeholder="Paste .m3u8 URL here...">
                <button id="loadBtn">Load</button>
                <button class="icon-btn" id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>
            </div>

            <div class="settings-row">
                <span id="statusText">Status: Ready</span>

                <!-- Desktop Bypass Workaround Toggle -->
                <label class="toggle-label">
                    <input type="checkbox" id="desktopBypassToggle">
                    🖥️ Desktop Bypass (Mobile Fix)
                </label>

                <!-- Multi-Audio Language Selector -->
                <div id="audioTrackSelector" style="display: none;">
                    <label for="audioSelect">🌐 Audio: </label>
                    <select id="audioSelect"></select>
                </div>
            </div>
        </div>

        <!-- HTML5 Video Player -->
        <video id="video" controls playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></video>

        <!-- Tap-To-Play Overlay (For Mobile Policy) -->
        <div id="playOverlay" class="overlay" style="display: none;">
            <button class="play-btn" id="startPlayBtn">▶</button>
            <p style="margin-top: 15px; color: #cbd5e1;">Tap to start playback</p>
        </div>

        <!-- Error Overlay -->
        <div id="errorOverlay" class="overlay error-box" style="display: none;">
            <h3>Playback Failed</h3>
            <p id="errorDetails">Unable to load the video stream.</p>
            <button id="retryProxyBtn" style="margin-top: 15px; padding: 8px 16px; background: #ef4444; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">Enable Desktop Bypass & Retry</button>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('video');
            const playerContainer = document.getElementById('playerContainer');
            const streamUrlInput = document.getElementById('streamUrlInput');
            const loadBtn = document.getElementById('loadBtn');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const statusText = document.getElementById('statusText');
            const desktopBypassToggle = document.getElementById('desktopBypassToggle');
            const retryProxyBtn = document.getElementById('retryProxyBtn');
            
            const audioTrackSelector = document.getElementById('audioTrackSelector');
            const audioSelect = document.getElementById('audioSelect');
            
            const playOverlay = document.getElementById('playOverlay');
            const startPlayBtn = document.getElementById('startPlayBtn');
            const errorOverlay = document.getElementById('errorOverlay');
            const errorDetails = document.getElementById('errorDetails');

            let hlsInstance = null;

            // Auto-check Desktop Bypass if mobile device is detected
            const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile/i.test(navigator.userAgent);
            if (isMobile) {
                desktopBypassToggle.checked = true;
            }

            // Read URL parameter ?url= or default fallback
            const defaultUrl = "https://edge1-madrid-sprintcdn.r66nv9ed.com/hls2/03/10422/ebuhwuc5szpk_x/master.m3u8?t=1yxml3d3IqPopMbYIKaunzNEgOUzzrxFb02QFH4xefc&s=1787133329&e=10800&f=52113532&srv=1055&asn=9829&sp=5500&p=0";
            const urlParams = new URLSearchParams(window.location.search);
            let currentUrl = urlParams.get('url') ? decodeURIComponent(urlParams.get('url')) : defaultUrl;

            streamUrlInput.value = currentUrl;

            function hideOverlays() {
                playOverlay.style.display = 'none';
                errorOverlay.style.display = 'none';
            }

            function showError(msg) {
                errorOverlay.style.display = 'flex';
                errorDetails.textContent = msg;
                statusText.textContent = "Status: Error";
            }

            // Main HLS Loading Function
            function loadStream(rawUrl) {
                hideOverlays();
                statusText.textContent = "Status: Loading...";
                audioTrackSelector.style.display = 'none';

                if (hlsInstance) {
                    hlsInstance.destroy();
                }

                // Apply Desktop Bypass Proxy if checked
                let finalUrl = rawUrl;
                if (desktopBypassToggle.checked) {
                    finalUrl = "https://corsproxy.io/?" + encodeURIComponent(rawUrl);
                }

                if (Hls.isSupported()) {
                    hlsInstance = new Hls({
                        debug: false,
                        enableWorker: true,
                        lowLatencyMode: true
                    });

                    hlsInstance.loadSource(finalUrl);
                    hlsInstance.attachMedia(video);

                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        statusText.textContent = desktopBypassToggle.checked ? "Status: Playing (Bypass Mode)" : "Status: Playing Direct";
                        
                        video.play().catch(() => {
                            playOverlay.style.display = 'flex';
                        });
                    });

                    // Detect Audio Tracks
                    hlsInstance.on(Hls.Events.AUDIO_TRACKS_UPDATED, () => {
                        const tracks = hlsInstance.audioTracks;
                        if (tracks && tracks.length > 1) {
                            audioTrackSelector.style.display = 'block';
                            audioSelect.innerHTML = '';
                            tracks.forEach((track, index) => {
                                const option = document.createElement('option');
                                option.value = index;
                                option.textContent = (track.name || track.lang || `Track ${index + 1}`).toUpperCase();
                                if (index === hlsInstance.audioTrack) option.selected = true;
                                audioSelect.appendChild(option);
                            });
                        }
                    });

                    // Error Management
                    hlsInstance.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            if (!desktopBypassToggle.checked) {
                                showError("Mobile CDN check failed. Try Enabling Desktop Bypass Mode.");
                            } else {
                                showError("Fatal Error: Stream link/token has expired.");
                            }
                        }
                    });

                // Safari Native Support
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = finalUrl;
                    video.addEventListener('loadedmetadata', () => {
                        statusText.textContent = "Status: Playing";
                        video.play().catch(() => playOverlay.style.display = 'flex');
                    });
                }
            }

            // Fullscreen Toggle Logic
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    if (playerContainer.requestFullscreen) {
                        playerContainer.requestFullscreen();
                    } else if (playerContainer.webkitRequestFullscreen) {
                        playerContainer.webkitRequestFullscreen();
                    }
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            });

            // Re-load on Bypass toggle
            desktopBypassToggle.addEventListener('change', () => {
                loadStream(streamUrlInput.value.trim());
            });

            retryProxyBtn.addEventListener('click', () => {
                desktopBypassToggle.checked = true;
                loadStream(streamUrlInput.value.trim());
            });

            // Audio track change
            audioSelect.addEventListener('change', (e) => {
                if (hlsInstance) hlsInstance.audioTrack = parseInt(e.target.value, 10);
            });

            // Tap to Play Overlay Trigger
            startPlayBtn.addEventListener('click', () => {
                playOverlay.style.display = 'none';
                video.play();
            });

            // Load button
            loadBtn.addEventListener('click', () => {
                const newUrl = streamUrlInput.value.trim();
                if (newUrl) loadStream(newUrl);
            });

            // Initial Playback
            loadStream(currentUrl);
        });
    </script>
</body>
</html>
