<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HLS Video Player with Multi-Audio</title>
    
    <!-- HLS.js Library via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 900px;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        .player-header {
            padding: 16px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .player-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f8fafc;
        }

        /* Language Selector UI */
        .audio-selector-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        select {
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            font-size: 0.85rem;
            transition: border-color 0.2s;
        }

        select:hover, select:focus {
            border-color: #38bdf8;
        }

        .video-wrapper {
            position: relative;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000000;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            outline: none;
        }

        .error-message {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: #ef4444;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }

        .error-message h3 {
            margin-bottom: 8px;
            font-size: 1.2rem;
        }

        .error-message p {
            color: #94a3b8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="player-container">
        <div class="player-header">
            <h2>Live HLS Stream</h2>
            
            <!-- Dynamic Audio Language Selector -->
            <div id="audioTrackSelector" class="audio-selector-container" style="display: none;">
                <label for="audioSelect">🌐 Audio:</label>
                <select id="audioSelect"></select>
            </div>
        </div>
        
        <div class="video-wrapper">
            <video id="video" controls preload="auto" crossorigin="anonymous"></video>
            
            <div id="errorMessage" class="error-message" style="display: none;">
                <h3>Stream Error</h3>
                <p id="errorDetails">Unable to load the video stream.</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('video');
            const errorMessage = document.getElementById('errorMessage');
            const errorDetails = document.getElementById('errorDetails');
            
            const audioTrackSelector = document.getElementById('audioTrackSelector');
            const audioSelect = document.getElementById('audioSelect');

            // The target M3U8 URL
            const streamUrl = "https://edge1-madrid-sprintcdn.r66nv9ed.com/hls2/03/10422/ebuhwuc5szpk_x/master.m3u8?t=1yxml3d3IqPopMbYIKaunzNEgOUzzrxFb02QFH4xefc&s=1787133329&e=10800&f=52113532&srv=1055&asn=9829&sp=5500&p=0";

            function showError(msg) {
                errorMessage.style.display = 'flex';
                errorDetails.textContent = msg;
            }

            // Check if HLS.js is supported
            if (Hls.isSupported()) {
                const hls = new Hls({
                    debug: false,
                    enableWorker: true,
                    lowLatencyMode: true,
                });

                hls.loadSource(streamUrl);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {
                        console.log("Autoplay prevented. User interaction required.");
                    });
                });

                // Listen for available Audio Tracks
                hls.on(Hls.Events.AUDIO_TRACKS_UPDATED, (event, data) => {
                    const tracks = hls.audioTracks;

                    // If more than 1 audio track is available, show the language dropdown
                    if (tracks && tracks.length > 1) {
                        audioTrackSelector.style.display = 'flex';
                        audioSelect.innerHTML = ''; // Clear existing options

                        tracks.forEach((track, index) => {
                            const option = document.createElement('option');
                            option.value = index;
                            
                            // Display track name, language code, or fallback label
                            const langName = track.name || track.lang || `Track ${index + 1}`;
                            option.textContent = langName.toUpperCase();
                            
                            if (index === hls.audioTrack) {
                                option.selected = true;
                            }
                            audioSelect.appendChild(option);
                        });
                    } else {
                        audioTrackSelector.style.display = 'none';
                    }
                });

                // Handle switching Audio Language when selected from dropdown
                audioSelect.addEventListener('change', (e) => {
                    const selectedTrackId = parseInt(e.target.value, 10);
                    hls.audioTrack = selectedTrackId;
                    console.log(`Audio track changed to: ${selectedTrackId}`);
                });

                // Error Handling
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                showError("Network error: Stream link expired or CORS restricted.");
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                showError("Fatal playback error. Link may have expired.");
                                break;
                        }
                    }
                });

            // Native HLS support (Safari on macOS/iOS)
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(() => console.log("Autoplay prevented."));
                });

                // Note: Safari includes native language controls inside its built-in media controls
                video.addEventListener('error', () => {
                    showError("Error loading stream natively. Link might be expired.");
                });
            } else {
                showError("Your browser does not support HLS video playback.");
            }
        });
    </script>
</body>
</html>
