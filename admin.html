  // Helper: Title Slugifier
  function slugify(text) {
    return text.toString().toLowerCase()
      .trim()
      .replace(/\s+/g, '-')
      .replace(/[^\w\-]+/g, '')
      .replace(/\-\-+/g, '-')
      .replace(/^-+/, '')
      .replace(/-+$/, '');
  }

  // Helper: Extract Numeric Season Number

    if (!input) return 1;
    const match = input.toString().match(/\d+/);

  }

  // Groq AI Auto-Fill Metadata
  window.autoFillWithGroq = async function() {
    const title = document.getElementById('titleName').value;
    if (!title) {
      showStatus(&quot;Please enter a Title Name first!&quot;, &quot;error&quot;);
      return;
    }

    showStatus(&quot;Fetching metadata using Groq AI...&quot;, &quot;warning&quot;);

    const prompt = `Return ONLY a valid JSON object (no markdown formatting or code blocks) for the content titled &quot;${title}&quot; with exact fields:
    {
      &quot;Studio&quot;: &quot;Studio or Network Name&quot;,

  // Batch process episode titles with Groq AI
  async function cleanTitlesInBatchWithGroq(titlesList) {
    const prompt = `You are an episode title cleaner. Clean the following list of video titles by removing show names, hashtags (#), channel handles (@), 'Episode 01', 'Ep 1', and extra symbol clutter. Keep only the core clean episode name.
    
    Input JSON array: ${JSON.stringify(titlesList)}

        headers: {
          &quot;Authorization&quot;: `Bearer ${groqApiKey}`,
          &quot;Content-Type&quot;: &quot;application/json&quot;

      const data = await response.json();
      let rawText = data.choices[0].message.content.trim().replace(/```json/g, &quot;&quot;).replace(/```/g, &quot;&quot;).trim();

  // Fetch YouTube Playlist with Direct YouTube Key
  window.fetchYTPlaylist = async function() {
    const playlistUrl = document.getElementById('ytPlaylistUrl').value;
    const titleName = document.getElementById('titleName').value;
    const rawSeason = document.getElementById('seasonNumber').value;
    const sortOrder = document.getElementById('ytOrder').value; // 'asc' or 'desc'

    if (!playlistUrl) {
      showStatus(&quot;Please enter a YouTube Playlist URL.&quot;, &quot;error&quot;);
      return;
    }

    const match = playlistUrl.match(/[&amp;?]list=([^&amp;]+)/);
    if (!match) {
      showStatus(&quot;Invalid YouTube Playlist URL format.&quot;, &quot;error&quot;);
      return;
    }

    const playlistId = match[1];
    const docId = slugify(titleName);
    const seasonNum = parseSeasonNum(rawSeason);
    const seasonKey = `Season ${seasonNum}`;
    const targetCollection = currentType;

    showStatus(&quot;Checking existing episodes in Firestore first...&quot;, &quot;warning&quot;);

    let existingStreams = new Set();
    if (docId &amp;&amp; seasonKey) {
      try {
        const docSnap = await getDoc(doc(db, targetCollection, docId));
        if (docSnap.exists()) {
          const docData = docSnap.data();
          Object.keys(docData).forEach(key =&gt; {
            if (Array.isArray(docData[key])) {
              docData[key].forEach(ep =&gt; {
                if (ep.Stream) existingStreams.add(ep.Stream.trim().toLowerCase());
              });
            }
          });
        }
      } catch (err) {
        console.warn(&quot;Couldn't pre-check existing show episodes:&quot;, err);
      }
    }

    showStatus(&quot;Fetching playlist items from YouTube using Direct Key...&quot;, &quot;warning&quot;);

    let newEpisodesToProcess = [];
    let nextPageToken = '';
    let skippedCount = 0;

    try {
      do {
        const pageParam = nextPageToken ? `&amp;pageToken=${nextPageToken}` : '';
        const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&amp;maxResults=50&amp;playlistId=${playlistId}&amp;key=${youtubeApiKey}${pageParam}`);
        const data = await res.json();

        if (data.error) throw new Error(data.error.message);

        data.items.forEach(item =&gt; {
          const videoUrl = `https://www.youtube.com/watch?v=${item.snippet.resourceId.videoId}`;
          
          if (existingStreams.has(videoUrl.toLowerCase())) {
            skippedCount++;
          } else {
            newEpisodesToProcess.push({
              title: item.snippet.title,
              stream: videoUrl
            });
          }
        });

        nextPageToken = data.nextPageToken || '';
      } while (nextPageToken);

      if (newEpisodesToProcess.length === 0) {
        showStatus(`All ${skippedCount} episode(s) from this playlist are ALREADY imported!`, &quot;success&quot;);
        return;
      }

      // Apply Sorting Order
      if (sortOrder === 'desc') {
        newEpisodesToProcess.reverse();
      }

      showStatus(`Found ${newEpisodesToProcess.length} NEW episodes (${skippedCount} existing skipped). AI cleaning titles...`, &quot;warning&quot;);

      // Batch Process new titles only
      const BATCH_SIZE = 20;
      for (let i = 0; i &lt; newEpisodesToProcess.length; i += BATCH_SIZE) {
        const currentBatch = newEpisodesToProcess.slice(i, i + BATCH_SIZE);
        const batchTitles = currentBatch.map(item =&gt; item.title);

        showStatus(`AI cleaning titles ${i + 1} to ${Math.min(i + BATCH_SIZE, newEpisodesToProcess.length)} of ${newEpisodesToProcess.length}...`, &quot;warning&quot;);

        const cleanedTitles = await cleanTitlesInBatchWithGroq(batchTitles);

        currentBatch.forEach((ep, index) =&gt; {
          const finalTitle = cleanedTitles[index] || ep.title;
          addEpisodeRow(finalTitle, ep.stream);
        });

        if (i + BATCH_SIZE &lt; newEpisodesToProcess.length) {
          showStatus(`[Rate Limit Protection] Waiting 10 seconds before processing next batch... (${i + BATCH_SIZE}/${newEpisodesToProcess.length} complete)`, &quot;warning&quot;);
          await delay(10000);
        }
      }

      showStatus(`Imported ${newEpisodesToProcess.length} new episode(s) successfully! (${skippedCount} duplicates skipped)`, &quot;success&quot;);

    } catch (err) {
      console.error(err);
      showStatus(&quot;Failed to process YouTube Playlist: &quot; + err.message, &quot;error&quot;);
    }
  };

  // Save Record into Firestore with Smart Merging + Auto 50-Episode Season Splitter
  window.saveToFirestore = async function(e) {
    e.preventDefault();

    const titleName = document.getElementById('titleName').value;
    const docId = slugify(titleName);

    if (!docId) {
      showStatus(&quot;Please provide a valid Title Name.&quot;, &quot;error&quot;);
      return;
    }

    const studio = document.getElementById('studio').value;
    const banner = document.getElementById('bannerUrl').value;
    const poster = document.getElementById('posterUrl').value;
    const logo = document.getElementById('logoUrl').value;
    const ageRating = document.getElementById('ageRating').value;
    const blueTag = document.getElementById('blueTag').value;
    const language = document.getElementById('language').value;
    const tags = document.getElementById('tags').value;
    const description = document.getElementById('description').value;

    showStatus(&quot;Saving to Firestore database...&quot;, &quot;warning&quot;);

    try {
      if (currentType === 'Movies') {
        const movieData = {
          Name: titleName,
          Banner: banner,
          Poster: poster,
          Logo: logo,
          Studio: studio,
          AgeRating: ageRating,
          BlueTag: blueTag,
          Language: language,
          Tags: tags,
          Description: description,
          Skipper: [
            {
              &quot;Skip Intro&quot;: document.getElementById('skipIntro').value || &quot;&quot;,
              &quot;Stream&quot;: document.getElementById('movieStream').value,
              &quot;Studio&quot;: studio
            }
          ]
        };

        await setDoc(doc(db, &quot;Movies&quot;, docId), movieData, { merge: true });
        showStatus(`Movie saved successfully! Document ID: &quot;${docId}&quot;`, &quot;success&quot;);
      } else {
        // SHOWS &amp; TV SHOWS SAVING LOGIC (With 50-Episode Auto-Season Splitting)
        const rawSeason = document.getElementById('seasonNumber').value;
        let startSeasonNum = parseSeasonNum(rawSeason);

        const epNames = document.querySelectorAll('.ep-name');
        const epStreams = document.querySelectorAll('.ep-stream');

        const submittedEpisodes = [];
        epNames.forEach((el, index) =&gt; {
          submittedEpisodes.push({
            Name: el.value,
            Stream: epStreams[index].value
          });
        });

        // 1. Fetch existing show document
        const targetCollection = currentType; // 'Shows' or 'TV Shows'
        const showRef = doc(db, targetCollection, docId);
        const docSnap = await getDoc(showRef);
        let existingShowData = docSnap.exists() ? docSnap.data() : {};

        // 2. Partition submitted episodes into 50-episode seasons
        const MAX_PER_SEASON = 50;
        let seasonsToSave = {};
        let currentSeasonNum = startSeasonNum;

        for (let i = 0; i &lt; submittedEpisodes.length; i += MAX_PER_SEASON) {
          const chunk = submittedEpisodes.slice(i, i + MAX_PER_SEASON);
          const seasonKey = `Season ${currentSeasonNum}`;
          
          let existingSeasonEps = existingShowData[seasonKey] || [];
          let mergedChunk = [...existingSeasonEps];

          chunk.forEach(newEp =&gt; {
            const exists = mergedChunk.some(
              e =&gt; e.Stream &amp;&amp; e.Stream.trim().toLowerCase() === newEp.Stream.trim().toLowerCase()
            );
            if (!exists) {
              mergedChunk.push(newEp);
            }
          });

          seasonsToSave[seasonKey] = mergedChunk;
          currentSeasonNum++;
        }

        // 3. Construct Final Document preserving older seasons
        const showData = {
          ...existingShowData,
          Name: titleName,
          Studio: studio || existingShowData.Studio || &quot;&quot;,
          Banner: banner || existingShowData.Banner || &quot;&quot;,
          Poster: poster || existingShowData.Poster || &quot;&quot;,
          Logo: logo || existingShowData.Logo || &quot;&quot;,
          AgeRating: ageRating || existingShowData.AgeRating || &quot;&quot;,
          BlueTag: blueTag || existingShowData.BlueTag || &quot;&quot;,
          Language: language || existingShowData.Language || &quot;&quot;,
          Tags: tags || existingShowData.Tags || &quot;&quot;,
          Description: description || existingShowData.Description || &quot;&quot;,
          ...seasonsToSave
        };

        await setDoc(showRef, showData, { merge: true });

        const createdSeasonsList = Object.keys(seasonsToSave).join(&quot;, &quot;);
        showStatus(`Saved successfully in &quot;${targetCollection}&quot;! Updated: ${createdSeasonsList} (${submittedEpisodes.length} total episodes processed).`, &quot;success&quot;);
      }
    } catch (err) {
      console.error(err);
      showStatus(&quot;Firestore Save Error: &quot; + err.message, &quot;error&quot;);
    }
  };

  function showStatus(msg, type) {
    const el = document.getElementById('statusMsg');
    el.innerText = msg;
    el.className = `status-msg ${type}`;
    el.style.display = 'block';
  }
