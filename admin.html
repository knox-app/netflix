<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internal Systems - Content Management</title>
  <!-- Google Fonts & FontAwesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --border-color: #2e2e2e;
      --accent-color: #f58220; /* Firebase Orange */
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --input-bg: #2a2a2a;
      --button-hover: #e07116;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* Password Lock Screen Overlay */
    #lockScreen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 18, 18, 0.95);
      backdrop-filter: blur(8px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .lock-box {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      text-align: center;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .lock-box i { font-size: 40px; color: var(--accent-color); margin-bottom: 15px; }
    .lock-box h2 { font-size: 20px; margin-bottom: 15px; }

    .container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
    }

    /* Tab Switcher */
    .type-selector {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
      background: var(--input-bg);
      padding: 5px;
      border-radius: 8px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.3s;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #fff;
    }

    /* Form Styles */
    .form-group { margin-bottom: 15px; }
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 5px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent-color); }

    button.btn {
      padding: 10px 18px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    button.btn:hover { background: var(--button-hover); }
    .btn-ai { background: #6366f1; }
    .btn-ai:hover { background: #4f46e5; }
    .btn-secondary { background: #374151; }
    .btn-secondary:hover { background: #4b5563; }

    .ai-bar { display: flex; gap: 10px; align-items: flex-end; }

    /* Episode List Styling */
    .episodes-section {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }

    .episode-card {
      background: #141414;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      border: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .yt-box {
      background: #181818;
      padding: 15px;
      border-radius: 6px;
      border: 1px dashed var(--accent-color);
      margin-bottom: 20px;
    }

    .status-msg {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    .status-msg.success { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    .status-msg.error { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }
    .status-msg.warning { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- Password Protection Screen -->
<div id="lockScreen">
  <div class="lock-box">
    <i class="fa-solid fa-shield-halved"></i>
    <h2>Protected Access</h2>
    <div class="form-group">
      <input type="password" id="accessPass" placeholder="Enter Security PIN" style="text-align: center; font-size: 18px; letter-spacing: 4px;">
    </div>
    <button type="button" class="btn" onclick="verifyPassword()" style="width: 100%; justify-content: center;">Unlock Panel</button>
    <p id="passError" style="color: #ef4444; font-size: 12px; margin-top: 10px; display: none;">Invalid PIN! Access Denied.</p>
  </div>
</div>

<!-- Main Web Application -->
<div class="container">
  <h1><i class="fa-solid fa-database"></i> Firestore Content Manager</h1>

  <!-- Media Type Switcher -->
  <div class="type-selector">
    <button class="tab-btn active" id="tabMovies" onclick="switchType('Movies')"><i class="fa-solid fa-film"></i> Movie</button>
    <button class="tab-btn" id="tabShows" onclick="switchType('Shows')"><i class="fa-solid fa-tv"></i> Show / Series</button>
  </div>

  <form id="mediaForm" onsubmit="saveToFirestore(event)">
    
    <!-- Title & Groq Auto Fill Section -->
    <div class="form-group">
      <label>Title Name *</label>
      <div class="ai-bar">
        <input type="text" id="titleName" placeholder="e.g., Doraemon" required>
        <button type="button" class="btn btn-ai" onclick="autoFillWithGroq()"><i class="fa-solid fa-wand-magic-sparkles"></i> Auto-Fill (Groq AI)</button>
      </div>
    </div>

    <!-- General Metadata -->
    <div class="form-row">
      <div class="form-group">
        <label>Partner / Studio</label>
        <input type="text" id="studio" placeholder="e.g., Disney India">
      </div>
      <div class="form-group">
        <label>Language</label>
        <input type="text" id="language" placeholder="e.g., Hindi, English">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Age Rating</label>
        <input type="text" id="ageRating" placeholder="e.g., U/A 13+">
      </div>
      <div class="form-group">
        <label>Blue Tag / Category</label>
        <input type="text" id="blueTag" placeholder="e.g., HD, Exclusive, Show">
      </div>
    </div>

    <div class="form-group">
      <label>Tags (Comma Separated)</label>
      <input type="text" id="tags" placeholder="Anime, Adventure, Sci-Fi">
    </div>

    <div class="form-group">
      <label>Description</label>
      <textarea id="description" rows="3" placeholder="Brief summary..."></textarea>
    </div>

    <!-- Image URLs -->
    <div class="form-row">
      <div class="form-group">
        <label>Poster Image URL</label>
        <input type="url" id="posterUrl" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Logo Image URL</label>
        <input type="url" id="logoUrl" placeholder="https://...">
      </div>
    </div>

    <div class="form-group">
      <label>Banner Image URL</label>
      <input type="url" id="bannerUrl" placeholder="https://...">
    </div>

    <!-- MOVIE SPECIFIC FIELDS -->
    <div id="movieFields">
      <div class="form-group">
        <label>Stream URL *</label>
        <input type="url" id="movieStream" placeholder="https://...">
      </div>
      <div class="form-group">
        <label>Skip Intro Time (Optional)</label>
        <input type="text" id="skipIntro" placeholder="e.g., 2:06-3:22">
      </div>
    </div>

    <!-- SHOW SPECIFIC FIELDS -->
    <div id="showFields" class="hidden">
      <div class="form-group">
        <label>Season Name/Number * (e.g. 5 or Season 5)</label>
        <div class="ai-bar">
          <input type="text" id="seasonNumber" placeholder="e.g., 5 or Season 22">
          <button type="button" class="btn btn-secondary" onclick="loadExistingSeasonEpisodes()"><i class="fa-solid fa-arrows-rotate"></i> Load Existing Episodes</button>
        </div>
      </div>

      <!-- YouTube Import Feature -->
      <div class="yt-box">
        <label><i class="fa-brands fa-youtube" style="color: red;"></i> Import Episodes via YouTube Playlist</label>
        <div class="ai-bar" style="margin-top: 5px;">
          <input type="url" id="ytPlaylistUrl" placeholder="https://www.youtube.com/playlist?list=PL...">
          <button type="button" class="btn btn-secondary" onclick="fetchYTPlaylist()"><i class="fa-solid fa-download"></i> Fetch & Sync New Episodes</button>
        </div>
      </div>

      <!-- Manual Episodes Creator -->
      <div class="episodes-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <label style="margin:0;">Episodes List</label>
          <button type="button" class="btn btn-secondary" style="padding: 5px 10px; font-size:12px;" onclick="addEpisodeRow()"><i class="fa-solid fa-plus"></i> Add Episode</button>
        </div>
        <div id="episodesContainer"></div>
      </div>
    </div>

    <br>
    <button type="submit" class="btn" style="width: 100%; justify-content: center; padding: 12px;"><i class="fa-solid fa-cloud-arrow-up"></i> Save / Update Firestore Database</button>
  </form>

  <div id="statusMsg" class="status-msg"></div>
</div>

<!-- Firebase & Main Script -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Your Firebase Configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728",
    storageBucket: "internal-systems-46728.firebasestorage.app",
    messagingSenderId: "172177452674",
    appId: "1:172177452674:web:155a2417da5531dd7ece9b",
    measurementId: "G-Y87B8VRQ1N"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentType = 'Movies';
  let groqApiKey = '';
  let youtubeApiKey = '';

  // Password Unlock Check
  window.verifyPassword = function() {
    const input = document.getElementById('accessPass').value;
    if (input === "000000") {
      document.getElementById('lockScreen').style.display = 'none';
      sessionStorage.setItem('authenticated', 'true');
    } else {
      document.getElementById('passError').style.display = 'block';
    }
  };

  if (sessionStorage.getItem('authenticated') === 'true') {
    document.getElementById('lockScreen').style.display = 'none';
  }

  // Load Groq & YouTube API Keys from Firestore
  async function loadApiKeys() {
    try {
      const groqSnap = await getDoc(doc(db, "Src_keys", "gorq"));
      if (groqSnap.exists()) groqApiKey = groqSnap.data().Key;

      const ytSnap = await getDoc(doc(db, "Src_keys", "youtube-v3-data"));
      if (ytSnap.exists()) youtubeApiKey = ytSnap.data().Key;

      console.log("API Keys fetched from Firestore successfully.");
    } catch (err) {
      console.error("Error fetching API keys:", err);
    }
  }
  loadApiKeys();

  // Helper: Title Slugifier
  function slugify(text) {
    return text.toString().toLowerCase()
      .trim()
      .replace(/\s+/g, '-')
      .replace(/[^\w\-]+/g, '')
      .replace(/\-\-+/g, '-')
      .replace(/^-+/, '')
      .replace(/-+$/, '');
  }

  // Helper: Standardize Season Name Format ("5" -> "Season 5")
  function formatSeasonKey(input) {
    if (!input) return "";
    input = input.trim();
    if (/^\d+$/.test(input)) {
      return `Season ${parseInt(input, 10)}`;
    }
    return input;
  }

  // Switch Tabs
  window.switchType = function(type) {
    currentType = type;
    document.getElementById('tabMovies').classList.toggle('active', type === 'Movies');
    document.getElementById('tabShows').classList.toggle('active', type === 'Shows');
    
    document.getElementById('movieFields').classList.toggle('hidden', type !== 'Movies');
    document.getElementById('showFields').classList.toggle('hidden', type !== 'Shows');

    document.getElementById('movieStream').required = (type === 'Movies');
    document.getElementById('seasonNumber').required = (type === 'Shows');
  };

  // Add Episode Row to Form UI
  window.addEpisodeRow = function(name = '', stream = '') {
    const container = document.getElementById('episodesContainer');
    const div = document.createElement('div');
    div.className = 'episode-card';
    div.innerHTML = `
      <input type="text" placeholder="Episode Title" class="ep-name" value="${name}" required style="flex:2;">
      <input type="url" placeholder="Stream URL" class="ep-stream" value="${stream}" required style="flex:3;">
      <button type="button" class="btn btn-secondary" onclick="this.parentElement.remove()" style="background:#ef4444;"><i class="fa-solid fa-trash"></i></button>
    `;
    container.appendChild(div);
  };
  addEpisodeRow();

  // Load Existing Episodes from Firestore for the Selected Season
  window.loadExistingSeasonEpisodes = async function() {
    const titleName = document.getElementById('titleName').value;
    const rawSeason = document.getElementById('seasonNumber').value;
    
    if (!titleName || !rawSeason) {
      showStatus("Please enter both Title Name and Season Number first.", "error");
      return;
    }

    const docId = slugify(titleName);
    const seasonKey = formatSeasonKey(rawSeason);

    showStatus(`Checking Firestore for existing episodes in ${seasonKey}...`, "warning");

    try {
      const showDoc = await getDoc(doc(db, "Shows", docId));
      if (!showDoc.exists()) {
        showStatus(`No existing show found with ID "${docId}". Starting fresh.`, "warning");
        return;
      }

      const showData = showDoc.data();
      const existingEps = showData[seasonKey] || [];

      if (existingEps.length === 0) {
        showStatus(`No episodes currently saved in "${seasonKey}". Ready to add new ones.`, "warning");
        return;
      }

      // Populate UI with existing episodes
      document.getElementById('episodesContainer').innerHTML = '';
      existingEps.forEach(ep => addEpisodeRow(ep.Name, ep.Stream));

      showStatus(`Loaded ${existingEps.length} existing episode(s) from "${seasonKey}".`, "success");
    } catch (err) {
      console.error(err);
      showStatus("Error loading existing season data: " + err.message, "error");
    }
  };

  // Groq AI Auto-Fill Metadata
  window.autoFillWithGroq = async function() {
    const title = document.getElementById('titleName').value;
    if (!title) {
      showStatus("Please enter a Title Name first!", "error");
      return;
    }

    if (!groqApiKey) {
      showStatus("Groq API key not loaded. Check Firestore connection.", "error");
      return;
    }

    showStatus("Fetching metadata using Groq AI...", "warning");

    const prompt = `Return ONLY a valid JSON object (no markdown formatting or code blocks) for the ${currentType.slice(0, -1)} titled "${title}" with exact fields:
    {
      "Studio": "Studio or Network Name",
      "Language": "Languages e.g., Hindi, English",
      "AgeRating": "Age Rating e.g., U/A 13+",
      "BlueTag": "Category tag",
      "Tags": "Comma separated tags",
      "Description": "2-3 sentences description",
      "Banner": "Banner image URL or empty string",
      "Poster": "Poster image URL or empty string",
      "Logo": "Logo image URL or empty string"
    }`;

    try {
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${groqApiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: [{ role: "user", content: prompt }],
          model: "llama-3.3-70b-versatile",
          temperature: 0.3
        })
      });

      const data = await response.json();
      let rawText = data.choices[0].message.content.trim().replace(/```json/g, "").replace(/```/g, "").trim();
      const aiData = JSON.parse(rawText);

      if (aiData.Studio) document.getElementById('studio').value = aiData.Studio;
      if (aiData.Language) document.getElementById('language').value = aiData.Language;
      if (aiData.AgeRating) document.getElementById('ageRating').value = aiData.AgeRating;
      if (aiData.BlueTag) document.getElementById('blueTag').value = aiData.BlueTag;
      if (aiData.Tags) document.getElementById('tags').value = aiData.Tags;
      if (aiData.Description) document.getElementById('description').value = aiData.Description;
      if (aiData.Banner) document.getElementById('bannerUrl').value = aiData.Banner;
      if (aiData.Poster) document.getElementById('posterUrl').value = aiData.Poster;
      if (aiData.Logo) document.getElementById('logoUrl').value = aiData.Logo;

      showStatus("Metadata filled successfully via Groq AI!", "success");
    } catch (err) {
      console.error(err);
      showStatus("Error generating AI metadata. Try again.", "error");
    }
  };

  const delay = ms => new Promise(res => setTimeout(res, ms));

  // Batch process episode titles with Groq AI
  async function cleanTitlesInBatchWithGroq(titlesList) {
    const prompt = `You are an episode title cleaner. Clean the following list of video titles by removing show names, hashtags (#), channel handles (@), 'Episode 01', 'Ep 1', and extra symbol clutter. Keep only the core clean episode name.
    
    Input JSON array: ${JSON.stringify(titlesList)}
    
    Return ONLY a valid JSON array of strings in the exact same order with no extra text or markdown code blocks.`;

    try {
      const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Authorization": `Bearer ${groqApiKey}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: [{ role: "user", content: prompt }],
          model: "llama-3.3-70b-versatile",
          temperature: 0.1
        })
      });

      const data = await response.json();
      let rawText = data.choices[0].message.content.trim().replace(/```json/g, "").replace(/```/g, "").trim();
      return JSON.parse(rawText);
    } catch (e) {
      console.warn("AI title cleaning failed for batch, using raw titles:", e);
      return titlesList;
    }
  }

  // Fetch YouTube Playlist with Smart Duplicate Skipping
  window.fetchYTPlaylist = async function() {
    const playlistUrl = document.getElementById('ytPlaylistUrl').value;
    const titleName = document.getElementById('titleName').value;
    const rawSeason = document.getElementById('seasonNumber').value;

    if (!playlistUrl) {
      showStatus("Please enter a YouTube Playlist URL.", "error");
      return;
    }

    if (!youtubeApiKey) {
      showStatus("YouTube API Key not loaded from Firestore.", "error");
      return;
    }

    const match = playlistUrl.match(/[&?]list=([^&]+)/);
    if (!match) {
      showStatus("Invalid YouTube Playlist URL format.", "error");
      return;
    }

    const playlistId = match[1];
    const docId = slugify(titleName);
    const seasonKey = formatSeasonKey(rawSeason);

    showStatus("Checking existing episodes in Firestore first...", "warning");

    // Fetch existing episodes from Firestore to avoid duplicate imports
    let existingStreams = new Set();
    if (docId && seasonKey) {
      try {
        const docSnap = await getDoc(doc(db, "Shows", docId));
        if (docSnap.exists() && docSnap.data()[seasonKey]) {
          const existingEps = docSnap.data()[seasonKey];
          existingEps.forEach(ep => {
            if (ep.Stream) existingStreams.add(ep.Stream.trim().toLowerCase());
          });

          // Also load existing episodes into UI
          document.getElementById('episodesContainer').innerHTML = '';
          existingEps.forEach(ep => addEpisodeRow(ep.Name, ep.Stream));
        }
      } catch (err) {
        console.warn("Couldn't pre-check existing show episodes:", err);
      }
    }

    showStatus("Fetching playlist items from YouTube...", "warning");

    let newEpisodesToProcess = [];
    let nextPageToken = '';
    let skippedCount = 0;

    try {
      do {
        const pageParam = nextPageToken ? `&pageToken=${nextPageToken}` : '';
        const res = await fetch(`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${playlistId}&key=${youtubeApiKey}${pageParam}`);
        const data = await res.json();

        if (data.error) throw new Error(data.error.message);

        data.items.forEach(item => {
          const videoUrl = `https://www.youtube.com/watch?v=${item.snippet.resourceId.videoId}`;
          
          // Skip if video URL is already saved in database
          if (existingStreams.has(videoUrl.toLowerCase())) {
            skippedCount++;
          } else {
            newEpisodesToProcess.push({
              title: item.snippet.title,
              stream: videoUrl
            });
          }
        });

        nextPageToken = data.nextPageToken || '';
      } while (nextPageToken);

      if (newEpisodesToProcess.length === 0) {
        showStatus(`All ${skippedCount} episode(s) from this playlist are ALREADY imported!`, "success");
        return;
      }

      showStatus(`Found ${newEpisodesToProcess.length} NEW episodes (${skippedCount} already exist). Processing titles with Groq AI...`, "warning");

      // Batch Process new titles only
      const BATCH_SIZE = 20;
      for (let i = 0; i < newEpisodesToProcess.length; i += BATCH_SIZE) {
        const currentBatch = newEpisodesToProcess.slice(i, i + BATCH_SIZE);
        const batchTitles = currentBatch.map(item => item.title);

        showStatus(`AI cleaning titles ${i + 1} to ${Math.min(i + BATCH_SIZE, newEpisodesToProcess.length)} of ${newEpisodesToProcess.length}...`, "warning");

        const cleanedTitles = await cleanTitlesInBatchWithGroq(batchTitles);

        currentBatch.forEach((ep, index) => {
          const finalTitle = cleanedTitles[index] || ep.title;
          addEpisodeRow(finalTitle, ep.stream);
        });

        if (i + BATCH_SIZE < newEpisodesToProcess.length) {
          showStatus(`[Rate Limit Protection] Waiting 10 seconds before processing next batch... (${i + BATCH_SIZE}/${newEpisodesToProcess.length} complete)`, "warning");
          await delay(10000);
        }
      }

      showStatus(`Imported ${newEpisodesToProcess.length} new episode(s) successfully! (${skippedCount} duplicates skipped)`, "success");

    } catch (err) {
      console.error(err);
      showStatus("Failed to process YouTube Playlist: " + err.message, "error");
    }
  };

  // Save Record into Firestore with Smart Merging
  window.saveToFirestore = async function(e) {
    e.preventDefault();

    const titleName = document.getElementById('titleName').value;
    const docId = slugify(titleName);

    if (!docId) {
      showStatus("Please provide a valid Title Name.", "error");
      return;
    }

    const studio = document.getElementById('studio').value;
    const banner = document.getElementById('bannerUrl').value;
    const poster = document.getElementById('posterUrl').value;
    const logo = document.getElementById('logoUrl').value;
    const ageRating = document.getElementById('ageRating').value;
    const blueTag = document.getElementById('blueTag').value;
    const language = document.getElementById('language').value;
    const tags = document.getElementById('tags').value;
    const description = document.getElementById('description').value;

    showStatus("Saving to Firestore database...", "warning");

    try {
      if (currentType === 'Movies') {
        const movieData = {
          Name: titleName,
          Banner: banner,
          Poster: poster,
          Logo: logo,
          Studio: studio,
          AgeRating: ageRating,
          BlueTag: blueTag,
          Language: language,
          Tags: tags,
          Description: description,
          Skipper: [
            {
              "Skip Intro": document.getElementById('skipIntro').value || "",
              "Stream": document.getElementById('movieStream').value,
              "Studio": studio
            }
          ]
        };

        await setDoc(doc(db, "Movies", docId), movieData, { merge: true });
        showStatus(`Movie saved successfully! Document ID: "${docId}"`, "success");
      } else {
        // SHOW SAVING & MERGING LOGIC
        const rawSeason = document.getElementById('seasonNumber').value;
        const seasonKey = formatSeasonKey(rawSeason);

        const epNames = document.querySelectorAll('.ep-name');
        const epStreams = document.querySelectorAll('.ep-stream');

        const submittedEpisodes = [];
        epNames.forEach((el, index) => {
          submittedEpisodes.push({
            Name: el.value,
            Stream: epStreams[index].value
          });
        });

        // 1. Fetch existing show document if available
        const showRef = doc(db, "Shows", docId);
        const docSnap = await getDoc(showRef);
        let existingShowData = docSnap.exists() ? docSnap.data() : {};

        // 2. Fetch existing episodes in this season
        let existingSeasonEpisodes = existingShowData[seasonKey] || [];

        // 3. Merge without duplicating streams
        const finalMergedEpisodes = [...existingSeasonEpisodes];

        submittedEpisodes.forEach(newEp => {
          const exists = finalMergedEpisodes.some(
            existingEp => existingEp.Stream && existingEp.Stream.trim().toLowerCase() === newEp.Stream.trim().toLowerCase()
          );
          if (!exists) {
            finalMergedEpisodes.push(newEp);
          } else {
            // Update name if stream matches existing
            const idx = finalMergedEpisodes.findIndex(e => e.Stream.trim().toLowerCase() === newEp.Stream.trim().toLowerCase());
            if (idx !== -1) finalMergedEpisodes[idx].Name = newEp.Name;
          }
        });

        // 4. Construct complete document preserving ALL previous seasons
        const showData = {
          ...existingShowData,
          Name: titleName,
          Studio: studio || existingShowData.Studio || "",
          Banner: banner || existingShowData.Banner || "",
          Poster: poster || existingShowData.Poster || "",
          Logo: logo || existingShowData.Logo || "",
          AgeRating: ageRating || existingShowData.AgeRating || "",
          BlueTag: blueTag || existingShowData.BlueTag || "",
          Language: language || existingShowData.Language || "",
          Tags: tags || existingShowData.Tags || "",
          Description: description || existingShowData.Description || "",
          [seasonKey]: finalMergedEpisodes // Updated/merged season
        };

        await setDoc(showRef, showData, { merge: true });
        showStatus(`Successfully saved "${seasonKey}" in Show "${docId}"! Total episodes in ${seasonKey}: ${finalMergedEpisodes.length}`, "success");
      }
    } catch (err) {
      console.error(err);
      showStatus("Firestore Save Error: " + err.message, "error");
    }
  };

  function showStatus(msg, type) {
    const el = document.getElementById('statusMsg');
    el.innerText = msg;
    el.className = `status-msg ${type}`;
    el.style.display = 'block';
  }
</script>

</body>
</html>
