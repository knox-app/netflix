<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Hub</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg-dark: #0f1017;
      --card-bg: #1a1c29;
      --accent-blue: #0072d2;
      --text-main: #f9f9f9;
      --text-muted: #8c93a8;
      --aspect-ratio: 16 / 9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ================= HERO HEADER ================= */
    .hero-banner-container {
      position: relative;
      width: 100vw;
      height: 75vh;
      min-height: 480px;
      max-height: 720px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
    }

    .hero-banner-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
    }

    .hero-banner-img.loaded {
      opacity: 1;
    }

    .hero-banner-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        180deg, 
        rgba(15, 16, 23, 0.1) 0%, 
        rgba(15, 16, 23, 0.3) 40%, 
        rgba(15, 16, 23, 0.75) 75%, 
        rgba(15, 16, 23, 0.98) 95%, 
        var(--bg-dark) 100%
      );
    }

    .hero-logo {
      position: relative;
      z-index: 3;
      max-width: 500px;
      max-height: 220px;
      width: 50vw;
      margin-top: -60px;
      object-fit: contain;
      filter: drop-shadow(0 12px 25px rgba(0, 0, 0, 0.85));
      animation: heroFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-title-fallback {
      position: relative;
      z-index: 3;
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 8px 30px rgba(0,0,0,0.9);
      margin-top: -60px;
      animation: heroFadeIn 0.8s ease-out;
    }

    @keyframes heroFadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ================= MAIN CONTAINER ================= */
    .main-content {
      position: relative;
      z-index: 4;
      padding: 0 4vw 60px 4vw;
      margin-top: -120px;
    }

    /* ================= SUB-STUDIOS GRID ================= */
    .sub-studios-section {
      margin-bottom: 42px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #e4e7eb;
      margin-bottom: 14px;
      letter-spacing: 0.2px;
    }

    .sub-studio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 16px;
    }

    .studio-tile {
      aspect-ratio: var(--aspect-ratio);
      background: linear-gradient(145deg, #1e2130, #131520);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .studio-tile:hover {
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.7);
    }

    .studio-tile-text {
      color: #fff;
      font-weight: 700;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    /* ================= CONTENT ROWS & CAROUSEL ================= */
    .content-row {
      margin-bottom: 38px;
      position: relative;
    }

    .carousel-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .scroll-container {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 12px 4px;
      scrollbar-width: none;
      width: 100%;
    }

    .scroll-container::-webkit-scrollbar {
      display: none;
    }

    /* Carousel Nav Arrows */
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: calc(100% - 24px);
      background: rgba(15, 16, 23, 0.75);
      backdrop-filter: blur(4px);
      border: none;
      color: #fff;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 12;
      opacity: 0;
      transition: opacity 0.25s ease, background 0.2s ease;
      border-radius: 6px;
    }

    .carousel-wrapper:hover .carousel-arrow {
      opacity: 1;
    }

    .carousel-arrow:hover {
      background: rgba(0, 114, 210, 0.85);
    }

    .carousel-arrow.left { left: 0; }
    .carousel-arrow.right { right: 0; }

    /* ================= 16:9 CONTENT CARDS ================= */
    .content-card {
      flex: 0 0 calc(20% - 12px);
      min-width: 210px;
      aspect-ratio: var(--aspect-ratio);
      background-color: var(--card-bg);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.5);
      transition: transform 0.25s cubic-bezier(0.2, 0, 0.1, 1), border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .content-card:hover {
      transform: scale(1.06);
      border-color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.9);
      z-index: 10;
    }

    .content-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s ease;
    }

    .card-info-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(0,0,0,0.85) 0%, transparent 60%);
      opacity: 0;
      display: flex;
      align-items: flex-end;
      padding: 10px;
      transition: opacity 0.25s ease;
    }

    .content-card:hover .card-info-overlay {
      opacity: 1;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      text-align: center;
      padding: 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
      background: linear-gradient(135deg, #1b1d2a, #11131c);
      font-weight: 600;
      text-transform: capitalize;
    }

    /* ================= SKELETON SHIMMER ================= */
    .skeleton-box {
      background: linear-gradient(90deg, #161824 25%, #222638 50%, #161824 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 1024px) {
      .content-card { flex: 0 0 calc(28% - 10px); min-width: 190px; }
      .main-content { margin-top: -100px; }
    }

    @media (max-width: 768px) {
      .hero-banner-container { height: 60vh; min-height: 400px; }
      .hero-logo { width: 70vw; max-height: 160px; margin-top: -80px; }
      .hero-title-fallback { font-size: 2.6rem; margin-top: -80px; }
      .main-content { margin-top: -140px; padding: 0 4vw 40px 4vw; }
      .content-card { flex: 0 0 55%; min-width: 165px; border-radius: 6px; }
      .carousel-arrow { display: none; }
    }

    @media (max-width: 480px) {
      .hero-banner-container { height: 55vh; min-height: 350px; }
      .content-card { flex: 0 0 70%; min-width: 150px; }
      .main-content { margin-top: -120px; }
    }
  </style>
</head>
<body>

  <!-- App Structure -->
  <div id="app">
    <!-- Top Hero Banner -->
    <header class="hero-banner-container" id="heroBannerContainer">
      <img id="heroBannerImg" class="hero-banner-img" src="" alt="Banner" />
      <div class="hero-banner-overlay"></div>
      <img id="heroLogo" class="hero-logo" src="" alt="Studio Logo" style="display: none;" />
      <h1 id="heroTitle" class="hero-title-fallback" style="display: none;"></h1>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Sub-Studios Row -->
      <section class="sub-studios-section" id="subStudioSection" style="display: none;">
        <h2 class="section-title">Studios</h2>
        <div class="sub-studio-grid" id="subStudioGrid"></div>
      </section>

      <!-- Dynamic Sorted Rows (S1., S2., S3...) -->
      <div id="sectionsContainer"></div>
    </main>
  </div>

  <script>
    // 1. Firebase Initialization
    const firebaseConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 2. Parse Query Params
    const urlParams = new URLSearchParams(window.location.search);
    const studioParam = urlParams.get('studio') || 'disney-plus';
    const subParam = urlParams.get('sub');
    const activeDocId = subParam || studioParam;

    const mediaCache = new Map();

    // 3. Parallel Batch Media Resolver
    async function fetchMediaDetails(id) {
      if (!id || typeof id !== 'string') return null;
      if (mediaCache.has(id)) return mediaCache.get(id);

      const lookups = [
        id,
        id.toLowerCase(),
        id.replace(/^doremon/i, 'doraemon'),
        id.replace(/^doraemon/i, 'doremon')
      ];

      for (const key of lookups) {
        try {
          // Check Movies
          let docSnap = await db.collection('Movies').doc(key).get();
          if (docSnap.exists) {
            const data = docSnap.data();
            mediaCache.set(id, data);
            return data;
          }
          // Check Shows
          docSnap = await db.collection('Shows').doc(key).get();
          if (docSnap.exists) {
            const data = docSnap.data();
            mediaCache.set(id, data);
            return data;
          }
        } catch (e) {
          console.warn(`Fetch error for ID: ${key}`, e);
        }
      }

      mediaCache.set(id, null);
      return null;
    }

    // 4. Real-Time Firestore Sync
    function initRealtimeListener() {
      let parentData = null;

      if (subParam && activeDocId !== studioParam) {
        db.collection('Partners').doc(studioParam).onSnapshot(snap => {
          parentData = snap.exists ? snap.data() : null;
        });
      }

      db.collection('Partners').doc(activeDocId).onSnapshot(async docSnap => {
        if (!docSnap.exists) {
          document.getElementById('sectionsContainer').innerHTML = `
            <div style="padding: 40px 0; text-align: center; color: var(--text-muted);">
              <h3>No Studio data found for "${activeDocId}"</h3>
            </div>
          `;
          return;
        }

        const data = docSnap.data();
        await renderPage(data, parentData);
      }, error => {
        console.error("Firestore Real-time Error:", error);
      });
    }

    // 5. Render Core UI
    async function renderPage(data, parentData) {
      // 1. Setup Hero Banner & Logo
      const bannerImg = document.getElementById('heroBannerImg');
      const heroLogo = document.getElementById('heroLogo');
      const heroTitle = document.getElementById('heroTitle');

      const bgUrl = data['Banner'] || data['Background.jpg'] || data['Background'] || data['Tile'] ||
                    (parentData && (parentData['Banner'] || parentData['Background.jpg'] || parentData['Background']));

      const logoUrl = data['Logo'] || data['Logo.png'] || 
                      (parentData && (parentData['Logo'] || parentData['Logo.png']));

      const studioName = data['Name'] || data['Title'] || activeDocId.replace(/-/g, ' ');

      if (bgUrl) {
        bannerImg.src = bgUrl;
        bannerImg.onload = () => bannerImg.classList.add('loaded');
        bannerImg.style.display = 'block';
      } else {
        bannerImg.style.display = 'none';
      }

      if (logoUrl) {
        heroLogo.src = logoUrl;
        heroLogo.style.display = 'block';
        heroTitle.style.display = 'none';
      } else {
        heroLogo.style.display = 'none';
        heroTitle.textContent = studioName;
        heroTitle.style.display = 'block';
      }

      // 2. Render Sub-Studio Grid
      if (!subParam && data['Sub-Studio'] && Array.isArray(data['Sub-Studio'])) {
        renderSubStudios(data['Sub-Studio']);
      } else {
        document.getElementById('subStudioSection').style.display = 'none';
      }

      // 3. Render S1., S2., S3... Rows
      await renderSections(data);
    }

    function renderSubStudios(subList) {
      const section = document.getElementById('subStudioSection');
      const grid = document.getElementById('subStudioGrid');
      grid.innerHTML = '';

      subList.forEach(sub => {
        const tile = document.createElement('a');
        tile.className = 'studio-tile';
        tile.href = `1.html?studio=${encodeURIComponent(studioParam)}&sub=${encodeURIComponent(sub)}`;
        tile.innerHTML = `<span class="studio-tile-text">${sub.replace(/-/g, ' ')}</span>`;
        grid.appendChild(tile);
      });

      section.style.display = 'block';
    }

    async function renderSections(data) {
      const container = document.getElementById('sectionsContainer');
      container.innerHTML = '';

      // Collect & Sort Sections
      const sections = [];
      Object.keys(data).forEach(key => {
        if (/^S\d+\./i.test(key.trim())) {
          sections.push({
            key: key,
            title: key.replace(/^S\d+\.\s*/i, ''),
            items: Array.isArray(data[key]) ? data[key] : Object.values(data[key] || {})
          });
        }
      });

      sections.sort((a, b) => {
        const numA = parseInt(a.key.match(/^S(\d+)\./i)?.[1] || 9999);
        const numB = parseInt(b.key.match(/^S(\d+)\./i)?.[1] || 9999);
        return numA - numB;
      });

      // Render each row
      for (const sec of sections) {
        const row = document.createElement('div');
        row.className = 'content-row';

        const rowTitle = document.createElement('h2');
        rowTitle.className = 'section-title';
        rowTitle.textContent = sec.title;
        row.appendChild(rowTitle);

        const carouselWrapper = document.createElement('div');
        carouselWrapper.className = 'carousel-wrapper';

        // Left Navigation Arrow
        const leftBtn = document.createElement('button');
        leftBtn.className = 'carousel-arrow left';
        leftBtn.innerHTML = '&#10094;';
        leftBtn.onclick = () => scrollRow(scrollContainer, -600);

        // Right Navigation Arrow
        const rightBtn = document.createElement('button');
        rightBtn.className = 'carousel-arrow right';
        rightBtn.innerHTML = '&#10095;';
        rightBtn.onclick = () => scrollRow(scrollContainer, 600);

        const scrollContainer = document.createElement('div');
        scrollContainer.className = 'scroll-container';

        // Batch load all media items in this section concurrently
        const mediaDetailsList = await Promise.all(sec.items.map(fetchMediaDetails));

        sec.items.forEach((item, idx) => {
          const card = document.createElement('div');
          card.className = 'content-card';

          if (typeof item === 'string' && (item.startsWith('http://') || item.startsWith('https://'))) {
            card.innerHTML = `
              <img src="${item}" alt="${sec.title}" loading="lazy" />
              <div class="card-info-overlay"><span class="card-title">${sec.title}</span></div>
            `;
          } else {
            const itemDoc = mediaDetailsList[idx];
            const posterImg = itemDoc ? (
              itemDoc.Banner || 
              itemDoc['Background.jpg'] || 
              itemDoc.Tile || 
              itemDoc.Thumbnail || 
              itemDoc?.['Multi-Language']?.Poster || 
              itemDoc.Poster || 
              itemDoc.Image
            ) : null;

            const displayName = itemDoc?.['Multi-Language']?.Name || itemDoc?.Name || itemDoc?.Title || item.replace(/-/g, ' ');

            if (posterImg) {
              card.innerHTML = `
                <img src="${posterImg}" alt="${displayName}" loading="lazy" />
                <div class="card-info-overlay"><span class="card-title">${displayName}</span></div>
              `;
            } else {
              card.innerHTML = `<div class="card-placeholder"><span>${displayName}</span></div>`;
            }
          }

          scrollContainer.appendChild(card);
        });

        carouselWrapper.appendChild(leftBtn);
        carouselWrapper.appendChild(scrollContainer);
        carouselWrapper.appendChild(rightBtn);

        row.appendChild(carouselWrapper);
        container.appendChild(row);
      }
    }

    function scrollRow(container, distance) {
      container.scrollBy({ left: distance, behavior: 'smooth' });
    }

    // Start App
    initRealtimeListener();
  </script>
</body>
</html>
