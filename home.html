<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTT Stream</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }
    body {
      background-color: #0f1014;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Top Navigation Header */
    .nav-header {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      z-index: 50;
      display: flex;
      align-items: center;
      padding: 0 32px;
      background: rgba(15, 16, 20, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .nav-title {
      font-size: 22px;
      font-weight: 800;
      color: #e50914;
      letter-spacing: 1px;
    }

    /* Hero Carousel */
    .hero-container {
      position: relative;
      width: 100%;
      height: 75vh;
      min-height: 480px;
      overflow: hidden;
      background-color: #16181f;
    }
    .hero-slider {
      display: flex;
      height: 100%;
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }
    .hero-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(15,16,20,0.95) 0%, rgba(15,16,20,0.6) 45%, rgba(15,16,20,0.1) 75%),
                  linear-gradient(0deg, rgba(15,16,20,1) 0%, rgba(15,16,20,0) 35%);
    }
    .hero-content {
      position: absolute;
      bottom: 10%;
      left: 32px;
      max-width: 600px;
      z-index: 5;
    }
    .hero-logo {
      max-width: 260px;
      max-height: 110px;
      object-fit: contain;
      margin-bottom: 12px;
      display: block;
    }
    .hero-title-fallback {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .hero-meta {
      font-size: 14px;
      color: #cfd3dc;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .hero-meta .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      color: #fff;
    }
    .hero-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn-watch-now {
      background: #e50914;
      color: #fff;
      border: none;
      padding: 12px 26px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-watch-now:hover {
      background: #f40612;
      transform: scale(1.03);
    }
    .btn-watchlist {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.6);
      background: rgba(20,20,20,0.6);
      color: #fff;
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    .btn-watchlist:hover {
      border-color: #fff;
      background: rgba(255,255,255,0.25);
      transform: scale(1.08);
    }
    .slider-indicators {
      position: absolute;
      bottom: 20px;
      right: 32px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: all 0.2s;
    }
    .indicator-dot.active {
      width: 22px;
      border-radius: 4px;
      background: #e50914;
    }

    /* Sections & Shelves */
    .sections-container {
      position: relative;
      margin-top: 20px;
      z-index: 10;
      padding-bottom: 60px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }
    .section-block {
      display: flex;
      flex-direction: column;
    }
    .section-header {
      padding: 0 32px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f0f6fc;
    }
    .shelf-wrapper {
      position: relative;
    }
    .shelf-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 10px 32px;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .shelf-scroll::-webkit-scrollbar {
      display: none;
    }
    .content-card {
      flex: 0 0 170px;
      aspect-ratio: 2 / 3;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: #1c2029;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .content-card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
      border-color: rgba(255,255,255,0.2);
    }
    .content-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .content-card .card-info {
      position: absolute;
      bottom: 0;
      inset-inline: 0;
      padding: 24px 10px 8px;
      background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .content-card .card-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.7);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }

    .loading-status {
      text-align: center;
      padding: 40px;
      color: #8b949e;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header class="nav-header">
    <div class="nav-title" id="page-nav-title">STREAM</div>
  </header>

  <!-- Swipeable Carousel -->
  <div class="hero-container" id="hero-container">
    <div class="hero-slider" id="hero-slider"></div>
    <div class="slider-indicators" id="slider-indicators"></div>
  </div>

  <!-- Dynamic Sections -->
  <main class="sections-container" id="sections-container">
    <div class="loading-status" id="loading-status">Loading page content...</div>
  </main>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentSlide = 0;
    let carouselItems = [];
    let carouselTimer = null;

    function getTargetPageId() {
      const hash = window.location.hash.replace('#', '').trim();
      return hash || 'demo';
    }

    window.addEventListener('hashchange', () => loadPage(getTargetPageId()));
    window.addEventListener('DOMContentLoaded', () => loadPage(getTargetPageId()));

    // Safe helper to extract properties regardless of key casing
    function getVal(obj, ...keys) {
      if (!obj) return undefined;
      for (const k of keys) {
        if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
      }
      return undefined;
    }

    async function loadPage(pageId) {
      const status = document.getElementById('loading-status');
      if (status) status.style.display = 'block';

      try {
        const pageDocSnap = await db.collection('Systems').doc(pageId).get();
        if (!pageDocSnap.exists) {
          if (status) status.textContent = `Page "${pageId}" not found in Systems collection.`;
          return;
        }

        const pageData = pageDocSnap.data();
        const pageTitle = getVal(pageData, 'Name', 'name') || pageId;
        document.getElementById('page-nav-title').textContent = pageTitle.toUpperCase();

        // 1. Setup Carousel
        await setupCarousel(pageData.Carsoule_Settings || {});

        // 2. Setup Sections
        await setupSections(pageData.Sections || []);

        if (status) status.style.display = 'none';
      } catch (err) {
        console.error("Error loading page:", err);
        if (status) status.textContent = `Error loading: ${err.message}`;
      }
    }

    /* CAROUSEL LOGIC */
    async function setupCarousel(settings = {}) {
      const contentFrom = getVal(settings, 'Content_From', 'content_from') || ['Movies', 'Shows'];
      const ageRating = getVal(settings, 'Age_Rating', 'age_rating');
      carouselItems = [];

      for (const collName of contentFrom) {
        try {
          const snap = await db.collection(collName).limit(10).get();
          snap.forEach(doc => {
            const data = doc.data();
            const itemAge = getVal(data, 'Age_Rating', 'Rating', 'age_rating', 'rating');
            
            // Filter by Age Rating if specified
            if (!ageRating || (itemAge && itemAge.toLowerCase() === ageRating.toLowerCase())) {
              carouselItems.push({ id: doc.id, _collection: collName, ...data });
            }
          });
        } catch (e) {
          console.warn(`Could not load collection "${collName}":`, e);
        }
      }

      renderCarousel();
      initCarouselTouch();
      startAutoSlide();
    }

    function renderCarousel() {
      const slider = document.getElementById('hero-slider');
      const indicators = document.getElementById('slider-indicators');
      slider.innerHTML = '';
      indicators.innerHTML = '';

      if (carouselItems.length === 0) {
        document.getElementById('hero-container').style.display = 'none';
        return;
      }
      document.getElementById('hero-container').style.display = 'block';

      carouselItems.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = 'hero-slide';

        const banner = getVal(item, 'Banner', 'banner', 'Poster', 'poster', 'image', 'thumbnail');
        if (banner) {
          slide.style.backgroundImage = `url('${banner}')`;
        }

        const title = getVal(item, 'Title', 'title', 'Name', 'name') || 'Untitled';
        const logo = getVal(item, 'Logo', 'logo');
        const lang = getVal(item, 'Language', 'language', 'lang') || '';
        const rating = getVal(item, 'Age_Rating', 'Rating', 'age_rating', 'rating') || '';
        const rawGenres = getVal(item, 'Genres', 'genres') || [];
        const genres = Array.isArray(rawGenres) ? rawGenres.join(' • ') : rawGenres;

        const metaParts = [];
        if (lang) metaParts.push(lang);
        if (rating) metaParts.push(`<span class="badge">${rating}</span>`);
        if (genres) metaParts.push(genres);

        slide.innerHTML = `
          <div class="hero-overlay"></div>
          <div class="hero-content">
            ${logo ? `<img src="${logo}" class="hero-logo" alt="${title}" />` : `<h1 class="hero-title-fallback">${title}</h1>`}
            <div class="hero-meta">${metaParts.join(' • ')}</div>
            <div class="hero-actions">
              <button class="btn-watch-now">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Watch Now
              </button>
              <button class="btn-watchlist" title="Add to Watchlist">+</button>
            </div>
          </div>
        `;
        slider.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = `indicator-dot ${idx === 0 ? 'active' : ''}`;
        dot.onclick = () => goToSlide(idx);
        indicators.appendChild(dot);
      });

      goToSlide(0);
    }

    function goToSlide(index) {
      if (carouselItems.length === 0) return;
      currentSlide = (index + carouselItems.length) % carouselItems.length;
      document.getElementById('hero-slider').style.transform = `translateX(-${currentSlide * 100}%)`;
      document.querySelectorAll('.indicator-dot').forEach((d, i) => {
        d.classList.toggle('active', i === currentSlide);
      });
    }

    function startAutoSlide() {
      clearInterval(carouselTimer);
      if (carouselItems.length > 1) {
        carouselTimer = setInterval(() => goToSlide(currentSlide + 1), 5000);
      }
    }

    function initCarouselTouch() {
      const container = document.getElementById('hero-container');
      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      container.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        isDragging = true;
        clearInterval(carouselTimer);
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        currentX = e.touches[0].clientX;
      }, { passive: true });

      container.addEventListener('touchend', () => {
        if (!isDragging) return;
        const diff = startX - currentX;
        if (Math.abs(diff) > 40) {
          if (diff > 0) goToSlide(currentSlide + 1);
          else goToSlide(currentSlide - 1);
        }
        isDragging = false;
        startAutoSlide();
      });
    }

    /* SECTIONS LOGIC */
    async function setupSections(sectionIds) {
      const container = document.getElementById('sections-container');
      container.innerHTML = '';

      for (const secId of sectionIds) {
        try {
          const secDocSnap = await db.collection('Systems').doc(secId).get();
          if (!secDocSnap.exists) continue;

          const secData = secDocSnap.data();
          const contentList = await fetchSectionContent(secData);

          if (contentList.length > 0) {
            const sectionName = getVal(secData, 'Name', 'name') || secId;
            const sectionElem = createSectionRowElement(sectionName, contentList);
            container.appendChild(sectionElem);
          }
        } catch (err) {
          console.error(`Error loading section ${secId}:`, err);
        }
      }
    }

    async function fetchSectionContent(sectionConfig) {
      const results = [];
      const seenIds = new Set();
      const contentTypes = getVal(sectionConfig, 'Content_Type', 'content_type') || ['Movies', 'Shows'];
      const playlist = getVal(sectionConfig, 'Playlist', 'playlist') || [];

      // 1. Resolve explicit Playlist IDs first
      if (Array.isArray(playlist) && playlist.length > 0) {
        for (const id of playlist) {
          for (const coll of contentTypes) {
            try {
              const docSnap = await db.collection(coll).doc(id).get();
              if (docSnap.exists && !seenIds.has(docSnap.id)) {
                seenIds.add(docSnap.id);
                results.push({ id: docSnap.id, ...docSnap.data() });
                break;
              }
            } catch (e) {}
          }
        }
      }

      // 2. Query dynamically matching items if max limit not reached
      const maxLimit = parseInt(getVal(sectionConfig, 'Max_Limit', 'max_limit'), 10) || 20;
      const targetAge = getVal(sectionConfig, 'Age_Rating', 'age_rating');
      const targetFranchise = getVal(sectionConfig, 'Franchise', 'franchise');
      const targetGenres = getVal(sectionConfig, 'Genres', 'genres') || [];

      if (results.length < maxLimit) {
        for (const coll of contentTypes) {
          try {
            // Fetch without compound index to prevent Firestore composite index blocking
            const snap = await db.collection(coll).limit(30).get();
            snap.forEach(doc => {
              if (results.length >= maxLimit || seenIds.has(doc.id)) return;
              const data = doc.data();

              // In-memory criteria matching
              let matches = true;

              if (targetAge) {
                const itemAge = getVal(data, 'Age_Rating', 'Rating', 'age_rating', 'rating');
                if (!itemAge || itemAge.toLowerCase() !== targetAge.toLowerCase()) matches = false;
              }

              if (matches && targetFranchise) {
                const itemFranchise = getVal(data, 'Franchise', 'franchise');
                if (!itemFranchise || itemFranchise.toLowerCase() !== targetFranchise.toLowerCase()) matches = false;
              }

              if (matches && Array.isArray(targetGenres) && targetGenres.length > 0) {
                const itemGenres = getVal(data, 'Genres', 'genres') || [];
                const hasGenre = Array.isArray(itemGenres)
                  ? targetGenres.some(tg => itemGenres.map(g => g.toLowerCase()).includes(tg.toLowerCase()))
                  : targetGenres.some(tg => String(itemGenres).toLowerCase().includes(tg.toLowerCase()));
                if (!hasGenre) matches = false;
              }

              if (matches) {
                seenIds.add(doc.id);
                results.push({ id: doc.id, ...data });
              }
            });
          } catch (e) {
            console.warn(`Error scanning collection ${coll}:`, e);
          }
        }
      }

      return results;
    }

    function createSectionRowElement(title, items) {
      const section = document.createElement('section');
      section.className = 'section-block';

      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `<h2 class="section-title">${title}</h2>`;

      const shelfWrapper = document.createElement('div');
      shelfWrapper.className = 'shelf-wrapper';

      const shelfScroll = document.createElement('div');
      shelfScroll.className = 'shelf-scroll';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'content-card';

        const posterImg = getVal(item, 'Poster', 'poster', 'Banner', 'banner', 'image', 'thumbnail') || '';
        const itemTitle = getVal(item, 'Title', 'title', 'Name', 'name') || 'Untitled';
        const itemRating = getVal(item, 'Age_Rating', 'Rating', 'age_rating', 'rating');

        card.innerHTML = `
          ${posterImg ? `<img src="${posterImg}" alt="${itemTitle}" loading="lazy" />` : ''}
          ${itemRating ? `<span class="card-badge">${itemRating}</span>` : ''}
          <div class="card-info">${itemTitle}</div>
        `;
        shelfScroll.appendChild(card);
      });

      shelfWrapper.appendChild(shelfScroll);
      section.appendChild(header);
      section.appendChild(shelfWrapper);
      return section;
    }
  </script>
</body>
</html>
