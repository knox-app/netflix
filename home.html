<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Showcase</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --bg: #0c111b;
      --card-bg: #192133;
      --accent: #1f80e0;
      --text: #ffffff;
      --text-dim: #9aa9c2;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      width: 100%;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      background: linear-gradient(180deg, rgba(12, 17, 27, 0.95) 0%, rgba(12, 17, 27, 0) 100%);
      z-index: 100;
    }

    .nav-logo {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-logo span { color: var(--accent); }

    /* Carousel / Hero */
    .carousel-container {
      position: relative;
      width: 100%;
      height: 78vh;
      min-height: 520px;
      overflow: hidden;
    }

    .carousel-track {
      display: flex;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .carousel-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      padding: 0 50px;
    }

    .slide-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      z-index: 1;
    }

    .slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, #0c111b 0%, rgba(12, 17, 27, 0.85) 35%, rgba(12, 17, 27, 0.1) 75%),
                  linear-gradient(0deg, #0c111b 0%, rgba(12, 17, 27, 0) 45%);
      z-index: 2;
    }

    .slide-content {
      position: relative;
      z-index: 3;
      max-width: 580px;
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .slide-logo {
      max-width: 280px;
      max-height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.8));
    }

    .slide-title-fallback {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.1;
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.85);
    }

    .slide-meta {
      font-size: 0.95rem;
      color: var(--text-dim);
      font-weight: 600;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .slide-meta span.dot {
      color: var(--accent);
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }

    .btn-watch {
      background: #ffffff;
      color: #000;
      border: none;
      padding: 12px 28px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-watch:hover {
      background: rgba(255, 255, 255, 0.85);
      transform: scale(1.03);
    }

    .btn-watchlist {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(10px);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-watchlist:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.08);
    }

    /* Carousel Nav Indicators */
    .carousel-nav {
      position: absolute;
      bottom: 24px;
      right: 50px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: 0.3s;
    }

    .indicator.active {
      width: 24px;
      border-radius: 4px;
      background: #fff;
    }

    /* Sections */
    .sections-container {
      padding: 10px 40px 80px 40px;
      display: flex;
      flex-direction: column;
      gap: 36px;
      position: relative;
      z-index: 10;
    }

    .section-shelf {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #e1e6f0;
      letter-spacing: 0.5px;
    }

    .cards-row {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding: 12px 4px;
      scrollbar-width: none;
    }

    .cards-row::-webkit-scrollbar { display: none; }

    .card {
      min-width: 170px;
      max-width: 170px;
      height: 240px;
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .card:hover {
      transform: scale(1.06);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.7);
      z-index: 5;
    }

    .card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-info {
      position: relative;
      z-index: 2;
      padding: 10px;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0) 100%);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .card-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-logo"><span>✦</span> STREAM</div>
  </nav>

  <!-- Hero Carousel -->
  <div class="carousel-container" id="carouselWrapper">
    <div class="carousel-track" id="carouselTrack"></div>
    <div class="carousel-nav" id="carouselNav"></div>
  </div>

  <!-- Dynamic Sections -->
  <main class="sections-container" id="sectionsContainer"></main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentSlide = 0;
    let carouselItems = [];
    let slideTimer = null;

    // Helper to safely extract image / poster / banner URLs
    function getMediaImage(item) {
      return item.Banner || item.banner || item.Poster || item.poster || 
             item.Thumbnail || item.thumbnail || item.Image || item.image || 
             item.Cover || item.cover || "";
    }

    // Helper to safely get Rating
    function getMediaRating(item) {
      return item.Age_Rating || item.Rating || item.age_rating || item.rating || "U";
    }

    // Helper to safely get Title
    function getMediaTitle(item) {
      return item.Title || item.title || item.Name || item.name || "Untitled";
    }

    // Helper to safely extract genres array
    function getMediaGenres(item) {
      if (Array.isArray(item.Genres)) return item.Genres;
      if (Array.isArray(item.genres)) return item.genres;
      if (typeof item.Genres === "string") return [item.Genres];
      if (typeof item.genres === "string") return [item.genres];
      return [];
    }

    function getPageId() {
      const hash = window.location.hash.replace("#", "").trim();
      return hash || "demo";
    }

    async function initPage() {
      const pageId = getPageId();
      try {
        const pageDoc = await db.collection("Systems").doc(pageId).get();
        if (!pageDoc.exists) {
          document.body.innerHTML = `<h2 style="text-align:center; margin-top:20%;">Page "${pageId}" was not found in Systems collection.</h2>`;
          return;
        }

        const pageData = pageDoc.data();
        await loadHeroCarousel(pageData.Carsoule_Settings || {});
        await loadSections(pageData.Sections || []);
      } catch (err) {
        console.error("Initialization error:", err);
      }
    }

    // 1. Load Carousel Items with client-side filter
    async function loadHeroCarousel(settings) {
      let contentSources = settings.Content_From;
      if (!Array.isArray(contentSources) || contentSources.length === 0) {
        contentSources = ["Movies", "Shows"];
      }

      const targetRating = (settings.Age_Rating || "").toLowerCase().trim();
      carouselItems = [];

      for (const col of contentSources) {
        try {
          const snap = await db.collection(col).get();
          snap.forEach(doc => {
            const data = { id: doc.id, collectionName: col, ...doc.data() };
            const itemRating = getMediaRating(data).toLowerCase().trim();

            if (!targetRating || targetRating === "all" || itemRating === targetRating) {
              carouselItems.push(data);
            }
          });
        } catch (e) {
          console.warn(`Could not load collection ${col}:`, e);
        }
      }

      // If no matching items, add demo fallback
      if (carouselItems.length === 0) {
        carouselItems = [
          {
            Title: "Featured Showcase",
            Banner: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1600&auto=format&fit=crop",
            Language: "English",
            Rating: settings.Age_Rating || "U",
            Genres: ["Action", "Adventure"]
          }
        ];
      }

      renderCarousel();
    }

    function renderCarousel() {
      const track = document.getElementById("carouselTrack");
      const nav = document.getElementById("carouselNav");
      track.innerHTML = "";
      nav.innerHTML = "";

      carouselItems.forEach((item, index) => {
        const genres = getMediaGenres(item);
        const genresFormatted = genres.length > 0 ? genres.join(" • ") : "Featured";
        const metaLine = `${item.Language || item.language || "English"} <span class="dot">•</span> ${getMediaRating(item)} <span class="dot">•</span> ${genresFormatted}`;
        const bannerUrl = getMediaImage(item) || "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1600";
        const logoUrl = item.Logo || item.logo || "";
        const title = getMediaTitle(item);

        const slide = document.createElement("div");
        slide.className = "carousel-slide";
        slide.innerHTML = `
          <div class="slide-bg" style="background-image: url('${bannerUrl}')"></div>
          <div class="slide-overlay"></div>
          <div class="slide-content">
            ${logoUrl 
              ? `<img src="${logoUrl}" class="slide-logo" alt="${title}" />` 
              : `<div class="slide-title-fallback">${title}</div>`}
            
            <div class="slide-meta">${metaLine}</div>

            <div class="btn-group">
              <button class="btn-watch">▶ Watch Now</button>
              <button class="btn-watchlist" title="Add to Watchlist">+</button>
            </div>
          </div>
        `;
        track.appendChild(slide);

        const dot = document.createElement("div");
        dot.className = `indicator ${index === 0 ? "active" : ""}`;
        dot.onclick = () => goToSlide(index);
        nav.appendChild(dot);
      });

      startAutoSlide();
      setupSwipeGestures();
    }

    function goToSlide(index) {
      currentSlide = index;
      document.getElementById("carouselTrack").style.transform = `translateX(-${index * 100}%)`;
      
      const dots = document.querySelectorAll(".indicator");
      dots.forEach((d, i) => d.classList.toggle("active", i === index));
      startAutoSlide();
    }

    function startAutoSlide() {
      clearInterval(slideTimer);
      if (carouselItems.length > 1) {
        slideTimer = setInterval(() => {
          currentSlide = (currentSlide + 1) % carouselItems.length;
          goToSlide(currentSlide);
        }, 6000);
      }
    }

    function setupSwipeGestures() {
      const container = document.getElementById("carouselWrapper");
      let startX = 0;
      let endX = 0;

      container.ontouchstart = e => { startX = e.touches[0].clientX; };
      container.ontouchend = e => {
        endX = e.changedTouches[0].clientX;
        if (startX - endX > 50) {
          currentSlide = (currentSlide + 1) % carouselItems.length;
          goToSlide(currentSlide);
        } else if (endX - startX > 50) {
          currentSlide = (currentSlide - 1 + carouselItems.length) % carouselItems.length;
          goToSlide(currentSlide);
        }
      };
    }

    // 2. Load Sections
    async function loadSections(sectionIds) {
      const container = document.getElementById("sectionsContainer");
      container.innerHTML = "";

      for (const sId of sectionIds) {
        try {
          const secDoc = await db.collection("Systems").doc(sId).get();
          if (!secDoc.exists) continue;
          const secData = secDoc.data();

          const shelf = document.createElement("div");
          shelf.className = "section-shelf";
          shelf.innerHTML = `
            <div class="section-title">${secData.Name || secData.name || sId}</div>
            <div class="cards-row" id="row-${sId}">
              <div class="card-placeholder">Loading items...</div>
            </div>
          `;
          container.appendChild(shelf);

          populateSectionRow(sId, secData);
        } catch (e) {
          console.error(`Error loading section ${sId}:`, e);
        }
      }
    }

    async function populateSectionRow(secId, secData) {
      const row = document.getElementById(`row-${secId}`);
      let contentTypes = secData.Content_Type || secData.Content_From || ["Movies", "Shows"];
      if (!Array.isArray(contentTypes)) contentTypes = [contentTypes];

      const maxLimit = parseInt(secData.Max_Limit || secData.max_limit) || 20;
      const targetAge = (secData.Age_Rating || secData.Rating || "").toLowerCase().trim();
      const targetFranchise = (secData.Franchise || "").toLowerCase().trim();
      const targetGenres = (secData.Genres || []).map(g => g.toLowerCase().trim());
      const targetPlaylist = (secData.Playlist || []).map(p => p.toLowerCase().trim());

      let allFound = [];

      for (const col of contentTypes) {
        try {
          const snap = await db.collection(col).get();
          snap.forEach(doc => {
            const item = { id: doc.id, ...doc.data() };
            
            // Age Rating Filter
            if (targetAge && targetAge !== "all") {
              const itemRating = getMediaRating(item).toLowerCase().trim();
              if (itemRating && itemRating !== targetAge) return;
            }

            // Franchise Filter
            if (targetFranchise) {
              const itemFranchise = (item.Franchise || item.franchise || "").toLowerCase().trim();
              if (itemFranchise && itemFranchise !== targetFranchise) return;
            }

            // Genres Filter
            if (targetGenres.length > 0) {
              const itemGenres = getMediaGenres(item).map(g => g.toLowerCase().trim());
              const hasGenreMatch = targetGenres.some(g => itemGenres.includes(g));
              if (itemGenres.length > 0 && !hasGenreMatch) return;
            }

            // Playlist Filter
            if (targetPlaylist.length > 0) {
              const itemPlaylists = Array.isArray(item.Playlist) ? item.Playlist.map(p => p.toLowerCase().trim()) : [(item.Playlist || "").toLowerCase().trim()];
              const hasPlaylistMatch = targetPlaylist.some(p => itemPlaylists.includes(p));
              if (!hasPlaylistMatch && item.Playlist) return;
            }

            allFound.push(item);
          });
        } catch (err) {
          console.warn(`Query skipped for collection ${col}:`, err);
        }
      }

      // Slice to maxLimit
      const finalItems = allFound.slice(0, maxLimit);

      row.innerHTML = "";
      if (finalItems.length === 0) {
        row.innerHTML = `<div style="color:var(--text-dim); font-size:0.85rem; padding: 15px 0;">No content matching filters.</div>`;
        return;
      }

      finalItems.forEach(item => {
        const poster = getMediaImage(item);
        const title = getMediaTitle(item);

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = poster 
          ? `<img src="${poster}" alt="${title}" loading="lazy" /><div class="card-info">${title}</div>`
          : `<div class="card-placeholder">${title}</div>`;
        row.appendChild(card);
      });
    }

    window.addEventListener("hashchange", initPage);
    window.onload = initPage;
  </script>
</body>
</html>
