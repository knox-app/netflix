<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Space | OTT Platform</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f1015;
      --card-bg: #161822;
      --accent: #e50914;
      --accent-blue: #0072ef;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-pill: rgba(255, 255, 255, 0.15);
      --pill-bg: #1c202c;
      --pill-active-bg: #ffffff;
      --pill-active-text: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 76px;
    }

    /* ================= TOP NAVBAR ================= */
    .navbar {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 68px;
      padding: 0 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      background: rgba(15, 16, 21, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-left { display: flex; align-items: center; gap: 32px; }
    .brand-logo {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .brand-logo span { color: var(--accent); }
    .kids-badge-nav {
      font-size: 11px;
      font-weight: 800;
      background: #ffaa00;
      color: #000;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-links { display: flex; gap: 22px; list-style: none; }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s ease;
      position: relative;
    }
    .nav-link:hover, .nav-link.active { color: #fff; }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .nav-right { display: flex; align-items: center; gap: 14px; }
    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 4px 12px 4px 6px;
      border-radius: 24px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #232733;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    /* ================= MAIN CONTAINER ================= */
    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 4% 40px;
      display: flex;
      flex-direction: column;
      gap: 38px;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      width: fit-content;
      gap: 10px;
      transition: opacity 0.2s;
    }
    .section-header-row:hover { opacity: 0.85; }

    .section-heading {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-heading i.fa-chevron-right {
      font-size: 13px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }
    .section-header-row:hover i.fa-chevron-right {
      transform: translateX(4px);
      color: #fff;
    }

    .section-badge {
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 114, 239, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 114, 239, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* ================= 16:9 CAROUSEL & CARDS ================= */
    .carousel-wrapper { position: relative; }
    .carousel-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .card-16-9 {
      flex: 0 0 240px;
      width: 240px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card-16-9:hover { transform: scale(1.03); }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #141721;
      border: 1px solid var(--border-color);
    }
    .card-thumb-wrap img.main-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-play-hover {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .card-16-9:hover .card-play-hover { opacity: 1; }
    .card-play-btn-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .card-details { padding: 8px 2px 0; }
    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    .card-subtext {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .carousel-arrow {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 16, 21, 0.85);
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .carousel-wrapper:hover .carousel-arrow { opacity: 1; }
    .carousel-arrow.left { left: -14px; }
    .carousel-arrow.right { right: -14px; }
    .carousel-arrow:hover { background: var(--accent); }

    /* ================= GENRE PILLS BAR (IMAGE 2 DESIGN) ================= */
    .genre-filter-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 6px;
      margin-top: 4px;
    }
    .genre-filter-row::-webkit-scrollbar { display: none; }

    .genre-pill-btn {
      flex: 0 0 auto;
      background: var(--pill-bg);
      border: 1px solid var(--border-pill);
      color: #cfd4dc;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .genre-pill-btn:hover {
      background: #262b3a;
      color: #fff;
    }
    .genre-pill-btn.active {
      background: var(--pill-active-bg);
      color: var(--pill-active-text);
      border-color: #fff;
      font-weight: 700;
    }

    /* ================= SECTION DETAILS FULL-PAGE MODAL (IMAGE 2) ================= */
    .section-modal-page {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-dark);
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px 4% 80px;
    }
    .section-modal-page.active { display: flex; }

    .modal-nav-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }
    .btn-close-modal {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-page-title {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
    }

    .modal-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    /* ================= MOBILE BOTTOM NAVIGATION ================= */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 16, 21, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      z-index: 2000;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
    }

    .nav-item-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      width: 25%;
      cursor: pointer;
    }
    .nav-item-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .nav-item-btn.active, .nav-item-btn:hover { color: #fff; }
    .nav-item-btn.active svg { color: var(--accent); fill: var(--accent); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .mobile-bottom-nav { display: flex; }
      .card-16-9 { flex: 0 0 190px; width: 190px; }
      .carousel-arrow { display: none; }
      .modal-grid-container {
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="javascript:void(0)" onclick="navigateToPage('movies')" class="brand-logo">
        <i class="fa-solid fa-play-circle" style="color:var(--accent);"></i>
        My<span>Space</span>
      </a>
      <span id="kidsBadge" class="kids-badge-nav" style="display:none;">Kids</span>

        <li><a class="nav-link" data-hash="shows" href="javascript:void(0)" onclick="navigateToPage('shows')">Shows</a></li>

  <!-- Main Feed Container -->
  <main class="main-container" id="sectionsContainer">

  </main>

  <!-- Section Full-Page Modal (Image 2 style) -->
  <div class="section-modal-page" id="sectionViewModal">
    <div class="modal-nav-header">
      <button class="btn-close-modal" id="closeSectionModalBtn">

      </button>
      <h2 class="modal-page-title" id="modalSectionTitle">Section Name</h2>
    </div>
    <div class="genre-filter-row" id="modalGenreFilterRow"></div>
    <div class="modal-grid-container" id="modalGridMovies"></div>
  </div>

  <!-- Mobile Bottom Navigation (Home, Search, Download, My Space) -->
  <nav class="mobile-bottom-nav">
    <a href="javascript:void(0)" onclick="navigateToPage('movies')" class="nav-item-btn active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="search.html" class="nav-item-btn">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>

  <!-- FIREBASE ENGINE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDoc, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Genre lists requested
    const ALL_GENRES_STANDARD = [
      "Romance", "Drama", "Family", "Comedy", "Mythology", "Crime", "Action", 
      "Teen", "Biopic", "Sci-Fi", "Horror", "Kids", "Anime", "Thriller", 
      "Adventure", "Nature", "Animals", "Animation", "Fantasy", "Historic", 
      "Superhero", "Musical", "Mystery"
    ];

    const ALL_GENRES_KIDS = [
      "Superhero", "Princess", "Fairy Tale", "Family", "Comedy", "Mythology", 
      "Action", "Biopic", "Kids", "Anime", "Adventure", "Nature", "Animals", 
      "Animation", "Historic", "Musical"
    ];

    // Cache
    let allMoviesCached = [];
    let isKidsMode = false;
    let activeProfile = null;
    let currentRawUser = null;

    // 1. Multi-User URL Hash Parser (e.g. #home&user#0 or #movies&user#1)
    function parseRouteParams() {
      const hash = window.location.hash.replace('#', '').trim();
      let page = "movies";
      let userIdx = 0;

      if (hash) {
        const parts = hash.split('&');
        page = parts[0] ? parts[0].toLowerCase() : "movies";
        if (page === "home") page = "movies";

        for (let i = 1; i < parts.length; i++) {
          const p = parts[i];
          if (p.startsWith('user#') || p.startsWith('user=')) {
            const rawIdx = p.replace('user#', '').replace('user=', '');
            userIdx = parseInt(rawIdx, 10) || 0;
          }
        }
      }
      return { page, userIdx };
    }

    window.navigateToPage = function(targetPage) {
      const { userIdx } = parseRouteParams();
      window.location.hash = `#${targetPage}&user#${userIdx}`;
    };

    // 2. Resolve Active Profile from UARM
    function resolveUserProfile(userIdx) {
      try {
        const stored = localStorage.getItem('active_user') || localStorage.getItem('UARM');
        if (stored) currentRawUser = JSON.parse(stored);
      } catch(e) {}

      isKidsMode = false;

      if (currentRawUser) {
        if (Array.isArray(currentRawUser.Profiles) && currentRawUser.Profiles[userIdx]) {
          activeProfile = currentRawUser.Profiles[userIdx];
        } else {
          activeProfile = {
            Name: currentRawUser["First Name"] || "User",
            Avatar: currentRawUser["Profile_Picture"] || currentRawUser["Profile Picture"] || "",
            Kids: currentRawUser["Type"] === "Kids" ? "True" : "False"
          };
        }

        const isKidsProfile = String(activeProfile.Kids).toLowerCase() === "true" || activeProfile.Type === "Kids" || currentRawUser["Type"] === "Kids";
        if (isKidsProfile) {
          isKidsMode = true;
        }
      }

      // Navbar state update
      document.getElementById('kidsBadge').style.display = isKidsMode ? 'inline-block' : 'none';
      const slot = document.getElementById('navAuthSlot');
      if (activeProfile) {
        slot.innerHTML = `
          <div class="user-pill" title="${activeProfile.Name}">
            ${activeProfile.Avatar ? `<img src="${activeProfile.Avatar}" class="user-avatar" />` : `<div class="user-avatar">${(activeProfile.Name || 'U').charAt(0)}</div>`}
            <span>${activeProfile.Name}</span>
          </div>
        `;
      }
    }

    // Helpers
    function safeUrl(url) {
      if (!url) return '';
      return url.trim().replace(/^http:\/\//i, 'https://');
    }

    function getPosterH(c) {
      return safeUrl(
        c["Poster.h"] || 
        c.Poster_h || 
        c.Banner || 
        c.banner || 
        c["Poster.v"] || 
        c.Poster || 
        'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'
      );
    }

    function parseGenres(field) {
      if (!field) return [];
      if (Array.isArray(field)) return field.map(g => String(g).trim().toLowerCase()).filter(Boolean);
      if (typeof field === 'string') return field.split(/[,/|•]+/).map(g => g.trim().toLowerCase()).filter(Boolean);
      return [String(field).trim().toLowerCase()];
    }

    function mixupArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function isAppropriateForKids(movie) {
      if (!isKidsMode) return true;
      const age = (movie.Age_Rating || movie.Age || "").toUpperCase();
      if (age.includes('18+') || age.includes('16+') || age.includes('A') || age.includes('U/A 16+')) {
        return false;
      }
      return true;
    }

    /* ================= 1. ENHANCED 'FOR YOU' ENGINE ================= */
    function getRecentlyWatchedMovieIds() {
      if (!currentRawUser || !Array.isArray(currentRawUser["Memory.ent"])) return [];
      let watchedIds = [];
      for (const item of currentRawUser["Memory.ent"]) {
        if (typeof item === 'object' && item !== null) {
          for (const key of Object.keys(item)) {
            if (key.toLowerCase().includes("recently watched") && key.toLowerCase().includes("movie")) {
              const val = item[key];
              if (typeof val === 'string') {
                watchedIds = val.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
              } else if (Array.isArray(val)) {
                watchedIds = val.map(s => String(s).trim().toLowerCase());
              }
            }
          }
        }
      }
      return watchedIds;
    }

    function computeAdvancedRelevance(target, candidate) {
      if (!target || !candidate) return 1;
      let score = 1;

      const targetGenres = parseGenres(target.Genres);
      const candGenres = parseGenres(candidate.Genres);
      targetGenres.forEach(g => {
        if (candGenres.some(cg => cg === g || cg.includes(g) || g.includes(cg))) score += 40;
      });

      const targetStudio = (target.Partner || target.Studio || '').toLowerCase().trim();
      const candStudio = (candidate.Partner || candidate.Studio || '').toLowerCase().trim();
      if (targetStudio && candStudio && targetStudio === candStudio) score += 25;

      const targetLang = (target.Language || '').toLowerCase().trim();
      const candLang = (candidate.Language || '').toLowerCase().trim();
      if (targetLang && candLang && targetLang === candLang) score += 15;

      return score;
    }

    /* ================= 3. CLEAN 16:9 CARD (NO LOGO & NO RATING) ================= */
    function create16x9CardElement(movie) {
      const card = document.createElement('div');
      card.className = 'card-16-9';

      const title = movie.Name || movie.Title || movie.id;
      const poster = getPosterH(movie);
      const genres = parseGenres(movie.Genres).map(g => g.charAt(0).toUpperCase() + g.slice(1)).join(', ') || movie.Language || 'Movie';

      // Redirection to preview.html?watch=<id>
      card.onclick = () => {
        window.location.href = `preview.html?watch=${encodeURIComponent(movie.id)}`;
      };

      card.innerHTML = `
        <div class="card-thumb-wrap">
          <img class="main-thumb" src="${poster}" alt="${title}" loading="lazy"/>
          <div class="card-play-hover">
            <div class="card-play-btn-circle"><i class="fa-solid fa-play"></i></div>
          </div>
        </div>
        <div class="card-details">
          <div class="card-title">${title}</div>
          <div class="card-subtext">${genres}</div>
        </div>
      `;

      return card;
    }

    /* ================= MAIN FEED CONTROLLER ================= */
    async function loadPage() {
      const { page, userIdx } = parseRouteParams();
      resolveUserProfile(userIdx);

      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.hash === page);
      });

      const container = document.getElementById('sectionsContainer');
      container.innerHTML = `
        <div style="text-align: center; padding: 60px; color: var(--text-muted);">
          <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i>
          <p style="margin-top:12px;">Curating your feed...</p>
        </div>
      `;

      try {
        // Fetch All Movies
        const moviesSnap = await getDocs(collection(db, "Movies"));
        const moviesMap = new Map();
        allMoviesCached = [];

        moviesSnap.forEach(d => {
          const item = { id: d.id, ...d.data() };
          if (isAppropriateForKids(item)) {
            moviesMap.set(d.id.toLowerCase(), item);
            allMoviesCached.push(item);
          }
        });

        container.innerHTML = "";
        let renderedSectionsCount = 0;

        // 1. "Because You Watched <Name>"
        const watchedIds = getRecentlyWatchedMovieIds();
        if (watchedIds.length > 0) {
          const anchorMovie = moviesMap.get(watchedIds[0]);
          if (anchorMovie) {
            const similar = allMoviesCached
              .filter(m => m.id.toLowerCase() !== anchorMovie.id.toLowerCase())
              .map(m => ({ movie: m, score: computeAdvancedRelevance(anchorMovie, m) }))
              .filter(s => s.score > 25)
              .sort((a, b) => b.score - a.score)
              .map(s => s.movie);

            if (similar.length > 0) {
              renderCarouselSection(
                `Because You Watched ${anchorMovie.Name || 'this'}`,
                similar.slice(0, 16),
                "Recommendation"
              );
              renderedSectionsCount++;
            }
          }
        }

        // 2. High-Quality "For You" Section
        const genreFrequency = {};
        watchedIds.forEach(id => {
          const m = moviesMap.get(id);
          if (m) {
            parseGenres(m.Genres).forEach(g => {
              genreFrequency[g] = (genreFrequency[g] || 0) + 1;
            });
          }
        });

        let forYouPool = allMoviesCached.filter(m => !watchedIds.includes(m.id.toLowerCase()));
        forYouPool.sort((a, b) => {
          let scoreA = parseGenres(a.Genres).reduce((sum, g) => sum + (genreFrequency[g] || 0), 0);
          let scoreB = parseGenres(b.Genres).reduce((sum, g) => sum + (genreFrequency[g] || 0), 0);
          return scoreB - scoreA;
        });

        if (forYouPool.length < 6) forYouPool = mixupArray(allMoviesCached);
        renderCarouselSection("For You", forYouPool.slice(0, 18), "Curated");
        renderedSectionsCount++;

        // 3. Sections from Systems (e.g. Systems/movies)
        const pageDoc = await getDoc(doc(db, "Systems", page));
        if (pageDoc.exists()) {
          const sectionIds = pageDoc.data().Sections || [];

          for (const sId of sectionIds) {
            const secSnap = await getDoc(doc(db, "Systems", sId));
            if (!secSnap.exists()) continue;

            const secData = secSnap.data();
            const isFixed = String(secData.Fixed).toLowerCase() === "true";
            const maxLimit = parseInt(secData.Max_Limit || "50", 10);
            const sectionGenres = parseGenres(secData.Genres);

            let sectionMovies = [];

            // Add Explicit Mandatory Titles
            const explicitTitles = Array.isArray(secData.Titles) ? secData.Titles : [];
            for (const tId of explicitTitles) {
              const movie = moviesMap.get(String(tId).trim().toLowerCase());
              if (movie && !sectionMovies.some(m => m.id === movie.id)) {
                sectionMovies.push(movie);
              }
            }

            // Fixed == False: blend similar genres
            if (!isFixed) {
              const similar = allMoviesCached.filter(m => {
                if (sectionMovies.some(sm => sm.id === m.id)) return false;
                const mG = parseGenres(m.Genres);
                return sectionGenres.some(sg => mG.some(mg => mg.includes(sg) || sg.includes(mg)));
              });
              sectionMovies = mixupArray([...sectionMovies, ...similar]).slice(0, maxLimit);
            }

            if (sectionMovies.length > 0) {
              renderCarouselSection(secData.Name || sId, sectionMovies);
              renderedSectionsCount++;

              // 4. REQUIREMENT 4: After 4-5 sections, show Genre Filter section (Image 2)
              if (renderedSectionsCount === 4) {
                renderEmbeddedGenreSection();
              }
            }
          }
        }

        // If fewer than 4 sections, ensure the Genre Section is still rendered
        if (renderedSectionsCount < 4) {
          renderEmbeddedGenreSection();
        }

      } catch (err) {
        console.error("Feed render error:", err);
        container.innerHTML = `<div style="text-align:center; padding:40px; color:#ff5252;">Failed to load feed. Check connection.</div>`;
      }
    }

    /* ================= RENDER CAROUSEL SECTION ================= */
    function renderCarouselSection(sectionTitle, movies, badgeLabel = null) {
      const container = document.getElementById('sectionsContainer');
      const sectionEl = document.createElement('section');
      sectionEl.className = 'section-block';

      const encodedKey = encodeURIComponent(sectionTitle);
      window[`sec_cache_${encodedKey}`] = movies;

      sectionEl.innerHTML = `
        <div class="section-header-row" onclick="window.openSectionModal('${encodedKey}')">
          <h2 class="section-heading">
            ${sectionTitle}
            ${badgeLabel ? `<span class="section-badge">${badgeLabel}</span>` : ''}
            <i class="fa-solid fa-chevron-right"></i>
          </h2>
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-arrow left"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="carousel-track"></div>
          <button class="carousel-arrow right"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      `;

      const track = sectionEl.querySelector('.carousel-track');
      const leftBtn = sectionEl.querySelector('.carousel-arrow.left');
      const rightBtn = sectionEl.querySelector('.carousel-arrow.right');

      movies.forEach(m => track.appendChild(create16x9CardElement(m)));

      leftBtn.onclick = () => track.scrollBy({ left: -480, behavior: 'smooth' });
      rightBtn.onclick = () => track.scrollBy({ left: 480, behavior: 'smooth' });

      container.appendChild(sectionEl);
    }

    /* ================= 4. EMBEDDED GENRE SECTION (IMAGE 2 SETUP) ================= */
    function renderEmbeddedGenreSection() {
      const container = document.getElementById('sectionsContainer');
      const genreBlock = document.createElement('section');
      genreBlock.className = 'section-block';
      genreBlock.id = 'embeddedGenreBlock';

      const genreList = isKidsMode ? ALL_GENRES_KIDS : ALL_GENRES_STANDARD;

      genreBlock.innerHTML = `
        <div class="section-header-row">
          <h2 class="section-heading">Popular Movies</h2>
        </div>
        <div class="genre-filter-row" id="embeddedGenrePills">
          <button class="genre-pill-btn active" data-genre="ALL">All</button>
          ${genreList.map(g => `<button class="genre-pill-btn" data-genre="${g}">${g}</button>`).join('')}
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-arrow left"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="carousel-track" id="embeddedGenreTrack"></div>
          <button class="carousel-arrow right"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      `;

      const track = genreBlock.querySelector('#embeddedGenreTrack');
      const pillsContainer = genreBlock.querySelector('#embeddedGenrePills');
      const leftBtn = genreBlock.querySelector('.carousel-arrow.left');
      const rightBtn = genreBlock.querySelector('.carousel-arrow.right');

      function filterAndShow(genre) {
        track.innerHTML = '';
        let list = allMoviesCached;
        if (genre !== 'ALL') {
          list = allMoviesCached.filter(m => parseGenres(m.Genres).includes(genre.toLowerCase()));
        }
        if (list.length === 0) list = allMoviesCached.slice(0, 10);
        list.forEach(m => track.appendChild(create16x9CardElement(m)));
      }

      filterAndShow('ALL');

      pillsContainer.querySelectorAll('.genre-pill-btn').forEach(btn => {
        btn.onclick = () => {
          pillsContainer.querySelectorAll('.genre-pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filterAndShow(btn.dataset.genre);
        };
      });

      leftBtn.onclick = () => track.scrollBy({ left: -480, behavior: 'smooth' });
      rightBtn.onclick = () => track.scrollBy({ left: 480, behavior: 'smooth' });

      container.appendChild(genreBlock);
    }

    /* ================= 2. SECTION MODAL MATCHING IMAGE 2 ================= */
    window.openSectionModal = function(encodedKey) {
      const movies = window[`sec_cache_${encodedKey}`] || allMoviesCached;
      const title = decodeURIComponent(encodedKey);

      document.getElementById('modalSectionTitle').innerText = title;
      const pillsRow = document.getElementById('modalGenreFilterRow');
      const grid = document.getElementById('modalGridMovies');

      const genreList = isKidsMode ? ALL_GENRES_KIDS : ALL_GENRES_STANDARD;

      pillsRow.innerHTML = `
        <button class="genre-pill-btn active" data-genre="ALL">All</button>
        ${genreList.map(g => `<button class="genre-pill-btn" data-genre="${g}">${g}</button>`).join('')}
      `;

      function renderGrid(genre) {
        grid.innerHTML = '';
        let filtered = movies;
        if (genre !== 'ALL') {
          filtered = movies.filter(m => parseGenres(m.Genres).includes(genre.toLowerCase()));
        }
        filtered.forEach(m => grid.appendChild(create16x9CardElement(m)));
      }

      renderGrid('ALL');

      pillsRow.querySelectorAll('.genre-pill-btn').forEach(btn => {
        btn.onclick = () => {
          pillsRow.querySelectorAll('.genre-pill-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderGrid(btn.dataset.genre);
        };
      });

      document.getElementById('sectionViewModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    document.getElementById('closeSectionModalBtn').onclick = () => {
      document.getElementById('sectionViewModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    };

    window.addEventListener('hashchange', loadPage);
    loadPage();
  </script>
</body>
