<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Space | OTT Platform</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f1015;
      --card-bg: #161822;
      --accent: #e50914;
      --accent-blue: #0072ef;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --border-color: rgba(255, 255, 255, 0.08);
      --chip-bg: #1a1e2b;
      --chip-active: #2b3347;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 85px;
    }

    /* TOP NAVBAR */
    .navbar {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 68px;
      padding: 0 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      background: rgba(15, 16, 21, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
    }
    .nav-left { display: flex; align-items: center; gap: 32px; }
    .brand-logo {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .brand-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 22px; list-style: none; }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      position: relative;
    }
    .nav-link:hover, .nav-link.active { color: #fff; }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 4px 12px 4px 6px;
      border-radius: 24px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #232733;
    }
    .kids-badge {
      font-size: 10px;
      background: #ffb703;
      color: #000;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* MAIN CONTAINER */
    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 4% 40px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .section-block { display: flex; flex-direction: column; gap: 14px; }
    .section-header-row {
      display: flex;
      align-items: center;
      cursor: pointer;
      width: fit-content;
      gap: 10px;
      transition: opacity 0.2s;
    }
    .section-header-row:hover { opacity: 0.85; }
    .section-heading {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-heading i.fa-chevron-right {
      font-size: 13px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }
    .section-header-row:hover i.fa-chevron-right {
      transform: translateX(4px);
      color: #fff;
    }
    .section-badge {
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 114, 239, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 114, 239, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* 16:9 CAROUSEL & CARDS (NO RATINGS / NO LOGOS) */
    .carousel-wrapper { position: relative; }
    .carousel-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .card-16-9 {
      flex: 0 0 240px;
      width: 240px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card-16-9:hover { transform: scale(1.03); }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #141721;
      border: 1px solid var(--border-color);
    }
    .card-thumb-wrap img.main-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-play-hover {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .card-16-9:hover .card-play-hover { opacity: 1; }
    .card-play-btn-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .card-details { padding: 8px 2px 0; }
    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    .card-subtext {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .carousel-arrow {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 16, 21, 0.85);
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .carousel-wrapper:hover .carousel-arrow { opacity: 1; }
    .carousel-arrow.left { left: -14px; }
    .carousel-arrow.right { right: -14px; }
    .carousel-arrow:hover { background: var(--accent); }

    /* GENRE FILTER PILLS */
    .genre-filter-scroller {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 0 14px;
      scrollbar-width: none;
    }
    .genre-filter-scroller::-webkit-scrollbar { display: none; }

    .genre-chip {
      background: var(--chip-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .genre-chip:hover { color: #fff; background: var(--chip-active); }
    .genre-chip.active {
      background: var(--chip-active);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* SECTION FULL-PAGE MODAL */
    .section-modal-page {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-dark);
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px 4% 60px;
    }
    .section-modal-page.active { display: flex; }
    .modal-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-title-box { display: flex; align-items: center; gap: 16px; }
    .btn-close-modal {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
    }
    .modal-page-title { font-size: 24px; font-weight: 800; }
    .modal-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 14px;
    }

    /* MOBILE BOTTOM NAV */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 16, 21, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      z-index: 2000;
      justify-content: space-around;
      align-items: center;
    }
    .nav-item-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      width: 25%;
    }
    .nav-item-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .nav-item-btn.active, .nav-item-btn:hover { color: #fff; }
    .nav-item-btn.active svg { fill: var(--accent); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .mobile-bottom-nav { display: flex; }
      .card-16-9 { flex: 0 0 190px; width: 190px; }
      .carousel-arrow { display: none; }
    }
  </style>
</head>
<body>

  <!-- Content Container -->
  <main class="main-container" id="sectionsContainer">

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-nav">

      <span>My Space</span>

  <!-- REAL-TIME FIREBASE ENGINES -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      onSnapshot, 
      collection, 
      getDoc, 
      getDocs, 
      query, 
      where 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    /* ==============================================================
       1. REAL-TIME CONNECTION 1: UARM & AUTH DATABASE (question-metabase)
       ============================================================== */
    const uarmConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase",
      storageBucket: "question-metabase.firebasestorage.app",
      messagingSenderId: "770698198753",
      appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
      measurementId: "G-6ZP1FPMKSJ"
    };
    const uarmApp = initializeApp(uarmConfig, "uarmApp");
    const uarmDb = getFirestore(uarmApp);

    /* ==============================================================
       2. REAL-TIME CONNECTION 2: CONTENT & SYSTEMS (internal-systems-46728)
       ============================================================== */
    const contentConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728"
    };
    const contentApp = initializeApp(contentConfig, "contentApp");
    const contentDb = getFirestore(contentApp);

    // Live State Variables
    let liveUserData = null;
    let liveMoviesCatalog = [];
    let liveMoviesMap = new Map();
    let uarmUnsub = null;
    let moviesUnsub = null;

    let activeProfile = null;
    let isKidsProfile = false;
    let userMaxAgeRating = "U/A 7+";

    function safeUrl(url) {
      if (!url) return '';
      return url.trim().replace(/^http:\/\//i, 'https://');
    }

    function getPosterH(c) {
      if (!c) return 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800';
      return safeUrl(
        c["Poster.h"] || c.Poster_h || c.Banner || c.banner || c["Poster.v"] || c.Poster || 
        'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'
      );
    }

    function parseGenres(field) {
      if (!field) return [];
      if (Array.isArray(field)) return field.map(g => String(g).trim().toLowerCase()).filter(Boolean);
      if (typeof field === 'string') return field.split(/[,/|•]+/).map(g => g.trim().toLowerCase()).filter(Boolean);
      return [String(field).trim().toLowerCase()];
    }

    function mixupArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    /* ==============================================================
       TRUST & SAFETY: ZERO-TOLERANCE AGE RATING ENGINE
       ============================================================== */
    function isKidSafe(movie) {
      if (!isKidsProfile) return true; // Adult mode has no age limits
      if (!movie) return false;

      const rawAge = String(movie.Age_Rating || '').trim().toUpperCase();
      const genres = parseGenres(movie.Genres);

      // 1. Definite Adult & Teen Flags -> Block immediately
      const adultFlags = ["A", "18", "18+", "16", "16+", "U/A 16+", "U/A 16", "U/A 13+", "U/A 13", "13+", "R", "TV-MA", "TV-14", "NC-17", "ADULT"];
      for (const badge of adultFlags) {
        if (
          rawAge === badge || 
          rawAge.startsWith(badge + " ") || 
          rawAge.endsWith(" " + badge) || 
          rawAge.includes("16") || 
          rawAge.includes("18") || 
          rawAge.includes("13") || 
          rawAge.includes("MA") || 
          rawAge.includes("TV-14")
        ) {
          return false;
        }
      }

      // 2. Mature genres block in Kids Mode (War, Crime, Thriller, Erotic, Biopic)
      const matureGenres = ["war", "crime", "horror", "erotic", "biopic", "political", "thriller"];
      const isKidTagged = genres.some(g => ["animation", "kids", "children", "cartoon", "disney", "family"].includes(g));

      if (genres.some(g => matureGenres.includes(g)) && !isKidTagged) {
        return false;
      }

      // 3. Approved safe ratings
      const allowedKidsRatings = ["U", "G", "TV-Y", "TV-Y7", "TV-G", "ALL", "U/A 7+", "PG", "TV-PG", "7+"];
      if (allowedKidsRatings.some(r => rawAge === r || rawAge.startsWith(r))) {
        return true;
      }

      // 4. Missing Rating: Only permit if explicitly tagged for children/animation
      if (!rawAge || rawAge === "N/A") {
        return isKidTagged;
      }

      return false;
    }

    function isSectionAgeCompliant(sectionAge) {
      if (!isKidsProfile) return true;
      if (!sectionAge) return true;
      const raw = String(sectionAge).trim().toUpperCase();
      return !(raw.includes("18") || raw.includes("16") || raw.includes("13") || raw.includes("A") || raw.includes("MA"));
    }

    /* ==============================================================
       REAL-TIME USER SYNC (LISTENING TO UARM COLLECTION)
       ============================================================== */
    function syncRealtimeUARM() {
      if (uarmUnsub) uarmUnsub();

      const urlParams = new URLSearchParams(window.location.search);
      const lotusParam = urlParams.get('lotus') || urlParams.get('Lotus');
      const uarmIdParam = urlParams.get('uarm') || urlParams.get('uarms');

      const cachedRaw = localStorage.getItem('active_user') || localStorage.getItem('UARM');
      const cached = cachedRaw ? JSON.parse(cachedRaw) : null;

      const targetDocId = uarmIdParam || cached?.["UARMS ID"] || cached?.id || "7I4d9vmlm9WiUAUneQGByq6jT";

      // Connect with live snapshot listener
      uarmUnsub = onSnapshot(doc(uarmDb, "UARM", targetDocId), (snap) => {
        if (!snap.exists()) {
          console.warn(`User document '${targetDocId}' not found in question-metabase database.`);
          return;
        }

        liveUserData = { id: snap.id, ...snap.data() };
        localStorage.setItem('active_user', JSON.stringify(liveUserData));

        updateActiveProfileState();
        renderUserNavPill();
        buildLiveFeed();
      }, (err) => {
        console.error("Real-time UARM connection error:", err);
      });
    }

    /* ==============================================================
       REAL-TIME MOVIES CATALOG SYNC (LISTENING TO MOVIES)
       ============================================================== */
    function syncRealtimeMovies() {
      if (moviesUnsub) moviesUnsub();

      moviesUnsub = onSnapshot(collection(contentDb, "Movies"), (snapshot) => {
        liveMoviesCatalog = [];
        liveMoviesMap.clear();

        snapshot.forEach(docSnap => {
          const m = { id: docSnap.id, ...docSnap.data() };
          liveMoviesCatalog.push(m);
          liveMoviesMap.set(docSnap.id.toLowerCase(), m);
        });

        buildLiveFeed();
      }, (err) => {
        console.error("Real-time Movies connection error:", err);
      });
    }

    function updateActiveProfileState() {
      if (!liveUserData) return;

      const hash = window.location.hash;
      let targetUserIdx = 0;

      if (hash.includes('user#')) {
        targetUserIdx = parseInt(hash.split('user#')[1], 10) || 0;
      } else {
        const cachedIdx = localStorage.getItem('active_profile_index');
        if (cachedIdx !== null) targetUserIdx = parseInt(cachedIdx, 10);
      }

      if (Array.isArray(liveUserData.Profiles) && liveUserData.Profiles.length > targetUserIdx) {
        activeProfile = liveUserData.Profiles[targetUserIdx];
      } else if (Array.isArray(liveUserData.Profiles) && liveUserData.Profiles.length > 0) {
        activeProfile = liveUserData.Profiles[0];
      } else {
        activeProfile = {
          Name: liveUserData["First Name"] || "User",
          Avatar: liveUserData["Profile_Picture"] || "",
          Kids: String(liveUserData["Type"]).toLowerCase() === "kids" ? "True" : "False",
          Age_Rating: "U/A 7+"
        };
      }

      isKidsProfile = String(activeProfile?.Kids).toLowerCase() === "true";
      userMaxAgeRating = activeProfile?.Age_Rating || (isKidsProfile ? "U/A 7+" : "A");
    }

    function renderUserNavPill() {
      const slot = document.getElementById('navAuthSlot');
      if (!activeProfile) return;

      slot.innerHTML = `
        <a href="onboarding.html" class="user-pill">
          <img src="${activeProfile.Avatar || 'https://img1.hotstarext.com/image/upload/w_auto,c_fill/v1/feature/profile/27.png'}" class="user-avatar" />
          <span>${activeProfile.Name || 'Profile'}</span>
          ${isKidsProfile ? `<span class="kids-badge">Kids</span>` : ''}
        </a>
      `;
    }

    /* ==============================================================
       PARSE LIVE WATCHED LIST FROM FIRESTORE Memory.ent
       ============================================================== */
    function getLiveRecentlyWatchedIds() {
      if (!liveUserData || !Array.isArray(liveUserData["Memory.ent"])) return [];

      for (const item of liveUserData["Memory.ent"]) {
        if (typeof item === 'object' && item !== null) {
          for (const key of Object.keys(item)) {
            // Live match of field "Recently Watched Movies"
            if (key.toLowerCase().includes("recently watched") && key.toLowerCase().includes("movie")) {
              const val = item[key];
              if (typeof val === 'string') {
                return val.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
              } else if (Array.isArray(val)) {
                return val.map(s => String(s).trim().toLowerCase());
              }
            }
          }
        }
      }
      return [];
    }

    /* ==============================================================
       REFINED "FOR YOU" ALGORITHM (POWERED BY LIVE CATALOG)
       ============================================================== */
    function buildLiveForYou(safeMoviesPool, watchedIds) {
      const effectiveWatched = isKidsProfile
        ? watchedIds.filter(id => isKidSafe(liveMoviesMap.get(id)))
        : watchedIds;

      const unwatched = safeMoviesPool.filter(m => !effectiveWatched.includes(m.id.toLowerCase()));
      if (effectiveWatched.length === 0) return mixupArray(unwatched).slice(0, 20);

      const genreFreq = {};
      const studioFreq = {};

      effectiveWatched.forEach((id, idx) => {
        const movie = liveMoviesMap.get(id);
        if (!movie) return;
        const decay = Math.max(1, 5 - idx);

        parseGenres(movie.Genres).forEach(g => {
          genreFreq[g] = (genreFreq[g] || 0) + (10 * decay);
        });

        const std = (movie.Studio || movie.Partner || '').toLowerCase().trim();
        if (std) studioFreq[std] = (studioFreq[std] || 0) + (6 * decay);
      });

      const scored = unwatched.map(movie => {
        let score = 0;
        parseGenres(movie.Genres).forEach(g => {
          if (genreFreq[g]) score += genreFreq[g];
        });

        const std = (movie.Studio || movie.Partner || '').toLowerCase().trim();
        if (std && studioFreq[std]) score += studioFreq[std];

        score += Math.random() * 8; // Refresh jitter
        return { movie, score };
      });

      scored.sort((a, b) => b.score - a.score);
      return scored.slice(0, 20).map(s => s.movie);
    }

    /* ==============================================================
       BUILD MAIN LIVE FEED
       ============================================================== */
    async function buildLiveFeed() {
      if (liveMoviesCatalog.length === 0 || !liveUserData) return;

      const pageId = window.location.hash.split('&')[0].replace('#', '').trim().toLowerCase() || 'movies';

      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.hash === pageId);
      });

      const container = document.getElementById('sectionsContainer');
      container.innerHTML = "";

      // 1. Filter movies pool in real-time according to profile safety
      const safeMoviesPool = liveMoviesCatalog.filter(m => isKidSafe(m));
      const rawWatchedIds = getLiveRecentlyWatchedIds();

      // ==============================================================
      // 2. "BECAUSE YOU WATCHED <NAME>" WITH LIVE SAFETY SCANNER
      // ==============================================================
      let anchorMovie = null;

      if (isKidsProfile) {
        // Sequentially scan user's live history until a verified safe movie is found
        for (const wid of rawWatchedIds) {
          const candidate = liveMoviesMap.get(wid);
          if (candidate && isKidSafe(candidate)) {
            anchorMovie = candidate;
            break; // Found the safe movie from live DB
          }
        }
      } else {
        if (rawWatchedIds.length > 0) {
          anchorMovie = liveMoviesMap.get(rawWatchedIds[0]);
        }
      }

      // If no kid-safe film exists in history, OMIT this section completely
      if (anchorMovie) {
        const anchorGenres = parseGenres(anchorMovie.Genres);
        const similarSafeMovies = safeMoviesPool
          .filter(m => m.id.toLowerCase() !== anchorMovie.id.toLowerCase())
          .filter(m => anchorGenres.some(g => parseGenres(m.Genres).includes(g)));

        if (similarSafeMovies.length >= 2) {
          renderCarouselSection(
            `Because You Watched ${anchorMovie.Name || anchorMovie.Title || 'this'}`,
            mixupArray(similarSafeMovies).slice(0, 15),
            "Recommendation"
          );
        }
      }

      // ==============================================================
      // 3. LIVE "FOR YOU" RECOMMENDATION
      // ==============================================================
      const forYouList = buildLiveForYou(safeMoviesPool, rawWatchedIds);
      if (forYouList.length > 0) {
        renderCarouselSection("For You", forYouList, "Personalized");
      }

      // ==============================================================
      // 4. SECTIONS FROM SYSTEMS COLLECTION (Real-time check)
      // ==============================================================
      try {
        const pageDoc = await getDoc(doc(contentDb, "Systems", pageId));
        if (pageDoc.exists()) {
          const sectionIds = pageDoc.data().Sections || [];

          for (const sId of sectionIds) {
            const secSnap = await getDoc(doc(contentDb, "Systems", sId));
            if (!secSnap.exists()) continue;

            const secData = secSnap.data();

            // Real-time compliance filter on section itself
            if (!isSectionAgeCompliant(secData.Age_Rating)) {
              continue;
            }

            const isFixed = String(secData.Fixed).toLowerCase() === "true";
            const maxLimit = parseInt(secData.Max_Limit || "50", 10);
            const sectionGenres = parseGenres(secData.Genres);

            let sectionMovies = [];

            // Add verified titles from section.Titles
            const explicitTitles = Array.isArray(secData.Titles) ? secData.Titles : [];
            for (const tId of explicitTitles) {
              const movie = liveMoviesMap.get(String(tId).trim().toLowerCase());
              if (movie && isKidSafe(movie) && !sectionMovies.some(m => m.id === movie.id)) {
                sectionMovies.push(movie);
              }
            }

            // Fixed == False: blend similar live genres
            if (!isFixed) {
              const similarMovies = safeMoviesPool.filter(m => {
                if (sectionMovies.some(sm => sm.id === m.id)) return false;
                const mG = parseGenres(m.Genres);
                return sectionGenres.some(sg => mG.includes(sg));
              });
              sectionMovies = mixupArray([...sectionMovies, ...similarMovies]).slice(0, maxLimit);
            }

            if (sectionMovies.length > 0) {
              renderCarouselSection(secData.Name || sId, sectionMovies);
            }
          }
        }
      } catch (err) {
        console.error("Systems collection fetch error:", err);
      }
    }

    /* ================= RENDER CAROUSEL ================= */
    function renderCarouselSection(sectionTitle, movies, badgeLabel = null) {
      const container = document.getElementById('sectionsContainer');
      const sectionEl = document.createElement('section');
      sectionEl.className = 'section-block';

      sectionEl.innerHTML = `
        <div class="section-header-row" onclick="window.openSectionModal('${encodeURIComponent(sectionTitle)}')">
          <h2 class="section-heading">
            ${sectionTitle}
            ${badgeLabel ? `<span class="section-badge">${badgeLabel}</span>` : ''}
            <i class="fa-solid fa-chevron-right"></i>
          </h2>
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-arrow left"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="carousel-track"></div>
          <button class="carousel-arrow right"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      `;

      window[`sec_cache_${encodeURIComponent(sectionTitle)}`] = movies;

      const track = sectionEl.querySelector('.carousel-track');
      const leftBtn = sectionEl.querySelector('.carousel-arrow.left');
      const rightBtn = sectionEl.querySelector('.carousel-arrow.right');

      movies.forEach(movie => {
        track.appendChild(create16x9Card(movie));
      });

      leftBtn.onclick = () => track.scrollBy({ left: -480, behavior: 'smooth' });
      rightBtn.onclick = () => track.scrollBy({ left: 480, behavior: 'smooth' });

      container.appendChild(sectionEl);
    }

    /* ================= 16:9 CARD (CLEAN: NO LOGOS, NO RATINGS) ================= */
    function create16x9Card(movie) {
      const card = document.createElement('div');
      card.className = 'card-16-9';

      const title = movie.Name || movie.Title || movie.id;
      const poster = getPosterH(movie);
      const genres = parseGenres(movie.Genres).map(g => g.charAt(0).toUpperCase() + g.slice(1)).join(' • ') || movie.Language || 'Movie';

      card.onclick = () => {
        window.location.href = `preview.html?watch=${encodeURIComponent(movie.id)}`;
      };

      card.innerHTML = `
        <div class="card-thumb-wrap">
          <img class="main-thumb" src="${poster}" alt="${title}" loading="lazy"/>
          <div class="card-play-hover">
            <div class="card-play-btn-circle"><i class="fa-solid fa-play"></i></div>
          </div>
        </div>
        <div class="card-details">
          <div class="card-title">${title}</div>
          <div class="card-subtext">${genres}</div>
        </div>
      `;

      return card;
    }

    /* ================= SECTION MODAL VIEW WITH GENRE CHIPS ================= */
    window.openSectionModal = function(encodedKey) {
      const movies = window[`sec_cache_${encodedKey}`] || [];
      const title = decodeURIComponent(encodedKey);

      document.getElementById('modalSectionTitle').innerText = title;
      const pillsRow = document.getElementById('modalGenrePillsRow');
      const grid = document.getElementById('modalGridMovies');

      // Extract unique genres dynamically from the movies in this section
      const uniqueSectionGenres = Array.from(new Set(
        movies.flatMap(m => parseGenres(m.Genres).map(g => g.charAt(0).toUpperCase() + g.slice(1)))
      )).filter(Boolean);

      pillsRow.innerHTML = `
        <div class="genre-chip active" onclick="window.filterModalMovies(this, 'all', '${encodedKey}')">All</div>
        ${uniqueSectionGenres.map(g => `
          <div class="genre-chip" onclick="window.filterModalMovies(this, '${g}', '${encodedKey}')">${g}</div>
        `).join('')}
      `;

      grid.innerHTML = '';
      movies.forEach(movie => {
        grid.appendChild(create16x9Card(movie));
      });

      document.getElementById('sectionViewModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    window.filterModalMovies = function(chipEl, genreName, encodedKey) {
      document.querySelectorAll('#modalGenrePillsRow .genre-chip').forEach(c => c.classList.remove('active'));
      chipEl.classList.add('active');

      const movies = window[`sec_cache_${encodedKey}`] || [];
      const grid = document.getElementById('modalGridMovies');
      grid.innerHTML = '';

      const filtered = genreName === 'all'
        ? movies
        : movies.filter(m => parseGenres(m.Genres).includes(genreName.toLowerCase()));

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 40px; color: var(--text-muted); text-align:center;">No titles available in ${genreName}.</div>`;
        return;
      }

      filtered.forEach(movie => {
        grid.appendChild(create16x9Card(movie));
      });
    };

    document.getElementById('closeSectionModalBtn').onclick = () => {
      document.getElementById('sectionViewModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    };

    // Initialize Real-Time Listeners
    window.addEventListener('hashchange', () => {
      updateActiveProfileState();
      renderUserNavPill();
      buildLiveFeed();
    });

    syncRealtimeUARM();
    syncRealtimeMovies();
  </script>
