<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Space | Watch Movies, Shows & Live TV</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f1015;
      --card-bg: #161822;
      --accent: #e50914;
      --accent-blue: #0072ef;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 80px; /* Space for mobile nav */
    }

    /* ================= HEADER / TOP NAVBAR ================= */
    .navbar {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 68px;
      padding: 0 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      background: rgba(15, 16, 21, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .brand-logo {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .brand-logo span { color: var(--accent); }

    .nav-links {
      display: flex;
      gap: 22px;
      list-style: none;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s ease;
      position: relative;
    }

    .nav-link:hover, .nav-link.active {
      color: #fff;
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 4px 12px 4px 6px;
      border-radius: 24px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #232733;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    /* ================= MAIN CONTENT ================= */
    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 4% 40px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      width: fit-content;
      gap: 10px;
      transition: opacity 0.2s;
    }
    .section-header-row:hover { opacity: 0.85; }

    .section-heading {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-heading i.fa-chevron-right {
      font-size: 13px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }
    .section-header-row:hover i.fa-chevron-right {
      transform: translateX(4px);
      color: #fff;
    }

    .section-badge {
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 114, 239, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 114, 239, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* ================= 16:9 CAROUSEL & CARDS ================= */
    .carousel-wrapper {
      position: relative;
    }

    .carousel-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .card-16-9 {
      flex: 0 0 240px;
      width: 240px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card-16-9:hover {
      transform: scale(1.03);
    }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9; /* 16:9 Aspect Ratio */
      border-radius: 8px;
      overflow: hidden;
      background: #141721;
      border: 1px solid var(--border-color);
    }
    .card-thumb-wrap img.main-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge-rating-pill {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      color: #ffc107;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .badge-logo-overlay {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      object-fit: contain;
      background: rgba(0,0,0,0.65);
      border-radius: 4px;
      padding: 2px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .card-play-hover {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .card-16-9:hover .card-play-hover {
      opacity: 1;
    }
    .card-play-btn-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .card-details {
      padding: 8px 2px 0;
    }
    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    .card-subtext {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Carousel Nav Arrows */
    .carousel-arrow {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 16, 21, 0.85);
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .carousel-wrapper:hover .carousel-arrow { opacity: 1; }
    .carousel-arrow.left { left: -14px; }
    .carousel-arrow.right { right: -14px; }
    .carousel-arrow:hover { background: var(--accent); }

    /* ================= SECTION DETAILS FULL-PAGE MODAL ================= */
    .section-modal-page {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-dark);
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px 4% 60px;
    }
    .section-modal-page.active { display: flex; }

    .modal-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-title-box {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .btn-close-modal {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-page-title {
      font-size: 24px;
      font-weight: 800;
    }

    .modal-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    /* ================= MOBILE BOTTOM NAVIGATION ================= */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 16, 21, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      z-index: 2000;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
    }

    .nav-item-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      width: 25%;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .nav-item-btn svg, .nav-item-btn i {
      font-size: 18px;
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .nav-item-btn.active, .nav-item-btn:hover {
      color: #fff;
    }
    .nav-item-btn.active svg, .nav-item-btn.active i {
      color: var(--accent);
      fill: var(--accent);
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .mobile-bottom-nav { display: flex; }
      .card-16-9 { flex: 0 0 190px; width: 190px; }
      .carousel-arrow { display: none; }
    }
  </style>
</head>
<body>

  <!-- Mobile Bottom Navigation Bar (Home, Search, Download, My Space) -->
  <nav class="mobile-bottom-nav">

  <!-- FIREBASE ENGINE & RECOMMENDATION ENGINE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDoc, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const channelConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };
    const app = initializeApp(channelConfig);
    const db = getFirestore(app);

    // Active User Authentication Data
    let currentUser = null;
    try {
      const stored = localStorage.getItem('active_user') || localStorage.getItem('UARM');
      if (stored) currentUser = JSON.parse(stored);
    } catch(e) {}

    renderAuthNav();

    function renderAuthNav() {
      const slot = document.getElementById('navAuthSlot');
      if (currentUser) {
        const name = currentUser["First Name"] || "User";
        const pfp = currentUser["Profile_Picture"] || currentUser["Profile Picture"];
        slot.innerHTML = `
          <div class="user-pill" title="${currentUser["Email"] || ''}">
            ${pfp ? `<img src="${pfp}" class="user-avatar" />` : `<div class="user-avatar">${name.charAt(0)}</div>`}
            <span>${name}</span>
          </div>
        `;
      }
    }

    // Helpers
    function safeUrl(url) {
      if (!url) return '';
      return url.trim().replace(/^http:\/\//i, 'https://');
    }

    // 16:9 Landscape Poster Resolver
    function getPosterH(c) {
      if (!c) return 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800';
      return safeUrl(
        c["Poster.h"] || 
        c.Poster_h || 
        c.Banner || 
        c.banner || 
        c["Poster.v"] || 
        c.Poster || 
        c.Logo || 
        'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'
      );
    }

    function parseGenres(field) {
      if (!field) return [];
      if (Array.isArray(field)) return field.map(g => String(g).trim().toLowerCase()).filter(Boolean);
      if (typeof field === 'string') return field.split(/[,/|•]+/).map(g => g.trim().toLowerCase()).filter(Boolean);
      return [String(field).trim().toLowerCase()];
    }

    function mixupArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    /* ================= RELEVANCE SCORER FROM VIDEO PLAYER ================= */
    function computeRelevanceScore(target, candidate) {
      if (!target || !candidate) return 1;
      let score = 1;

      const targetGenres = parseGenres(target.Genres || target.Genre);
      const candGenres = parseGenres(candidate.Genres || candidate.Genre);
      targetGenres.forEach(g => {
        if (candGenres.some(cg => cg === g || cg.includes(g) || g.includes(cg))) score += 35;
      });

      const targetStudio = (target.Partner || target.Studio || '').toLowerCase().trim();
      const candStudio = (candidate.Partner || candidate.Studio || '').toLowerCase().trim();
      if (targetStudio && candStudio && (targetStudio === candStudio || candStudio.includes(targetStudio))) {
        score += 20;
      }

      const targetLang = (target.Language || '').toLowerCase().trim();
      const candLang = (candidate.Language || '').toLowerCase().trim();
      if (targetLang && candLang && targetLang === candLang) {
        score += 15;
      }

      return score;
    }

    /* ================= EXTRACT WATCHED MOVIE FROM MEMORY ================= */
    function getRecentlyWatchedMovieIds() {
      if (!currentUser || !Array.isArray(currentUser["Memory.ent"])) return [];
      let watchedIds = [];
      for (const item of currentUser["Memory.ent"]) {
        if (typeof item === 'object' && item !== null) {
          for (const key of Object.keys(item)) {
            if (key.toLowerCase().includes("recently watched") && key.toLowerCase().includes("movie")) {
              const val = item[key];
              if (typeof val === 'string') {
                watchedIds = val.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
              } else if (Array.isArray(val)) {
                watchedIds = val.map(s => String(s).trim().toLowerCase());
              }
            }
          }
        }
      }
      return watchedIds;
    }

    /* ================= MAIN CONTROLLER ================= */
    async function loadPage() {
      const pageId = window.location.hash.replace('#', '').trim().toLowerCase() || 'movies';
      
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.hash === pageId);
      });

      const container = document.getElementById('sectionsContainer');
      container.innerHTML = `
        <div style="text-align: center; padding: 60px; color: var(--text-muted);">
          <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i>
          <p style="margin-top:12px;">Loading feeds...</p>
        </div>
      `;

      try {
        // 1. Fetch entire movies pool for recommendation engine
        const moviesSnap = await getDocs(collection(db, "Movies"));
        const moviesMap = new Map();
        const allMovies = [];

        moviesSnap.forEach(d => {
          const item = { id: d.id, ...d.data() };
          moviesMap.set(d.id.toLowerCase(), item);
          allMovies.push(item);
        });

        container.innerHTML = "";

        // 2. Add Feature 5: "Because You Watched <Name>"
        const watchedIds = getRecentlyWatchedMovieIds();
        if (watchedIds.length > 0) {
          const lastWatchedId = watchedIds[0];
          const anchorMovie = moviesMap.get(lastWatchedId);

          if (anchorMovie) {
            const rankedSimilar = allMovies
              .filter(m => m.id.toLowerCase() !== anchorMovie.id.toLowerCase())
              .map(m => ({ movie: m, score: computeRelevanceScore(anchorMovie, m) }))
              .filter(s => s.score > 20)
              .sort((a, b) => b.score - a.score)
              .map(s => s.movie);

            if (rankedSimilar.length > 0) {
              renderCarouselSection(
                `Because You Watched ${anchorMovie.Name || anchorMovie.Title || 'this'}`,
                rankedSimilar.slice(0, 15),
                "Recommendation"
              );
            }
          }
        }

        // 3. Add Feature 2: "For You" Smart Feed
        let forYouMovies = [];
        if (watchedIds.length > 0) {
          const watchedGenres = new Set();
          watchedIds.forEach(id => {
            const m = moviesMap.get(id);
            if (m) parseGenres(m.Genres).forEach(g => watchedGenres.add(g));
          });

          forYouMovies = allMovies.filter(m => {
            if (watchedIds.includes(m.id.toLowerCase())) return false;
            const mG = parseGenres(m.Genres);
            return Array.from(watchedGenres).some(g => mG.includes(g));
          });
        }
        if (forYouMovies.length < 5) {
          forYouMovies = mixupArray(allMovies);
        }
        renderCarouselSection("For You", mixupArray(forYouMovies).slice(0, 20), "Curated");

        // 4. Fetch Page Definition from Systems (e.g. Systems/movies)
        const pageDoc = await getDoc(doc(db, "Systems", pageId));
        if (pageDoc.exists()) {
          const sectionIds = pageDoc.data().Sections || [];

          for (const sId of sectionIds) {
            const secSnap = await getDoc(doc(db, "Systems", sId));
            if (!secSnap.exists()) continue;

            const secData = secSnap.data();
            const isFixed = String(secData.Fixed).toLowerCase() === "true";
            const maxLimit = parseInt(secData.Max_Limit || "50", 10);
            const sectionGenres = parseGenres(secData.Genres);

            let sectionMovies = [];

            // Explicit Mandatory Titles
            const explicitTitles = Array.isArray(secData.Titles) ? secData.Titles : [];
            for (const tId of explicitTitles) {
              const movie = moviesMap.get(String(tId).trim().toLowerCase());
              if (movie && !sectionMovies.some(m => m.id === movie.id)) {
                sectionMovies.push(movie);
              }
            }

            // Fixed == False: blend similar genres
            if (!isFixed) {
              const similarMovies = allMovies.filter(m => {
                if (sectionMovies.some(sm => sm.id === m.id)) return false;
                const mG = parseGenres(m.Genres);
                return sectionGenres.some(sg => mG.some(mg => mg.includes(sg) || sg.includes(mg)));
              });
              sectionMovies = mixupArray([...sectionMovies, ...similarMovies]).slice(0, maxLimit);
            }

            if (sectionMovies.length > 0) {
              renderCarouselSection(secData.Name || sId, sectionMovies);
            }
          }
        }

      } catch(err) {
        console.error("Feed error:", err);
        container.innerHTML = `<div style="text-align:center; padding:40px; color:#ff5252;">Failed to load feed. Check connectivity and permissions.</div>`;
      }
    }

    /* ================= RENDER HORIZONTAL CAROUSEL ================= */
    function renderCarouselSection(sectionTitle, movies, badgeLabel = null) {
      const container = document.getElementById('sectionsContainer');
      const sectionEl = document.createElement('section');
      sectionEl.className = 'section-block';

      sectionEl.innerHTML = `
        <div class="section-header-row" onclick="window.openSectionModal('${encodeURIComponent(sectionTitle)}')">
          <h2 class="section-heading">
            ${sectionTitle}
            ${badgeLabel ? `<span class="section-badge">${badgeLabel}</span>` : ''}
            <i class="fa-solid fa-chevron-right"></i>
          </h2>
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-arrow left"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="carousel-track"></div>
          <button class="carousel-arrow right"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      `;

      // Store in memory for full-page modal view
      window[`sec_cache_${encodeURIComponent(sectionTitle)}`] = movies;

      const track = sectionEl.querySelector('.carousel-track');
      const leftBtn = sectionEl.querySelector('.carousel-arrow.left');
      const rightBtn = sectionEl.querySelector('.carousel-arrow.right');

      movies.forEach(movie => {
        track.appendChild(create16x9CardElement(movie));
      });

      leftBtn.onclick = () => track.scrollBy({ left: -480, behavior: 'smooth' });
      rightBtn.onclick = () => track.scrollBy({ left: 480, behavior: 'smooth' });

      container.appendChild(sectionEl);
    }

    /* ================= 16:9 CARD CREATOR (FEATURE 1 & 3) ================= */
    function create16x9CardElement(movie) {
      const card = document.createElement('div');
      card.className = 'card-16-9';

      const title = movie.Name || movie.Title || movie.id;
      const poster = getPosterH(movie);
      const rating = movie.Rating || "8.5";
      const genres = parseGenres(movie.Genres).join(', ') || movie.Language || 'Movie';
      const logo = safeUrl(movie["Logo.png"] || movie.Logo || '');

      // Point 3: Redirection URL -> preview.html?watch=<id>
      card.onclick = () => {
        window.location.href = `preview.html?watch=${encodeURIComponent(movie.id)}`;
      };

      card.innerHTML = `
        <div class="card-thumb-wrap">
          <img class="main-thumb" src="${poster}" alt="${title}" loading="lazy"/>
          <div class="badge-rating-pill"><i class="fa-solid fa-star"></i> ${rating}</div>
          ${logo ? `<img class="badge-logo-overlay" src="${logo}" alt="Logo" loading="lazy"/>` : ''}
          <div class="card-play-hover">
            <div class="card-play-btn-circle"><i class="fa-solid fa-play"></i></div>
          </div>
        </div>
        <div class="card-details">
          <div class="card-title">${title}</div>
          <div class="card-subtext">${genres}</div>
        </div>
      `;

      return card;
    }

    /* ================= SECTION FULL-PAGE MODAL (FEATURE 4) ================= */
    window.openSectionModal = function(encodedKey) {
      const movies = window[`sec_cache_${encodedKey}`] || [];
      const title = decodeURIComponent(encodedKey);

      document.getElementById('modalSectionTitle').innerText = title;
      const grid = document.getElementById('modalGridMovies');
      grid.innerHTML = '';

      movies.forEach(movie => {
        grid.appendChild(create16x9CardElement(movie));
      });

      document.getElementById('sectionViewModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    document.getElementById('closeSectionModalBtn').onclick = () => {
      document.getElementById('sectionViewModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    };

    window.addEventListener('hashchange', loadPage);
    loadPage();
  </script>
</body>
</html>
