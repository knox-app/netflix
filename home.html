<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Space | OTT Platform</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: #131722;
      --accent: #e50914;
      --accent-blue: #0072ef;
      --badge-magenta: #9d0208;
      --badge-top10: #d00000;
      --text-main: #ffffff;
      --text-muted: #8b92a5;
      --pill-bg: #1a1f2c;
      --pill-border: rgba(255, 255, 255, 0.12);
      --pill-active-bg: #2b3244;
      --border-color: rgba(255, 255, 255, 0.08);
      --transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 85px;
    }

    /* ================= TOP NAVBAR ================= */
    .navbar {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 68px;
      padding: 0 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      background: rgba(10, 12, 16, 0.95);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .brand-logo {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .brand-logo span { color: var(--accent); }

    .nav-links {
      display: flex;
      gap: 20px;
      list-style: none;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
    }
    .nav-link:hover, .nav-link.active { color: #fff; }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
    }

    /* Profile Capsule Button */
    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 5px 14px 5px 6px;
      border-radius: 24px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #232733;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
    }

    .kids-indicator {
      font-size: 10px;
      background: #ffaa00;
      color: #000;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 10px;
      text-transform: uppercase;
    }

    /* Profile Switcher Popover */
    .profile-switcher-dropdown {
      position: absolute;
      top: 55px;
      right: 0;
      width: 240px;
      background: #141722;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      z-index: 1050;
    }
    .profile-switcher-dropdown.show { display: flex; }
    .profile-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .profile-item:hover, .profile-item.active { background: rgba(255, 255, 255, 0.08); }
    .profile-item .p-name { font-size: 13px; font-weight: 600; flex: 1; }

    /* ================= MAIN CONTAINER ================= */
    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 4% 40px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      width: fit-content;
      gap: 10px;
    }
    .section-header-row:hover .section-heading { color: #ffffff; }

    .section-heading {
      font-size: 20px;
      font-weight: 800;
      color: #f1f3f7;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: -0.3px;
    }
    .section-heading i {
      font-size: 13px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }
    .section-header-row:hover i { transform: translateX(4px); color: #fff; }

    /* ================= 16:9 HORIZONTAL CAROUSEL ================= */
    .carousel-wrapper { position: relative; }
    .carousel-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .card-16-9 {
      flex: 0 0 240px;
      width: 240px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: var(--transition);
    }
    .card-16-9:hover { transform: scale(1.03); }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #141721;
      border: 1px solid var(--border-color);
    }
    .card-thumb-wrap img.main-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-details { padding: 8px 2px 0; }
    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    .card-subtext {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .carousel-arrow {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(10, 12, 16, 0.85);
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .carousel-wrapper:hover .carousel-arrow { opacity: 1; }
    .carousel-arrow.left { left: -14px; }
    .carousel-arrow.right { right: -14px; }
    .carousel-arrow:hover { background: var(--accent); }

    /* ================= GENRE FILTER PILLS SETUP (IMAGE 2 STYLE) ================= */
    .genre-filter-setup {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 10px 0;
    }

    .pill-tabs-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 6px;
    }
    .pill-tabs-row::-webkit-scrollbar { display: none; }

    .genre-pill-btn {
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
      user-select: none;
    }
    .genre-pill-btn:hover { background: #242b3d; }
    .genre-pill-btn.active {
      background: var(--pill-active-bg);
      border-color: #55607a;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    /* Portrait Poster Cards for Image 2 style setup */
    .portrait-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .portrait-card {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      background: #141721;
      aspect-ratio: 2 / 3;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: 1px solid var(--border-color);
    }
    .portrait-card:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .portrait-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Badges as shown in Image 2 */
    .badge-top10 {
      position: absolute;
      top: 6px;
      right: 6px;
      background: linear-gradient(135deg, #e50914 0%, #b5179e 100%);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      line-height: 1.1;
      text-align: center;
      padding: 3px 5px;
      border-radius: 4px;
      text-transform: uppercase;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      pointer-events: none;
    }
    .badge-top10 span { display: block; font-size: 11px; }

    .bottom-tag-pill {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      pointer-events: none;
    }
    .bottom-tag-pill.hindi {
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #ffaa00;
      color: #ffaa00;
    }
    .bottom-tag-pill.newly-added {
      background: #7209b7;
      color: #ffffff;
    }

    /* ================= SECTION FULL-PAGE MODAL (IMAGE 2 DESIGN) ================= */
    .section-modal-page {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-dark);
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px 4% 80px;
    }
    .section-modal-page.active { display: flex; }

    .modal-nav-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .btn-back-modal {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
    }
    .modal-page-title {
      font-size: 26px;
      font-weight: 800;
    }

    /* ================= MOBILE BOTTOM NAVIGATION ================= */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(10, 12, 16, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      z-index: 2000;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
    }

    .nav-item-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      width: 25%;
      cursor: pointer;
      transition: color 0.15s ease;
    }
    .nav-item-btn svg, .nav-item-btn i {
      font-size: 18px;
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .nav-item-btn.active, .nav-item-btn:hover { color: #fff; }
    .nav-item-btn.active svg, .nav-item-btn.active i {
      color: var(--accent);
      fill: var(--accent);
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .mobile-bottom-nav { display: flex; }
      .card-16-9 { flex: 0 0 190px; width: 190px; }
      .carousel-arrow { display: none; }
      .portrait-grid { grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="javascript:void(0)" onclick="navigateToPage('movies')" class="brand-logo">
        <i class="fa-solid fa-play-circle" style="color:var(--accent);"></i>
        My<span>Space</span>
      </a>
      <ul class="nav-links">
        <li><a class="nav-link" data-hash="movies" onclick="navigateToPage('movies')">Movies</a></li>
        <li><a class="nav-link" data-hash="shows" onclick="navigateToPage('shows')">Shows</a></li>
        <li><a class="nav-link" data-hash="tvshows" onclick="navigateToPage('tvshows')">TV Shows</a></li>
        <li><a class="nav-link" data-hash="livetv" onclick="navigateToPage('livetv')">Live TV</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <div id="navAuthSlot"></div>
      <!-- Profile Switcher Dropdown -->
      <div class="profile-switcher-dropdown" id="profileDropdown"></div>
    </div>
  </header>

  <!-- Main Feed Container -->
  <main class="main-container" id="sectionsContainer">
    <div style="text-align: center; padding: 80px 0; color: var(--text-muted);">
      <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i>
      <p style="margin-top:12px;">Loading personalized catalog...</p>
    </div>
  </main>

  <!-- Section Full View Modal (Image 2 Style) -->
  <div class="section-modal-page" id="sectionViewModal">
    <div class="modal-nav-header">
      <button class="btn-back-modal" id="closeSectionModalBtn">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h2 class="modal-page-title" id="modalSectionTitle">Popular Movies</h2>
    </div>
    <!-- Filter Pills Row -->
    <div class="pill-tabs-row" id="modalPillTabs"></div>
    <!-- Portrait Cards Grid -->
    <div class="portrait-grid" id="modalPortraitGrid" style="margin-top: 18px;"></div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-nav">
    <a href="javascript:void(0)" onclick="navigateToPage('movies')" class="nav-item-btn active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="search.html" class="nav-item-btn">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>Search</span>
    </a>
    <a href="downloads.html" class="nav-item-btn">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <span>Download</span>
    </a>
    <a href="javascript:void(0)" onclick="toggleProfileDropdown()" class="nav-item-btn">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>My Space</span>
    </a>
  </nav>

  <!-- FIREBASE MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDoc, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const channelConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };
    const app = initializeApp(channelConfig);
    const db = getFirestore(app);

    // Genres Specified
    const ADULT_GENRES = [
      "Romance", "Drama", "Family", "Comedy", "Mythology", "Crime", "Action", "Teen", 
      "Biopic", "Sci-Fi", "Horror", "Kids", "Anime", "Thriller", "Adventure", "Nature", 
      "Animals", "Animation", "Fantasy", "Historic", "Superhero", "Musical", "Mystery"
    ];

    const KIDS_GENRES = [
      "Superhero", "Princess", "Fairy Tale", "Family", "Comedy", "Mythology", "Action", 
      "Biopic", "Kids", "Anime", "Adventure", "Nature", "Animals", "Animation", "Historic", "Musical"
    ];

    // Profile state & URL parsing: home.html#movies&user#0
    let currentUserDoc = null;
    let activeProfileIndex = 0;
    let isKidsProfile = false;

    function parseHashParams() {
      const hash = window.location.hash.replace(/^#/, '');
      let page = 'movies';
      let userIdx = 0;

      if (hash) {
        const parts = hash.split('&');
        parts.forEach(part => {
          if (part.startsWith('user#')) {
            userIdx = parseInt(part.replace('user#', '')) || 0;
          } else if (part.startsWith('user=')) {
            userIdx = parseInt(part.replace('user=', '')) || 0;
          } else if (!part.includes('#') && !part.includes('=')) {
            page = part.toLowerCase();
          }
        });
      }
      return { page, userIdx };
    }

    window.navigateToPage = function(pageName) {
      window.location.hash = `${pageName}&user#${activeProfileIndex}`;
    };

    function loadUserProfile() {
      try {
        const raw = localStorage.getItem('active_user') || localStorage.getItem('UARM');
        if (raw) currentUserDoc = JSON.parse(raw);
      } catch(e) {}

      const { userIdx } = parseHashParams();
      activeProfileIndex = userIdx;

      // Extract Profiles Array from user document
      if (currentUserDoc && Array.isArray(currentUserDoc.Profiles) && currentUserDoc.Profiles[activeProfileIndex]) {
        const p = currentUserDoc.Profiles[activeProfileIndex];
        // Check Kids flag
        isKidsProfile = String(p.Kids).toLowerCase() === "true";
      } else {
        isKidsProfile = currentUserDoc?.Type === "Kids";
      }

      renderAuthNav();
    }

    function renderAuthNav() {
      const slot = document.getElementById('navAuthSlot');
      const dropdown = document.getElementById('profileDropdown');

      if (!currentUserDoc) {
        slot.innerHTML = `<a href="1.html" class="user-pill"><i class="fa-solid fa-user"></i><span>Sign In</span></a>`;
        return;
      }

      const profiles = currentUserDoc.Profiles || [{
        Name: currentUserDoc["First Name"] || "User",
        Avatar: currentUserDoc["Profile_Picture"],
        Kids: isKidsProfile ? "True" : "False"
      }];

      const currentP = profiles[activeProfileIndex] || profiles[0];
      const pName = currentP.Name || "User";
      const pAvatar = currentP.Avatar;

      slot.innerHTML = `
        <div class="user-pill" onclick="window.toggleProfileDropdown()">
          ${pAvatar ? `<img src="${pAvatar}" class="user-avatar" />` : `<div class="user-avatar">${pName.charAt(0)}</div>`}
          <span>${pName}</span>
          ${isKidsProfile ? `<span class="kids-indicator">Kids</span>` : ''}
          <i class="fa-solid fa-chevron-down" style="font-size:10px; color:var(--text-muted);"></i>
        </div>
      `;

      dropdown.innerHTML = profiles.map((p, idx) => `
        <div class="profile-item ${idx === activeProfileIndex ? 'active' : ''}" onclick="window.switchProfile(${idx})">
          ${p.Avatar ? `<img src="${p.Avatar}" class="user-avatar" />` : `<div class="user-avatar">${(p.Name || 'U').charAt(0)}</div>`}
          <span class="p-name">${p.Name}</span>
          ${String(p.Kids).toLowerCase() === 'true' ? `<span class="kids-indicator">Kids</span>` : ''}
        </div>
      `).join('');
    }

    window.toggleProfileDropdown = function() {
      const dd = document.getElementById('profileDropdown');
      dd.classList.toggle('show');
    };

    window.switchProfile = function(idx) {
      document.getElementById('profileDropdown').classList.remove('show');
      const { page } = parseHashParams();
      window.location.hash = `${page}&user#${idx}`;
    };

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.nav-right')) {
        document.getElementById('profileDropdown')?.classList.remove('show');
      }
    });

    // Content Filtering by Profile Type
    function passesProfileFilter(movie) {
      if (!isKidsProfile) {
        // If Kids=False: there is no Age_Rating restriction!
        return true;
      }
      // If Kids=True: strictly check for kid-safe movies
      const age = String(movie.Age_Rating || '').toLowerCase();
      const genres = parseGenres(movie.Genres);
      const isAdultRated = age.includes('16') || age.includes('18') || age.includes('a ') || age === 'a';
      if (isAdultRated) return false;

      const hasKidFriendlyAge = age.includes('u') || age.includes('7+') || age.includes('all') || age === '';
      const hasKidGenre = genres.some(g => ['kids', 'animation', 'family', 'adventure', 'superhero', 'disney'].includes(g));
      return hasKidFriendlyAge || hasKidGenre;
    }

    function safeUrl(url) {
      if (!url) return '';
      return url.trim().replace(/^http:\/\//i, 'https://');
    }

    function getPosterH(c) {
      return safeUrl(
        c["Poster.h"] || c.Poster_h || c.Banner || c.banner || 
        c["Poster.v"] || c.Poster || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'
      );
    }

    function getPosterV(c) {
      return safeUrl(
        c["Poster.v"] || c.Poster || c["Poster.h"] || c.Banner || 
        'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400'
      );
    }

    function parseGenres(field) {
      if (!field) return [];
      if (Array.isArray(field)) return field.map(g => String(g).trim().toLowerCase()).filter(Boolean);
      if (typeof field === 'string') return field.split(/[,/|•]+/).map(g => g.trim().toLowerCase()).filter(Boolean);
      return [String(field).trim().toLowerCase()];
    }

    function mixupArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function computeRelevanceScore(target, candidate) {
      if (!target || !candidate) return 1;
      let score = 1;

      const targetGenres = parseGenres(target.Genres);
      const candGenres = parseGenres(candidate.Genres);
      targetGenres.forEach(g => {
        if (candGenres.some(cg => cg === g || cg.includes(g))) score += 40;
      });

      const targetStudio = (target.Partner || target.Studio || '').toLowerCase().trim();
      const candStudio = (candidate.Partner || candidate.Studio || '').toLowerCase().trim();
      if (targetStudio && candStudio && targetStudio === candStudio) score += 20;

      const targetLang = (target.Language || '').toLowerCase().trim();
      const candLang = (candidate.Language || '').toLowerCase().trim();
      if (targetLang && candLang && targetLang === candLang) score += 15;

      return score;
    }

    function getRecentlyWatchedMovieIds() {
      if (!currentUserDoc || !Array.isArray(currentUserDoc["Memory.ent"])) return [];
      let watchedIds = [];
      for (const item of currentUserDoc["Memory.ent"]) {
        if (typeof item === 'object' && item !== null) {
          for (const key of Object.keys(item)) {
            if (key.toLowerCase().includes("recently watched") && key.toLowerCase().includes("movie")) {
              const val = item[key];
              if (typeof val === 'string') {
                watchedIds = val.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
              } else if (Array.isArray(val)) {
                watchedIds = val.map(s => String(s).trim().toLowerCase());
              }
            }
          }
        }
      }
      return watchedIds;
    }

    /* ================= MAIN LOAD PAGE ================= */
    async function loadPage() {
      loadUserProfile();

      const { page } = parseHashParams();
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.hash === page);
      });

      const container = document.getElementById('sectionsContainer');
      container.innerHTML = `
        <div style="text-align: center; padding: 60px; color: var(--text-muted);">
          <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i>
          <p style="margin-top:12px;">Curating content...</p>
        </div>
      `;

      try {
        const moviesSnap = await getDocs(collection(db, "Movies"));
        const moviesMap = new Map();
        let allMovies = [];

        moviesSnap.forEach(d => {
          const item = { id: d.id, ...d.data() };
          // Apply Profile restriction
          if (passesProfileFilter(item)) {
            moviesMap.set(d.id.toLowerCase(), item);
            allMovies.push(item);
          }
        });

        container.innerHTML = "";
        let renderedSectionCount = 0;

        // 1. "Because You Watched <Name>"
        const watchedIds = getRecentlyWatchedMovieIds();
        if (watchedIds.length > 0) {
          const lastWatchedId = watchedIds[0];
          const anchorMovie = moviesMap.get(lastWatchedId);

          if (anchorMovie) {
            const rankedSimilar = allMovies
              .filter(m => m.id.toLowerCase() !== anchorMovie.id.toLowerCase())
              .map(m => ({ movie: m, score: computeRelevanceScore(anchorMovie, m) }))
              .filter(s => s.score > 20)
              .sort((a, b) => b.score - a.score)
              .map(s => s.movie);

            if (rankedSimilar.length > 0) {
              renderCarouselSection(
                `Because You Watched ${anchorMovie.Name || anchorMovie.Title || 'this'}`,
                rankedSimilar.slice(0, 15)
              );
              renderedSectionCount++;
            }
          }
        }

        // 2. High-Accuracy "For You" Section
        let forYouMovies = [];
        if (watchedIds.length > 0) {
          const watchedGenres = new Set();
          watchedIds.forEach(id => {
            const m = moviesMap.get(id);
            if (m) parseGenres(m.Genres).forEach(g => watchedGenres.add(g));
          });

          forYouMovies = allMovies
            .filter(m => !watchedIds.includes(m.id.toLowerCase()))
            .map(m => {
              const mG = parseGenres(m.Genres);
              let score = 0;
              watchedGenres.forEach(g => { if (mG.includes(g)) score += 25; });
              return { movie: m, score };
            })
            .sort((a, b) => b.score - a.score)
            .map(s => s.movie);
        }
        if (forYouMovies.length < 6) {
          forYouMovies = mixupArray(allMovies);
        }
        renderCarouselSection("For You", forYouMovies.slice(0, 20));
        renderedSectionCount++;

        // 3. Page Sections from Systems Collection
        const pageDoc = await getDoc(doc(db, "Systems", page));
        if (pageDoc.exists()) {
          const sectionIds = pageDoc.data().Sections || [];

          for (const sId of sectionIds) {
            const secSnap = await getDoc(doc(db, "Systems", sId));
            if (!secSnap.exists()) continue;

            const secData = secSnap.data();
            const isFixed = String(secData.Fixed).toLowerCase() === "true";
            const maxLimit = parseInt(secData.Max_Limit || "50", 10);
            const sectionGenres = parseGenres(secData.Genres);

            let sectionMovies = [];

            // Titles
            const explicitTitles = Array.isArray(secData.Titles) ? secData.Titles : [];
            for (const tId of explicitTitles) {
              const movie = moviesMap.get(String(tId).trim().toLowerCase());
              if (movie && !sectionMovies.some(m => m.id === movie.id)) {
                sectionMovies.push(movie);
              }
            }

            // Fixed == False: blend similar
            if (!isFixed) {
              const similarMovies = allMovies.filter(m => {
                if (sectionMovies.some(sm => sm.id === m.id)) return false;
                const mG = parseGenres(m.Genres);
                return sectionGenres.some(sg => mG.some(mg => mg.includes(sg) || sg.includes(mg)));
              });
              sectionMovies = mixupArray([...sectionMovies, ...similarMovies]).slice(0, maxLimit);
            }

            if (sectionMovies.length > 0) {
              renderCarouselSection(secData.Name || sId, sectionMovies);
              renderedSectionCount++;

              // Update 4: Insert Image 2 style Genre Filter Setup after 4-5 sections
              if (renderedSectionCount === 4) {
                renderInFeedGenreSetup(allMovies);
              }
            }
          }
        }

        // If fewer than 4 sections were in DB, ensure the Genre Explorer still displays
        if (renderedSectionCount < 4) {
          renderInFeedGenreSetup(allMovies);
        }

      } catch(err) {
        console.error("Page load error:", err);
        container.innerHTML = `<div style="text-align:center; padding:40px; color:#ff5252;">Failed to load feed. Check connection.</div>`;
      }
    }

    /* ================= 16:9 CAROUSEL RENDERER ================= */
    function renderCarouselSection(sectionTitle, movies) {
      const container = document.getElementById('sectionsContainer');
      const sectionEl = document.createElement('section');
      sectionEl.className = 'section-block';

      sectionEl.innerHTML = `
        <div class="section-header-row" onclick="window.openSectionModal('${encodeURIComponent(sectionTitle)}')">
          <h2 class="section-heading">
            ${sectionTitle}
            <i class="fa-solid fa-chevron-right"></i>
          </h2>
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-arrow left"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="carousel-track"></div>
          <button class="carousel-arrow right"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      `;

      // Cache for full modal view
      window[`cache_${encodeURIComponent(sectionTitle)}`] = movies;

      const track = sectionEl.querySelector('.carousel-track');
      const leftBtn = sectionEl.querySelector('.carousel-arrow.left');
      const rightBtn = sectionEl.querySelector('.carousel-arrow.right');

      movies.forEach(movie => {
        track.appendChild(create16x9Card(movie));
      });

      leftBtn.onclick = () => track.scrollBy({ left: -480, behavior: 'smooth' });
      rightBtn.onclick = () => track.scrollBy({ left: 480, behavior: 'smooth' });

      container.appendChild(sectionEl);
    }

    // 16:9 Card: Clean design with No Logo and No Rating
    function create16x9Card(movie) {
      const card = document.createElement('div');
      card.className = 'card-16-9';

      const title = movie.Name || movie.Title || movie.id;
      const poster = getPosterH(movie);
      const genres = parseGenres(movie.Genres).join(', ') || movie.Language || 'Movie';

      card.onclick = () => {
        window.location.href = `preview.html?watch=${encodeURIComponent(movie.id)}`;
      };

      card.innerHTML = `
        <div class="card-thumb-wrap">
          <img class="main-thumb" src="${poster}" alt="${title}" loading="lazy"/>
        </div>
        <div class="card-details">
          <div class="card-title">${title}</div>
          <div class="card-subtext">${genres}</div>
        </div>
      `;
      return card;
    }

    /* ================= GENRE EXPLORER (IMAGE 2 STYLE) ================= */
    function renderInFeedGenreSetup(allMovies) {
      const container = document.getElementById('sectionsContainer');
      const setupEl = document.createElement('section');
      setupEl.className = 'genre-filter-setup';

      const genresList = isKidsProfile ? KIDS_GENRES : ADULT_GENRES;

      setupEl.innerHTML = `
        <h2 class="section-heading" style="font-size: 22px;">Popular Movies</h2>
        <div class="pill-tabs-row" id="feedGenrePills">
          ${genresList.map((g, idx) => `
            <button class="genre-pill-btn ${idx === 0 ? 'active' : ''}" onclick="window.filterFeedGenre('${g}', this)">${g}</button>
          `).join('')}
        </div>
        <div class="portrait-grid" id="feedGenreGrid"></div>
      `;

      container.appendChild(setupEl);
      window.feedAllMovies = allMovies;
      window.filterFeedGenre(genresList[0]);
    }

    window.filterFeedGenre = function(genreName, btnEl) {
      if (btnEl) {
        document.querySelectorAll('#feedGenrePills .genre-pill-btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
      }

      const grid = document.getElementById('feedGenreGrid');
      const target = genreName.toLowerCase();
      
      const filtered = window.feedAllMovies.filter(m => {
        return parseGenres(m.Genres).some(g => g.includes(target) || target.includes(g));
      });

      renderPortraitGrid(grid, filtered.slice(0, 12));
    };

    /* ================= SECTION MODAL VIEW (IMAGE 2 DESIGN) ================= */
    window.openSectionModal = function(encodedTitle) {
      const title = decodeURIComponent(encodedTitle);
      const movies = window[`cache_${encodedTitle}`] || [];
      const genresList = isKidsProfile ? KIDS_GENRES : ADULT_GENRES;

      document.getElementById('modalSectionTitle').innerText = title;
      const pillsHost = document.getElementById('modalPillTabs');
      const grid = document.getElementById('modalPortraitGrid');

      // Populate Genre Pills
      pillsHost.innerHTML = `
        <button class="genre-pill-btn active" onclick="window.filterModalMovies('all', this)">All</button>
        ${genresList.map(g => `<button class="genre-pill-btn" onclick="window.filterModalMovies('${g}', this)">${g}</button>`).join('')}
      `;

      window.modalActiveMovies = movies;
      renderPortraitGrid(grid, movies);

      document.getElementById('sectionViewModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    window.filterModalMovies = function(genre, btn) {
      document.querySelectorAll('#modalPillTabs .genre-pill-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const grid = document.getElementById('modalPortraitGrid');
      if (genre === 'all') {
        renderPortraitGrid(grid, window.modalActiveMovies);
        return;
      }

      const target = genre.toLowerCase();
      const filtered = window.modalActiveMovies.filter(m => {
        return parseGenres(m.Genres).some(g => g.includes(target) || target.includes(g));
      });
      renderPortraitGrid(grid, filtered);
    };

    document.getElementById('closeSectionModalBtn').onclick = () => {
      document.getElementById('sectionViewModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    };

    // Portrait Cards Builder (Matches Image 2 badges and removes ratings/logos)
    function renderPortraitGrid(container, movies) {
      container.innerHTML = '';
      if (movies.length === 0) {
        container.innerHTML = `<div style="grid-column: 1/-1; padding: 40px; text-align: center; color: var(--text-muted);">No titles available in this category.</div>`;
        return;
      }

      movies.forEach((movie, index) => {
        const card = document.createElement('div');
        card.className = 'portrait-card';

        card.onclick = () => {
          window.location.href = `preview.html?watch=${encodeURIComponent(movie.id)}`;
        };

        const isTop10 = index < 3;
        const isHindi = (movie.Language || '').toLowerCase().includes('hindi');

        card.innerHTML = `
          <img src="${getPosterV(movie)}" alt="${movie.Name || 'Movie'}" loading="lazy"/>
          ${isTop10 ? `<div class="badge-top10">TOP<span>10</span></div>` : ''}
          ${isHindi ? `<div class="bottom-tag-pill hindi">NOW IN HINDI</div>` : `<div class="bottom-tag-pill newly-added">NEWLY ADDED</div>`}
        `;
        container.appendChild(card);
      });
    }

    window.addEventListener('hashchange', loadPage);
    loadPage();
  </script>
</body>
