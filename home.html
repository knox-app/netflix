<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CinemaStream</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-base: #0a0e17;
      --bg-surface: #121824;
      --bg-card: #182030;
      --accent-blue: #0072d2;
      --text-main: #f1f5f9;
      --text-muted: #8e9bb5;
      --border-line: rgba(255, 255, 255, 0.08);
      --card-radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-base); color: var(--text-main); overflow-x: hidden; min-height: 100vh; }

    /* NAVBAR */
    nav {
      position: fixed; top: 0; left: 0; right: 0; height: 68px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 3rem;
      background: rgba(10, 14, 23, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-line);
      z-index: 1000;
    }

    .nav-left { display: flex; align-items: center; gap: 2.5rem; }
    .brand-logo { font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 0.5rem; }
    .brand-logo i { color: var(--accent-blue); }

    .nav-links { display: flex; list-style: none; gap: 1.2rem; }
    .nav-links a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 600; text-transform: capitalize; transition: 0.2s; padding: 0.3rem 0.6rem; border-radius: 4px; }
    .nav-links a:hover, .nav-links a.active { color: #fff; background: rgba(255, 255, 255, 0.08); }

    .search-box { position: relative; }
    .search-box input { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-line); border-radius: 20px; padding: 0.45rem 1rem 0.45rem 2.2rem; color: #fff; font-size: 0.85rem; outline: none; width: 220px; transition: 0.3s; }
    .search-box input:focus { width: 280px; border-color: var(--accent-blue); }
    .search-box i { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.85rem; }

    /* HERO SLIDER */
    .hero-carousel { position: relative; height: 70vh; min-height: 450px; width: 100%; overflow: hidden; margin-top: 68px; }
    .hero-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; background-size: cover; background-position: center top; display: flex; align-items: flex-end; padding: 0 3.5rem 4rem; }
    .hero-slide.active { opacity: 1; z-index: 2; }
    .hero-overlay { position: absolute; inset: 0; background: linear-gradient(0deg, var(--bg-base) 10%, rgba(10, 14, 23, 0.5) 50%, rgba(10, 14, 23, 0.2) 100%), linear-gradient(90deg, var(--bg-base) 0%, rgba(10, 14, 23, 0.85) 45%, transparent 100%); }
    .hero-content { position: relative; z-index: 3; max-width: 650px; }
    .hero-meta { display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.6rem; }
    .hero-meta .badge { background: rgba(255, 255, 255, 0.15); color: #fff; padding: 0.2rem 0.5rem; border-radius: 4px; }
    .hero-title { font-size: 2.6rem; font-weight: 800; line-height: 1.15; margin-bottom: 0.6rem; text-transform: capitalize; }
    .hero-desc { font-size: 0.9rem; line-height: 1.45; color: #cbd5e1; margin-bottom: 1.2rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    .hero-actions { display: flex; gap: 0.8rem; }
    
    .btn-play { background: #fff; color: #000; border: none; padding: 0.7rem 1.6rem; border-radius: var(--card-radius); font-size: 0.95rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.5rem; transition: 0.2s; }
    .btn-play:hover { background: rgba(255, 255, 255, 0.85); transform: scale(1.03); }
    .btn-watchlist { background: rgba(255, 255, 255, 0.15); color: #fff; border: none; padding: 0.7rem 1.2rem; border-radius: var(--card-radius); font-size: 0.95rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(8px); display: flex; align-items: center; gap: 0.5rem; }

    /* CONTENT TRAYS */
    .content-container { padding: 1.5rem 3rem 4rem; display: flex; flex-direction: column; gap: 2.2rem; }
    .tray { position: relative; }
    .tray-title { font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 0.75rem; }
    .carousel-wrapper { position: relative; }
    .movie-carousel { display: flex; gap: 1rem; overflow-x: auto; scroll-behavior: smooth; padding: 0.4rem 0; scrollbar-width: none; }
    .movie-carousel::-webkit-scrollbar { display: none; }

    .tray-btn { position: absolute; top: 50%; transform: translateY(-50%); width: 40px; height: 75%; background: rgba(10, 14, 23, 0.75); border: none; color: #fff; font-size: 1.4rem; cursor: pointer; z-index: 20; border-radius: 4px; opacity: 0; transition: 0.25s; display: flex; align-items: center; justify-content: center; }
    .carousel-wrapper:hover .tray-btn { opacity: 1; }
    .tray-btn:hover { background: var(--accent-blue); }
    .tray-btn.prev { left: -1rem; }
    .tray-btn.next { right: -1rem; }

    /* MOVIE CARD */
    .movie-card { flex: 0 0 240px; border-radius: var(--card-radius); background: var(--bg-card); overflow: hidden; cursor: pointer; transition: transform 0.25s, box-shadow 0.25s; border: 1px solid var(--border-line); }
    .movie-card:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6); z-index: 10; border-color: rgba(255, 255, 255, 0.25); }
    .card-banner { width: 100%; aspect-ratio: 16 / 9; background: #1c2436; position: relative; }
    .card-banner img { width: 100%; height: 100%; object-fit: cover; }
    .card-details { padding: 0.75rem; display: flex; flex-direction: column; gap: 0.25rem; }
    .card-title { font-size: 0.9rem; font-weight: 700; text-transform: capitalize; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-info { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; }
    .card-actions-hover { position: absolute; top: 0.5rem; right: 0.5rem; opacity: 0; transition: 0.2s; }
    .movie-card:hover .card-actions-hover { opacity: 1; }
    .action-icon-btn { width: 30px; height: 30px; border-radius: 50%; background: rgba(10, 14, 23, 0.85); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 2rem; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--bg-surface); border-radius: 12px; max-width: 900px; width: 100%; overflow: hidden; border: 1px solid var(--border-line); }
    .modal-header { padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-line); }
    .modal-close { background: transparent; border: none; color: #fff; font-size: 1.25rem; cursor: pointer; }
    .player-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #000; }
    .player-wrapper iframe, .player-wrapper video { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- NAVBAR WITH DYNAMIC PAGES -->
  <nav>
    <div class="nav-left">
      <a href="home.html#home" class="brand-logo">
        <i class="fa-solid fa-play"></i> CinemaStream
      </a>
      <ul class="nav-links" id="dynamicNavLinks">
        <!-- Injected via JS from Firestore Pages collection -->
      </ul>
    </div>

    <div class="nav-right">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search movies..." />
      </div>
    </div>
  </nav>

  <!-- HERO TOP CAROUSEL -->
  <section class="hero-carousel" id="heroSlider"></section>

  <!-- CONTENT TRAYS -->
  <main class="content-container" id="contentContainer">
    <div style="text-align: center; padding: 3rem; color: var(--text-muted);">
      <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
      <p style="margin-top: 1rem;">Loading content...</p>
    </div>
  </main>

  <!-- VIDEO MODAL -->
  <div class="modal-overlay" id="streamModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Playing</h3>
        <button class="modal-close" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="player-wrapper" id="playerWrapper"></div>
    </div>
  </div>

  <!-- JAVASCRIPT & FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // State
    let allMovies = [];
    let allSystems = [];
    let allPages = [];
    let currentHeroIndex = 0;
    let heroTimer = null;

    // Local Storage helpers
    const getWatchlist = () => JSON.parse(localStorage.getItem('user_watchlist') || '[]');
    const saveWatchlist = (list) => localStorage.setItem('user_watchlist', JSON.stringify(list));
    const getHistory = () => JSON.parse(localStorage.getItem('user_history') || '[]');
    const addToHistory = (id) => {
      let h = getHistory().filter(x => x !== id);
      h.unshift(id);
      localStorage.setItem('user_history', JSON.stringify(h.slice(0, 15)));
    };

    // DOM Elements
    const heroSlider = document.getElementById("heroSlider");
    const contentContainer = document.getElementById("contentContainer");
    const dynamicNavLinks = document.getElementById("dynamicNavLinks");
    const searchInput = document.getElementById("searchInput");
    const streamModal = document.getElementById("streamModal");
    const modalTitle = document.getElementById("modalTitle");
    const playerWrapper = document.getElementById("playerWrapper");

    // Fetch Base Data
    async function init() {
      try {
        const [moviesSnap, systemsSnap, pagesSnap] = await Promise.all([
          getDocs(collection(db, "Movies")),
          getDocs(collection(db, "Systems")),
          getDocs(collection(db, "Pages"))
        ]);

        allMovies = [];
        moviesSnap.forEach(d => {
          const data = d.data();
          allMovies.push({
            id: d.id,
            name: data.Name || "Untitled",
            banner: data.Banner || "https://placehold.co/600x400/182030/8e9bb5?text=No+Poster",
            description: data.Discription || data.Description || "",
            franchise: data.Franchise || "",
            genres: data.Genres ? (Array.isArray(data.Genres) ? data.Genres : data.Genres.split(',').map(s => s.trim())) : [],
            rating: data.Rating || "N/A",
            ageRating: data.Age_Rating || "U/A",
            stream: data.Stream || "",
            tags: data.Tags || ""
          });
        });

        allSystems = [];
        systemsSnap.forEach(d => allSystems.push({ id: d.id, ...d.data() }));

        allPages = [];
        pagesSnap.forEach(d => allPages.push({ id: d.id, ...d.data() }));

        buildNavbar();
        handleRoute();
      } catch (e) {
        console.error("Init Error:", e);
      }
    }

    // Dynamic Navbar Links based on Firestore Pages
    function buildNavbar() {
      dynamicNavLinks.innerHTML = `<li><a href="#home" id="nav-home">Home</a></li>`;
      allPages.forEach(p => {
        if (p.id !== 'home') {
          dynamicNavLinks.innerHTML += `<li><a href="#${p.id}" id="nav-${p.id}">${p.Title || p.id}</a></li>`;
        }
      });
    }

    // Hash Route Listener
    window.addEventListener("hashchange", handleRoute);

    async function handleRoute() {
      const activeSlug = window.location.hash.slice(1) || 'home';

      // Update Nav active style
      document.querySelectorAll(".nav-links a").forEach(a => {
        a.classList.toggle("active", a.getAttribute("href") === `#${activeSlug}`);
      });

      // Find Page Config
      const activePage = allPages.find(p => p.id === activeSlug);
      
      let assignedSystemIds = [];
      if (activePage && activePage.Sections) {
        assignedSystemIds = activePage.Sections;
      } else if (activeSlug === 'home') {
        // Default home loads all systems if none specifically set
        assignedSystemIds = allSystems.map(s => s.id);
      }

      const activeSystems = allSystems.filter(s => assignedSystemIds.includes(s.id));
      renderPage(activeSystems);
    }

    // Render Page UI
    function renderPage(systemsToRender) {
      renderHeroCarousel();
      contentContainer.innerHTML = "";

      // 1. Continue Watching
      const histIds = getHistory();
      if (histIds.length > 0) {
        const histMovies = histIds.map(id => allMovies.find(m => m.id === id)).filter(Boolean);
        if (histMovies.length > 0) createTray("Continue Watching", histMovies);
      }

      // 2. Watchlist
      const watchIds = getWatchlist();
      if (watchIds.length > 0) {
        const watchMovies = watchIds.map(id => allMovies.find(m => m.id === id)).filter(Boolean);
        if (watchMovies.length > 0) createTray("My Watchlist", watchMovies);
      }

      // 3. Render the Selected Systems Sections
      if (systemsToRender.length > 0) {
        systemsToRender.forEach(sys => {
          const matching = allMovies.filter(m => {
            const matchesFranchise = !sys.Franchise || m.franchise.toLowerCase() === sys.Franchise.toLowerCase();
            const sysGenres = Array.isArray(sys.Genres) ? sys.Genres : (sys.Genres ? [sys.Genres] : []);
            const matchesGenre = sysGenres.length === 0 || m.genres.some(g => sysGenres.includes(g));
            return matchesFranchise && matchesGenre;
          }).slice(0, parseInt(sys.Max_Limit || "20", 10));

          if (matching.length > 0) {
            createTray(sys.Name || sys.id, matching);
          }
        });
      } else {
        // Fallback row
        createTray("Featured Movies", allMovies);
      }
    }

    // Hero Carousel
    function renderHeroCarousel() {
      const featured = allMovies.slice(0, 5);
      if (featured.length === 0) return;

      heroSlider.innerHTML = featured.map((m, idx) => `
        <div class="hero-slide ${idx === 0 ? 'active' : ''}" style="background-image: url('${m.banner}')">
          <div class="hero-overlay"></div>
          <div class="hero-content">
            <div class="hero-meta">
              <span class="badge">${m.ageRating}</span>
              <span>${m.franchise}</span>
              <span>•</span>
              <span style="color:#ffd700"><i class="fa-solid fa-star"></i> ${m.rating}</span>
            </div>
            <h1 class="hero-title">${m.name}</h1>
            <p class="hero-desc">${m.description}</p>
            <div class="hero-actions">
              <button class="btn-play" onclick="window.playMovie('${m.id}')"><i class="fa-solid fa-play"></i> Watch Now</button>
              <button class="btn-watchlist" onclick="window.toggleWatchlist('${m.id}')"><i class="fa-solid ${getWatchlist().includes(m.id) ? 'fa-check' : 'fa-plus'}"></i> Watchlist</button>
            </div>
          </div>
        </div>
      `).join('');

      if (heroTimer) clearInterval(heroTimer);
      heroTimer = setInterval(() => {
        currentHeroIndex = (currentHeroIndex + 1) % featured.length;
        document.querySelectorAll(".hero-slide").forEach((s, i) => s.classList.toggle("active", i === currentHeroIndex));
      }, 5000);
    }

    // Helper: Create Horizontal Carousel Tray
    function createTray(title, list) {
      const trayId = "tray_" + Math.random().toString(36).substr(2, 9);
      const div = document.createElement("div");
      div.className = "tray";
      div.innerHTML = `
        <h2 class="tray-title">${title}</h2>
        <div class="carousel-wrapper">
          <button class="tray-btn prev" onclick="document.getElementById('${trayId}').scrollBy({left: -600, behavior:'smooth'})"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="movie-carousel" id="${trayId}">
            ${list.map(m => `
              <div class="movie-card" onclick="window.playMovie('${m.id}')">
                <div class="card-banner">
                  <img src="${m.banner}" alt="${m.name}" loading="lazy" />
                  <div class="card-actions-hover" onclick="event.stopPropagation()">
                    <button class="action-icon-btn" onclick="window.toggleWatchlist('${m.id}')">
                      <i class="fa-solid ${getWatchlist().includes(m.id) ? 'fa-check' : 'fa-plus'}"></i>
                    </button>
                  </div>
                </div>
                <div class="card-details">
                  <h4 class="card-title">${m.name}</h4>
                  <div class="card-info">
                    <span>${m.franchise || 'General'}</span>
                    <span style="color:#ffd700"><i class="fa-solid fa-star"></i> ${m.rating}</span>
                  </div>
                </div>
              </div>
            `).join('')}
          </div>
          <button class="tray-btn next" onclick="document.getElementById('${trayId}').scrollBy({left: 600, behavior:'smooth'})"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      `;
      contentContainer.appendChild(div);
    }

    // Watch Movie & Modal
    window.playMovie = (id) => {
      const m = allMovies.find(x => x.id === id);
      if (!m) return;
      addToHistory(id);
      modalTitle.textContent = m.name;
      
      if (m.stream.includes(".mp4")) {
        playerWrapper.innerHTML = `<video controls autoplay style="width:100%;height:100%;"><source src="${m.stream}" type="video/mp4"></video>`;
      } else if (m.stream) {
        playerWrapper.innerHTML = `<iframe src="${m.stream}" allowfullscreen allow="autoplay"></iframe>`;
      } else {
        playerWrapper.innerHTML = `<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#fff;">Stream not available</div>`;
      }

      streamModal.classList.add("active");
      handleRoute();
    };

    window.toggleWatchlist = (id) => {
      let w = getWatchlist();
      w = w.includes(id) ? w.filter(x => x !== id) : [...w, id];
      saveWatchlist(w);
      handleRoute();
    };

    document.getElementById("modalCloseBtn").onclick = () => {
      streamModal.classList.remove("active");
      playerWrapper.innerHTML = "";
    };

    searchInput.addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) { handleRoute(); return; }
      const res = allMovies.filter(m => m.name.toLowerCase().includes(q) || m.tags.toLowerCase().includes(q));
      contentContainer.innerHTML = "";
      createTray(`Results for "${q}"`, res);
    });

    init();
  </script>
</body>
</html>
