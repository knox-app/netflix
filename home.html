<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OTT Stream</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }
    body {
      background-color: #0f1014;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      overflow-x: hidden;
    }

    /* Top Navigation Header */
    .nav-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      z-index: 20;
      display: flex;
      align-items: center;
      padding: 0 40px;
      background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
    }
    .nav-title {
      font-size: 24px;
      font-weight: 800;
      color: #e50914;
      letter-spacing: 1px;
    }

    /* Hero Carousel */
    .hero-container {
      position: relative;
      width: 100%;
      height: 80vh;
      min-height: 520px;
      overflow: hidden;
      background-color: #000;
    }
    .hero-slider {
      display: flex;
      height: 100%;
      transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }
    .hero-slide {
      min-width: 100%;
      height: 100%;
      position: relative;
      background-size: cover;
      background-position: center top;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(15,16,20,0.95) 0%, rgba(15,16,20,0.6) 40%, rgba(15,16,20,0) 70%),
                  linear-gradient(0deg, rgba(15,16,20,1) 0%, rgba(15,16,20,0) 40%);
    }
    .hero-content {
      position: absolute;
      bottom: 12%;
      left: 40px;
      max-width: 600px;
      z-index: 5;
    }
    .hero-logo {
      max-width: 280px;
      max-height: 120px;
      object-fit: contain;
      margin-bottom: 14px;
      display: block;
    }
    .hero-title-fallback {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 14px;
    }
    .hero-meta {
      font-size: 15px;
      color: #b3b3b3;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .hero-meta .badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      color: #fff;
    }
    .hero-actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .btn-watch-now {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, background 0.2s;
    }
    .btn-watch-now:hover {
      background: #e6e6e6;
      transform: scale(1.03);
    }
    .btn-watchlist {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.6);
      background: rgba(40,40,40,0.6);
      color: #fff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: all 0.2s;
    }
    .btn-watchlist:hover {
      border-color: #fff;
      background: rgba(255,255,255,0.2);
      transform: scale(1.08);
    }
    .slider-indicators {
      position: absolute;
      bottom: 20px;
      right: 40px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .indicator-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      cursor: pointer;
      transition: all 0.2s;
    }
    .indicator-dot.active {
      width: 24px;
      border-radius: 4px;
      background: #fff;
    }

    /* Sections & Rows */
    .sections-container {
      position: relative;
      margin-top: -20px;
      z-index: 10;
      padding: 0 0 60px 0;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .section-block {
      display: flex;
      flex-direction: column;
    }
    .section-header {
      padding: 0 40px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .section-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .shelf-wrapper {
      position: relative;
    }
    .shelf-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 8px 40px;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    .shelf-scroll::-webkit-scrollbar {
      display: none;
    }
    .content-card {
      flex: 0 0 180px;
      aspect-ratio: 2 / 3;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
      background: #1e222b;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .content-card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 12px 24px rgba(0,0,0,0.8);
    }
    .content-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .content-card .card-info {
      position: absolute;
      bottom: 0;
      inset-inline: 0;
      padding: 24px 8px 8px;
      background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, transparent 100%);
      font-size: 13px;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .hero-container { height: 65vh; }
      .hero-content { left: 20px; bottom: 8%; }
      .hero-title-fallback { font-size: 28px; }
      .hero-logo { max-width: 180px; }
      .nav-header { padding: 0 20px; }
      .section-header, .shelf-scroll { padding-left: 20px; padding-right: 20px; }
      .content-card { flex: 0 0 130px; }
    }
  </style>
</head>
<body>

  <header class="nav-header">
    <div class="nav-title" id="page-nav-title">STREAM</div>
  </header>

  <!-- Carousel Area -->
  <div class="hero-container" id="hero-container">
    <div class="hero-slider" id="hero-slider"></div>
    <div class="slider-indicators" id="slider-indicators"></div>
  </div>

  <!-- Dynamic Sections Area -->
  <main class="sections-container" id="sections-container"></main>

  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentSlide = 0;
    let carouselItems = [];
    let carouselTimer = null;

    // Get page id from hash (e.g., home.html#demo)
    function getTargetPageId() {
      const hash = window.location.hash.replace('#', '').trim();
      return hash || 'demo';
    }

    window.addEventListener('hashchange', () => loadPage(getTargetPageId()));
    window.addEventListener('DOMContentLoaded', () => loadPage(getTargetPageId()));

    async function loadPage(pageId) {
      try {
        const pageDocSnap = await db.collection('Systems').doc(pageId).get();
        if (!pageDocSnap.exists) {
          console.warn(`Page ${pageId} does not exist.`);
          return;
        }

        const pageData = pageDocSnap.data();
        if (pageData.Name) {
          document.getElementById('page-nav-title').textContent = pageData.Name.toUpperCase();
        }

        // 1. Setup Carousel
        await setupCarousel(pageData.Carsoule_Settings);

        // 2. Setup Sections
        await setupSections(pageData.Sections || []);
      } catch (err) {
        console.error("Error loading page:", err);
      }
    }

    /* CAROUSEL LOGIC */
    async function setupCarousel(settings = {}) {
      const contentFrom = settings.Content_From || ['Movies'];
      const ageRating = settings.Age_Rating;
      carouselItems = [];

      for (const collectionName of contentFrom) {
        let query = db.collection(collectionName);
        if (ageRating) {
          query = query.where('Age_Rating', '==', ageRating);
        }
        const snap = await query.limit(6).get();
        snap.forEach(doc => carouselItems.push({ id: doc.id, ...doc.data() }));
      }

      renderCarousel();
      initCarouselTouch();
      startAutoSlide();
    }

    function renderCarousel() {
      const slider = document.getElementById('hero-slider');
      const indicators = document.getElementById('slider-indicators');
      slider.innerHTML = '';
      indicators.innerHTML = '';

      if (carouselItems.length === 0) {
        document.getElementById('hero-container').style.display = 'none';
        return;
      }
      document.getElementById('hero-container').style.display = 'block';

      carouselItems.forEach((item, idx) => {
        const slide = document.createElement('div');
        slide.className = 'hero-slide';
        if (item.Banner) {
          slide.style.backgroundImage = `url('${item.Banner}')`;
        }

        const genresFormatted = Array.isArray(item.Genres) ? item.Genres.join(' • ') : (item.Genres || '');
        const metaList = [
          item.Language,
          item.Age_Rating || item.Rating ? `<span class="badge">${item.Age_Rating || item.Rating}</span>` : '',
          genresFormatted
        ].filter(Boolean).join(' • ');

        slide.innerHTML = `
          <div class="hero-overlay"></div>
          <div class="hero-content">
            ${item.Logo ? `<img src="${item.Logo}" class="hero-logo" alt="${item.Title || ''}" />` : `<h1 class="hero-title-fallback">${item.Title || ''}</h1>`}
            <div class="hero-meta">${metaList}</div>
            <div class="hero-actions">
              <button class="btn-watch-now">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                Watch Now
              </button>
              <button class="btn-watchlist" title="Add to Watchlist">+</button>
            </div>
          </div>
        `;
        slider.appendChild(slide);

        const dot = document.createElement('div');
        dot.className = `indicator-dot ${idx === 0 ? 'active' : ''}`;
        dot.onclick = () => goToSlide(idx);
        indicators.appendChild(dot);
      });

      goToSlide(0);
    }

    function goToSlide(index) {
      currentSlide = (index + carouselItems.length) % carouselItems.length;
      document.getElementById('hero-slider').style.transform = `translateX(-${currentSlide * 100}%)`;
      document.querySelectorAll('.indicator-dot').forEach((d, i) => {
        d.classList.toggle('active', i === currentSlide);
      });
    }

    function startAutoSlide() {
      clearInterval(carouselTimer);
      carouselTimer = setInterval(() => {
        if (carouselItems.length > 1) goToSlide(currentSlide + 1);
      }, 6000);
    }

    // Carousel swipe/touch listeners
    function initCarouselTouch() {
      const container = document.getElementById('hero-container');
      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      container.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        isDragging = true;
        clearInterval(carouselTimer);
      });

      container.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        currentX = e.touches[0].clientX;
      });

      container.addEventListener('touchend', () => {
        if (!isDragging) return;
        const diff = startX - currentX;
        if (Math.abs(diff) > 50) {
          if (diff > 0) goToSlide(currentSlide + 1);
          else goToSlide(currentSlide - 1);
        }
        isDragging = false;
        startAutoSlide();
      });
    }

    /* SECTIONS & ROWS LOGIC */
    async function setupSections(sectionIds) {
      const container = document.getElementById('sections-container');
      container.innerHTML = '';

      for (const secId of sectionIds) {
        const secDocSnap = await db.collection('Systems').doc(secId).get();
        if (!secDocSnap.exists) continue;

        const secData = secDocSnap.data();
        const contentList = await fetchSectionContent(secData);

        if (contentList.length > 0) {
          const sectionElem = createSectionRowElement(secData.Name || secId, contentList);
          container.appendChild(sectionElem);
        }
      }
    }

    async function fetchSectionContent(sectionConfig) {
      const results = [];
      const seenIds = new Set();
      const contentTypes = sectionConfig.Content_Type || ['Movies'];

      // 1. Load explicitly listed Playlist Items
      if (Array.isArray(sectionConfig.Playlist) && sectionConfig.Playlist.length > 0) {
        for (const id of sectionConfig.Playlist) {
          for (const coll of contentTypes) {
            const docSnap = await db.collection(coll).doc(id).get();
            if (docSnap.exists && !seenIds.has(docSnap.id)) {
              seenIds.add(docSnap.id);
              results.push({ id: docSnap.id, ...docSnap.data() });
              break;
            }
          }
        }
      }

      // 2. Query dynamically matching content if Limit is not yet reached
      const maxLimit = parseInt(sectionConfig.Max_Limit, 10) || 20;
      if (results.length < maxLimit) {
        for (const coll of contentTypes) {
          let q = db.collection(coll);

          if (sectionConfig.Age_Rating) {
            q = q.where('Age_Rating', '==', sectionConfig.Age_Rating);
          }
          if (sectionConfig.Franchise) {
            q = q.where('Franchise', '==', sectionConfig.Franchise);
          }
          if (Array.isArray(sectionConfig.Genres) && sectionConfig.Genres.length > 0) {
            q = q.where('Genres', 'array-contains-any', sectionConfig.Genres);
          }

          const snap = await q.limit(maxLimit).get();
          snap.forEach(doc => {
            if (!seenIds.has(doc.id) && results.length < maxLimit) {
              seenIds.add(doc.id);
              results.push({ id: doc.id, ...doc.data() });
            }
          });
        }
      }

      return results;
    }

    function createSectionRowElement(title, items) {
      const section = document.createElement('section');
      section.className = 'section-block';

      const header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `<h2 class="section-title">${title}</h2>`;

      const shelfWrapper = document.createElement('div');
      shelfWrapper.className = 'shelf-wrapper';

      const shelfScroll = document.createElement('div');
      shelfScroll.className = 'shelf-scroll';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'content-card';
        card.innerHTML = `
          <img src="${item.Poster || item.Banner || ''}" alt="${item.Title || ''}" loading="lazy" />
          <div class="card-info">${item.Title || ''}</div>
        `;
        shelfScroll.appendChild(card);
      });

      shelfWrapper.appendChild(shelfScroll);
      section.appendChild(header);
      section.appendChild(shelfWrapper);
      return section;
    }
  </script>
</body>
</html>
