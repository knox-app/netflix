<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Space | Watch Movies, Shows & Live TV</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f1015;
      --card-bg: #161822;
      --accent: #e50914;
      --accent-blue: #0072ef;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(255, 255, 255, 0.25);
      --chip-bg: #1c202d;
      --chip-active: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 85px;
    }

    /* ================= NAVBAR ================= */
    .navbar {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 68px;
      padding: 0 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      background: rgba(15, 16, 21, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
    }

    .nav-left { display: flex; align-items: center; gap: 32px; }

    .brand-logo {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .brand-logo span { color: var(--accent); }

    .nav-links { display: flex; gap: 22px; list-style: none; }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: color 0.2s ease;
      position: relative;
    }
    .nav-link:hover, .nav-link.active { color: #fff; }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .nav-right { display: flex; align-items: center; gap: 16px; position: relative; }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 4px 12px 4px 6px;
      border-radius: 24px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #232733;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }
    .kids-badge {
      font-size: 10px;
      background: #ffaa00;
      color: #000;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* Profile Switcher Dropdown */
    .profile-dropdown {
      position: absolute;
      top: 55px;
      right: 0;
      background: #181b24;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 210px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      display: none;
      flex-direction: column;
      padding: 8px 0;
      z-index: 1005;
    }
    .profile-dropdown.open { display: flex; }
    .profile-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      cursor: pointer;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.15s;
    }
    .profile-item:hover { background: rgba(255, 255, 255, 0.08); }
    .profile-item.active { background: rgba(229, 9, 20, 0.15); color: #ff5252; }

    /* ================= MAIN CONTAINER ================= */
    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 4% 40px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      width: fit-content;
      gap: 10px;
      transition: opacity 0.2s;
    }
    .section-header-row:hover { opacity: 0.85; }

    .section-heading {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-heading i.fa-chevron-right {
      font-size: 13px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }
    .section-header-row:hover i.fa-chevron-right {
      transform: translateX(4px);
      color: #fff;
    }

    .section-badge {
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 114, 239, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 114, 239, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* ================= 16:9 CARDS & CAROUSELS ================= */
    .carousel-wrapper { position: relative; }
    .carousel-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .card-16-9 {
      flex: 0 0 240px;
      width: 240px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card-16-9:hover { transform: scale(1.03); }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #141721;
      border: 1px solid var(--border-color);
    }
    .card-thumb-wrap img.main-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-play-hover {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .card-16-9:hover .card-play-hover { opacity: 1; }
    .card-play-btn-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .card-details { padding: 8px 2px 0; }
    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    .card-subtext {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .carousel-arrow {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 16, 21, 0.85);
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .carousel-wrapper:hover .carousel-arrow { opacity: 1; }
    .carousel-arrow.left { left: -14px; }
    .carousel-arrow.right { right: -14px; }
    .carousel-arrow:hover { background: var(--accent); }

    /* ================= GENRE PILLS / FILTER CHIPS ================= */
    .genre-filter-scroller {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 0 14px;
      scrollbar-width: none;
    }
    .genre-filter-scroller::-webkit-scrollbar { display: none; }

    .genre-chip {
      background: var(--chip-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }
    .genre-chip:hover {
      background: #272d3f;
      color: #fff;
    }
    .genre-chip.active {
      background: #252b3b;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
    }

    /* ================= SECTION DETAILS FULL-PAGE VIEW ================= */
    .section-modal-page {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-dark);
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px 4% 60px;
    }
    .section-modal-page.active { display: flex; }

    .modal-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-title-box { display: flex; align-items: center; gap: 16px; }
    .btn-close-modal {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
    }
    .modal-page-title { font-size: 24px; font-weight: 800; }

    .modal-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 14px;
    }

    /* ================= MOBILE BOTTOM NAV ================= */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 16, 21, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      z-index: 2000;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
    }

    .nav-item-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      width: 25%;
      cursor: pointer;
    }
    .nav-item-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .nav-item-btn.active, .nav-item-btn:hover { color: #fff; }
    .nav-item-btn.active svg { fill: var(--accent); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .mobile-bottom-nav { display: flex; }
      .card-16-9 { flex: 0 0 190px; width: 190px; }
      .carousel-arrow { display: none; }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="home.html#movies" class="brand-logo" id="brandLogoLink">
        <i class="fa-solid fa-play-circle" style="color:var(--accent);"></i>
        My<span>Space</span>
      </a>
      <ul class="nav-links">

  <!-- Main Feed Container -->
  <main class="main-container" id="sectionsContainer">

      <p style="margin-top:12px;">Curating your feed...</p>
    </div>
  </main>

  <!-- Full-Page Section Movies View Modal (Matches Screenshot 2) -->
  <div class="section-modal-page" id="sectionViewModal">
    <div class="modal-nav-header">
      <div class="modal-title-box">
        <button class="btn-close-modal" id="closeSectionModalBtn">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h2 class="modal-page-title" id="modalSectionTitle">Section</h2>
      </div>
    </div>
    <!-- Filter Pills Row inside modal -->
    <div class="genre-filter-scroller" id="modalGenrePillsRow"></div>
    <!-- Movies Grid inside modal -->
    <div class="modal-grid-container" id="modalGridMovies"></div>
  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-nav">
    <a href="home.html#movies" class="nav-item-btn active" id="mNavHome">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="search.html" class="nav-item-btn">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>Search</span>
    </a>
    <a href="downloads.html" class="nav-item-btn">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <span>Download</span>

    <a href="myspace.html" class="nav-item-btn">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>My Space</span>
    </a>
  </nav>

  <!-- FIREBASE ENGINE & RECOMMENDATION ENGINE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDoc, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const channelConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };
    const app = initializeApp(channelConfig);
    const db = getFirestore(app);

    /* ================= GENRE LISTS (FEATURE 4) ================= */
    const ADULT_GENRES = [
      "Romance", "Drama", "Family", "Comedy", "Mythology", "Crime", "Action", "Teen", 
      "Biopic", "Sci-Fi", "Horror", "Kids", "Anime", "Thriller", "Adventure", "Nature", 
      "Animals", "Animation", "Fantasy", "Historic", "Superhero", "Musical", "Mystery"
    ];

    const KIDS_GENRES = [
      "Superhero", "Princess", "Fairy Tale", "Family", "Comedy", "Mythology", 
      "Action", "Biopic", "Kids", "Anime", "Adventure", "Nature", "Animals", 
      "Animation", "Historic", "Musical"
    ];

    // Profile & Authentication State
    let currentUser = null;
    let activeProfileIndex = 0;
    let activeProfile = null;
    let isKidsProfile = false;

    // Helpers
    function safeUrl(url) {
      if (!url) return '';
      return url.trim().replace(/^http:\/\//i, 'https://');
    }

    function getPosterH(c) {
      if (!c) return 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800';
      return safeUrl(
        c["Poster.h"] || c.Poster_h || c.Banner || c.banner || c["Poster.v"] || c.Poster || c.Logo ||
        'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'
      );
    }

    function parseGenres(field) {
      if (!field) return [];
      if (Array.isArray(field)) return field.map(g => String(g).trim().toLowerCase()).filter(Boolean);
      if (typeof field === 'string') return field.split(/[,/|•]+/).map(g => g.trim().toLowerCase()).filter(Boolean);
      return [String(field).trim().toLowerCase()];
    }

    function mixupArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    /* ================= FEATURE 5: MULTI-USER & URL ROUTING ================= */
    // Format: home.html#home&user#0 or home.html#movies&user#1
    function parseRoute() {
      const hash = window.location.hash.replace(/^#/, '');
      let page = 'movies';
      let userIdx = 0;

      const segments = hash.split('&');
      segments.forEach(part => {
        if (part.startsWith('user#')) {
          userIdx = parseInt(part.replace('user#', ''), 10) || 0;
        } else if (part.startsWith('user=')) {
          userIdx = parseInt(part.replace('user=', ''), 10) || 0;
        } else if (part.length > 0 && !part.includes('=')) {
          page = part;
        }
      });
      return { page: page === 'home' ? 'movies' : page, userIdx };
    }

    function setupActiveUserAndProfile() {
      try {
        const stored = localStorage.getItem('active_user') || localStorage.getItem('UARM');
        if (stored) currentUser = JSON.parse(stored);
      } catch(e) {}

      const { userIdx } = parseRoute();
      activeProfileIndex = userIdx;

      if (currentUser && Array.isArray(currentUser.Profiles) && currentUser.Profiles.length > userIdx) {
        activeProfile = currentUser.Profiles[userIdx];
      } else if (currentUser && Array.isArray(currentUser.Profiles) && currentUser.Profiles.length > 0) {
        activeProfile = currentUser.Profiles[0];
        activeProfileIndex = 0;
      } else if (currentUser) {
        activeProfile = {
          Name: currentUser["First Name"] || "User",
          Avatar: currentUser["Profile_Picture"] || "",
          Kids: currentUser["Type"] === "Kids" ? "True" : "False"
        };
      }

      // Read Kids flag (handle both string "True"/"False" and boolean)
      isKidsProfile = String(activeProfile?.Kids).toLowerCase() === "true";

      renderUserNav();
    }

    function renderUserNav() {
      const slot = document.getElementById('navAuthSlot');
      const dropdown = document.getElementById('profileDropdown');

      if (!currentUser) {
        slot.innerHTML = `
          <a href="1.html" class="user-pill">
            <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
            <span>Sign In</span>
          </a>
        `;
        return;
      }

      const pName = activeProfile?.Name || currentUser["First Name"] || "User";
      const pAvatar = activeProfile?.Avatar || currentUser["Profile_Picture"];

      slot.innerHTML = `
        <div class="user-pill" id="userPillBtn">
          ${pAvatar ? `<img src="${pAvatar}" class="user-avatar" />` : `<div class="user-avatar">${pName.charAt(0)}</div>`}
          <span>${pName}</span>
          ${isKidsProfile ? `<span class="kids-badge">Kids</span>` : ''}
          <i class="fa-solid fa-chevron-down" style="font-size:10px; margin-left:4px; opacity:0.6;"></i>
        </div>
      `;

      // Build Profile dropdown options
      if (Array.isArray(currentUser.Profiles)) {
        dropdown.innerHTML = currentUser.Profiles.map((p, idx) => {
          const isK = String(p.Kids).toLowerCase() === "true";
          return `
            <div class="profile-item ${idx === activeProfileIndex ? 'active' : ''}" onclick="window.switchUserProfile(${idx})">
              <div class="user-avatar" style="width:24px; height:24px;">${p.Name.charAt(0)}</div>
              <span>${p.Name}</span>
              ${isK ? `<span class="kids-badge" style="margin-left:auto;">Kids</span>` : ''}
            </div>
          `;
        }).join('');
      }

      document.getElementById('userPillBtn').onclick = (e) => {
        e.stopPropagation();
        dropdown.classList.toggle('open');
      };
    }

    document.addEventListener('click', () => {
      document.getElementById('profileDropdown')?.classList.remove('open');
    });

    window.switchUserProfile = function(idx) {
      const { page } = parseRoute();
      window.location.hash = `${page}&user#${idx}`;
      document.getElementById('profileDropdown').classList.remove('open');
    };

    /* ================= FEATURE 5: CONTENT FILTERING ================= */
    // If Kids=False -> no Age_Rating restriction.
    // If Kids=True  -> filter content strictly by kids age ratings & family genres.
    function filterMovieByProfile(movie) {
      if (!isKidsProfile) return true; // No Age_Rating restriction for Kids=False

      const age = String(movie.Age_Rating || '').toUpperCase();
      const genres = parseGenres(movie.Genres);

      // Safe ratings for Kids profile
      const isKidsRating = age.includes("U") || age.includes("7+") || age.includes("G") || age.includes("TV-Y");
      const isKidsGenre = genres.some(g => ["animation", "kids", "family", "children", "cartoon", "disney"].includes(g));

      return isKidsRating || isKidsGenre;
    }

    /* ================= EXTRACT WATCHED MOVIE IDS ================= */
    function getRecentlyWatchedMovieIds() {
      if (!currentUser || !Array.isArray(currentUser["Memory.ent"])) return [];
      let watchedIds = [];
      for (const item of currentUser["Memory.ent"]) {
        if (typeof item === 'object' && item !== null) {
          for (const key of Object.keys(item)) {
            if (key.toLowerCase().includes("recently watched") && key.toLowerCase().includes("movie")) {
              const val = item[key];
              if (typeof val === 'string') {
                watchedIds = val.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
              } else if (Array.isArray(val)) {
                watchedIds = val.map(s => String(s).trim().toLowerCase());
              }
            }
          }
        }
      }
      return watchedIds;
    }

    /* ================= FEATURE 1: ADVANCED "FOR YOU" RECOMMENDATION ================= */
    function computeAdvancedForYou(allMovies, watchedIds, moviesMap) {
      const unwatched = allMovies.filter(m => !watchedIds.includes(m.id.toLowerCase()));
      if (watchedIds.length === 0) return mixupArray(unwatched).slice(0, 20);

      // 1. Calculate frequency weight of genres from watched history
      const genreWeights = {};
      const studioWeights = {};
      const languageWeights = {};

      watchedIds.forEach((id, recencyIdx) => {
        const m = moviesMap.get(id);
        if (!m) return;
        // Higher weight for recently watched titles
        const recencyMultiplier = Math.max(1, 5 - recencyIdx);

        parseGenres(m.Genres).forEach(g => {
          genreWeights[g] = (genreWeights[g] || 0) + (10 * recencyMultiplier);
        });

        const studio = (m.Studio || m.Partner || '').toLowerCase().trim();
        if (studio) studioWeights[studio] = (studioWeights[studio] || 0) + (5 * recencyMultiplier);

        const lang = (m.Language || '').toLowerCase().trim();
        if (lang) languageWeights[lang] = (languageWeights[lang] || 0) + (3 * recencyMultiplier);
      });

      // 2. Score candidate titles
      const scored = unwatched.map(movie => {
        let score = 0;
        const mGenres = parseGenres(movie.Genres);
        mGenres.forEach(g => {
          if (genreWeights[g]) score += genreWeights[g];
        });

        const studio = (movie.Studio || movie.Partner || '').toLowerCase().trim();
        if (studio && studioWeights[studio]) score += studioWeights[studio];

        const lang = (movie.Language || '').toLowerCase().trim();
        if (lang && languageWeights[lang]) score += languageWeights[lang];

        // Random jitter (1-10) to keep the carousel fresh on reload
        score += Math.random() * 10;
        return { movie, score };
      });

      scored.sort((a, b) => b.score - a.score);
      return scored.slice(0, 20).map(s => s.movie);
    }

    /* ================= MAIN CONTROLLER ================= */
    async function loadPage() {
      setupActiveUserAndProfile();
      const { page } = parseRoute();

      // Update Nav Link highlighting
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.hash === page);
      });

      const container = document.getElementById('sectionsContainer');
      container.innerHTML = `
        <div style="text-align: center; padding: 60px; color: var(--text-muted);">
          <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i>
          <p style="margin-top:12px;">Curating ${isKidsProfile ? 'Kids' : ''} feed...</p>
        </div>
      `;

      try {
        // Fetch all movies from Firestore
        const moviesSnap = await getDocs(collection(db, "Movies"));
        const moviesMap = new Map();
        let allMovies = [];

        moviesSnap.forEach(d => {
          const item = { id: d.id, ...d.data() };
          moviesMap.set(d.id.toLowerCase(), item);
          allMovies.push(item);
        });

        // Apply Kids / Profile filter
        allMovies = allMovies.filter(filterMovieByProfile);

        container.innerHTML = "";

        const watchedIds = getRecentlyWatchedMovieIds();
        let sectionCount = 0;

        // 1. "Because You Watched <Name>"
        if (watchedIds.length > 0) {
          const lastWatchedId = watchedIds[0];
          const anchorMovie = moviesMap.get(lastWatchedId);

          if (anchorMovie) {
            const anchorGenres = parseGenres(anchorMovie.Genres);
            const anchorStudio = (anchorMovie.Studio || anchorMovie.Partner || '').toLowerCase().trim();

            const similar = allMovies
              .filter(m => m.id.toLowerCase() !== anchorMovie.id.toLowerCase())
              .filter(m => {
                const mG = parseGenres(m.Genres);
                const hasGenre = anchorGenres.some(g => mG.includes(g));
                const hasStudio = anchorStudio && (m.Studio || m.Partner || '').toLowerCase().includes(anchorStudio);
                return hasGenre || hasStudio;
              });

            if (similar.length > 0) {
              renderCarouselSection(
                `Because You Watched ${anchorMovie.Name || anchorMovie.Title || 'this'}`,
                mixupArray(similar).slice(0, 15),
                "Recommendation"
              );
              sectionCount++;
            }
          }
        }

        // 2. Enhanced "For You" Feed (Feature 1)
        const forYouMovies = computeAdvancedForYou(allMovies, watchedIds, moviesMap);
        if (forYouMovies.length > 0) {
          renderCarouselSection("For You", forYouMovies, "Personalized");
          sectionCount++;
        }

        // 3. Sections defined in Systems (e.g. Systems/movies)
        const pageDoc = await getDoc(doc(db, "Systems", page));
        if (pageDoc.exists()) {
          const sectionIds = pageDoc.data().Sections || [];

          for (const sId of sectionIds) {
            const secSnap = await getDoc(doc(db, "Systems", sId));
            if (!secSnap.exists()) continue;

            const secData = secSnap.data();
            const isFixed = String(secData.Fixed).toLowerCase() === "true";
            const maxLimit = parseInt(secData.Max_Limit || "50", 10);
            const sectionGenres = parseGenres(secData.Genres);

            let sectionMovies = [];

            // Explicit Mandatory Titles
            const explicitTitles = Array.isArray(secData.Titles) ? secData.Titles : [];
            for (const tId of explicitTitles) {
              const movie = moviesMap.get(String(tId).trim().toLowerCase());
              if (movie && filterMovieByProfile(movie) && !sectionMovies.some(m => m.id === movie.id)) {
                sectionMovies.push(movie);
              }
            }

            // Fixed == False: Mix in similar genres
            if (!isFixed) {
              const similarMovies = allMovies.filter(m => {
                if (sectionMovies.some(sm => sm.id === m.id)) return false;
                const mG = parseGenres(m.Genres);
                return sectionGenres.some(sg => mG.some(mg => mg.includes(sg) || sg.includes(mg)));
              });
              sectionMovies = mixupArray([...sectionMovies, ...similarMovies]).slice(0, maxLimit);
            }

            if (sectionMovies.length > 0) {
              renderCarouselSection(secData.Name || sId, sectionMovies);
              sectionCount++;

              // ==========================================
              // FEATURE 4: INSERT POPULAR GENRE SETUP AFTER 4-5 SECTIONS
              // ==========================================
              if (sectionCount === 4) {
                renderPopularGenreSetup(allMovies);
              }
            }
          }
        }

        // If total sections were less than 4, append Genre Setup at bottom
        if (sectionCount < 4) {
          renderPopularGenreSetup(allMovies);
        }

      } catch(err) {
        console.error("Feed error:", err);
        container.innerHTML = `<div style="text-align:center; padding:40px; color:#ff5252;">Failed to load feed. Check connectivity and permissions.</div>`;
      }
    }

    /* ================= FEATURE 4: POPULAR MOVIES BY GENRE SETUP ================= */
    function renderPopularGenreSetup(allMovies) {
      const container = document.getElementById('sectionsContainer');
      const genreSetupEl = document.createElement('section');
      genreSetupEl.className = 'section-block';

      // Pick genres list depending on Kids profile
      const activeGenresList = isKidsProfile ? KIDS_GENRES : ADULT_GENRES;
      const initialGenre = activeGenresList[0];

      genreSetupEl.innerHTML = `
        <div class="section-header-row" onclick="window.openSectionModal('Popular Movies')">
          <h2 class="section-heading">
            Popular Movies
            <i class="fa-solid fa-chevron-right"></i>
          </h2>
        </div>
        <!-- Genre Filter Pills Row -->
        <div class="genre-filter-scroller" id="inlineGenrePills">
          ${activeGenresList.map((g, idx) => `
            <div class="genre-chip ${idx === 0 ? 'active' : ''}" onclick="window.switchGenreSetupPill(this, '${g}')">
              ${g}
            </div>
          `).join('')}
        </div>
        <!-- Movies Carousel for Selected Genre -->
        <div class="carousel-wrapper">
          <button class="carousel-arrow left"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="carousel-track" id="inlineGenreTrack"></div>
          <button class="carousel-arrow right"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      `;

      container.appendChild(genreSetupEl);

      // Cache all movies for the modal view
      window[`sec_cache_${encodeURIComponent('Popular Movies')}`] = allMovies;

      const track = genreSetupEl.querySelector('#inlineGenreTrack');
      const leftBtn = genreSetupEl.querySelector('.carousel-arrow.left');
      const rightBtn = genreSetupEl.querySelector('.carousel-arrow.right');

      leftBtn.onclick = () => track.scrollBy({ left: -480, behavior: 'smooth' });
      rightBtn.onclick = () => track.scrollBy({ left: 480, behavior: 'smooth' });

      // Populate initial genre movies
      window.currentGenreCatalog = allMovies;
      populateGenreTrack(initialGenre);
    }

    window.switchGenreSetupPill = function(chipEl, genreName) {
      document.querySelectorAll('#inlineGenrePills .genre-chip').forEach(c => c.classList.remove('active'));
      chipEl.classList.add('active');
      populateGenreTrack(genreName);
    };

    function populateGenreTrack(genreName) {
      const track = document.getElementById('inlineGenreTrack');
      if (!track || !window.currentGenreCatalog) return;

      const gTarget = genreName.toLowerCase();
      const filtered = window.currentGenreCatalog.filter(m => parseGenres(m.Genres).includes(gTarget));

      track.innerHTML = '';
      if (filtered.length === 0) {
        track.innerHTML = `<div style="padding:24px; color:var(--text-muted); font-size:13px;">No movies found in ${genreName}.</div>`;
        return;
      }

      filtered.forEach(movie => {
        track.appendChild(create16x9CardElement(movie));
      });
    }

    /* ================= RENDER REGULAR HORIZONTAL CAROUSEL ================= */
    function renderCarouselSection(sectionTitle, movies, badgeLabel = null) {
      const container = document.getElementById('sectionsContainer');
      const sectionEl = document.createElement('section');
      sectionEl.className = 'section-block';

      sectionEl.innerHTML = `
        <div class="section-header-row" onclick="window.openSectionModal('${encodeURIComponent(sectionTitle)}')">
          <h2 class="section-heading">
            ${sectionTitle}
            ${badgeLabel ? `<span class="section-badge">${badgeLabel}</span>` : ''}
            <i class="fa-solid fa-chevron-right"></i>
          </h2>
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-arrow left"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="carousel-track"></div>
          <button class="carousel-arrow right"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      `;

      // Store in memory for full-page modal view
      window[`sec_cache_${encodeURIComponent(sectionTitle)}`] = movies;

      const track = sectionEl.querySelector('.carousel-track');
      const leftBtn = sectionEl.querySelector('.carousel-arrow.left');
      const rightBtn = sectionEl.querySelector('.carousel-arrow.right');

      movies.forEach(movie => {
        track.appendChild(create16x9CardElement(movie));
      });

      leftBtn.onclick = () => track.scrollBy({ left: -480, behavior: 'smooth' });
      rightBtn.onclick = () => track.scrollBy({ left: 480, behavior: 'smooth' });

      container.appendChild(sectionEl);
    }

    /* ================= FEATURE 3: CARD CREATOR (NO LOGOS, NO RATINGS, 16:9) ================= */
    function create16x9CardElement(movie) {
      const card = document.createElement('div');
      card.className = 'card-16-9';

      const title = movie.Name || movie.Title || movie.id;
      const poster = getPosterH(movie);
      const genres = parseGenres(movie.Genres).map(g => g.charAt(0).toUpperCase() + g.slice(1)).join(' • ') || movie.Language || 'Movie';

      // Feature 3: Redirection URL -> preview.html?watch=<id>
      card.onclick = () => {
        window.location.href = `preview.html?watch=${encodeURIComponent(movie.id)}`;
      };

      // Rating and Logo are removed as requested in Feature 3
      card.innerHTML = `
        <div class="card-thumb-wrap">
          <img class="main-thumb" src="${poster}" alt="${title}" loading="lazy"/>
          <div class="card-play-hover">
            <div class="card-play-btn-circle"><i class="fa-solid fa-play"></i></div>
          </div>
        </div>
        <div class="card-details">
          <div class="card-title">${title}</div>
          <div class="card-subtext">${genres}</div>
        </div>
      `;

      return card;
    }

    /* ================= FEATURE 2: MODAL SECTION PAGE WITH GENRE PILLS ================= */
    window.openSectionModal = function(encodedKey) {
      const movies = window[`sec_cache_${encodedKey}`] || [];
      const title = decodeURIComponent(encodedKey);

      document.getElementById('modalSectionTitle').innerText = title;
      const pillsRow = document.getElementById('modalGenrePillsRow');
      const grid = document.getElementById('modalGridMovies');

      // Build active genres list for this section modal
      const activeGenresList = isKidsProfile ? KIDS_GENRES : ADULT_GENRES;

      pillsRow.innerHTML = `
        <div class="genre-chip active" onclick="window.filterModalMovies(this, 'all', '${encodedKey}')">All</div>
        ${activeGenresList.map(g => `
          <div class="genre-chip" onclick="window.filterModalMovies(this, '${g}', '${encodedKey}')">${g}</div>
        `).join('')}
      `;

      grid.innerHTML = '';
      movies.forEach(movie => {
        grid.appendChild(create16x9CardElement(movie));
      });

      document.getElementById('sectionViewModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    window.filterModalMovies = function(chipEl, targetGenre, encodedKey) {
      document.querySelectorAll('#modalGenrePillsRow .genre-chip').forEach(c => c.classList.remove('active'));
      chipEl.classList.add('active');

      const movies = window[`sec_cache_${encodedKey}`] || [];
      const grid = document.getElementById('modalGridMovies');
      grid.innerHTML = '';

      const filtered = targetGenre === 'all' 
        ? movies 
        : movies.filter(m => parseGenres(m.Genres).includes(targetGenre.toLowerCase()));

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 40px; color: var(--text-muted); text-align:center;">No movies available in ${targetGenre}.</div>`;
        return;
      }

      filtered.forEach(movie => {
        grid.appendChild(create16x9CardElement(movie));
      });
    };

    document.getElementById('closeSectionModalBtn').onclick = () => {
      document.getElementById('sectionViewModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    };

    window.addEventListener('hashchange', loadPage);
    loadPage();
  </script>
