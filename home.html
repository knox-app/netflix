<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Space | OTT Platform</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f1015;
      --card-bg: #161822;
      --accent: #e50914;
      --accent-blue: #0072ef;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --border-color: rgba(255, 255, 255, 0.08);
      --chip-bg: #1a1e2b;
      --chip-active: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 85px;
    }

    /* TOP NAVBAR */
    .navbar {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 68px;
      padding: 0 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      background: rgba(15, 16, 21, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
    }
    .nav-left { display: flex; align-items: center; gap: 32px; }
    .brand-logo {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .brand-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 22px; list-style: none; }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      position: relative;
    }
    .nav-link:hover, .nav-link.active { color: #fff; }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 4px 12px 4px 6px;
      border-radius: 24px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #232733;
    }
    .tier-badge {
      font-size: 10px;
      background: #0072ef;
      color: #fff;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .kids-badge {
      font-size: 10px;
      background: #ffb703;
      color: #000;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* ================= HERO CAROUSEL ================= */
    .hero-container {
      position: relative;
      width: 100%;
      height: 78vh;
      min-height: 520px;
      max-height: 720px;
      overflow: hidden;
      background: #0f1015;
    }

    .hero-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      text-align: center;
      padding: 0 4% 60px;
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }
    .hero-slide.active { opacity: 1; z-index: 1; }

    .hero-slide::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 35%, transparent 15%, rgba(15, 16, 21, 0.7) 70%, var(--bg-dark) 100%),
                  linear-gradient(180deg, transparent 40%, rgba(15, 16, 21, 0.95) 90%, var(--bg-dark) 100%);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 680px;
    }

    .hero-title-logo {
      max-width: 320px;
      max-height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.85));
      margin-bottom: 4px;
    }
    .hero-fallback-title {
      font-size: clamp(32px, 5vw, 54px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
      color: #e50914;
      text-shadow: 0 4px 20px rgba(0,0,0,0.9);
      margin-bottom: 4px;
    }

    .hero-meta-line {
      font-size: 14px;
      font-weight: 600;
      color: #d1d5db;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-hero-watch {
      margin-top: 10px;
      background: linear-gradient(90deg, #0072ef 0%, #d800ff 100%);
      color: #fff;
      padding: 13px 48px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 114, 239, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-hero-watch:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 26px rgba(216, 0, 255, 0.5);
    }

    .hero-dots-row {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .hero-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: all 0.3s;
    }
    .hero-dot.active {
      width: 18px;
      border-radius: 4px;
      background: #ffffff;
    }

    /* ================= MAIN CONTAINER ================= */
    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 4% 40px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    /* ================= STUDIOS SECTION ================= */
    .studios-section {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .studios-heading {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .studios-grid {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 6px;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
    }
    .studios-grid::-webkit-scrollbar { display: none; }
    .studios-grid:active { cursor: grabbing; }

    .studio-card {
      flex: 0 0 170px;
      height: 95px;
      border-radius: 10px;
      background: radial-gradient(circle at 50% 30%, #202636 0%, #12151e 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      padding: 14px;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.25s;
    }
    .studio-card:hover {
      transform: scale(1.06);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }
    .studio-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
      pointer-events: none;
    }

    /* ================= GENRES EXPLORATION ROW (NO TEXT ON IMAGE) ================= */
    .genres-section {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .genres-heading {
      font-size: 19px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .genres-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 6px;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
    }
    .genres-track::-webkit-scrollbar { display: none; }
    .genres-track:active { cursor: grabbing; }

    .genre-card {
      flex: 0 0 200px;
      height: 112px;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      border: 1px solid var(--border-color);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), border-color 0.25s;
      background: #141824;
    }
    .genre-card:hover {
      transform: scale(1.05);
      border-color: rgba(255, 255, 255, 0.35);
    }
    .genre-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      transition: transform 0.3s ease;
    }
    .genre-card:hover img {
      transform: scale(1.06);
    }

    /* ================= CONTINUE WATCHING CAROUSEL ================= */
    .continue-card {
      flex: 0 0 260px;
      width: 260px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
      position: relative;
    }
    .continue-card:hover { transform: scale(1.03); }

    .continue-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #141721;
      border: 1px solid var(--border-color);
    }
    .continue-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .continue-play-icon {
      position: absolute;
      bottom: 12px;
      left: 12px;
      color: #ffffff;
      font-size: 18px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
    }

    .continue-progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.25);
    }
    .continue-progress-fill {
      height: 100%;
      width: 45%;
      background: #0072ef;
    }

    .continue-details-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 8px 2px 0;
    }
    .continue-ep-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
    }
    .continue-subtext {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .btn-continue-more {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 18px;
      padding: 4px 8px;
      cursor: pointer;
    }
    .btn-continue-more:hover { color: #fff; }

    /* ================= SECTION / SWIPEABLE CAROUSEL ================= */
    .section-block { display: flex; flex-direction: column; gap: 14px; }
    .section-header-row {
      display: flex;
      align-items: center;
      cursor: pointer;
      width: fit-content;
      gap: 10px;
      transition: opacity 0.2s;
    }
    .section-header-row:hover { opacity: 0.85; }
    .section-heading {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-heading i.fa-chevron-right {
      font-size: 13px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }
    .section-header-row:hover i.fa-chevron-right {
      transform: translateX(4px);
      color: #fff;
    }
    .section-badge {
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 114, 239, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 114, 239, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* GENRE CHIPS (HOTSTAR STYLE) */
    .filter-chips-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-chips-row::-webkit-scrollbar { display: none; }
    .filter-chip {
      background: #1a1e2b;
      color: #8f98b2;
      border: 1px solid var(--border-color);
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .filter-chip:hover { color: #fff; background: #262c3e; }
    .filter-chip.active {
      background: #2b3347;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* 16:9 CARDS */
    .carousel-wrapper { position: relative; }
    .carousel-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 8px;
      scrollbar-width: none;
      cursor: grab;
      user-select: none;
      -webkit-overflow-scrolling: touch;
    }
    .carousel-track::-webkit-scrollbar { display: none; }
    .carousel-track:active { cursor: grabbing; }

    .card-16-9 {
      flex: 0 0 240px;
      width: 240px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card-16-9:hover { transform: scale(1.03); }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #141721;
      border: 1px solid var(--border-color);
    }
    .card-thumb-wrap img.main-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }
    .card-play-hover {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .card-16-9:hover .card-play-hover { opacity: 1; }
    .card-play-btn-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .card-details { padding: 8px 2px 0; }
    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    .card-subtext {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .carousel-arrow {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 16, 21, 0.85);
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .carousel-wrapper:hover .carousel-arrow { opacity: 1; }
    .carousel-arrow.left { left: -14px; }
    .carousel-arrow.right { right: -14px; }
    .carousel-arrow:hover { background: var(--accent); }

    /* ================= BOTTOM SHEET FOR CONTINUE WATCHING ================= */
    .bottom-sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      z-index: 10000;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .bottom-sheet-overlay.active { display: flex; }

    .bottom-sheet-modal {
      width: 100%;
      max-width: 520px;
      background: #181b24;
      border-radius: 20px 20px 0 0;
      border: 1px solid var(--border-color);
      border-bottom: none;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideUp 0.25s ease-out;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .sheet-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }
    .btn-sheet-close {
      background: none;
      border: none;
      color: #8f98b2;
      font-size: 18px;
      cursor: pointer;
    }

    .sheet-option-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 8px;
      cursor: pointer;
      color: #fff;
      font-size: 14.5px;
      font-weight: 600;
      border-radius: 10px;
      transition: background 0.15s;
    }
    .sheet-option-item:hover { background: rgba(255, 255, 255, 0.08); }
    .sheet-option-item i { font-size: 18px; color: #8f98b2; }

    /* SECTION FULL-PAGE MODAL (NO GENRES CHIPS) */
    .section-modal-page {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-dark);
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px 4% 60px;
    }
    .section-modal-page.active { display: flex; }
    .modal-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-title-box { display: flex; align-items: center; gap: 16px; }
    .btn-close-modal {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
    }
    .modal-page-title { font-size: 24px; font-weight: 800; }
    .modal-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    /* MOBILE BOTTOM NAV */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 16, 21, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      z-index: 2000;
      justify-content: space-around;
      align-items: center;
    }
    .nav-item-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      width: 25%;
    }
    .nav-item-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .nav-item-btn.active, .nav-item-btn:hover { color: #fff; }
    .nav-item-btn.active svg { fill: var(--accent); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .mobile-bottom-nav { display: flex; }
      .card-16-9 { flex: 0 0 190px; width: 190px; }
      .continue-card { flex: 0 0 210px; width: 210px; }
      .studio-card { flex: 0 0 135px; height: 75px; }
      .genre-card { flex: 0 0 160px; height: 95px; }
      .carousel-arrow { display: none; }
      .hero-container { height: 60vh; min-height: 440px; }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="home.html#movies" class="brand-logo">
        <i class="fa-solid fa-play-circle" style="color:var(--accent);"></i>
        My<span>Space</span>
      </a>
      <ul class="nav-links">
        <li><a class="nav-link" data-hash="movies" href="#movies">Movies</a></li>
        <li><a class="nav-link" data-hash="shows" href="#shows">Shows</a></li>
        <li><a class="nav-link" data-hash="tvshows" href="#tvshows">TV Shows</a></li>
        <li><a class="nav-link" data-hash="livetv" href="#livetv">Live TV</a></li>
      </ul>
    </div>
    <div class="nav-right" id="navAuthSlot">
      <a href="onboarding.html" class="user-pill">
        <div class="user-avatar"><i class="fa-solid fa-user"></i></div>
        <span>Profiles</span>
      </a>
    </div>
  </header>

  <!-- Hero Carousel (Banner on Background, Logo on Foreground) -->
  <section class="hero-container" id="heroContainer">
    <div class="hero-dots-row" id="heroDotsRow"></div>
  </section>

  <!-- Main Feed Container -->
  <main class="main-container" id="sectionsContainer">
    <div style="text-align: center; padding: 60px; color: var(--text-muted);">
      <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i>
      <p style="margin-top:12px;">Validating Age_Rating and loading content...</p>
    </div>
  </main>

  <!-- Bottom Sheet Modal for Continue Watching -->
  <div class="bottom-sheet-overlay" id="continueBottomSheet">
    <div class="bottom-sheet-modal">
      <div class="sheet-header">
        <h3 class="sheet-title" id="sheetMovieTitle">Title</h3>
        <button class="btn-sheet-close" id="closeBottomSheetBtn"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="sheet-option-item" id="sheetViewDetailsBtn">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      onSnapshot, 
      collection, 
      getDoc, 
      getDocs, 
      updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Centralized Genres Catalog
    import { getGenresByTier } from "./genres.js";

    /* ================= DATABASE 1: UARM ================= */
    const uarmConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase"
    };
    const uarmApp = initializeApp(uarmConfig, "uarmApp");
    const uarmDb = getFirestore(uarmApp);

    /* ================= DATABASE 2: CONTENT & PARTNERS ================= */
    const contentConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728"
    };
    const contentApp = initializeApp(contentConfig, "contentApp");
    const contentDb = getFirestore(contentApp);

    // Global State
    let liveUserData = null;
    let liveMoviesCatalog = [];
    let liveMoviesMap = new Map();
    let livePartnersList = [];
    let heroAutoTimer = null;
    let uarmUnsub = null;
    let moviesUnsub = null;
    let partnersUnsub = null;

    let activeProfile = null;
    let activeProfileIndex = 0;
    let isKidsProfile = false;
    let userAllowedMaxTier = 2; // Default to U/A 7+ (Tier 2)

    // Current item targeted in bottom sheet
    let sheetTargetMovie = null;

    function safeUrl(url) {
      if (!url) return '';
      return url.trim().replace(/^http:\/\//i, 'https://');
    }

    // STRICT: Only Poster.h for section carousels
    function getPosterH(c) {
      if (!c) return 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800';
      return safeUrl(
        c["Poster.h"] || 
        c.Poster_h || 
        c.poster_h || 
        c.Banner || 
        c.banner || 
        'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800'
      );
    }

    function parseGenres(field) {
      if (!field) return [];
      if (Array.isArray(field)) return field.map(g => String(g).trim().toLowerCase()).filter(Boolean);
      if (typeof field === 'string') return field.split(/[,/|•]+/).map(g => g.trim().toLowerCase()).filter(Boolean);
      return [String(field).trim().toLowerCase()];
    }

    function mixupArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    /* ================= SMOOTH TOUCH & DRAG SWIPING ENGINE ================= */
    function makeElementSwipeable(el) {
      let isDown = false;
      let startX, scrollLeft;

      el.addEventListener('mousedown', (e) => {
        isDown = true;
        startX = e.pageX - el.offsetLeft;
        scrollLeft = el.scrollLeft;
      });

      el.addEventListener('mouseleave', () => { isDown = false; });
      el.addEventListener('mouseup', () => { isDown = false; });

      el.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - el.offsetLeft;
        const walk = (x - startX) * 1.8; // scroll speed multiplier
        el.scrollLeft = scrollLeft - walk;
      });
    }

    /* ================= AGE TIERS ================= */
    function getRatingTier(ratingStr) {
      if (!ratingStr) return 1;
      const clean = String(ratingStr).trim().toUpperCase();
      if (clean.includes("18") || clean === "A" || clean === "U/A 18+") return 5;
      if (clean.includes("16") || clean === "U/A 16+") return 4;
      if (clean.includes("13") || clean === "U/A 13+") return 3;
      if (clean.includes("7") || clean === "U/A 7+") return 2;
      return 1;
    }

    function getTierLabel(tierNum) {
      switch(tierNum) {
        case 1: return "U";
        case 2: return "U/A 7+";
        case 3: return "U/A 13+";
        case 4: return "U/A 16+";
        case 5: return "U/A 18+";
        default: return "U";
      }
    }

    function isAllowedByAge(contentRatingStr) {
      return getRatingTier(contentRatingStr) <= userAllowedMaxTier;
    }

    /* ================= SYNC STREAMS ================= */
    function syncRealtimeUARM() {
      if (uarmUnsub) uarmUnsub();

      const urlParams = new URLSearchParams(window.location.search);
      const uarmIdParam = urlParams.get('uarm') || urlParams.get('uarms');
      const cachedRaw = localStorage.getItem('active_user') || localStorage.getItem('UARM');
      const cached = cachedRaw ? JSON.parse(cachedRaw) : null;
      const targetDocId = uarmIdParam || cached?.["UARMS ID"] || cached?.id || "7I4d9vmlm9WiUAUneQGByq6jT";

      uarmUnsub = onSnapshot(doc(uarmDb, "UARM", targetDocId), (snap) => {
        if (!snap.exists()) return;
        liveUserData = { id: snap.id, ...snap.data() };
        localStorage.setItem('active_user', JSON.stringify(liveUserData));

        updateActiveProfile();
        renderUserNavPill();
        buildLiveFeed();
      });
    }

    function syncRealtimeMovies() {
      if (moviesUnsub) moviesUnsub();

      moviesUnsub = onSnapshot(collection(contentDb, "Movies"), (snapshot) => {
        liveMoviesCatalog = [];
        liveMoviesMap.clear();

        snapshot.forEach(docSnap => {
          const m = { id: docSnap.id, ...docSnap.data() };
          liveMoviesCatalog.push(m);
          liveMoviesMap.set(docSnap.id.toLowerCase(), m);
        });

        buildLiveFeed();
      });
    }

    function syncRealtimePartners() {
      if (partnersUnsub) partnersUnsub();

      partnersUnsub = onSnapshot(collection(contentDb, "Partners"), (snapshot) => {
        livePartnersList = [];

        snapshot.forEach(docSnap => {
          const p = { id: docSnap.id, ...docSnap.data() };
          const isHome = String(p.Home).toLowerCase() === "true" || p.Home === true;
          if (isHome) {
            livePartnersList.push(p);
          }
        });

        renderStudiosSection();
      });
    }

    function updateActiveProfile() {
      if (!liveUserData) return;

      const hash = window.location.hash;
      let targetUserIdx = 0;

      if (hash.includes('user#')) {
        targetUserIdx = parseInt(hash.split('user#')[1], 10) || 0;
      } else {
        const cachedIdx = localStorage.getItem('active_profile_index');
        if (cachedIdx !== null) targetUserIdx = parseInt(cachedIdx, 10);
      }

      activeProfileIndex = targetUserIdx;

      if (Array.isArray(liveUserData.Profiles) && liveUserData.Profiles.length > targetUserIdx) {
        activeProfile = liveUserData.Profiles[targetUserIdx];
      } else if (Array.isArray(liveUserData.Profiles) && liveUserData.Profiles.length > 0) {
        activeProfile = liveUserData.Profiles[0];
      } else {
        activeProfile = {
          Name: liveUserData["First Name"] || "User",
          Avatar: liveUserData["Profile_Picture"] || "",
          Kids: "False",
          Age_Rating: "U/A 18+",
          Playlist: [],
          Watchlist: []
        };
      }

      isKidsProfile = String(activeProfile?.Kids).toLowerCase() === "true";
      userAllowedMaxTier = isKidsProfile 
        ? getRatingTier(activeProfile?.Age_Rating || "U/A 7+")
        : (activeProfile?.Age_Rating ? getRatingTier(activeProfile.Age_Rating) : 5);
    }

    function renderUserNavPill() {
      const slot = document.getElementById('navAuthSlot');
      if (!activeProfile) return;

      slot.innerHTML = `
        <a href="onboarding.html" class="user-pill">
          <img src="${activeProfile.Avatar || 'https://img1.hotstarext.com/image/upload/w_auto,c_fill/v1/feature/profile/27.png'}" class="user-avatar" />
          <span>${activeProfile.Name || 'Profile'}</span>
          <span class="${isKidsProfile ? 'kids-badge' : 'tier-badge'}">${getTierLabel(userAllowedMaxTier)}</span>
        </a>
      `;
    }

    function getLiveRecentlyWatchedIds() {
      if (!liveUserData || !Array.isArray(liveUserData["Memory.ent"])) return [];

      for (const item of liveUserData["Memory.ent"]) {
        if (typeof item === 'object' && item !== null) {
          for (const key of Object.keys(item)) {
            if (key.toLowerCase().includes("recently watched") && key.toLowerCase().includes("movie")) {
              const val = item[key];
              if (typeof val === 'string') {
                return val.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
              } else if (Array.isArray(val)) {
                return val.map(s => String(s).trim().toLowerCase());
              }
            }
          }
        }
      }
      return [];
    }

    /* ================= 1. TOP HERO CAROUSEL ================= */
    async function setupHeroCarousel(allowedMoviesCatalog, forYouPool) {
      const container = document.getElementById('heroContainer');
      const dotsRow = document.getElementById('heroDotsRow');
      container.querySelectorAll('.hero-slide').forEach(s => s.remove());
      dotsRow.innerHTML = '';

      let heroMovies = [];

      try {
        const sysDoc = await getDoc(doc(contentDb, "Systems", "sys.carsoule.home"));
        if (sysDoc.exists()) {
          const suggestions = sysDoc.data().suggest || [];

          for (const token of suggestions) {
            const cleanToken = String(token).trim();

            if (cleanToken === "{.rec/auto}") {
              const rec = forYouPool.find(m => !heroMovies.some(hm => hm.id === m.id));
              if (rec) {
                heroMovies.push(rec);
              } else {
                const fallback = allowedMoviesCatalog.find(m => !heroMovies.some(hm => hm.id === m.id));
                if (fallback) heroMovies.push(fallback);
              }
            } else {
              const exactMovie = liveMoviesMap.get(cleanToken.toLowerCase());
              if (exactMovie && isAllowedByAge(exactMovie.Age_Rating)) {
                if (!heroMovies.some(hm => hm.id === exactMovie.id)) {
                  heroMovies.push(exactMovie);
                }
              }
            }
          }
        }
      } catch (err) {
        console.warn("sys.carsoule.home read skipped:", err);
      }

      if (heroMovies.length === 0) heroMovies = allowedMoviesCatalog.slice(0, 5);
      if (heroMovies.length === 0) {
        container.style.display = "none";
        return;
      } else {
        container.style.display = "block";
      }

      heroMovies.forEach((movie, idx) => {
        const slide = document.createElement('div');
        slide.className = `hero-slide ${idx === 0 ? 'active' : ''}`;
        
        // Background: Strictly Banner
        const bannerUrl = safeUrl(movie.Banner || movie.banner || getPosterH(movie));
        slide.style.backgroundImage = `url('${bannerUrl}')`;

        const title = movie.Name || movie.Title || movie.id;
        // Foreground: Strictly Logo
        const logoUrl = safeUrl(movie.Logo || movie["Logo.png"] || movie.logo || '');
        const genres = parseGenres(movie.Genres).map(g => g.charAt(0).toUpperCase() + g.slice(1)).join(' • ');
        const languages = movie.Languages ? `${movie.Languages} Languages` : (movie.Language || 'Hindi');

        slide.innerHTML = `
          <div class="hero-content">
            ${logoUrl ? `<img src="${logoUrl}" class="hero-title-logo" alt="${title}" />` : `<h1 class="hero-fallback-title">${title}</h1>`}
            <div class="hero-meta-line">
              <span>${languages}</span>
              ${genres ? `<span>•</span><span>${genres}</span>` : ''}
            </div>
            <a href="https://knox-app.github.io/netflix/1?watch=${encodeURIComponent(movie.id)}" class="btn-hero-watch">
              <i class="fa-solid fa-play"></i> Watch Now
            </a>
          </div>
        `;
        container.insertBefore(slide, dotsRow);

        const dot = document.createElement('div');
        dot.className = `hero-dot ${idx === 0 ? 'active' : ''}`;
        dot.onclick = () => showHeroIndex(idx, heroMovies.length);
        dotsRow.appendChild(dot);
      });

      let currentHeroIdx = 0;
      if (heroAutoTimer) clearInterval(heroAutoTimer);
      heroAutoTimer = setInterval(() => {
        currentHeroIdx = (currentHeroIdx + 1) % heroMovies.length;
        showHeroIndex(currentHeroIdx, heroMovies.length);
      }, 5500);
    }

    function showHeroIndex(idx, total) {
      document.querySelectorAll('.hero-slide').forEach((s, i) => s.classList.toggle('active', i === idx));
      document.querySelectorAll('.hero-dot').forEach((d, i) => d.classList.toggle('active', i === idx));
    }

    /* ================= 2. STUDIOS SECTION (HOME = TRUE) ================= */
    function renderStudiosSection() {
      let studiosEl = document.getElementById('studiosSectionBox');
      const container = document.getElementById('sectionsContainer');

      if (!studiosEl) {
        studiosEl = document.createElement('section');
        studiosEl.id = 'studiosSectionBox';
        studiosEl.className = 'studios-section';
        if (container.firstChild) {
          container.insertBefore(studiosEl, container.firstChild);
        } else {
          container.appendChild(studiosEl);
        }
      }

      if (livePartnersList.length === 0) {
        studiosEl.style.display = 'none';
        return;
      }

      studiosEl.style.display = 'flex';
      studiosEl.innerHTML = `
        <h2 class="studios-heading">
          <i class="fa-solid fa-layer-group" style="color:var(--accent);"></i>
          Explore Studios
        </h2>
        <div class="studios-grid" id="studiosSwipeGrid">
          ${livePartnersList.map(partner => {
            const studioId = partner.id;
            const studioName = partner.Name || partner.name || studioId;
            const tileImg = safeUrl(partner.Tile || partner.tile || partner.Logo || partner.logo || partner.Banner);
            const redirectUrl = `https://knox-app.github.io/netflix/studio/?studio=${encodeURIComponent(studioId)}`;

            return `
              <a href="${redirectUrl}" class="studio-card" title="${studioName}">
                ${tileImg 
                  ? `<img src="${tileImg}" alt="${studioName}" loading="lazy" />` 
                  : `<span class="studio-card-fallback">${studioName}</span>`
                }
              </a>
            `;
          }).join('')}
        </div>
      `;

      makeElementSwipeable(studiosEl.querySelector('#studiosSwipeGrid'));
    }

    /* ================= 3. GENRES CAROUSEL (NO TEXT ON IMAGE) ================= */
    function renderGenresSection() {
      let genresEl = document.getElementById('genresSectionBox');
      const container = document.getElementById('sectionsContainer');

      if (!genresEl) {
        genresEl = document.createElement('section');
        genresEl.id = 'genresSectionBox';
        genresEl.className = 'genres-section';

        const studiosEl = document.getElementById('studiosSectionBox');
        if (studiosEl && studiosEl.nextSibling) {
          container.insertBefore(genresEl, studiosEl.nextSibling);
        } else if (container.firstChild) {
          container.insertBefore(genresEl, container.firstChild);
        } else {
          container.appendChild(genresEl);
        }
      }

      const genresList = getGenresByTier(userAllowedMaxTier);

      if (!genresList || genresList.length === 0) {
        genresEl.style.display = 'none';
        return;
      }

      genresEl.style.display = 'flex';
      genresEl.innerHTML = `
        <h2 class="genres-heading">
          <i class="fa-solid fa-shapes" style="color:var(--accent-blue);"></i>
          Explore Genres
        </h2>
        <div class="genres-track" id="genresSwipeTrack">
          ${genresList.map(g => `
            <a href="${g.link}" class="genre-card" title="${g.name}">
              <img src="${g.image}" alt="${g.name}" loading="lazy" />
            </a>
          `).join('')}
        </div>
      `;

      makeElementSwipeable(genresEl.querySelector('#genresSwipeTrack'));
    }

    /* ================= 4. CONTINUE WATCHING CAROUSEL ================= */
    function renderContinueWatchingSection() {
      const container = document.getElementById('sectionsContainer');
      const profileName = activeProfile?.Name || "User";

      // Combine items from activeProfile.Playlist and live Recently Watched
      const continueIds = [];

      if (Array.isArray(activeProfile?.Playlist)) {
        activeProfile.Playlist.forEach(id => {
          const cleanId = String(id).trim().toLowerCase();
          if (!continueIds.includes(cleanId)) continueIds.push(cleanId);
        });
      }

      const watched = getLiveRecentlyWatchedIds();
      watched.forEach(id => {
        if (!continueIds.includes(id)) continueIds.push(id);
      });

      const continueMovies = [];
      for (const id of continueIds) {
        const movie = liveMoviesMap.get(id);
        if (movie && isAllowedByAge(movie.Age_Rating)) {
          continueMovies.push(movie);
        }
      }

      if (continueMovies.length === 0) return;

      const sectionEl = document.createElement('section');
      sectionEl.className = 'section-block';

      sectionEl.innerHTML = `
        <div class="section-header-row">
          <h2 class="section-heading">Continue Watching for ${profileName}</h2>
        </div>
        <div class="carousel-wrapper">
          <div class="carousel-track" id="cwTrack_${encodeURIComponent(profileName)}"></div>
        </div>
      `;

      const track = sectionEl.querySelector('.carousel-track');

      continueMovies.forEach(movie => {
        const card = document.createElement('div');
        card.className = 'continue-card';

        const posterH = getPosterH(movie);
        const title = movie.Name || movie.Title || movie.id;
        const seasonEp = movie.Episode ? `S${movie.Season || 1} E${movie.Episode}` : `S1 E1`;
        const timeLeft = movie.TimeLeft || "24m left";

        card.innerHTML = `
          <div class="continue-thumb-wrap">
            <img src="${posterH}" alt="${title}" loading="lazy" />
            <i class="fa-solid fa-play continue-play-icon"></i>
            <div class="continue-progress-bar">
              <div class="continue-progress-fill"></div>
            </div>
          </div>
          <div class="continue-details-row">
            <div>
              <div class="continue-ep-title">${seasonEp}</div>
              <div class="continue-subtext">${timeLeft}</div>
            </div>
            <button class="btn-continue-more" title="Options"><i class="fa-solid fa-ellipsis-vertical"></i></button>
          </div>
        `;

        // Direct click navigates to https://knox-app.github.io/netflix/1?watch=<id>
        card.querySelector('.continue-thumb-wrap').onclick = () => {
          window.location.href = `https://knox-app.github.io/netflix/1?watch=${encodeURIComponent(movie.id)}`;
        };

        // Open 3-dot bottom sheet
        card.querySelector('.btn-continue-more').onclick = (e) => {
          e.stopPropagation();
          openContinueBottomSheet(movie);
        };

        track.appendChild(card);
      });

      makeElementSwipeable(track);
      container.appendChild(sectionEl);
    }

    /* ================= BOTTOM SHEET ACTIONS ================= */
    function openContinueBottomSheet(movie) {
      sheetTargetMovie = movie;
      document.getElementById('sheetMovieTitle').innerText = movie.Name || movie.Title || movie.id;
      document.getElementById('continueBottomSheet').classList.add('active');
    }

    document.getElementById('closeBottomSheetBtn').onclick = () => {
      document.getElementById('continueBottomSheet').classList.remove('active');
    };

    document.getElementById('sheetViewDetailsBtn').onclick = () => {
      if (sheetTargetMovie) {
        window.location.href = `https://knox-app.github.io/netflix/1?watch=${encodeURIComponent(sheetTargetMovie.id)}`;
      }
    };

    // Remove from Continue Watching real-time
    document.getElementById('sheetRemoveBtn').onclick = async () => {
      if (!sheetTargetMovie || !liveUserData) return;

      const movieIdToRemove = sheetTargetMovie.id.toLowerCase();
      document.getElementById('continueBottomSheet').classList.remove('active');

      try {
        // 1. Remove from active profile playlist
        if (Array.isArray(liveUserData.Profiles) && liveUserData.Profiles[activeProfileIndex]) {
          const profile = liveUserData.Profiles[activeProfileIndex];
          if (Array.isArray(profile.Playlist)) {
            profile.Playlist = profile.Playlist.filter(id => String(id).toLowerCase() !== movieIdToRemove);
          }
        }

        // 2. Remove from Memory.ent recently watched
        if (Array.isArray(liveUserData["Memory.ent"])) {
          liveUserData["Memory.ent"].forEach(item => {
            if (typeof item === 'object' && item !== null) {
              for (const k of Object.keys(item)) {
                if (k.toLowerCase().includes("recently watched") && typeof item[k] === 'string') {
                  const arr = item[k].split(',').map(s => s.trim()).filter(s => s.toLowerCase() !== movieIdToRemove);
                  item[k] = arr.join(', ');
                }
              }
            }
          });
        }

        // Save directly to Firebase Firestore
        await updateDoc(doc(uarmDb, "UARM", liveUserData.id), {
          Profiles: liveUserData.Profiles,
          "Memory.ent": liveUserData["Memory.ent"]
        });

      } catch (err) {
        console.error("Error removing from continue watching:", err);
      }
    };

    /* ================= 5. POPULAR SHOWS & MOVIES (WITH GENRE CHIPS) ================= */
    function renderFilteredInteractiveSection(sectionTitle, candidates, defaultGenre = "All") {
      const container = document.getElementById('sectionsContainer');
      const sectionEl = document.createElement('section');
      sectionEl.className = 'section-block';

      // Gather existing genres across candidates
      const genreSet = new Set();
      candidates.forEach(m => {
        parseGenres(m.Genres).forEach(g => {
          genreSet.add(g.charAt(0).toUpperCase() + g.slice(1));
        });
      });
      const genresList = ["All", ...Array.from(genreSet).slice(0, 8)];

      const sectionKey = `interactive_${encodeURIComponent(sectionTitle)}`;

      sectionEl.innerHTML = `
        <div class="section-header-row" onclick="window.openSectionModal('${encodeURIComponent(sectionTitle)}')">
          <h2 class="section-heading">
            ${sectionTitle}
            <i class="fa-solid fa-chevron-right"></i>
          </h2>
        </div>
        <div class="filter-chips-row" id="chips_${sectionKey}">
          ${genresList.map(g => `
            <div class="filter-chip ${g === defaultGenre ? 'active' : ''}" data-genre="${g.toLowerCase()}">
              ${g}
            </div>
          `).join('')}
        </div>
        <div class="carousel-wrapper">
          <div class="carousel-track" id="track_${sectionKey}"></div>
        </div>
      `;

      const track = sectionEl.querySelector(`#track_${sectionKey}`);
      const chipsRow = sectionEl.querySelector(`#chips_${sectionKey}`);

      function populateTrack(selectedG) {
        track.innerHTML = '';
        const filtered = selectedG === 'all'
          ? candidates
          : candidates.filter(m => parseGenres(m.Genres).includes(selectedG));

        filtered.slice(0, 20).forEach(m => {
          track.appendChild(create16x9Card(m));
        });
      }

      // Initial populate
      populateTrack(defaultGenre.toLowerCase());

      // Chip click listeners
      chipsRow.querySelectorAll('.filter-chip').forEach(chip => {
        chip.onclick = () => {
          chipsRow.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
          chip.classList.add('active');
          populateTrack(chip.getAttribute('data-genre'));
        };
      });

      makeElementSwipeable(chipsRow);
      makeElementSwipeable(track);

      window[`sec_cache_${encodeURIComponent(sectionTitle)}`] = candidates;
      container.appendChild(sectionEl);
    }

    /* ================= REFINED FOR YOU ================= */
    function buildLiveForYou(allowedMoviesCatalog, watchedIds) {
      const effectiveWatched = watchedIds.filter(id => {
        const m = liveMoviesMap.get(id);
        return m && isAllowedByAge(m.Age_Rating);
      });

      const unwatched = allowedMoviesCatalog.filter(m => !effectiveWatched.includes(m.id.toLowerCase()));
      if (effectiveWatched.length === 0) return mixupArray(unwatched).slice(0, 20);

      const genreFreq = {};
      const studioFreq = {};

      effectiveWatched.forEach((id, idx) => {
        const movie = liveMoviesMap.get(id);
        if (!movie) return;
        const decay = Math.max(1, 5 - idx);

        parseGenres(movie.Genres).forEach(g => {
          genreFreq[g] = (genreFreq[g] || 0) + (10 * decay);
        });

        const std = (movie.Studio || movie.Partner || '').toLowerCase().trim();
        if (std) studioFreq[std] = (studioFreq[std] || 0) + (6 * decay);
      });

      const scored = unwatched.map(movie => {
        let score = 0;
        parseGenres(movie.Genres).forEach(g => {
          if (genreFreq[g]) score += genreFreq[g];
        });

        const std = (movie.Studio || movie.Partner || '').toLowerCase().trim();
        if (std && studioFreq[std]) score += studioFreq[std];

        score += Math.random() * 8;
        return { movie, score };
      });

      scored.sort((a, b) => b.score - a.score);
      return scored.slice(0, 20).map(s => s.movie);
    }

    /* ================= MAIN FEED BUILDER ================= */
    async function buildLiveFeed() {
      if (liveMoviesCatalog.length === 0 || !liveUserData) return;

      const pageId = window.location.hash.split('&')[0].replace('#', '').trim().toLowerCase() || 'movies';

      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.hash === pageId);
      });

      const container = document.getElementById('sectionsContainer');
      container.innerHTML = "";

      // 1. Studios Section
      renderStudiosSection();

      // 2. Genres Row
      renderGenresSection();

      // 3. Allowed Catalog by Age Tier
      const allowedMoviesCatalog = liveMoviesCatalog.filter(m => isAllowedByAge(m.Age_Rating));
      const rawWatchedIds = getLiveRecentlyWatchedIds();

      // 4. For You Pool
      const forYouList = buildLiveForYou(allowedMoviesCatalog, rawWatchedIds);

      // 5. Top Hero Carousel
      await setupHeroCarousel(allowedMoviesCatalog, forYouList);

      // 6. Continue Watching for <Profile Name>
      renderContinueWatchingSection();

      let sectionCounter = 0;

      // 7. Watchlist Section
      if (activeProfile && Array.isArray(activeProfile.Watchlist) && activeProfile.Watchlist.length > 0) {
        const watchlistMovies = [];
        for (const wId of activeProfile.Watchlist) {
          const m = liveMoviesMap.get(String(wId).trim().toLowerCase());
          if (m && isAllowedByAge(m.Age_Rating) && !watchlistMovies.some(wm => wm.id === m.id)) {
            watchlistMovies.push(m);
          }
        }
        if (watchlistMovies.length > 0) {
          renderCarouselSection("Watchlist", watchlistMovies, "My List");
          sectionCounter++;
        }
      }

      // 8. "Because You Watched <Name>"
      let anchorMovie = null;
      for (const wid of rawWatchedIds) {
        const candidate = liveMoviesMap.get(wid);
        if (candidate && isAllowedByAge(candidate.Age_Rating)) {
          anchorMovie = candidate;
          break;
        }
      }

      if (anchorMovie) {
        const anchorGenres = parseGenres(anchorMovie.Genres);
        const similarSafeMovies = allowedMoviesCatalog
          .filter(m => m.id.toLowerCase() !== anchorMovie.id.toLowerCase())
          .filter(m => anchorGenres.some(g => parseGenres(m.Genres).includes(g)));

        if (similarSafeMovies.length >= 2) {
          renderCarouselSection(
            `Because You Watched ${anchorMovie.Name || anchorMovie.Title || 'this'}`,
            mixupArray(similarSafeMovies).slice(0, 15),
            "Recommendation"
          );
          sectionCounter++;
        }
      }

      // 9. "For You" Section
      if (forYouList.length > 0) {
        renderCarouselSection("For You", forYouList, "Personalized");
        sectionCounter++;
      }

      // 10. Database Sections from Systems Collection
      try {
        const pageDoc = await getDoc(doc(contentDb, "Systems", pageId));
        if (pageDoc.exists()) {
          const sectionIds = pageDoc.data().Sections || [];

          for (const sId of sectionIds) {
            const secSnap = await getDoc(doc(contentDb, "Systems", sId));
            if (!secSnap.exists()) continue;

            const secData = secSnap.data();
            if (!isAllowedByAge(secData.Age_Rating)) continue;

            const isFixed = String(secData.Fixed).toLowerCase() === "true";
            const maxLimit = parseInt(secData.Max_Limit || "50", 10);
            const sectionGenres = parseGenres(secData.Genres);

            let sectionMovies = [];
            const explicitTitles = Array.isArray(secData.Titles) ? secData.Titles : [];
            for (const tId of explicitTitles) {
              const movie = liveMoviesMap.get(String(tId).trim().toLowerCase());
              if (movie && isAllowedByAge(movie.Age_Rating) && !sectionMovies.some(m => m.id === movie.id)) {
                sectionMovies.push(movie);
              }
            }

            if (!isFixed) {
              const similarMovies = allowedMoviesCatalog.filter(m => {
                if (sectionMovies.some(sm => sm.id === m.id)) return false;
                const mG = parseGenres(m.Genres);
                return sectionGenres.some(sg => mG.includes(sg));
              });
              sectionMovies = mixupArray([...sectionMovies, ...similarMovies]).slice(0, maxLimit);
            }

            if (sectionMovies.length > 0) {
              renderCarouselSection(secData.Name || sId, sectionMovies);
              sectionCounter++;

              // Inject Popular Shows after 4-5 sections
              if (sectionCounter === 4) {
                renderFilteredInteractiveSection("Popular Shows", allowedMoviesCatalog);
              }

              // Inject Popular Movies after 7-9 sections
              if (sectionCounter === 8) {
                renderFilteredInteractiveSection("Popular Movies", mixupArray(allowedMoviesCatalog));
              }
            }
          }
        }
      } catch (err) {
        console.error("Systems fetch error:", err);
      }

      // Fallback injection if fewer sections exist
      if (sectionCounter < 4) {
        renderFilteredInteractiveSection("Popular Shows", allowedMoviesCatalog);
        renderFilteredInteractiveSection("Popular Movies", mixupArray(allowedMoviesCatalog));
      }
    }

    /* ================= RENDER CAROUSEL WITH SWIPING ================= */
    function renderCarouselSection(sectionTitle, movies, badgeLabel = null) {
      const container = document.getElementById('sectionsContainer');
      const sectionEl = document.createElement('section');
      sectionEl.className = 'section-block';

      sectionEl.innerHTML = `
        <div class="section-header-row" onclick="window.openSectionModal('${encodeURIComponent(sectionTitle)}')">
          <h2 class="section-heading">
            ${sectionTitle}
            ${badgeLabel ? `<span class="section-badge">${badgeLabel}</span>` : ''}
            <i class="fa-solid fa-chevron-right"></i>
          </h2>
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-arrow left"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="carousel-track"></div>
          <button class="carousel-arrow right"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      `;

      window[`sec_cache_${encodeURIComponent(sectionTitle)}`] = movies;

      const track = sectionEl.querySelector('.carousel-track');
      const leftBtn = sectionEl.querySelector('.carousel-arrow.left');
      const rightBtn = sectionEl.querySelector('.carousel-arrow.right');

      movies.forEach(movie => {
        track.appendChild(create16x9Card(movie));
      });

      leftBtn.onclick = () => track.scrollBy({ left: -480, behavior: 'smooth' });
      rightBtn.onclick = () => track.scrollBy({ left: 480, behavior: 'smooth' });

      makeElementSwipeable(track);
      container.appendChild(sectionEl);
    }

    /* ================= 16:9 CARD (STRICTLY POSTER.H) ================= */
    function create16x9Card(movie) {
      const card = document.createElement('div');
      card.className = 'card-16-9';

      const title = movie.Name || movie.Title || movie.id;
      // Strictly Poster.h for landscape cards
      const poster = getPosterH(movie);
      const genres = parseGenres(movie.Genres).map(g => g.charAt(0).toUpperCase() + g.slice(1)).join(' • ') || movie.Language || 'Movie';

      card.onclick = () => {
        window.location.href = `https://knox-app.github.io/netflix/1?watch=${encodeURIComponent(movie.id)}`;
      };

      card.innerHTML = `
        <div class="card-thumb-wrap">
          <img class="main-thumb" src="${poster}" alt="${title}" loading="lazy"/>
          <div class="card-play-hover">
            <div class="card-play-btn-circle"><i class="fa-solid fa-play"></i></div>
          </div>
        </div>
        <div class="card-details">
          <div class="card-title">${title}</div>
          <div class="card-subtext">${genres}</div>
        </div>
      `;

      return card;
    }

    /* ================= SECTION MODAL (NO GENRE CHIPS) ================= */
    window.openSectionModal = function(encodedKey) {
      const movies = window[`sec_cache_${encodedKey}`] || [];
      const title = decodeURIComponent(encodedKey);

      document.getElementById('modalSectionTitle').innerText = title;
      const grid = document.getElementById('modalGridMovies');
      grid.innerHTML = '';

      movies.forEach(movie => {
        grid.appendChild(create16x9Card(movie));
      });

      document.getElementById('sectionViewModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    document.getElementById('closeSectionModalBtn').onclick = () => {
      document.getElementById('sectionViewModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    };

    window.addEventListener('hashchange', () => {
      updateActiveProfile();
      renderUserNavPill();
      buildLiveFeed();
    });

    syncRealtimeUARM();
    syncRealtimeMovies();
    syncRealtimePartners();
  </script>
