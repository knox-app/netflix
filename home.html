<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StreamHotstar - Home</title>
    <!-- Icons & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-main: #090a0e;
            --bg-card: #151821;
            --bg-modal: #16181f;
            --text-primary: #ffffff;
            --text-secondary: #8f98b2;
            --accent-blue: #1c64f2;
            --border-color: #242838;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            overflow-x: hidden;
            padding-bottom: 75px; /* space for bottom nav */
        }

        /* Top Bar */
        .top-nav {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(9, 10, 14, 0.95);
            backdrop-filter: blur(10px);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .top-icons {
            display: flex;
            gap: 16px;
            font-size: 18px;
            color: var(--text-secondary);
        }

        /* Section Containers */
        .section-wrap {
            margin-top: 20px;
            padding-left: 14px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 14px;
            margin-bottom: 12px;
            cursor: pointer;
            user-select: none;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: #f1f3f7;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title i {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 16:9 Horizontal Carousel */
        .carousel-track {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-behavior: smooth;
            padding-right: 14px;
            scrollbar-width: none;
        }
        .carousel-track::-webkit-scrollbar {
            display: none;
        }

        .card-16-9 {
            flex: 0 0 240px;
            position: relative;
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-card);
            transition: transform 0.2s ease;
        }

        .card-16-9:active {
            transform: scale(0.97);
        }

        .poster-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1c202e;
            overflow: hidden;
            position: relative;
        }

        .poster-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Continue Watching Item Styling */
        .cw-card {
            flex: 0 0 220px;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .cw-poster {
            width: 100%;
            aspect-ratio: 16 / 9;
            position: relative;
        }

        .cw-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cw-progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3.5px;
            background: rgba(255, 255, 255, 0.25);
        }

        .cw-progress-fill {
            height: 100%;
            background: #3b82f6;
            width: 65%;
        }

        .cw-info {
            padding: 8px 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .cw-text {
            overflow: hidden;
        }

        .cw-title {
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 160px;
        }

        .cw-time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .cw-dots-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 16px;
            padding: 6px;
            cursor: pointer;
        }

        /* ========================================================
           FULLSCREEN SECTION GRID VIEW (16:9 FORMAT)
        ======================================================== */
        .grid-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-main);
            z-index: 100;
            display: none;
            flex-direction: column;
            overflow-y: auto;
        }

        .grid-page.active {
            display: flex;
        }

        .grid-header {
            position: sticky;
            top: 0;
            background: rgba(9, 10, 14, 0.98);
            backdrop-filter: blur(10px);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .grid-header i {
            font-size: 19px;
            cursor: pointer;
        }

        .grid-header h2 {
            font-size: 17px;
            font-weight: 700;
        }

        .grid-content {
            padding: 14px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 600px) {
            .grid-content {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 900px) {
            .grid-content {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .grid-item {
            cursor: pointer;
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg-card);
        }

        .grid-item .poster-16-9 {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #1c202e;
            overflow: hidden;
        }

        .grid-item .poster-16-9 img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grid-item .item-name {
            font-size: 12px;
            font-weight: 600;
            padding: 6px 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ========================================================
           BOTTOM SHEET (3-DOTS ACTION MODAL)
        ======================================================== */
        .bottom-sheet-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            justify-content: flex-end;
            flex-direction: column;
        }

        .bottom-sheet-backdrop.active {
            display: flex;
        }

        .bottom-sheet {
            background: #171922;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px 18px 30px;
            transform: translateY(100%);
            transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }

        .bottom-sheet-backdrop.active .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 10px;
        }

        .sheet-title {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 85%;
        }

        .sheet-close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
        }

        .sheet-actions {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sheet-action-row {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 6px;
            color: #e2e8f0;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.15s ease;
        }

        .sheet-action-row:active {
            background: rgba(255, 255, 255, 0.06);
        }

        .sheet-action-row i {
            font-size: 18px;
            width: 24px;
            text-align: center;
            color: var(--text-secondary);
        }

        /* Bottom Nav (JioHotstar Style) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 60px;
            background: rgba(9, 10, 14, 0.98);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 40;
        }

        .nav-tab {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-tab.active {
            color: #ffffff;
        }

        .nav-tab i {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Top App Bar -->
    <div class="top-nav">
        <div class="brand-logo">JioHotstar</div>
        <div class="top-icons">
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-regular fa-bell"></i>
        </div>
    </div>

    <!-- 1. CONTINUE WATCHING SECTION -->
    <div class="section-wrap" id="cwSectionWrap">
        <div class="section-header">
            <div class="section-title">Continue Watching</div>
        </div>
        <div class="carousel-track" id="cwTrack">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- 2. NEW ON JIOHOTSTAR (16:9 CAROUSEL - NO LOGO) -->
    <div class="section-wrap">
        <div class="section-header" onclick="openSectionGrid('New on JioHotstar')">
            <div class="section-title">
                New on JioHotstar <i class="fa-solid fa-chevron-right"></i>
            </div>
        </div>
        <div class="carousel-track" id="newOnHotstarTrack">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- 3. TRENDING MOVIES (16:9 CAROUSEL - NO LOGO) -->
    <div class="section-wrap">
        <div class="section-header" onclick="openSectionGrid('Trending Movies')">
            <div class="section-title">
                Trending Movies <i class="fa-solid fa-chevron-right"></i>
            </div>
        </div>
        <div class="carousel-track" id="trendingTrack">
            <!-- Rendered dynamically -->
        </div>
    </div>

    <!-- ========================================================
         FULLSCREEN 16:9 GRID VIEW PAGE
    ======================================================== -->
    <div class="grid-page" id="sectionGridPage">
        <div class="grid-header">
            <i class="fa-solid fa-arrow-left" onclick="closeSectionGrid()"></i>
            <h2 id="gridPageTitle">Section Name</h2>
        </div>
        <div class="grid-content" id="gridContent">
            <!-- 16:9 Grid Cards Rendered Here -->
        </div>
    </div>

    <!-- ========================================================
         CONTINUE WATCHING 3-DOTS BOTTOM SHEET
    ======================================================== -->
    <div class="bottom-sheet-backdrop" id="bottomSheetModal" onclick="closeBottomSheet(event)">
        <div class="bottom-sheet" onclick="event.stopPropagation()">
            <div class="sheet-header">
                <div class="sheet-title" id="sheetMovieTitle">Movie Title</div>
                <button class="sheet-close-btn" onclick="closeBottomSheet()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="sheet-actions">
                <div class="sheet-action-row" onclick="onViewMoreDetails()">
                    <i class="fa-solid fa-circle-info"></i>
                    <span>View More Details</span>
                </div>
                <div class="sheet-action-row" onclick="onRemoveFromContinueWatching()">
                    <i class="fa-solid fa-xmark"></i>
                    <span>Remove from Continue Watching</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-tab">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>Search</span>
        </div>
        <div class="nav-tab active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </div>
        <div class="nav-tab">
            <i class="fa-solid fa-tv"></i>
            <span>TV</span>
        </div>
        <div class="nav-tab">
            <i class="fa-regular fa-circle-user"></i>
            <span>My Space</span>
        </div>
    </div>

<script>
    // Firebase Config (internal-systems-46728)
    const firebaseConfig = {
        apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
        authDomain: "internal-systems-46728.firebaseapp.com",
        projectId: "internal-systems-46728",
        storageBucket: "internal-systems-46728.firebasestorage.app",
        messagingSenderId: "172177452674",
        appId: "1:172177452674:web:155a2417da5531dd7ece9b",
        measurementId: "G-Y87B8VRQ1N"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let allMoviesList = [];
    let selectedCWItem = null;

    // Default Continue Watching state (persisted in localStorage)
    const DEFAULT_CW_ITEMS = [
        {
            docId: "dhurandhar-the-revenge",
            name: "Dhurandhar The Revenge",
            posterH: "https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800&auto=format&fit=crop&q=60",
            timeLeft: "2h 58m left",
            progress: 60
        },
        {
            docId: "alice-in-wonderland",
            name: "Alice in Wonderland",
            posterH: "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800&auto=format&fit=crop&q=60",
            timeLeft: "45m left",
            progress: 40
        }
    ];

    let continueWatchingList = JSON.parse(localStorage.getItem('cw_list')) || DEFAULT_CW_ITEMS;

    // Load Data from Firestore
    async function loadMovies() {
        try {
            const snapshot = await db.collection('Movies').get();
            allMoviesList = snapshot.docs.map(doc => ({
                docId: doc.id,
                ...doc.data()
            }));

            renderContinueWatching();
            renderCarousel('newOnHotstarTrack', allMoviesList);
            renderCarousel('trendingTrack', allMoviesList.slice().reverse());
        } catch (e) {
            console.error("Error fetching Firestore:", e);
            renderContinueWatching();
        }
    }

    // Render Carousel with ONLY Poster.h (NO LOGOS)
    function renderCarousel(trackId, movies) {
        const track = document.getElementById(trackId);
        if (!track) return;
        track.innerHTML = '';

        movies.forEach(movie => {
            const posterUrl = movie["Poster.h"] || movie.Poster_h || movie.Poster || "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800&auto=format&fit=crop&q=60";
            const movieName = movie.Name || movie.docId.replace(/-/g, ' ');

            const card = document.createElement('div');
            card.className = 'card-16-9';
            card.onclick = () => navigateToPreview(movie.docId);

            card.innerHTML = `
                <div class="poster-container">
                    <img src="${posterUrl}" alt="${movieName}" loading="lazy" />
                </div>
            `;
            track.appendChild(card);
        });
    }

    // Render Continue Watching Carousel
    function renderContinueWatching() {
        const track = document.getElementById('cwTrack');
        const wrap = document.getElementById('cwSectionWrap');
        if (!track) return;

        if (continueWatchingList.length === 0) {
            wrap.style.display = 'none';
            return;
        } else {
            wrap.style.display = 'block';
        }

        track.innerHTML = '';
        continueWatchingList.forEach(item => {
            const card = document.createElement('div');
            card.className = 'cw-card';
            card.innerHTML = `
                <div class="cw-poster" onclick="navigateToPreview('${item.docId}')">
                    <img src="${item.posterH}" alt="${item.name}">
                    <div class="cw-progress-bar">
                        <div class="cw-progress-fill" style="width: ${item.progress || 50}%"></div>
                    </div>
                </div>
                <div class="cw-info">
                    <div class="cw-text" onclick="navigateToPreview('${item.docId}')">
                        <div class="cw-title">${item.name}</div>
                        <div class="cw-time">${item.timeLeft || 'Playing'}</div>
                    </div>
                    <button class="cw-dots-btn" onclick="openBottomSheet('${item.docId}', '${item.name.replace(/'/g, "\\'")}')">
                        <i class="fa-solid fa-ellipsis-vertical"></i>
                    </button>
                </div>
            `;
            track.appendChild(card);
        });
    }

    // ==========================================
    // 16:9 GRID VIEW (On Section Name Click)
    // ==========================================
    function openSectionGrid(sectionTitle) {
        document.getElementById('gridPageTitle').innerText = sectionTitle;
        const gridContent = document.getElementById('gridContent');
        gridContent.innerHTML = '';

        allMoviesList.forEach(movie => {
            const posterUrl = movie["Poster.h"] || movie.Poster_h || movie.Poster || "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=800&auto=format&fit=crop&q=60";
            const movieName = movie.Name || movie.docId.replace(/-/g, ' ');

            const gridItem = document.createElement('div');
            gridItem.className = 'grid-item';
            gridItem.onclick = () => navigateToPreview(movie.docId);

            // 16:9 Format Grid Item
            gridItem.innerHTML = `
                <div class="poster-16-9">
                    <img src="${posterUrl}" alt="${movieName}" loading="lazy" />
                </div>
                <div class="item-name">${movieName}</div>
            `;
            gridContent.appendChild(gridItem);
        });

        document.getElementById('sectionGridPage').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeSectionGrid() {
        document.getElementById('sectionGridPage').classList.remove('active');
        document.body.style.overflow = 'auto';
    }

    // ==========================================
    // CONTINUE WATCHING BOTTOM SHEET MODAL
    // ==========================================
    function openBottomSheet(docId, movieName) {
        selectedCWItem = { docId, name: movieName };
        document.getElementById('sheetMovieTitle').innerText = movieName;
        document.getElementById('bottomSheetModal').classList.add('active');
    }

    function closeBottomSheet(e) {
        if (e && e.target && e.target.id !== 'bottomSheetModal' && !e.target.closest('.sheet-close-btn')) return;
        document.getElementById('bottomSheetModal').classList.remove('active');
        selectedCWItem = null;
    }

    // View More Details -> preview#<docId>
    function onViewMoreDetails() {
        if (!selectedCWItem) return;
        const docId = selectedCWItem.docId;
        closeBottomSheet();
        navigateToPreview(docId);
    }

    // Remove from Continue Watching
    function onRemoveFromContinueWatching() {
        if (!selectedCWItem) return;
        const docId = selectedCWItem.docId;
        continueWatchingList = continueWatchingList.filter(item => item.docId !== docId);
        localStorage.setItem('cw_list', JSON.stringify(continueWatchingList));
        renderContinueWatching();
        closeBottomSheet();
    }

    // Navigation Helper to preview#
    function navigateToPreview(docId) {
        window.location.href = `preview#${docId}`;
    }

    // Initialize
    loadMovies();
</script>

</body>
</html>
