<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hotstar Hero Carousel</title>
  
  <!-- Video Engines for Trailers -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-dark: #0f1015;
      --surface-glass: rgba(255, 255, 255, 0.1);
      --surface-glass-hover: rgba(255, 255, 255, 0.18);
      --accent-blue: #0072ef;
      --accent-blue-hover: #0060c7;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* Top Navigation Header */
    .top-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
      background: linear-gradient(180deg, rgba(15, 16, 21, 0.9) 0%, transparent 100%);
      pointer-events: none;
    }
    .brand-logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .brand-logo span { color: var(--accent-blue); font-weight: 700; }

    /* Carousel Main Stage */
    .carousel-stage {
      position: relative;
      width: 100%;
      height: 78vh;
      min-height: 540px;
      max-height: 720px;
      overflow: hidden;
      background: #000;
    }

    /* Individual Slide */
    .carousel-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .carousel-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Media Layers */
    .media-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }
    .banner-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .carousel-slide.active .banner-image {
      transform: scale(1.04);
    }

    .trailer-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      z-index: 2;
      transition: opacity 0.8s ease;
    }
    .trailer-video.playing { opacity: 1; }

    .yt-frame-wrapper {
      position: absolute;
      top: -12%;
      left: -12%;
      width: 124%;
      height: 124%;
      opacity: 0;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    .yt-frame-wrapper.playing { opacity: 1; }
    .yt-frame-wrapper iframe { width: 100%; height: 100%; border: none; }

    /* Clean Authentic Hotstar Overlays */
    .vignette-bottom {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(
        180deg,
        rgba(15, 16, 21, 0.2) 0%,
        rgba(15, 16, 21, 0.05) 25%,
        rgba(15, 16, 21, 0.6) 60%,
        var(--bg-dark) 100%
      );
    }
    .vignette-left {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(
        90deg,
        rgba(15, 16, 21, 0.95) 0%,
        rgba(15, 16, 21, 0.7) 35%,
        rgba(15, 16, 21, 0.2) 65%,
        transparent 100%
      );
    }

    /* Content & Meta Information */
    .slide-info-container {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0 36px 42px;
      max-width: 580px;
    }

    .title-logo {
      max-width: 250px;
      max-height: 95px;
      object-fit: contain;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.85));
    }
    .fallback-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      color: #fff;
    }

    .meta-badge-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .meta-badge-row .dot {
      font-size: 6px;
      color: var(--text-muted);
    }
    .age-badge {
      background: rgba(255, 255, 255, 0.16);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
    }

    .genres-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .story-synopsis {
      font-size: 13px;
      line-height: 1.45;
      color: #c9d0e2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 22px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* Action Buttons Row */
    .button-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .btn-main-watch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 26px;
      border-radius: var(--radius-md);
      background: #ffffff;
      color: #0f1015;
      font-size: 14px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }
    .btn-main-watch:hover {
      background: #f0f0f0;
      transform: scale(1.02);
    }
    .btn-main-watch:active { transform: scale(0.97); }
    .btn-main-watch svg { width: 15px; height: 15px; fill: currentColor; }

    .btn-icon-square {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: var(--surface-glass);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-icon-square:hover { background: var(--surface-glass-hover); }
    .btn-icon-square:active { transform: scale(0.92); }
    .btn-icon-square.active {
      background: rgba(0, 114, 239, 0.25);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
    .btn-icon-square svg { width: 20px; height: 20px; fill: currentColor; }

    .trailer-status-badge {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.55);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(8px);
    }
    .trailer-status-badge.show { display: inline-flex; }
    .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: #e50914; animation: blink 1s infinite alternate; }
    @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

    /* Bottom-Right Thumbnail Preview Strip (Hotstar Style) */
    .preview-strip-container {
      position: absolute;
      bottom: 28px;
      right: 36px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 16, 21, 0.55);
      backdrop-filter: blur(12px);
      padding: 6px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .preview-card-item {
      position: relative;
      width: 72px;
      aspect-ratio: 16/9;
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.25s ease;
      border: 1.5px solid transparent;
    }
    .preview-card-item:hover { opacity: 0.85; }
    .preview-card-item.active {
      opacity: 1;
      border-color: #ffffff;
      transform: scale(1.06);
    }
    .preview-card-item img { width: 100%; height: 100%; object-fit: cover; }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .carousel-stage { height: 74vh; }
      .vignette-left { background: linear-gradient(180deg, transparent 20%, rgba(15, 16, 21, 0.8) 75%, var(--bg-dark) 100%); }
      .slide-info-container {
        padding: 0 20px 32px;
        max-width: 100%;
        align-items: center;
        text-align: center;
      }
      .button-row { justify-content: center; }
      .preview-strip-container {
        right: 50%;
        transform: translateX(50%);
        bottom: 12px;
        padding: 4px;
        gap: 6px;
      }
      .preview-card-item { width: 54px; }
    }

    /* Toast Notification */
    .toast-box {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: rgba(22, 24, 34, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
    }
    .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="top-header">
    <div class="brand-logo">Disney+ <span>hotstar</span></div>
  </header>

  <!-- Carousel Viewport -->
  <div class="carousel-stage" id="carouselStage">
    <div id="slidesViewport"></div>

    <!-- Vignette Shadows -->
    <div class="vignette-bottom"></div>
    <div class="vignette-left"></div>

    <!-- Mini Preview Cards Bar (Bottom Right) -->
    <div class="preview-strip-container" id="previewStrip"></div>
  </div>

  <div class="toast-box" id="toastBox">Added to Watchlist</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firestore Credentials
    const channelConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728"
    };
    const authConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      projectId: "question-metabase"
    };

    const channelApp = initializeApp(channelConfig, "channelApp");
    const channelDb = getFirestore(channelApp);
    const authApp = initializeApp(authConfig, "authApp");
    const authDb = getFirestore(authApp);

    // State Variables
    let allContent = [];
    let heroCarouselList = [];
    let activeIndex = 0;
    let slideTimer = null;
    let isMuted = true;
    let currentUser = null;
    let userWatchlist = [];

    function initUser() {
      try {
        const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
        currentUser = stored ? JSON.parse(stored) : { id: "guest_user", Watchlist: [] };
      } catch(e) {
        currentUser = { id: "guest_user", Watchlist: [] };
      }
      userWatchlist = currentUser.Watchlist || [];
    }

    function showToast(msg) {
      const t = document.getElementById('toastBox');
      t.innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    // Accurate Field Extractors from Firestore Document
    function getBanner(doc) {
      return doc["Poster.h"] || doc.Banner || doc.Poster_h || doc.Poster || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&auto=format&fit=crop&q=80";
    }
    function getLogo(doc) {
      return doc.Logo || doc["Logo.png"] || "";
    }
    function getDescription(doc) {
      return doc.Discription || doc.Description || doc.Story || "Stream this blockbuster title now on Disney+ Hotstar.";
    }

    // Multi-Vector Ranking Algorithm: Recency, Watchlist, Genres & Trailer availability
    function scoreAndRankContent(items) {
      const nowYear = new Date().getFullYear();

      return items.map(item => {
        let score = 0;

        // Recency Scoring
        const year = parseInt(item.Release_Date || item.Year || "2021");
        const diff = Math.max(0, nowYear - year);
        if (diff <= 1) score += 35;
        else if (diff <= 3) score += 20;
        else score += 10;

        // Watchlist personal boost
        if (userWatchlist.includes(item.id)) score += 25;

        // High popularity genre boost
        const genres = (item.Genres || "").toLowerCase();
        if (genres.includes("adventure") || genres.includes("fantasy") || genres.includes("action") || genres.includes("comedy")) {
          score += 15;
        }

        // Boost items with active trailers for better carousel preview
        if (item.Trailer && item.Trailer.trim().length > 0) score += 15;

        return { item, score };
      })
      .sort((a, b) => b.score - a.score)
      .map(entry => entry.item);
    }

    // Real-Time Listener across Movies, Shows & Live TV
    function fetchContent() {
      const collections = ["Movies", "Shows", "TV Shows", "Live TV"];
      let pool = [];

      collections.forEach(col => {
        onSnapshot(collection(channelDb, col), (snap) => {
          snap.forEach(d => {
            const data = d.data();
            pool.push({ id: d.id, _col: col, ...data });
          });

          if (pool.length > 0) {
            allContent = pool;
            heroCarouselList = scoreAndRankContent(allContent).slice(0, 6);
            renderCarousel();
          }
        }, () => {
          // Fallback if network blocked
          if (allContent.length === 0) {
            allContent = getFallbackData();
            heroCarouselList = scoreAndRankContent(allContent);
            renderCarousel();
          }
        });
      });
    }

    function getFallbackData() {
      return [
        {
          id: "Alice-in-wonderland",
          Name: "Alice in Wonderland",
          Release_Date: "2021",
          Age_Rating: "U",
          Language: "Hindi",
          Genres: "Adventure, Fantasy, Family",
          Discription: "When a curious girl follows a talking rabbit into a topsy-turvy world, she must navigate riddles and madness to find her way home.",
          "Poster.h": "https://img10.hotstar.com/image/upload/f_auto/sources/r1/cms/prod/4288/674288-h",
          Logo: "https://img10.hotstar.com/image/upload/f_auto,h_156/sources/r1/cms/prod/8933/808933-t",
          Trailer: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
        },
        {
          id: "shaitan-ghar",
          Name: "Khali Dimaag Shaitan Ka Ghar",
          Release_Date: "2026",
          Age_Rating: "U",
          Language: "Hindi",
          Genres: "Comedy, Kids, Animation, Sitcom",
          Discription: "A ghost spirit possesses Happy, and Pinaki must defeat it in three challenges within 30 minutes to save his friend.",
          "Poster.h": "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&auto=format&fit=crop&q=80",
          Logo: "",
          Trailer: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
        }
      ];
    }

    // Render Hero Carousel Elements
    function renderCarousel() {
      const viewport = document.getElementById('slidesViewport');
      const previewStrip = document.getElementById('previewStrip');

      viewport.innerHTML = '';
      previewStrip.innerHTML = '';

      heroCarouselList.forEach((item, idx) => {
        const isAdded = userWatchlist.includes(item.id);
        const bannerUrl = getBanner(item);
        const logoUrl = getLogo(item);
        const titleText = item.Name || item.Title || "Hotstar Featured";
        const descText = getDescription(item);

        const year = item.Release_Date || item.Year || "2021";
        const age = item.Age_Rating || item["Age Rating"] || "U";
        const lang = item.Language || "Hindi";
        const genres = item.Genres || "Drama, Adventure";

        const slide = document.createElement('div');
        slide.className = `carousel-slide ${idx === 0 ? 'active' : ''}`;
        slide.id = `slide_${idx}`;
        slide.innerHTML = `
          <div class="media-layer">
            <img class="banner-image" src="${bannerUrl}" alt="${titleText}" loading="eager">
            <video class="trailer-video" id="video_trailer_${idx}" playsinline muted></video>
            <div id="yt_wrap_${idx}" class="yt-frame-wrapper"></div>
          </div>

          <div class="slide-info-container">
            ${logoUrl ? `<img class="title-logo" src="${logoUrl}" alt="${titleText}">` : `<h1 class="fallback-title">${titleText}</h1>`}
            
            <div class="meta-badge-row">
              <span>${year}</span>
              <span class="dot">●</span>
              <span class="age-badge">${age}</span>
              <span class="dot">●</span>
              <span>${lang}</span>
            </div>

            <div class="genres-text">${genres}</div>

            <p class="story-synopsis">${descText}</p>

            <div class="button-row">
              <a class="btn-main-watch" href="1.html?watch=${item.id}">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span>Watch Now</span>
              </a>

              <button class="btn-icon-square ${isAdded ? 'active' : ''}" onclick="window.toggleWatchlist('${item.id}')" title="Watchlist">
                <svg viewBox="0 0 24 24">
                  ${isAdded 
                    ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>' 
                    : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>'}
                </svg>
              </button>

              <button class="btn-icon-square" id="mute_btn_${idx}" onclick="window.toggleMute(${idx})" style="display:none;" title="Mute/Unmute">
                <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
              </button>

              <div class="trailer-status-badge" id="trailer_badge_${idx}">
                <div class="pulse-dot"></div> Trailer
              </div>
            </div>
          </div>
        `;
        viewport.appendChild(slide);

        // Bottom Right Preview Item
        const previewCard = document.createElement('div');
        previewCard.className = `preview-card-item ${idx === 0 ? 'active' : ''}`;
        previewCard.onclick = () => jumpToSlide(idx);
        previewCard.innerHTML = `<img src="${bannerUrl}" alt="${titleText}" loading="lazy">`;
        previewStrip.appendChild(previewCard);
      });

      startBannerToTrailerCycle(0);
    }

    // 6-Second Banner -> Trailer Pipeline
    function startBannerToTrailerCycle(index) {
      clearTimeout(slideTimer);
      stopActiveMedia();

      const item = heroCarouselList[index];
      if (!item) return;

      const videoEl = document.getElementById(`video_trailer_${index}`);
      const trailerUrl = (item.Trailer || item.trailer || "").trim();

      // Step 1: Display clean Banner + Logo for 6 seconds
      slideTimer = setTimeout(() => {
        if (trailerUrl) {
          playTrailerVideo(index, trailerUrl, videoEl);
        } else {
          nextSlide();
        }
      }, 6000);
    }

    function playTrailerVideo(index, url, videoEl) {
      const muteBtn = document.getElementById(`mute_btn_${index}`);
      const badge = document.getElementById(`trailer_badge_${index}`);

      if (url.includes('.mp4') || url.includes('.m3u8')) {
        videoEl.src = url;
        videoEl.muted = isMuted;
        videoEl.play().then(() => {
          videoEl.classList.add('playing');
          if (muteBtn) muteBtn.style.display = 'flex';
          if (badge) badge.classList.add('show');
        }).catch(() => nextSlide());

        videoEl.onended = () => nextSlide();
        videoEl.onerror = () => nextSlide();
      } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
        const ytHost = document.getElementById(`yt_wrap_${index}`);
        const ytId = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=))([\w-]{11})/)?.[1];
        if (ytId) {
          ytHost.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&loop=0" allow="autoplay"></iframe>`;
          ytHost.classList.add('playing');
          if (badge) badge.classList.add('show');
          slideTimer = setTimeout(nextSlide, 25000);
        } else {
          nextSlide();
        }
      } else {
        nextSlide();
      }
    }

    function stopActiveMedia() {
      document.querySelectorAll('.trailer-video').forEach(v => {
        v.pause();
        v.removeAttribute('src');
        v.load();
        v.classList.remove('playing');
      });
      document.querySelectorAll('.yt-frame-wrapper').forEach(y => {
        y.innerHTML = '';
        y.classList.remove('playing');
      });
      document.querySelectorAll('.trailer-status-badge').forEach(b => b.classList.remove('show'));
    }

    function nextSlide() {
      if (heroCarouselList.length === 0) return;
      const next = (activeIndex + 1) % heroCarouselList.length;
      jumpToSlide(next);
    }

    function jumpToSlide(idx) {
      clearTimeout(slideTimer);
      stopActiveMedia();

      document.querySelectorAll('.carousel-slide').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.preview-card-item').forEach(p => p.classList.remove('active'));

      activeIndex = idx;

      const currentSlide = document.getElementById(`slide_${idx}`);
      const currentPreview = document.querySelectorAll('.preview-card-item')[idx];

      if (currentSlide) currentSlide.classList.add('active');
      if (currentPreview) currentPreview.classList.add('active');

      startBannerToTrailerCycle(idx);
    }

    // Audio Mute Toggle
    window.toggleMute = function(idx) {
      const vid = document.getElementById(`video_trailer_${idx}`);
      const muteBtn = document.getElementById(`mute_btn_${idx}`);
      if (vid) {
        isMuted = !isMuted;
        vid.muted = isMuted;
        muteBtn.innerHTML = isMuted 
          ? '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>'
          : '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
      }
    };

    // Watchlist Persistence
    window.toggleWatchlist = async function(id) {
      const idx = userWatchlist.indexOf(id);
      const isRemoving = idx > -1;

      if (isRemoving) {
        userWatchlist.splice(idx, 1);
        showToast("Removed from Watchlist");
      } else {
        userWatchlist.push(id);
        showToast("Added to Watchlist");
      }

      if (currentUser && currentUser.id && currentUser.id !== "guest_user") {
        try {
          const ref = doc(authDb, "UARM", currentUser.id);
          await updateDoc(ref, { Watchlist: isRemoving ? arrayRemove(id) : arrayUnion(id) });
        } catch(e) {}
      }

      const btn = document.querySelector(`#slide_${activeIndex} .btn-icon-square`);
      if (btn) {
        btn.classList.toggle('active', !isRemoving);
        btn.innerHTML = `<svg viewBox="0 0 24 24">${!isRemoving ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>' : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>'}</svg>`;
      }
    };

    // Run
    initUser();
    fetchContent();
  </script>
</body>
</html>
