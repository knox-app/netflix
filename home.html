<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hotstar Hero Carousel</title>
  
  <!-- HLS & YouTube Support for Trailers -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-dark: #090a10;
      --accent-blue: #0072ef;
      --accent-gradient: linear-gradient(90deg, #0072ef 0%, #b80093 100%);
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --text-dim: #5c6275;
      --radius-sm: 8px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      user-select: none;
    }

    /* Top Brand & Status */
    .top-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: linear-gradient(180deg, rgba(9, 10, 16, 0.85) 0%, transparent 100%);
      pointer-events: none;
    }
    .brand-title {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      pointer-events: auto;
    }
    .brand-title span { color: var(--accent-blue); }

    /* Carousel Wrapper */
    .carousel-root {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 75vh;
      min-height: 540px;
      max-height: 680px;
      overflow: hidden;
      background: #000;
    }

    /* Individual Slide */
    .carousel-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .carousel-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Background Media Layer */
    .slide-media-layer {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }
    .slide-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      transition: transform 6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .carousel-slide.active .slide-banner-img {
      transform: scale(1.05);
    }

    .slide-video-trailer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      z-index: 2;
      transition: opacity 0.8s ease-in-out;
    }
    .slide-video-trailer.playing {
      opacity: 1;
    }

    .slide-yt-container {
      position: absolute;
      top: -15%;
      left: -15%;
      width: 130%;
      height: 130%;
      opacity: 0;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    .slide-yt-container.playing {
      opacity: 1;
    }
    .slide-yt-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Cinematic Gradient Vignettes */
    .vignette-overlay {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: linear-gradient(
        180deg,
        rgba(9, 10, 16, 0.3) 0%,
        rgba(9, 10, 16, 0) 25%,
        rgba(9, 10, 16, 0.6) 60%,
        var(--bg-dark) 98%
      );
    }
    .purple-mist-glow {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: radial-gradient(circle at 60% 65%, rgba(140, 20, 180, 0.25) 0%, transparent 65%);
    }

    /* Content & Meta Information */
    .slide-content {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      padding: 0 24px 34px;
      max-width: 620px;
    }

    .title-logo-img {
      max-width: 240px;
      max-height: 90px;
      object-fit: contain;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.8));
    }
    .title-text-fallback {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .meta-pills-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .meta-pills-row span.dot {
      font-size: 8px;
      color: var(--text-muted);
      margin: 0 2px;
    }

    .genre-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      opacity: 0.95;
    }
    .genre-row span.pipe { color: var(--text-dim); }

    .story-desc {
      font-size: 12.5px;
      line-height: 1.45;
      color: #d1d6e6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 20px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    /* Buttons Row */
    .cta-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .btn-watch {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-md);
      background: var(--accent-gradient);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(0, 114, 239, 0.45);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    .btn-watch:active {
      transform: scale(0.96);
      filter: brightness(1.1);
    }
    .btn-watch svg { width: 16px; height: 16px; fill: currentColor; }

    .btn-watchlist {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .btn-watchlist:active { transform: scale(0.92); }
    .btn-watchlist.active {
      background: rgba(0, 114, 239, 0.35);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
    .btn-watchlist svg { width: 20px; height: 20px; fill: currentColor; }

    /* Indicator Dots */
    .carousel-indicators {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .indicator-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }
    .indicator-dot.active {
      width: 18px;
      border-radius: 4px;
      background: #ffffff;
    }

    /* Toast */
    .toast-pill {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(20, 24, 35, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
    }
    .toast-pill.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {
      .slide-content {
        align-items: center;
        text-align: center;
        padding: 0 20px 28px;
      }
      .cta-row {
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <!-- Top App Brand -->
  <header class="top-header">
    <div class="brand-title">Disney+ <span>hotstar</span></div>
  </header>

  <!-- Hero Carousel Module -->
  <div class="carousel-root" id="heroCarousel">
    <div id="slidesHost"></div>

    <div class="vignette-overlay"></div>
    <div class="purple-mist-glow"></div>

    <!-- Indicator Dots -->
    <div class="carousel-indicators" id="carouselIndicators"></div>
  </div>

  <!-- Toast Notification -->
  <div class="toast-pill" id="toastPill">Added to Watchlist</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firestore Configuration
    const channelConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728"
    };
    const authConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      projectId: "question-metabase"
    };

    const channelApp = initializeApp(channelConfig, "channelApp");
    const channelDb = getFirestore(channelApp);
    const authApp = initializeApp(authConfig, "authApp");
    const authDb = getFirestore(authApp);

    // State Variables
    let rawItems = [];
    let carouselItems = [];
    let currentSlideIdx = 0;
    let slideTimer = null;
    let currentUser = null;
    let userWatchlist = [];

    // 1. Initialize User & Watchlist
    function initUser() {
      try {
        const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
        currentUser = stored ? JSON.parse(stored) : { id: "guest_user", Watchlist: [] };
      } catch(e) {
        currentUser = { id: "guest_user", Watchlist: [] };
      }
      userWatchlist = currentUser.Watchlist || [];
    }

    function showToast(msg) {
      const el = document.getElementById('toastPill');
      el.innerText = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }

    function getBanner(item) {
      return item["Poster.h"] || item.Poster_h || item.poster_h || item.Banner || item.banner || item.Poster || "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&auto=format&fit=crop&q=80";
    }

    function getLogo(item) {
      return item["Logo.png"] || item.Logo || item.logo || "";
    }

    // 2. Multi-Vector Recommendation Algorithm for Carousel Selection
    function rankContentForCarousel(items) {
      const nowYear = new Date().getFullYear();

      return items.map(item => {
        let score = 0;

        // Recency Score (up to 30 pts)
        const year = parseInt(item.Year || item["Release Year"] || "2020");
        const age = Math.max(0, nowYear - year);
        if (age <= 1) score += 30;
        else if (age <= 3) score += 18;
        else score += 10;

        // Watchlist Affinity (20 pts)
        if (userWatchlist.includes(item.id)) score += 20;

        // High priority genres & studio tags
        const genres = (item.Genres || item.Genre || "").toLowerCase();
        if (genres.includes("animation") || genres.includes("action") || genres.includes("comedy") || genres.includes("drama")) {
          score += 15;
        }
        if (item.Trailer || item.trailer) score += 10; // Prioritize items with rich preview trailers

        return { item, score };
      })
      .sort((a, b) => b.score - a.score)
      .map(entry => entry.item);
    }

    // 3. Listen to Firestore or Fallback Data
    function startDataListener() {
      const collections = ["Movies", "Shows", "Live TV"];
      let pool = [];

      collections.forEach(colName => {
        onSnapshot(collection(channelDb, colName), (snap) => {
          snap.forEach(d => pool.push({ id: d.id, _collection: colName, ...d.data() }));
          if (pool.length > 0) {
            rawItems = pool;
            carouselItems = rankContentForCarousel(rawItems).slice(0, 6);
            renderCarousel();
          }
        }, () => {
          // Fallback demo data
          if (rawItems.length === 0) {
            rawItems = getDemoDataset();
            carouselItems = rankContentForCarousel(rawItems);
            renderCarousel();
          }
        });
      });
    }

    function getDemoDataset() {
      return [
        {
          id: "shaitan_ghar",
          Name: "Khali Dimaag Shaitan Ka Ghar",
          Year: "2026",
          Duration: "46m",
          Language: "Hindi",
          "Age Rating": "U",
          "Multi-Language": { Hindi: "1", Tamil: "1", Telugu: "1", Kannada: "1", Malayalam: "1", Bengali: "1", Marathi: "1" },
          Genres: "Comedy, Kids, Animation, Sitcom",
          Description: "A ghost spirit possesses Happy, and Pinaki must defeat it in three challenges within 30 minutes to save his friend.",
          "Poster.h": "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=1200&auto=format&fit=crop&q=80",
          Logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/de/Aladdin_2019_logo.svg/500px-Aladdin_2019_logo.svg.png",
          Trailer: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
        },
        {
          id: "aladdin_2021",
          Name: "Aladdin",
          Year: "2021",
          Duration: "2h 8m",
          Language: "English",
          "Age Rating": "U/A 13+",
          "Multi-Language": { Hindi: "1", Tamil: "1", Telugu: "1" },
          Genres: "Drama, Fantasy, Adventure, Romance",
          Description: "A street urchin embarks on a magical adventure after finding a lamp that unleashes a wisecracking Genie.",
          "Poster.h": "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1200&auto=format&fit=crop&q=80",
          Trailer: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
        }
      ];
    }

    // 4. Render Carousel Slides and Indicators
    function renderCarousel() {
      const host = document.getElementById('slidesHost');
      const indicators = document.getElementById('carouselIndicators');

      host.innerHTML = '';
      indicators.innerHTML = '';

      carouselItems.forEach((item, idx) => {
        const isAdded = userWatchlist.includes(item.id);
        const bannerUrl = getBanner(item);
        const logoUrl = getLogo(item);
        const titleText = item.Name || item.Title || "Hotstar Special";

        const year = item.Year || "2026";
        const rating = item["Age Rating"] || item.Rating || "U";
        const duration = item.Duration || "46m";
        const langs = item["Multi-Language"] ? `${Object.keys(item["Multi-Language"]).length + 1} Languages` : (item.Language || "Hindi");

        const genres = (item.Genres || "Comedy, Kids, Animation").split(',').map(g => g.trim()).slice(0, 4);

        const slide = document.createElement('div');
        slide.className = `carousel-slide ${idx === 0 ? 'active' : ''}`;
        slide.id = `slide_${idx}`;
        slide.innerHTML = `
          <div class="slide-media-layer">
            <img class="slide-banner-img" src="${bannerUrl}" alt="${titleText}" loading="eager">
            <video class="slide-video-trailer" id="trailer_vid_${idx}" playsinline muted></video>
            <div id="yt_frame_${idx}" class="slide-yt-container"></div>
          </div>

          <div class="slide-content">
            ${logoUrl ? `<img class="title-logo-img" src="${logoUrl}" alt="${titleText}">` : `<h1 class="title-text-fallback">${titleText}</h1>`}
            
            <div class="meta-pills-row">
              <span>${year}</span>
              <span class="dot">•</span>
              <span>${rating}</span>
              <span class="dot">•</span>
              <span>${duration}</span>
              <span class="dot">•</span>
              <span>${langs}</span>
            </div>

            <div class="genre-row">
              ${genres.join(' <span class="pipe">|</span> ')}
            </div>

            <p class="story-desc">${item.Description || "Stream this blockbuster title now on Disney+ Hotstar."}</p>

            <div class="cta-row">
              <a class="btn-watch" href="1.html?watch=${item.id}">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span>Upgrade to Watch</span>
              </a>
              <button class="btn-watchlist ${isAdded ? 'active' : ''}" onclick="window.toggleWatchlist('${item.id}')" title="Watchlist">
                <svg viewBox="0 0 24 24">
                  ${isAdded 
                    ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>' 
                    : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>'}
                </svg>
              </button>
            </div>
          </div>
        `;
        host.appendChild(slide);

        // Indicator
        const dot = document.createElement('div');
        dot.className = `indicator-dot ${idx === 0 ? 'active' : ''}`;
        dot.onclick = () => jumpToSlide(idx);
        indicators.appendChild(dot);
      });

      startSlideCycle(0);
    }

    // 5. 6-Second Banner & Trailer Engine
    function startSlideCycle(idx) {
      clearTimeout(slideTimer);
      stopTrailers();

      const item = carouselItems[idx];
      if (!item) return;

      const videoEl = document.getElementById(`trailer_vid_${idx}`);
      const trailerUrl = item.Trailer || item.trailer || "";

      // Show Banner for 6 seconds
      slideTimer = setTimeout(() => {
        if (trailerUrl) {
          playTrailerMedia(idx, trailerUrl, videoEl);
        } else {
          nextSlide();
        }
      }, 6000);
    }

    function playTrailerMedia(idx, url, videoEl) {
      if (url.includes('.mp4') || url.includes('.m3u8')) {
        videoEl.src = url;
        videoEl.muted = true;
        videoEl.play().then(() => {
          videoEl.classList.add('playing');
        }).catch(() => nextSlide());

        videoEl.onended = () => nextSlide();
        videoEl.onerror = () => nextSlide();
      } else if (url.includes('youtube') || url.includes('youtu.be')) {
        const ytHost = document.getElementById(`yt_frame_${idx}`);
        const ytId = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=))([\w-]{11})/)?.[1];
        if (ytId) {
          ytHost.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&loop=0" allow="autoplay"></iframe>`;
          ytHost.classList.add('playing');
          slideTimer = setTimeout(nextSlide, 20000);
        } else {
          nextSlide();
        }
      } else {
        nextSlide();
      }
    }

    function stopTrailers() {
      document.querySelectorAll('.slide-video-trailer').forEach(v => {
        v.pause();
        v.removeAttribute('src');
        v.load();
        v.classList.remove('playing');
      });
      document.querySelectorAll('.slide-yt-container').forEach(y => {
        y.innerHTML = '';
        y.classList.remove('playing');
      });
    }

    function nextSlide() {
      if (carouselItems.length === 0) return;
      const nextIdx = (currentSlideIdx + 1) % carouselItems.length;
      jumpToSlide(nextIdx);
    }

    function jumpToSlide(idx) {
      clearTimeout(slideTimer);
      stopTrailers();

      document.querySelectorAll('.carousel-slide').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.indicator-dot').forEach(d => d.classList.remove('active'));

      currentSlideIdx = idx;

      const slide = document.getElementById(`slide_${idx}`);
      const dot = document.querySelectorAll('.indicator-dot')[idx];

      if (slide) slide.classList.add('active');
      if (dot) dot.classList.add('active');

      startSlideCycle(idx);
    }

    // 6. Watchlist Toggle
    window.toggleWatchlist = async function(id) {
      const idx = userWatchlist.indexOf(id);
      const isRemoving = idx > -1;

      if (isRemoving) {
        userWatchlist.splice(idx, 1);
        showToast("Removed from Watchlist");
      } else {
        userWatchlist.push(id);
        showToast("Added to Watchlist");
      }

      if (currentUser && currentUser.id && currentUser.id !== "guest_user") {
        try {
          const uRef = doc(authDb, "UARM", currentUser.id);
          await updateDoc(uRef, { Watchlist: isRemoving ? arrayRemove(id) : arrayUnion(id) });
        } catch(e){}
      }

      const btn = document.querySelector(`#slide_${currentSlideIdx} .btn-watchlist`);
      if (btn) {
        btn.classList.toggle('active', !isRemoving);
        btn.innerHTML = `<svg viewBox="0 0 24 24">${!isRemoving ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>' : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>'}</svg>`;
      }
    };

    // Run
    initUser();
    startDataListener();
  </script>
</body>
</html>
