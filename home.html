<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>My Space | Watch Movies, Shows & Live TV</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #0f1015;
      --card-bg: #161822;
      --accent: #e50914;
      --accent-blue: #0072ef;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --border-color: rgba(255, 255, 255, 0.08);
      --chip-bg: #1a1e2b;
      --chip-active: #2b3347;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 85px;
    }

    /* ================= TOP NAVBAR ================= */
    .navbar {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      height: 68px;
      padding: 0 4%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      background: rgba(15, 16, 21, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
    }
    .nav-left { display: flex; align-items: center; gap: 32px; }
    .brand-logo {
      font-size: 21px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      letter-spacing: -0.5px;
    }
    .brand-logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 22px; list-style: none; }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      position: relative;
    }
    .nav-link:hover, .nav-link.active { color: #fff; }
    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      padding: 4px 12px 4px 6px;
      border-radius: 24px;
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      object-fit: cover;
      background: #232733;
    }
    .kids-badge {
      font-size: 10px;
      background: #ffb703;
      color: #000;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* ================= MAIN CONTAINER ================= */
    .main-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 4% 40px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }
    .section-block { display: flex; flex-direction: column; gap: 14px; }
    .section-header-row {
      display: flex;
      align-items: center;
      cursor: pointer;
      width: fit-content;
      gap: 10px;
      transition: opacity 0.2s;
    }
    .section-header-row:hover { opacity: 0.85; }
    .section-heading {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-heading i.fa-chevron-right {
      font-size: 13px;
      color: var(--text-muted);
      transition: transform 0.2s ease;
    }
    .section-header-row:hover i.fa-chevron-right {
      transform: translateX(4px);
      color: #fff;
    }
    .section-badge {
      font-size: 11px;
      font-weight: 700;
      background: rgba(0, 114, 239, 0.15);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 114, 239, 0.3);
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    /* ================= 16:9 CARDS (NO LOGOS, NO RATINGS) ================= */
    .carousel-wrapper { position: relative; }
    .carousel-track {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-behavior: smooth;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .carousel-track::-webkit-scrollbar { display: none; }

    .card-16-9 {
      flex: 0 0 240px;
      width: 240px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .card-16-9:hover { transform: scale(1.03); }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #141721;
      border: 1px solid var(--border-color);
    }
    .card-thumb-wrap img.main-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-play-hover {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .card-16-9:hover .card-play-hover { opacity: 1; }
    .card-play-btn-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .card-details { padding: 8px 2px 0; }
    .card-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    .card-subtext {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .carousel-arrow {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(15, 16, 21, 0.85);
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .carousel-wrapper:hover .carousel-arrow { opacity: 1; }
    .carousel-arrow.left { left: -14px; }
    .carousel-arrow.right { right: -14px; }
    .carousel-arrow:hover { background: var(--accent); }

    /* ================= GENRE FILTER PILLS ================= */
    .genre-filter-scroller {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 4px 0 14px;
      scrollbar-width: none;
    }
    .genre-filter-scroller::-webkit-scrollbar { display: none; }

    .genre-chip {
      background: var(--chip-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .genre-chip:hover { color: #fff; background: var(--chip-active); }
    .genre-chip.active {
      background: var(--chip-active);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.4);
    }

    /* ================= SECTION MODAL PAGE ================= */
    .section-modal-page {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-dark);
      display: none;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px 4% 60px;
    }
    .section-modal-page.active { display: flex; }
    .modal-nav-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }
    .modal-title-box { display: flex; align-items: center; gap: 16px; }
    .btn-close-modal {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      padding: 6px;
    }
    .modal-page-title { font-size: 24px; font-weight: 800; }
    .modal-grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 14px;
    }

    /* ================= MOBILE BOTTOM NAV ================= */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 16, 21, 0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-color);
      z-index: 2000;
      justify-content: space-around;
      align-items: center;
    }
    .nav-item-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 10px;
      font-weight: 600;
      width: 25%;
    }
    .nav-item-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .nav-item-btn.active, .nav-item-btn:hover { color: #fff; }
    .nav-item-btn.active svg { fill: var(--accent); }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .mobile-bottom-nav { display: flex; }
      .card-16-9 { flex: 0 0 190px; width: 190px; }
      .carousel-arrow { display: none; }
    }
  </style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <a href="home.html#movies" class="brand-logo">
        <i class="fa-solid fa-play-circle" style="color:var(--accent);"></i>
        My<span>Space</span>
      </a>
      <ul class="nav-links">
        <li><a class="nav-link" data-hash="movies" href="#movies">Movies</a></li>
        <li><a class="nav-link" data-hash="shows" href="#shows">Shows</a></li>
        <li><a class="nav-link" data-hash="tvshows" href="#tvshows">TV Shows</a></li>

    <div class="nav-right" id="navAuthSlot">

    </div>
  </header>

  <!-- Feed Container -->
  <main class="main-container" id="sectionsContainer">
    <div style="text-align: center; padding: 60px; color: var(--text-muted);">
      <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i>
      <p style="margin-top:12px;">Loading feeds...</p>
    </div>
  </main>

  <!-- Section Movies Grid Modal with Filter Chips (Screenshot 2 Design) -->
  <div class="section-modal-page" id="sectionViewModal">
    <div class="modal-nav-header">
      <div class="modal-title-box">
        <button class="btn-close-modal" id="closeSectionModalBtn">
          <i class="fa-solid fa-arrow-left"></i>
        </button>
        <h2 class="modal-page-title" id="modalSectionTitle">Section</h2>
      </div>
    </div>
    <div class="genre-filter-scroller" id="modalGenrePillsRow"></div>
    <div class="modal-grid-container" id="modalGridMovies"></div>
  </div>

  <!-- Mobile Bottom Nav -->
  <nav class="mobile-bottom-nav">
    <a href="home.html#movies" class="nav-item-btn active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </a>
    <a href="search.html" class="nav-item-btn">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <span>Search</span>
    </a>
    <a href="downloads.html" class="nav-item-btn">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      <span>Download</span>
    </a>
    <a href="onboarding.html" class="nav-item-btn">
      <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      <span>My Space</span>
    </a>
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      getDoc, 
      getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Channel & Systems Database
    const channelConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728"
    };
    const app = initializeApp(channelConfig);
    const db = getFirestore(app);

    // Profile state
    let activeProfile = null;
    let isKidsProfile = false;
    let userMaxAgeRating = null;

    // Standard genre buckets
    const ADULT_GENRES = [
      "Action", "Crime", "Family", "Biopic", "Kids", "Romance", "Drama", "Comedy", 
      "Mythology", "Teen", "Sci-Fi", "Horror", "Anime", "Thriller", "Adventure", 
      "Animation", "Fantasy", "Historic", "Superhero", "Musical", "Mystery"
    ];

    const KIDS_GENRES = [
      "Kids", "Animation", "Family", "Superhero", "Action", "Adventure", 
      "Princess", "Fairy Tale", "Comedy", "Mythology", "Anime", "Musical"
    ];

    // Age Rating hierarchy scale (lower number = younger audience)
    const AGE_RANKS = {
      "U": 1,
      "G": 1,
      "TV-Y": 1,
      "ALL": 1,
      "U/A 7+": 2,
      "TV-Y7": 2,
      "U/A 13+": 3,
      "PG-13": 3,
      "U/A 16+": 4,
      "A": 5,
      "18+": 5,
      "R": 5
    };

    function safeUrl(url) {
      if (!url) return '';
      return url.trim().replace(/^http:\/\//i, 'https://');
    }

    function getPosterH(c) {
      if (!c) return 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800';
      return safeUrl(c["Poster.h"] || c.Poster_h || c.Banner || c.banner || c["Poster.v"] || c.Poster || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800');
    }

    function parseGenres(field) {
      if (!field) return [];
      if (Array.isArray(field)) return field.map(g => String(g).trim().toLowerCase()).filter(Boolean);
      if (typeof field === 'string') return field.split(/[,/|•]+/).map(g => g.trim().toLowerCase()).filter(Boolean);
      return [String(field).trim().toLowerCase()];
    }

    function mixupArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    /* ================= 4. PROFILE ONBOARDING COMPLIANCE ================= */
    function resolveActiveProfile() {
      // Check query or hash parameter (e.g. #movies&user#1)
      const hash = window.location.hash;
      let targetUserIdx = null;

      if (hash.includes('user#')) {
        targetUserIdx = parseInt(hash.split('user#')[1], 10);
      }

      // Check localStorage
      const cachedProfile = localStorage.getItem('active_profile');
      const cachedUser = localStorage.getItem('active_user') || localStorage.getItem('UARM');
      const userData = cachedUser ? JSON.parse(cachedUser) : null;

      if (targetUserIdx !== null && userData?.Profiles && userData.Profiles[targetUserIdx]) {
        activeProfile = userData.Profiles[targetUserIdx];
        localStorage.setItem('active_profile', JSON.stringify(activeProfile));
      } else if (cachedProfile) {
        activeProfile = JSON.parse(cachedProfile);
      } else if (userData?.Profiles && userData.Profiles.length > 0) {
        activeProfile = userData.Profiles[0];
        localStorage.setItem('active_profile', JSON.stringify(activeProfile));
      }

      // If still no profile, send to onboarding
      if (!activeProfile) {
        window.location.href = 'onboarding.html';
        return false;
      }

      isKidsProfile = String(activeProfile.Kids).toLowerCase() === "true";
      userMaxAgeRating = activeProfile.Age_Rating || (isKidsProfile ? "U/A 7+" : null);

      // Render top right profile button
      const slot = document.getElementById('navAuthSlot');
      slot.innerHTML = `
        <a href="onboarding.html" class="user-pill">
          <img src="${activeProfile.Avatar || 'https://img1.hotstarext.com/image/upload/w_auto,c_fill/v1/feature/profile/27.png'}" class="user-avatar" />
          <span>${activeProfile.Name || 'Profile'}</span>
          ${isKidsProfile ? `<span class="kids-badge">Kids</span>` : ''}
        </a>
      `;

      return true;
    }

    // Age Rating Compliance Checker
    function isAgeCompliant(ageRatingStr) {
      if (!isKidsProfile) return true; // Kids=False shows ALL age-rated sections
      if (!ageRatingStr) return true;

      const profileRank = AGE_RANKS[userMaxAgeRating] || 2; // Default to U/A 7+ (Rank 2)
      const itemRank = AGE_RANKS[ageRatingStr] || 1;

      return itemRank <= profileRank;
    }

    /* ================= 1. REFINED "FOR YOU" ALGORITHM ================= */
    function getRecentlyWatchedMovieIds() {
      try {
        const cachedUser = localStorage.getItem('active_user') || localStorage.getItem('UARM');
        const user = cachedUser ? JSON.parse(cachedUser) : null;
        if (!user || !Array.isArray(user["Memory.ent"])) return [];

        for (const item of user["Memory.ent"]) {
          if (typeof item === 'object' && item !== null) {
            for (const key of Object.keys(item)) {
              if (key.toLowerCase().includes("recently watched") && key.toLowerCase().includes("movie")) {
                const val = item[key];
                if (typeof val === 'string') {
                  return val.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
                }
              }
            }
          }
        }
      } catch(e) {}
      return [];
    }

    function buildBetterForYou(allMovies, watchedIds, moviesMap) {
      const unwatched = allMovies.filter(m => !watchedIds.includes(m.id.toLowerCase()));
      if (watchedIds.length === 0) return mixupArray(unwatched).slice(0, 20);

      const genreFreq = {};
      const studioFreq = {};

      watchedIds.forEach((id, idx) => {
        const movie = moviesMap.get(id);
        if (!movie) return;
        const decay = Math.max(1, 5 - idx);

        parseGenres(movie.Genres).forEach(g => {
          genreFreq[g] = (genreFreq[g] || 0) + (10 * decay);
        });

        const std = (movie.Studio || movie.Partner || '').toLowerCase().trim();
        if (std) studioFreq[std] = (studioFreq[std] || 0) + (6 * decay);
      });

      const scored = unwatched.map(movie => {
        let score = 0;
        parseGenres(movie.Genres).forEach(g => {
          if (genreFreq[g]) score += genreFreq[g];
        });

        const std = (movie.Studio || movie.Partner || '').toLowerCase().trim();
        if (std && studioFreq[std]) score += studioFreq[std];

        // Add slight random jitter (1-8) so reloads feel dynamic
        score += Math.random() * 8;
        return { movie, score };
      });

      scored.sort((a, b) => b.score - a.score);
      return scored.slice(0, 20).map(s => s.movie);
    }

    /* ================= MAIN LOAD PAGE ================= */
    async function loadPage() {
      if (!resolveActiveProfile()) return;

      const pageId = window.location.hash.split('&')[0].replace('#', '').trim().toLowerCase() || 'movies';

      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.hash === pageId);
      });

      const container = document.getElementById('sectionsContainer');
      container.innerHTML = `
        <div style="text-align: center; padding: 60px; color: var(--text-muted);">
          <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--accent)"></i>
          <p style="margin-top:12px;">Loading feeds for ${activeProfile.Name}...</p>
        </div>
      `;

      try {
        // Pre-fetch all movies
        const moviesSnap = await getDocs(collection(db, "Movies"));
        const moviesMap = new Map();
        let allMovies = [];

        moviesSnap.forEach(d => {
          const item = { id: d.id, ...d.data() };
          moviesMap.set(d.id.toLowerCase(), item);
          allMovies.push(item);
        });

        // Filter individual movies if Kids profile is active
        if (isKidsProfile) {
          allMovies = allMovies.filter(m => isAgeCompliant(m.Age_Rating));
        }

        container.innerHTML = "";

        const watchedIds = getRecentlyWatchedMovieIds();

        // 1. "Because You Watched <Name>"
        if (watchedIds.length > 0) {
          const lastMovie = moviesMap.get(watchedIds[0]);
          if (lastMovie) {
            const anchorGenres = parseGenres(lastMovie.Genres);
            const similar = allMovies
              .filter(m => m.id.toLowerCase() !== lastMovie.id.toLowerCase())
              .filter(m => anchorGenres.some(g => parseGenres(m.Genres).includes(g)));

            if (similar.length > 0) {
              renderCarouselSection(`Because You Watched ${lastMovie.Name || 'this'}`, mixupArray(similar).slice(0, 15), "Recommendation");
            }
          }
        }

        // 2. High-precision "For You" Carousel
        const forYouList = buildBetterForYou(allMovies, watchedIds, moviesMap);
        if (forYouList.length > 0) {
          renderCarouselSection("For You", forYouList, "Personalized");
        }

        // 3. Fetch Page & Sections from Systems (Compliance Checked)
        const pageDoc = await getDoc(doc(db, "Systems", pageId));
        if (pageDoc.exists()) {
          const sectionIds = pageDoc.data().Sections || [];

          for (const sId of sectionIds) {
            const secSnap = await getDoc(doc(db, "Systems", sId));
            if (!secSnap.exists()) continue;

            const secData = secSnap.data();

            // Compliance filter: If Kids=True, verify section age rating
            if (isKidsProfile && !isAgeCompliant(secData.Age_Rating)) {
              continue; // Skip adult-rated section
            }

            const isFixed = String(secData.Fixed).toLowerCase() === "true";
            const maxLimit = parseInt(secData.Max_Limit || "50", 10);
            const sectionGenres = parseGenres(secData.Genres);

            let sectionMovies = [];

            // Add mandatory titles
            const explicitTitles = Array.isArray(secData.Titles) ? secData.Titles : [];
            for (const tId of explicitTitles) {
              const movie = moviesMap.get(String(tId).trim().toLowerCase());
              if (movie && isAgeCompliant(movie.Age_Rating) && !sectionMovies.some(m => m.id === movie.id)) {
                sectionMovies.push(movie);
              }
            }

            // Fixed == False: blend similar genres
            if (!isFixed) {
              const similarMovies = allMovies.filter(m => {
                if (sectionMovies.some(sm => sm.id === m.id)) return false;
                const mG = parseGenres(m.Genres);
                return sectionGenres.some(sg => mG.includes(sg));
              });
              sectionMovies = mixupArray([...sectionMovies, ...similarMovies]).slice(0, maxLimit);
            }

            if (sectionMovies.length > 0) {
              renderCarouselSection(secData.Name || sId, sectionMovies);
            }
          }
        }

      } catch(err) {
        console.error("Feed error:", err);
        container.innerHTML = `<div style="text-align:center; padding:40px; color:#ff5252;">Failed to load feed. Check connectivity and permissions.</div>`;
      }
    }

    /* ================= RENDER CAROUSEL ================= */
    function renderCarouselSection(sectionTitle, movies, badgeLabel = null) {
      const container = document.getElementById('sectionsContainer');
      const sectionEl = document.createElement('section');
      sectionEl.className = 'section-block';

      sectionEl.innerHTML = `
        <div class="section-header-row" onclick="window.openSectionModal('${encodeURIComponent(sectionTitle)}')">
          <h2 class="section-heading">
            ${sectionTitle}
            ${badgeLabel ? `<span class="section-badge">${badgeLabel}</span>` : ''}
            <i class="fa-solid fa-chevron-right"></i>
          </h2>
        </div>
        <div class="carousel-wrapper">
          <button class="carousel-arrow left"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="carousel-track"></div>
          <button class="carousel-arrow right"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      `;

      window[`sec_cache_${encodeURIComponent(sectionTitle)}`] = movies;

      const track = sectionEl.querySelector('.carousel-track');
      const leftBtn = sectionEl.querySelector('.carousel-arrow.left');
      const rightBtn = sectionEl.querySelector('.carousel-arrow.right');

      movies.forEach(movie => {
        track.appendChild(create16x9Card(movie));
      });

      leftBtn.onclick = () => track.scrollBy({ left: -480, behavior: 'smooth' });
      rightBtn.onclick = () => track.scrollBy({ left: 480, behavior: 'smooth' });

      container.appendChild(sectionEl);
    }

    /* ================= 3. 16:9 CARD (NO LOGO, NO RATINGS) ================= */
    function create16x9Card(movie) {
      const card = document.createElement('div');
      card.className = 'card-16-9';

      const title = movie.Name || movie.Title || movie.id;
      const poster = getPosterH(movie);
      const genres = parseGenres(movie.Genres).map(g => g.charAt(0).toUpperCase() + g.slice(1)).join(' • ') || movie.Language || 'Movie';

      // Redirection to preview.html?watch=<id>
      card.onclick = () => {
        window.location.href = `preview.html?watch=${encodeURIComponent(movie.id)}`;
      };

      card.innerHTML = `
        <div class="card-thumb-wrap">
          <img class="main-thumb" src="${poster}" alt="${title}" loading="lazy"/>
          <div class="card-play-hover">
            <div class="card-play-btn-circle"><i class="fa-solid fa-play"></i></div>
          </div>
        </div>
        <div class="card-details">
          <div class="card-title">${title}</div>
          <div class="card-subtext">${genres}</div>
        </div>
      `;

      return card;
    }

    /* ================= 2. MODAL VIEW WITH GENRE CHIPS (SCREENSHOT 2) ================= */
    window.openSectionModal = function(encodedKey) {
      const movies = window[`sec_cache_${encodedKey}`] || [];
      const title = decodeURIComponent(encodedKey);

      document.getElementById('modalSectionTitle').innerText = title;
      const pillsRow = document.getElementById('modalGenrePillsRow');
      const grid = document.getElementById('modalGridMovies');

      const activeGenres = isKidsProfile ? KIDS_GENRES : ADULT_GENRES;

      pillsRow.innerHTML = `
        <div class="genre-chip active" onclick="window.filterModalMovies(this, 'all', '${encodedKey}')">All</div>
        ${activeGenres.map(g => `
          <div class="genre-chip" onclick="window.filterModalMovies(this, '${g}', '${encodedKey}')">${g}</div>
        `).join('')}
      `;

      grid.innerHTML = '';
      movies.forEach(movie => {
        grid.appendChild(create16x9Card(movie));
      });

      document.getElementById('sectionViewModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    };

    window.filterModalMovies = function(chipEl, genreName, encodedKey) {
      document.querySelectorAll('#modalGenrePillsRow .genre-chip').forEach(c => c.classList.remove('active'));
      chipEl.classList.add('active');

      const movies = window[`sec_cache_${encodedKey}`] || [];
      const grid = document.getElementById('modalGridMovies');
      grid.innerHTML = '';

      const filtered = genreName === 'all'
        ? movies
        : movies.filter(m => parseGenres(m.Genres).includes(genreName.toLowerCase()));

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; padding: 40px; color: var(--text-muted); text-align:center;">No titles available in ${genreName}.</div>`;
        return;
      }

      filtered.forEach(movie => {
        grid.appendChild(create16x9Card(movie));
      });
    };

    document.getElementById('closeSectionModalBtn').onclick = () => {
      document.getElementById('sectionViewModal').classList.remove('active');
      document.body.style.overflow = 'auto';
    };

    window.addEventListener('hashchange', loadPage);
    loadPage();
  </script>
</body>
