<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stream - Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    :root {
      --bg: #090a0e;
      --card-bg: #14161f;
      --text: #ffffff;
      --text-muted: #8e909a;
      --accent: #0072d2;
      --rail-height: 260px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 60px; }
    
    /* Top Bar */
    .navbar {
      display: flex; justify-content: space-between; align-items: center; padding: 18px 40px;
      background: linear-gradient(180deg, rgba(9,10,14,0.95) 0%, rgba(9,10,14,0) 100%);
      position: sticky; top: 0; z-index: 100;
    }
    .brand { font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #fff; text-transform: uppercase; }
    .brand span { color: var(--accent); }
    .page-title { font-size: 16px; color: var(--text-muted); }

    /* Main Container */
    .main-content { padding: 10px 40px; }
    .page-header { margin-bottom: 25px; }
    .page-header h1 { font-size: 32px; font-weight: 700; }

    /* Section & Rails */
    .section-container { margin-bottom: 35px; }
    .section-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
    .section-title { font-size: 20px; font-weight: 600; color: #f1f1f1; letter-spacing: 0.3px; }
    
    .rail {
      display: flex; gap: 14px; overflow-x: auto; scroll-behavior: smooth;
      padding: 10px 0; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .rail::-webkit-scrollbar { display: none; }

    /* Media Cards */
    .card {
      flex: 0 0 160px; width: 160px; height: var(--rail-height);
      background: var(--card-bg); border-radius: 8px; overflow: hidden;
      position: relative; cursor: pointer; transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex; flex-direction: column; border: 1px solid rgba(255,255,255,0.05);
    }
    .card:hover { transform: scale(1.05); z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.8); }
    
    .poster-img {
      width: 100%; height: 210px; object-fit: cover; background-color: #1a1c26; display: block;
    }
    .card-info {
      padding: 8px; flex: 1; display: flex; flex-direction: column; justify-content: center;
      background: #12141c;
    }
    .card-title {
      font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff;
    }
    .card-meta {
      font-size: 10px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; margin-top: 3px;
    }
    .badge {
      font-size: 9px; padding: 2px 5px; background: rgba(255,255,255,0.15); border-radius: 3px; font-weight: 600;
    }

    /* Modal Viewer */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999;
      justify-content: center; align-items: center; padding: 20px;
    }
    .modal-content {
      background: #171821; border-radius: 10px; max-width: 600px; width: 100%; overflow: hidden;
      border: 1px solid #282a36; position: relative;
    }
    .modal-banner { width: 100%; height: 260px; object-fit: cover; background: #000; }
    .modal-body { padding: 20px; }
    .close-btn {
      position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); border: none;
      color: #fff; font-size: 18px; width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    }

    .placeholder-rail { padding: 20px; color: var(--text-muted); font-size: 13px; }
  </style>

  <!-- Firebase Compat Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div class="navbar">
    <div class="brand">HOTSTAR <span>HUB</span></div>
    <div class="page-title" id="pageSlugDisplay">Loading...</div>
  </div>

  <div class="main-content">
    <div class="page-header">
      <h1 id="pageTitle">Home</h1>
    </div>

    <div id="railsContainer">
      <div class="placeholder-rail">Loading sections...</div>
    </div>
  </div>

  <!-- Detail Dialog / Modal -->
  <div class="modal" id="detailsModal">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">&times;</button>
      <img id="mBanner" class="modal-banner" src="" alt="Banner">
      <div class="modal-body">
        <h2 id="mTitle" style="margin-bottom: 6px;">Title</h2>
        <div style="margin-bottom: 12px; display: flex; gap: 8px; font-size: 12px; color: var(--text-muted);">
          <span id="mAge" class="badge">U/A</span>
          <span id="mStudio">Studio</span>
          <span id="mLang">Language</span>
        </div>
        <p id="mDesc" style="font-size: 13px; color: #b7b9c7; line-height: 1.5; margin-bottom: 15px;">Description</p>
        <div id="mStreamContainer"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const railsContainer = document.getElementById('railsContainer');
    const pageTitle = document.getElementById('pageTitle');
    const pageSlugDisplay = document.getElementById('pageSlugDisplay');

    // Get Page Slug from URL Hash (#slug) or Query (?page=slug)
    function getCurrentSlug() {
      if (window.location.hash) {
        return window.location.hash.replace('#', '').trim();
      }
      const params = new URLSearchParams(window.location.search);
      return params.get('page') || 'sis'; // Fallback default 'sis' as per screenshots
    }

    async function loadPage() {
      const slug = getCurrentSlug();
      pageSlugDisplay.textContent = `Page: #${slug}`;

      try {
        const pageDocSnap = await db.collection("Systems").doc(slug).get();
        if (!pageDocSnap.exists) {
          pageTitle.textContent = "Page Not Found";
          railsContainer.innerHTML = `<div class="placeholder-rail">No configuration found for document "${slug}" in Systems collection.</div>`;
          return;
        }

        const pageData = pageDocSnap.data();
        pageTitle.textContent = pageData.Name || slug;

        const sectionIds = pageData.Sections || [];
        if (sectionIds.length === 0) {
          railsContainer.innerHTML = `<div class="placeholder-rail">This page has no sections configured.</div>`;
          return;
        }

        railsContainer.innerHTML = "";

        // Fetch each Section definition
        for (const secId of sectionIds) {
          const secSnap = await db.collection("Systems").doc(secId).get();
          if (secSnap.exists) {
            const secData = secSnap.data();
            await renderSection(secId, secData);
          }
        }
      } catch (err) {
        console.error(err);
        railsContainer.innerHTML = `<div class="placeholder-rail" style="color:#e50914;">Failed to load data: ${err.message}</div>`;
      }
    }

    async function renderSection(sectionId, section) {
      const secDiv = document.createElement('div');
      secDiv.className = "section-container";

      const header = document.createElement('div');
      header.className = "section-header";
      header.innerHTML = `
        <div class="section-title">${section.Name || sectionId}</div>
      `;
      secDiv.appendChild(header);

      const rail = document.createElement('div');
      rail.className = "rail";
      rail.innerHTML = `<span style="font-size:12px; color:var(--text-muted); padding:10px;">Loading titles...</span>`;
      secDiv.appendChild(rail);
      railsContainer.appendChild(secDiv);

      // Fetch Items
      const contentTypes = section.Content_Type || ["Movies", "Shows"];
      const limitCount = parseInt(section.Max_Limit || "20", 10);
      let matchedItems = [];

      // 1. Check if explicit manual titles exist
      if (section.Titles && Array.isArray(section.Titles) && section.Titles.length > 0) {
        for (const titleId of section.Titles) {
          for (const col of contentTypes) {
            const doc = await db.collection(col).doc(titleId).get();
            if (doc.exists) {
              matchedItems.push({ id: doc.id, collection: col, ...doc.data() });
              break;
            }
          }
        }
      }

      // 2. Fetch criteria-based matches across specified collections
      for (const col of contentTypes) {
        try {
          const colSnap = await db.collection(col).limit(limitCount).get();
          colSnap.forEach(d => {
            const item = { id: d.id, collection: col, ...d.data() };
            if (matchedItems.some(existing => existing.id === item.id)) return;

            // Match against criteria (Genres, Age_Rating, Studio, Franchise)
            let isMatch = false;

            const itemGenres = item.Genres ? (Array.isArray(item.Genres) ? item.Genres : item.Genres.split(',').map(g => g.trim())) : [];
            if (section.Genres && section.Genres.length > 0) {
              if (section.Genres.some(g => itemGenres.some(ig => ig.toLowerCase() === g.toLowerCase()))) {
                isMatch = true;
              }
            }

            if (section.Franchise && item.Franchise && section.Franchise.toLowerCase() === item.Franchise.toLowerCase()) {
              isMatch = true;
            }

            if (section.Studio && item.Studio && section.Studio.toLowerCase() === item.Studio.toLowerCase()) {
              isMatch = true;
            }

            // If no strict filters are specified on section, default list items
            if ((!section.Genres || section.Genres.length === 0) && !section.Franchise && !section.Studio) {
              isMatch = true;
            }

            if (isMatch) matchedItems.push(item);
          });
        } catch (e) {
          console.warn(`Could not read ${col}:`, e);
        }
      }

      // Render Media Cards in Rail
      rail.innerHTML = '';
      if (matchedItems.length === 0) {
        rail.innerHTML = `<span style="font-size:12px; color:var(--text-muted); padding:10px;">No titles found for this section.</span>`;
        return;
      }

      matchedItems.slice(0, limitCount).forEach(item => {
        const card = document.createElement('div');
        card.className = "card";

        // Extract vertical poster or horizontal fallback
        const posterUrl = (item["Poster.v"] || item.Poster_v || item["Poster.h"] || item.Banner || "https://images.unsplash.com/photo-1594909122845-11baa439b7bf?w=400");
        const titleText = item.Name || item.id;
        const age = item.Age_Rating || item["Age Rating"] || "U/A";

        card.innerHTML = `
          <img class="poster-img" src="${posterUrl}" alt="${titleText}" loading="lazy" onerror="this.src='https://via.placeholder.com/200x300/181a20/ffffff?text=No+Poster'">
          <div class="card-info">
            <div class="card-title">${titleText}</div>
            <div class="card-meta">
              <span class="badge">${age}</span>
              <span>${item.Language || item.collection}</span>
            </div>
          </div>
        `;

        card.addEventListener('click', () => openModal(item));
        rail.appendChild(card);
      });
    }

    // Modal Details Popup
    const modal = document.getElementById('detailsModal');
    const mBanner = document.getElementById('mBanner');
    const mTitle = document.getElementById('mTitle');
    const mAge = document.getElementById('mAge');
    const mStudio = document.getElementById('mStudio');
    const mLang = document.getElementById('mLang');
    const mDesc = document.getElementById('mDesc');
    const mStreamContainer = document.getElementById('mStreamContainer');

    function openModal(item) {
      mBanner.src = item.Banner || item["Poster.h"] || item["Poster.v"] || '';
      mTitle.textContent = item.Name || item.id;
      mAge.textContent = item.Age_Rating || item["Age Rating"] || 'U/A';
      mStudio.textContent = item.Studio || item.Channel || item.collection || '';
      mLang.textContent = item.Language || 'Hindi';
      mDesc.textContent = item.Discription || item.Description || 'No description available for this title.';
      
      const streamUrl = item.Stream || item["Multi-Language"]?.Stream || '';
      if (streamUrl) {
        mStreamContainer.innerHTML = `
          <a href="${streamUrl}" target="_blank" style="display:inline-block; background:var(--accent); color:#fff; text-decoration:none; padding:8px 16px; border-radius:4px; font-size:13px; font-weight:600;">Watch Stream &rarr;</a>
        `;
      } else {
        mStreamContainer.innerHTML = '';
      }

      modal.style.display = "flex";
    }

    document.getElementById('closeModal').addEventListener('click', () => modal.style.display = "none");
    window.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = "none"; });

    // Respond to URL hash change
    window.addEventListener('hashchange', loadPage);

    // Initial Load
    loadPage();
  </script>
</body>
</html>
