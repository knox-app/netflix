<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hotstar Hero Carousel</title>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-dark: #0f1015;
      --accent-blue: #0072ef;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --radius-sm: 6px;
      --radius-md: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* Top Navigation Header */
    .top-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: linear-gradient(180deg, rgba(15, 16, 21, 0.95) 0%, transparent 100%);
      pointer-events: none;
    }
    .brand-logo {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      pointer-events: auto;
      letter-spacing: -0.3px;
      text-decoration: none;
    }
    .brand-logo span { color: var(--accent-blue); }

    .user-auth-btn {
      pointer-events: auto;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Hero Carousel Stage */
    .carousel-stage {
      position: relative;
      width: 100%;
      height: 82vh;
      min-height: 540px;
      max-height: 780px;
      overflow: hidden;
      background: #000;
      touch-action: pan-y;
      cursor: grab;
    }
    .carousel-stage:active { cursor: grabbing; }

    #slidesViewport {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Skeleton Loader */
    .skeleton-loader {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #0d0f14;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 48px 40px;
    }
    .skeleton-shimmer {
      background: linear-gradient(90deg, #151821 25%, #222634 50%, #151821 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: var(--radius-sm);
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    /* Carousel Slide */
    .carousel-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .carousel-slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Media Layers */
    .media-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
      background: #000;
    }

    .banner-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transition: transform 6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .carousel-slide.active .banner-image {
      transform: scale(1.04);
    }

    .trailer-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      z-index: 2;
      transition: opacity 0.8s ease-in-out;
    }
    .trailer-video.playing { opacity: 1; }

    .yt-frame-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vw;
      height: 56.25vw;
      min-height: 100%;
      min-width: 177.78vh;
      transform: translate(-50%, -50%);
      opacity: 0;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    .yt-frame-wrapper.playing { opacity: 1; }
    .yt-frame-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Vignettes */
    .vignette-bottom {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(
        180deg,
        rgba(15, 16, 21, 0.05) 0%,
        rgba(15, 16, 21, 0.1) 25%,
        rgba(15, 16, 21, 0.7) 65%,
        var(--bg-dark) 100%
      );
    }
    .vignette-left {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(15, 16, 21, 0.95) 0%,
        rgba(15, 16, 21, 0.8) 35%,
        rgba(15, 16, 21, 0.15) 70%,
        transparent 100%
      );
    }

    /* Slide Content */
    .slide-info-container {
      position: relative;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 0 44px 44px;
      max-width: 620px;
    }

    .title-branding-box {
      margin-bottom: 12px;
      min-height: 50px;
      display: flex;
      align-items: flex-end;
    }
    .title-logo {
      max-width: 280px;
      max-height: 110px;
      object-fit: contain;
      filter: drop-shadow(0 4px 18px rgba(0,0,0,0.95));
      display: block;
    }
    .fallback-title {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-shadow: 0 2px 14px rgba(0,0,0,0.95);
      line-height: 1.15;
    }

    .meta-badge-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
    }
    .meta-badge-row .dot {
      font-size: 6px;
      color: var(--text-muted);
    }
    .age-badge {
      background: rgba(255, 255, 255, 0.2);
      padding: 1px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 800;
    }

    /* Tags as Hotstar Pill Badges */
    .tags-badge-container {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .tag-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #c9d0e2;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: capitalize;
    }

    .story-synopsis {
      font-size: 13.5px;
      line-height: 1.45;
      color: #d2d8eb;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 22px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.95);
    }

    /* Action Buttons */
    .button-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }

    .btn-main-watch {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 28px;
      border-radius: var(--radius-md);
      background: #ffffff;
      color: #0f1015;
      font-size: 14px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
    }
    .btn-main-watch:hover { background: #f0f0f0; transform: scale(1.02); }
    .btn-main-watch svg { width: 15px; height: 15px; fill: currentColor; }

    .btn-icon-square {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-icon-square.active {
      background: rgba(0, 114, 239, 0.3);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }
    .btn-icon-square svg { width: 20px; height: 20px; fill: currentColor; }

    .trailer-status-badge {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.6);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(8px);
    }
    .trailer-status-badge.show { display: inline-flex; }
    .pulse-dot { width: 6px; height: 6px; border-radius: 50%; background: #e50914; animation: blink 1s infinite alternate; }
    @keyframes blink { from { opacity: 0.3; } to { opacity: 1; } }

    /* Desktop Bottom-Right Previews */
    .preview-strip-container {
      position: absolute;
      bottom: 28px;
      right: 44px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 16, 21, 0.6);
      backdrop-filter: blur(12px);
      padding: 6px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .preview-card-item {
      position: relative;
      width: 76px;
      aspect-ratio: 16/9;
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.25s ease;
      border: 1.5px solid transparent;
      background: #111;
    }
    .preview-card-item.active {
      opacity: 1;
      border-color: #ffffff;
      transform: scale(1.05);
    }
    .preview-card-item img { width: 100%; height: 100%; object-fit: cover; }

    /* Mobile Dots */
    .mobile-dots-container {
      display: none;
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      z-index: 10;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }
    .m-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transition: all 0.25s ease;
      cursor: pointer;
    }
    .m-dot.active {
      width: 16px;
      border-radius: 4px;
      background: #ffffff;
    }

    @media (max-width: 768px) {
      .carousel-stage { height: 75vh; }
      .vignette-left {
        background: linear-gradient(180deg, transparent 20%, rgba(15, 16, 21, 0.88) 75%, var(--bg-dark) 100%);
      }
      .slide-info-container {
        padding: 0 20px 36px;
        max-width: 100%;
        align-items: center;
        text-align: center;
      }
      .title-branding-box { justify-content: center; }
      .button-row { justify-content: center; }
      .preview-strip-container { display: none !important; }
      .mobile-dots-container { display: flex; }
    }

    /* Toast */
    .toast-box {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      background: rgba(22, 24, 34, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
    }
    .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <a class="brand-logo" href="#">Disney+ <span>hotstar</span></a>
    <a class="user-auth-btn" id="userAuthBtn" href="1 (1).html">Sign In</a>
  </header>

  <!-- Carousel Stage -->
  <div class="carousel-stage" id="carouselStage">
    <div class="skeleton-loader" id="carouselSkeleton">
      <div class="skeleton-shimmer" style="width: 180px; height: 36px; margin-bottom: 14px;"></div>
      <div class="skeleton-shimmer" style="width: 260px; height: 16px; margin-bottom: 12px;"></div>
      <div class="skeleton-shimmer" style="width: 380px; height: 14px; margin-bottom: 24px;"></div>
      <div style="display: flex; gap: 12px;">
        <div class="skeleton-shimmer" style="width: 130px; height: 44px; border-radius: 10px;"></div>
        <div class="skeleton-shimmer" style="width: 44px; height: 44px; border-radius: 10px;"></div>
      </div>
    </div>

    <div id="slidesViewport"></div>

    <div class="vignette-bottom"></div>
    <div class="vignette-left"></div>

    <!-- Previews & Dots -->
    <div class="preview-strip-container" id="previewStrip"></div>
    <div class="mobile-dots-container" id="mobileDots"></div>
  </div>

  <div class="toast-box" id="toastBox">Watchlist updated</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, getDocs, doc, updateDoc, arrayUnion, arrayRemove, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // Channel DB (Firestore Content)
    const channelConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728"
    };
    const channelApp = initializeApp(channelConfig, "channelApp");
    const channelDb = getFirestore(channelApp);

    // Auth DB (Firestore Users)
    const authConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase"
    };
    const authApp = initializeApp(authConfig, "authApp");
    const authDb = getFirestore(authApp);

    // State Variables
    let contentMap = new Map();
    let heroCarouselList = [];
    let activeIndex = 0;
    let slideTimer = null;
    let isMuted = true;
    let currentUser = null;
    let userDocId = null;
    let userWatchlist = [];
    let userAlgoPreferences = null;

    let sessionInteractions = {
      interactedGenres: new Set(),
      interactedStudios: new Set()
    };

    // Formatter Helpers
    function cleanUrl(url) {
      if (!url || typeof url !== 'string') return "";
      let u = url.trim();
      if (u.startsWith('//')) u = 'https:' + u;
      else if (!u.startsWith('http://') && !u.startsWith('https://')) u = 'https://' + u;
      return u;
    }

    function safeString(val) {
      if (val === undefined || val === null) return "";
      if (Array.isArray(val)) return val.join(", ");
      return String(val).trim();
    }

    function tokenize(str) {
      return safeString(str).toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(w => w.length > 2);
    }

    // Exact Field Resolvers from Screenshot
    function resolveBanner(d) {
      return cleanUrl(d.Banner || d["Poster.h"] || d.Poster_h || d.Poster || d.poster || "");
    }

    function resolveLogo(d) {
      return cleanUrl(d.Logo || d["Logo.png"] || d.logo || d.TitleLogo || "");
    }

    function resolveTags(d) {
      const raw = d.Tags || d.tags || d.Genres || d.genres || "";
      if (Array.isArray(raw)) return raw.map(t => String(t).trim());
      return String(raw).split(/[,/|•]+/).map(t => t.trim()).filter(Boolean);
    }

    // 1. DPH_ALGO Profile Parser
    function parseDphAlgo(descStr) {
      if (!descStr || typeof descStr !== 'string') return null;

      const profile = {
        studios: [],
        languages: [],
        lastWatched: [],
        genres: [],
        ageRatings: [],
        tokens: new Set()
      };

      const clean = descStr.replace(/[\n\r]+/g, ' ');

      const extractGroup = (regex) => {
        const match = clean.match(regex);
        if (match && match[1]) {
          return match[1].split(/[,/|•\s]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
        }
        return [];
      };

      profile.studios = extractGroup(/(?:form|from|studio|production)\s*\((.*?)\)/i);
      profile.languages = extractGroup(/(?:prefer|language|lang)\s*\((.*?)\)/i);
      profile.lastWatched = extractGroup(/(?:lastly|watched|history|movies)\s*\d*\s*(?:movies|shows)?\s*\((.*?)\)/i);
      profile.genres = extractGroup(/(?:genres|genre|like)\s*(?:of)?\s*\((.*?)\)/i);
      profile.ageRatings = extractGroup(/(?:age_rating|rating|confert|comfort)\s*\((.*?)\)/i);

      tokenize(clean).forEach(t => profile.tokens.add(t));
      return profile;
    }

    // 2. YouTube-Grade Ranking & Diversity Engine
    const RANK_WEIGHTS = {
      studioMatch: 45,
      genreMatch: 30,
      languageMatch: 25,
      ageRatingMatch: 20,
      lastWatchedMatch: 35,
      sessionGenre: 15,
      sessionStudio: 20,
      watchlist: 40,
      trailerBoost: 15,
      recencyMax: 22,
      recencyHalfLifeYears: 3,   // recency score halves roughly every N years instead of hard-flooring at 0
      diversityStudioPenalty: 25,
      diversityGenrePenalty: 18,
      stableJitterMax: 3         // deterministic micro tie-breaker, see stableHash01()
    };

    // Deterministic pseudo-random 0..1 derived from a string. Used to break exact
    // score ties consistently, so Firestore's frequent onSnapshot re-renders don't
    // visibly reshuffle the carousel every time the same items tie on score.
    function stableHash01(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
      }
      return ((h >>> 0) % 1000) / 1000;
    }

    function rankAndDiversify(items) {
      const nowYear = new Date().getFullYear();

      // Deduplicate by normalized title
      const uniqueItems = [];
      const seen = new Set();
      for (const item of items) {
        const titleKey = safeString(item.Name || item.Title).toLowerCase().replace(/[^a-z0-9]/g, '');
        if (!titleKey || seen.has(titleKey)) continue;
        seen.add(titleKey);
        uniqueItems.push(item);
      }

      const scored = uniqueItems.map(item => {
        let score = 0;
        const name = safeString(item.Name || item.Title).toLowerCase();
        const studio = safeString(item.Studio || item.Partner).toLowerCase();
        const lang = safeString(item.Language).toLowerCase();
        const age = safeString(item.Age_Rating || item["Age Rating"]).toLowerCase();
        const tags = resolveTags(item).map(t => t.toLowerCase());

        // DPH_ALGO Matching
        if (userAlgoPreferences) {
          if (userAlgoPreferences.studios.some(st => studio.includes(st) || tags.includes(st))) {
            score += RANK_WEIGHTS.studioMatch;
          }

          // Genre match now scales with how many preferred genres are present,
          // with diminishing returns so one tag-stuffed item can't sweep every point.
          const genreHits = userAlgoPreferences.genres.filter(g => tags.some(t => t.includes(g))).length;
          if (genreHits > 0) score += RANK_WEIGHTS.genreMatch * (1 - 1 / (genreHits + 1));

          if (userAlgoPreferences.languages.some(l => lang.includes(l))) score += RANK_WEIGHTS.languageMatch;
          if (userAlgoPreferences.ageRatings.some(ar => age === ar)) score += RANK_WEIGHTS.ageRatingMatch;
          if (userAlgoPreferences.lastWatched.some(w => name.includes(w) || tags.includes(w))) {
            score += RANK_WEIGHTS.lastWatchedMatch;
          }
        }

        // Live Session Reinforcement (also diminishing returns across matched genres)
        const sessionGenreHits = tags.filter(t => sessionInteractions.interactedGenres.has(t)).length;
        if (sessionGenreHits > 0) score += RANK_WEIGHTS.sessionGenre * (1 - 1 / (sessionGenreHits + 1));
        if (sessionInteractions.interactedStudios.has(studio)) score += RANK_WEIGHTS.sessionStudio;

        // Watchlist
        if (userWatchlist.includes(item.id)) score += RANK_WEIGHTS.watchlist;

        // Recency — exponential decay instead of a hard linear cutoff, so a strong
        // match from a few years back can still outrank a mediocre new release.
        const y = parseInt(safeString(item.Release_Date || item.Year || nowYear));
        if (!isNaN(y)) {
          const ageYears = Math.max(0, nowYear - y);
          score += RANK_WEIGHTS.recencyMax * Math.pow(0.5, ageYears / RANK_WEIGHTS.recencyHalfLifeYears);
        }

        // Trailer Boost
        if (item.Trailer && String(item.Trailer).trim().length > 0) score += RANK_WEIGHTS.trailerBoost;

        // Deterministic micro-jitter to break exact ties consistently
        score += stableHash01(item.id || name) * RANK_WEIGHTS.stableJitterMax;

        return { item, score, tags, studio };
      });

      scored.sort((a, b) => b.score - a.score);

      // MMR-style Diversity Filter — penalizes both studio repeats AND genre-tag
      // overlap with items already chosen, so the final 8 don't collapse into
      // "the same two franchises" even when their raw scores are close.
      const selected = [];
      const usedStudios = new Set();
      const usedTags = new Set();
      const pool = [...scored];

      while (pool.length > 0 && selected.length < 8) {
        let bestIdx = 0;
        let bestScore = -Infinity;

        for (let i = 0; i < pool.length; i++) {
          const cand = pool[i];
          let penalty = 0;
          if (cand.studio && usedStudios.has(cand.studio)) penalty += RANK_WEIGHTS.diversityStudioPenalty;

          if (cand.tags.length > 0) {
            const overlap = cand.tags.filter(t => usedTags.has(t)).length;
            if (overlap > 0) penalty += RANK_WEIGHTS.diversityGenrePenalty * (overlap / cand.tags.length);
          }

          const finalScore = cand.score - penalty;
          if (finalScore > bestScore) {
            bestScore = finalScore;
            bestIdx = i;
          }
        }

        const chosenEntry = pool.splice(bestIdx, 1)[0];
        selected.push(chosenEntry.item);
        if (chosenEntry.studio) usedStudios.add(chosenEntry.studio);
        chosenEntry.tags.forEach(t => usedTags.add(t));
      }

      return selected;
    }

    // 3. User Session Listener
    async function initUser() {
      const btn = document.getElementById('userAuthBtn');
      try {
        const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
        currentUser = stored ? JSON.parse(stored) : null;
      } catch(e) {}

      try {
        const wl = localStorage.getItem('hotstar_watchlist');
        userWatchlist = wl ? JSON.parse(wl) : (currentUser?.Watchlist || []);
      } catch(e) {}

      if (currentUser) {
        const name = currentUser["First Name"] || (currentUser.Email ? currentUser.Email.split('@')[0] : "User");
        btn.innerHTML = `👤 ${name}`;
        btn.href = "#";
        btn.onclick = (e) => {
          e.preventDefault();
          if (confirm("Switch user account?")) window.location.href = "1 (1).html";
        };

        try {
          let q = null;
          if (currentUser.Lotus) q = query(collection(authDb, "UARM"), where("Lotus", "==", currentUser.Lotus));
          else if (currentUser.Email) q = query(collection(authDb, "UARM"), where("Email", "==", currentUser.Email));

          if (q) {
            const snap = await getDocs(q);
            if (!snap.empty) {
              userDocId = snap.docs[0].id;
              bindUserLive(userDocId);
            }
          } else if (currentUser.id) {
            userDocId = currentUser.id;
            bindUserLive(userDocId);
          }
        } catch(e){}
      } else {
        btn.innerHTML = `Sign In`;
        btn.href = `1 (1).html?continue=${encodeURIComponent(window.location.href)}`;
      }
    }

    function bindUserLive(docId) {
      onSnapshot(doc(authDb, "UARM", docId), (s) => {
        if (s.exists()) {
          const u = s.data();
          currentUser = { id: s.id, ...u };
          userWatchlist = u.Watchlist || userWatchlist;
          userAlgoPreferences = parseDphAlgo(u.DPH_ALGO || "");

          localStorage.setItem('active_user', JSON.stringify(currentUser));
          localStorage.setItem('hotstar_watchlist', JSON.stringify(userWatchlist));

          if (contentMap.size > 0) {
            heroCarouselList = rankAndDiversify(Array.from(contentMap.values()));
            renderCarousel();
          }
        }
      });
    }

    function showToast(m) {
      const t = document.getElementById('toastBox');
      t.innerText = m;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    // 4. Fetch Real Firestore Documents
    async function fetchContent() {
      const collections = ["Movies", "Shows", "TV Shows", "Live TV", "channels"];

      for (const col of collections) {
        try {
          const snap = await getDocs(collection(channelDb, col));
          snap.forEach(d => contentMap.set(d.id, { id: d.id, _col: col, ...d.data() }));
        } catch(e){}
      }

      if (contentMap.size > 0) {
        document.getElementById('carouselSkeleton').style.display = 'none';
        heroCarouselList = rankAndDiversify(Array.from(contentMap.values()));
        renderCarousel();
      }

      collections.forEach(col => {
        onSnapshot(collection(channelDb, col), (snap) => {
          snap.forEach(d => contentMap.set(d.id, { id: d.id, _col: col, ...d.data() }));
          if (contentMap.size > 0) {
            document.getElementById('carouselSkeleton').style.display = 'none';
            heroCarouselList = rankAndDiversify(Array.from(contentMap.values()));
            renderCarousel();
          }
        });
      });
    }

    // 5. Render Carousel Viewport
    function renderCarousel() {
      const viewport = document.getElementById('slidesViewport');
      const strip = document.getElementById('previewStrip');
      const dots = document.getElementById('mobileDots');

      if (!viewport || heroCarouselList.length === 0) return;

      viewport.innerHTML = '';
      if (strip) strip.innerHTML = '';
      if (dots) dots.innerHTML = '';

      heroCarouselList.forEach((item, idx) => {
        const isAdded = userWatchlist.includes(item.id);
        const bannerUrl = resolveBanner(item);
        const logoUrl = resolveLogo(item);
        const titleText = safeString(item.Name || item.Title || "Featured Stream");
        const descText = safeString(item.Discription || item.Description || item.Story);
        const year = safeString(item.Release_Date || item.ReleaseDate || item.Year);
        const age = safeString(item.Age_Rating || item["Age Rating"] || item.Rating || "U");
        const lang = safeString(item.Language);
        const tagList = resolveTags(item).slice(0, 4);

        const slide = document.createElement('div');
        slide.className = `carousel-slide ${idx === activeIndex ? 'active' : ''}`;
        slide.id = `slide_${idx}`;
        slide.innerHTML = `
          <div class="media-layer">
            ${bannerUrl ? `<img class="banner-image" src="${bannerUrl}" alt="${titleText}">` : ''}
            <video class="trailer-video" id="video_trailer_${idx}" playsinline muted></video>
            <div id="yt_wrap_${idx}" class="yt-frame-wrapper"></div>
          </div>

          <div class="slide-info-container">
            <!-- Guaranteed Title/Logo Visibility -->
            <div class="title-branding-box">
              ${logoUrl ? `
                <img class="title-logo" id="logo_${idx}" src="${logoUrl}" alt="${titleText}" onerror="this.style.display='none'; document.getElementById('fb_${idx}').style.display='block';">
                <h1 class="fallback-title" id="fb_${idx}" style="display:none;">${titleText}</h1>
              ` : `
                <h1 class="fallback-title">${titleText}</h1>
              `}
            </div>

            <!-- Metadata Badges -->
            <div class="meta-badge-row">
              ${year ? `<span>${year}</span><span class="dot">●</span>` : ''}
              <span class="age-badge">${age}</span>
              ${lang ? `<span class="dot">●</span><span>${lang}</span>` : ''}
            </div>

            <!-- Tags Badges -->
            ${tagList.length > 0 ? `
              <div class="tags-badge-container">
                ${tagList.map(t => `<span class="tag-pill">${t}</span>`).join('')}
              </div>
            ` : ''}

            <!-- Description -->
            ${descText ? `<p class="story-synopsis">${descText}</p>` : ''}

            <!-- CTA Buttons -->
            <div class="button-row">
              <a class="btn-main-watch" href="1.html?watch=${item.id}" onclick="window.recordInteraction('${item.id}', 'watch')">
                <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <span>Watch Now</span>
              </a>

              <button class="btn-icon-square btn-wl-${item.id} ${isAdded ? 'active' : ''}" onclick="window.toggleWatchlist('${item.id}')" title="Watchlist">
                <svg viewBox="0 0 24 24">
                  ${isAdded 
                    ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>' 
                    : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>'}
                </svg>
              </button>

              <button class="btn-icon-square" id="mute_btn_${idx}" onclick="window.toggleMute(${idx})" style="display:none;" title="Mute/Unmute">
                <svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
              </button>

              <div class="trailer-status-badge" id="trailer_badge_${idx}">
                <div class="pulse-dot"></div> Trailer
              </div>
            </div>
          </div>
        `;
        viewport.appendChild(slide);

        if (strip && bannerUrl) {
          const c = document.createElement('div');
          c.className = `preview-card-item ${idx === activeIndex ? 'active' : ''}`;
          c.onclick = () => {
            window.recordInteraction(item.id, 'click');
            jumpTo(idx);
          };
          c.innerHTML = `<img src="${bannerUrl}" alt="${titleText}">`;
          strip.appendChild(c);
        }

        if (dots) {
          const d = document.createElement('div');
          d.className = `m-dot ${idx === activeIndex ? 'active' : ''}`;
          d.onclick = () => {
            window.recordInteraction(item.id, 'click');
            jumpTo(idx);
          };
          dots.appendChild(d);
        }
      });

      startCycle(activeIndex);
    }

    // 6. 6-Second Banner to Edge-to-Edge Trailer
    function startCycle(i) {
      clearTimeout(slideTimer);
      stopMedia();

      const item = heroCarouselList[i];
      if (!item) return;

      const vid = document.getElementById(`video_trailer_${i}`);
      const tUrl = cleanUrl(item.Trailer || item.trailer);

      slideTimer = setTimeout(() => {
        if (tUrl) playTrailer(i, tUrl, vid);
        else next();
      }, 6000);
    }

    function playTrailer(i, url, vid) {
      const mute = document.getElementById(`mute_btn_${i}`);
      const badge = document.getElementById(`trailer_badge_${i}`);

      if (url.includes('.mp4') || url.includes('.m3u8')) {
        vid.src = url;
        vid.muted = isMuted;
        vid.play().then(() => {
          vid.classList.add('playing');
          if (mute) mute.style.display = 'flex';
          if (badge) badge.classList.add('show');
        }).catch(() => next());

        vid.onended = () => next();
        vid.onerror = () => next();
      } else if (url.includes('youtube.com') || url.includes('youtu.be')) {
        const yt = document.getElementById(`yt_wrap_${i}`);
        const id = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=))([\w-]{11})/)?.[1];
        if (id) {
          yt.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&loop=0&playsinline=1" allow="autoplay"></iframe>`;
          yt.classList.add('playing');
          if (badge) badge.classList.add('show');
          slideTimer = setTimeout(next, 25000);
        } else next();
      } else next();
    }

    function stopMedia() {
      document.querySelectorAll('.trailer-video').forEach(v => {
        v.pause();
        v.removeAttribute('src');
        v.load();
        v.classList.remove('playing');
      });
      document.querySelectorAll('.yt-frame-wrapper').forEach(y => {
        y.innerHTML = '';
        y.classList.remove('playing');
      });
      document.querySelectorAll('.trailer-status-badge').forEach(b => b.classList.remove('show'));
    }

    function next() {
      if (heroCarouselList.length === 0) return;
      jumpTo((activeIndex + 1) % heroCarouselList.length);
    }

    function prev() {
      if (heroCarouselList.length === 0) return;
      jumpTo((activeIndex - 1 + heroCarouselList.length) % heroCarouselList.length);
    }

    function jumpTo(idx) {
      clearTimeout(slideTimer);
      stopMedia();

      document.querySelectorAll('.carousel-slide').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.preview-card-item').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.m-dot').forEach(d => d.classList.remove('active'));

      activeIndex = idx;

      const s = document.getElementById(`slide_${idx}`);
      const p = document.querySelectorAll('.preview-card-item')[idx];
      const d = document.querySelectorAll('.m-dot')[idx];

      if (s) s.classList.add('active');
      if (p) p.classList.add('active');
      if (d) d.classList.add('active');

      startCycle(idx);
    }

    // 7. Touch & Mouse Swipe Engine
    const stage = document.getElementById('carouselStage');
    let startX = 0, startY = 0, endX = 0, swiping = false;

    stage.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      swiping = true;
    }, { passive: true });

    stage.addEventListener('touchmove', (e) => {
      if (!swiping) return;
      endX = e.touches[0].clientX;
    }, { passive: true });

    stage.addEventListener('touchend', (e) => {
      if (!swiping) return;
      swiping = false;
      const dx = endX - startX;
      const dy = Math.abs(e.changedTouches[0].clientY - startY);
      if (Math.abs(dx) > 45 && Math.abs(dx) > dy) {
        if (dx < 0) next();
        else prev();
      }
      startX = 0; endX = 0;
    }, { passive: true });

    let mDown = false;
    stage.addEventListener('mousedown', (e) => {
      if (e.target.closest('button') || e.target.closest('a')) return;
      mDown = true;
      startX = e.clientX;
    });

    window.addEventListener('mouseup', (e) => {
      if (!mDown) return;
      mDown = false;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 60) {
        if (dx < 0) next();
        else prev();
      }
    });

    // Interactions
    window.recordInteraction = function(id, t) {
      const item = contentMap.get(id);
      if (!item) return;
      resolveTags(item).forEach(tag => sessionInteractions.interactedGenres.add(tag.toLowerCase()));
      const s = safeString(item.Studio || item.Partner).toLowerCase();
      if (s) sessionInteractions.interactedStudios.add(s);
    };

    window.toggleMute = function(idx) {
      const vid = document.getElementById(`video_trailer_${idx}`);
      const btn = document.getElementById(`mute_btn_${idx}`);
      if (vid) {
        isMuted = !isMuted;
        vid.muted = isMuted;
        btn.innerHTML = isMuted 
          ? '<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>'
          : '<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
      }
    };

    window.toggleWatchlist = async function(id) {
      window.recordInteraction(id, 'watchlist');
      const idx = userWatchlist.indexOf(id);
      const isRemoving = idx > -1;

      if (isRemoving) {
        userWatchlist.splice(idx, 1);
        showToast("Removed from Watchlist");
      } else {
        userWatchlist.push(id);
        showToast("Added to Watchlist");
      }

      localStorage.setItem('hotstar_watchlist', JSON.stringify(userWatchlist));

      if (userDocId) {
        try {
          await updateDoc(doc(authDb, "UARM", userDocId), {
            Watchlist: isRemoving ? arrayRemove(id) : arrayUnion(id)
          });
        } catch(e){}
      }

      document.querySelectorAll(`.btn-wl-${id}`).forEach(b => {
        b.classList.toggle('active', !isRemoving);
        b.innerHTML = `<svg viewBox="0 0 24 24">${!isRemoving ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>' : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>'}</svg>`;
      });
    };

    // Run
    initUser();
    fetchContent();
  </script>
</body>
</html>
