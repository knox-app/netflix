<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Google Account</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #555555;
            --input-border: #dddddd;
            --btn-bg: #111111;
            --btn-text: #ffffff;
            --btn-hover: #333333;
            --card-bg: #f9f9f9;
        }

        body.dark {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --input-border: #3a3a3a;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: #e0e0e0;
            --card-bg: #111111;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { text-align: center; max-width: 400px; width: 90%; padding: 20px; }
        h1 { font-size: 28px; font-weight: 600; margin-bottom: 10px; }
        p.subtitle { color: var(--text-secondary); font-size: 14px; margin-bottom: 30px; line-height: 1.5; }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: 1px solid var(--input-border);
            padding: 14px;
            width: 100%;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            box-sizing: border-box;
        }

        .google-btn:hover { background: var(--btn-hover); }
        .google-icon { width: 20px; height: 20px; }
        
        .status-card {
            display: none;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--input-border);
            margin-bottom: 20px;
        }
        .user-avatar { width: 64px; height: 64px; border-radius: 50%; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="loggedOutView">
        <h1>Connect Gmail Account</h1>
        <p class="subtitle">Connect your Google Account to sign in seamlessly across all our services without needing a password.</p>
        
        <button class="google-btn" id="googleSignInBtn">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Sign in with Google
        </button>
    </div>

    <div id="loggedInView" class="status-card">
        <img id="userAvatar" class="user-avatar" src="" alt="Profile">
        <h2 id="userName" style="margin: 5px 0; font-size: 20px;"></h2>
        <p id="userEmail" style="color: var(--text-secondary); margin-bottom: 20px; font-size: 14px;"></p>
        <button class="google-btn" id="continueSessionBtn">Continue to App</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        projectId: "question-metabase"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const continueUrl = urlParams.get('continue') || '4.html';
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;

    /* Dynamic Theme Logic */
    if (theme === "dark" || theme === "d" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.body.classList.add("dark");
    }

    // Generate random Lotus Token
    function generateLotus() {
        return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    // 1. Check if user is ALREADY logged in locally (Auto-login check)
    function checkExistingLogin() {
        try {
            const activeUser = JSON.parse(localStorage.getItem('active_user'));
            if (activeUser && activeUser["Email"]) {
                document.getElementById('loggedOutView').style.display = 'none';
                document.getElementById('loggedInView').style.display = 'block';
                document.getElementById('userName').innerText = `${activeUser["First Name"] || ''} ${activeUser["Last Name"] || ''}`;
                document.getElementById('userEmail').innerText = activeUser["Email"];
                document.getElementById('userAvatar').src = activeUser["Profile Picture"] || 'https://via.placeholder.com/64';

                // Automatically redirect after 1.5 seconds or let user click continue
                setTimeout(() => {
                    window.location.href = continueUrl;
                }, 1500);
            }
        } catch (e) {
            console.error("Storage parse error:", e);
        }
    }

    checkExistingLogin();

    document.getElementById('continueSessionBtn')?.addEventListener('click', () => {
        window.location.href = continueUrl;
    });

    // 2. Google OAuth Handler
    document.getElementById('googleSignInBtn').addEventListener('click', async () => {
        const provider = new GoogleAuthProvider();
        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;

            const email = user.email;
            const firstName = user.displayName ? user.displayName.split(' ')[0] : '';
            const lastName = user.displayName ? user.displayName.split(' ').slice(1).join(' ') : '';
            const photoURL = user.photoURL || '';

            // Check if user exists in Firestore UARM database
            const q = query(collection(db, "UARM"), where("Email", "==", email));
            const querySnapshot = await getDocs(q);

            let userData = null;

            if (!querySnapshot.empty) {
                // Existing account found
                userData = querySnapshot.docs[0].data();
            } else {
                // New User: Automatically register in Firestore UARM database
                const newLotus = generateLotus();
                userData = {
                    "Email": email,
                    "First Name": firstName,
                    "Last Name": lastName,
                    "Profile Picture": photoURL,
                    "Lotus": newLotus,
                    "Type": "google_connected",
                    "GmailConnected": true
                };
                await addDoc(collection(db, "UARM"), userData);
            }

            // Save to LocalStorage for persistent login
            let accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
            accounts = accounts.filter(acc => acc.email !== email);
            accounts.push({
                email: email,
                firstName: firstName,
                lotus: userData["Lotus"]
            });

            localStorage.setItem('saved_accounts', JSON.stringify(accounts));
            localStorage.setItem('active_user', JSON.stringify(userData));

            // Redirect to continueUrl
            window.location.href = continueUrl;

        } catch (error) {
            console.error("Google Auth Error:", error);
            alert("Failed to sign in with Google: " + error.message);
        }
    });
</script>
</body>
</html>
