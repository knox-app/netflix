<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #555555;
            --input-border: #dddddd;
            --input-focus: #000000;
            --input-bg: #ffffff;
            --btn-bg: #111111;
            --btn-text: #ffffff;
            --btn-hover: #333333;
        }

        body.dark {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --input-border: #3a3a3a;
            --input-focus: #ffffff;
            --input-bg: #000000;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { text-align: center; max-width: 400px; width: 90%; padding: 20px; }
        h1 { font-size: 32px; font-weight: 600; margin-bottom: 10px; color: var(--text-primary); }
        p.subtitle { color: var(--text-secondary); font-size: 15px; margin-bottom: 25px; line-height: 1.5; }
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        
        .input-group label {
            position: absolute;
            top: -10px;
            left: 15px;
            background: var(--bg-color);
            padding: 0 5px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-primary);
        }

        .btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--input-border);
            padding: 14px;
            width: 100%;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 15px;
            box-sizing: border-box;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: var(--text-secondary);
            font-size: 13px;
        }
        .divider::before, .divider::after { content: ""; flex: 1; border-bottom: 1px solid var(--input-border); }
        .divider span { padding: 0 10px; }

        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #0066cc; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sign in</h1>
    <p class="subtitle">Use your Account to sign in across our Apps & Services.</p>

    <div class="input-group">
        <label>Email or Mobile</label>
        <input type="text" id="identifier" placeholder="" autocomplete="off">
    </div>

    <button class="btn" id="continueBtn">Continue</button>

    <div class="divider"><span>OR</span></div>

    <button class="google-btn" id="googleBtn">
        <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Sign in with Google
    </button>
    
    <div class="links" id="accountChooserLink" style="display: none;">
        <a href="3.html">Choose an existing account</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, query, where, doc, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        projectId: "question-metabase"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    let session = urlParams.get('session');
    let continueUrl = urlParams.get('continue') || '4.html';
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;

    if (theme === "dark" || theme === "d" || (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.body.classList.add("dark");
    }

    // AUTO-LOGIN CHECK: If active user already exists in storage, skip login
    try {
        const activeUser = JSON.parse(localStorage.getItem('active_user'));
        if (activeUser && activeUser["Email"] && !urlParams.get('force')) {
            window.location.href = continueUrl;
        }
        if (localStorage.getItem('saved_accounts')) {
            let accounts = JSON.parse(localStorage.getItem('saved_accounts'));
            if (accounts && accounts.length > 0) {
                document.getElementById('accountChooserLink').style.display = 'block';
            }
        }
    } catch (e) {}

    // Session Generation
    async function initSession() {
        if (!session) {
            session = Math.floor(1000000000 + Math.random() * 9000000000).toString();
            try {
                await setDoc(doc(db, "ASPX Keys", session), { sessionId: session, createdAt: new Date() });
            } catch (err) {}
            window.history.replaceState({}, '', `1.html?session=${session}&continue=${encodeURIComponent(continueUrl)}`);
        }
    }
    initSession();

    // Handle Manual Form Submit
    document.getElementById('continueBtn').addEventListener('click', async () => {
        let identifier = document.getElementById('identifier').value.trim();
        if(!identifier) return alert("Please enter email or mobile");

        const isMobile = /^\+?\d+$/.test(identifier);
        document.getElementById('continueBtn').innerText = "Checking...";
        
        try {
            const q = isMobile ? 
                query(collection(db, "UARM"), where("Phone Number", "==", identifier)) : 
                query(collection(db, "UARM"), where("Email", "==", identifier));

            const querySnapshot = await getDocs(q);
            if (!querySnapshot.empty) {
                const userData = querySnapshot.docs[0].data();
                window.location.href = `2.html?session=${session}&Lotus=${userData["Lotus"]}&continue=${encodeURIComponent(continueUrl)}${theme ? '&theme='+theme : ''}`;
            } else {
                alert("Account not found.");
                document.getElementById('continueBtn').innerText = "Continue";
            }
        } catch (error) {
            alert("Database connection error.");
            document.getElementById('continueBtn').innerText = "Continue";
        }
    });

    // Handle Google Login directly on 1.html
    document.getElementById('googleBtn').addEventListener('click', async () => {
        const provider = new GoogleAuthProvider();
        try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            const q = query(collection(db, "UARM"), where("Email", "==", user.email));
            const querySnapshot = await getDocs(q);

            let userData = null;
            if (!querySnapshot.empty) {
                userData = querySnapshot.docs[0].data();
            } else {
                const newLotus = Math.random().toString(36).substring(2, 15);
                userData = {
                    "Email": user.email,
                    "First Name": user.displayName ? user.displayName.split(' ')[0] : '',
                    "Lotus": newLotus,
                    "GmailConnected": true
                };
                await addDoc(collection(db, "UARM"), userData);
            }

            let accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
            accounts = accounts.filter(acc => acc.email !== user.email);
            accounts.push({ email: user.email, firstName: userData["First Name"], lotus: userData["Lotus"] });

            localStorage.setItem('saved_accounts', JSON.stringify(accounts));
            localStorage.setItem('active_user', JSON.stringify(userData));

            window.location.href = continueUrl;
        } catch (err) {
            alert("Google Sign-In failed.");
        }
    });
</script>
</body>
</html>
