<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Identity & Credential Lookup</title>
  
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-glow: rgba(88, 166, 255, 0.15);
      --success: #238636;
      --error: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4);
    }

    .header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .badge {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--accent-glow);
      color: var(--accent);
      border: 1px solid var(--accent);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Status & Alerts */
    .status-box {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-msg {
      color: var(--error);
      background: rgba(248, 81, 73, 0.1);
      border: 1px solid rgba(248, 81, 73, 0.3);
      padding: 14px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    /* Detail Cards */
    .details-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .detail-card {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .detail-card:hover {
      border-color: var(--accent);
    }

    .detail-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      margin-right: 12px;
    }

    .detail-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-size: 0.95rem;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      color: var(--text-main);
      word-break: break-all;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: var(--border);
      color: var(--text-main);
    }

    .copy-btn.copied {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .meta-group {
      margin-top: 10px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .meta-item {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .meta-item span {
      display: block;
      color: var(--text-main);
      font-weight: 500;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2>Record Lookup</h2>
      <span class="badge" id="lookupBadge">Firestore Query</span>
    </div>

    <!-- Status Views -->
    <div id="loading" class="status-box">
      <div class="spinner"></div>
      <p>Looking up record in database...</p>
    </div>

    <div id="error" class="error-msg" style="display: none;"></div>

    <!-- Data Presentation -->
    <div id="content" class="details-grid" style="display: none;">
      <!-- Recovery ID -->
      <div class="detail-card">
        <div class="detail-info">
          <span class="detail-label">Recovery ID</span>
          <span class="detail-value" id="valRecoveryId">--</span>
        </div>
        <button class="copy-btn" onclick="copyText('valRecoveryId', this)">Copy</button>
      </div>

      <!-- UARMS ID -->
      <div class="detail-card">
        <div class="detail-info">
          <span class="detail-label">UARMS ID</span>
          <span class="detail-value" id="valUarmsId">--</span>
        </div>
        <button class="copy-btn" onclick="copyText('valUarmsId', this)">Copy</button>
      </div>

      <!-- LOTUS ID -->
      <div class="detail-card">
        <div class="detail-info">
          <span class="detail-label">Lotus ID</span>
          <span class="detail-value" id="valLotusId">--</span>
        </div>
        <button class="copy-btn" onclick="copyText('valLotusId', this)">Copy</button>
      </div>

      <!-- User Information (Read Only) -->
      <div class="meta-group">
        <div class="meta-item">
          Full Name
          <span id="valName">--</span>
        </div>
        <div class="meta-item">
          Registered Email
          <span id="valEmail">--</span>
        </div>
        <div class="meta-item">
          Account Type
          <span id="valType">--</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase Modular SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase",
      storageBucket: "question-metabase.firebasestorage.app",
      messagingSenderId: "770698198753",
      appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
      measurementId: "G-6ZP1FPMKSJ"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // DOM Elements
    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    const contentEl = document.getElementById("content");

    function showError(message) {
      loadingEl.style.display = "none";
      contentEl.style.display = "none";
      errorEl.textContent = message;
      errorEl.style.display = "block";
    }

    async function fetchDetails() {
      // 1. Read 'get' parameter from URL (e.g. ?get=BVxOqOSswoyPkuJicI5MbkqxM)
      const urlParams = new URLSearchParams(window.location.search);
      const recoveryParam = urlParams.get("get");

      if (!recoveryParam) {
        showError("Missing URL parameter. Please query using: ?get=<recovery-id>");
        return;
      }

      try {
        // 2. Query 'UARM' collection matching field 'Recovery ID'
        const uarmCollection = collection(db, "UARM");
        const q = query(uarmCollection, where("Recovery ID", "==", recoveryParam.trim()));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          showError(`No matching record found for Recovery ID: "${recoveryParam}"`);
          return;
        }

        // 3. Extract matching document data
        let docData = null;
        querySnapshot.forEach((doc) => {
          docData = doc.data();
        });

        // 4. Inject into UI
        document.getElementById("valRecoveryId").textContent = docData["Recovery ID"] || "N/A";
        document.getElementById("valUarmsId").textContent = docData["UARMS ID"] || docData["Uarms ID"] || "N/A";
        // 'Lotus' is the field key in Firestore as seen in the database screenshot
        document.getElementById("valLotusId").textContent = docData["Lotus"] || docData["Lotus ID"] || "N/A";

        // Meta data
        const firstName = docData["First Name"] || "";
        const lastName = docData["Last Name"] || "";
        document.getElementById("valName").textContent = `${firstName} ${lastName}`.trim() || "N/A";
        document.getElementById("valEmail").textContent = docData["Email"] || "N/A";
        document.getElementById("valType").textContent = docData["Type"] || "Standard";

        // Show content
        loadingEl.style.display = "none";
        contentEl.style.display = "flex";

      } catch (err) {
        console.error("Firestore lookup error:", err);
        showError("Database lookup failed: " + err.message);
      }
    }

    // Execute lookup
    fetchDetails();
  </script>

  <!-- Clipboard Copy Handler -->
  <script>
    function copyText(elementId, btn) {
      const text = document.getElementById(elementId).textContent;
      if (!text || text === "--" || text === "N/A") return;

      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.textContent;
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => {
          btn.textContent = originalText;
          btn.classList.remove("copied");
        }, 1500);
      });
    }
  </script>
</body>
    </html>
