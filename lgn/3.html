<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Account</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fff; }
        .container { text-align: center; max-width: 400px; width: 90%; padding: 20px; }
        h1 { font-size: 28px; font-weight: 600; margin-bottom: 20px; color: #000; }
        .account-list { text-align: left; margin-bottom: 20px; }
        .account-item { display: flex; align-items: center; padding: 15px; border: 1px solid #eee; border-radius: 12px; margin-bottom: 10px; cursor: pointer; transition: background 0.2s; }
        .account-item:hover { background: #f9f9f9; }
        .avatar { width: 40px; height: 40px; background: #000; color: #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; font-weight: bold; margin-right: 15px; }
        .acc-info { flex-grow: 1; }
        .acc-name { font-weight: 600; font-size: 16px; margin: 0; color: #222; }
        .acc-email { font-size: 13px; color: #777; margin: 0; }
        .add-account { color: #0066cc; text-decoration: none; font-weight: 500; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Choose an account</h1>
    <div class="account-list" id="accountList">
        <!-- JS will populate this -->
    </div>
    <a href="1.html" class="add-account">+ Add another account</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U", projectId: "question-metabase" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
    const listDiv = document.getElementById('accountList');

    if (accounts.length === 0) {
        window.location.href = '1.html';
    }

    accounts.forEach(acc => {
        const initial = acc.firstName ? acc.firstName.charAt(0).toUpperCase() : acc.email.charAt(0).toUpperCase();
        
        const item = document.createElement('div');
        item.className = 'account-item';
        item.innerHTML = `
            <div class="avatar">${initial}</div>
            <div class="acc-info">
                <p class="acc-name">${acc.firstName || 'User'}</p>
                <p class="acc-email">${acc.email}</p>
            </div>
        `;

        item.addEventListener('click', async () => {
            // Auto-login using saved lotus ID
            const q = query(collection(db, "UARM"), where("lotus", "==", acc.lotus));
            const snap = await getDocs(q);
            if(!snap.empty) {
                localStorage.setItem('active_user', JSON.stringify(snap.docs[0].data()));
                window.location.href = '4.html';
            } else {
                alert("Session expired for this account. Please sign in again.");
                window.location.href = '1.html';
            }
        });

        listDiv.appendChild(item);
    });
</script>
</body>
</html>
