<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Account</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #777777;
            --border-color: #eeeeee;
            --hover-bg: #f9f9f9;
            --avatar-bg: #000000;
            --avatar-text: #ffffff;
            --link-color: #0066cc;
        }

        body.dark {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #222222;
            --hover-bg: #111111;
            --avatar-bg: #ffffff;
            --avatar-text: #000000;
            --link-color: #3399ff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { 
            text-align: center; 
            max-width: 420px; 
            width: 90%; 
            padding: 24px; 
        }
        
        h1 { 
            font-size: 26px; 
            font-weight: 600; 
            margin-bottom: 24px; 
            color: var(--text-primary); 
        }
        
        .account-list { 
            text-align: left; 
            margin-bottom: 20px; 
        }
        
        .account-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s, transform 0.1s ease;
        }

        .account-item:hover { 
            background: var(--hover-bg); 
            transform: translateY(-1px);
        }

        .avatar, .avatar-img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            margin-right: 14px;
            flex-shrink: 0;
        }
        
        .avatar {
            background: var(--avatar-bg);
            color: var(--avatar-text);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: 600;
            transition: background-color 0.3s, color 0.3s;
        }

        .avatar-img {
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .acc-info { 
            flex-grow: 1; 
            overflow: hidden;
        }
        
        .acc-name { 
            font-weight: 600; 
            font-size: 15px; 
            margin: 0 0 2px 0; 
            color: var(--text-primary); 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .acc-email { 
            font-size: 13px; 
            color: var(--text-secondary); 
            margin: 0; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .add-account {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            display: inline-block;
            margin-top: 10px;
            transition: color 0.3s;
        }

        .add-account:hover {
            text-decoration: underline;
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Choose an account</h1>
    <div class="account-list" id="accountList">
        <p class="loading-text">Loading accounts...</p>
    </div>
    <a href="1.html" class="add-account" id="addAccountLink">+ Add another account</a>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { 
        getFirestore, 
        collection, 
        query, 
        where, 
        onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "question-metabase",
        storageBucket: "question-metabase.firebasestorage.app",
        messagingSenderId: "770698198753",
        appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
        measurementId: "G-6ZP1FPMKSJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Read full query parameters from current URL
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;
    const redirectParam = urlParams.get("redirect") || urlParams.get("returnUrl") || urlParams.get("next") || "4.html";

    /* ================= THEME HANDLING ================= */
    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function applyTheme() {
        if (theme === "dark" || theme === "d") {
            document.body.classList.add("dark");
        } else if (theme === "light" || theme === "l") {
            document.body.classList.remove("dark");
        } else if (mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }

    applyTheme();
    mediaQuery.addEventListener("change", () => {
        if (!theme) applyTheme();
    });

    // Pass all query parameters to the "+ Add another account" link
    const addAccountLink = document.getElementById('addAccountLink');
    if (addAccountLink) {
        addAccountLink.href = window.location.search ? `1.html${window.location.search}` : '1.html';
    }

    /* ================= REDIRECT LOGIC ================= */
    function completeAccountSelection(userData) {
        // Save the chosen user as active user
        localStorage.setItem('active_user', JSON.stringify(userData));

        // Build target URL while preserving all original query parameters
        const target = new URL(redirectParam, window.location.origin);
        urlParams.forEach((value, key) => {
            if (key !== "redirect" && key !== "returnUrl" && key !== "next") {
                target.searchParams.set(key, value);
            }
        });

        window.location.href = target.toString();
    }

    /* ================= RENDER FUNCTION ================= */
    const listDiv = document.getElementById('accountList');

    function renderAccounts(accounts) {
        if (!accounts || accounts.length === 0) {
            listDiv.innerHTML = `<p class="loading-text">No saved accounts found.</p>`;
            return;
        }

        listDiv.innerHTML = '';
        accounts.forEach((data) => {
            const firstName = data["First Name"] || data.firstName || data.name || "User";
            const lastName = data["Last Name"] || data.lastName || "";
            const fullName = `${firstName} ${lastName}`.trim();
            const email = data.Email || data.email || "";
            const photo = data.Profile_Picture || data["Profile Picture"] || data.photoURL || null;
            const initial = firstName.charAt(0).toUpperCase() || email.charAt(0).toUpperCase() || "?";

            const item = document.createElement('div');
            item.className = 'account-item';

            const avatarHtml = photo 
                ? `<img src="${photo}" class="avatar-img" alt="${fullName}" onerror="this.outerHTML='<div class=\\'avatar\\'>${initial}</div>'" />` 
                : `<div class="avatar">${initial}</div>`;

            item.innerHTML = `
                ${avatarHtml}
                <div class="acc-info">
                    <p class="acc-name">${fullName}</p>
                    <p class="acc-email">${email}</p>
                </div>
            `;

            item.addEventListener('click', () => completeAccountSelection(data));
            listDiv.appendChild(item);
        });
    }

    /* ================= ACCOUNT RETRIEVAL BY EMAIL ================= */
    let localSaved = [];
    try {
        localSaved = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
    } catch (e) {
        localSaved = [];
    }

    // Extract emails from saved accounts (handles both strings or objects)
    const emails = localSaved
        .map(a => (typeof a === 'string' ? a : (a.Email || a.email)))
        .filter(Boolean);

    if (emails.length === 0) {
        // No saved accounts, redirect to login page (1.html) with existing params
        window.location.href = window.location.search ? `1.html${window.location.search}` : '1.html';
    } else {
        // Step 1: Render local accounts immediately so screen never flashes empty
        renderAccounts(localSaved);

        // Step 2: Query Firestore using permanent Email (up to 30)
        const uniqueEmails = [...new Set(emails)].slice(0, 30);
        const q = query(collection(db, "UARM"), where("Email", "in", uniqueEmails));

        onSnapshot(q, (snapshot) => {
            if (!snapshot.empty) {
                const freshAccounts = [];
                snapshot.forEach(doc => {
                    freshAccounts.push({ id: doc.id, ...doc.data() });
                });

                // Update localStorage so latest profile pictures/names stay current
                localStorage.setItem('saved_accounts', JSON.stringify(freshAccounts));

                // Re-render with live Firestore data
                renderAccounts(freshAccounts);
            }
        }, (error) => {
            console.error("Firestore sync error:", error);
            // Even if offline or query errors, locally saved accounts remain visible
        });
    }
</script>
</body>
</html>
