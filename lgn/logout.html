<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log out</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --surface-color: #f7f7f8;
            --text-primary: #000000;
            --text-secondary: #555555;
            --border-color: #e2e2e2;
            --btn-bg: #111111;
            --btn-text: #ffffff;
            --btn-hover: #333333;
            --btn-sec-bg: #f0f0f0;
            --btn-sec-text: #111111;
            --danger-bg: #d93025;
            --danger-text: #ffffff;
            --badge-bg: #e6f4ea;
            --badge-text: #137333;
            --link-color: #0066cc;
        }

        body.dark {
            --bg-color: #000000;
            --surface-color: #141414;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --border-color: #2e2e2e;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: #e0e0e0;
            --btn-sec-bg: #222222;
            --btn-sec-text: #ffffff;
            --danger-bg: #e04338;
            --danger-text: #ffffff;
            --badge-bg: #143620;
            --badge-text: #81c995;
            --link-color: #4da3ff;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 420px;
            width: 90%;
            padding: 24px 20px;
            text-align: center;
        }

        h1 { font-size: 28px; font-weight: 600; margin: 0 0 8px; }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin: 0 0 24px;
            line-height: 1.5;
        }

        .select-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .text-btn {
            background: none;
            border: none;
            color: var(--link-color);
            font-size: 13px;
            cursor: pointer;
            padding: 0;
        }

        .text-btn:hover { text-decoration: underline; }

        .account-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 22px;
        }

        .account-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            background: var(--surface-color);
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s ease;
        }

        .account-card.selected {
            border-color: var(--text-primary);
        }

        .account-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .account-check {
            width: 18px;
            height: 18px;
            accent-color: var(--text-primary);
            flex-shrink: 0;
            cursor: pointer;
        }

        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--btn-sec-bg);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .acc-meta { min-width: 0; }

        .acc-name {
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .acc-email {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .active-pill {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 9px;
            border-radius: 12px;
            background: var(--badge-bg);
            color: var(--badge-text);
            flex-shrink: 0;
        }

        .btn {
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: none;
            display: inline-block;
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger-text);
        }

        .btn-primary {
            background: var(--btn-bg);
            color: var(--btn-text);
        }

        .btn-secondary {
            background: var(--btn-sec-bg);
            color: var(--btn-sec-text);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status-msg {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 12px;
            min-height: 18px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="pageTitle">Log out</h1>
    <p class="subtitle" id="pageSubtitle">Select the account(s) you want to sign out of this device.</p>

    <div id="accountsSection" style="display: none;">
        <div class="select-toolbar">
            <span id="selectedCountLabel">0 selected</span>
            <button type="button" class="text-btn" id="selectAllBtn">Select all</button>
        </div>

        <div class="account-list" id="accountList"></div>

        <button class="btn btn-danger" id="logoutSelectedBtn" disabled>Log out selected</button>
        <a class="btn btn-secondary" id="cancelLink" href="4.html">Cancel</a>
    </div>

    <div id="emptySection" style="display: none;">
        <button class="btn btn-primary" id="goSignInBtn">Sign in</button>
        <a class="btn btn-secondary" id="emptyBackLink" href="4.html" style="display: none;">Continue</a>
    </div>

    <div class="status-msg" id="statusMsg"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import {
        getFirestore,
        collection,
        getDocs,
        query,
        where,
        updateDoc,
        doc
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "question-metabase",
        storageBucket: "question-metabase.firebasestorage.app",
        messagingSenderId: "770698198753",
        appId: "1:770698198753:web:59ae49d78b6013bab5c1a0"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const session = urlParams.get('session') || '';
    const continueUrl = urlParams.get('continue') || '4.html';
    const provider = urlParams.get('provider') || '';
    const theme = urlParams.get('theme') ? urlParams.get('theme').toLowerCase() : null;

    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
    function applyTheme() {
        if (theme === "dark" || theme === "d") {
            document.body.classList.add("dark");
            return;
        }
        if (theme === "light" || theme === "l") {
            document.body.classList.remove("dark");
            return;
        }
        if (mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }
    applyTheme();
    mediaQuery.addEventListener("change", () => { if (!theme) applyTheme(); });

    function buildUrl(page) {
        const p = new URLSearchParams();
        if (session) p.set('session', session);
        if (continueUrl) p.set('continue', continueUrl);
        if (provider) p.set('provider', provider);
        if (theme) p.set('theme', theme);
        const qs = p.toString();
        return qs ? `${page}?${qs}` : page;
    }

    document.getElementById('cancelLink').href = continueUrl;
    document.getElementById('emptyBackLink').href = continueUrl;
    document.getElementById('goSignInBtn').addEventListener('click', () => {
        window.location.href = buildUrl('1.html');
    });

    function generateNewLotus() {
        return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    let deviceAccounts = []; // [{ email, firstName, lastName, lotus, pic, isActive }]
    const selectedEmails = new Set();

    async function loadAccounts() {
        let saved = [];
        let activeUser = null;

        try {
            saved = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
            if (!Array.isArray(saved)) saved = [];
        } catch (e) { saved = []; }

        try {
            if (localStorage.getItem('active_user')) {
                activeUser = JSON.parse(localStorage.getItem('active_user'));
            }
        } catch (e) { activeUser = null; }

        const map = new Map();
        saved.forEach(acc => {
            if (acc && acc.email) {
                map.set(acc.email.toLowerCase(), {
                    email: acc.email,
                    firstName: acc.firstName || '',
                    lastName: '',
                    lotus: acc.lotus || '',
                    pic: '',
                    isActive: activeUser && activeUser["Email"] && activeUser["Email"].toLowerCase() === acc.email.toLowerCase()
                });
            }
        });

        if (activeUser && activeUser["Email"]) {
            const key = activeUser["Email"].toLowerCase();
            if (!map.has(key)) {
                map.set(key, {
                    email: activeUser["Email"],
                    firstName: activeUser["First Name"] || '',
                    lastName: activeUser["Last Name"] || '',
                    lotus: activeUser["Lotus"] || '',
                    pic: activeUser["Profile_Picture"] || activeUser["Profile Picture"] || '',
                    isActive: true
                });
            } else {
                const existing = map.get(key);
                existing.isActive = true;
                existing.pic = activeUser["Profile_Picture"] || activeUser["Profile Picture"] || existing.pic;
                existing.lastName = activeUser["Last Name"] || existing.lastName;
            }
        }

        deviceAccounts = Array.from(map.values());

        if (deviceAccounts.length === 0) {
            document.getElementById('pageTitle').textContent = 'Signed out';
            document.getElementById('pageSubtitle').textContent = 'No accounts are currently signed in on this device.';
            document.getElementById('accountsSection').style.display = 'none';
            document.getElementById('emptySection').style.display = 'block';
            return;
        }

        // Pre-select active account by default
        deviceAccounts.forEach(acc => {
            if (acc.isActive) selectedEmails.add(acc.email);
        });

        document.getElementById('accountsSection').style.display = 'block';
        renderAccountList();

        // Enrich with fresh avatar/name from UARM
        for (const acc of deviceAccounts) {
            try {
                const snap = await getDocs(query(collection(db, "UARM"), where("Email", "==", acc.email)));
                if (!snap.empty) {
                    const d = snap.docs[0].data();
                    acc.firstName = d["First Name"] || acc.firstName;
                    acc.lastName = d["Last Name"] || acc.lastName;
                    acc.pic = d["Profile_Picture"] || d["Profile Picture"] || acc.pic;
                }
            } catch (e) { /* non-blocking */ }
        }
        renderAccountList();
    }

    function updateSelectionUI() {
        const count = selectedEmails.size;
        document.getElementById('selectedCountLabel').textContent = `${count} selected`;
        document.getElementById('logoutSelectedBtn').disabled = count === 0;
        document.getElementById('selectAllBtn').textContent =
            count === deviceAccounts.length ? 'Deselect all' : 'Select all';
    }

    function renderAccountList() {
        const listEl = document.getElementById('accountList');
        listEl.innerHTML = '';

        deviceAccounts.forEach(acc => {
            const isSelected = selectedEmails.has(acc.email);
            const fullName = `${acc.firstName} ${acc.lastName}`.trim() || acc.email;

            const card = document.createElement('label');
            card.className = 'account-card' + (isSelected ? ' selected' : '');

            const avatarHtml = acc.pic
                ? `<div class="avatar"><img src="${acc.pic}" alt="${fullName}"></div>`
                : `<div class="avatar">${(fullName[0] || 'U').toUpperCase()}</div>`;

            card.innerHTML = `
                <div class="account-left">
                    <input type="checkbox" class="account-check" ${isSelected ? 'checked' : ''}>
                    ${avatarHtml}
                    <div class="acc-meta">
                        <div class="acc-name">${fullName}</div>
                        <div class="acc-email">${acc.email}</div>
                    </div>
                </div>
                ${acc.isActive ? '<span class="active-pill">Active</span>' : ''}
            `;

            const checkbox = card.querySelector('.account-check');
            checkbox.addEventListener('change', () => {
                if (checkbox.checked) {
                    selectedEmails.add(acc.email);
                    card.classList.add('selected');
                } else {
                    selectedEmails.delete(acc.email);
                    card.classList.remove('selected');
                }
                updateSelectionUI();
            });

            listEl.appendChild(card);
        });

        updateSelectionUI();
    }

    document.getElementById('selectAllBtn').addEventListener('click', () => {
        if (selectedEmails.size === deviceAccounts.length) {
            selectedEmails.clear();
        } else {
            deviceAccounts.forEach(acc => selectedEmails.add(acc.email));
        }
        renderAccountList();
    });

    document.getElementById('logoutSelectedBtn').addEventListener('click', async () => {
        if (selectedEmails.size === 0) return;

        const btn = document.getElementById('logoutSelectedBtn');
        btn.disabled = true;
        btn.textContent = 'Logging out...';
        document.getElementById('statusMsg').textContent = 'Revoking selected session(s)...';

        try {
            const toLogout = Array.from(selectedEmails);

            // 1. Rotate Lotus token on server (UARM) so old session tokens are invalidated
            for (const email of toLogout) {
                try {
                    const snap = await getDocs(query(collection(db, "UARM"), where("Email", "==", email)));
                    if (!snap.empty) {
                        await updateDoc(doc(db, "UARM", snap.docs[0].id), {
                            "Lotus": generateNewLotus()
                        });
                    }
                } catch (err) {
                    console.warn("Server token rotation failed for", email, err);
                }
            }

            // 2. Remove from localStorage saved_accounts
            let saved = [];
            try {
                saved = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
            } catch (e) { saved = []; }

            const logoutSetLower = new Set(toLogout.map(e => e.toLowerCase()));
            const remaining = saved.filter(acc => acc.email && !logoutSetLower.has(acc.email.toLowerCase()));
            localStorage.setItem('saved_accounts', JSON.stringify(remaining));

            // 3. Clear active_user if active account was logged out
            let activeUser = null;
            try {
                activeUser = JSON.parse(localStorage.getItem('active_user') || 'null');
            } catch (e) { activeUser = null; }

            if (activeUser && activeUser["Email"] && logoutSetLower.has(activeUser["Email"].toLowerCase())) {
                localStorage.removeItem('active_user');
            }

            // 4. Refresh UI
            selectedEmails.clear();
            document.getElementById('statusMsg').textContent = `Logged out of ${toLogout.length} account(s).`;

            if (remaining.length === 0 && !localStorage.getItem('active_user')) {
                document.getElementById('pageTitle').textContent = 'Logged out';
                document.getElementById('pageSubtitle').textContent = 'You have been signed out of this device.';
                document.getElementById('accountsSection').style.display = 'none';
                document.getElementById('emptySection').style.display = 'block';
            } else {
                await loadAccounts();
            }
        } catch (err) {
            console.error("Logout error:", err);
            document.getElementById('statusMsg').textContent = 'Error logging out. Please try again.';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Log out selected';
        }
    });

    loadAccounts();
</script>
</body>
</html>
