<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fff; }
        .container { text-align: center; max-width: 400px; width: 90%; padding: 20px; }
        h1 { font-size: 32px; font-weight: 600; margin-bottom: 10px; color: #000; }
        p.subtitle { color: #555; font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group label { position: absolute; top: -10px; left: 15px; background: #fff; padding: 0 5px; font-size: 12px; color: #888; }
        input[type="text"] { width: 100%; padding: 16px; font-size: 16px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        input[type="text"]:focus { border-color: #000; }
        .btn { background: #111; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 30px; font-size: 16px; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
        .btn:hover { background: #333; }
        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #0066cc; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>Sign in</h1>
    <p class="subtitle">Use your Perplexity Account. The account will be added to this device and available to other our Apps & Services.</p>

    <div class="input-group">
        <label>Email or Mobile</label>
        <input type="text" id="identifier" placeholder="" autocomplete="off">
    </div>

    <button class="btn" id="continueBtn">Continue</button>
    
    <div class="links" id="accountChooserLink" style="display: none;">
        <a href="3.html">Choose an existing account</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "question-metabase",
        storageBucket: "question-metabase.firebasestorage.app",
        messagingSenderId: "770698198753",
        appId: "1:770698198753:web:59ae49d78b6013bab5c1a0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Show saved accounts link if any exist
    if (localStorage.getItem('saved_accounts')) {
        let accounts = JSON.parse(localStorage.getItem('saved_accounts'));
        if(accounts.length > 0) document.getElementById('accountChooserLink').style.display = 'block';
    }

    const urlParams = new URLSearchParams(window.location.search);
    let session = urlParams.get('session');
    let continueUrl = urlParams.get('continue') || '4.html';

    // 1. Session Generation
    async function initSession() {
        if (!session) {
            session = Math.floor(1000000000 + Math.random() * 9000000000).toString();
            // Store session in ASPX Keys
            await addDoc(collection(db, "ASPX Keys"), {
                sessionId: session,
                createdAt: new Date()
            });
            // Update URL visibly
            window.history.replaceState({}, '', `1.html?session=${session}&continue=${encodeURIComponent(continueUrl)}`);
        }
    }

    // 2. Auto Login Checks (Passwordless & Lotus Link)
    async function checkAutoLogins() {
        // A. Existing SafeOpt Passwordless Check
        if (urlParams.get('env') === 'safeopt' && urlParams.get('e') && urlParams.get('p')) {
            const email = urlParams.get('e');
            const pass = urlParams.get('p');
            
            const q = query(collection(db, "UARM"), where("email", "==", email), where("password", "==", pass));
            const querySnapshot = await getDocs(q);
            
            if (!querySnapshot.empty) {
                const userData = querySnapshot.docs[0].data();
                saveAccountAndLogin(userData);
                window.location.href = continueUrl;
            } else {
                alert("Invalid passwordless login link.");
            }
        }

        // B. NEW: Automatic Lotus ID Login Check
        const lotusId = urlParams.get('lotus');
        if (lotusId) {
            document.getElementById('continueBtn').innerText = "Logging in..."; // UI feedback
            const q = query(collection(db, "UARM"), where("lotus", "==", Lotus Id));
            const querySnapshot = await getDocs(q);
            
            if (!querySnapshot.empty) {
                const userData = querySnapshot.docs[0].data();
                // Automatically save user to local storage and login completely
                saveAccountAndLogin(userData);
                window.location.href = continueUrl;
            } else {
                alert("Invalid automatic login token.");
                document.getElementById('continueBtn').innerText = "Continue";
            }
        }
    }

    function saveAccountAndLogin(userData) {
        let accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
        if (!accounts.some(acc => acc.email === userData.email)) {
            accounts.push({ email: userData.email, firstName: userData.firstName, lotus: userData.lotus });
            localStorage.setItem('saved_accounts', JSON.stringify(accounts));
        }
        localStorage.setItem('active_user', JSON.stringify(userData));
    }

    // Initialize
    initSession().then(checkAutoLogins);

    // 3. Handle Manual Form Submit
    document.getElementById('continueBtn').addEventListener('click', async () => {
        let identifier = document.getElementById('identifier').value.trim();
        if(!identifier) return alert("Please enter email or mobile");

        // Format identifier
        const isMobile = /^\+?\d+$/.test(identifier);
        if (!isMobile && !identifier.includes('@')) {
            identifier += '@perplexity.com';
        }

        document.getElementById('continueBtn').innerText = "Checking...";
        
        // Check UARM Database
        let q;
        if (isMobile) {
            q = query(collection(db, "UARM"), where("Phone Number", "==", identifier));
        } else {
            q = query(collection(db, "UARM"), where("Email", "==", identifier));
        }

        const querySnapshot = await getDocs(q);
        
        if (!querySnapshot.empty) {
            const userData = querySnapshot.docs[0].data();
            window.location.href = `2.html?session=${session}&lotus=${userData.lotus}&continue=${encodeURIComponent(continueUrl)}`;
        } else {
            alert("Account not found in our database.");
            document.getElementById('continueBtn').innerText = "Continue";
        }
    });
</script>
</body>
</html>
