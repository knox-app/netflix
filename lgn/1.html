<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fff; color: #000; }
        .container { width: 100%; max-width: 400px; padding: 40px 24px; text-align: center; box-sizing: border-box; }
        h1 { font-size: 32px; font-weight: 600; margin-bottom: 12px; letter-spacing: -0.5px; }
        p.subtitle { font-size: 15px; color: #555; line-height: 1.5; margin-bottom: 32px; }
        
        .input-group { position: relative; margin-bottom: 24px; text-align: left; }
        .input-group input { width: 100%; padding: 18px 16px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.2s; background: transparent; }
        .input-group input:focus { border-color: #000; }
        .input-group label { position: absolute; left: 12px; top: 18px; background: #fff; padding: 0 4px; color: #6b7280; font-size: 16px; transition: 0.2s ease all; pointer-events: none; }
        .input-group input:focus + label, .input-group input:not(:placeholder-shown) + label { top: -10px; font-size: 12px; color: #555; }
        
        button { width: 100%; padding: 16px; background-color: #000; color: #fff; border: none; border-radius: 30px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
        button:hover { background-color: #333; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #error-message { color: #dc2626; font-size: 14px; margin-top: -15px; margin-bottom: 20px; display: none; text-align: left; padding-left: 5px; }
        
        /* Auto-login loader styles */
        #loader { display: none; font-size: 16px; color: #555; font-weight: 500; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Displayed during SafeOpt Auto-Login -->
        <div id="loader">
            <h1>Authenticating...</h1>
            <p class="subtitle" style="margin-top:10px;">Securely logging you in...</p>
        </div>

        <!-- Normal Login Form -->
        <div id="main-form">
            <h1>Sign in</h1>
            <p class="subtitle">Use your Perpelexity Account. The account will be added to this device and available to other our Apps & Services</p>

            <div class="input-group">
                <input type="text" id="loginId" placeholder=" " required>
                <label for="loginId">Email or Mobile Number</label>
            </div>
            
            <div id="error-message">Account not found. Please try again.</div>

            <button id="continueBtn">Continue</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // Added updateDoc, deleteDoc, getDoc to support auto-login logic
        import { getFirestore, collection, doc, setDoc, getDoc, query, where, getDocs, serverTimestamp, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
            authDomain: "question-metabase.firebaseapp.com",
            databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "question-metabase",
            storageBucket: "question-metabase.firebasestorage.app",
            messagingSenderId: "770698198753",
            appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
            measurementId: "G-6ZP1FPMKSJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Security Utility for Auto-Login
        function generateNewLotusId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < 15; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        let currentSessionId = "";

        async function initializeSession() {
            const urlParams = new URLSearchParams(window.location.search);
            let sessionId = urlParams.get('session');
            let continueParam = urlParams.get('continue') || ""; 

            // Only generate a new session if we aren't bypassing with safeopt
            if (!sessionId) {
                sessionId = Math.floor(1000000000 + Math.random() * 9000000000).toString();
                
                // Construct URL keeping existing params like env and lotus intact
                let newUrl = window.location.pathname + '?session=' + sessionId + '&continue=' + encodeURIComponent(continueParam);
                if(urlParams.get('env')) newUrl += '&env=' + urlParams.get('env');
                if(urlParams.get('lotus')) newUrl += '&lotus=' + urlParams.get('lotus');
                
                window.history.replaceState({}, '', newUrl);

                try {
                    await setDoc(doc(db, "ASPX Keys", sessionId), {
                        sessionId: sessionId,
                        continue: continueParam,
                        createdAt: serverTimestamp()
                    });
                } catch (error) {
                    console.error("Error storing session:", error);
                }
            }
            return sessionId;
        }

        // --- SAFEOPT AUTO-LOGIN LOGIC ---
        async function handleSafeOptAutoLogin(lotusId, sessionId) {
            try {
                // 1. Verify Lotus ID exists in database
                const usersRef = collection(db, "UARM");
                let userData = null;
                let userDocId = ""; 
                let lotusFieldName = ""; 

                const qUpper = query(usersRef, where("Lotus", "==", lotusId));
                const snapUpper = await getDocs(qUpper);
                
                if (!snapUpper.empty) {
                    userData = snapUpper.docs[0].data();
                    userDocId = snapUpper.docs[0].id; 
                    lotusFieldName = "Lotus"; 
                } else {
                    const qLower = query(usersRef, where("lotus", "==", lotusId));
                    const snapLower = await getDocs(qLower);
                    if (!snapLower.empty) {
                        userData = snapLower.docs[0].data();
                        userDocId = snapLower.docs[0].id; 
                        lotusFieldName = "lotus"; 
                    }
                }

                if (!userData) {
                    alert("This secure login link is invalid or has expired.");
                    window.location.href = "1.html"; // Refresh cleanly
                    return;
                }

                // 2. Rotate Lotus ID for Security
                const newLotusId = generateNewLotusId(); 
                const userRef = doc(db, "UARM", userDocId);
                await updateDoc(userRef, { [lotusFieldName]: newLotusId });

                // 3. Add to Device's Saved Accounts List
                const userDisplayId = userData.email || userData.mobile || "Account Found";
                const userInitial = (userData.firstName || userDisplayId).charAt(0).toUpperCase();

                let savedAccounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
                savedAccounts = savedAccounts.filter(acc => acc.docId !== userDocId); // remove duplicate if exists
                savedAccounts.push({
                    docId: userDocId,
                    lotusId: newLotusId,
                    displayId: userDisplayId,
                    initial: userInitial
                });
                
                localStorage.setItem('savedAccounts', JSON.stringify(savedAccounts));
                localStorage.setItem('activeLotusId', newLotusId);

                // 4. Fetch Continue Redirect & Clean up Session
                let targetUrl = "3.html"; // Default fallback
                
                if (sessionId) {
                    const sessionDocRef = doc(db, "ASPX Keys", sessionId);
                    const sessionSnap = await getDoc(sessionDocRef);
                    if (sessionSnap.exists()) {
                        const dbContinueUrl = sessionSnap.data().continue;
                        if (dbContinueUrl && dbContinueUrl.trim() !== "") {
                            targetUrl = dbContinueUrl;
                        }
                        // Delete session for security
                        await deleteDoc(sessionDocRef);
                    } else {
                        // Fallback if session wasn't written fast enough
                        const urlParams = new URLSearchParams(window.location.search);
                        if (urlParams.get('continue')) targetUrl = urlParams.get('continue');
                    }
                }

                // Execute final redirect
                window.location.href = targetUrl;

            } catch (error) {
                console.error("Auto-login failed:", error);
                alert("Secure auto-login failed. Please sign in normally.");
                window.location.href = "1.html";
            }
        }

        // INIT SCRIPT: Check URL on load
        initializeSession().then(id => { 
            currentSessionId = id; 
            
            const urlParams = new URLSearchParams(window.location.search);
            const envParam = urlParams.get('env');
            const lotusParam = urlParams.get('lotus');

            // Trigger Bypass if parameters match
            if (envParam === 'safeopt' && lotusParam) {
                document.getElementById('main-form').style.display = 'none';
                document.getElementById('loader').style.display = 'block';
                handleSafeOptAutoLogin(lotusParam, currentSessionId);
            }
        });

        // --- NORMAL LOGIN EVENT LISTENER ---
        const continueBtn = document.getElementById('continueBtn');
        const loginInput = document.getElementById('loginId');
        const errorMsg = document.getElementById('error-message');

        continueBtn.addEventListener('click', async () => {
            let inputVal = loginInput.value.trim();
            if (!inputVal) { loginInput.focus(); return; }

            continueBtn.disabled = true;
            continueBtn.textContent = 'Checking...';
            errorMsg.style.display = 'none';

            const isMobileNumber = /^[\+\d\s\-]+$/.test(inputVal) && /\d/.test(inputVal);
            let queryField = isMobileNumber ? "mobile" : "email";
            let searchValue = inputVal;

            if (!isMobileNumber && !searchValue.includes('@')) {
                searchValue += '@perplexity.com';
                loginInput.value = searchValue; 
            }

            try {
                const usersRef = collection(db, "UARM");
                const q = query(usersRef, where(queryField, "==", searchValue));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const userData = querySnapshot.docs[0].data();
                    const lotusId = userData.lotus || userData.Lotus; 

                    if (lotusId) {
                        window.location.href = `2.html?session=${currentSessionId}&lotus=${lotusId}`;
                    } else {
                        alert("Account found, but Lotus ID is missing.");
                        continueBtn.disabled = false;
                        continueBtn.textContent = 'Continue';
                    }
                } else {
                    errorMsg.style.display = 'block';
                    continueBtn.disabled = false;
                    continueBtn.textContent = 'Continue';
                }
            } catch (error) {
                console.error("Error connecting to database:", error);
                alert("An error occurred. Please check your connection.");
                continueBtn.disabled = false;
                continueBtn.textContent = 'Continue';
            }
        });

        loginInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') continueBtn.click();
        });
    </script>
</body>
</html>
