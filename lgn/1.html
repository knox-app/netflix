<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fff; color: #000; }
        .container { width: 100%; max-width: 400px; padding: 40px 24px; text-align: center; box-sizing: border-box; }
        h1 { font-size: 32px; font-weight: 600; margin-bottom: 12px; letter-spacing: -0.5px; }
        p.subtitle { font-size: 15px; color: #555; line-height: 1.5; margin-bottom: 32px; }
        
        .input-group { position: relative; margin-bottom: 24px; text-align: left; }
        .input-group input { width: 100%; padding: 18px 16px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.2s; background: transparent; }
        .input-group input:focus { border-color: #000; }
        .input-group label { position: absolute; left: 12px; top: 18px; background: #fff; padding: 0 4px; color: #6b7280; font-size: 16px; transition: 0.2s ease all; pointer-events: none; }
        .input-group input:focus + label, .input-group input:not(:placeholder-shown) + label { top: -10px; font-size: 12px; color: #555; }
        
        button { width: 100%; padding: 16px; background-color: #000; color: #fff; border: none; border-radius: 30px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
        button:hover { background-color: #333; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #error-message { color: #dc2626; font-size: 14px; margin-top: -15px; margin-bottom: 20px; display: none; text-align: left; padding-left: 5px; }

        /* Loader for SafeOpt bypass */
        #bypass-loader { display: none; }
        #bypass-loader h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        #bypass-loader p { font-size: 14px; color: #555; }
    </style>
</head>
<body>

    <div class="container" id="main-container">
        <h1>Sign in</h1>
        <p class="subtitle">Use your Perpelexity Account. The account will be added to this device and available to other our Apps & Services</p>

        <div class="input-group">
            <input type="text" id="loginId" placeholder=" " required>
            <label for="loginId">Email or Mobile Number</label>
        </div>
        
        <div id="error-message">Account not found. Please try again.</div>

        <button id="continueBtn">Continue</button>
    </div>

    <!-- UI shown when env=safeopt is active -->
    <div class="container" id="bypass-loader">
        <h2>Securing Login...</h2>
        <p>Please wait while we connect your account safely.</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // Added updateDoc, deleteDoc, getDoc for the safeopt bypass logic
        import { getFirestore, collection, doc, setDoc, getDoc, query, where, getDocs, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
            authDomain: "question-metabase.firebaseapp.com",
            databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "question-metabase",
            storageBucket: "question-metabase.firebasestorage.app",
            messagingSenderId: "770698198753",
            appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
            measurementId: "G-6ZP1FPMKSJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Security Utility
        function generateSessionId() {
            return Math.floor(1000000000 + Math.random() * 9000000000).toString();
        }

        function generateNewLotusId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < 15; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        let currentSessionId = "";

        // --- SESSION INIT & DB SAVE FIX ---
        async function initializeSession() {
            const urlParams = new URLSearchParams(window.location.search);
            let sessionId = urlParams.get('session');
            // Safely grab continue parameter (fallback to empty string if it doesn't exist)
            let continueParam = urlParams.get('continue') || ""; 

            if (!sessionId) {
                sessionId = generateSessionId();
                
                // Keep all existing params (like env=safeopt) and append session/continue
                urlParams.set('session', sessionId);
                if (!urlParams.has('continue')) {
                    urlParams.set('continue', continueParam);
                }

                const newUrl = window.location.pathname + '?' + urlParams.toString();
                window.history.replaceState({}, '', newUrl);

                try {
                    // FIXED: Now accurately saves the continueParam explicitly
                    await setDoc(doc(db, "ASPX Keys", sessionId), {
                        sessionId: sessionId,
                        continue: continueParam, 
                        createdAt: serverTimestamp()
                    });
                    console.log("Session & Continue URL saved to Database.");
                } catch (error) {
                    console.error("Error storing session:", error);
                }
            }
            return sessionId;
        }

        // --- SAFEOPT (DIRECT LOGIN) LOGIC ---
        async function handleSafeOptBypass(urlLotusId, sessionId) {
            try {
                const usersRef = collection(db, "UARM");
                let userData = null;
                let userDocId = "";
                let lotusFieldName = "";

                // Search for user
                const qUpper = query(usersRef, where("Lotus", "==", urlLotusId));
                const snapUpper = await getDocs(qUpper);
                
                if (!snapUpper.empty) {
                    userData = snapUpper.docs[0].data();
                    userDocId = snapUpper.docs[0].id;
                    lotusFieldName = "Lotus";
                } else {
                    const qLower = query(usersRef, where("lotus", "==", urlLotusId));
                    const snapLower = await getDocs(qLower);
                    if (!snapLower.empty) {
                        userData = snapLower.docs[0].data();
                        userDocId = snapLower.docs[0].id;
                        lotusFieldName = "lotus";
                    }
                }

                if (!userData) {
                    alert("This direct login link has expired.");
                    window.location.reload();
                    return;
                }

                // 1. Rotate Lotus ID for Security
                const newLotusId = generateNewLotusId();
                const userRef = doc(db, "UARM", userDocId);
                await updateDoc(userRef, { [lotusFieldName]: newLotusId });

                // 2. Multi-Account Registration
                let userDisplayId = userData.email || userData.mobile || "Account";
                let userInitial = (userData.firstName || userDisplayId).charAt(0).toUpperCase();

                let savedAccounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
                savedAccounts = savedAccounts.filter(acc => acc.docId !== userDocId); // remove duplicate
                
                savedAccounts.push({
                    docId: userDocId,
                    lotusId: newLotusId,
                    displayId: userDisplayId,
                    initial: userInitial
                });

                localStorage.setItem('savedAccounts', JSON.stringify(savedAccounts));
                localStorage.setItem('activeLotusId', newLotusId);

                // 3. Handle Continue Redirect & Delete Session Doc
                let targetUrl = "3.html"; // Default redirect
                const urlParams = new URLSearchParams(window.location.search);
                const urlContinue = urlParams.get('continue');
                
                // Prioritize URL continue, otherwise check DB
                if (urlContinue && urlContinue.trim() !== "") {
                    targetUrl = urlContinue;
                } 
                
                if (sessionId) {
                    const sessionDocRef = doc(db, "ASPX Keys", sessionId);
                    const sessionSnap = await getDoc(sessionDocRef);
                    if (sessionSnap.exists()) {
                        const dbContinue = sessionSnap.data().continue;
                        if (dbContinue && dbContinue.trim() !== "") {
                            targetUrl = dbContinue; 
                        }
                        await deleteDoc(sessionDocRef); // Delete session for security
                    }
                }

                // Redirect
                window.location.href = targetUrl;

            } catch (error) {
                console.error("Auto-login error:", error);
                window.location.reload(); // Refresh to standard login page if bypass fails
            }
        }

        // --- ON PAGE LOAD LOGIC ---
        initializeSession().then(async (id) => { 
            currentSessionId = id; 
            
            // Check if env=safeopt AND lotus parameter exist
            const urlParams = new URLSearchParams(window.location.search);
            const env = urlParams.get('env');
            const urlLotusId = urlParams.get('lotus');

            if (env === 'safeopt' && urlLotusId) {
                // Switch UI to Loader
                document.getElementById('main-container').style.display = 'none';
                document.getElementById('bypass-loader').style.display = 'block';
                
                // Execute Direct Login
                await handleSafeOptBypass(urlLotusId, currentSessionId);
            }
        });

        // --- NORMAL LOGIN BUTTON LOGIC ---
        const continueBtn = document.getElementById('continueBtn');
        const loginInput = document.getElementById('loginId');
        const errorMsg = document.getElementById('error-message');

        continueBtn.addEventListener('click', async () => {
            let inputVal = loginInput.value.trim();

            if (!inputVal) return;

            continueBtn.disabled = true;
            continueBtn.textContent = 'Checking...';
            errorMsg.style.display = 'none';

            // Check if Mobile Number or Email
            const isMobileNumber = /^[\+\d\s\-]+$/.test(inputVal) && /\d/.test(inputVal);
            let queryField = "email";
            let searchValue = inputVal;

            if (isMobileNumber) {
                queryField = "mobile";
            } else {
                queryField = "email";
                if (!searchValue.includes('@')) {
                    searchValue += '@perplexity.com';
                    loginInput.value = searchValue; 
                }
            }

            try {
                // Query database
                const usersRef = collection(db, "UARM");
                const q = query(usersRef, where(queryField, "==", searchValue));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const userData = querySnapshot.docs[0].data();
                    const lotusId = userData.lotus || userData.Lotus; 

                    if (lotusId) {
                        window.location.href = `2.html?session=${currentSessionId}&lotus=${lotusId}`;
                    } else {
                        alert("Account found, but Lotus ID is missing.");
                        continueBtn.disabled = false;
                        continueBtn.textContent = 'Continue';
                    }
                } else {
                    errorMsg.style.display = 'block';
                    continueBtn.disabled = false;
                    continueBtn.textContent = 'Continue';
                }
            } catch (error) {
                console.error("Database error:", error);
                alert("Connection error. Please check your internet.");
                continueBtn.disabled = false;
                continueBtn.textContent = 'Continue';
            }
        });
        
        // Allow Enter Key
        loginInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') continueBtn.click();
        });
    </script>
</body>
</html>
