<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In</title>
    <style>
        /* CSS Variables for Dynamic Light/Dark Mode */
        :root {
            --bg-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #555555;
            --input-border: #dddddd;
            --input-focus: #000000;
            --input-bg: #ffffff;
            --btn-bg: #111111;
            --btn-text: #ffffff;
            --btn-hover: #333333;
        }

        body.dark {
            --bg-color: #0c0d14;
            --text-primary: #ffffff;
            --text-secondary: #8f98b2;
            --input-border: #2e344d;
            --input-focus: #1f80e0;
            --input-bg: #0c0d14;
            --btn-bg: linear-gradient(90deg, #1f80e0 0%, #a824e8 50%, #e5097f 100%);
            --btn-text: #ffffff;
            --btn-hover: opacity(0.9);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
        }

        .container { 
            text-align: center; 
            max-width: 400px; 
            width: 100%; 
            padding: 20px; 
            box-sizing: border-box;
        }
        
        h1 { font-size: 32px; font-weight: 600; margin-bottom: 10px; color: var(--text-primary); }
        
        p.subtitle { color: var(--text-secondary); font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        
        .input-group label {
            position: absolute;
            top: -10px;
            left: 15px;
            background: var(--bg-color);
            padding: 0 5px;
            font-size: 12px;
            color: var(--text-secondary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-primary);
            transition: border-color 0.2s, background-color 0.3s, color 0.3s;
        }

        input[type="text"]:focus { border-color: var(--input-focus); }

        .btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn:hover { opacity: 0.95; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #1f80e0; text-decoration: none; cursor: pointer; }
    </style>
</head>
<body class="dark">

<div class="container">
    <h1>Sign in</h1>
    <p class="subtitle">Use your Perplexity / Hotstar Account. The account will be verified and bound to this device.</p>

    <div class="input-group">
        <label>Email or Mobile</label>
        <input type="text" id="identifier" placeholder="" autocomplete="off">
    </div>

    <button class="btn" id="continueBtn">Continue</button>
    
    <div class="links" id="accountChooserLink" style="display: none;">
        <a href="3.html">Choose an existing account</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "question-metabase",
        storageBucket: "question-metabase.firebasestorage.app",
        messagingSenderId: "770698198753",
        appId: "1:770698198753:web:59ae49d78b6013bab5c1a0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Get or Create Unique Hardware/Device ID
    function getDeviceFingerprint() {
        let deviceId = localStorage.getItem('device_fingerprint_id');
        if (!deviceId) {
            deviceId = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Date.now();
            localStorage.setItem('device_fingerprint_id', deviceId);
        }
        return deviceId;
    }

    // Generate a 10-Digit Alphanumeric Session ID
    function generate10DigitSession() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let result = '';
        for (let i = 0; i < 10; i++) {
            result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
    }

    // Check Saved Accounts in LocalStorage
    try {
        if (localStorage.getItem('saved_accounts')) {
            let accounts = JSON.parse(localStorage.getItem('saved_accounts'));
            if (accounts && accounts.length > 0) {
                document.getElementById('accountChooserLink').style.display = 'block';
            }
        }
    } catch (e) {
        console.error("Local storage read error:", e);
    }

    const urlParams = new URLSearchParams(window.location.search);
    let session = urlParams.get('session');
    let continueUrl = urlParams.get('continue') || '4.html';
    const provider = urlParams.get('provider');
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;

    /* ================= THEME HANDLER ================= */
    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function applyTheme() {
        if (theme === "dark" || theme === "d") {
            document.body.classList.add("dark");
            return;
        }
        if (theme === "light" || theme === "l") {
            document.body.classList.remove("dark");
            return;
        }
        if (mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }

    applyTheme();
    mediaQuery.addEventListener("change", () => { if (!theme) applyTheme(); });

    // Fetch Provider Redirect
    async function resolveProvider() {
        if (provider) {
            try {
                const q = query(collection(db, "API Keys"), where("Sulg", "==", provider));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    const providerData = querySnapshot.docs[0].data();
                    if (providerData["Redirect"]) {
                        continueUrl = providerData["Redirect"];
                    }
                }
            } catch (err) {
                console.error("Failed to fetch provider details:", err);
            }
        }
    }

    // Auto-login handlers
    async function checkAutoLogins() {
        try {
            // Passwordless Check
            if (urlParams.get('env') === 'safeopt' && urlParams.get('e') && urlParams.get('p')) {
                const email = urlParams.get('e');
                const pass = urlParams.get('p');
                
                const q = query(collection(db, "UARM"), where("Email", "==", email), where("Password", "==", pass));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    handleUserRouting(querySnapshot.docs[0]);
                } else {
                    alert("Invalid passwordless login link.");
                }
            }

            // Lotus Link Check
            const lotusId = urlParams.get('lotus') || urlParams.get('Lotus');
            if (lotusId) {
                document.getElementById('continueBtn').innerText = "Logging in...";
                const q = query(collection(db, "UARM"), where("Lotus", "==", lotusId));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    handleUserRouting(querySnapshot.docs[0]);
                } else {
                    alert("Invalid automatic login token.");
                    document.getElementById('continueBtn').innerText = "Continue";
                }
            }
        } catch (err) {
            console.error("Auto-login error:", err);
        }
    }

    // Save Account locally & Route according to Hotstar status
    async function handleUserRouting(userDoc) {
        const userData = userDoc.data();
        const email = userData["Email"];
        const deviceId = getDeviceFingerprint();

        // Cache local credentials
        try {
            let accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
            if (email && !accounts.some(acc => acc.email === email)) {
                accounts.push({ email: email, firstName: userData["First Name"] || "", lotus: userData["Lotus"] || "" });
                localStorage.setItem('saved_accounts', JSON.stringify(accounts));
            }
            localStorage.setItem('active_user', JSON.stringify(userData));
            localStorage.setItem('hotstar_uarm_doc_id', userDoc.id);
        } catch (e) {
            console.error("Storage error:", e);
        }

        // 1. If user already registered and has Hotstar profiles -> Redirect to https://abc.xyz
        if (userData.Hotstar === true && userData.Profiles && userData.Profiles.length > 0) {
            window.location.href = "https://abc.xyz";
            return;
        }

        // 2. Generate 10-Digit Alphanumeric Session locked to Device ID & Email
        const sessionId = generate10DigitSession();
        await setDoc(doc(db, "ASPX Keys", sessionId), {
            sessionId: sessionId,
            email: email,
            deviceId: deviceId,
            uarmId: userDoc.id,
            userName: userData["First Name"] || (userData["Name"] || "User"),
            createdAt: new Date().toISOString()
        });

        localStorage.setItem('current_hotstar_session', sessionId);

        // Redirect to 2.html with 10-digit session parameter
        let redirectUrl = `2.html?session=${sessionId}`;
        if (provider) redirectUrl += `&provider=${encodeURIComponent(provider)}`;
        if (theme) redirectUrl += `&theme=${theme}`;

        window.location.href = redirectUrl;
    }

    resolveProvider().then(checkAutoLogins);

    // Form Submit Listener
    document.getElementById('continueBtn').addEventListener('click', async () => {
        let identifier = document.getElementById('identifier').value.trim();
        if (!identifier) return alert("Please enter email or mobile number.");

        const isMobile = /^\+?\d+$/.test(identifier);
        if (!isMobile && !identifier.includes('@')) {
            identifier += '@perplexity.com';
        }

        const btn = document.getElementById('continueBtn');
        btn.innerText = "Verifying...";
        btn.disabled = true;

        try {
            let q;
            if (isMobile) {
                q = query(collection(db, "UARM"), where("Phone Number", "==", identifier));
            } else {
                q = query(collection(db, "UARM"), where("Email", "==", identifier));
            }

            const querySnapshot = await getDocs(q);

            if (!querySnapshot.empty) {
                await handleUserRouting(querySnapshot.docs[0]);
            } else {
                alert("Account not found in our database.");
                btn.disabled = false;
                btn.innerText = "Continue";
            }
        } catch (error) {
            console.error("Login verification error:", error);
            alert("Database connection error. Please try again.");
            btn.disabled = false;
            btn.innerText = "Continue";
        }
    });
</script>
</body>
</html>
