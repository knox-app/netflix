<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Profile</title>
    <style>
        /* Base styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
            background-color: #f9fafb; color: #111827;
        }
        
        .container {
            width: 100%; max-width: 450px; padding: 20px; box-sizing: border-box;
        }

        .profile-card {
            background: #fff; border-radius: 24px; padding: 32px 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            text-align: center; display: none; /* Hidden until data loads */
        }

        /* Avatar Circle */
        .avatar {
            width: 80px; height: 80px; background-color: #000; color: #fff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: 600; margin: 0 auto 16px auto;
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 4px 0; letter-spacing: -0.5px; }
        p.email-subtitle { font-size: 14px; color: #6b7280; margin: 0 0 24px 0; }

        /* Data List Details */
        .info-list { text-align: left; margin-bottom: 32px; }
        .info-row { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #f3f4f6; }
        .info-row:last-child { border-bottom: none; }
        .info-label { font-size: 14px; color: #6b7280; font-weight: 500; }
        .info-value { font-size: 14px; color: #111827; font-weight: 500; text-align: right; }

        /* Buttons */
        button.sign-out-btn {
            width: 100%; padding: 16px; background-color: #fff; color: #dc2626; 
            border: 1px solid #fca5a5; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            margin-bottom: 12px;
        }
        button.sign-out-btn:hover { background-color: #fef2f2; }

        button.switch-account-btn {
            width: 100%; padding: 16px; background-color: #f3f4f6; color: #374151;
            border: none; border-radius: 30px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        button.switch-account-btn:hover { background-color: #e5e7eb; }

        /* Loader */
        #loader { text-align: center; font-size: 16px; color: #555; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Loading State -->
        <div id="loader">Loading profile data...</div>

        <!-- Main Profile Card -->
        <div class="profile-card" id="profileCard">
            <div class="avatar" id="avatarInitial">U</div>
            
            <h1 id="fullName">User Name</h1>
            <p class="email-subtitle" id="userDisplayId">loading...</p>

            <div class="info-list">
                <div class="info-row">
                    <span class="info-label">Mobile</span>
                    <span class="info-value" id="userMobile">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Email</span>
                    <span class="info-value" id="userEmail">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Date of Birth</span>
                    <span class="info-value" id="userDob">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Gender</span>
                    <span class="info-value" id="userGender">--</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Account Type</span>
                    <span class="info-value" style="text-transform: capitalize;" id="userType">--</span>
                </div>
            </div>

            <button class="sign-out-btn" id="signOutBtn">Sign Out</button>
            <button class="switch-account-btn" id="switchAccountBtn">Switch Account</button>
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
            authDomain: "question-metabase.firebaseapp.com",
            databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "question-metabase",
            storageBucket: "question-metabase.firebasestorage.app",
            messagingSenderId: "770698198753",
            appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
            measurementId: "G-6ZP1FPMKSJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Check if user has an active session
        function checkAuth() {
            // Using the new multi-account key
            const lotusId = localStorage.getItem('activeLotusId');

            if (!lotusId) {
                // Not logged in, kick them to the account chooser
                window.location.href = '3.html';
                return null;
            }
            return lotusId;
        }

        // Fetch and display user data
        async function loadProfile() {
            const lotusId = checkAuth();
            if (!lotusId) return; 

            try {
                const usersRef = collection(db, "UARM");
                let userData = null;

                const qUpper = query(usersRef, where("Lotus", "==", lotusId));
                const snapUpper = await getDocs(qUpper);
                
                if (!snapUpper.empty) {
                    userData = snapUpper.docs[0].data();
                } else {
                    const qLower = query(usersRef, where("lotus", "==", lotusId));
                    const snapLower = await getDocs(qLower);
                    if (!snapLower.empty) {
                        userData = snapLower.docs[0].data();
                    }
                }

                if (userData) {
                    // Populate UI
                    const firstName = userData.firstName || "";
                    const lastName = userData.LastName || userData.lastName || ""; 
                    const primaryDisplay = userData.email || userData.mobile || "Perplexity User";
                    
                    document.getElementById('fullName').textContent = `${firstName} ${lastName}`.trim() || primaryDisplay;
                    document.getElementById('userDisplayId').textContent = primaryDisplay;
                    
                    document.getElementById('userMobile').textContent = userData.mobile || "--";
                    document.getElementById('userEmail').textContent = userData.email || "--";
                    document.getElementById('userDob').textContent = userData.dob || "--";
                    document.getElementById('userGender').textContent = userData.gender || "--";
                    document.getElementById('userType').textContent = userData.type || "Personal";

                    // Set Avatar Initial
                    if (firstName) {
                        document.getElementById('avatarInitial').textContent = firstName.charAt(0).toUpperCase();
                    } else {
                        document.getElementById('avatarInitial').textContent = primaryDisplay.charAt(0).toUpperCase();
                    }

                    // Show profile
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('profileCard').style.display = 'block';
                } else {
                    alert("Profile data not found. The session may have expired.");
                    
                    // Cleanup broken session
                    let savedAccounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
                    savedAccounts = savedAccounts.filter(acc => acc.lotusId !== lotusId);
                    localStorage.setItem('savedAccounts', JSON.stringify(savedAccounts));
                    localStorage.removeItem('activeLotusId');
                    
                    window.location.href = '3.html';
                }

            } catch (error) {
                console.error("Error loading profile:", error);
                document.getElementById('loader').textContent = "Error loading profile data. Check connection.";
            }
        }

        // Handle Switch Account (goes back to chooser without logging out)
        document.getElementById('switchAccountBtn').addEventListener('click', () => {
            window.location.href = '3.html';
        });

        // Handle Smart Sign Out (Logs out of CURRENT account only)
        document.getElementById('signOutBtn').addEventListener('click', () => {
            const activeId = localStorage.getItem('activeLotusId');
            
            // 1. Get the list of saved accounts
            let savedAccounts = JSON.parse(localStorage.getItem('savedAccounts') || '[]');
            
            // 2. Remove the current account from the array
            savedAccounts = savedAccounts.filter(acc => acc.lotusId !== activeId);
            
            // 3. Save the new list back to storage
            localStorage.setItem('savedAccounts', JSON.stringify(savedAccounts));
            
            // 4. Clear the active session
            localStorage.removeItem('activeLotusId');
            
            // 5. Redirect to account chooser
            window.location.href = '3.html';
        });

        // Initialize
        loadProfile();
    </script>
</body>
</html>
