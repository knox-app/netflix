<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f8f9fa;
            --surface-card: #ffffff;
            --surface-subtle: #f1f3f5;
            --surface-hover: #e9ecef;
            --border-subtle: rgba(0, 0, 0, 0.08);
            --border-focus: rgba(0, 0, 0, 0.16);
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --accent-primary: #000000;
            --accent-primary-text: #ffffff;
            --accent-badge-bg: rgba(0, 0, 0, 0.05);
            --accent-badge-text: #1e293b;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.08);
            --danger-hover: #dc2626;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --blur-nav: blur(20px);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-full: 9999px;
            --shimmer-bg: linear-gradient(90deg, #f0f0f0 0%, #e4e4e7 50%, #f0f0f0 100%);
        }

        body.dark {
            --bg-page: #0a0b0e;
            --surface-card: #12141a;
            --surface-subtle: #191c24;
            --surface-hover: #222632;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.18);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #ffffff;
            --accent-primary-text: #090a0f;
            --accent-badge-bg: rgba(255, 255, 255, 0.08);
            --accent-badge-text: #f1f5f9;
            --danger: #f87171;
            --danger-bg: rgba(248, 113, 113, 0.1);
            --danger-hover: #ef4444;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 12px 30px rgba(0,0,0,0.5);
            --shimmer-bg: linear-gradient(90deg, #151821 0%, #252a3a 50%, #151821 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Top Header */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(var(--bg-page), 0.8);
            backdrop-filter: var(--blur-nav);
            -webkit-backdrop-filter: var(--blur-nav);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.4px;
        }

        .brand-logo svg {
            width: 20px;
            height: 20px;
            fill: var(--text-main);
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--surface-subtle);
            padding: 4px 10px;
            border-radius: var(--radius-full);
            border: 1px solid var(--border-subtle);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        /* Main Container */
        .container {
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 48px 24px 80px;
            flex: 1;
        }

        /* Profile Hero */
        .hero-section {
            display: flex;
            align-items: center;
            gap: 24px;
            padding-bottom: 40px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .avatar-frame {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid var(--border-focus);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            background: var(--surface-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .avatar-img.loaded {
            opacity: 1;
        }

        .avatar-fallback {
            position: absolute;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .hero-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .name-row h1 {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .switch-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--surface-subtle);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: inherit;
        }

        .switch-pill-btn:hover {
            background: var(--surface-hover);
            border-color: var(--border-focus);
            transform: translateY(-1px);
        }

        .meta-tags {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .email-sub {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .account-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 0.72rem;
            font-weight: 600;
            background: var(--accent-badge-bg);
            color: var(--accent-badge-text);
            border: 1px solid var(--border-subtle);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Bento Card Layout */
        .bento-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 32px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .card-header {
            margin-bottom: 22px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .card-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        /* Detail Rows */
        .data-list {
            display: flex;
            flex-direction: column;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.94rem;
        }

        .data-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .data-row:first-child {
            padding-top: 0;
        }

        .data-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .data-value {
            color: var(--text-main);
            font-weight: 600;
        }

        /* Sign Out Bottom Area */
        .danger-zone {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px 32px;
            gap: 16px;
            flex-wrap: wrap;
        }

        .danger-text h3 {
            font-size: 0.98rem;
            font-weight: 600;
        }

        .danger-text p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .btn-signout {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: var(--radius-md);
            font-size: 0.88rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .btn-signout:hover {
            background-color: var(--danger);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
        }

        .btn-signout:active {
            transform: scale(0.98);
        }

        /* Shimmer Loading Skeleton */
        .skeleton {
            background-size: 200% 100%;
            background-image: var(--shimmer-bg);
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            display: inline-block;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="brand-logo">
        <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
        </svg>
        <span>Account Central</span>
    </div>
    <div class="live-status">
        <span class="status-dot"></span>
        <span>Realtime Sync</span>
    </div>
</header>

<main class="container">
    <!-- Hero Profile -->
    <section class="hero-section">
        <div class="avatar-frame">
            <span class="avatar-fallback" id="avatarInitial">U</span>
            <img id="avatarImage" class="avatar-img" alt="Profile DP" loading="lazy">
        </div>
        
        <div class="hero-info">
            <div class="name-row">
                <h1 id="fullName">Loading...</h1>
                <button class="switch-pill-btn" id="switchAccountBtn">
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    Switch Account
                </button>
            </div>
            <div class="meta-tags">
                <span class="email-sub" id="primaryEmail">...</span>
                <span class="account-badge" id="accountBadge">Personal</span>
            </div>
        </div>
    </section>

    <!-- Personal Details Bento Card -->
    <section class="bento-card">
        <div class="card-header">
            <h2 class="card-title">Personal Details</h2>
            <p class="card-description">Your primary personal and contact identifiers</p>
        </div>
        <div class="data-list">
            <div class="data-row">
                <span class="data-label">First Name</span>
                <span class="data-value" id="valFirstName">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Last Name</span>
                <span class="data-value" id="valLastName">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Phone Number</span>
                <span class="data-value" id="valPhone">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Date of Birth</span>
                <span class="data-value" id="valDob">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Gender</span>
                <span class="data-value" id="valGender">—</span>
            </div>
        </div>
    </section>

    <!-- Bottom Sign Out Card -->
    <section class="danger-zone">
        <div class="danger-text">
            <h3>Sign Out of Session</h3>
            <p>You will be redirected back to the account picker.</p>
        </div>
        <button class="btn-signout" id="logoutBtn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Sign out
        </button>
    </section>
</main>

<script>
    // 1. URL & Theme Configuration
    const urlParams = new URLSearchParams(window.location.search);
    const uParam = urlParams.has('u') ? urlParams.get('u') : urlParams.get('user');
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;

    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function applyTheme() {
        if (theme === "dark" || theme === "d") {
            document.body.classList.add("dark");
            return;
        }
        if (theme === "light" || theme === "l") {
            document.body.classList.remove("dark");
            return;
        }
        if (mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }

    applyTheme();
    mediaQuery.addEventListener("change", () => {
        if (!theme) applyTheme();
    });

    // 2. Multi-Account URL Handling
    if (uParam !== null) {
        const index = parseInt(uParam, 10);
        let savedAccounts = [];
        try {
            savedAccounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
        } catch (e) {
            savedAccounts = [];
        }

        if (!isNaN(index) && index >= 0 && index < savedAccounts.length) {
            const targetLotus = savedAccounts[index].lotus;
            let activeUser = {};
            try {
                activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
            } catch (e) {
                activeUser = {};
            }

            if (activeUser["Lotus"] !== targetLotus) {
                let redirectUrl = `1.html?Lotus=${encodeURIComponent(targetLotus)}&continue=4.html`;
                if (theme) redirectUrl += `&theme=${encodeURIComponent(theme)}`;
                window.location.href = redirectUrl;
            }
        } else {
            const dest = theme ? `3.html?theme=${encodeURIComponent(theme)}` : '3.html';
            window.location.href = dest;
        }
    }

    // 3. Render Profile Data
    let lastRenderedState = "";

    function renderUserData() {
        const activeUserStr = localStorage.getItem('active_user');

        if (!activeUserStr) {
            const dest = theme ? `1.html?theme=${encodeURIComponent(theme)}` : '1.html';
            window.location.href = dest;
            return;
        }

        // Avoid unnecessary re-renders if nothing changed
        if (activeUserStr === lastRenderedState) return;
        lastRenderedState = activeUserStr;

        try {
            const user = JSON.parse(activeUserStr);

            const firstName = user["First Name"] || "";
            const lastName = user["Last Name"] || "";
            const fullName = `${firstName} ${lastName}`.trim() || "User";
            const email = user["Email"] || "—";
            const phone = user["Phone Number"] || "—";
            const dob = user["Date of Birth"] || "—";
            const gender = user["Gender"] || "—";
            const type = (user["Type"] || "personal").toLowerCase();
            const profilePicUrl = user["Profile_Picture"] || null;

            // DOM Updates
            document.getElementById('fullName').innerText = fullName;
            document.getElementById('primaryEmail').innerText = email;
            document.getElementById('valFirstName').innerText = firstName || "—";
            document.getElementById('valLastName').innerText = lastName || "—";
            document.getElementById('valPhone').innerText = phone;
            document.getElementById('valDob').innerText = dob;
            document.getElementById('valGender').innerText = gender;

            const typeLabels = {
                'business': 'Business Account',
                'kids': 'Kids Account',
                'personal': 'Personal Account'
            };
            document.getElementById('accountBadge').innerText = typeLabels[type] || 'Personal Account';

            // Avatar Handling & DP Lazy loading
            const initial = firstName ? firstName.charAt(0).toUpperCase() : (email ? email.charAt(0).toUpperCase() : 'U');
            const avatarInitialElem = document.getElementById('avatarInitial');
            const avatarImg = document.getElementById('avatarImage');

            avatarInitialElem.innerText = initial;

            if (profilePicUrl) {
                avatarImg.src = profilePicUrl;
                avatarImg.onload = () => {
                    avatarImg.classList.add('loaded');
                    avatarInitialElem.style.display = 'none';
                };
                avatarImg.onerror = () => {
                    avatarImg.style.display = 'none';
                    avatarInitialElem.style.display = 'block';
                };
            } else {
                avatarImg.style.display = 'none';
                avatarInitialElem.style.display = 'block';
            }
        } catch (e) {
            console.error("Failed to render user data:", e);
        }
    }

    // Initial render
    renderUserData();

    // 4. Real-time Live Updates
    // React immediately to storage changes across browser tabs
    window.addEventListener('storage', (e) => {
        if (e.key === 'active_user') {
            renderUserData();
        }
    });

    // Fast interval check for real-time updates within the same window
    setInterval(renderUserData, 1000);

    // 5. Button Actions
    function goToSwitch() {
        const dest = theme ? `3.html?theme=${encodeURIComponent(theme)}` : '3.html';
        window.location.href = dest;
    }

    document.getElementById('switchAccountBtn').onclick = goToSwitch;

    document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('active_user');
        goToSwitch();
    };
</script>
</body>
</html>
