<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/knox-app/cloud/d235b91b67a58037117f8f0c2d1391ffd209a463/logo/ca81fecf-2d54-4aea-8de0-f189a43e1002.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-page: #fbfbfd;
            --surface-card: #ffffff;
            --surface-subtle: #f5f5f7;
            --surface-hover: #ebebee;
            --border-subtle: rgba(0, 0, 0, 0.08);
            --border-focus: rgba(0, 0, 0, 0.2);
            --text-main: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-muted: #86868b;
            --accent-primary: #0071e3;
            --accent-primary-text: #ffffff;
            --danger: #ff3b30;
            --danger-bg: rgba(255, 59, 48, 0.08);
            --danger-hover: #e02d23;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 12px 36px rgba(0,0,0,0.1);
            --blur-nav: blur(20px);
            --radius-lg: 22px;
            --radius-md: 12px;
            --radius-full: 9999px;
            --modal-overlay: rgba(0, 0, 0, 0.4);

            /* Dynamic Badges */
            --badge-kids-bg: rgba(37, 99, 235, 0.1);
            --badge-kids-text: #2563eb;
            --badge-kids-border: rgba(37, 99, 235, 0.2);

            --badge-biz-bg: rgba(124, 58, 237, 0.1);
            --badge-biz-text: #7c3aed;
            --badge-biz-border: rgba(124, 58, 237, 0.2);

            --badge-personal-bg: rgba(0, 0, 0, 0.06);
            --badge-personal-text: #475569;
            --badge-personal-border: rgba(0, 0, 0, 0.1);
        }

        body.dark {
            --bg-page: #000000;
            --surface-card: #121214;
            --surface-subtle: #1c1c1e;
            --surface-hover: #2c2c2e;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-focus: rgba(255, 255, 255, 0.3);
            --text-main: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-muted: #6e6e73;
            --accent-primary: #2997ff;
            --accent-primary-text: #ffffff;
            --danger: #ff453a;
            --danger-bg: rgba(255, 69, 58, 0.12);
            --danger-hover: #ff3b30;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
            --shadow-md: 0 16px 50px rgba(0,0,0,0.7);
            --modal-overlay: rgba(0, 0, 0, 0.7);

            --badge-kids-bg: rgba(96, 165, 250, 0.15);
            --badge-kids-text: #93c5fd;
            --badge-kids-border: rgba(96, 165, 250, 0.3);

            --badge-biz-bg: rgba(167, 139, 250, 0.15);
            --badge-biz-text: #c4b5fd;
            --badge-biz-border: rgba(167, 139, 250, 0.3);

            --badge-personal-bg: rgba(255, 255, 255, 0.08);
            --badge-personal-text: #cbd5e1;
            --badge-personal-border: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(var(--bg-page), 0.8);
            backdrop-filter: var(--blur-nav);
            -webkit-backdrop-filter: var(--blur-nav);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
        }

        .brand-logo {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            object-fit: cover;
        }

        .main-container {
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 48px 24px 80px;
            flex: 1;
        }

        /* Profile Hero */
        .profile-hero {
            display: flex;
            align-items: center;
            gap: 28px;
            padding-bottom: 36px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 36px;
            flex-wrap: wrap;
        }

        .avatar-container {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 2px solid var(--border-focus);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            background: var(--surface-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-fallback {
            position: absolute;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .profile-headings {
            flex: 1;
            min-width: 250px;
        }

        .name-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .name-row h1 {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .btn-action-pill {
            background-color: var(--surface-subtle);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-action-pill:hover {
            background-color: var(--surface-hover);
            border-color: var(--border-focus);
        }

        .profile-sub-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .profile-email-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Badges */
        .account-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: var(--radius-full);
            font-size: 0.78rem;
            font-weight: 600;
            border: 1px solid transparent;
            text-transform: capitalize;
            transition: all 0.3s ease;
        }

        .account-badge svg {
            width: 14px;
            height: 14px;
        }

        .account-badge.badge-kids {
            background: var(--badge-kids-bg);
            color: var(--badge-kids-text);
            border-color: var(--badge-kids-border);
        }

        .account-badge.badge-business {
            background: var(--badge-biz-bg);
            color: var(--badge-biz-text);
            border-color: var(--badge-biz-border);
        }

        .account-badge.badge-personal {
            background: var(--badge-personal-bg);
            color: var(--badge-personal-text);
            border-color: var(--badge-personal-border);
        }

        /* Details Card */
        .details-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px 32px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 40px;
            transition: border-color 0.2s ease;
        }

        .details-card:hover {
            border-color: var(--border-focus);
        }

        .card-header {
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .card-description {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .data-list {
            display: flex;
            flex-direction: column;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.95rem;
        }

        .data-row:last-child {
            border-bottom: none;
            padding-bottom: 4px;
        }

        .data-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .data-value-group {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .data-value {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }

        .btn-inline-edit {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            border-radius: 6px;
            padding: 4px 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-inline-edit:hover {
            color: var(--text-main);
            background: var(--surface-subtle);
            border-color: var(--border-subtle);
        }

        .btn-inline-edit svg {
            width: 14px;
            height: 14px;
        }

        /* Bottom Sign Out */
        .bottom-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-top: 20px;
        }

        .btn-signout {
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid transparent;
            padding: 14px 36px;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            max-width: 280px;
            justify-content: center;
        }

        .btn-signout:hover {
            background-color: var(--danger);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(255, 59, 48, 0.3);
        }

        /* Modal & Bottom Sheet */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-sheet {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-lg);
            padding: 28px;
            position: relative;
            transform: scale(0.95);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-backdrop.active .modal-sheet {
            transform: scale(1);
        }

        .sheet-drag-pill {
            display: none;
            width: 36px;
            height: 5px;
            background-color: var(--border-focus);
            border-radius: 99px;
            margin: 0 auto 16px;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .modal-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .input-control {
            background-color: var(--surface-subtle);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-control:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
        }

        .modal-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 24px;
        }

        .btn-modal-cancel {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: inherit;
        }

        .btn-modal-save {
            background-color: var(--accent-primary);
            color: var(--accent-primary-text);
            border: none;
            padding: 10px 22px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: inherit;
            transition: opacity 0.2s ease;
        }

        @media (max-width: 640px) {
            .modal-backdrop {
                align-items: flex-end;
            }

            .modal-sheet {
                max-width: 100%;
                border-radius: 24px 24px 0 0;
                border-bottom: none;
                padding: 20px 24px 36px;
                transform: translateY(100%);
            }

            .modal-backdrop.active .modal-sheet {
                transform: translateY(0);
            }

            .sheet-drag-pill {
                display: block;
            }

            .profile-hero {
                gap: 20px;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="nav-brand">
        <img class="brand-logo" src="https://raw.githubusercontent.com/knox-app/cloud/d235b91b67a58037117f8f0c2d1391ffd209a463/logo/ca81fecf-2d54-4aea-8de0-f189a43e1002.png" alt="Logo">
        <span>Account</span>
    </div>
</header>

<main class="main-container">
    <!-- Hero Profile Section -->
    <section class="profile-hero">
        <div class="avatar-container">
            <span class="avatar-fallback" id="avatarInitial">U</span>
            <img id="avatarImage" class="avatar-img" alt="Profile Picture" referrerpolicy="no-referrer" style="display:none;">
        </div>
        <div class="profile-headings">
            <div class="name-row">
                <h1 id="fullName">Loading...</h1>
                
                <button class="btn-action-pill" id="editNameBtn" title="Edit your name">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    Edit
                </button>

                <button class="btn-action-pill" id="switchAccountBtn" title="Switch account">
                    <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    Switch Account
                </button>
            </div>
            <div class="profile-sub-row">
                <span class="profile-email-text" id="primaryEmail">...</span>
                <span class="account-badge badge-personal" id="accountBadge">
                    <span id="accountBadgeText">Personal Account</span>
                </span>
            </div>
        </div>
    </section>

    <!-- Personal Details Card -->
    <div class="details-card">
        <div class="card-header">
            <h2 class="card-title">Personal Details</h2>
            <p class="card-description">Your identity and account contact details</p>
        </div>
        <div class="data-list">
            <div class="data-row">
                <span class="data-label">First Name</span>
                <div class="data-value-group">
                    <span class="data-value" id="valFirstName">—</span>
                    <button class="btn-inline-edit" onclick="openEditModal('first')" title="Edit First Name">
                        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                </div>
            </div>

            <div class="data-row">
                <span class="data-label">Last Name</span>
                <div class="data-value-group">
                    <span class="data-value" id="valLastName">—</span>
                    <button class="btn-inline-edit" onclick="openEditModal('last')" title="Edit Last Name">
                        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                </div>
            </div>

            <div class="data-row">
                <span class="data-label">Email Address</span>
                <span class="data-value" id="valEmail">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Phone Number</span>
                <span class="data-value" id="valPhone">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Date of Birth</span>
                <span class="data-value" id="valDob">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Gender</span>
                <span class="data-value" id="valGender">—</span>
            </div>
            
            <div class="data-row">
                <span class="data-label">Account Type</span>
                <div class="data-value-group">
                    <span class="account-badge badge-personal" id="valTypeBadge">
                        <span id="valTypeBadgeText">Personal Account</span>
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- Sign Out placed at the bottom -->
    <div class="bottom-actions">
        <button class="btn-signout" id="logoutBtn">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
        </button>
    </div>
</main>

<!-- Edit Name Dialog -->
<div class="modal-backdrop" id="editModalBackdrop">
    <div class="modal-sheet" id="editModalSheet">
        <div class="sheet-drag-pill"></div>
        <h3 class="modal-title">Edit Name</h3>
        <p class="modal-subtitle">Update your personal display name across all devices.</p>

        <form id="editNameForm" onsubmit="handleSaveName(event)">
            <div class="input-group">
                <label for="inputFirstName">First Name</label>
                <input type="text" id="inputFirstName" class="input-control" required placeholder="Enter first name" autocomplete="given-name">
            </div>

            <div class="input-group">
                <label for="inputLastName">Last Name</label>
                <input type="text" id="inputLastName" class="input-control" placeholder="Enter last name" autocomplete="family-name">
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-modal-cancel" id="btnCancelEdit">Cancel</button>
                <button type="submit" class="btn-modal-save" id="btnSaveName">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
    const PROJECT_ID = "question-metabase";
    const COLLECTION_NAME = "UARM";

    // 1. Firebase Initialization
    if (!firebase.apps.length) {
        firebase.initializeApp({ projectId: PROJECT_ID });
    }
    const db = firebase.firestore();

    // 2. URL Parameters & Theme Logic (Original logic preserved)
    const urlParams = new URLSearchParams(window.location.search);
    const uParam = urlParams.has('u') ? urlParams.get('u') : urlParams.get('user');
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;

    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function applyTheme() {
        if (theme === "dark" || theme === "d") {
            document.body.classList.add("dark");
            return;
        }
        if (theme === "light" || theme === "l") {
            document.body.classList.remove("dark");
            return;
        }
        if (mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }
    applyTheme();
    mediaQuery.addEventListener("change", () => { if (!theme) applyTheme(); });

    // 3. Multi-Account URL Handling (Exact Original Logic)
    if (uParam !== null) {
        const index = parseInt(uParam, 10);
        let savedAccounts = [];
        try {
            savedAccounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
        } catch (e) {
            savedAccounts = [];
        }
        
        if (!isNaN(index) && index >= 0 && index < savedAccounts.length) {
            const targetLotus = savedAccounts[index].lotus;
            let activeUser = {};
            try {
                activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
            } catch (e) {
                activeUser = {};
            }
            
            if (activeUser["Lotus"] !== targetLotus) {
                let redirectUrl = `1.html?Lotus=${encodeURIComponent(targetLotus)}&continue=4.html`;
                if (theme) redirectUrl += `&theme=${encodeURIComponent(theme)}`;
                window.location.href = redirectUrl;
            }
        } else {
            const dest = theme ? `3.html?theme=${encodeURIComponent(theme)}` : '3.html';
            window.location.href = dest;
        }
    }

    // 4. Badge Config Function
    function getBadgeConfig(typeRaw) {
        const type = (typeRaw || "").trim().toLowerCase();

        if (type === 'kids') {
            return {
                className: 'badge-kids',
                label: 'Kids Account',
                icon: `<svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>`
            };
        }
        if (type === 'business' || type === 'bussniess') {
            return {
                className: 'badge-business',
                label: 'Business Account',
                icon: `<svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`
            };
        }
        return {
            className: 'badge-personal',
            label: 'Personal Account',
            icon: `<svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`
        };
    }

    // 5. Synchronous UI Render from LocalStorage (Zero Lag / Zero Flash)
    let currentUserData = {};

    function renderActiveUser() {
        const activeUserStr = localStorage.getItem('active_user');
        
        if (!activeUserStr) {
            const dest = theme ? `1.html?theme=${encodeURIComponent(theme)}` : '1.html';
            window.location.href = dest;
            return;
        }

        try {
            currentUserData = JSON.parse(activeUserStr);
            const user = currentUserData;

            const firstName = user["First Name"] || "";
            const lastName = user["Last Name"] || "";
            const fullName = `${firstName} ${lastName}`.trim() || "User";
            const email = user["Email"] || "—";
            const phone = user["Phone Number"] || "—";
            const dob = user["Date of Birth"] || "—";
            const gender = user["Gender"] || "—";
            const profilePicUrl = user["Profile_Picture"] || user["profilePicture"] || user["Profile Picture"] || user["photoURL"] || null;

            document.getElementById('fullName').innerText = fullName;
            document.getElementById('primaryEmail').innerText = email;
            document.getElementById('valFirstName').innerText = firstName || "—";
            document.getElementById('valLastName').innerText = lastName || "—";
            document.getElementById('valEmail').innerText = email;
            document.getElementById('valPhone').innerText = phone;
            document.getElementById('valDob').innerText = dob;
            document.getElementById('valGender').innerText = gender;

            // Badges
            const badgeConfig = getBadgeConfig(user["Type"]);
            const heroBadge = document.getElementById('accountBadge');
            heroBadge.className = `account-badge ${badgeConfig.className}`;
            heroBadge.innerHTML = `${badgeConfig.icon}<span>${badgeConfig.label}</span>`;

            const rowBadge = document.getElementById('valTypeBadge');
            rowBadge.className = `account-badge ${badgeConfig.className}`;
            rowBadge.innerHTML = `${badgeConfig.icon}<span>${badgeConfig.label}</span>`;

            // Profile Picture
            const avatarInitialElem = document.getElementById('avatarInitial');
            const initial = firstName ? firstName.charAt(0).toUpperCase() : (email ? email.charAt(0).toUpperCase() : 'U');
            avatarInitialElem.innerText = initial;

            const avatarImg = document.getElementById('avatarImage');
            if (profilePicUrl && profilePicUrl.trim() !== "") {
                avatarImg.src = profilePicUrl;
                avatarImg.style.display = "block";
                avatarInitialElem.style.display = "none";
                avatarImg.onerror = () => {
                    avatarImg.style.display = "none";
                    avatarInitialElem.style.display = "block";
                };
            } else {
                avatarImg.style.display = "none";
                avatarInitialElem.style.display = "block";
            }
        } catch (e) {
            console.error("Render parse error:", e);
        }
    }

    // 6. Direct Firestore Live Listener for Instant Cloud Sync
    function attachFirestoreLiveListener() {
        const activeUserStr = localStorage.getItem('active_user');
        if (!activeUserStr) return;

        try {
            const user = JSON.parse(activeUserStr);
            // Document ID from your Firestore database (e.g. 7I4d9vmIm9WiUAuNeQGByq6jT)
            const docId = user["UARM ID"] || user["docId"] || user["id"];

            if (docId) {
                db.collection(COLLECTION_NAME).doc(docId).onSnapshot((doc) => {
                    if (doc.exists) {
                        const freshData = doc.data();
                        const merged = { ...user, ...freshData, "UARM ID": docId };
                        localStorage.setItem('active_user', JSON.stringify(merged));
                        renderActiveUser();
                    }
                }, (err) => {
                    console.warn("Firestore listener note:", err);
                });
            }
        } catch (e) {}
    }

    // Immediate Boot
    renderActiveUser();
    attachFirestoreLiveListener();

    // Multi-tab sync & Window focus sync
    window.addEventListener('storage', (e) => {
        if (e.key === 'active_user') renderActiveUser();
    });
    window.addEventListener('focus', renderActiveUser);

    // 7. Modal & Bottom Sheet Controls
    const editModal = document.getElementById('editModalBackdrop');
    const inputFirstName = document.getElementById('inputFirstName');
    const inputLastName = document.getElementById('inputLastName');
    const btnSaveName = document.getElementById('btnSaveName');

    function openEditModal(targetField = 'first') {
        inputFirstName.value = currentUserData["First Name"] || "";
        inputLastName.value = currentUserData["Last Name"] || "";
        editModal.classList.add('active');
        
        setTimeout(() => {
            if (targetField === 'last') {
                inputLastName.focus();
            } else {
                inputFirstName.focus();
            }
        }, 150);
    }

    function closeEditModal() {
        editModal.classList.remove('active');
    }

    document.getElementById('editNameBtn').onclick = () => openEditModal('first');
    document.getElementById('btnCancelEdit').onclick = closeEditModal;

    editModal.addEventListener('click', (e) => {
        if (e.target === editModal) closeEditModal();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === "Escape" && editModal.classList.contains('active')) {
            closeEditModal();
        }
    });

    // 8. Save Name Directly to Database and Local Storage
    async function handleSaveName(e) {
        e.preventDefault();
        const newFirst = inputFirstName.value.trim();
        const newLast = inputLastName.value.trim();

        if (!newFirst) return;

        btnSaveName.disabled = true;
        btnSaveName.innerText = "Saving...";

        const docId = currentUserData["UARM ID"] || currentUserData["docId"] || currentUserData["id"];

        // 1. Direct Cloud Database Update
        if (docId) {
            try {
                await db.collection(COLLECTION_NAME).doc(docId).set({
                    "First Name": newFirst,
                    "Last Name": newLast
                }, { merge: true });
            } catch (err) {
                // Fallback to REST patch if SDK lacks write rules
                try {
                    const patchUrl = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/${COLLECTION_NAME}/${encodeURIComponent(docId)}?updateMask.fieldPaths=First%20Name&updateMask.fieldPaths=Last%20Name`;
                    await fetch(patchUrl, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            fields: {
                                "First Name": { stringValue: newFirst },
                                "Last Name": { stringValue: newLast }
                            }
                        })
                    });
                } catch (patchErr) {}
            }
        }

        // 2. Immediate Local Storage Update
        currentUserData["First Name"] = newFirst;
        currentUserData["Last Name"] = newLast;
        localStorage.setItem('active_user', JSON.stringify(currentUserData));

        // Update saved_accounts list
        try {
            let savedAccounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
            const accIndex = savedAccounts.findIndex(acc => acc.email === currentUserData["Email"] || acc.lotus === currentUserData["Lotus"]);
            if (accIndex !== -1) {
                savedAccounts[accIndex].name = `${newFirst} ${newLast}`.trim();
                localStorage.setItem('saved_accounts', JSON.stringify(savedAccounts));
            }
        } catch (err) {}

        renderActiveUser();
        closeEditModal();

        btnSaveName.disabled = false;
        btnSaveName.innerText = "Save";
    }

    // 9. Navigation Actions (Exact Original Handlers)
    function goToSwitch() {
        const dest = theme ? `3.html?theme=${encodeURIComponent(theme)}` : '3.html';
        window.location.href = dest;
    }

    document.getElementById('switchAccountBtn').onclick = goToSwitch;

    // Explicit Sign Out (The only action that terminates the session)
    document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('active_user');
        goToSwitch();
    };
</script>
</body>
