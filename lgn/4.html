<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings & Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #f8f9fa;
            --surface-card: #ffffff;
            --surface-subtle: #f3f4f6;
            --surface-hover: #e5e7eb;
            --border-subtle: rgba(0, 0, 0, 0.07);
            --border-focus: rgba(0, 0, 0, 0.15);
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --accent-primary: #000000;
            --accent-primary-text: #ffffff;
            --accent-badge-bg: rgba(0, 0, 0, 0.05);
            --accent-badge-text: #1e293b;
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.08);
            --danger-hover: #dc2626;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 16px -2px rgba(0,0,0,0.06), 0 2px 6px -1px rgba(0,0,0,0.04);
            --blur-nav: blur(20px);
            --radius-lg: 20px;
            --radius-md: 12px;
            --shimmer-bg: linear-gradient(90deg, #f0f0f0 0%, #e0e0e0 50%, #f0f0f0 100%);
        }

        body.dark {
            --bg-page: #090a0f;
            --surface-card: #12141a;
            --surface-subtle: #1a1d26;
            --surface-hover: #222634;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.2);
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #ffffff;
            --accent-primary-text: #090a0f;
            --accent-badge-bg: rgba(255, 255, 255, 0.08);
            --accent-badge-text: #f1f5f9;
            --danger: #f87171;
            --danger-bg: rgba(248, 113, 113, 0.1);
            --danger-hover: #ef4444;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.5);
            --shimmer-bg: linear-gradient(90deg, #161922 0%, #252a3a 50%, #161922 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Minimal Header */
        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(var(--bg-page), 0.75);
            backdrop-filter: var(--blur-nav);
            -webkit-backdrop-filter: var(--blur-nav);
            border-bottom: 1px solid var(--border-subtle);
            padding: 1.1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.3px;
        }

        .nav-brand svg {
            width: 22px;
            height: 22px;
            fill: var(--text-main);
        }

        /* Full Page Main Container */
        .main-container {
            max-width: 840px;
            width: 100%;
            margin: 0 auto;
            padding: 48px 24px 80px;
            flex: 1;
        }

        /* Hero Profile Identity */
        .profile-hero {
            display: flex;
            align-items: center;
            padding-bottom: 36px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 36px;
            gap: 24px;
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid var(--border-focus);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            background: var(--surface-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .avatar-img.loaded {
            opacity: 1;
        }

        .avatar-fallback {
            position: absolute;
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .profile-headings h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }

        .profile-meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .profile-email-sub {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 400;
        }

        .account-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--accent-badge-bg);
            color: var(--accent-badge-text);
            border: 1px solid var(--border-subtle);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Clean Profile Details Card */
        .details-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 32px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .details-card:hover {
            border-color: var(--border-focus);
            box-shadow: var(--shadow-md);
        }

        .card-header {
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .card-description {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .data-list {
            display: flex;
            flex-direction: column;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.95rem;
        }

        .data-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .data-row:first-child {
            padding-top: 0;
        }

        .data-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .data-value {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }

        /* Bottom Actions Area */
        .bottom-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 14px;
            padding-top: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 26px;
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid transparent;
            text-decoration: none;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background-color: var(--surface-subtle);
            color: var(--text-main);
            border-color: var(--border-subtle);
        }

        .btn-secondary:hover {
            background-color: var(--surface-hover);
        }

        .btn-danger {
            background-color: var(--danger-bg);
            color: var(--danger);
            border-color: transparent;
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: #ffffff;
        }

        /* Skeleton Shimmer */
        .skeleton {
            background-size: 200% 100%;
            background-image: var(--shimmer-bg);
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            display: inline-block;
        }

        .skeleton-text {
            height: 16px;
            width: 140px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 640px) {
            .profile-hero {
                flex-direction: column;
                align-items: flex-start;
            }
            .bottom-actions {
                flex-direction: column-reverse;
                width: 100%;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<header>
    <div class="nav-brand">
        <svg viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
        </svg>
        <span>Account Central</span>
    </div>
</header>

<main class="main-container">
    <!-- Hero Profile Section -->
    <section class="profile-hero">
        <div class="avatar-container">
            <span class="avatar-fallback" id="avatarInitial"></span>
            <img id="avatarImage" class="avatar-img" alt="Profile Picture" loading="lazy">
        </div>
        <div class="profile-headings">
            <h1 id="fullName"><span class="skeleton skeleton-text" style="width: 220px; height: 32px;"></span></h1>
            <div class="profile-meta-row">
                <span class="profile-email-sub" id="primaryEmail"><span class="skeleton skeleton-text"></span></span>
                <span class="account-badge" id="accountBadge">Personal</span>
            </div>
        </div>
    </section>

    <!-- Personal Details Card -->
    <div class="details-card">
        <div class="card-header">
            <h2 class="card-title">Personal Information</h2>
            <p class="card-description">Your identity and contact credentials</p>
        </div>
        <div class="data-list">
            <div class="data-row">
                <span class="data-label">First Name</span>
                <span class="data-value" id="valFirstName">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Last Name</span>
                <span class="data-value" id="valLastName">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Email Address</span>
                <span class="data-value" id="valEmail">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Phone Number</span>
                <span class="data-value" id="valPhone">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Date of Birth</span>
                <span class="data-value" id="valDob">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Gender</span>
                <span class="data-value" id="valGender">—</span>
            </div>
        </div>
    </div>

    <!-- Bottom Actions: Switch Account & Sign Out -->
    <div class="bottom-actions">
        <button class="btn btn-secondary" id="bottomSwitchBtn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Switch Account
        </button>
        <button class="btn btn-danger" id="bottomLogoutBtn">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
        </button>
    </div>
</main>

<script>
    // 1. Theme Configuration
    const urlParams = new URLSearchParams(window.location.search);
    const uParam = urlParams.has('u') ? urlParams.get('u') : urlParams.get('user');
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;

    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function applyTheme() {
        if (theme === "dark" || theme === "d") {
            document.body.classList.add("dark");
            return;
        }
        if (theme === "light" || theme === "l") {
            document.body.classList.remove("dark");
            return;
        }
        if (mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }

    applyTheme();
    mediaQuery.addEventListener("change", () => {
        if (!theme) applyTheme();
    });

    // 2. Multi-Account URL Handling
    if (uParam !== null) {
        const index = parseInt(uParam, 10);
        let savedAccounts = [];
        try {
            savedAccounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
        } catch (e) {
            savedAccounts = [];
        }

        if (!isNaN(index) && index >= 0 && index < savedAccounts.length) {
            const targetLotus = savedAccounts[index].lotus;
            let activeUser = {};
            try {
                activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
            } catch (e) {
                activeUser = {};
            }

            if (activeUser["Lotus"] !== targetLotus) {
                let redirectUrl = `1.html?Lotus=${encodeURIComponent(targetLotus)}&continue=4.html`;
                if (theme) redirectUrl += `&theme=${encodeURIComponent(theme)}`;
                window.location.href = redirectUrl;
            }
        } else {
            const dest = theme ? `3.html?theme=${encodeURIComponent(theme)}` : '3.html';
            window.location.href = dest;
        }
    }

    // 3. Populate User Data with Lazy DP Loading
    const activeUserStr = localStorage.getItem('active_user');

    if (!activeUserStr) {
        const dest = theme ? `1.html?theme=${encodeURIComponent(theme)}` : '1.html';
        window.location.href = dest;
    } else {
        try {
            const user = JSON.parse(activeUserStr);

            const firstName = user["First Name"] || "";
            const lastName = user["Last Name"] || "";
            const fullName = `${firstName} ${lastName}`.trim() || "User";
            const email = user["Email"] || "—";
            const phone = user["Phone Number"] || "—";
            const dob = user["Date of Birth"] || "—";
            const gender = user["Gender"] || "—";
            const type = (user["Type"] || "personal").toLowerCase();
            const profilePicUrl = user["Profile_Picture"] || null;

            // Update UI elements
            document.getElementById('fullName').innerText = fullName;
            document.getElementById('primaryEmail').innerText = email;
            document.getElementById('valFirstName').innerText = firstName || "—";
            document.getElementById('valLastName').innerText = lastName || "—";
            document.getElementById('valEmail').innerText = email;
            document.getElementById('valPhone').innerText = phone;
            document.getElementById('valDob').innerText = dob;
            document.getElementById('valGender').innerText = gender;

            // Account Type Badge
            const typeLabels = {
                'business': 'Business Account',
                'kids': 'Kids Account',
                'personal': 'Personal Account'
            };
            document.getElementById('accountBadge').innerText = typeLabels[type] || 'Personal Account';

            // Fallback Avatar Initials
            const initial = firstName ? firstName.charAt(0).toUpperCase() : (email && email !== "—" ? email.charAt(0).toUpperCase() : 'U');
            const avatarInitialElem = document.getElementById('avatarInitial');
            avatarInitialElem.innerText = initial;

            // Lazy Profile Picture Handler
            if (profilePicUrl) {
                const avatarImg = document.getElementById('avatarImage');
                avatarImg.src = profilePicUrl;
                avatarImg.onload = () => {
                    avatarImg.classList.add('loaded');
                    avatarInitialElem.style.display = 'none';
                };
                avatarImg.onerror = () => {
                    avatarImg.style.display = 'none';
                    avatarInitialElem.style.display = 'block';
                };
            }
        } catch (e) {
            console.error("Failed to render user data:", e);
            const dest = theme ? `1.html?theme=${encodeURIComponent(theme)}` : '1.html';
            window.location.href = dest;
        }
    }

    // 4. Action Handlers (Switch Account & Sign Out)
    function goToSwitch() {
        const dest = theme ? `3.html?theme=${encodeURIComponent(theme)}` : '3.html';
        window.location.href = dest;
    }

    document.getElementById('bottomSwitchBtn').onclick = goToSwitch;

    document.getElementById('bottomLogoutBtn').onclick = () => {
        localStorage.removeItem('active_user');
        goToSwitch();
    };
</script>
</body>
</html>
