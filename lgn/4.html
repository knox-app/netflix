    <style>
        :root {
            --bg-page: #fbfbfd;
            --surface-card: #ffffff;
            --surface-subtle: #f5f5f7;
            --surface-hover: #ebebee;
            --border-subtle: rgba(0, 0, 0, 0.08);
            --border-focus: rgba(0, 0, 0, 0.2);
            --text-main: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-muted: #86868b;
            --accent-primary: #0071e3;
            --accent-primary-text: #ffffff;
            --accent-badge-bg: rgba(0, 0, 0, 0.05);
            --accent-badge-text: #1d1d1f;
            --danger: #ff3b30;
            --danger-bg: rgba(255, 59, 48, 0.08);
            --danger-hover: #e02d23;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 12px 36px rgba(0,0,0,0.1);
            --blur-nav: blur(20px);
            --radius-lg: 22px;
            --radius-md: 14px;
            --radius-full: 9999px;
            --shimmer-bg: linear-gradient(90deg, #f0f0f2 0%, #e4e4e7 50%, #f0f0f2 100%);
            --modal-overlay: rgba(0, 0, 0, 0.4);
        }

        body.dark {
            --bg-page: #000000;
            --surface-card: #121214;
            --surface-subtle: #1c1c1e;
            --surface-hover: #2c2c2e;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-focus: rgba(255, 255, 255, 0.3);
            --text-main: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-muted: #6e6e73;
            --accent-primary: #2997ff;
            --accent-primary-text: #ffffff;
            --accent-badge-bg: rgba(255, 255, 255, 0.08);
            --accent-badge-text: #f5f5f7;
            --danger: #ff453a;
            --danger-bg: rgba(255, 69, 58, 0.12);
            --danger-hover: #ff3b30;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
            --shadow-md: 0 16px 50px rgba(0,0,0,0.7);
            --shimmer-bg: linear-gradient(90deg, #1c1c1e 0%, #2c2c2e 50%, #1c1c1e 100%);
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Top Bar */
        header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(var(--bg-page), 0.8);
            backdrop-filter: var(--blur-nav);
            -webkit-backdrop-filter: var(--blur-nav);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }
