<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page: #fbfbfd;
            --surface-card: #ffffff;
            --surface-subtle: #f5f5f7;
            --surface-hover: #e8e8ed;
            --border-subtle: rgba(0, 0, 0, 0.08);
            --border-focus: rgba(0, 0, 0, 0.16);
            --text-main: #1d1d1f;
            --text-secondary: #86868b;
            --badge-bg: rgba(0, 0, 0, 0.05);
            --badge-text: #1d1d1f;
            --danger: #ff3b30;
            --danger-bg: rgba(255, 59, 48, 0.08);
            --danger-hover-bg: rgba(255, 59, 48, 0.15);
            --shadow: 0 4px 24px -2px rgba(0, 0, 0, 0.04);
            --radius-lg: 22px;
            --radius-md: 12px;
            --shimmer-bg: linear-gradient(90deg, #f0f0f2 0%, #e4e4e7 50%, #f0f0f2 100%);
        }

        body.dark {
            --bg-page: #000000;
            --surface-card: #121212;
            --surface-subtle: #1c1c1e;
            --surface-hover: #2c2c2e;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-focus: rgba(255, 255, 255, 0.22);
            --text-main: #f5f5f7;
            --text-secondary: #86868b;
            --badge-bg: rgba(255, 255, 255, 0.1);
            --badge-text: #f5f5f7;
            --danger: #ff453a;
            --danger-bg: rgba(255, 69, 58, 0.12);
            --danger-hover-bg: rgba(255, 69, 58, 0.2);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --shimmer-bg: linear-gradient(90deg, #18181a 0%, #28282b 50%, #18181a 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 24px 80px;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .page-wrapper {
            width: 100%;
            max-width: 740px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        /* Profile Header Section */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .avatar-wrap {
            position: relative;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: var(--surface-subtle);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .avatar-img.loaded {
            opacity: 1;
        }

        .avatar-initial {
            position: absolute;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .profile-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .name-row h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .email-text {
            font-size: 0.95rem;
            color: var(--text-secondary);
        }

        .account-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--badge-bg);
            color: var(--badge-text);
            letter-spacing: 0.2px;
            text-transform: capitalize;
        }

        /* Switch Account Button in Name Area */
        .btn-switch {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 0.82rem;
            font-weight: 600;
            background-color: var(--surface-subtle);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn-switch:hover {
            background-color: var(--surface-hover);
            border-color: var(--border-focus);
        }

        .btn-switch svg {
            width: 14px;
            height: 14px;
        }

        /* Personal Information Card */
        .info-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            box-shadow: var(--shadow);
        }

        .card-header {
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.015em;
        }

        .data-list {
            display: flex;
            flex-direction: column;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.92rem;
        }

        .data-row:last-child {
            border-bottom: none;
            padding-bottom: 4px;
        }

        .data-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .data-value {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }

        /* Sign Out Bottom Button */
        .footer-action {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .btn-logout {
            width: 100%;
            padding: 14px 24px;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            border: none;
            background-color: var(--danger-bg);
            color: var(--danger);
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-logout:hover {
            background-color: var(--danger-hover-bg);
        }

        .btn-logout:active {
            transform: scale(0.99);
        }

        /* Skeleton Shimmer */
        .skeleton {
            background-size: 200% 100%;
            background-image: var(--shimmer-bg);
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            display: inline-block;
        }

        .skeleton-text {
            height: 18px;
            width: 160px;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <!-- Header: Profile & Switch Account Button -->
    <section class="profile-header">
        <div class="avatar-wrap">
            <span class="avatar-initial" id="avatarInitial"></span>
            <img id="avatarImage" class="avatar-img" alt="Profile Picture" loading="lazy">
        </div>

        <div class="profile-info">
            <div class="name-row">
                <h1 id="fullName"><span class="skeleton skeleton-text" style="width: 180px; height: 26px;"></span></h1>
                <button class="btn-switch" id="switchBtn" title="Switch Account">
                    <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    Switch Account
                </button>
            </div>

            <div class="meta-row">
                <span class="email-text" id="primaryEmail"><span class="skeleton skeleton-text" style="width: 130px;"></span></span>
                <span class="account-badge" id="accountBadge">Personal</span>
            </div>
        </div>
    </section>

    <!-- Personal Details Section -->
    <div class="info-card">
        <div class="card-header">
            <h2 class="card-title">Personal Information</h2>
        </div>
        <div class="data-list">
            <div class="data-row">
                <span class="data-label">First Name</span>
                <span class="data-value" id="valFirstName">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Last Name</span>
                <span class="data-value" id="valLastName">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Email</span>
                <span class="data-value" id="valEmail">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Phone Number</span>
                <span class="data-value" id="valPhone">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Date of Birth</span>
                <span class="data-value" id="valDob">—</span>
            </div>
            <div class="data-row">
                <span class="data-label">Gender</span>
                <span class="data-value" id="valGender">—</span>
            </div>
        </div>
    </div>

    <!-- Sign Out placed cleanly at the bottom -->
    <div class="footer-action">
        <button class="btn-logout" id="logoutBtn">Sign out</button>
    </div>
</div>

<script>
    // 1. URL & Theme Handling
    const urlParams = new URLSearchParams(window.location.search);
    const uParam = urlParams.has('u') ? urlParams.get('u') : urlParams.get('user');
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;

    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function applyTheme() {
        if (theme === "dark" || theme === "d") {
            document.body.classList.add("dark");
            return;
        }
        if (theme === "light" || theme === "l") {
            document.body.classList.remove("dark");
            return;
        }
        if (mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }

    applyTheme();
    mediaQuery.addEventListener("change", () => {
        if (!theme) applyTheme();
    });

    // 2. Multi-Account URL Handling
    if (uParam !== null) {
        const index = parseInt(uParam, 10);
        let savedAccounts = [];
        try {
            savedAccounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
        } catch (e) {
            savedAccounts = [];
        }

        if (!isNaN(index) && index >= 0 && index < savedAccounts.length) {
            const targetLotus = savedAccounts[index].lotus;
            let activeUser = {};
            try {
                activeUser = JSON.parse(localStorage.getItem('active_user') || '{}');
            } catch (e) {
                activeUser = {};
            }

            if (activeUser["Lotus"] !== targetLotus) {
                let redirectUrl = `1.html?Lotus=${encodeURIComponent(targetLotus)}&continue=4.html`;
                if (theme) redirectUrl += `&theme=${encodeURIComponent(theme)}`;
                window.location.href = redirectUrl;
            }
        } else {
            const dest = theme ? `3.html?theme=${encodeURIComponent(theme)}` : '3.html';
            window.location.href = dest;
        }
    }

    // 3. User Data Population & Lazy Avatar Loading
    const activeUserStr = localStorage.getItem('active_user');

    if (!activeUserStr) {
        const dest = theme ? `1.html?theme=${encodeURIComponent(theme)}` : '1.html';
        window.location.href = dest;
    } else {
        try {
            const user = JSON.parse(activeUserStr);

            const firstName = user["First Name"] || "";
            const lastName = user["Last Name"] || "";
            const fullName = `${firstName} ${lastName}`.trim() || "User";
            const email = user["Email"] || "—";
            const phone = user["Phone Number"] || "—";
            const dob = user["Date of Birth"] || "—";
            const gender = user["Gender"] || "—";
            const type = (user["Type"] || "personal").toLowerCase();
            const profilePicUrl = user["Profile_Picture"] || null;

            // Render text values
            document.getElementById('fullName').innerText = fullName;
            document.getElementById('primaryEmail').innerText = email;
            document.getElementById('valFirstName').innerText = firstName || "—";
            document.getElementById('valLastName').innerText = lastName || "—";
            document.getElementById('valEmail').innerText = email;
            document.getElementById('valPhone').innerText = phone;
            document.getElementById('valDob').innerText = dob;
            document.getElementById('valGender').innerText = gender;

            // Account Type Badge
            const typeMap = {
                'business': 'Business Account',
                'kids': 'Kids Account',
                'personal': 'Personal Account'
            };
            document.getElementById('accountBadge').innerText = typeMap[type] || 'Personal Account';

            // Profile Picture & Initial Fallback
            const initial = firstName ? firstName.charAt(0).toUpperCase() : (email ? email.charAt(0).toUpperCase() : 'U');
            const avatarInitialElem = document.getElementById('avatarInitial');
            avatarInitialElem.innerText = initial;

            if (profilePicUrl) {
                const avatarImg = document.getElementById('avatarImage');
                avatarImg.src = profilePicUrl;
                avatarImg.onload = () => {
                    avatarImg.classList.add('loaded');
                    avatarInitialElem.style.display = 'none';
                };
                avatarImg.onerror = () => {
                    avatarImg.style.display = 'none';
                    avatarInitialElem.style.display = 'block';
                };
            }
        } catch (e) {
            console.error("Failed to parse user data:", e);
            const dest = theme ? `1.html?theme=${encodeURIComponent(theme)}` : '1.html';
            window.location.href = dest;
        }
    }

    // 4. Action Handlers
    function goToSwitch() {
        const dest = theme ? `3.html?theme=${encodeURIComponent(theme)}` : '3.html';
        window.location.href = dest;
    }

    document.getElementById('switchBtn').onclick = goToSwitch;

    document.getElementById('logoutBtn').onclick = () => {
        localStorage.removeItem('active_user');
        goToSwitch();
    };
</script>
</body>
</html>
