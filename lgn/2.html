<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #555555;
            --input-border: #dddddd;
            --input-focus: #000000;
            --input-bg: #ffffff;
            --btn-bg: #111111;
            --btn-text: #ffffff;
            --btn-hover: #333333;
            --badge-bg: #f0f0f0;
            --badge-text: #333333;
            --avatar-border: #eeeeee;
        }

        body.dark {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --input-border: #3a3a3a;
            --input-focus: #ffffff;
            --input-bg: #000000;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: #e0e0e0;
            --badge-bg: #222222;
            --badge-text: #dddddd;
            --avatar-border: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
            padding: 20px; 
        }

        .profile-wrapper {
            margin-bottom: 15px;
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--avatar-border);
            display: none; /* hidden until loaded */
            margin: 0 auto;
        }
        
        h1 { 
            font-size: 26px; 
            font-weight: 600; 
            margin-top: 0;
            margin-bottom: 8px; 
            color: var(--text-primary); 
        }
        
        .user-badge {
            display: inline-block;
            background: var(--badge-bg);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: var(--badge-text);
            margin-bottom: 24px;
            font-weight: 500;
        }

        .input-group { 
            position: relative; 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        .input-group label {
            position: absolute;
            top: -10px;
            left: 15px;
            background: var(--bg-color);
            padding: 0 5px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        input[type="password"] {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-primary);
        }

        input[type="password"]:focus { 
            border-color: var(--input-focus); 
        }

        .btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .btn:hover { 
            background: var(--btn-hover); 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-wrapper">
        <img id="userAvatar" class="profile-img" alt="Profile Picture" />
    </div>

    <h1>Welcome</h1>
    <div class="user-badge" id="userEmailDisplay">Loading...</div>

    <form id="loginForm" onsubmit="return false;">
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" autofocus />
        </div>

        <button type="submit" class="btn" id="loginBtn">Login</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, updateDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        projectId: "question-metabase"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const session = urlParams.get('session');
    const lotus = urlParams.get('lotus') || urlParams.get('Lotus');
    const continueUrl = urlParams.get('continue') || '4.html';
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;
    
    let currentUserDocId = null;
    let currentUserData = null;

    if (theme === "dark" || theme === "d" || window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.body.classList.add("dark");
    }

    async function fetchUser() {
        try {
            if (!lotus) return window.location.href = '1.html';
            const q = query(collection(db, "UARM"), where("Lotus", "==", lotus));
            const querySnapshot = await getDocs(q);
            
            if (!querySnapshot.empty) {
                currentUserDocId = querySnapshot.docs[0].id;
                currentUserData = querySnapshot.docs[0].data();
                
                // Display Email
                document.getElementById('userEmailDisplay').innerText = currentUserData["Email"] || currentUserData["Guardian Email"] || "User";

                // Display Profile Picture if available
                const profilePicUrl = currentUserData["Profile_Picture"] || currentUserData["Profile Picture"];
                if (profilePicUrl) {
                    const avatarImg = document.getElementById('userAvatar');
                    avatarImg.src = profilePicUrl;
                    avatarImg.style.display = 'block';
                }

                document.getElementById('password').focus();
            } else {
                alert("Security token invalid.");
                window.location.href = '1.html';
            }
        } catch (error) {
            console.error("Fetch user error:", error);
            alert("Database connection error.");
            window.location.href = '1.html';
        }
    }
    fetchUser();

    function generateNewLotus() {
        return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    async function handleLogin() {
        const pass = document.getElementById('password').value;
        if (!pass || !currentUserData) return;

        const loginBtn = document.getElementById('loginBtn');
        loginBtn.innerText = "Verifying...";
        loginBtn.disabled = true;

        try {
            if (currentUserData["Password"] === pass) {
                // 1. Refresh user Lotus
                const newLotus = generateNewLotus();
                await updateDoc(doc(db, "UARM", currentUserDocId), { "Lotus": newLotus });
                currentUserData["Lotus"] = newLotus;

                // 2. Notify QR Device via ASPX Keys
                if (session) {
                    try {
                        await setDoc(doc(db, "ASPX Keys", session), {
                            status: "authenticated",
                            userData: {
                                "Email": currentUserData["Email"] || "",
                                "First Name": currentUserData["First Name"] || "",
                                "Lotus": newLotus
                            },
                            authenticatedAt: new Date().toISOString()
                        });
                        console.log("QR session document successfully updated:", session);
                    } catch (err) {
                        console.error("Failed to notify QR device:", err);
                    }
                }

                // 3. Save locally on this phone/device
                let accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
                accounts = accounts.filter(acc => acc.email !== currentUserData["Email"]);
                accounts.push({
                    email: currentUserData["Email"],
                    firstName: currentUserData["First Name"] || "",
                    lotus: newLotus
                });
                localStorage.setItem('saved_accounts', JSON.stringify(accounts));
                localStorage.setItem('active_user', JSON.stringify(currentUserData));

                // 4. Redirect current device
                window.location.href = continueUrl;
            } else {
                alert("Incorrect password");
                loginBtn.innerText = "Login";
                loginBtn.disabled = false;
            }
        } catch (error) {
            console.error("Login verification failed:", error);
            alert("Error verifying password. Please try again.");
            loginBtn.innerText = "Login";
            loginBtn.disabled = false;
        }
    }

    // Handles Enter key via form submission
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        handleLogin();
    });

    document.getElementById('loginBtn').addEventListener('click', handleLogin);
</script>
</body>
</html>
