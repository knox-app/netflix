<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fff; }
        .container { text-align: center; max-width: 400px; width: 90%; padding: 20px; }
        h1 { font-size: 28px; font-weight: 600; margin-bottom: 5px; color: #000; }
        .user-badge { display: inline-block; background: #f0f0f0; padding: 5px 15px; border-radius: 20px; font-size: 14px; color: #333; margin-bottom: 20px; font-weight: 500; }
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group label { position: absolute; top: -10px; left: 15px; background: #fff; padding: 0 5px; font-size: 12px; color: #888; }
        input[type="password"] { width: 100%; padding: 16px; font-size: 16px; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; outline: none; }
        input[type="password"]:focus { border-color: #000; }
        .btn { background: #111; color: #fff; border: none; padding: 16px; width: 100%; border-radius: 30px; font-size: 16px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome</h1>
    <div class="user-badge" id="userEmailDisplay">Loading...</div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="">
    </div>

    <button class="btn" id="loginBtn">Login</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, updateDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        projectId: "question-metabase"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const session = urlParams.get('session');
    const lotus = urlParams.get('lotus');
    const continueUrl = urlParams.get('continue') || '4.html';
    
    let currentUserDocId = null;
    let currentUserData = null;

    // Fetch user details by Lotus
    async function fetchUser() {
        if(!lotus) return window.location.href = '1.html';
        const q = query(collection(db, "UARM"), where("lotus", "==", lotus));
        const querySnapshot = await getDocs(q);
        
        if (!querySnapshot.empty) {
            currentUserDocId = querySnapshot.docs[0].id;
            currentUserData = querySnapshot.docs[0].data();
            document.getElementById('userEmailDisplay').innerText = currentUserData.email;
        } else {
            alert("Security token invalid.");
            window.location.href = '1.html';
        }
    }
    fetchUser();

    // Generate random alphanumeric string for new Lotus
    function generateNewLotus() {
        return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const pass = document.getElementById('password').value;
        if (!pass) return;

        document.getElementById('loginBtn').innerText = "Verifying...";

        if (currentUserData.password === pass) {
            // 1. Update Lotus in DB for security
            const newLotus = generateNewLotus();
            await updateDoc(doc(db, "UARM", currentUserDocId), { lotus: newLotus });
            currentUserData.lotus = newLotus; // update local object

            // 2. Delete Session from ASPX Keys
            const sessionQ = query(collection(db, "ASPX Keys"), where("sessionId", "==", session));
            const sessionSnap = await getDocs(sessionQ);
            sessionSnap.forEach(async (d) => {
                await deleteDoc(doc(db, "ASPX Keys", d.id));
            });

            // 3. Save to Multi-Account System
            let accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
            // Remove if already exists to update data
            accounts = accounts.filter(acc => acc.email !== currentUserData.email);
            accounts.push({ email: currentUserData.email, firstName: currentUserData.firstName, lotus: newLotus });
            
            localStorage.setItem('saved_accounts', JSON.stringify(accounts));
            localStorage.setItem('active_user', JSON.stringify(currentUserData));

            // 4. Redirect
            window.location.href = continueUrl;
        } else {
            alert("Incorrect password");
            document.getElementById('loginBtn').innerText = "Login";
        }
    });
</script>
</body>
</html>
