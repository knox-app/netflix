<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #1f1f1f;
            --text-secondary: #5f6368;
            --input-border: #dadce0;
            --input-focus: #1a73e8;
            --input-bg: #ffffff;
            --btn-bg: #1a73e8;
            --btn-text: #ffffff;
            --btn-hover: #1557b0;
            --badge-border: #dadce0;
            --badge-bg: #ffffff;
            --badge-text: #3c4043;
        }

        body.dark {
            --bg-color: #121212;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --input-border: #5f6368;
            --input-focus: #8ab4f8;
            --input-bg: #121212;
            --btn-bg: #8ab4f8;
            --btn-text: #202124;
            --btn-hover: #aecbfa;
            --badge-border: #5f6368;
            --badge-bg: #202124;
            --badge-text: #e8eaed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { 
            text-align: center; 
            max-width: 380px; 
            width: 90%; 
            padding: 20px; 
        }

        h1 { 
            font-size: 26px; 
            font-weight: 500; 
            margin-bottom: 16px; 
            color: var(--text-primary); 
        }
        
        /* Google-style User Badge */
        .user-badge {
            display: inline-flex;
            align-items: center;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            padding: 4px 14px 4px 4px;
            border-radius: 24px;
            font-size: 14px;
            color: var(--badge-text);
            margin-bottom: 28px;
            font-weight: 500;
            max-width: 100%;
            box-sizing: border-box;
        }

        .user-badge img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 8px;
            background-color: #ddd;
        }

        .user-badge span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .input-group { 
            position: relative; 
            margin-bottom: 24px; 
            text-align: left; 
        }

        .input-group label {
            position: absolute;
            top: -9px;
            left: 12px;
            background: var(--bg-color);
            padding: 0 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-primary);
            transition: border-color 0.2s ease;
        }

        input[type="password"]:focus { 
            border-color: var(--input-focus);
            border-width: 2px;
            padding: 13px 15px; /* offset 1px border shift */
        }

        .btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px 24px;
            width: 100%;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover { 
            background: var(--btn-hover); 
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome</h1>
    
    <!-- Google Style User Badge with Picture and Email -->
    <div class="user-badge" id="userBadge" style="visibility: hidden;">
        <img id="userProfilePic" src="" alt="Avatar" />
        <span id="userEmailDisplay">Loading...</span>
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" autofocus />
    </div>

    <button class="btn" id="loginBtn">Next</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, updateDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        projectId: "question-metabase"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const session = urlParams.get('session');
    const lotus = urlParams.get('lotus') || urlParams.get('Lotus');
    const continueUrl = urlParams.get('continue') || '4.html';
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;
    
    let currentUserDocId = null;
    let currentUserData = null;

    if (theme === "dark" || theme === "d" || window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.body.classList.add("dark");
    }

    async function fetchUser() {
        try {
            if (!lotus) return window.location.href = '1.html';
            const q = query(collection(db, "UARM"), where("Lotus", "==", lotus));
            const querySnapshot = await getDocs(q);
            
            if (!querySnapshot.empty) {
                currentUserDocId = querySnapshot.docs[0].id;
                currentUserData = querySnapshot.docs[0].data();

                // Display Email
                document.getElementById('userEmailDisplay').innerText = currentUserData["Email"] || currentUserData["Guardian Email"] || "User";

                // Display Profile Picture (or fallback avatar)
                const profilePicUrl = currentUserData["Profile_Picture"] || "https://lh3.googleusercontent.com/a/default-user";
                document.getElementById('userProfilePic').src = profilePicUrl;
                document.getElementById('userBadge').style.visibility = 'inline-flex';
                
                // Focus password input for instant typing
                document.getElementById('password').focus();
            } else {
                alert("Security token invalid.");
                window.location.href = '1.html';
            }
        } catch (error) {
            console.error("Fetch user error:", error);
            alert("Database connection error.");
            window.location.href = '1.html';
        }
    }
    fetchUser();

    function generateNewLotus() {
        return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    // Trigger on Enter Key Press
    document.getElementById('password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('loginBtn').click();
        }
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const pass = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        if (!pass) return;

        btn.innerText = "Verifying...";
        btn.disabled = true;

        try {
            if (currentUserData && currentUserData["Password"] === pass) {
                // 1. Refresh user Lotus
                const newLotus = generateNewLotus();
                await updateDoc(doc(db, "UARM", currentUserDocId), { "Lotus": newLotus });
                currentUserData["Lotus"] = newLotus;

                // 2. Notify QR Device via ASPX Keys
                if (session) {
                    try {
                        await setDoc(doc(db, "ASPX Keys", session), {
                            status: "authenticated",
                            userData: {
                                "Email": currentUserData["Email"] || "",
                                "First Name": currentUserData["First Name"] || "",
                                "Lotus": newLotus,
                                "Profile_Picture": currentUserData["Profile_Picture"] || ""
                            },
                            authenticatedAt: new Date().toISOString()
                        });
                    } catch (err) {
                        console.error("Failed to notify QR device:", err);
                    }
                }

                // 3. Save locally on this phone/device
                let accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
                accounts = accounts.filter(acc => acc.email !== currentUserData["Email"]);
                accounts.push({
                    email: currentUserData["Email"],
                    firstName: currentUserData["First Name"] || "",
                    profilePic: currentUserData["Profile_Picture"] || "",
                    lotus: newLotus
                });
                localStorage.setItem('saved_accounts', JSON.stringify(accounts));
                localStorage.setItem('active_user', JSON.stringify(currentUserData));

                // 4. Redirect to next step
                window.location.href = continueUrl;
            } else {
                alert("Incorrect password");
                btn.innerText = "Next";
                btn.disabled = false;
                document.getElementById('password').value = "";
                document.getElementById('password').focus();
            }
        } catch (error) {
            console.error("Login verification failed:", error);
            alert("Error verifying password. Please try again.");
            btn.innerText = "Next";
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
