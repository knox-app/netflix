<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Password</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #202124;
            --text-secondary: #5f6368;
            --input-border: #dadce0;
            --input-focus: #1a73e8;
            --input-bg: #ffffff;
            --btn-bg: #1a73e8;
            --btn-text: #ffffff;
            --btn-hover: #1557b0;
            --badge-bg: #ffffff;
            --badge-border: #dadce0;
            --badge-text: #3c4043;
        }

        body.dark {
            --bg-color: #202124;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0a6;
            --input-border: #5f6368;
            --input-focus: #8ab4f8;
            --input-bg: #202124;
            --btn-bg: #8ab4f8;
            --btn-text: #202124;
            --btn-hover: #93bbf8;
            --badge-bg: #202124;
            --badge-border: #5f6368;
            --badge-text: #e8eaed;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { 
            text-align: center; 
            max-width: 400px; 
            width: 90%; 
            padding: 30px 20px; 
            box-sizing: border-box;
        }

        h1 { 
            font-size: 24px; 
            font-weight: 500; 
            margin: 0 0 16px 0; 
            color: var(--text-primary); 
        }
        
        /* Google-style User Chip / Badge */
        .user-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--badge-bg);
            border: 1px solid var(--badge-border);
            padding: 4px 14px 4px 5px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: var(--badge-text);
            margin-bottom: 30px;
            max-width: 100%;
            box-sizing: border-box;
        }

        .user-chip img {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .user-chip .avatar-placeholder {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background-color: #1a73e8;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
        }

        .user-chip span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 260px;
        }

        .input-group { 
            position: relative; 
            margin-bottom: 25px; 
            text-align: left; 
        }

        .input-group label {
            position: absolute;
            top: -9px;
            left: 12px;
            background: var(--bg-color);
            padding: 0 5px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid var(--input-border);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-primary);
            transition: border-color 0.2s ease;
        }

        input[type="password"]:focus { 
            border-color: var(--input-focus); 
            border-width: 2px;
            padding: 13px 15px; /* Compentsate border width */
        }

        .btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 12px 24px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn:hover { 
            background: var(--btn-hover); 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Welcome</h1>
    
    <!-- Google Style User Pill with Avatar on the Left -->
    <div class="user-chip" id="userChip">
        <div class="avatar-placeholder" id="userAvatarPlaceholder">...</div>
        <img id="userAvatarImg" src="" alt="Avatar" style="display: none;" />
        <span id="userEmailDisplay">Loading...</span>
    </div>

    <form id="loginForm" onsubmit="return false;">
        <div class="input-group">
            <label for="password">Enter your password</label>
            <input type="password" id="password" autocomplete="current-password" autofocus />
        </div>

        <button type="submit" class="btn" id="loginBtn">Next</button>
    </form>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, updateDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        projectId: "question-metabase"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const session = urlParams.get('session');
    const lotus = urlParams.get('lotus') || urlParams.get('Lotus');
    const continueUrl = urlParams.get('continue') || '4.html';
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;
    
    let currentUserDocId = null;
    let currentUserData = null;

    if (theme === "dark" || theme === "d" || window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.body.classList.add("dark");
    }

    async function fetchUser() {
        try {
            if (!lotus) return window.location.href = '1.html';
            const q = query(collection(db, "UARM"), where("Lotus", "==", lotus));
            const querySnapshot = await getDocs(q);
            
            if (!querySnapshot.empty) {
                currentUserDocId = querySnapshot.docs[0].id;
                currentUserData = querySnapshot.docs[0].data();

                const email = currentUserData["Email"] || currentUserData["Guardian Email"] || "User";
                const profilePic = currentUserData["Profile_Picture"];

                // Set user email
                document.getElementById('userEmailDisplay').innerText = email;

                // Set profile picture on the left
                const avatarImg = document.getElementById('userAvatarImg');
                const avatarPlaceholder = document.getElementById('userAvatarPlaceholder');

                if (profilePic && profilePic.trim() !== "") {
                    avatarImg.src = profilePic;
                    avatarImg.onload = () => {
                        avatarImg.style.display = 'block';
                        avatarPlaceholder.style.display = 'none';
                    };
                    avatarImg.onerror = () => {
                        avatarPlaceholder.innerText = email.charAt(0).toUpperCase();
                    };
                } else {
                    avatarPlaceholder.innerText = email.charAt(0).toUpperCase();
                }
                
                document.getElementById('password').focus();
            } else {
                alert("Security token invalid.");
                window.location.href = '1.html';
            }
        } catch (error) {
            console.error("Fetch user error:", error);
            alert("Database connection error.");
            window.location.href = '1.html';
        }
    }
    fetchUser();

    function generateNewLotus() {
        return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    }

    async function handleLogin() {
        const pass = document.getElementById('password').value;
        if (!pass || !currentUserData) return;

        const loginBtn = document.getElementById('loginBtn');
        loginBtn.innerText = "Verifying...";
        loginBtn.disabled = true;

        try {
            if (currentUserData["Password"] === pass) {
                // 1. Refresh user Lotus
                const newLotus = generateNewLotus();
                await updateDoc(doc(db, "UARM", currentUserDocId), { "Lotus": newLotus });
                currentUserData["Lotus"] = newLotus;

                // 2. Notify QR Device via ASPX Keys if session exists
                if (session) {
                    try {
                        await setDoc(doc(db, "ASPX Keys", session), {
                            status: "authenticated",
                            userData: {
                                "Email": currentUserData["Email"] || "",
                                "First Name": currentUserData["First Name"] || "",
                                "Lotus": newLotus
                            },
                            authenticatedAt: new Date().toISOString()
                        });
                    } catch (err) {
                        console.error("Failed to notify QR device:", err);
                    }
                }

                // 3. Save locally
                let accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
                accounts = accounts.filter(acc => acc.email !== currentUserData["Email"]);
                accounts.push({
                    email: currentUserData["Email"],
                    firstName: currentUserData["First Name"] || "",
                    lotus: newLotus,
                    profilePicture: currentUserData["Profile_Picture"] || ""
                });
                localStorage.setItem('saved_accounts', JSON.stringify(accounts));
                localStorage.setItem('active_user', JSON.stringify(currentUserData));

                // 4. Redirect to next step
                window.location.href = continueUrl;
            } else {
                alert("Wrong password. Try again.");
                loginBtn.innerText = "Next";
                loginBtn.disabled = false;
                document.getElementById('password').select();
            }
        } catch (error) {
            console.error("Login verification failed:", error);
            alert("Error verifying password. Please try again.");
            loginBtn.innerText = "Next";
            loginBtn.disabled = false;
        }
    }

    // Enter key submit handling
    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        handleLogin();
    });

    document.getElementById('password').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleLogin();
        }
    });
</script>
</body>
</html>
