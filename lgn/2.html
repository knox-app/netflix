<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SD V0</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #fff; color: #000; }
        .container { width: 100%; max-width: 400px; padding: 40px 24px; text-align: center; box-sizing: border-box; }
        h1 { font-size: 32px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.5px; }
        .user-email-display { display: inline-block; background-color: #f3f4f6; padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: 500; color: #374151; margin-bottom: 32px; border: 1px solid #e5e7eb; }
        .input-group { position: relative; margin-bottom: 24px; text-align: left; }
        .input-group input { width: 100%; padding: 18px 16px; border: 1px solid #d1d5db; border-radius: 12px; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.2s; background: transparent; }
        .input-group input:focus { border-color: #000; }
        .input-group label { position: absolute; left: 12px; top: 18px; background: #fff; padding: 0 4px; color: #6b7280; font-size: 16px; transition: 0.2s ease all; pointer-events: none; }
        .input-group input:focus + label, .input-group input:not(:placeholder-shown) + label { top: -10px; font-size: 12px; color: #555; }
        button { width: 100%; padding: 16px; background-color: #000; color: #fff; border: none; border-radius: 30px; font-size: 16px; font-weight: 500; cursor: pointer; margin-top: 10px; transition: background-color 0.2s; }
        button:hover { background-color: #333; }
        button:disabled { background-color: #ccc; cursor: not-allowed; }
        #error-message { color: #dc2626; font-size: 14px; margin-top: -15px; margin-bottom: 20px; display: none; text-align: left; padding-left: 5px; }
        #loader { display: none; font-size: 14px; color: #555; margin-bottom: 20px; }
        #main-form { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loader">Loading your account...</div>

        <div id="main-form">
            <h1>Welcome</h1>
            <!-- Changed variable to just generic "ID" since it might be a phone number now -->
            <div class="user-email-display" id="displayEmail">loading...</div>

            <div class="input-group">
                <input type="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
            </div>
            
            <div id="error-message">Wrong password. Try again.</div>

            <button id="loginBtn">Sign in</button>
        </div>
    </div>

    <script type="module">
        // IMPORT deleteDoc directly from SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, query, where, getDocs, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
            authDomain: "question-metabase.firebaseapp.com",
            databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "question-metabase",
            storageBucket: "question-metabase.firebasestorage.app",
            messagingSenderId: "770698198753",
            appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
            measurementId: "G-6ZP1FPMKSJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loader = document.getElementById('loader');
        const mainForm = document.getElementById('main-form');
        const displayEmail = document.getElementById('displayEmail');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('error-message');

        let actualPassword = "";
        let userDocId = ""; 
        let lotusFieldName = ""; 

        function generateNewLotusId() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < 15; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        async function loadPageData() {
            loader.style.display = 'block';

            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');
            const urlLotusId = urlParams.get('lotus');

            if (!sessionId || !urlLotusId) {
                alert("Missing session or lotus ID. Redirecting to start.");
                window.location.href = "1.html";
                return;
            }

            try {
                if (localStorage.getItem('isLoggedIn') === 'true' && localStorage.getItem('lotusId')) {
                    await handleSuccessfulLogin(sessionId);
                    return; 
                }

                const usersRef = collection(db, "UARM");
                let userData = null;

                const qUpper = query(usersRef, where("Lotus", "==", urlLotusId));
                const snapUpper = await getDocs(qUpper);
                
                if (!snapUpper.empty) {
                    userData = snapUpper.docs[0].data();
                    userDocId = snapUpper.docs[0].id; 
                    lotusFieldName = "Lotus"; 
                } else {
                    const qLower = query(usersRef, where("lotus", "==", urlLotusId));
                    const snapLower = await getDocs(qLower);
                    if (!snapLower.empty) {
                        userData = snapLower.docs[0].data();
                        userDocId = snapLower.docs[0].id; 
                        lotusFieldName = "lotus"; 
                    }
                }

                if (!userData) {
                    alert("This login link has expired or is invalid. Please sign in again.");
                    window.location.href = "1.html";
                    return;
                }

                // Show email OR mobile depending on what exists
                displayEmail.textContent = userData.email || userData.mobile || "Account Found";
                actualPassword = userData.password; 

                loader.style.display = 'none';
                mainForm.style.display = 'block';

            } catch (error) {
                console.error("Error loading data:", error);
                alert("Database connection error.");
            }
        }

        // --- UPDATED SUCCESS HANDLER ---
        async function handleSuccessfulLogin(sessionId) {
            loginBtn.textContent = "Redirecting...";
            
            try {
                // 1. Get the session document to find where to redirect
                const sessionDocRef = doc(db, "ASPX Keys", sessionId);
                const sessionSnap = await getDoc(sessionDocRef);
                let targetUrl = "https://www.perplexity.ai"; 

                if (sessionSnap.exists()) {
                    const dbContinueUrl = sessionSnap.data().continue;
                    if (dbContinueUrl && dbContinueUrl.trim() !== "") {
                        targetUrl = dbContinueUrl;
                    }
                    
                    // 2. DELETE THE SESSION DOCUMENT FROM FIREBASE
                    await deleteDoc(sessionDocRef);
                    console.log("Session deleted successfully for security.");
                }
                
                // 3. Redirect the user
                window.location.href = targetUrl;
            } catch (error) {
                console.error("Error fetching/deleting session:", error);
                window.location.href = "https://www.perplexity.ai"; 
            }
        }

        loginBtn.addEventListener('click', async () => {
            const enteredPassword = passwordInput.value;
            errorMsg.style.display = 'none';

            if (!enteredPassword) {
                passwordInput.focus();
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Securing session...';

            if (enteredPassword === actualPassword) {
                const urlParams = new URLSearchParams(window.location.search);
                const sessionId = urlParams.get('session');
                const newLotusId = generateNewLotusId(); 

                try {
                    // Update Lotus ID in database
                    const userRef = doc(db, "UARM", userDocId);
                    await updateDoc(userRef, {
                        [lotusFieldName]: newLotusId
                    });

                    // Save local state
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('lotusId', newLotusId);

                    // Complete login (this now triggers the session deletion)
                    await handleSuccessfulLogin(sessionId);

                } catch (error) {
                    console.error("Failed to rotate Lotus ID:", error);
                    alert("A security error occurred. Please try again.");
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Sign in';
                }
            } else {
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign in';
                passwordInput.value = ""; 
                passwordInput.focus();
            }
        });

        passwordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        });

        loadPageData();

    </script>
</body>
</html>
