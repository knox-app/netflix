<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter 2 Password</title>
    <style>
        /* CSS reset and base styles (Matching 1.html exactly) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fff;
            color: #000;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            padding: 40px 24px;
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        /* Profile/Email display */
        .user-email-display {
            display: inline-block;
            background-color: #f3f4f6;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 32px;
            border: 1px solid #e5e7eb;
        }

        /* Input styling with floating label */
        .input-group {
            position: relative;
            margin-bottom: 24px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 18px 16px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
            background: transparent;
        }

        .input-group input:focus {
            border-color: #000;
        }

        .input-group label {
            position: absolute;
            left: 12px;
            top: 18px;
            background: #fff;
            padding: 0 4px;
            color: #6b7280;
            font-size: 16px;
            transition: 0.2s ease all;
            pointer-events: none;
        }

        /* Float the label when input is focused or has content */
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: -10px;
            font-size: 12px;
            color: #555;
        }

        /* Button styling */
        button {
            width: 100%;
            padding: 16px;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #333;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #error-message {
            color: #dc2626;
            font-size: 14px;
            margin-top: -15px;
            margin-bottom: 20px;
            display: none;
            text-align: left;
            padding-left: 5px;
        }

        /* Loader */
        #loader {
            display: none;
            font-size: 14px;
            color: #555;
            margin-bottom: 20px;
        }
        #main-form {
            display: none; /* Hidden until data loads */
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="loader">Loading your account...</div>

        <div id="main-form">
            <h1>Welcome</h1>
            <div class="user-email-display" id="displayEmail">loading@perplexity.com</div>

            <div class="input-group">
                <!-- placeholder=" " allows CSS floating label trick to work -->
                <input type="password" id="password" placeholder=" " required>
                <label for="password">Password</label>
            </div>
            
            <div id="error-message">Wrong password. Try again.</div>

            <button id="loginBtn">Sign in</button>
        </div>
    </div>

    <!-- Firebase SDK Setup (Modular Version) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, getDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Your specific Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
            authDomain: "question-metabase.firebaseapp.com",
            databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "question-metabase",
            storageBucket: "question-metabase.firebasestorage.app",
            messagingSenderId: "770698198753",
            appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
            measurementId: "G-6ZP1FPMKSJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Elements
        const loader = document.getElementById('loader');
        const mainForm = document.getElementById('main-form');
        const displayEmail = document.getElementById('displayEmail');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('error-message');

        // Global variables to hold data
        let actualPassword = "";
        let continueUrl = "";

        // --- CORE LOGIC: Fetch Data on Load ---
        async function loadPageData() {
            loader.style.display = 'block';

            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('session');
            const lotusId = urlParams.get('lotus');

            if (!sessionId || !lotusId) {
                alert("Missing session or lotus ID. Redirecting to start.");
                window.location.href = "1.html";
                return;
            }

            try {
                // 1. Check if user is already logged in via LocalStorage
                if (localStorage.getItem('isLoggedIn') === 'true' && localStorage.getItem('lotusId') === lotusId) {
                    await handleSuccessfulLogin(sessionId);
                    return; // Stop execution, user is being redirected
                }

                // 2. Fetch User Data using Lotus ID
                const usersRef = collection(db, "UARM");
                let userData = null;

                // Checking for both uppercase 'Lotus' and lowercase 'lotus' variations
                const qUpper = query(usersRef, where("Lotus", "==", lotusId));
                const snapUpper = await getDocs(qUpper);
                
                if (!snapUpper.empty) {
                    userData = snapUpper.docs[0].data();
                } else {
                    const qLower = query(usersRef, where("lotus", "==", lotusId));
                    const snapLower = await getDocs(qLower);
                    if (!snapLower.empty) {
                        userData = snapLower.docs[0].data();
                    }
                }

                if (!userData) {
                    alert("Invalid Lotus ID. Account not found.");
                    window.location.href = "1.html";
                    return;
                }

                // 3. Populate UI with Data
                displayEmail.textContent = userData.email;
                actualPassword = userData.password; // Store the correct password from DB into variable

                // Show form
                loader.style.display = 'none';
                mainForm.style.display = 'block';

            } catch (error) {
                console.error("Error loading data:", error);
                alert("Database connection error.");
            }
        }

        // --- SUCCESS HANDLER: Redirects to 'Continue' URL ---
        async function handleSuccessfulLogin(sessionId) {
            loginBtn.textContent = "Redirecting...";
            loginBtn.disabled = true;

            try {
                // Fetch the 'continue' URL from ASPX Keys using the Session ID
                const sessionDocRef = doc(db, "ASPX Keys", sessionId);
                const sessionSnap = await getDoc(sessionDocRef);

                let targetUrl = "https://www.perplexity.ai"; // Default fallback if continue is empty

                if (sessionSnap.exists()) {
                    const dbContinueUrl = sessionSnap.data().continue;
                    if (dbContinueUrl && dbContinueUrl.trim() !== "") {
                        targetUrl = dbContinueUrl; // Override default if continue exists
                    }
                }

                // Redirect
                window.location.href = targetUrl;

            } catch (error) {
                console.error("Error fetching continue URL:", error);
                window.location.href = "https://www.perplexity.ai"; // Fallback redirect
            }
        }

        // --- LOGIN BUTTON LOGIC ---
        loginBtn.addEventListener('click', async () => {
            const enteredPassword = passwordInput.value;
            errorMsg.style.display = 'none';

            if (!enteredPassword) {
                passwordInput.focus();
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying...';

            // Compare passwords
            if (enteredPassword === actualPassword) {
                // Passwords match!
                const urlParams = new URLSearchParams(window.location.search);
                
                // SAVE PERSISTENT LOGIN STATE
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('lotusId', urlParams.get('lotus'));

                // Handle Redirect
                await handleSuccessfulLogin(urlParams.get('session'));
            } else {
                // Wrong password
                errorMsg.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign in';
                passwordInput.value = ""; // Clear password field
                passwordInput.focus();
            }
        });

        // Add 'Enter' key support for password field
        passwordInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loginBtn.click();
            }
        });

        // Initialize page
        loadPageData();

    </script>
</body>
</html>
