<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR to Sign In</title>
    <!-- QRCode library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #555555;
            --border-color: #dddddd;
            --card-bg: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-primary: #ffffff;
                --text-secondary: #aaaaaa;
                --border-color: #333333;
                --card-bg: #111111;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 36px;
            text-align: center;
            max-width: 380px;
            width: 90%;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 10px 0;
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0 0 24px 0;
            line-height: 1.5;
        }

        .qr-box {
            display: inline-block;
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #f59e0b;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        .dot.success {
            background-color: #10b981;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Sign In with QR</h1>
    <p>Scan this QR code with your phone or kid's device to sign in automatically.</p>

    <div class="qr-box">
        <div id="qrcode"></div>
    </div>

    <div>
        <span class="status-badge" id="statusBadge">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Waiting for scan...</span>
        </span>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        projectId: "question-metabase"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Generate session ID
    const sessionId = "sess_" + Math.random().toString(36).substring(2, 10) + Date.now().toString().slice(-4);
    const urlParams = new URLSearchParams(window.location.search);
    const continueUrl = urlParams.get('continue') || '4.html';

    async function init() {
        const sessionRef = doc(db, "ASPX Keys", sessionId);

        // 2. Register initial session in Firestore
        await setDoc(sessionRef, {
            status: "pending",
            createdAt: new Date().toISOString()
        });

        // 3. Build Login URL for QR (Replaces localhost with current host)
        const currentOrigin = window.location.origin;
        const scanUrl = `${currentOrigin}/1.html?session=${encodeURIComponent(sessionId)}&continue=${encodeURIComponent(continueUrl)}`;

        // 4. Render QR code
        new QRCode(document.getElementById("qrcode"), {
            text: scanUrl,
            width: 200,
            height: 200,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
        });

        console.log("Session listening on ID:", sessionId);

        // 5. Real-time Listener on Firestore
        const unsubscribe = onSnapshot(sessionRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                console.log("Session snapshot update:", data);

                if (data.status === "authenticated" && data.userData) {
                    // Update UI
                    document.getElementById("statusDot").classList.add("success");
                    document.getElementById("statusText").innerText = "Approved! Logging in...";

                    // Save Account into LocalStorage on this device
                    saveAccountAndLogin(data.userData);

                    // Unsubscribe listener & redirect
                    unsubscribe();
                    setTimeout(() => {
                        window.location.href = continueUrl;
                    }, 800);
                }
            }
        }, (error) => {
            console.error("Firestore listen error:", error);
            document.getElementById("statusText").innerText = "Connection error. Please refresh.";
        });
    }

    function saveAccountAndLogin(userData) {
        try {
            let accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
            const email = userData["Email"];
            const firstName = userData["First Name"];
            const lotus = userData["Lotus"];

            if (email) {
                accounts = accounts.filter(acc => acc.email !== email);
                accounts.push({
                    email: email,
                    firstName: firstName || "",
                    lotus: lotus || ""
                });
                localStorage.setItem('saved_accounts', JSON.stringify(accounts));
            }
            localStorage.setItem('active_user', JSON.stringify(userData));
        } catch (e) {
            console.error("Local storage error:", e);
        }
    }

    init();
</script>
</body>
</html>
