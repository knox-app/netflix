<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan QR to Sign In</title>
    <!-- Lightweight QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #555555;
            --card-border: #dddddd;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --text-primary: #ffffff;
                --text-secondary: #aaaaaa;
                --card-border: #3a3a3a;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .container {
            text-align: center;
            max-width: 420px;
            width: 90%;
            padding: 30px;
            border: 1px solid var(--card-border);
            border-radius: 16px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .qr-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: #ffffff;
            border-radius: 12px;
            width: fit-content;
            margin: 0 auto 20px auto;
        }

        .status {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid var(--text-secondary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 6px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Log in with QR Code</h1>
    <p>Scan this QR code from your mobile device or child's account to sign in automatically.</p>

    <div class="qr-wrapper">
        <div id="qrcode"></div>
    </div>

    <div class="status" id="statusText">
        <span class="spinner"></span> Waiting for scan...
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        projectId: "question-metabase"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Generate unique session ID
    const sessionId = "sess_" + Math.random().toString(36).substring(2, 12) + Date.now();
    const continueUrl = new URLSearchParams(window.location.search).get('continue') || '4.html';

    async function initQRLogin() {
        try {
            // 2. Register initial pending session in ASPX Keys
            const sessionRef = doc(db, "ASPX Keys", sessionId);
            await setDoc(sessionRef, {
                status: "pending",
                createdAt: new Date()
            });

            // 3. Build target URL for the scanning device
            const scanUrl = `${window.location.origin}/1.html?session=${encodeURIComponent(sessionId)}&continue=${encodeURIComponent(continueUrl)}`;

            // 4. Render QR code
            new QRCode(document.getElementById("qrcode"), {
                text: scanUrl,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            // 5. Listen for updates in real-time
            const unsubscribe = onSnapshot(sessionRef, async (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();

                    if (data.status === "authenticated" && data.userData) {
                        document.getElementById("statusText").innerText = "Authentication approved! Redirecting...";

                        // Save account locally
                        saveAccountAndLogin(data.userData);

                        // Cleanup session document
                        try {
                            await deleteDoc(sessionRef);
                        } catch (e) {
                            console.error("Session cleanup error:", e);
                        }

                        // Stop listener and redirect
                        unsubscribe();
                        window.location.href = continueUrl;
                    }
                }
            });

        } catch (error) {
            console.error("QR Init error:", error);
            document.getElementById("statusText").innerText = "Failed to initialize QR session.";
        }
    }

    function saveAccountAndLogin(userData) {
        try {
            let accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
            const email = userData["Email"];
            const firstName = userData["First Name"];
            const lotus = userData["Lotus"];

            if (email && !accounts.some(acc => acc.email === email)) {
                accounts.push({ email, firstName: firstName || "", lotus: lotus || "" });
                localStorage.setItem('saved_accounts', JSON.stringify(accounts));
            }
            localStorage.setItem('active_user', JSON.stringify(userData));
        } catch (e) {
            console.error("Local storage error:", e);
        }
    }

    initQRLogin();
</script>
</body>
</html>
