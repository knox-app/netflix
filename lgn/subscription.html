<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Subscriptions</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/knox-app/cloud/d235b91b67a58037117f8f0c2d1391ffd209a463/logo/ca81fecf-2d54-4aea-8de0-f189a43e1002.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #fbfbfd;
            --surface-card: #ffffff;
            --surface-subtle: #f5f5f7;
            --surface-hover: #ebebee;
            --border-subtle: rgba(0, 0, 0, 0.08);
            --border-focus: rgba(0, 0, 0, 0.2);
            --text-main: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-muted: #86868b;
            --accent-primary: #0071e3;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 12px 36px rgba(0,0,0,0.1);
            --blur-nav: blur(20px);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-full: 9999px;
            --shimmer-bg: linear-gradient(90deg, #f0f0f2 0%, #e4e4e7 50%, #f0f0f2 100%);
        }

        body.dark {
            --bg-page: #000000;
            --surface-card: #121214;
            --surface-subtle: #1c1c1e;
            --surface-hover: #2c2c2e;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-focus: rgba(255, 255, 255, 0.3);
            --text-main: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-muted: #6e6e73;
            --accent-primary: #2997ff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
            --shadow-md: 0 16px 50px rgba(0,0,0,0.7);
            --shimmer-bg: linear-gradient(90deg, #1c1c1e 0%, #2c2c2e 50%, #1c1c1e 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(var(--bg-page), 0.8);
            backdrop-filter: var(--blur-nav);
            -webkit-backdrop-filter: var(--blur-nav);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
        }

        .brand-logo {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            object-fit: cover;
        }

        .btn-nav-back {
            background-color: var(--surface-subtle);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-nav-back:hover {
            background-color: var(--surface-hover);
            border-color: var(--border-focus);
        }

        .main-container {
            max-width: 680px;
            width: 100%;
            margin: 0 auto;
            padding: 48px 24px 80px;
            flex: 1;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 6px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Plans List (Card Stack) */
        .plans-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .plan-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 18px;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .plan-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-focus);
            box-shadow: var(--shadow-md);
        }

        .plan-logo {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--border-subtle);
            background: var(--surface-subtle);
        }

        .plan-name {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-main);
        }

        /* Empty State */
        .empty-state {
            background-color: var(--surface-card);
            border: 1px dashed var(--border-focus);
            border-radius: var(--radius-lg);
            padding: 48px 24px;
            text-align: center;
            display: none;
        }

        .empty-state svg {
            width: 44px;
            height: 44px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .empty-state h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Skeleton Loading */
        .skeleton {
            background-size: 200% 100%;
            background-image: var(--shimmer-bg);
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            display: inline-block;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="nav-brand">
        <img class="brand-logo" src="https://raw.githubusercontent.com/knox-app/cloud/d235b91b67a58037117f8f0c2d1391ffd209a463/logo/ca81fecf-2d54-4aea-8de0-f189a43e1002.png" alt="Logo">
        <span>Subscriptions</span>
    </div>
    <a href="javascript:history.back()" class="btn-nav-back">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Back
    </a>
</header>

<main class="main-container">
    <div class="page-header">
        <h1>Your Plans</h1>
        <p>Active subscriptions linked to your profile.</p>
    </div>

    <!-- Active Plans List -->
    <div class="plans-list" id="plansContainer">
        <!-- Skeleton Loader preview -->
        <div class="plan-card">
            <span class="skeleton" style="width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;"></span>
            <span class="skeleton" style="width: 180px; height: 22px;"></span>
        </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
        <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <h3>No subscriptions found</h3>
        <p>There are no active plans associated with your account.</p>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 1. Firebase Configuration
    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "question-metabase",
        storageBucket: "question-metabase.firebasestorage.app",
        messagingSenderId: "770698198753",
        appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
        measurementId: "G-6ZP1FPMKSJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. Theme Enforcement
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;
    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function applyTheme() {
        if (theme === "dark" || theme === "d") {
            document.body.classList.add("dark");
            return;
        }
        if (theme === "light" || theme === "l") {
            document.body.classList.remove("dark");
            return;
        }
        if (mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }
    applyTheme();

    // 3. User Session Verification
    let activeUser = null;
    try {
        activeUser = JSON.parse(localStorage.getItem('active_user') || 'null');
    } catch (e) {
        activeUser = null;
    }

    if (!activeUser || !activeUser["Email"]) {
        window.location.href = theme ? `1.html?theme=${encodeURIComponent(theme)}` : '1.html';
    }

    const plansContainer = document.getElementById('plansContainer');
    const emptyState = document.getElementById('emptyState');

    // 4. Extract Plan IDs Safe Helper
    function parsePlanIds(userDocData) {
        const rawPlans = userDocData["Plans"];
        if (!rawPlans) return [];
        if (Array.isArray(rawPlans)) return rawPlans;
        if (typeof rawPlans === 'object') return Object.values(rawPlans);
        if (typeof rawPlans === 'string') return [rawPlans];
        return [];
    }

    // 5. Fetch and Render Only Logo & Name
    async function loadSubscriptions(userDocData) {
        const planIds = parsePlanIds(userDocData);

        if (planIds.length === 0) {
            plansContainer.innerHTML = '';
            emptyState.style.display = 'block';
            return;
        }

        try {
            const planPromises = planIds.map(id => getDoc(doc(db, "Plans & Subscriptions", id.trim())));
            const planDocs = await Promise.all(planPromises);

            plansContainer.innerHTML = '';
            emptyState.style.display = 'none';

            let validCount = 0;

            planDocs.forEach((docSnap) => {
                if (!docSnap.exists()) return;
                validCount++;
                const data = docSnap.data();

                const name = data["Name"] || "Subscription Plan";
                const logo = data["Logo"] || "https://placehold.co/120x120?text=Plan";

                const cardHtml = `
                    <div class="plan-card">
                        <img class="plan-logo" src="${escapeHtml(logo)}" alt="${escapeHtml(name)}" onerror="this.src='https://placehold.co/120x120?text=Plan'">
                        <span class="plan-name">${escapeHtml(name)}</span>
                    </div>
                `;
                plansContainer.insertAdjacentHTML('beforeend', cardHtml);
            });

            if (validCount === 0) {
                emptyState.style.display = 'block';
            }

        } catch (err) {
            console.error("Error fetching subscriptions:", err);
            plansContainer.innerHTML = `<p style="color:var(--text-secondary); text-align:center;">Unable to load plans right now.</p>`;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 6. Firestore Real-time Listener on User Data
    const userEmail = activeUser["Email"];
    const q = query(collection(db, "UARM"), where("Email", "==", userEmail));

    onSnapshot(q, (snapshot) => {
        if (!snapshot.empty) {
            const userData = snapshot.docs[0].data();
            loadSubscriptions(userData);
        } else {
            plansContainer.innerHTML = '';
            emptyState.style.display = 'block';
        }
    }, (error) => {
        console.error("Firestore error:", error);
    });
</script>
</body>
</html>
