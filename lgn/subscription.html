<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Subscriptions</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/knox-app/cloud/d235b91b67a58037117f8f0c2d1391ffd209a463/logo/ca81fecf-2d54-4aea-8de0-f189a43e1002.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-page: #fbfbfd;
            --surface-card: #ffffff;
            --surface-subtle: #f5f5f7;
            --surface-hover: #ebebee;
            --border-subtle: rgba(0, 0, 0, 0.08);
            --border-focus: rgba(0, 0, 0, 0.2);
            --text-main: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-muted: #86868b;
            --accent-primary: #0071e3;
            --accent-primary-text: #ffffff;
            --success: #34c759;
            --success-bg: rgba(52, 199, 89, 0.1);
            --danger: #d93025;
            --danger-bg: rgba(217, 48, 37, 0.08);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 12px 36px rgba(0,0,0,0.1);
            --blur-nav: blur(20px);
            --radius-lg: 24px;
            --radius-md: 14px;
            --radius-full: 9999px;
            --shimmer-bg: linear-gradient(90deg, #f0f0f2 0%, #e4e4e7 50%, #f0f0f2 100%);
            --badge-active-bg: rgba(52, 199, 89, 0.12);
            --badge-active-text: #248a3d;
            --badge-active-border: rgba(52, 199, 89, 0.25);
        }

        body.dark {
            --bg-page: #000000;
            --surface-card: #121214;
            --surface-subtle: #1c1c1e;
            --surface-hover: #2c2c2e;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --border-focus: rgba(255, 255, 255, 0.3);
            --text-main: #f5f5f7;
            --text-secondary: #a1a1a6;
            --text-muted: #6e6e73;
            --accent-primary: #2997ff;
            --accent-primary-text: #ffffff;
            --success: #30d158;
            --success-bg: rgba(48, 209, 88, 0.15);
            --danger: #ff453a;
            --danger-bg: rgba(255, 69, 58, 0.12);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.5);
            --shadow-md: 0 16px 50px rgba(0,0,0,0.7);
            --shimmer-bg: linear-gradient(90deg, #1c1c1e 0%, #2c2c2e 50%, #1c1c1e 100%);
            --badge-active-bg: rgba(48, 209, 88, 0.15);
            --badge-active-text: #30d158;
            --badge-active-border: rgba(48, 209, 88, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 40;
            background: rgba(var(--bg-page), 0.8);
            backdrop-filter: var(--blur-nav);
            -webkit-backdrop-filter: var(--blur-nav);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
        }

        .brand-logo {
            width: 26px;
            height: 26px;
            border-radius: 6px;
            object-fit: cover;
        }

        .btn-nav-back {
            background-color: var(--surface-subtle);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
            padding: 6px 14px;
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-nav-back:hover {
            background-color: var(--surface-hover);
            border-color: var(--border-focus);
        }

        .main-container {
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            padding: 48px 24px 80px;
            flex: 1;
        }

        /* Page Hero */
        .page-header {
            margin-bottom: 36px;
        }

        .page-header h1 {
            font-size: 2.1rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .page-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Plan Card */
        .subscription-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 24px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .subscription-card:hover {
            border-color: var(--border-focus);
            box-shadow: var(--shadow-md);
        }

        .plan-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-subtle);
            gap: 16px;
            flex-wrap: wrap;
        }

        .plan-identity {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .plan-logo {
            width: 52px;
            height: 52px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid var(--border-subtle);
            background: var(--surface-subtle);
        }

        .plan-title-box h3 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .plan-id-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
            margin-top: 2px;
        }

        /* Status Badge */
        .badge-active {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 14px;
            border-radius: var(--radius-full);
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--badge-active-bg);
            color: var(--badge-active-text);
            border: 1px solid var(--badge-active-border);
        }

        .badge-active::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--badge-active-text);
        }

        /* Details Rows */
        .plan-details-list {
            display: flex;
            flex-direction: column;
            margin-top: 8px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.95rem;
        }

        .detail-row:last-child {
            border-bottom: none;
            padding-bottom: 4px;
        }

        .detail-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .detail-value {
            color: var(--text-main);
            font-weight: 600;
            text-align: right;
        }

        /* Studios Chips */
        .studio-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: flex-end;
            max-width: 60%;
        }

        .chip {
            background-color: var(--surface-subtle);
            border: 1px solid var(--border-subtle);
            padding: 3px 10px;
            border-radius: var(--radius-full);
            font-size: 0.78rem;
            color: var(--text-main);
            font-weight: 500;
        }

        /* Empty State */
        .empty-state {
            background-color: var(--surface-card);
            border: 1px dashed var(--border-focus);
            border-radius: var(--radius-lg);
            padding: 48px 24px;
            text-align: center;
            display: none;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .empty-state h3 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Shimmer Loading */
        .skeleton {
            background-size: 200% 100%;
            background-image: var(--shimmer-bg);
            animation: shimmer 1.5s infinite;
            border-radius: 6px;
            display: inline-block;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<header>
    <div class="nav-brand">
        <img class="brand-logo" src="https://raw.githubusercontent.com/knox-app/cloud/d235b91b67a58037117f8f0c2d1391ffd209a463/logo/ca81fecf-2d54-4aea-8de0-f189a43e1002.png" alt="Logo">
        <span>Plans & Subscriptions</span>
    </div>
    <a href="javascript:history.back()" class="btn-nav-back">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        Back
    </a>
</header>

<main class="main-container">
    <div class="page-header">
        <h1>Active Subscriptions</h1>
        <p>Review and manage your plan tiers, pricing, and streaming privileges.</p>
    </div>

    <!-- Active Plans List / Container -->
    <div id="subscriptionsContainer">
        <!-- Skeleton Loading Preview -->
        <div class="subscription-card" id="skeletonCard">
            <div class="plan-header">
                <div class="plan-identity">
                    <span class="skeleton" style="width: 52px; height: 52px; border-radius: 12px;"></span>
                    <div class="plan-title-box">
                        <span class="skeleton" style="width: 180px; height: 22px; margin-bottom: 6px;"></span>
                        <span class="skeleton" style="width: 100px; height: 14px;"></span>
                    </div>
                </div>
                <span class="skeleton" style="width: 70px; height: 26px; border-radius: 99px;"></span>
            </div>
            <div class="plan-details-list">
                <div class="detail-row">
                    <span class="skeleton" style="width: 90px; height: 16px;"></span>
                    <span class="skeleton" style="width: 60px; height: 16px;"></span>
                </div>
                <div class="detail-row">
                    <span class="skeleton" style="width: 110px; height: 16px;"></span>
                    <span class="skeleton" style="width: 70px; height: 16px;"></span>
                </div>
                <div class="detail-row">
                    <span class="skeleton" style="width: 100px; height: 16px;"></span>
                    <span class="skeleton" style="width: 140px; height: 16px;"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
        <h3>No Active Plans Found</h3>
        <p>You currently do not have any active subscriptions linked to your account.</p>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, doc, getDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // 1. Firebase Initialization
    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "question-metabase",
        storageBucket: "question-metabase.firebasestorage.app",
        messagingSenderId: "770698198753",
        appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
        measurementId: "G-6ZP1FPMKSJ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 2. Theme Enforcement
    const urlParams = new URLSearchParams(window.location.search);
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;
    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function applyTheme() {
        if (theme === "dark" || theme === "d") {
            document.body.classList.add("dark");
            return;
        }
        if (theme === "light" || theme === "l") {
            document.body.classList.remove("dark");
            return;
        }
        if (mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }
    applyTheme();

    // 3. Authenticated Session Check
    let activeUser = null;
    try {
        activeUser = JSON.parse(localStorage.getItem('active_user') || 'null');
    } catch (e) {
        activeUser = null;
    }

    if (!activeUser || !activeUser["Email"]) {
        window.location.href = theme ? `1.html?theme=${encodeURIComponent(theme)}` : '1.html';
    }

    const container = document.getElementById('subscriptionsContainer');
    const emptyState = document.getElementById('emptyState');

    // 4. Extract Plans Array Safe Helper
    function parsePlanIds(userDocData) {
        const rawPlans = userDocData["Plans"];
        if (!rawPlans) return [];
        if (Array.isArray(rawPlans)) return rawPlans;
        if (typeof rawPlans === 'object') return Object.values(rawPlans);
        if (typeof rawPlans === 'string') return [rawPlans];
        return [];
    }

    // 5. Fetch and Render Live Subscription Details
    async function loadSubscriptions(userDocData) {
        const planIds = parsePlanIds(userDocData);

        if (planIds.length === 0) {
            container.innerHTML = '';
            emptyState.style.display = 'block';
            return;
        }

        try {
            const planPromises = planIds.map(id => getDoc(doc(db, "Plans & Subscriptions", id.trim())));
            const planDocs = await Promise.all(planPromises);

            container.innerHTML = '';
            emptyState.style.display = 'none';

            let validCount = 0;

            planDocs.forEach((docSnap) => {
                if (!docSnap.exists()) return;
                validCount++;
                const data = docSnap.data();
                const planId = docSnap.id;

                // Format Studios
                let studiosHtml = '<span class="detail-value">—</span>';
                if (data["Studio"] && Array.isArray(data["Studio"]) && data["Studio"].length > 0) {
                    studiosHtml = `
                        <div class="studio-chips">
                            ${data["Studio"].map(s => `<span class="chip">${escapeHtml(s)}</span>`).join('')}
                        </div>
                    `;
                }

                // Format Pricing
                const inrPrice = data["Price (INR)"] ? `₹${data["Price (INR)"]}` : null;
                const usdPrice = data["Price (USD)"] ? `$${data["Price (USD)"]}` : null;
                const formattedPrice = [inrPrice, usdPrice].filter(Boolean).join(" / ") || "Free";

                // Format Logo
                const logoSrc = data["Logo"] || 'https://raw.githubusercontent.com/knox-app/cloud/d235b91b67a58037117f8f0c2d1391ffd209a463/logo/ca81fecf-2d54-4aea-8de0-f189a43e1002.png';

                // Boolean labels
                const hasAds = String(data["Ads"]).toLowerCase() === 'true' ? 'Included' : 'Ad-Free';
                const isBusinessReq = String(data["Business_Plan_Req"]).toLowerCase() === 'yes' ? 'Required' : 'No';

                const cardHtml = `
                    <div class="subscription-card">
                        <div class="plan-header">
                            <div class="plan-identity">
                                <img src="${escapeHtml(logoSrc)}" class="plan-logo" alt="Logo" onerror="this.src='https://placehold.co/100x100?text=Plan'">
                                <div class="plan-title-box">
                                    <h3>${escapeHtml(data["Name"] || "Subscription Plan")}</h3>
                                    <div class="plan-id-text">ID: ${escapeHtml(planId)}</div>
                                </div>
                            </div>
                            <span class="badge-active">Active</span>
                        </div>

                        <div class="plan-details-list">
                            <div class="detail-row">
                                <span class="detail-label">Subscription Rate</span>
                                <span class="detail-value">${escapeHtml(formattedPrice)}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Ad Tier</span>
                                <span class="detail-value">${hasAds}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Business Tier Required</span>
                                <span class="detail-value">${isBusinessReq}</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">Included Networks / Studios</span>
                                ${studiosHtml}
                            </div>
                        </div>
                    </div>
                `;

                container.insertAdjacentHTML('beforeend', cardHtml);
            });

            if (validCount === 0) {
                emptyState.style.display = 'block';
            }

        } catch (err) {
            console.error("Error fetching plans:", err);
            container.innerHTML = `<p style="color:var(--danger); text-align:center;">Failed to load subscriptions. Please check connection.</p>`;
        }
    }

    // Escape utility
    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // 6. Real-Time Listener on User Document
    const userEmail = activeUser["Email"];
    const q = query(collection(db, "UARM"), where("Email", "==", userEmail));

    onSnapshot(q, (snapshot) => {
        if (!snapshot.empty) {
            const userData = snapshot.docs[0].data();
            loadSubscriptions(userData);
        } else {
            container.innerHTML = '';
            emptyState.style.display = 'block';
        }
    }, (error) => {
        console.error("Firestore user listener error:", error);
    });
</script>
</body>
</html>
