<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
        /* CSS Variables for Dynamic Light/Dark Mode */
        :root {
            --bg-color: #ffffff;
            --text-primary: #000000;
            --text-secondary: #555555;
            --input-border: #dddddd;
            --input-focus: #000000;
            --input-bg: #ffffff;
            --btn-bg: #111111;
            --btn-text: #ffffff;
            --btn-hover: #333333;
        }

        body.dark {
            --bg-color: #000000;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --input-border: #3a3a3a;
            --input-focus: #ffffff;
            --input-bg: #000000; /* Inner input background is set to black */
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --btn-hover: #e0e0e0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .container { text-align: center; max-width: 400px; width: 90%; padding: 20px; }
        
        h1 { font-size: 32px; font-weight: 600; margin-bottom: 10px; color: var(--text-primary); }
        
        p.subtitle { color: var(--text-secondary); font-size: 15px; margin-bottom: 30px; line-height: 1.5; }
        
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        
        .input-group label {
            position: absolute;
            top: -10px;
            left: 15px;
            background: var(--bg-color);
            padding: 0 5px;
            font-size: 12px;
            color: var(--text-secondary);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 1px solid var(--input-border);
            border-radius: 12px;
            box-sizing: border-box;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-primary);
            transition: border-color 0.2s, background-color 0.3s, color 0.3s;
        }

        input[type="text"]:focus { border-color: var(--input-focus); }

        .btn {
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s, color 0.2s;
        }

        .btn:hover { background: var(--btn-hover); }
        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #0066cc; text-decoration: none; cursor: pointer; }

        .already-logged-in {
            display: none;
            background: rgba(0, 128, 0, 0.08);
            border: 1px solid rgba(0, 128, 0, 0.3);
            color: var(--text-primary);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Sign in</h1>
    <p class="subtitle">Use your AAAAAA Account. The account will be added to this device and available to other our Apps & Services.</p>

    <div class="already-logged-in" id="alreadyLoggedInMsg"></div>

    <div class="input-group">
        <label>Email or Mobile</label>
        <input type="text" id="identifier" placeholder="" autocomplete="off">
    </div>

    <button class="btn" id="continueBtn">Continue</button>
    
    <div class="links" id="accountChooserLink" style="display: none;">
        <a href="3.html">Choose an existing account</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore, collection, getDocs, query, where, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "question-metabase",
        storageBucket: "question-metabase.firebasestorage.app",
        messagingSenderId: "770698198753",
        appId: "1:770698198753:web:59ae49d78b6013bab5c1a0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Safeguard localStorage JSON parsing to prevent script crashes
    try {
        if (localStorage.getItem('saved_accounts')) {
            let accounts = JSON.parse(localStorage.getItem('saved_accounts'));
            if (accounts && accounts.length > 0) {
                document.getElementById('accountChooserLink').style.display = 'block';
            }
        }
    } catch (e) {
        console.error("Local storage read error:", e);
    }

    // Check (after the user enters their email/mobile) whether that same
    // account is already logged in on this device, and show an inline message.
    function checkAlreadyLoggedIn() {
        const msgEl = document.getElementById('alreadyLoggedInMsg');
        let typedIdentifier = document.getElementById('identifier').value.trim();
        if (!typedIdentifier) {
            msgEl.style.display = 'none';
            return;
        }

        const isMobile = /^\+?\d+$/.test(typedIdentifier);
        if (!isMobile && !typedIdentifier.includes('@')) {
            typedIdentifier += '@AAAAAA.com';
        }

        try {
            const activeUserRaw = localStorage.getItem('active_user');
            if (activeUserRaw) {
                const activeUser = JSON.parse(activeUserRaw);
                const activeEmail = activeUser && activeUser["Email"];
                if (activeEmail && activeEmail.toLowerCase() === typedIdentifier.toLowerCase()) {
                    msgEl.textContent = `${activeEmail} already logged in the device`;
                    msgEl.style.display = 'block';
                    return;
                }
            }
        } catch (e) {
            console.error("Active user read error:", e);
        }

        msgEl.style.display = 'none';
    }

    document.getElementById('identifier').addEventListener('blur', checkAlreadyLoggedIn);
    document.getElementById('identifier').addEventListener('input', () => {
        // Hide the message as soon as they start editing again
        document.getElementById('alreadyLoggedInMsg').style.display = 'none';
    });

    const urlParams = new URLSearchParams(window.location.search);
    let session = urlParams.get('session');
    let continueUrl = urlParams.get('continue') || '4.html';
    const theme = urlParams.get("theme") ? urlParams.get("theme").toLowerCase() : null;

    /* ================= LIVE THEME ================= */
    const mediaQuery = window.matchMedia("(prefers-color-scheme: dark)");

    function applyTheme() {
        if (theme === "dark" || theme === "d") {
            document.body.classList.add("dark");
            return;
        }
        if (theme === "light" || theme === "l") {
            document.body.classList.remove("dark");
            return;
        }
        if (mediaQuery.matches) {
            document.body.classList.add("dark");
        } else {
            document.body.classList.remove("dark");
        }
    }

    applyTheme();

    mediaQuery.addEventListener("change", () => {
        if (!theme) {
            applyTheme();
        }
    });

    // 1. Session Generation
    async function initSession() {
        if (!session) {
            session = Math.floor(1000000000 + Math.random() * 9000000000).toString();
            try {
                // Store session in ASPX Keys using setDoc to explicitly name the document
                await setDoc(doc(db, "ASPX Keys", session), {
                    sessionId: session,
                    createdAt: new Date()
                });
            } catch (err) {
                console.error("Session database write failed:", err);
            }
            // Update URL visibly (even if Firestore write fails, the UI keeps working)
            window.history.replaceState({}, '', `1.html?session=${session}&continue=${encodeURIComponent(continueUrl)}`);
        }
    }

    // 2. Auto Login Checks (Passwordless & Lotus Link)
    async function checkAutoLogins() {
        try {
            // A. Existing SafeOpt Passwordless Check
            if (urlParams.get('env') === 'safeopt' && urlParams.get('e') && urlParams.get('p')) {
                const email = urlParams.get('e');
                const pass = urlParams.get('p');
                
                const q = query(collection(db, "UARM"), where("Email", "==", email), where("Password", "==", pass));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    const userData = querySnapshot.docs[0].data();
                    saveAccountAndLogin(userData);
                    window.location.href = continueUrl;
                } else {
                    alert("Invalid passwordless login link.");
                }
            }

            // B. Automatic Lotus ID Login Check
            const lotusId = urlParams.get('lotus') || urlParams.get('Lotus');
            if (lotusId) {
                document.getElementById('continueBtn').innerText = "Logging in..."; // UI feedback
                const q = query(collection(db, "UARM"), where("Lotus", "==", lotusId));
                const querySnapshot = await getDocs(q);
                
                if (!querySnapshot.empty) {
                    const userData = querySnapshot.docs[0].data();
                    // Automatically save user to local storage and login completely
                    saveAccountAndLogin(userData);
                    window.location.href = continueUrl;
                } else {
                    alert("Invalid automatic login token.");
                    document.getElementById('continueBtn').innerText = "Continue";
                }
            }
        } catch (err) {
            console.error("Auto-login error:", err);
        }
    }

    function saveAccountAndLogin(userData) {
        try {
            let accounts = JSON.parse(localStorage.getItem('saved_accounts') || '[]');
            const email = userData["Email"];
            const firstName = userData["First Name"];
            const lotus = userData["Lotus"];

            if (email && !accounts.some(acc => acc.email === email)) {
                accounts.push({ email: email, firstName: firstName || "", lotus: lotus || "" });
                localStorage.setItem('saved_accounts', JSON.stringify(accounts));
            }
            localStorage.setItem('active_user', JSON.stringify(userData));
        } catch (e) {
            console.error("Local storage save error:", e);
        }
    }

    // Initialize
    initSession().then(checkAutoLogins);

    // 3. Handle Manual Form Submit
    document.getElementById('continueBtn').addEventListener('click', async () => {
        let identifier = document.getElementById('identifier').value.trim();
        if(!identifier) return alert("Please enter email or mobile");

        // Format identifier
        const isMobile = /^\+?\d+$/.test(identifier);
        if (!isMobile && !identifier.includes('@')) {
            identifier += '@AAAAAA.com';
        }

        document.getElementById('continueBtn').innerText = "Checking...";
        
        try {
            // Check UARM Database using Capitalized fields
            let q;
            if (isMobile) {
                q = query(collection(db, "UARM"), where("Phone Number", "==", identifier));
            } else {
                q = query(collection(db, "UARM"), where("Email", "==", identifier));
            }

            const querySnapshot = await getDocs(q);
            
            if (!querySnapshot.empty) {
                const userData = querySnapshot.docs[0].data();
                let redirectUrl = `2.html?session=${session}&Lotus=${userData["Lotus"]}&continue=${encodeURIComponent(continueUrl)}`;
                if (theme) {
                    redirectUrl += `&theme=${theme}`;
                }
                window.location.href = redirectUrl;
            } else {
                alert("Account not found in our database.");
                document.getElementById('continueBtn').innerText = "Continue";
            }
        } catch (error) {
            console.error("Form submission error:", error);
            alert("Database connection error. Please try again.");
            document.getElementById('continueBtn').innerText = "Continue";
        }
    });
</script>
</body>
</html>
