<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Disney+ Live Stream Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    #viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    /* 135% Scaling + -17.5% Offsets completely crops out all YouTube logos, titles, and controls */
    .iframe-wrapper {
      position: absolute;
      top: -17.5%;
      left: -17.5%;
      width: 135%;
      height: 135%;
      pointer-events: none;
    }

    .player-frame {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      transition: opacity 0.6s ease-in-out;
    }

    #playerA { z-index: 2; opacity: 1; }
    #playerB { z-index: 1; opacity: 0; }

    /* Invisible blocker prevents touching/clicking YouTube UI elements */
    .interaction-blocker {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 10;
      cursor: pointer;
    }

    /* Top TV Broadcast Overlay */
    .tv-broadcast-bar {
      position: absolute;
      top: clamp(15px, 3vh, 35px);
      left: clamp(15px, 4vw, 40px);
      right: clamp(15px, 4vw, 40px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
      pointer-events: none;
    }

    /* Zero-Background Title Container */
    .tv-ticker-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }

    .live-badge {
      background: #0072d2;
      color: #fff;
      font-size: clamp(10px, 1.2vw, 12px);
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    /* Clean Text with Heavy Drop Shadow */
    .tv-ticker-text {
      color: #ffffff;
      font-size: clamp(15px, 2.4vw, 22px);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 15px rgba(0, 0, 0, 0.9);
      transition: opacity 0.5s ease-in-out;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65vw;
      background: transparent !important;
    }

    /* Disney+ Logo */
    .disney-logo {
      height: clamp(32px, 4.5vw, 55px);
      filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.9));
    }

    /* Initial Click Overlay */
    #startOverlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle, rgba(15,24,48,0.96) 0%, rgba(5,7,12,0.98) 100%);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      cursor: pointer;
    }

    #startOverlay img { height: clamp(50px, 10vw, 85px); margin-bottom: 20px; }
    #startOverlay h1 { font-size: clamp(20px, 4vw, 32px); font-weight: 700; letter-spacing: 1.5px; }
    #startOverlay p { margin-top: 10px; color: #0072d2; font-size: clamp(12px, 1.8vw, 15px); font-weight: 600; letter-spacing: 1px; }

    /* Bottom Control Bar */
    .controls-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px 30px;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 40;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .controls-overlay.visible { opacity: 1; }

    .control-btn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      backdrop-filter: blur(8px);
      transition: background 0.2s, transform 0.1s;
    }

    .control-btn:hover { background: #0072d2; border-color: #0072d2; }
    .control-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

<div id="viewport">
  <!-- Disney+ Integrated TV Bar -->
  <div class="tv-broadcast-bar">
    <div class="tv-ticker-container">
      <div class="live-badge">LIVE</div>
      <div class="tv-ticker-text" id="tvTickerText">NOW: Loading...</div>
    </div>
    <img class="disney-logo" src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Disney+">
  </div>

  <!-- Dual Player Iframe Container -->
  <div class="iframe-wrapper">
    <div id="playerA" class="player-frame"></div>
    <div id="playerB" class="player-frame"></div>
  </div>

  <!-- Single Tap = Show Controls | Double Tap = Toggle Fullscreen -->
  <div class="interaction-blocker" onclick="handleInteractionClick(event)"></div>

  <!-- Start Overlay -->
  <div id="startOverlay" onclick="initializeAudioAndStart()">
    <img src="https://upload.wikimedia.org/wikipedia/commons/3/3e/Disney%2B_logo.svg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Disney+">
    <h1>JOIN LIVE STREAM</h1>
    <p>CLICK TO START BROADCAST</p>
  </div>

  <!-- Custom Controls Bar -->
  <div class="controls-overlay" id="controlsOverlay">
    <button class="control-btn" onclick="toggleMute()" id="muteBtn">MUTE</button>
    <button class="control-btn" onclick="toggleFullscreen()" id="fsBtn">FULLSCREEN</button>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728",
    storageBucket: "internal-systems-46728.firebasestorage.app",
    messagingSenderId: "172177452674",
    appId: "1:172177452674:web:155a2417da5531dd7ece9b",
    measurementId: "G-Y87B8VRQ1N"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();

  const urlParams = new URLSearchParams(window.location.search);
  const channelId = urlParams.get('watch') || 'main';

  let playerA, playerB;
  let activePlayer = 'A';
  let scheduleData = null;
  let prebufferTimer = null;
  let transitionTimer = null;
  let tickerTimer = null;
  let controlsHideTimeout = null;
  let isMuted = false;
  let lastTapTime = 0;

  let tickerState = 'NOW'; // Flips between NOW and NEXT every 20 seconds

  // Event Listeners for Fullscreen Changes to Update Button Label
  document.addEventListener('fullscreenchange', updateFullscreenButtonState);
  document.addEventListener('webkitfullscreenchange', updateFullscreenButtonState);

  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

  function onYouTubeIframeAPIReady() {
    fetchChannelSchedule();
  }

  async function fetchChannelSchedule() {
    try {
      const doc = await db.collection("channels").doc(channelId).get();
      if (!doc.exists) {
        document.getElementById('tvTickerText').innerText = `Channel '${channelId}' not found. Setup in 1.html first.`;
        return;
      }
      scheduleData = doc.data();
      initPlayers();
      startTickerLoop();
    } catch (e) {
      console.error(e);
      document.getElementById('tvTickerText').innerText = "Error loading live stream.";
    }
  }

  function calculatePlaybackState(schedule) {
    const now = Date.now();
    const elapsedSeconds = Math.floor((now - schedule.epochStartTime) / 1000);
    
    let cycleTime = elapsedSeconds % schedule.totalDuration;
    if (cycleTime < 0) cycleTime += schedule.totalDuration;

    let accumulatedTime = 0;
    for (let i = 0; i < schedule.videos.length; i++) {
      const video = schedule.videos[i];
      if (cycleTime >= accumulatedTime && cycleTime < (accumulatedTime + video.duration)) {
        const offset = cycleTime - accumulatedTime;
        const nextIndex = (i + 1) % schedule.videos.length;
        return {
          currentIndex: i,
          video: video,
          offset: offset,
          remaining: video.duration - offset,
          nextVideo: schedule.videos[nextIndex]
        };
      }
      accumulatedTime += video.duration;
    }
    return { currentIndex: 0, video: schedule.videos[0], offset: 0, remaining: schedule.videos[0].duration, nextVideo: schedule.videos[1] || schedule.videos[0] };
  }

  // 20-SECOND TICKER ALTERNATOR (NOW <-> NEXT)
  function updateTickerDisplay() {
    if (!scheduleData) return;
    const current = calculatePlaybackState(scheduleData);
    const tickerTextEl = document.getElementById('tvTickerText');

    tickerTextEl.style.opacity = '0';

    setTimeout(() => {
      if (tickerState === 'NOW') {
        tickerTextEl.innerText = "NOW: " + current.video.title;
      } else {
        tickerTextEl.innerText = "NEXT: " + current.nextVideo.title;
      }
      tickerTextEl.style.opacity = '1';
    }, 500);
  }

  function startTickerLoop() {
    updateTickerDisplay();
    clearInterval(tickerTimer);
    tickerTimer = setInterval(() => {
      tickerState = (tickerState === 'NOW') ? 'NEXT' : 'NOW';
      updateTickerDisplay();
    }, 20000); // 20 Seconds Delay
  }

  function initPlayers() {
    const current = calculatePlaybackState(scheduleData);

    playerA = new YT.Player('playerA', {
      videoId: current.video.id,
      playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0, 'iv_load_policy': 3, 'start': Math.floor(current.offset) },
      events: { 'onReady': (e) => e.target.playVideo() }
    });

    playerB = new YT.Player('playerB', {
      videoId: current.nextVideo.id,
      playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0, 'iv_load_policy': 3 },
      events: { 'onReady': () => setupNextPrebuffer(current) }
    });
  }

  function setupNextPrebuffer(current) {
    clearTimeout(prebufferTimer);
    clearTimeout(transitionTimer);

    const prebufferDelay = Math.max(0, (current.remaining - 10)) * 1000;
    prebufferTimer = setTimeout(() => {
      const state = calculatePlaybackState(scheduleData);
      const standbyPlayer = activePlayer === 'A' ? playerB : playerA;
      standbyPlayer.cueVideoById(state.nextVideo.id, 0);
    }, prebufferDelay);

    transitionTimer = setTimeout(() => {
      switchGaplessPlayer();
    }, current.remaining * 1000);
  }

  function switchGaplessPlayer() {
    const current = calculatePlaybackState(scheduleData);
    updateTickerDisplay();

    const currentPlayerObj = activePlayer === 'A' ? playerA : playerB;
    const nextPlayerObj = activePlayer === 'A' ? playerB : playerA;
    const currentFrame = document.getElementById(activePlayer === 'A' ? 'playerA' : 'playerB');
    const nextFrame = document.getElementById(activePlayer === 'A' ? 'playerB' : 'playerA');

    nextPlayerObj.playVideo();
    nextFrame.style.opacity = '1';
    nextFrame.style.zIndex = '2';

    currentFrame.style.opacity = '0';
    currentFrame.style.zIndex = '1';
    currentPlayerObj.pauseVideo();

    activePlayer = activePlayer === 'A' ? 'B' : 'A';

    setupNextPrebuffer(current);
  }

  function initializeAudioAndStart() {
    document.getElementById('startOverlay').style.display = 'none';
    if (playerA && playerA.playVideo) playerA.playVideo();
    if (playerB && playerB.playVideo) playerB.playVideo();
  }

  function toggleMute() {
    const p = activePlayer === 'A' ? playerA : playerB;
    if (!p) return;
    if (isMuted) {
      p.unMute();
      document.getElementById('muteBtn').innerText = "MUTE";
    } else {
      p.mute();
      document.getElementById('muteBtn').innerText = "UNMUTE";
    }
    isMuted = !isMuted;
  }

  // --- ENHANCED FULLSCREEN LOGIC ---
  function toggleFullscreen() {
    const docEl = document.documentElement;
    const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);

    if (!isFS) {
      // Enter Fullscreen
      if (docEl.requestFullscreen) {
        docEl.requestFullscreen().catch(err => console.log(err));
      } else if (docEl.webkitRequestFullscreen) {
        docEl.webkitRequestFullscreen();
      } else if (docEl.msRequestFullscreen) {
        docEl.msRequestFullscreen();
      }
      // Auto Lock to Landscape on Mobile
      if (screen.orientation && screen.orientation.lock) {
        screen.orientation.lock('landscape').catch(() => {});
      }
    } else {
      // Exit Fullscreen
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
      if (screen.orientation && screen.orientation.unlock) {
        screen.orientation.unlock();
      }
    }
  }

  function updateFullscreenButtonState() {
    const btn = document.getElementById('fsBtn');
    const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    if (btn) {
      btn.innerText = isFS ? "EXIT FULLSCREEN" : "FULLSCREEN";
    }
  }

  // Handle Double-Tap for Fullscreen & Single-Tap for Controls
  function handleInteractionClick(e) {
    const currentTime = Date.now();
    const tapLength = currentTime - lastTapTime;

    if (tapLength < 300 && tapLength > 0) {
      // Double Tap -> Toggle Fullscreen
      toggleFullscreen();
    } else {
      // Single Tap -> Show Controls
      toggleControls();
    }
    lastTapTime = currentTime;
  }

  function toggleControls() {
    const overlay = document.getElementById('controlsOverlay');
    overlay.classList.add('visible');
    clearTimeout(controlsHideTimeout);
    controlsHideTimeout = setTimeout(() => {
      overlay.classList.remove('visible');
    }, 4000);
  }
</script>
</body>
</html>
