<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Stream Player</title>
  <!-- HLS.js for .m3u8 streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Remix Icons for crisp media icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    .player-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    video, .yt-frame-container {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Touch Shield over YouTube to route touches/clicks through custom controls */
    .touch-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: transparent;
    }

    /* Top Metadata Overlay */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 100%);
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .channel-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge-live {
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .badge-live::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #fff;
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
    .stream-meta {
      display: flex;
      flex-direction: column;
    }
    .stream-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }
    .stream-channel {
      font-size: 0.85rem;
      color: #a1a1aa;
    }

    /* Bottom Player Controls */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 20px;
      background: linear-gradient(0deg, rgba(0,0,0,0.9) 0%, transparent 100%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    .progress-bar-container {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      background: #6366f1;
      width: 0%;
      border-radius: 3px;
      position: relative;
    }
    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .controls-left, .controls-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .ctrl-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      transition: background-color 0.2s;
    }
    .ctrl-btn:hover {
      background: rgba(255,255,255,0.1);
    }
    .volume-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .volume-slider {
      -webkit-appearance: none;
      width: 70px;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      outline: none;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
    }
    .time-stamp {
      font-size: 0.85rem;
      color: #d4d4d8;
    }

    /* Unmute / Autoplay Blocker Fallback */
    .unmute-box {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 14px 24px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #fff;
      backdrop-filter: blur(8px);
    }

    /* Hidden UI State */
    .controls-hidden {
      opacity: 0 !important;
      visibility: hidden !important;
    }
    .hidden {
      display: none !important;
    }

    /* Responsive Mobile Queries */
    @media (max-width: 768px) {
      .volume-group {
        display: none; /* Hide volume slider on mobile, hardware buttons handle this */
      }
      .stream-title {
        font-size: 0.95rem;
      }
      .top-bar {
        padding: 14px;
      }
      .bottom-bar {
        padding: 10px 14px;
      }
      .ctrl-btn {
        font-size: 1.25rem;
      }
    }
  </style>
</head>
<body>

<div class="player-wrapper" id="playerWrapper">
  
  <!-- Touch layer to toggle controls -->
  <div class="touch-shield" id="touchShield"></div>

  <!-- Video Engine Nodes -->
  <video id="hlsVideo" playsinline preload="auto" class="hidden"></video>
  <div id="ytContainer" class="yt-frame-container hidden"></div>

  <!-- Unmute Floating CTA -->
  <div id="unmutePrompt" class="unmute-box hidden">
    <i class="ri-volume-mute-fill"></i>
    <span>Tap to Unmute</span>
  </div>

  <!-- Overlay: Header Info -->
  <div class="top-bar" id="topBar">
    <div class="channel-info">
      <div class="badge-live">LIVE</div>
      <div class="stream-meta">
        <div class="stream-title" id="displayTitle">Fetching Stream...</div>
        <div class="stream-channel" id="displayChannel">Channel Feed</div>
      </div>
    </div>
  </div>

  <!-- Overlay: Footer Controls -->
  <div class="bottom-bar" id="bottomBar">
    <div class="progress-bar-container" id="progressBarContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    
    <div class="controls-row">
      <div class="controls-left">
        <button class="ctrl-btn" id="playBtn"><i class="ri-play-fill"></i></button>
        <div class="volume-group">
          <button class="ctrl-btn" id="muteBtn"><i class="ri-volume-up-line"></i></button>
          <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" />
        </div>
        <span class="time-stamp" id="timeDisplay">00:00:00</span>
      </div>

      <div class="controls-right">
        <button class="ctrl-btn" id="syncLiveBtn" title="Jump to sync live"><i class="ri-broadcast-line"></i></button>
        <button class="ctrl-btn" id="fullscreenBtn"><i class="ri-fullscreen-line"></i></button>
      </div>
    </div>
  </div>

</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728",
    storageBucket: "internal-systems-46728.firebasestorage.app",
    messagingSenderId: "172177452674",
    appId: "1:172177452674:web:155a2417da5531dd7ece9b",
    measurementId: "G-Y87B8VRQ1N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Setup References
  const params = new URLSearchParams(window.location.search);
  const channelSlug = params.get("channel");

  const wrapper = document.getElementById("playerWrapper");
  const touchShield = document.getElementById("touchShield");
  const hlsVideo = document.getElementById("hlsVideo");
  const ytContainer = document.getElementById("ytContainer");
  const topBar = document.getElementById("topBar");
  const bottomBar = document.getElementById("bottomBar");
  const playBtn = document.getElementById("playBtn");
  const muteBtn = document.getElementById("muteBtn");
  const volumeSlider = document.getElementById("volumeSlider");
  const fullscreenBtn = document.getElementById("fullscreenBtn");
  const syncLiveBtn = document.getElementById("syncLiveBtn");
  const displayTitle = document.getElementById("displayTitle");
  const displayChannel = document.getElementById("displayChannel");
  const timeDisplay = document.getElementById("timeDisplay");
  const progressBar = document.getElementById("progressBar");
  const unmutePrompt = document.getElementById("unmutePrompt");

  let hlsInstance = null;
  let ytPlayer = null;
  let activeMode = null; // 'movie' | 'tv'
  let isPlaying = false;
  let currentSlot = null;
  let channelSchedule = [];
  let controlsTimeout = null;

  // Auto Hide Overlay Logic
  function showControls() {
    topBar.classList.remove("controls-hidden");
    bottomBar.classList.remove("controls-hidden");
    clearTimeout(controlsTimeout);
    controlsTimeout = setTimeout(() => {
      if (isPlaying) {
        topBar.classList.add("controls-hidden");
        bottomBar.classList.add("controls-hidden");
      }
    }, 3500);
  }

  touchShield.addEventListener("mousemove", showControls);
  touchShield.addEventListener("click", () => {
    if (topBar.classList.contains("controls-hidden")) {
      showControls();
    } else {
      topBar.classList.add("controls-hidden");
      bottomBar.classList.add("controls-hidden");
    }
  });

  // Mobile Double-tap gesture (left: -10s, right: +10s)
  let lastTap = 0;
  touchShield.addEventListener("touchend", (e) => {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTap;
    if (tapLength < 300 && tapLength > 0) {
      const touchX = e.changedTouches[0].clientX;
      const screenWidth = window.innerWidth;
      if (touchX > screenWidth / 2) {
        seekRelative(10);
      } else {
        seekRelative(-10);
      }
    } else {
      showControls();
    }
    lastTap = currentTime;
  });

  function seekRelative(seconds) {
    if (activeMode === "movie") {
      hlsVideo.currentTime += seconds;
    } else if (ytPlayer && ytPlayer.getCurrentTime) {
      ytPlayer.seekTo(ytPlayer.getCurrentTime() + seconds, true);
    }
  }

  // Live Slot Calculation
  function timeToMinutes(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  }

  function getActiveSlot() {
    const now = new Date();
    const currentMinutes = now.getHours() * 60 + now.getMinutes();

    for (let slot of channelSchedule) {
      const start = timeToMinutes(slot.from);
      const end = timeToMinutes(slot.to);

      let isActive = start < end 
        ? currentMinutes >= start && currentMinutes < end
        : currentMinutes >= start || currentMinutes < end;

      if (isActive) {
        const elapsedMinutes = currentMinutes >= start 
          ? (currentMinutes - start) 
          : (1440 - start + currentMinutes);
        return { slot, elapsedSeconds: (elapsedMinutes * 60) + now.getSeconds() };
      }
    }
    return null;
  }

  // Synchronizer
  function checkScheduleSync() {
    const active = getActiveSlot();
    if (!active) {
      displayTitle.innerText = "Channel Off-Air";
      stopAll();
      return;
    }

    if (currentSlot && currentSlot.title === active.slot.title) return;
    
    currentSlot = active.slot;
    displayTitle.innerText = active.slot.title;
    stopAll();

    if (active.slot.type === "movie") {
      activeMode = "movie";
      hlsVideo.classList.remove("hidden");
      playMovie(active.slot.streamUrl, active.elapsedSeconds);
    } else {
      activeMode = "tv";
      ytContainer.classList.remove("hidden");
      playTV(active.slot.playlistId, active.slot.mode, active.slot.startIndex, active.elapsedSeconds);
    }
  }

  function stopAll() {
    if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
    hlsVideo.pause();
    hlsVideo.src = "";
    hlsVideo.classList.add("hidden");

    if (ytPlayer && ytPlayer.destroy) { ytPlayer.destroy(); ytPlayer = null; }
    ytContainer.innerHTML = "";
    ytContainer.classList.add("hidden");
  }

  // Players Management
  function playMovie(url, offset) {
    if (Hls.isSupported() && url.includes(".m3u8")) {
      hlsInstance = new Hls({ startPosition: offset });
      hlsInstance.loadSource(url);
      hlsInstance.attachMedia(hlsVideo);
      hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
        hlsVideo.play().catch(handleAutoplayBlock);
      });
    } else {
      hlsVideo.src = url;
      hlsVideo.currentTime = offset;
      hlsVideo.play().catch(handleAutoplayBlock);
    }
  }

  function playTV(playlistId, mode, startIndex, offset) {
    const tempDiv = document.createElement("div");
    tempDiv.id = "ytFrame";
    ytContainer.appendChild(tempDiv);

    ytPlayer = new YT.Player("ytFrame", {
      height: "100%",
      width: "100%",
      playerVars: {
        listType: "playlist",
        list: playlistId,
        autoplay: 1,
        index: startIndex || 0,
        start: offset,
        controls: 0,
        disablekb: 1,
        rel: 0
      },
      events: {
        onReady: (e) => {
          if (mode === "random") {
            e.target.setShuffle(true);
            e.target.nextVideo();
          }
          e.target.playVideo();
        },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.PLAYING) {
            isPlaying = true;
            updatePlayIcon(true);
          } else if (e.data === YT.PlayerState.PAUSED) {
            isPlaying = false;
            updatePlayIcon(false);
          }
        }
      }
    });
  }

  function handleAutoplayBlock() {
    unmutePrompt.classList.remove("hidden");
    hlsVideo.muted = true;
    hlsVideo.play();
  }

  unmutePrompt.addEventListener("click", () => {
    if (activeMode === "movie") {
      hlsVideo.muted = false;
    } else if (ytPlayer) {
      ytPlayer.unMute();
    }
    unmutePrompt.classList.add("hidden");
  });

  // UI Updates & Controls
  function updatePlayIcon(playing) {
    playBtn.innerHTML = playing ? '<i class="ri-pause-fill"></i>' : '<i class="ri-play-fill"></i>';
  }

  playBtn.addEventListener("click", () => {
    if (activeMode === "movie") {
      if (hlsVideo.paused) { hlsVideo.play(); updatePlayIcon(true); }
      else { hlsVideo.pause(); updatePlayIcon(false); }
    } else if (ytPlayer) {
      const state = ytPlayer.getPlayerState();
      if (state === 1) { ytPlayer.pauseVideo(); updatePlayIcon(false); }
      else { ytPlayer.playVideo(); updatePlayIcon(true); }
    }
  });

  hlsVideo.addEventListener("play", () => updatePlayIcon(true));
  hlsVideo.addEventListener("pause", () => updatePlayIcon(false));

  muteBtn.addEventListener("click", () => {
    if (activeMode === "movie") {
      hlsVideo.muted = !hlsVideo.muted;
      muteBtn.innerHTML = hlsVideo.muted ? '<i class="ri-volume-mute-fill"></i>' : '<i class="ri-volume-up-line"></i>';
    } else if (ytPlayer) {
      if (ytPlayer.isMuted()) {
        ytPlayer.unMute();
        muteBtn.innerHTML = '<i class="ri-volume-up-line"></i>';
      } else {
        ytPlayer.mute();
        muteBtn.innerHTML = '<i class="ri-volume-mute-fill"></i>';
      }
    }
  });

  volumeSlider.addEventListener("input", (e) => {
    const val = parseFloat(e.target.value);
    if (activeMode === "movie") {
      hlsVideo.volume = val;
    } else if (ytPlayer) {
      ytPlayer.setVolume(val * 100);
    }
  });

  fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      wrapper.requestFullscreen().catch(err => alert(err.message));
    } else {
      document.exitFullscreen();
    }
  });

  // Jump to actual live stream sync
  syncLiveBtn.addEventListener("click", () => {
    const active = getActiveSlot();
    if (!active) return;
    if (activeMode === "movie") {
      hlsVideo.currentTime = active.elapsedSeconds;
    } else if (ytPlayer) {
      ytPlayer.seekTo(active.elapsedSeconds, true);
    }
  });

  // Track progress & timer
  setInterval(() => {
    let curr = 0;
    let dur = 0;

    if (activeMode === "movie" && !hlsVideo.paused) {
      curr = hlsVideo.currentTime;
      dur = hlsVideo.duration || 1;
    } else if (activeMode === "tv" && ytPlayer && ytPlayer.getCurrentTime) {
      curr = ytPlayer.getCurrentTime();
      dur = ytPlayer.getDuration() || 1;
    }

    if (dur > 0) {
      progressBar.style.width = `${(curr / dur) * 100}%`;
      const date = new Date(curr * 1000).toISOString().substr(11, 8);
      timeDisplay.innerText = date;
    }
  }, 1000);

  // Firestore loader
  async function initChannel() {
    if (!channelSlug) {
      displayTitle.innerText = "No channel provided (?channel=SLUG)";
      return;
    }

    try {
      const snap = await getDoc(doc(db, "Live TV", channelSlug));
      if (!snap.exists()) {
        displayTitle.innerText = "Channel not found";
        return;
      }
      const data = snap.data();
      displayChannel.innerText = data.name || "Live Channel";
      channelSchedule = data.schedule || [];
      checkScheduleSync();
      setInterval(checkScheduleSync, 10000); // Verify live schedule periodically
    } catch (e) {
      console.error(e);
      displayTitle.innerText = "Error loading channel";
    }
  }

  // Load YouTube API
  const tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  document.body.appendChild(tag);

  window.onYouTubeIframeAPIReady = () => {
    initChannel();
  };
</script>
</body>
</html>
