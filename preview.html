<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Previewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1014;
            --blue-tag: #42a5f5;
            --text-dim: #a9a9a9;
            --white: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* 1. YouTube Trailer Section with "Branding Crop" */
        .hero {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden; /* This crops the YouTube UI */
        }

        #banner-img {
            position: absolute;
            width: 100%; height: 100%; object-fit: cover;
            z-index: 3;
            transition: opacity 1s ease-in-out;
        }

        /* The YouTube Wrapper scales the video up to push UI elements off-screen */
        #video-wrapper {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            z-index: 1;
        }

        #video-wrapper iframe {
            position: absolute;
            top: -10%; left: -10%; /* Move up/left to hide title and logo */
            width: 120%; height: 120%; /* Scale up to push UI out of view */
            pointer-events: none; /* Prevents users from clicking to see YouTube title */
        }

        .trailer-label {
            position: absolute; top: 15px; left: 15px;
            font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.4);
            z-index: 10;
        }

        .close-icon {
            position: absolute; top: 15px; right: 15px; font-size: 20px; z-index: 10; cursor: pointer;
        }

        /* 2. Main Centered Content */
        .content-body {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; padding: 0 20px;
            margin-top: 20px;
        }

        .main-logo {
            max-width: 180px; max-height: 90px;
            object-fit: contain; margin-bottom: 12px;
        }

        /* Blue Tags Section */
        .blue-tags {
            color: var(--blue-tag);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex; gap: 8px;
        }
        .blue-tags span::after { content: " •"; color: var(--text-dim); margin-left: 5px; }
        .blue-tags span:last-child::after { content: ""; }

        .meta-row {
            font-size: 13px; color: var(--text-dim);
            display: flex; gap: 10px; align-items: center; margin-bottom: 25px;
        }
        .age-rating {
            background: #3c3c3c; color: #fff; padding: 2px 6px;
            border-radius: 3px; font-weight: bold; font-size: 11px;
        }

        /* 3. Action Button */
        .btn-play {
            width: 100%; max-width: 380px;
            background: #e1e6f0; color: #000;
            border: none; padding: 14px; border-radius: 8px;
            font-size: 16px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-bottom: 25px; cursor: pointer;
        }
        .btn-play span.subtext { color: #666; font-weight: 400; font-size: 14px; margin-left: 5px; }

        /* 4. Details Section */
        .genres {
            font-size: 14px; font-weight: 500; color: #fff;
            margin-bottom: 12px;
        }
        .genres span { margin: 0 8px; color: #444; }

        .desc {
            font-size: 14px; color: var(--text-dim);
            line-height: 1.5; text-align: left; width: 100%;
            margin-bottom: 10px;
        }
        .air-time {
            font-weight: bold; font-size: 14px; text-align: left; width: 100%;
            margin-bottom: 30px;
        }

        /* 5. Icons Row */
        .action-row {
            display: flex; justify-content: space-around; width: 100%;
            max-width: 300px; padding-bottom: 40px;
        }
        .action-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 11px; color: var(--text-dim); gap: 10px;
        }
        .action-item i { font-size: 22px; color: #fff; font-style: normal; }

    </style>
</head>
<body>

<div id="previewer">
    <!-- Banner & Cropped Video Area -->
    <div class="hero">
        <div class="trailer-label">TRAILER</div>
        <div class="close-icon">✕</div>
        <img id="banner-img" src="" alt="Loading...">
        <div id="video-wrapper">
            <!-- Iframe injected here -->
        </div>
    </div>

    <!-- Centered Info -->
    <div class="content-body">
        <img id="logo-img" class="main-logo" src="" alt="">
        
        <div class="blue-tags" id="blue-tags">
            <!-- Grand Premiere • New Release -->
        </div>

        <div class="meta-row" id="meta-row">
            <!-- Dynamically Loaded Meta -->
        </div>

        <button class="btn-play">
            <span style="font-size: 18px;">▶</span> 
            <span id="btn-label">Watch Now</span> 
            <span id="btn-subtext" class="subtext"></span>
        </button>

        <div class="genres" id="genres-row"></div>
        <div class="desc" id="description"></div>
        <div class="air-time" id="air-time"></div>

        <div class="action-row">
            <div class="action-item"><i>＋</i> Watchlist</div>
            <div class="action-item"><i>➦</i> Share</div>
            <div class="action-item"><i>♡</i> Rate</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
        authDomain: "internal-systems-46728.firebaseapp.com",
        projectId: "internal-systems-46728",
        storageBucket: "internal-systems-46728.firebasestorage.app",
        messagingSenderId: "172177452674",
        appId: "1:172177452674:web:155a2417da5531dd7ece9b",
        measurementId: "G-Y87B8VRQ1N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const watchId = urlParams.get('watch');

    async function init() {
        if(!watchId) return;
        const snap = await getDoc(doc(db, "Live TV", watchId));
        if(snap.exists()) render(snap.data());
    }

    function render(data) {
        document.getElementById('banner-img').src = data.Banner;
        document.getElementById('logo-img').src = data.Logo;
        document.getElementById('description').innerText = data.Description;

        // Blue Tags
        const blueTags = document.getElementById('blue-tags');
        blueTags.innerHTML = `<span>Grand Premiere</span> <span>New Release</span>`;

        // Meta Data
        document.getElementById('meta-row').innerHTML = `
            <span>2026</span>
            <span class="age-rating">${data['Age Rating'] || 'U/A 13+'}</span>
            <span>5 Languages</span>
        `;

        // Genres Row
        if(data.Genres) {
            document.getElementById('genres-row').innerHTML = data.Genres.split(',').join(' <span>|</span> ');
        }

        // Action Button
        const label = document.getElementById('btn-label');
        const sub = document.getElementById('btn-subtext');
        if(data.Type === 'Series') {
            label.innerText = "Watch Latest Episode";
            sub.innerText = "15 Aug";
            document.getElementById('air-time').innerText = "New Episode Sat-Sun at 8:00PM";
        }

        // YouTube Trailer Logic (3 Second Delay)
        setTimeout(() => {
            // Using "Stream" field for the YouTube URL based on previous prompt
            const ytUrl = data.Stream || "";
            if (ytUrl.includes('youtube') || ytUrl.includes('youtu.be')) {
                const videoWrapper = document.getElementById('video-wrapper');
                const banner = document.getElementById('banner-img');
                
                let vidId = ytUrl.split('v=')[1] || ytUrl.split('/').pop();
                
                // Construct Iframe with parameters to hide as much as possible
                // controls=0, disablekb=1, rel=0
                videoWrapper.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1" 
                        frameborder="0" 
                        allow="autoplay">
                    </iframe>`;
                
                videoWrapper.style.display = 'block';
                banner.style.opacity = '0';
            }
        }, 3000);
    }

    init();
</script>

</body>
    </html>
