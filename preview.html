<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Preview - Hotstar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.youtube.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api" async></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --surface-bg: #12151e;
      --card-bg: #151821;
      --accent-blue: #1480f0;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --border-hover: rgba(255, 255, 255, 0.24);
      --live-red: #e50914;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* Sticky Top Header on Scroll */
    .sticky-top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      transition: background-color 0.28s ease, backdrop-filter 0.28s ease, border-color 0.28s ease;
      border-bottom: 1px solid transparent;
      pointer-events: none;
    }
    .sticky-top-nav.scrolled {
      background: rgba(9, 10, 15, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom-color: var(--border-color);
      pointer-events: auto;
    }

    .sticky-nav-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .sticky-top-nav.scrolled .sticky-nav-title {
      opacity: 1;
      transform: translateY(0);
    }

    .nav-close-btn {
      background: rgba(15, 16, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      pointer-events: auto;
      margin-left: auto;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), background 0.18s ease, border-color 0.18s ease;
    }
    @media (hover: hover) {
      .nav-close-btn:hover {
        background: rgba(255, 255, 255, 0.16);
        border-color: rgba(255, 255, 255, 0.35);
      }
    }
    .nav-close-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.22); }
    .nav-close-btn svg { width: 20px; height: 20px; fill: #fff; }

    /* ==========================================================
       SKELETON LOADER (FAST & SMOOTH FEEL)
       ========================================================== */
    .loader-wrap {
      width: 100%;
      min-height: 100vh;
      padding: 90px 48px 50px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: radial-gradient(circle at 75% 30%, rgba(20, 128, 240, 0.08), transparent 55%), var(--bg-color);
    }
    .skeleton-box {
      background: linear-gradient(90deg, #131620 25%, #1c2130 50%, #131620 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 10px;
    }
    .sk-logo { width: 260px; height: 74px; margin-bottom: 20px; }
    .sk-meta { width: 220px; height: 18px; margin-bottom: 16px; border-radius: 6px; }
    .sk-desc { width: 460px; max-width: 100%; height: 64px; margin-bottom: 24px; }
    .sk-btns { display: flex; gap: 12px; }
    .sk-btn-lg { width: 190px; height: 52px; }
    .sk-btn-sq { width: 52px; height: 52px; }
    .loader-error-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 16px;
      font-weight: 600;
      margin: auto;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    @media (max-width: 899px) {
      .loader-wrap { padding: 16px; justify-content: flex-start; }
      .sk-logo { width: 100%; height: 220px; border-radius: 18px; }
      .sk-meta, .sk-desc { margin-inline: auto; }
      .sk-btns { justify-content: center; }
    }

    /* Smooth Reveal for Main Content */
    #previewMain {
      animation: fadeInPage 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==========================================================
       HERO BILLBOARD SECTION
       ========================================================== */
    .hero-billboard-wrap {
      position: relative;
      width: 100%;
      min-height: 84vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 96px 48px 56px;
      overflow: hidden;
    }

    @media (max-width: 899px) {
      .hero-billboard-wrap {
        min-height: auto;
        flex-direction: column;
        padding: 14px 16px 24px;
      }
    }

    /* Background Media Box */
    .hero-media-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0c13;
      overflow: hidden;
      z-index: 1;
    }

    @media (max-width: 899px) {
      .hero-media-box {
        position: relative;
        aspect-ratio: 16/9.5;
        border-radius: 18px;
        margin-bottom: 22px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
      }
    }

    .hero-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center right;
      transition: opacity 0.65s ease, transform 6s ease-out;
      will-change: opacity, transform;
    }

    .hero-trailer-host {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.65s ease;
      background: #000;
      overflow: hidden;
      will-change: opacity;
    }
    .hero-trailer-host.playing { opacity: 1; }
    .hero-trailer-host iframe {
      width: calc(100% + 140px) !important;
      height: calc(100% + 160px) !important;
      position: absolute !important;
      top: -80px !important;
      left: -70px !important;
      pointer-events: none;
      border: none;
    }
    .hero-trailer-host video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Hotstar Left & Bottom Dark Vignette Overlay */
    .hero-desktop-gradient {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(90deg, #090a0f 0%, rgba(9, 10, 15, 0.94) 36%, rgba(9, 10, 15, 0.62) 60%, rgba(9, 10, 15, 0.15) 85%, transparent 100%),
        linear-gradient(0deg, #090a0f 0%, rgba(9, 10, 15, 0.72) 18%, transparent 48%),
        linear-gradient(180deg, rgba(9, 10, 15, 0.5) 0%, transparent 20%);
      pointer-events: none;
      z-index: 2;
    }

    @media (max-width: 899px) {
      .hero-desktop-gradient {
        background: linear-gradient(180deg, rgba(9, 10, 15, 0.2) 0%, transparent 40%, rgba(9, 10, 15, 0.85) 100%);
      }
    }

    /* Top Left Trailer Text */
    .trailer-status-text {
      position: absolute;
      top: 26px;
      left: 48px;
      color: rgba(255, 255, 255, 0.92);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
      z-index: 10;
      display: none;
      align-items: center;
      gap: 6px;
    }
    @media (max-width: 899px) {
      .trailer-status-text {
        top: 14px;
        left: 16px;
      }
    }

    /* Sound Mute Toggle */
    .mute-toggle-btn {
      position: absolute;
      bottom: 28px;
      right: 48px;
      background: rgba(15, 17, 26, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.22);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.18s ease, background 0.18s ease;
    }
    @media (max-width: 899px) {
      .mute-toggle-btn {
        bottom: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
      }
    }
    @media (hover: hover) {
      .mute-toggle-btn:hover { background: rgba(255, 255, 255, 0.18); transform: scale(1.06); }
    }
    .mute-toggle-btn:active { transform: scale(0.92); }
    .mute-toggle-btn svg { width: 18px; height: 18px; fill: #fff; }

    /* Foreground Content Box */
    .billboard-foreground-content {
      position: relative;
      z-index: 5;
      max-width: 590px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    @media (max-width: 899px) {
      .billboard-foreground-content {
        max-width: 100%;
        align-items: center;
        text-align: center;
        padding: 0 6px;
      }
    }

    /* Logo & Title */
    .brand-logo-img {
      max-width: 340px;
      max-height: 128px;
      object-fit: contain;
      object-position: left center;
      margin-bottom: 18px;
      filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.85));
    }
    @media (max-width: 899px) {
      .brand-logo-img {
        object-position: center;
        max-width: 240px;
        max-height: 92px;
        margin-bottom: 14px;
      }
    }

    .title-fallback-text {
      font-size: 46px;
      font-weight: 900;
      line-height: 1.12;
      margin-bottom: 14px;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.95);
      letter-spacing: -0.6px;
    }
    @media (max-width: 899px) {
      .title-fallback-text { font-size: 30px; }
    }

    /* Metadata Line */
    .meta-pills-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px;
      font-size: 14.5px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 14px;
      letter-spacing: 0.2px;
    }
    @media (max-width: 899px) {
      .meta-pills-row { justify-content: center; }
    }
    .meta-pills-row span.sep {
      color: var(--text-muted);
      font-size: 11px;
    }
    .meta-badge-pill {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* Description */
    .description-para {
      font-size: 15px;
      line-height: 1.6;
      color: rgba(226, 232, 240, 0.92);
      margin-bottom: 16px;
      max-width: 540px;
      font-weight: 400;
    }

    /* Tags / Genres with Pipes */
    .genres-tags-line {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
    }
    .genres-tags-line span.pipe {
      color: rgba(148, 163, 184, 0.55);
      margin: 0 8px;
      font-weight: 400;
    }

    /* Action Buttons Row */
    .actions-row-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    @media (max-width: 899px) {
      .actions-row-container { justify-content: center; width: 100%; }
    }

    /* Hotstar Blue-to-Magenta CTA Button */
    .btn-hotstar-cta {
      height: 52px;
      padding: 0 30px;
      border-radius: 10px;
      background: linear-gradient(95deg, #0976f8 0%, #0d6efd 42%, #cc097c 100%);
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), filter 0.18s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 24px rgba(10, 120, 250, 0.35);
      will-change: transform;
    }
    @media (hover: hover) {
      .btn-hotstar-cta:hover {
        transform: translateY(-1px) scale(1.02);
        filter: brightness(1.08);
        box-shadow: 0 10px 28px rgba(10, 120, 250, 0.48);
      }
    }
    .btn-hotstar-cta:active {
      transform: scale(0.97);
      filter: brightness(0.92);
    }
    .btn-hotstar-cta svg { width: 18px; height: 18px; fill: currentColor; }

    .btn-hotstar-secondary {
      height: 52px;
      padding: 0 20px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.18s ease;
    }
    @media (hover: hover) {
      .btn-hotstar-secondary:hover { background: rgba(255, 255, 255, 0.18); transform: translateY(-1px); }
    }
    .btn-hotstar-secondary:active { background: rgba(255, 255, 255, 0.24); transform: scale(0.97); }
    .btn-hotstar-secondary svg { width: 17px; height: 17px; fill: currentColor; }

    /* Square Companion Buttons ([ + ] Watchlist & Share) */
    .btn-square-companion {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.16s ease, color 0.18s ease, border-color 0.18s ease;
    }
    @media (hover: hover) {
      .btn-square-companion:hover {
        background: rgba(255, 255, 255, 0.18);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
      }
    }
    .btn-square-companion:active {
      transform: scale(0.93);
      background: rgba(255, 255, 255, 0.22);
    }
    .btn-square-companion svg { width: 22px; height: 22px; fill: currentColor; }
    .btn-square-companion.active {
      background: rgba(20, 128, 240, 0.24);
      border-color: var(--accent-blue);
      color: #5ab0ff;
    }

    @keyframes bouncePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.28) rotate(-8deg); }
      75% { transform: scale(0.92) rotate(4deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .btn-square-companion.animating svg {
      animation: bouncePop 0.38s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Lower Flow (Episodes & More Like This) */
    .lower-content-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1360px;
      margin: 28px auto 64px;
      padding: 0 48px;
    }
    @media (max-width: 899px) {
      .lower-content-container {
        padding: 0 16px;
        margin: 18px auto 44px;
      }
    }

    .section-container {
      width: 100%;
      margin-bottom: 38px;
      text-align: left;
    }
    .section-heading {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #fff;
      letter-spacing: -0.2px;
    }

    /* TV Show Episodes List */
    .episodes-wrapper { display: none; }
    .season-tab-row {
      display: flex;
      gap: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .season-tab-row::-webkit-scrollbar { display: none; }
    .season-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      padding-bottom: 6px;
      transition: color 0.18s ease;
    }
    .season-btn:hover { color: #e2e8f0; }
    .season-btn.active { color: #fff; }
    .season-btn.active::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 0;
      right: 0;
      height: 2.5px;
      border-radius: 2px;
      background: var(--accent-blue);
    }

    .episodes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .ep-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid transparent;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: background 0.18s ease, border-color 0.18s ease, transform 0.15s ease;
    }
    @media (hover: hover) {
      .ep-card:hover {
        background: rgba(255, 255, 255, 0.065);
        border-color: var(--border-color);
      }
    }
    .ep-card:active { background: rgba(255, 255, 255, 0.09); transform: scale(0.99); }
    .ep-thumb-wrap {
      position: relative;
      width: 146px;
      min-width: 146px;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #151821;
    }
    @media (max-width: 540px) {
      .ep-thumb-wrap { width: 124px; min-width: 124px; }
    }
    .ep-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .ep-play-circle {
      position: absolute;
      bottom: 6px;
      left: 6px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ep-play-circle svg { width: 12px; height: 12px; fill: #fff; margin-left: 1px; }

    .ep-info { flex: 1; min-width: 0; }
    .ep-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-subtext {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .view-more-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 144px;
      margin: 18px auto 6px;
      padding: 10px 20px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s ease, border-color 0.18s ease;
    }
    @media (hover: hover) {
      .view-more-btn:hover { background: #1e2330; border-color: var(--border-hover); }
    }

    /* 16:9 Recommendations */
    .rec-scroll-row {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      padding: 4px 2px 14px;
      scrollbar-width: none;
    }
    .rec-scroll-row::-webkit-scrollbar { display: none; }

    .rec-16-9-card {
      min-width: 244px;
      width: 244px;
      scroll-snap-align: start;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
    }
    @media (max-width: 540px) {
      .rec-16-9-card { min-width: 204px; width: 204px; }
    }
    @media (hover: hover) {
      .rec-16-9-card:hover { transform: scale(1.035); }
      .rec-16-9-card:hover .rec-16-9-thumb { border-color: rgba(255, 255, 255, 0.35); box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55); }
    }
    .rec-16-9-card:active { transform: scale(0.96); }
    
    .rec-16-9-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      margin-bottom: 9px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .rec-16-9-thumb img { width: 100%; height: 100%; object-fit: cover; }
    
    .rec-title {
      font-size: 14.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast-box {
      position: fixed;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(21, 24, 33, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      <!-- Foreground Content Box -->

    </div>

  </div>

  <div class="toast-box" id="toastAlert"></div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, updateDoc, arrayUnion, arrayRemove, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Content Database (internal-systems-46728)
    const contentConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };
    const contentApp = initializeApp(contentConfig, "contentApp");
    const contentDb = getFirestore(contentApp);

    // 2. User Database (question-metabase)
    const userConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase",
      storageBucket: "question-metabase.firebasestorage.app",
      messagingSenderId: "770698198753",
      appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
      measurementId: "G-6ZP1FPMKSJ"
    };
    const userApp = initializeApp(userConfig, "userApp");
    const userDb = getFirestore(userApp);

    // State
    let currentItem = null;
    let contentType = 'movie'; 
    let currentCollection = 'Movies';
    let currentUser = null;
    let userDocRef = null;
    let userProfiles = null;
    let activeProfileIndex = -1;
    let userWatchlist = [];
    let userAuthorizedStudios = new Set();
    let hasAccess = false;
    let trailerTimeout = null;
    let ytTrailerPlayer = null;
    let currentSeasonKey = null;
    let showAllEpisodes = false;
    let isMuted = true;
    let toastTimer = null;

    const urlParams = new URLSearchParams(window.location.search);
    const contentId = urlParams.get('preview') || urlParams.get('watch');

    // Smooth rAF-throttled scroll handler
    let scrollTicking = false;
    window.addEventListener('scroll', () => {
      if (!scrollTicking) {
        window.requestAnimationFrame(() => {
          const topNav = document.getElementById('stickyTopNav');
          if (window.scrollY > 90) {
            topNav.classList.add('scrolled');
          } else {
            topNav.classList.remove('scrolled');
          }
          scrollTicking = false;
        });
        scrollTicking = true;
      }
    }, { passive: true });

    function showToast(msg) {
      const toast = document.getElementById('toastAlert');
      toast.innerText = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function safeUrl(url) {
      if (!url) return '';
      return String(url).trim().replace(/^http:\/\//i, 'https://');
    }

    // Horizontal Banner resolver (Strictly uses Banner, NOT Poster.h)
    function getHorizontalImage(c) {
      if (!c) return '';
      return safeUrl(c.Banner || c.banner || c.Poster || c["Poster.v"] || '');
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      try {
        const u = new URL(url.trim());
        if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0];
        if (u.hostname.includes('youtube.com') || u.hostname.includes('m.youtube.com')) {
          if (u.pathname === '/watch') return u.searchParams.get('v');
          if (u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
          if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
        }
      } catch (e) {
        if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) return url.trim();
      }
      return null;
    }

    // Resolve which Profile inside UARM.Profiles is currently active
    function resolveActiveProfileIndex(profiles, uData) {
      if (!Array.isArray(profiles) || profiles.length === 0) return -1;

      // 1. Check explicit index stored in localStorage or user object
      const storedIdx = localStorage.getItem('active_profile_index') ?? localStorage.getItem('profile_index');
      if (storedIdx !== null && storedIdx !== '' && !Number.isNaN(Number(storedIdx))) {
        const idx = Number(storedIdx);
        if (profiles[idx]) return idx;
      }

      if (typeof currentUser?.activeProfileIndex === 'number' && profiles[currentUser.activeProfileIndex]) {
        return currentUser.activeProfileIndex;
      }

      // 2. Check active_profile / selected_profile object or string in localStorage
      const rawProfile = localStorage.getItem('active_profile') || localStorage.getItem('selected_profile') || localStorage.getItem('current_profile');
      if (rawProfile) {
        try {
          const parsed = JSON.parse(rawProfile);
          if (parsed && typeof parsed === 'object') {
            const matchIdx = profiles.findIndex(p =>
              (parsed.Name && p.Name === parsed.Name) ||
              (parsed.Avatar && p.Avatar === parsed.Avatar)
            );
            if (matchIdx !== -1) return matchIdx;
          }
        } catch (e) {
          const matchByName = profiles.findIndex(p => p.Name === rawProfile);
          if (matchByName !== -1) return matchByName;
        }
      }

      // 3. Fallback to first Hotstar profile, or index 0
      const hotstarIdx = profiles.findIndex(p => String(p?.App || '').toLowerCase() === 'hotstar');
      return hotstarIdx !== -1 ? hotstarIdx : 0;
    }

    // Sync userWatchlist state from UARM data (supports Profiles[i].Watchlist + top-level fallback)
    function extractWatchlistFromUserData(uData) {
      if (!uData) return [];
      if (Array.isArray(uData.Profiles) && uData.Profiles.length > 0) {
        userProfiles = uData.Profiles;
        activeProfileIndex = resolveActiveProfileIndex(uData.Profiles, uData);
        const activeProf = uData.Profiles[activeProfileIndex];
        if (activeProf && Array.isArray(activeProf.Watchlist)) {
          return [...activeProf.Watchlist];
        }
        return [];
      }
      userProfiles = null;
      activeProfileIndex = -1;
      return Array.isArray(uData.Watchlist) ? [...uData.Watchlist] : [];
    }

    // Load User Plan, Active Profile Watchlist & Subscribed Studios
    async function loadUserSubscriptionPlan() {
      try {
        const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
        currentUser = stored ? JSON.parse(stored) : null;
      } catch (e) { currentUser = null; }

      if (!currentUser) return;

      userWatchlist = extractWatchlistFromUserData(currentUser);

      try {
        let uData = null;

        if (currentUser.Lotus) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Lotus", "==", currentUser.Lotus)));
          if (!snap.empty) {
            userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            uData = snap.docs[0].data();
          }
        } else if (currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id) {
          const uId = currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id;
          userDocRef = doc(userDb, "UARM", uId);
          const snap = await getDoc(userDocRef);
          if (snap.exists()) uData = snap.data();
        } else if (currentUser.Email) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Email", "==", currentUser.Email)));
          if (!snap.empty) {
            userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            uData = snap.docs[0].data();
          }
        }

        if (uData) {
          userWatchlist = extractWatchlistFromUserData(uData);
          currentUser = { ...currentUser, ...uData };
          localStorage.setItem('active_user', JSON.stringify(currentUser));
        }

        const userPlanIds = Array.isArray(currentUser.Plans) ? currentUser.Plans : (currentUser.Plan ? [currentUser.Plan] : []);

        const planPromises = userPlanIds.map(async (planId) => {
          if (!planId) return;
          try {
            let pSnap = await getDoc(doc(userDb, "Plans & Subscriptions", planId));
            if (!pSnap.exists()) {
              pSnap = await getDoc(doc(userDb, "Plans & Subscription", planId));
            }
            if (pSnap.exists()) {
              const pData = pSnap.data();
              const studios = Array.isArray(pData.Studio) ? pData.Studio : (pData.Studios || []);
              studios.forEach(s => userAuthorizedStudios.add(String(s).trim().toLowerCase()));
            }
          } catch (err) {}
        });

        await Promise.all(planPromises);
      } catch (err) {}
    }

    // Access Check (Studio, Partner, Channel)
    function checkContentAccess(content) {
      if (!content) return false;
      const contentStudio = String(content.Studio || content.Partner || content.Channel || content["Channel"] || '').trim().toLowerCase();

      if (!contentStudio || contentStudio === 'free' || contentStudio === 'open') return true;
      if (userAuthorizedStudios.has(contentStudio)) return true;

      for (const authStudio of userAuthorizedStudios) {
        if (contentStudio.includes(authStudio) || authStudio.includes(contentStudio)) {
          return true;
        }
      }
      return false;
    }

    // Parallel Search across all collections (up to 6x faster)
    async function fetchContentData(id) {
      if (!id) {
        document.getElementById('loader').innerHTML = `<div class="loader-error-msg">No content ID specified.</div>`;
        return null;
      }

      const collections = ["Movies", "TV Shows", "Shows", "Live TV", "Digital-Feed", "Sports"];
      const snaps = await Promise.all(
        collections.map(async (col) => {
          try {
            const snap = await getDoc(doc(contentDb, col, id));
            if (snap.exists()) return { col, data: snap.data() };
          } catch (e) {}
          return null;
        })
      );

      const found = snaps.find(Boolean);
      if (!found) {
        document.getElementById('loader').innerHTML = `<div class="loader-error-msg">Content "${id}" not found.</div>`;
        return null;
      }

      currentCollection = found.col;
      currentItem = { id, ...found.data };

      const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
      if (currentCollection === "TV Shows" || currentCollection === "Shows" || seasons.length > 0) {
        contentType = 'show';
        currentSeasonKey = seasons[0] || 'Season 1';
      } else if (currentCollection === "Movies") {
        contentType = 'movie';
      } else {
        contentType = 'live';
      }

      return currentItem;
    }

    function renderPreviewUI() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('previewMain').style.display = 'block';

      const showName = currentItem.Name || currentItem.Title || "";
      document.getElementById('stickyNavTitle').innerText = showName;
      if (showName) document.title = `${showName} - Hotstar`;

      // 1. Banner (Strictly Banner, not Poster.h)
      const bannerImg = document.getElementById('heroBanner');
      const primaryBanner = getHorizontalImage(currentItem);
      const secondaryBanner = safeUrl(currentItem.Poster || currentItem["Poster.v"] || '');

      bannerImg.src = primaryBanner;
      bannerImg.onerror = () => {
        if (secondaryBanner && bannerImg.src !== secondaryBanner) {
          bannerImg.src = secondaryBanner;
        }
      };

      // 2. Real Logo from Document (or Name)
      const logoImg = document.getElementById('contentLogo');
      const titleFallback = document.getElementById('contentTitle');
      const logoUrl = safeUrl(currentItem.Logo || currentItem["Logo.png"] || '');

      if (logoUrl) {
        logoImg.src = logoUrl;
        logoImg.style.display = 'block';
        titleFallback.style.display = 'none';
        logoImg.onerror = () => {
          logoImg.style.display = 'none';
          if (showName) {
            titleFallback.innerText = showName;
            titleFallback.style.display = 'block';
          }
        };
      } else if (showName) {
        logoImg.style.display = 'none';
        titleFallback.innerText = showName;
        titleFallback.style.display = 'block';
      }

      // 3. Exact Metadata from Document
      const metaRow = document.getElementById('metaPillsRow');
      const metaParts = [];

      const releaseYear = currentItem.Release_Date || currentItem.Release_date || currentItem["Release Date"] || currentItem.Year || currentItem["Release Year"];
      if (releaseYear) metaParts.push(`<span>${releaseYear}</span>`);

      const age = currentItem.Age_Rating || currentItem["Age Rating"] || currentItem.AgeRating;
      if (age) metaParts.push(`<span class="meta-badge-pill">${age}</span>`);

      if (contentType === 'show') {
        const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
        if (seasons.length > 0) {
          metaParts.push(`<span>${seasons.length} Season${seasons.length > 1 ? 's' : ''}</span>`);
        }
      }

      const duration = currentItem.Duration || currentItem.duration || currentItem.Runtime || currentItem.runtime;
      if (duration) metaParts.push(`<span>${duration}</span>`);

      const lang = Array.isArray(currentItem.Language) ? currentItem.Language.join(', ') : currentItem.Language;
      if (lang) metaParts.push(`<span>${lang}</span>`);

      const rating = currentItem.Rating || currentItem.rating || currentItem.IMDb || currentItem.imdb;
      if (rating) metaParts.push(`<span>★ ${rating}</span>`);

      metaRow.innerHTML = metaParts.join(' <span class="sep">•</span> ');

      // 4. Description
      const descEl = document.getElementById('contentDescription');
      const desc = currentItem.Discription || currentItem.Description || currentItem.description || '';
      if (desc) {
        descEl.innerText = desc;
        descEl.style.display = 'block';
      } else {
        descEl.style.display = 'none';
      }

      // 5. Tags / Genres with Pipes
      const tagsEl = document.getElementById('genresTagsLine');
      const rawTags = currentItem.Tags || currentItem.Genres || currentItem.Channel || '';
      if (rawTags) {
        const tagItems = (Array.isArray(rawTags) ? rawTags : String(rawTags).split(/[,/|]+/)).map(t => t.trim()).filter(Boolean);
        if (tagItems.length > 0) {
          tagsEl.innerHTML = tagItems.join(' <span class="pipe">|</span> ');
          tagsEl.style.display = 'block';
        } else {
          tagsEl.style.display = 'none';
        }
      } else {
        tagsEl.style.display = 'none';
      }

      // 6. Action Buttons
      renderCTAButtons();

      // 7. Watchlist state
      updateWatchlistButtonState();

      // 8. TV Shows Episodes
      if (contentType === 'show') {
        renderEpisodesSection();
      } else {
        document.getElementById('episodesSection').style.display = 'none';
      }
    }

    function renderCTAButtons() {
      const ctaBox = document.getElementById('ctaContainer');
      ctaBox.innerHTML = '';

      let primaryBtnHtml = '';

      if (!hasAccess) {
        const studioParam = currentItem.Studio || currentItem.Channel || currentItem.Partner || '';
        primaryBtnHtml = `
          <a class="btn-hotstar-cta" href="1.html?action=subscribe&studio=${encodeURIComponent(studioParam)}">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <span>Subscribe to Watch</span>
          </a>
        `;
      } else {
        let resumeKey = currentItem.id;
        if (contentType === 'show' && currentSeasonKey) {
          resumeKey = `${currentItem.id}_${currentSeasonKey}_ep0`;
        }
        const savedTime = parseFloat(localStorage.getItem(`progress_${resumeKey}`) || '0');
        const hasWatchedBefore = savedTime > 15;

        if (hasWatchedBefore && contentType !== 'live') {
          const subLabel = contentType === 'show' ? 'Continue' : 'Resume';
          primaryBtnHtml = `
            <a class="btn-hotstar-cta" href="1.html?watch=${currentItem.id}&action=resume">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <span>${subLabel}</span>
            </a>
            <a class="btn-hotstar-secondary" href="1.html?watch=${currentItem.id}&action=starting" title="Watch from Beginning">
              <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
              <span>Beginning</span>
            </a>
          `;
        } else {
          let label = "Watch Movie";
          if (contentType === 'show') {
            label = "Watch Show";
          } else if (contentType === 'live') {
            label = "Watch Live";
          }

          primaryBtnHtml = `
            <a class="btn-hotstar-cta" href="1.html?watch=${currentItem.id}&action=starting">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <span>${label}</span>
            </a>
          `;
        }
      }

      ctaBox.innerHTML = `
        ${primaryBtnHtml}
        <button class="btn-square-companion" id="btnWatchlist" title="Add to Watchlist">
          <svg id="wlIcon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </button>
        <button class="btn-square-companion" id="btnShare" title="Share Content">
          <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
        </button>
      `;

      attachActionListeners();
    }

    function scheduleTrailerPlayback() {
      const trailerStatusText = document.getElementById('trailerStatusText');
      const host = document.getElementById('heroTrailerHost');
      const trailerUrl = safeUrl(currentItem.Trailer || '');

      clearTimeout(trailerTimeout);
      trailerTimeout = setTimeout(() => {
        if (!trailerUrl) {
          trailerStatusText.innerText = "TRAILER UNAVAILABLE";
          trailerStatusText.style.display = "flex";
          return;
        }

        const ytId = extractYouTubeId(trailerUrl);

        if (ytId && typeof YT !== 'undefined' && YT.Player) {
          host.innerHTML = `<div id="ytTrailerActualPlayer"></div>`;
          host.classList.add('playing');
          trailerStatusText.innerText = "TRAILER";
          trailerStatusText.style.display = "flex";

          ytTrailerPlayer = new YT.Player('ytTrailerActualPlayer', {
            videoId: ytId,
            playerVars: {
              autoplay: 1,
              controls: 0,
              disablekb: 1,
              fs: 0,
              rel: 0,
              modestbranding: 1,
              showinfo: 0,
              iv_load_policy: 3,
              mute: isMuted ? 1 : 0,
              playsinline: 1
            },
            events: {
              onReady: (e) => e.target.playVideo(),
              onStateChange: (e) => {
                if (e.data === YT.PlayerState.ENDED) {
                  host.classList.remove('playing');
                  trailerStatusText.style.display = 'none';
                  try { ytTrailerPlayer.destroy(); } catch(err){}
                }
              },
              onError: () => {
                host.classList.remove('playing');
                trailerStatusText.innerText = "TRAILER UNAVAILABLE";
              }
            }
          });
        } else if (trailerUrl.endsWith('.mp4') || trailerUrl.includes('.m3u8')) {
          host.innerHTML = `<video id="videoTrailerEl" src="${trailerUrl}" autoplay ${isMuted ? 'muted' : ''} playsinline></video>`;
          host.classList.add('playing');
          trailerStatusText.innerText = "TRAILER";
          trailerStatusText.style.display = "flex";

          const vid = document.getElementById('videoTrailerEl');
          vid.onended = () => {
            host.classList.remove('playing');
            trailerStatusText.style.display = 'none';
          };
        } else if (!ytId) {
          trailerStatusText.innerText = "TRAILER UNAVAILABLE";
          trailerStatusText.style.display = "flex";
        }
      }, 2800);
    }

    // Audio Mute Toggle
    document.getElementById('muteToggleBtn').onclick = () => {
      isMuted = !isMuted;
      const icon = document.getElementById('muteIcon');
      if (ytTrailerPlayer && typeof ytTrailerPlayer.isMuted === 'function') {
        if (isMuted) ytTrailerPlayer.mute(); else ytTrailerPlayer.unMute();
      }
      const vid = document.getElementById('videoTrailerEl');
      if (vid) vid.muted = isMuted;

      icon.innerHTML = isMuted 
        ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
        : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    };

    // TV Show Episodes Section
    function renderEpisodesSection() {
      const epWrap = document.getElementById('episodesSection');
      const tabsRow = document.getElementById('seasonTabsRow');
      const listEl = document.getElementById('episodesList');
      const viewMoreBtn = document.getElementById('btnViewMoreEpisodes');

      const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
      if (seasons.length === 0) {
        epWrap.style.display = 'none';
        return;
      }

      epWrap.style.display = 'block';
      tabsRow.innerHTML = seasons.map(s => `
        <button class="season-btn ${s === currentSeasonKey ? 'active' : ''}" onclick="window.selectSeasonTab('${s}')">
          ${s}
        </button>
      `).join('');

      const epList = currentItem[currentSeasonKey] || [];
      const seasonNum = currentSeasonKey.replace(/\D/g, '') || '1';
      const limit = showAllEpisodes ? epList.length : 5;
      const thumbUrl = getHorizontalImage(currentItem);
      const fallbackThumb = safeUrl(currentItem.Poster || currentItem["Poster.v"] || '');

      listEl.innerHTML = epList.slice(0, limit).map((ep, idx) => `
        <a class="ep-card" href="1.html?watch=${currentItem.id}&season=${encodeURIComponent(currentSeasonKey)}&ep=${idx + 1}">
          <div class="ep-thumb-wrap">
            <img src="${thumbUrl}" alt="${ep.Name || ''}" loading="lazy" onerror="if(this.src!=='${fallbackThumb}') this.src='${fallbackThumb}';">
            <div class="ep-play-circle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          </div>
          <div class="ep-info">
            <div class="ep-name">${ep.Name || `Episode ${idx + 1}`}</div>
            <div class="ep-subtext">S${seasonNum} E${idx + 1}${ep.Duration ? ` • ${ep.Duration}` : ''}</div>
          </div>
        </a>
      `).join('');

      if (epList.length > 5) {
        viewMoreBtn.style.display = 'flex';
        viewMoreBtn.innerText = showAllEpisodes ? 'View Less' : 'View More';
        viewMoreBtn.onclick = () => {
          showAllEpisodes = !showAllEpisodes;
          renderEpisodesSection();
        };
      } else {
        viewMoreBtn.style.display = 'none';
      }
    }

    window.selectSeasonTab = function(seasonKey) {
      currentSeasonKey = seasonKey;
      renderEpisodesSection();
    };

    function updateWatchlistButtonState() {
      const btn = document.getElementById('btnWatchlist');
      if (!btn || !currentItem) return;
      const isAdded = userWatchlist.includes(currentItem.id);
      btn.classList.toggle('active', isAdded);
      btn.title = isAdded ? "Remove from Watchlist" : "Add to Watchlist";
      document.getElementById('wlIcon').innerHTML = isAdded 
        ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>' 
        : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>';
    }

    // Updated Watchlist System (Syncs UARM.Profiles[activeProfileIndex].Watchlist)
    async function persistWatchlistUpdate(targetId, shouldAdd) {
      try {
        if (!userDocRef && currentUser?.Lotus) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Lotus", "==", currentUser.Lotus)));
          if (!snap.empty) userDocRef = doc(userDb, "UARM", snap.docs[0].id);
        }
        if (!userDocRef) return;

        // Read fresh doc so we never overwrite sibling profile fields
        const freshSnap = await getDoc(userDocRef);
        if (!freshSnap.exists()) return;
        const freshData = freshSnap.data();

        if (Array.isArray(freshData.Profiles) && freshData.Profiles.length > 0) {
          const profIdx = resolveActiveProfileIndex(freshData.Profiles, freshData);
          if (profIdx === -1) return;

          const updatedProfiles = freshData.Profiles.map((p, idx) => {
            if (idx !== profIdx) return p;
            const existingWl = Array.isArray(p.Watchlist) ? p.Watchlist : [];
            const nextWl = shouldAdd
              ? (existingWl.includes(targetId) ? existingWl : [...existingWl, targetId])
              : existingWl.filter(item => item !== targetId);
            return { ...p, Watchlist: nextWl };
          });

          userProfiles = updatedProfiles;
          activeProfileIndex = profIdx;
          userWatchlist = [...(updatedProfiles[profIdx].Watchlist || [])];
          updateWatchlistButtonState();

          // Sync localStorage cleanly
          currentUser.Profiles = updatedProfiles;
          localStorage.setItem('active_user', JSON.stringify(currentUser));
          if (localStorage.getItem('active_profile')) {
            localStorage.setItem('active_profile', JSON.stringify(updatedProfiles[profIdx]));
          }

          await updateDoc(userDocRef, { Profiles: updatedProfiles });
        } else {
          // Legacy fallback if document has top-level Watchlist
          if (shouldAdd) {
            await updateDoc(userDocRef, { Watchlist: arrayUnion(targetId) });
          } else {
            await updateDoc(userDocRef, { Watchlist: arrayRemove(targetId) });
          }
        }
      } catch (err) {
        console.warn("Watchlist sync error:", err);
      }
    }

    function attachActionListeners() {
      const wlBtn = document.getElementById('btnWatchlist');
      if (wlBtn) {
        wlBtn.onclick = async () => {
          wlBtn.classList.remove('animating');
          void wlBtn.offsetWidth;
          wlBtn.classList.add('animating');

          if (!currentUser) {
            try {
              const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
              currentUser = stored ? JSON.parse(stored) : null;
            } catch (e) {}
          }

          if (!currentUser) {
            showToast("Please login to save to Watchlist");
            return;
          }

          const isAdded = userWatchlist.includes(currentItem.id);
          const shouldAdd = !isAdded;

          // Optimistic UI update for instant response
          if (shouldAdd) {
            userWatchlist.push(currentItem.id);
            showToast("Added to Watchlist");
          } else {
            userWatchlist = userWatchlist.filter(id => id !== currentItem.id);
            showToast("Removed from Watchlist");
          }

          if (Array.isArray(currentUser.Profiles) && activeProfileIndex >= 0 && currentUser.Profiles[activeProfileIndex]) {
            currentUser.Profiles[activeProfileIndex].Watchlist = [...userWatchlist];
          } else {
            currentUser.Watchlist = [...userWatchlist];
          }
          localStorage.setItem('active_user', JSON.stringify(currentUser));
          updateWatchlistButtonState();

          await persistWatchlistUpdate(currentItem.id, shouldAdd);
        };
      }

      const shareBtn = document.getElementById('btnShare');
      if (shareBtn) {
        shareBtn.onclick = async () => {
          const shareUrl = `${window.location.origin}${window.location.pathname}?preview=${currentItem.id}`;
          if (navigator.share) {
            try {
              await navigator.share({
                title: currentItem.Name || "Hotstar",
                text: `Watch ${currentItem.Name} on Hotstar!`,
                url: shareUrl
              });
            } catch(e){}
          } else {
            navigator.clipboard.writeText(shareUrl);
            showToast("Link copied to clipboard!");
          }
        };
      }
    }

    async function fetchRecommendations() {
      const grid = document.getElementById('recommendationsGrid');
      try {
        const snap = await getDocs(collection(contentDb, currentCollection));
        let items = [];
        snap.forEach(d => {
          if (d.id !== currentItem.id) items.push({ id: d.id, ...d.data() });
        });

        const targetGenres = String(currentItem.Genres || currentItem.Tags || currentItem.Channel || '').toLowerCase().split(/[,/|]+/);
        const targetStudio = String(currentItem.Studio || currentItem.Channel || '').toLowerCase();
        const targetAge = String(currentItem.Age_Rating || '').toLowerCase();

        items.sort((a, b) => {
          let scoreA = 0;
          let scoreB = 0;

          const aG = String(a.Genres || a.Tags || a.Channel || '').toLowerCase();
          const bG = String(b.Genres || b.Tags || b.Channel || '').toLowerCase();
          targetGenres.forEach(g => {
            if (g && aG.includes(g.trim())) scoreA += 10;
            if (g && bG.includes(g.trim())) scoreB += 10;
          });

          if (targetStudio && String(a.Studio || a.Channel || '').toLowerCase().includes(targetStudio)) scoreA += 15;
          if (targetStudio && String(b.Studio || b.Channel || '').toLowerCase().includes(targetStudio)) scoreB += 15;

          if (targetAge && String(a.Age_Rating || '').toLowerCase() === targetAge) scoreA += 5;
          if (targetAge && String(b.Age_Rating || '').toLowerCase() === targetAge) scoreB += 5;

          return scoreB - scoreA;
        });

        grid.innerHTML = items.slice(0, 14).map(c => {
          const primary = getHorizontalImage(c);
          const fallback = safeUrl(c.Poster || c["Poster.v"] || '');
          const genres = c.Genres || c.Tags || c.Channel || c.Language || '';
          
          return `
            <a class="rec-16-9-card" href="preview.html?preview=${c.id}">
              <div class="rec-16-9-thumb">
                <img src="${primary}" alt="${c.Name || 'Title'}" loading="lazy" onerror="if(this.src!=='${fallback}') this.src='${fallback}';">
              </div>
              <div class="rec-title">${c.Name || 'Title'}</div>
              ${genres ? `<div class="rec-sub">${genres}</div>` : ''}
            </a>
          `;
        }).join('');
      } catch (err) {}
    }

    async function start() {
      // Load user subscription/watchlist AND content document concurrently for faster startup
      const [, item] = await Promise.all([
        loadUserSubscriptionPlan(),
        fetchContentData(contentId)
      ]);

      if (!item) return;

      hasAccess = checkContentAccess(currentItem);
      renderPreviewUI();
      scheduleTrailerPlayback();
      fetchRecommendations();
    }
    start();
  </script>
