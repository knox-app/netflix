<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hotstar Mobile Previewer</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --bg-color: #0f1014;
            --surface-color: #16181f;
            --text-main: #ffffff;
            --text-dim: #8f98b2;
            --hotstar-gradient: linear-gradient(90deg, #0084ff 0%, #e00b68 100%);
            --pill-bg: rgba(255, 255, 255, 0.08);
            --pill-border: rgba(255, 255, 255, 0.08);
            --btn-secondary: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 75px; /* space for bottom navigation bar */
        }

        /* Top Brand Spark Icon */
        .top-nav {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 20;
            display: flex;
            align-items: center;
        }

        .brand-spark {
            font-size: 24px;
            color: #ffffff;
            opacity: 0.9;
        }

        /* 1. Hero / Video Player Section */
        .hero {
            position: relative;
            width: 100%;
            height: 56.25vw; /* 16:9 aspect ratio */
            min-height: 250px;
            max-height: 420px;
            background: #000;
            overflow: hidden;
        }

        #banner-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            z-index: 1;
            transition: opacity 1.2s ease-in-out;
        }

        #trailer-wrapper {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: #000;
        }

        /* Crop YouTube controls & branding */
        #trailer-wrapper iframe {
            position: absolute;
            top: -14%;
            left: -14%;
            width: 128%;
            height: 128%;
            pointer-events: none;
            border: none;
        }

        .v-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(15, 16, 20, 0.1) 0%, rgba(15, 16, 20, 0.4) 50%, var(--bg-color) 100%);
            z-index: 2;
        }

        .trailer-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 700;
            color: #ff5252;
            z-index: 5;
            display: none;
        }

        /* 2. Content Details */
        .main-wrapper {
            position: relative;
            z-index: 10;
            padding: 0 16px;
            margin-top: -30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #logo-img {
            max-width: 200px;
            max-height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
            display: none;
        }

        #fallback-title {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.1;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            display: none;
        }

        /* Meta row (2021 • U • 3 Seasons • 3 Languages) */
        .meta-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #d1d7e0;
        }

        .meta-row span:not(:last-child)::after {
            content: "•";
            margin-left: 6px;
            color: var(--text-dim);
        }

        .description {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #9ea5b6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .genres-row {
            font-size: 0.85rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
        }

        /* Language Pills */
        .lang-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 2px;
        }

        .lang-pill {
            background: var(--pill-bg);
            border: 1px solid var(--pill-border);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #e1e6f0;
        }

        /* 3. Action Buttons */
        .btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .watch-btn {
            background: var(--hotstar-gradient);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            flex: 1;
            box-shadow: 0 4px 15px rgba(224, 11, 104, 0.3);
            transition: filter 0.2s;
        }

        .watch-btn:active {
            filter: brightness(0.9);
            transform: scale(0.98);
        }

        /* Watchlist Button (Square with + or ✓) */
        .watchlist-btn {
            background: var(--btn-secondary);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            width: 48px;
            height: 48px;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .watchlist-btn.in-watchlist {
            background: rgba(0, 132, 255, 0.25);
            border-color: #0084ff;
            color: #0084ff;
        }

        .share-btn {
            background: var(--btn-secondary);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            width: 48px;
            height: 48px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* 4. Episodes Section */
        .episodes-area {
            padding: 24px 16px 8px 16px;
            display: none;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .ep-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ep-card {
            display: flex;
            gap: 12px;
            background: var(--surface-color);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            align-items: center;
            cursor: pointer;
        }

        .ep-thumb {
            width: 100px;
            height: 60px;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 6px;
            background: #20242f;
        }

        .ep-info {
            flex: 1;
            min-width: 0;
        }

        .ep-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ep-desc {
            font-size: 0.72rem;
            color: var(--text-dim);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .view-more-btn {
            width: 100%;
            background: var(--btn-secondary);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            margin-top: 12px;
            cursor: pointer;
        }

        /* 5. Recommendations */
        .rec-area {
            padding: 16px;
        }

        .rec-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .rec-card {
            border-radius: 6px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
        }

        .rec-poster {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background: #20242f;
            border-radius: 6px;
        }

        .rec-title {
            font-size: 0.72rem;
            font-weight: 600;
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 6. Mobile Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(15, 16, 20, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.65rem;
            font-weight: 600;
        }

        .bottom-nav-item i {
            font-size: 16px;
        }

        .bottom-nav-item.active {
            color: #ffffff;
        }

        /* Loader */
        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            gap: 12px;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="brand-spark"><i class="fa-solid fa-asterisk"></i></div>
    </div>

    <div id="loader" class="loader">
        <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
        <span>Loading details...</span>
    </div>

    <div id="app" style="display: none;">
        <!-- 1. Hero Player & Trailer -->
        <div class="hero">
            <img id="banner-img" src="" alt="Banner">
            <div id="trailer-wrapper"></div>
            <div id="trailer-status" class="trailer-badge">UNAVAILABLE</div>
            <div class="v-gradient"></div>
        </div>

        <!-- 2. Meta and Controls -->
        <div class="main-wrapper">
            <img id="logo-img" src="" alt="Logo">
            <h1 id="fallback-title"></h1>

            <!-- Meta Row -->
            <div class="meta-row" id="meta-data"></div>

            <!-- Description -->
            <p class="description" id="desc-text"></p>

            <!-- Genres -->
            <div class="genres-row" id="genres-row"></div>

            <!-- Languages Pills -->
            <div class="lang-pills" id="lang-pills"></div>

            <!-- Action Buttons -->
            <div class="btn-group" id="btn-group-container">
                <!-- Dynamic Watch/Upgrade Button -->
                <button class="watch-btn" id="main-watch-btn">
                    <i class="fa-solid fa-play"></i>
                    <span id="btn-label">Watch Now</span>
                </button>

                <!-- Watchlist Toggle Button (Shows + or ✓) -->
                <button class="watchlist-btn" id="watchlist-btn" title="Watchlist">
                    <i class="fa-solid fa-plus" id="watchlist-icon"></i>
                </button>

                <!-- Share Button -->
                <button class="share-btn" id="share-btn" title="Share">
                    <i class="fa-solid fa-share-nodes"></i>
                </button>
            </div>
        </div>

        <!-- 3. Episodes (for Series/Shows) -->
        <div class="episodes-area" id="episodes-section">
            <div class="section-title">Episodes</div>
            <div class="ep-list" id="ep-list"></div>
            <button class="view-more-btn" id="view-more-btn" style="display: none;">View More</button>
        </div>

        <!-- 4. Recommendations -->
        <div class="rec-area">
            <div class="section-title">More Like This</div>
            <div class="rec-grid" id="rec-list"></div>
        </div>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="bottom-nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
        <a href="#" class="bottom-nav-item"><i class="fa-solid fa-magnifying-glass"></i><span>Search</span></a>
        <a href="#" class="bottom-nav-item"><i class="fa-solid fa-tv"></i><span>TV</span></a>
        <a href="#" class="bottom-nav-item"><i class="fa-solid fa-film"></i><span>Movies</span></a>
        <a href="#" class="bottom-nav-item"><i class="fa-solid fa-user"></i><span>My Space</span></a>
    </nav>

    <!-- Modular Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            doc, 
            getDoc, 
            updateDoc, 
            arrayUnion, 
            arrayRemove, 
            collection, 
            getDocs, 
            limit, 
            query 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. User & Subscriptions DB
        const userAppConfig = {
            apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
            authDomain: "question-metabase.firebaseapp.com",
            databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "question-metabase",
            storageBucket: "question-metabase.firebasestorage.app",
            messagingSenderId: "770698198753",
            appId: "1:770698198753:web:59ae49d78b6013bab5c1a0"
        };

        // 2. Content Storage DB
        const contentAppConfig = {
            apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
            authDomain: "internal-systems-46728.firebaseapp.com",
            projectId: "internal-systems-46728",
            storageBucket: "internal-systems-46728.firebasestorage.app",
            messagingSenderId: "172177452674",
            appId: "1:172177452674:web:155a2417da5531dd7ece9b"
        };

        const userApp = initializeApp(userAppConfig, "userApp");
        const contentApp = initializeApp(contentAppConfig, "contentApp");

        const userDb = getFirestore(userApp);
        const contentDb = getFirestore(contentApp);

        // Application State
        const CURRENT_USER_DOC_ID = "7F7I4d9vmIm9WiUAUnEQGByq6jT";
        const urlParams = new URLSearchParams(window.location.search);
        const watchId = urlParams.get('preview') || urlParams.get('watch') || 'selfie-with-bajrangi';

        let currentData = null;
        let contentType = 'Movies'; // 'Live', 'Movies', 'Shows'
        let isSubscribed = false;
        let inWatchlist = false;

        async function init() {
            try {
                // Find content across Shows/Series, Movies, or Live TV
                const collections = ['Shows', 'Series', 'Movies', 'Live TV'];
                let snap = null;
                let matchedCollection = 'Movies';

                for (const col of collections) {
                    const docRef = doc(contentDb, col, watchId);
                    const s = await getDoc(docRef);
                    if (s.exists()) {
                        snap = s;
                        matchedCollection = col;
                        break;
                    }
                }

                if (!snap || !snap.exists()) {
                    document.getElementById('loader').innerHTML = `<p>Content not found.</p>`;
                    return;
                }

                currentData = { id: snap.id, ...snap.data() };
                contentType = (matchedCollection === 'Live TV') ? 'Live' : ((matchedCollection === 'Shows' || matchedCollection === 'Series') ? 'Shows' : 'Movies');

                // User Entitlement & Watchlist State
                await evaluateSubscription(currentData.Partner || currentData.Studio);
                await evaluateWatchlistState();

                // Render Content
                renderUI();
                setupTrailer(currentData.Trailer || currentData['Pre-Cast']);
                renderRecommendations(matchedCollection);

                document.getElementById('loader').style.display = 'none';
                document.getElementById('app').style.display = 'block';

            } catch (err) {
                console.error("Init Error:", err);
                document.getElementById('loader').innerHTML = `<p>Error loading media.</p>`;
            }
        }

        /* Entitlement check */
        async function evaluateSubscription(partnerName) {
            if (!partnerName) {
                isSubscribed = true;
                return;
            }
            try {
                const userSnap = await getDoc(doc(userDb, 'UARM', CURRENT_USER_DOC_ID));
                if (userSnap.exists()) {
                    const plans = userSnap.data().Plans || [];
                    for (const planId of plans) {
                        const planDoc = await getDoc(doc(userDb, 'Plans & Subscriptions', planId));
                        if (planDoc.exists()) {
                            const studios = planDoc.data().Studio || [];
                            if (studios.includes(partnerName)) {
                                isSubscribed = true;
                                return;
                            }
                        }
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        /* Watchlist status */
        async function evaluateWatchlistState() {
            try {
                const userSnap = await getDoc(doc(userDb, 'UARM', CURRENT_USER_DOC_ID));
                if (userSnap.exists()) {
                    const list = userSnap.data().Watchlist || [];
                    inWatchlist = list.includes(currentData.id);
                    updateWatchlistUI();
                }
            } catch (e) {
                console.error(e);
            }
        }

        function updateWatchlistUI() {
            const btn = document.getElementById('watchlist-btn');
            const icon = document.getElementById('watchlist-icon');
            if (inWatchlist) {
                btn.classList.add('in-watchlist');
                icon.className = 'fa-solid fa-check'; // Write/Check icon when in watchlist
            } else {
                btn.classList.remove('in-watchlist');
                icon.className = 'fa-solid fa-plus';  // Plus icon when not in watchlist
            }
        }

        /* UI Rendering */
        function renderUI() {
            // Banner & Branding
            document.getElementById('banner-img').src = currentData.Banner || '';

            const logoUrl = currentData['Logo.png'] || currentData.Logo;
            const logoEl = document.getElementById('logo-img');
            const titleEl = document.getElementById('fallback-title');

            if (logoUrl && logoUrl.trim() !== '') {
                logoEl.src = logoUrl;
                logoEl.style.display = 'block';
                titleEl.style.display = 'none';
            } else {
                titleEl.innerText = currentData.Tittle || currentData.Title || currentData.Name || currentData.id;
                titleEl.style.display = 'block';
                logoEl.style.display = 'none';
            }

            // Metadata: Year • Rating • Seasons • Languages
            const year = currentData.Year || '2021';
            const rating = currentData['Age Rating'] || 'U';
            const seasons = currentData.Seasons ? `${currentData.Seasons} Seasons` : (contentType === 'Shows' ? '3 Seasons' : null);
            const languagesCount = currentData.LanguageCount ? `${currentData.LanguageCount} Languages` : '3 Languages';

            let metaHtml = `<span>${year}</span><span>${rating}</span>`;
            if (seasons) metaHtml += `<span>${seasons}</span>`;
            metaHtml += `<span>${languagesCount}</span>`;
            document.getElementById('meta-data').innerHTML = metaHtml;

            // Description
            document.getElementById('desc-text').innerText = currentData.Description || '';

            // Genres (Pipe separated: Action | Family | Animation)
            let genres = currentData.Genres || currentData.Tags || '';
            if (Array.isArray(genres)) genres = genres.join(' | ');
            else if (typeof genres === 'string') genres = genres.split(',').join(' | ');
            document.getElementById('genres-row').innerText = genres;

            // Language Pills
            const pillsBox = document.getElementById('lang-pills');
            const defaultLangs = ['Hindi Original', 'Tamil', 'Telugu'];
            const activeLangs = currentData.Languages || (currentData.Language ? [currentData.Language] : defaultLangs);
            pillsBox.innerHTML = activeLangs.map(l => `<span class="lang-pill">${l}</span>`).join('');

            // Action Button Label Logic
            const watchBtn = document.getElementById('main-watch-btn');
            const btnLabel = document.getElementById('btn-label');
            const progress = localStorage.getItem(`progress_${currentData.id}`);

            if (!isSubscribed) {
                btnLabel.innerText = "Upgrade to Watch";
                watchBtn.onclick = () => alert("Redirecting to Hotstar Subscription Checkout...");
            } else if (progress && progress > 0 && contentType !== 'Live') {
                btnLabel.innerText = "Continue Watching";
                watchBtn.onclick = () => playStream(true);
            } else {
                btnLabel.innerText = contentType === 'Live' ? "Watch Live" : "Watch Now";
                watchBtn.onclick = () => playStream(false);
            }

            // Watchlist Click Event
            document.getElementById('watchlist-btn').onclick = toggleWatchlist;

            // Share Click Event
            document.getElementById('share-btn').onclick = () => {
                if (navigator.share) navigator.share({ title: currentData.Name, url: window.location.href });
                else {
                    navigator.clipboard.writeText(window.location.href);
                    alert("Link copied to clipboard!");
                }
            };

            // Episodes
            if (contentType === 'Shows') {
                renderEpisodes();
            }
        }

        async function toggleWatchlist() {
            inWatchlist = !inWatchlist;
            updateWatchlistUI();

            const userRef = doc(userDb, 'UARM', CURRENT_USER_DOC_ID);
            try {
                if (inWatchlist) {
                    await updateDoc(userRef, { Watchlist: arrayUnion(currentData.id) });
                } else {
                    await updateDoc(userRef, { Watchlist: arrayRemove(currentData.id) });
                }
            } catch (e) {
                console.error("Watchlist update failed:", e);
            }
        }

        function playStream(resume) {
            alert(`Streaming: ${currentData.Name || currentData.id}\nResume: ${resume}`);
            localStorage.setItem(`progress_${currentData.id}`, '150');
        }

        /* Trailer delay (3 seconds) */
        function setupTrailer(trailer) {
            let trailerUrl = Array.isArray(trailer) ? trailer[0] : trailer;
            setTimeout(() => {
                const ytId = getYTID(trailerUrl);
                if (ytId) {
                    const wrapper = document.getElementById('trailer-wrapper');
                    const banner = document.getElementById('banner-img');
                    wrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&rel=0&loop=1&playlist=${ytId}&disablekb=1" allow="autoplay; encrypted-media"></iframe>`;
                    banner.style.opacity = '0';
                } else {
                    document.getElementById('trailer-status').style.display = 'block';
                }
            }, 3000);
        }

        function getYTID(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        /* Episodes logic (first 5 + View More) */
        function renderEpisodes() {
            const epSection = document.getElementById('episodes-section');
            const epList = document.getElementById('ep-list');
            const viewMoreBtn = document.getElementById('view-more-btn');

            epSection.style.display = 'block';

            let rawEps = currentData['Season 1']?.Episodes || [
                { Tittle: "Episode 1: The Beginning", desc: "Ankush meets Bajrangi for the first time." },
                { Tittle: "Episode 2: School Mischief", desc: "Trouble at school gets resolved with magic." },
                { Tittle: "Episode 3: The Flying Mystery", desc: "An aerial chase across town." },
                { Tittle: "Episode 4: The Golden Key", desc: "A treasure hunt leads to surprises." },
                { Tittle: "Episode 5: Festival Celebration", desc: "Celebrating with superpowers." },
                { Tittle: "Episode 6: The Secret Cave", desc: "Unlocking ancient powers." },
                { Tittle: "Episode 7: The Final Showdown", desc: "Bajrangi protects the village." }
            ];

            function populate(count) {
                epList.innerHTML = '';
                rawEps.slice(0, count).forEach((ep, i) => {
                    const div = document.createElement('div');
                    div.className = 'ep-card';
                    div.innerHTML = `
                        <img class="ep-thumb" src="${ep.Thumbnail || currentData.Banner}">
                        <div class="ep-info">
                            <div class="ep-title">${i + 1}. ${ep.Tittle || ep.Title || 'Episode'}</div>
                            <div class="ep-desc">${ep.desc || 'An exciting new episode.'}</div>
                        </div>
                        <div style="font-size: 16px; color: #0084ff;"><i class="fa-solid fa-circle-play"></i></div>
                    `;
                    div.onclick = () => playStream(false);
                    epList.appendChild(div);
                });
            }

            populate(5);

            if (rawEps.length > 5) {
                viewMoreBtn.style.display = 'block';
                let expanded = false;
                viewMoreBtn.onclick = () => {
                    expanded = !expanded;
                    populate(expanded ? rawEps.length : 5);
                    viewMoreBtn.innerText = expanded ? 'View Less' : 'View More';
                };
            }
        }

        /* Recommendations */
        async function renderRecommendations(colName) {
            const list = document.getElementById('rec-list');
            try {
                const q = query(collection(contentDb, colName), limit(6));
                const snap = await getDocs(q);
                list.innerHTML = '';
                snap.forEach(docSnap => {
                    if (docSnap.id === currentData.id) return;
                    const d = docSnap.data();
                    const poster = d.Banner || d['Logo.png'] || '';
                    list.innerHTML += `
                        <a class="rec-card" href="1.html?preview=${docSnap.id}">
                            <img class="rec-poster" src="${poster}" alt="${d.Name || docSnap.id}">
                            <div class="rec-title">${d.Name || d.Tittle || docSnap.id}</div>
                        </a>
                    `;
                });
            } catch (e) {
                console.error(e);
            }
        }

        init();
    </script>
</body>
</html>
