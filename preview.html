<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Previewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1014;
            --text-color: #ffffff;
            --accent-color: #e1e6f0;
            --button-bg: #ffffff;
            --button-text: #000000;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            position: relative;
            width: 100%;
            height: 56.25vw; /* 16:9 Aspect Ratio */
            max-height: 80vh;
            background-color: #000;
            display: flex;
            align-items: flex-end;
            overflow: hidden;
        }

        #banner-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1s ease-in-out;
        }

        #trailer-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background: #000;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .trailer-error {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 12px;
            display: none;
        }

        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            background: linear-gradient(to top, var(--bg-color), transparent);
            z-index: 2;
        }

        /* Content Info */
        .content-container {
            position: relative;
            z-index: 3;
            padding: 0 4%;
            margin-top: -10%;
        }

        .logo-img {
            max-width: 300px;
            max-height: 150px;
            margin-bottom: 20px;
            display: block;
        }

        .meta-data {
            margin-bottom: 15px;
            font-size: 14px;
            color: #a9a9a9;
        }

        .meta-data span {
            margin-right: 10px;
        }

        .play-btn {
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 12px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
            transition: transform 0.2s;
        }

        .play-btn:hover { transform: scale(1.05); }

        .description {
            max-width: 600px;
            line-height: 1.6;
            color: #ccc;
            margin-bottom: 30px;
        }

        /* Episodes Section */
        .section-title {
            padding: 0 4%;
            margin: 40px 0 20px 0;
            font-size: 22px;
        }

        .horizontal-scroll {
            display: flex;
            overflow-x: auto;
            padding: 0 4% 20px 4%;
            gap: 15px;
            scrollbar-width: none;
        }
        .horizontal-scroll::-webkit-scrollbar { display: none; }

        .episode-card {
            min-width: 280px;
            background: #1c1d24;
            border-radius: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .episode-thumb {
            width: 100%;
            height: 157px;
            object-fit: cover;
        }

        .episode-info { padding: 10px; }
        .episode-title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }

        /* More Like This (Posters) */
        .poster-card {
            min-width: 160px;
            height: 240px;
            border-radius: 8px;
            background: #222;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .poster-card:hover { transform: scale(1.05); }
        .poster-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading-screen">Loading Content...</div>

    <div id="main-content" style="display:none;">
        <section class="hero">
            <img id="banner-image" src="" alt="Banner">
            <div id="trailer-container"></div>
            <div id="trailer-status" class="trailer-error">Trailer Unavailable</div>
            <div class="gradient-overlay"></div>
        </section>

        <main class="content-container">
            <img id="content-logo" class="logo-img" src="" alt="Logo">
            
            <div class="meta-data" id="meta-tags"></div>

            <button class="play-btn" id="action-btn">Watch Now</button>
            
            <div class="description" id="content-desc"></div>
        </main>

        <div id="episodes-section" style="display:none;">
            <h2 class="section-title">Episodes</h2>
            <div class="horizontal-scroll" id="episodes-list"></div>
        </div>

        <h2 class="section-title">More Like This</h2>
        <div class="horizontal-scroll" id="recommendations"></div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, query, where, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
            authDomain: "internal-systems-46728.firebaseapp.com",
            projectId: "internal-systems-46728",
            storageBucket: "internal-systems-46728.firebasestorage.app",
            messagingSenderId: "172177452674",
            appId: "1:172177452674:web:155a2417da5531dd7ece9b",
            measurementId: "G-Y87B8VRQ1N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Get ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const contentId = urlParams.get('watch');

        async function initPreviewer() {
            if (!contentId) {
                document.getElementById('loading-screen').innerText = "No ID provided in URL (?watch=ID)";
                return;
            }

            try {
                // Change 'Live TV' to whatever your actual collection name is if different
                // Based on your image, it looks like: Live TV -> aaj-tak
                // We will try to find the doc in 'Live TV'
                const docRef = doc(db, "Live TV", contentId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    renderUI(docSnap.data());
                } else {
                    document.getElementById('loading-screen').innerText = "Content not found.";
                }
            } catch (error) {
                console.error(error);
                document.getElementById('loading-screen').innerText = "Error loading data.";
            }
        }

        function renderUI(data) {
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';

            // 1. Banner & Logo
            document.getElementById('banner-image').src = data.Banner || '';
            document.getElementById('content-logo').src = data.Logo || '';
            document.getElementById('content-desc').innerText = data.Description || '';

            // 2. Action Button Logic
            const btn = document.getElementById('action-btn');
            if (data.Type === 'Live') btn.innerText = "Watch Live";
            else if (data.Type === 'Movie') btn.innerText = "Watch Now";
            else if (data.Type === 'Series') btn.innerText = "Watch EP 1";

            // 3. Tags
            const tagContainer = document.getElementById('meta-tags');
            if (data.Tags && Array.isArray(data.Tags)) {
                data.Tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.innerText = tag + "  |";
                    tagContainer.appendChild(span);
                });
            }

            // 4. Trailer logic (3 second delay)
            setTimeout(() => {
                if (data.Trailer && data.Trailer.trim() !== "") {
                    const container = document.getElementById('trailer-container');
                    container.style.display = 'block';
                    document.getElementById('banner-image').style.opacity = '0';
                    
                    // Handle YouTube trailer vs Direct
                    if (data.Trailer.includes('youtube.com') || data.Trailer.includes('youtu.be')) {
                        let videoId = data.Trailer.split('v=')[1] || data.Trailer.split('/').pop();
                        container.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1" allow="autoplay"></iframe>`;
                    } else {
                        container.innerHTML = `<video src="${data.Trailer}" autoplay muted loop></video>`;
                    }
                } else {
                    document.getElementById('trailer-status').style.display = 'block';
                }
            }, 3000);

            // 5. Series / Episode Handling
            if (data.Type === 'Series') {
                document.getElementById('episodes-section').style.display = 'block';
                loadEpisodes(data);
            }

            // 6. Recommendations
            loadRecommendations(data);
        }

        async function loadEpisodes(data) {
            const list = document.getElementById('episodes-list');
            
            if (data.SourceType === 'YouTube' && data.Playlist) {
                // Note: Real YouTube Playlist fetching needs an API KEY. 
                // This is a placeholder showing 5 mock episodes based on your logic requirements.
                for (let i = 1; i <= 5; i++) {
                    const epCard = document.createElement('div');
                    epCard.className = 'episode-card';
                    epCard.innerHTML = `
                        <img class="episode-thumb" src="${data.Banner}" alt="EP">
                        <div class="episode-info">
                            <div class="episode-title">Episode ${i}</div>
                            <div style="font-size:12px; color:gray">Source: YouTube Playlist</div>
                        </div>
                    `;
                    list.appendChild(epCard);
                }
            }
        }

        async function loadRecommendations(currentData) {
            const recContainer = document.getElementById('recommendations');
            
            try {
                // Fetch same category or genre
                const q = query(
                    collection(db, "Live TV"), 
                    where("Genres", "==", currentData.Genres || ""),
                    limit(10)
                );

                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    if (doc.id === contentId) return; // Skip current

                    const d = doc.data();
                    const card = document.createElement('div');
                    card.className = 'poster-card';
                    card.onclick = () => window.location.search = `?watch=${doc.id}`;
                    card.innerHTML = `<img src="${d.Banner}" alt="${doc.id}">`;
                    recContainer.appendChild(card);
                });
            } catch (e) {
                console.log("Recommendations error:", e);
            }
        }

        initPreviewer();
    </script>
</body>
  </html>
