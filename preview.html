<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Previewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1014;
            --blue: #42a5f5;
            --text-dim: #a9a9a9;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* HERO AREA */
        .hero {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        /* Banner starts on top */
        #banner-img {
            position: absolute;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 20; 
            transition: opacity 1s ease;
        }

        /* Video starts hidden in background */
        #video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1; 
            background: #000;
        }

        /* Scaling to hide YouTube UI (Crop effect) */
        #video-container iframe {
            position: absolute;
            top: -12%; left: -12%;
            width: 124%; height: 124%;
            pointer-events: none;
        }

        .trailer-text {
            position: absolute; top: 15px; left: 15px;
            font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.4);
            z-index: 30;
        }

        /* CONTENT */
        .main-content {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; padding: 0 20px;
            margin-top: 25px;
        }

        .logo {
            max-width: 180px; max-height: 90px;
            object-fit: contain; margin-bottom: 15px;
        }

        .blue-highlights {
            color: var(--blue);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            display: flex; gap: 8px;
        }
        .blue-highlights span:not(:last-child)::after {
            content: " •"; color: var(--text-dim); margin-left: 8px;
        }

        .meta {
            font-size: 13px; color: var(--text-dim);
            display: flex; gap: 12px; margin-bottom: 25px;
        }
        .rating {
            background: #3c3c3c; color: #fff; padding: 2px 6px;
            border-radius: 3px; font-weight: bold; font-size: 11px;
        }

        .btn-play {
            width: 100%; max-width: 400px;
            background: #e1e6f0; color: #000;
            border: none; padding: 15px; border-radius: 8px;
            font-size: 16px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 30px; cursor: pointer;
        }
        .sub-txt { color: #666; font-weight: 400; font-size: 14px; }

        .desc {
            font-size: 14px; color: var(--text-dim);
            line-height: 1.5; text-align: left; width: 100%;
            margin-bottom: 35px;
        }

        .icons {
            display: flex; justify-content: space-around; width: 100%;
            max-width: 320px; padding-bottom: 50px;
        }
        .icon-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 11px; color: var(--text-dim); gap: 10px;
        }
        .icon-item span { font-size: 22px; color: #fff; }

    </style>
</head>
<body>

<div id="preview">
    <div class="hero">
        <div class="trailer-text">TRAILER</div>
        <img id="banner-img" src="" alt="Banner Loading...">
        <div id="video-container"></div>
    </div>

    <div class="main-content">
        <img id="content-logo" class="logo" src="" alt="">
        
        <div class="blue-highlights" id="blue-tags">
            <!-- Dynamic Tags -->
        </div>

        <div class="meta" id="meta-info">
            <!-- Dynamic Meta -->
        </div>

        <button class="btn-play">
            <span style="font-size: 18px;">▶</span> 
            <span id="btn-label">Watch Now</span> 
            <span id="btn-subtext" class="sub-txt"></span>
        </button>

        <div class="desc" id="description"></div>

        <div class="icons">
            <div class="icon-item"><span>＋</span> Watchlist</div>
            <div class="icon-item"><span>➦</span> Share</div>
            <div class="icon-item"><span>♡</span> Rate</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
        authDomain: "internal-systems-46728.firebaseapp.com",
        projectId: "internal-systems-46728",
        storageBucket: "internal-systems-46728.firebasestorage.app",
        messagingSenderId: "172177452674",
        appId: "1:172177452674:web:155a2417da5531dd7ece9b",
        measurementId: "G-Y87B8VRQ1N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const watchId = urlParams.get('watch');

    async function start() {
        if(!watchId) return;
        const snap = await getDoc(doc(db, "Live TV", watchId));
        if(snap.exists()) render(snap.data());
    }

    function render(data) {
        const banner = document.getElementById('banner-img');
        banner.src = data.Banner;
        document.getElementById('content-logo').src = data.Logo;
        document.getElementById('description').innerText = data.Description;

        // Dynamic Blue Tags (First 2 from array)
        if(data.Tags && Array.isArray(data.Tags)) {
            const tagsDiv = document.getElementById('blue-tags');
            tagsDiv.innerHTML = data.Tags.slice(0, 2).map(t => `<span>${t}</span>`).join('');
        }

        // Meta Info
        document.getElementById('meta-info').innerHTML = `
            <span>2024</span>
            <span class="rating">${data['Age Rating'] || 'U/A 13+'}</span>
            <span>${data.Language || 'English'}</span>
        `;

        // Button Logic
        const label = document.getElementById('btn-label');
        const sub = document.getElementById('btn-subtext');
        if(data.Type === 'Series') {
            label.innerText = "Watch Latest Episode";
            sub.innerText = "S1 E1";
        }

        // --- TRAILER LOGIC ---
        setTimeout(() => {
            const streamUrl = data.Stream || "";
            const ytId = getID(streamUrl);
            
            if (ytId) {
                const videoBox = document.getElementById('video-container');
                
                // Inject Iframe
                videoBox.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1" 
                        frameborder="0" 
                        allow="autoplay; encrypted-media">
                    </iframe>`;
                
                // Move Video to FRONT and Banner to BACK
                videoBox.style.zIndex = "50"; 
                banner.style.opacity = "0";
                banner.style.zIndex = "-1";
                console.log("Trailer started for ID:", ytId);
            } else {
                console.error("No valid YouTube ID found in 'Stream' field.");
            }
        }, 3000);
    }

    function getID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    start();
</script>

</body>
</html>
