<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Preview - Hotstar</title>
  
  <!-- Hindi & Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #151821;
      --accent-blue: #1480f0;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --border-color: rgba(255, 255, 255, 0.1);
      --btn-white: #ffffff;
      --btn-white-text: #090a0f;
      --btn-dark: #1e2230;
      --live-red: #e50914;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* Sticky Top Header on Scroll */
    .sticky-top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      transition: background-color 0.3s ease, backdrop-filter 0.3s ease, border-color 0.3s ease;
      pointer-events: none;
    }
    .sticky-top-nav.scrolled {
      background: rgba(9, 10, 15, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
      pointer-events: auto;
    }

    .sticky-nav-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .sticky-top-nav.scrolled .sticky-nav-title {
      opacity: 1;
      transform: translateY(0);
    }

    .nav-close-btn {
      background: rgba(15, 16, 23, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      pointer-events: auto;
      margin-left: auto;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .nav-close-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
    .nav-close-btn svg { width: 18px; height: 18px; fill: #fff; }

    /* ==========================================================
       HERO BILLBOARD (Responsive & Flow-Safe)
       ========================================================== */
    .hero-billboard-wrap {
      position: relative;
      width: 100%;
    }

    /* Media Host: Holds Banner & Video Trailer */
    .hero-media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16/10;
      background-color: #12141c;
      overflow: hidden;
    }

    .hero-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.6s ease;
    }

    .hero-trailer-host {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      background: #000;
      overflow: hidden;
    }
    .hero-trailer-host.playing { opacity: 1; }
    .hero-trailer-host iframe {
      width: calc(100% + 140px) !important;
      height: calc(100% + 160px) !important;
      position: absolute !important;
      top: -80px !important;
      left: -70px !important;
      pointer-events: none;
      border: none;
    }
    .hero-trailer-host video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-desktop-gradient { display: none; }

    /* Trailer Status: Top-Left without background */
    .trailer-status-text {
      position: absolute;
      top: 18px;
      left: 20px;
      color: #ffffff;
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0,0,0,0.8);
      z-index: 10;
      display: none;
    }

    .mute-toggle-btn {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.18);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .mute-toggle-btn svg { width: 16px; height: 16px; fill: #fff; }

    /* ==========================================================
       CONTENT DETAILS (No Overlapping)
       ========================================================== */
    .content-details-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px 16px 10px;
      position: relative;
      z-index: 5;
    }

    .brand-logo-img {
      max-width: 240px;
      max-height: 90px;
      object-fit: contain;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.85));
    }

    .title-fallback-hindi {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: 32px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 10px;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.9);
    }

    .blue-trend-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 8px;
    }
    .blue-trend-line span.dot {
      color: var(--text-muted);
      font-size: 10px;
    }

    .meta-pills-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .meta-pill-badge {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Primary & Secondary CTA Buttons */
    .cta-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .btn-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      border: none;
    }
    .btn-cta:active { transform: scale(0.98); opacity: 0.9; }
    .btn-cta svg { width: 18px; height: 18px; fill: currentColor; }

    .btn-cta-primary,
    .btn-cta-subscribe {
      background-color: var(--btn-white) !important;
      color: var(--btn-white-text) !important;
    }
    .btn-cta-secondary {
      background-color: var(--btn-dark);
      color: #fff;
      border: 1px solid var(--border-color);
    }

    /* Tags in Normal Font */
    .genres-tags-line {
      font-size: 13.5px;
      font-weight: 400;
      color: #e2e4ee;
      margin-bottom: 10px;
      letter-spacing: 0.2px;
    }
    .genres-tags-line span.sep {
      color: var(--text-muted);
      margin: 0 6px;
      font-weight: 300;
    }

    /* Description */
    .description-para {
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--text-muted);
      max-width: 620px;
      margin-bottom: 22px;
    }

    /* Watchlist & Share */
    .action-icons-row {
      display: flex;
      justify-content: center;
      gap: 40px;
      width: 100%;
      margin-bottom: 24px;
    }
    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.88;
      transition: opacity 0.15s, transform 0.1s;
    }
    .action-item:active { transform: scale(0.92); opacity: 1; }
    .action-item.active { color: var(--accent-blue); }
    .action-item svg { width: 22px; height: 22px; fill: currentColor; }

    @keyframes bouncePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.4) rotate(-12deg); }
      75% { transform: scale(0.9) rotate(6deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .action-item.animating svg {
      animation: bouncePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* ==========================================================
       LOWER CONTENT SECTIONS (Episodes & Recommendations)
       ========================================================== */
    .section-container {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto 32px;
      padding: 0 16px;
      text-align: left;
      position: relative;
      z-index: 10;
    }
    .section-heading {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 14px;
      color: #fff;
    }

    /* TV Show Episodes Section */
    .episodes-wrapper { display: none; }
    .season-tab-row {
      display: flex;
      gap: 18px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .season-tab-row::-webkit-scrollbar { display: none; }
    .season-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      padding-bottom: 6px;
    }
    .season-btn.active { color: #fff; }
    .season-btn.active::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 0;
      right: 0;
      height: 2.5px;
      background: #fff;
    }

    .episodes-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ep-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: background 0.15s ease;
      border: 1px solid transparent;
    }
    .ep-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255,255,255,0.1);
    }
    .ep-thumb-wrap {
      position: relative;
      width: 140px;
      min-width: 140px;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #151821;
    }
    .ep-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .ep-play-circle {
      position: absolute;
      bottom: 6px;
      left: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ep-play-circle svg { width: 10px; height: 10px; fill: #fff; margin-left: 1px; }

    .ep-info { flex: 1; min-width: 0; }
    .ep-name {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-subtext {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .view-more-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 140px;
      margin: 16px auto 6px;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 16:9 Recommendations Scroll */
    .rec-scroll-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 16px;
      scrollbar-width: none;
    }
    .rec-scroll-row::-webkit-scrollbar { display: none; }

    .rec-16-9-card {
      min-width: 220px;
      width: 220px;
      scroll-snap-align: start;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease;
    }
    .rec-16-9-card:hover { transform: scale(1.02); }
    
    .rec-16-9-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
    }
    .rec-16-9-thumb img { width: 100%; height: 100%; object-fit: cover; }
    
    .rec-title {
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-sub {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Bottom Nav for Mobile */
    .bottom-app-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(9, 10, 15, 0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-tab-item.active { color: #fff; }
    .nav-tab-item svg { width: 22px; height: 22px; fill: currentColor; }

    .toast-box {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(21, 24, 33, 0.95);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .toast-box.show { opacity: 1; }

    .loader-wrap {
      text-align: center;
      padding: 140px 20px;
      color: var(--accent-blue);
      font-weight: 700;
      font-size: 16px;
    }

    /* ==========================================================
       DESKTOP & TV RESPONSIVE LAYOUT (CLEAN FLOW - NO OVERLAP)
       ========================================================== */
    @media (min-width: 900px) {
      body { padding-bottom: 40px; }
      .bottom-app-nav { display: none !important; }

      /* Hero Billboard Container with Safe Flow */
      .hero-billboard-wrap {
        position: relative;
        width: 100%;
        min-height: 580px;
        display: flex;
        align-items: center;
        padding: 80px 48px 60px;
      }

      /* Media Box Stretches Completely Across Billboard Background */
      .hero-media-box {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        aspect-ratio: auto;
      }

      /* Multi-Vignette Gradients for Desktop Readability */
      .hero-desktop-gradient {
        display: block;
        position: absolute;
        inset: 0;
        background: 
          linear-gradient(90deg, #090a0f 0%, rgba(9, 10, 15, 0.94) 30%, rgba(9, 10, 15, 0.6) 55%, transparent 80%),
          linear-gradient(180deg, transparent 65%, #090a0f 100%);
        pointer-events: none;
        z-index: 2;
      }

      .trailer-status-text {
        top: 24px;
        left: 48px;
        font-size: 13px;
      }

      .mute-toggle-btn {
        display: flex;
        bottom: 28px;
        right: 48px;
        width: 38px;
        height: 38px;
      }

      /* Content Details Naturally Overlay Over Left Billboard Without Absolute Offsets */
      .content-details-wrap {
        position: relative;
        max-width: 560px;
        align-items: flex-start;
        text-align: left;
        padding: 0;
        margin: 0;
      }

      .brand-logo-img {
        max-width: 340px;
        max-height: 120px;
        margin-bottom: 14px;
      }

      .title-fallback-hindi {
        font-size: 46px;
        margin-bottom: 12px;
      }

      .blue-trend-line,
      .meta-pills-row {
        justify-content: flex-start;
      }

      .description-para {
        font-size: 14.5px;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      /* Action CTA Buttons & Icons in a Clean Horizontal Row */
      .desktop-action-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 14px;
        width: 100%;
      }

      .cta-container {
        flex-direction: row;
        align-items: center;
        width: auto;
        max-width: none;
        margin-bottom: 0;
      }
      .btn-cta {
        width: auto;
        padding: 13px 28px;
        font-size: 15.5px;
      }

      .action-icons-row {
        display: inline-flex;
        width: auto;
        gap: 12px;
        margin-bottom: 0;
      }
      .action-item {
        flex-direction: row;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 11px 18px;
        border-radius: 10px;
        font-size: 14px;
        gap: 8px;
      }
      .action-item svg { width: 18px; height: 18px; }

      /* Lower Sections */
      .section-container {
        margin: 40px auto;
        padding: 0 48px;
      }
      .section-heading { font-size: 22px; }
      .rec-16-9-card {
        min-width: 260px;
        width: 260px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Top Header (Appears on Scroll) -->
  <div class="sticky-top-nav" id="stickyTopNav">
    <div class="sticky-nav-title" id="stickyNavTitle"></div>
    <button class="nav-close-btn" onclick="window.history.back()" title="Close">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div id="loader" class="loader-wrap">Loading details...</div>

  <div id="previewMain" style="display: none;">
    
    <!-- 1. Hero Billboard Wrapper (Safe Flow) -->
    <div class="hero-billboard-wrap">
      
      <!-- Background Media Box -->
      <div class="hero-media-box">
        <img id="heroBanner" class="hero-banner-img" src="" alt="Banner">
        <div id="heroTrailerHost" class="hero-trailer-host"></div>
        <div class="hero-desktop-gradient"></div>

        <!-- Top Left Trailer Text -->
        <div class="trailer-status-text" id="trailerStatusText"></div>
        
        <!-- Audio Mute Toggle -->
        <button class="mute-toggle-btn" id="muteToggleBtn" title="Toggle Sound">
          <svg id="muteIcon" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
      </div>

      <!-- Content Details -->
      <div class="content-details-wrap">
        
        <!-- Logo / Title -->
        <img id="contentLogo" class="brand-logo-img" src="" alt="Logo" style="display: none;">
        <h1 id="contentTitle" class="title-fallback-hindi" style="display: none;">Title</h1>

        <div class="blue-trend-line" id="blueTrendLine"></div>

        <!-- Release Date, Age Rating, Duration/Seasons, Language -->
        <div class="meta-pills-row" id="metaPillsRow"></div>

        <!-- Desktop Action Container -->
        <div class="desktop-action-bar">
          <!-- CTA Buttons -->
          <div class="cta-container" id="ctaContainer"></div>

          <!-- Watchlist & Share -->
          <div class="action-icons-row">
            <div class="action-item" id="btnWatchlist">
              <svg id="wlIcon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
              <span id="wlLabel">Watchlist</span>
            </div>
            <div class="action-item" id="btnShare">
              <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92c0-1.61-1.31-2.92-2.92-2.92z"/></svg>
              <span>Share</span>
            </div>
          </div>
        </div>

        <!-- Tags in Normal Font -->

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, updateDoc, arrayUnion, arrayRemove, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Content Database (internal-systems-46728)
    const contentConfig = {

      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };
    const contentApp = initializeApp(contentConfig, "contentApp");

    // 2. User & Subscription Database (question-metabase)
    const userConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",

    // State Variables
    let currentItem = null;

    let currentUser = null;
    let userDocRef = null;
    let userWatchlist = [];
    let userAuthorizedStudios = new Set();
    let hasAccess = false;
    let trailerTimeout = null;

    let isMuted = true;

    const urlParams = new URLSearchParams(window.location.search);

    // Sticky Scroll Listener
    window.addEventListener('scroll', () => {
      const topNav = document.getElementById('stickyTopNav');

    function showToast(msg) {
      const toast = document.getElementById('toastAlert');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function safeUrl(url) {
      if (!url) return '';
      return url.trim().replace(/^http:\/\//i, 'https://');
    }

    function getHorizontalImage(c) {
      if (!c) return '';
      return safeUrl(c["Poster.h"] || c.Poster_h || c.poster_h || c.Banner || c.banner || c.Poster || c["Poster.v"] || '');
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      try {
        const u = new URL(url.trim());
        if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0];
        if (u.hostname.includes('youtube.com') || u.hostname.includes('m.youtube.com')) {
          if (u.pathname === '/watch') return u.searchParams.get('v');
          if (u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
          if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
        }
      } catch (e) {
        if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) return url.trim();
      }
      return null;
    }

    async function getHindiName(englishName) {
      if (!englishName) return "कंटेंट";
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=hi&dt=t&q=${encodeURIComponent(englishName)}`);
        const data = await res.json();
        if (data && data[0] && data[0][0] && data[0][0][0]) {
          return data[0][0][0];
        }
      } catch (e) {}
      return englishName;
    }

    async function loadUserSubscriptionPlan() {
      try {
        const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
        currentUser = stored ? JSON.parse(stored) : null;
      } catch (e) { currentUser = null; }

      if (!currentUser) return;

      userWatchlist = Array.isArray(currentUser.Watchlist) ? currentUser.Watchlist : [];

      try {
        let uData = null;

        if (currentUser.Lotus) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Lotus", "==", currentUser.Lotus)));
          if (!snap.empty) {
            userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            uData = snap.docs[0].data();
          }
        } else if (currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id) {
          const uId = currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id;
          userDocRef = doc(userDb, "UARM", uId);
          const snap = await getDoc(userDocRef);
          if (snap.exists()) uData = snap.data();
        } else if (currentUser.Email) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Email", "==", currentUser.Email)));
          if (!snap.empty) {
            userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            uData = snap.docs[0].data();
          }
        }

        if (uData) {
          userWatchlist = Array.isArray(uData.Watchlist) ? uData.Watchlist : userWatchlist;
          currentUser = { ...currentUser, ...uData };
          localStorage.setItem('active_user', JSON.stringify(currentUser));
        }

        const userPlanIds = Array.isArray(currentUser.Plans) ? currentUser.Plans : (currentUser.Plan ? [currentUser.Plan] : []);

        const planPromises = userPlanIds.map(async (planId) => {
          if (!planId) return;
          try {
            let pSnap = await getDoc(doc(userDb, "Plans & Subscriptions", planId));
            if (!pSnap.exists()) {
              pSnap = await getDoc(doc(userDb, "Plans & Subscription", planId));
            }
            if (pSnap.exists()) {
              const pData = pSnap.data();
              const studios = Array.isArray(pData.Studio) ? pData.Studio : (pData.Studios || []);
              studios.forEach(s => userAuthorizedStudios.add(String(s).trim().toLowerCase()));
            }
          } catch (err) {}
        });

        await Promise.all(planPromises);
      } catch (err) {}
    }

    function checkContentAccess(content) {
      if (!content) return false;
      const contentStudio = String(content.Studio || content.Partner || content.Channel || content["Channel"] || '').trim().toLowerCase();

      if (!contentStudio || contentStudio === 'free' || contentStudio === 'open') return true;
      if (userAuthorizedStudios.has(contentStudio)) return true;

      for (const authStudio of userAuthorizedStudios) {
        if (contentStudio.includes(authStudio) || authStudio.includes(contentStudio)) {
          return true;
        }
      }
      return false;
    }

    async function fetchContentData(id) {
      const collections = ["TV Shows", "Shows", "Movies", "Live TV", "Digital-Feed", "Sports"];
      let matchedDoc = null;

      for (const col of collections) {
        try {
          const snap = await getDoc(doc(contentDb, col, id));
          if (snap.exists()) {
            matchedDoc = snap.data();
            currentCollection = col;
            break;
          }
        } catch (e) {}
      }

      if (!matchedDoc) {
        document.getElementById('loader').innerText = `Content "${id}" not found.`;
        return;
      }

      currentItem = { id, ...matchedDoc };
      hasAccess = checkContentAccess(currentItem);

      const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
      if (currentCollection === "TV Shows" || currentCollection === "Shows" || seasons.length > 0) {
        contentType = 'show';
        currentSeasonKey = seasons[0] || 'Season 1';
      } else if (currentCollection === "Movies") {
        contentType = 'movie';
      } else {
        contentType = 'live';
      }

      await renderPreviewUI();
      scheduleTrailerPlayback();
      fetchRecommendations();
    }

    async function renderPreviewUI() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('previewMain').style.display = 'block';

      const showName = currentItem.Name || currentItem.Title || "Content";
      document.getElementById('stickyNavTitle').innerText = showName;

      // 1. Banner
      const bannerImg = document.getElementById('heroBanner');
      const primaryBanner = getHorizontalImage(currentItem);
      const secondaryBanner = safeUrl(currentItem.Banner || currentItem.Poster || '');

      bannerImg.src = primaryBanner;
      bannerImg.onerror = () => {
        if (secondaryBanner && bannerImg.src !== secondaryBanner) {
          bannerImg.src = secondaryBanner;
        }
      };

      // 2. Logo OR Bold Hindi Font Fallback
      const logoImg = document.getElementById('contentLogo');
      const titleFallback = document.getElementById('contentTitle');
      const logoUrl = safeUrl(currentItem.Logo || currentItem["Logo.png"] || '');

      const applyHindiTitleFallback = async () => {
        logoImg.style.display = 'none';
        const rawTitle = currentItem.Name || currentItem.Title || "कंटेंट";
        const hindiText = currentItem["Hindi Name"] || currentItem.Hindi_Name || await getHindiName(rawTitle);
        titleFallback.innerText = hindiText;
        titleFallback.style.display = 'block';
      };

      if (logoUrl) {
        logoImg.src = logoUrl;
        logoImg.style.display = 'block';
        titleFallback.style.display = 'none';
        logoImg.onerror = () => applyHindiTitleFallback();
      } else {
        await applyHindiTitleFallback();
      }

      // 3. Trend / Channel Badge
      const blueLine = document.getElementById('blueTrendLine');
      const channelLabel = currentItem.Channel ? String(currentItem.Channel).replace(/-/g, ' ').toUpperCase() : '';
      const trendText = currentItem.Award || currentItem.Achievement || (currentItem.Trending ? `#${currentItem.Trending} in Hindi Today` : channelLabel);
      const ratingVal = currentItem.Rating || currentItem.IMDb || currentItem.imdb;
      const ratingText = ratingVal ? `IMDb ${ratingVal}` : '';

      if (trendText || ratingText) {
        blueLine.innerHTML = `
          ${trendText ? `<span>${trendText}</span>` : ''}
          ${trendText && ratingText ? `<span class="dot">•</span>` : ''}
          ${ratingText ? `<span>${ratingText}</span>` : ''}
        `;
        blueLine.style.display = 'flex';
      } else {
        blueLine.style.display = 'none';
      }

      // 4. Metadata Pills
      const metaRow = document.getElementById('metaPillsRow');
      const year = currentItem.Year || currentItem["Release Year"] || (contentType === 'live' ? 'LIVE' : '2024');
      const age = currentItem.Age_Rating || currentItem["Age Rating"] || currentItem.Rating || 'U/A 13+';
      
      const langArr = Array.isArray(currentItem.Language) ? currentItem.Language : (currentItem.Language ? [currentItem.Language] : ['Hindi']);
      const langText = langArr.length > 1 ? `${langArr.length} Languages` : (langArr[0] || 'Hindi');
      
      let durationOrSeasons = '';
      if (contentType === 'show') {
        const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
        durationOrSeasons = `${seasons.length || 1} Season${seasons.length > 1 ? 's' : ''}`;
      } else if (contentType === 'movie') {
        durationOrSeasons = currentItem.Duration || '1h 50m';
      }

      metaRow.innerHTML = `
        <span>${year}</span>
        <span class="meta-pill-badge">${age}</span>
        ${durationOrSeasons ? `<span>•</span><span>${durationOrSeasons}</span>` : ''}
        <span>•</span><span>${langText}</span>
      `;

      // 5. Watch Button(s)
      renderCTAButtons();

      // 6. Tags in Normal Font
      const genresLine = document.getElementById('genresTagsLine');
      const rawGenres = currentItem.Genres || currentItem.Tags || currentItem.Channel || '';
      const genreItems = (Array.isArray(rawGenres) ? rawGenres : String(rawGenres).split(/[,/|]+/)).map(g => g.trim()).filter(Boolean);
      genresLine.innerHTML = genreItems.join(' <span class="sep">|</span> ');

      // 7. Description
      const desc = currentItem.Discription || currentItem.Description || "Enjoy full episodes, movies, and live broadcasts on Hotstar.";
      document.getElementById('contentDescription').innerText = desc;

      // 8. Watchlist state
      updateWatchlistButtonState();

      // 9. TV Shows Episodes Section
      if (contentType === 'show') {
        renderEpisodesSection();
      } else {
        document.getElementById('episodesSection').style.display = 'none';
      }
    }

    function renderCTAButtons() {
      const ctaBox = document.getElementById('ctaContainer');
      ctaBox.innerHTML = '';

      if (!hasAccess) {
        const studioParam = currentItem.Studio || currentItem.Channel || currentItem.Partner || '';
        ctaBox.innerHTML = `
          <a class="btn-cta btn-cta-subscribe" href="1.html?action=subscribe&studio=${encodeURIComponent(studioParam)}">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
            Subscribe to Watch
          </a>
        `;
        return;
      }

      let resumeKey = currentItem.id;
      if (contentType === 'show' && currentSeasonKey) {
        resumeKey = `${currentItem.id}_${currentSeasonKey}_ep0`;
      }
      const savedTime = parseFloat(localStorage.getItem(`progress_${resumeKey}`) || '0');
      const hasWatchedBefore = savedTime > 15;

      if (hasWatchedBefore && contentType !== 'live') {
        const seasonNum = currentSeasonKey ? currentSeasonKey.replace(/\D/g, '') || '1' : '1';
        const subLabel = contentType === 'show' ? `S${seasonNum} E1` : '';
        ctaBox.innerHTML = `
          <a class="btn-cta btn-cta-primary" href="1.html?watch=${currentItem.id}&action=resume">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            Continue Watching ${subLabel}
          </a>
          <a class="btn-cta btn-cta-secondary" href="1.html?watch=${currentItem.id}&action=starting">
            <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            Start from Beginning ${subLabel}
          </a>
        `;
        return;
      }

      let primaryLabel = "Watch Now";
      if (contentType === 'live') primaryLabel = "Watch Live";
      
      ctaBox.innerHTML = `
        <a class="btn-cta btn-cta-primary" href="1.html?watch=${currentItem.id}&action=starting">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          ${primaryLabel}
        </a>
      `;
    }

    function scheduleTrailerPlayback() {
      const trailerStatusText = document.getElementById('trailerStatusText');
      const host = document.getElementById('heroTrailerHost');
      const trailerUrl = safeUrl(currentItem.Trailer || '');

      clearTimeout(trailerTimeout);
      trailerTimeout = setTimeout(() => {
        if (!trailerUrl) {
          trailerStatusText.innerText = "TRAILER UNAVAILABLE";
          trailerStatusText.style.display = "block";
          return;
        }

        const ytId = extractYouTubeId(trailerUrl);

        if (ytId) {
          host.innerHTML = `<div id="ytTrailerActualPlayer"></div>`;
          host.classList.add('playing');
          trailerStatusText.innerText = "TRAILER";
          trailerStatusText.style.display = "block";

          ytTrailerPlayer = new YT.Player('ytTrailerActualPlayer', {
            videoId: ytId,
            playerVars: {
              autoplay: 1,
              controls: 0,
              disablekb: 1,
              fs: 0,
              rel: 0,
              modestbranding: 1,
              showinfo: 0,
              iv_load_policy: 3,
              mute: 1,
              playsinline: 1
            },
            events: {
              onReady: (e) => e.target.playVideo(),
              onStateChange: (e) => {
                if (e.data === YT.PlayerState.ENDED) {
                  host.classList.remove('playing');
                  trailerStatusText.style.display = 'none';
                  try { ytTrailerPlayer.destroy(); } catch(err){}
                }
              },
              onError: () => {
                host.classList.remove('playing');
                trailerStatusText.innerText = "TRAILER UNAVAILABLE";
              }
            }
          });
        } else if (trailerUrl.endsWith('.mp4') || trailerUrl.includes('.m3u8')) {
          host.innerHTML = `<video id="videoTrailerEl" src="${trailerUrl}" autoplay muted playsinline></video>`;
          host.classList.add('playing');
          trailerStatusText.innerText = "TRAILER";
          trailerStatusText.style.display = "block";

          const vid = document.getElementById('videoTrailerEl');
          vid.onended = () => {
            host.classList.remove('playing');
            trailerStatusText.style.display = 'none';
          };
        } else {
          trailerStatusText.innerText = "TRAILER UNAVAILABLE";
          trailerStatusText.style.display = "block";
        }
      }, 3000);
    }

    document.getElementById('muteToggleBtn').onclick = () => {
      isMuted = !isMuted;
      const icon = document.getElementById('muteIcon');
      if (ytTrailerPlayer && typeof ytTrailerPlayer.isMuted === 'function') {
        if (isMuted) ytTrailerPlayer.mute(); else ytTrailerPlayer.unMute();
      }
      const vid = document.getElementById('videoTrailerEl');
      if (vid) vid.muted = isMuted;

      icon.innerHTML = isMuted 
        ? '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'
        : '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
    };

    // Render TV Show Episodes
    function renderEpisodesSection() {
      const epWrap = document.getElementById('episodesSection');
      const tabsRow = document.getElementById('seasonTabsRow');
      const listEl = document.getElementById('episodesList');
      const viewMoreBtn = document.getElementById('btnViewMoreEpisodes');

      const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
      if (seasons.length === 0) {
        epWrap.style.display = 'none';
        return;
      }

      epWrap.style.display = 'block';
      tabsRow.innerHTML = seasons.map(s => `
        <button class="season-btn ${s === currentSeasonKey ? 'active' : ''}" onclick="window.selectSeasonTab('${s}')">
          ${s}
        </button>
      `).join('');

      const epList = currentItem[currentSeasonKey] || [];
      const seasonNum = currentSeasonKey.replace(/\D/g, '') || '1';
      const limit = showAllEpisodes ? epList.length : 5;
      const thumbUrl = getHorizontalImage(currentItem);
      const fallbackThumb = safeUrl(currentItem.Banner || currentItem.Poster || '');

      listEl.innerHTML = epList.slice(0, limit).map((ep, idx) => `
        <a class="ep-card" href="1.html?watch=${currentItem.id}&season=${encodeURIComponent(currentSeasonKey)}&ep=${idx + 1}">
          <div class="ep-thumb-wrap">
            <img src="${thumbUrl}" alt="${ep.Name}" onerror="if(this.src!=='${fallbackThumb}') this.src='${fallbackThumb}';">
            <div class="ep-play-circle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          </div>
          <div class="ep-info">
            <div class="ep-name">${ep.Name || `Episode ${idx + 1}`}</div>
            <div class="ep-subtext">S${seasonNum} E${idx + 1} • ${ep.Duration || '22m'}</div>
          </div>
        </a>
      `).join('');

      if (epList.length > 5) {
        viewMoreBtn.style.display = 'flex';
        viewMoreBtn.innerText = showAllEpisodes ? 'View Less' : 'View More';
        viewMoreBtn.onclick = () => {
          showAllEpisodes = !showAllEpisodes;
          renderEpisodesSection();
        };
      } else {
        viewMoreBtn.style.display = 'none';
      }
    }

    window.selectSeasonTab = function(seasonKey) {
      currentSeasonKey = seasonKey;
      renderEpisodesSection();
    };

    function updateWatchlistButtonState() {
      const btn = document.getElementById('btnWatchlist');
      const isAdded = userWatchlist.includes(currentItem.id);
      btn.classList.toggle('active', isAdded);
      document.getElementById('wlLabel').innerText = isAdded ? 'Added' : 'Watchlist';
      document.getElementById('wlIcon').innerHTML = isAdded 
        ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>' 
        : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>';
    }

    document.getElementById('btnWatchlist').onclick = async () => {
      const btn = document.getElementById('btnWatchlist');
      
      btn.classList.remove('animating');
      void btn.offsetWidth;
      btn.classList.add('animating');

      if (!currentUser) {
        try {
          const stored = localStorage.getItem('active_user') || localStorage.getItem('user');
          currentUser = stored ? JSON.parse(stored) : null;
        } catch (e){}
      }

      if (!currentUser) {
        showToast("Please login to save to Watchlist");
        return;
      }

      const isAdded = userWatchlist.includes(currentItem.id);

      if (isAdded) {
        userWatchlist = userWatchlist.filter(id => id !== currentItem.id);
        showToast("Removed from Watchlist");
      } else {
        userWatchlist.push(currentItem.id);
        showToast("Added to Watchlist");
      }
      currentUser.Watchlist = userWatchlist;
      localStorage.setItem('active_user', JSON.stringify(currentUser));
      updateWatchlistButtonState();

      try {
        if (!userDocRef && currentUser.Lotus) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Lotus", "==", currentUser.Lotus)));
          if (!snap.empty) userDocRef = doc(userDb, "UARM", snap.docs[0].id);
        }

        if (userDocRef) {
          if (isAdded) {
            await updateDoc(userDocRef, { Watchlist: arrayRemove(currentItem.id) });
          } else {
            await updateDoc(userDocRef, { Watchlist: arrayUnion(currentItem.id) });
          }
        }
      } catch (err) {}
    };

    document.getElementById('btnShare').onclick = async () => {
      const shareUrl = `${window.location.origin}${window.location.pathname}?preview=${currentItem.id}`;
      if (navigator.share) {
        try {
          await navigator.share({
            title: currentItem.Name || "Hotstar",
            text: `Watch ${currentItem.Name} on Hotstar!`,
            url: shareUrl
          });
        } catch(e){}
      } else {
        navigator.clipboard.writeText(shareUrl);
        showToast("Link copied to clipboard!");
      }
    };

    async function fetchRecommendations() {
      const grid = document.getElementById('recommendationsGrid');
      try {
        const snap = await getDocs(collection(contentDb, currentCollection));
        let items = [];
        snap.forEach(d => {
          if (d.id !== currentItem.id) items.push({ id: d.id, ...d.data() });
        });

        const targetGenres = String(currentItem.Genres || currentItem.Channel || '').toLowerCase().split(/[,/|]+/);
        const targetStudio = String(currentItem.Studio || currentItem.Channel || '').toLowerCase();
        const targetAge = String(currentItem.Age_Rating || '').toLowerCase();

        items.sort((a, b) => {
          let scoreA = 0;
          let scoreB = 0;

          const aG = String(a.Genres || a.Channel || '').toLowerCase();
          const bG = String(b.Genres || b.Channel || '').toLowerCase();
          targetGenres.forEach(g => {
            if (g && aG.includes(g.trim())) scoreA += 10;
            if (g && bG.includes(g.trim())) scoreB += 10;
          });

          if (targetStudio && String(a.Studio || a.Channel || '').toLowerCase().includes(targetStudio)) scoreA += 15;
          if (targetStudio && String(b.Studio || b.Channel || '').toLowerCase().includes(targetStudio)) scoreB += 15;

          if (targetAge && String(a.Age_Rating || '').toLowerCase() === targetAge) scoreA += 5;
          if (targetAge && String(b.Age_Rating || '').toLowerCase() === targetAge) scoreB += 5;

          return scoreB - scoreA;
        });

        grid.innerHTML = items.slice(0, 14).map(c => {
          const primary = getHorizontalImage(c);
          const fallback = safeUrl(c.Banner || c.Poster || '');
          const genres = c.Genres || c.Channel || c.Language || (currentCollection.includes('Shows') ? 'TV Show' : 'Movie');
          
          return `
            <a class="rec-16-9-card" href="preview.html?preview=${c.id}">
              <div class="rec-16-9-thumb">
                <img src="${primary}" alt="${c.Name || 'Title'}" loading="lazy" onerror="if(this.src!=='${fallback}') this.src='${fallback}';">
              </div>
              <div class="rec-title">${c.Name || 'Title'}</div>
              <div class="rec-sub">${genres}</div>
            </a>
          `;
        }).join('');
      } catch (err) {}
    }

    async function start() {
      await loadUserSubscriptionPlan();
      await fetchContentData(contentId);
    }
    start();
  </script>
</body>
</html>
