<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Previewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1014;
            --blue-tag: #42a5f5;
            --text-dim: #a9a9a9;
            --white: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* 1. Banner Area */
        .hero {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }

        #banner-img {
            width: 100%; height: 100%; object-fit: cover;
            transition: opacity 1s;
        }

        #video-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; z-index: 2;
        }

        .trailer-label {
            position: absolute; top: 15px; left: 15px;
            font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.5);
            z-index: 5;
        }

        .close-icon {
            position: absolute; top: 15px; right: 15px; font-size: 20px; z-index: 5;
        }

        /* 2. Language Bar */
        .lang-bar {
            display: flex; gap: 15px; padding: 15px 20px;
            overflow-x: auto; align-items: center;
        }
        .lang-pill {
            padding: 6px 16px; border-radius: 20px; font-size: 13px;
            background: rgba(255,255,255,0.1); color: var(--text-dim);
            white-space: nowrap;
        }
        .lang-pill.active { background: #333; color: #fff; border: 1px solid #555; }

        /* 3. Main Centered Info */
        .content-body {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; padding: 0 20px;
        }

        .main-logo {
            max-width: 160px; max-height: 80px;
            object-fit: contain; margin-bottom: 15px;
        }

        /* BLUE TAGS SECTION */
        .blue-tags {
            color: var(--blue-tag);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
            display: flex; gap: 8px; align-items: center;
        }
        .blue-tags span::after { content: " •"; color: var(--text-dim); margin-left: 5px; }
        .blue-tags span:last-child::after { content: ""; }

        .meta-row {
            font-size: 13px; color: var(--text-dim);
            display: flex; gap: 10px; align-items: center; margin-bottom: 25px;
        }
        .age-rating {
            background: #444; color: #fff; padding: 1px 5px;
            border-radius: 3px; font-weight: bold; font-size: 11px;
        }

        /* 4. Action Button */
        .btn-play {
            width: 100%; max-width: 380px;
            background: #e1e6f0; color: #000;
            border: none; padding: 12px; border-radius: 8px;
            font-size: 16px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            gap: 10px; margin-bottom: 25px; cursor: pointer;
        }
        .btn-play span { color: #777; font-weight: 400; font-size: 14px; }

        /* 5. Details Section */
        .genres {
            font-size: 14px; font-weight: 500; color: #fff;
            margin-bottom: 12px;
        }
        .genres span { margin: 0 8px; color: #555; }

        .desc {
            font-size: 13px; color: var(--text-dim);
            line-height: 1.5; text-align: left; width: 100%;
            margin-bottom: 15px;
        }
        .air-time {
            font-weight: bold; font-size: 13px; text-align: left; width: 100%;
            margin-bottom: 30px;
        }

        /* 6. Action Icons */
        .action-row {
            display: flex; justify-content: space-around; width: 100%;
            max-width: 300px; margin-bottom: 40px;
        }
        .action-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 11px; color: var(--text-dim); gap: 8px;
        }
        .action-item i { font-size: 20px; color: #fff; }

    </style>
</head>
<body>

<div id="app">
    <!-- Banner Section -->
    <div class="hero">
        <div class="trailer-label">TRAILER</div>
        <div class="close-icon">✕</div>
        <img id="banner-img" src="" alt="">
        <div id="video-container"></div>
    </div>

    <!-- Language Selector -->
    <div class="lang-bar">
        <div class="lang-pill active">Hindi <span>Original</span></div>
        <div class="lang-pill">Telugu</div>
        <div class="lang-pill">Bhojpuri</div>
        <div class="lang-pill">Tamil</div>
    </div>

    <!-- Main Content -->
    <div class="content-body">
        <img id="logo-img" class="main-logo" src="" alt="">
        
        <!-- Blue Tags -->
        <div class="blue-tags" id="blue-tags">
            <!-- Dynamically loaded: Grand Premiere, New Release -->
        </div>

        <!-- Meta Data -->
        <div class="meta-row" id="meta-row">
            <!-- Year, Age, Languages -->
        </div>

        <!-- Action Button -->
        <button class="btn-play">
            <span style="color:#000; font-size: 18px;">▶</span> 
            <label id="btn-label">Watch Now</label> 
            <span id="btn-subtext"></span>
        </button>

        <!-- Genres -->
        <div class="genres" id="genres-row"></div>

        <!-- Description -->
        <div class="desc" id="description"></div>
        <div class="air-time" id="air-time"></div>

        <!-- Bottom Icons -->
        <div class="action-row">
            <div class="action-item"><i>＋</i> Watchlist</div>
            <div class="action-item"><i>➦</i> Share</div>
            <div class="action-item"><i>♡</i> Rate</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
        authDomain: "internal-systems-46728.firebaseapp.com",
        projectId: "internal-systems-46728",
        storageBucket: "internal-systems-46728.firebasestorage.app",
        messagingSenderId: "172177452674",
        appId: "1:172177452674:web:155a2417da5531dd7ece9b",
        measurementId: "G-Y87B8VRQ1N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const watchId = urlParams.get('watch');

    async function load() {
        if(!watchId) return;
        const snap = await getDoc(doc(db, "Live TV", watchId));
        if(snap.exists()) render(snap.data());
    }

    function render(data) {
        document.getElementById('banner-img').src = data.Banner;
        document.getElementById('logo-img').src = data.Logo;
        document.getElementById('description').innerText = data.Description;

        // Blue Tags Logic (Add if they exist in your DB or check tags)
        const blueTagArea = document.getElementById('blue-tags');
        if(data.Tags && data.Tags.includes("Grand Premiere")) {
            blueTagArea.innerHTML += `<span>Grand Premiere</span>`;
        }
        blueTagArea.innerHTML += `<span>New Release</span>`; // Hardcoded for demo matching screenshot

        // Meta Info
        document.getElementById('meta-row').innerHTML = `
            <span>2026</span>
            <span class="age-rating">${data['Age Rating'] || 'U/A 13+'}</span>
            <span>5 Languages</span>
        `;

        // Action Button
        const label = document.getElementById('btn-label');
        const sub = document.getElementById('btn-subtext');
        if(data.Type === 'Series') {
            label.innerText = "Watch Latest Episode";
            sub.innerText = "15 Aug";
            document.getElementById('air-time').innerText = "New Episode Sat-Sun at 8:00PM";
        }

        // Genres
        if(data.Genres) {
            const genreList = data.Genres.split(',').join(' <span>|</span> ');
            document.getElementById('genres-row').innerHTML = genreList;
        }

        // Trailer Logic (3 second delay)
        setTimeout(() => {
            if (data.Stream && data.Stream.includes('youtube')) {
                const videoBox = document.getElementById('video-container');
                videoBox.style.display = 'block';
                document.getElementById('banner-img').style.opacity = '0';
                let id = data.Stream.split('v=')[1] || data.Stream.split('/').pop();
                videoBox.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0" frameborder="0"></iframe>`;
            }
        }, 3000);
    }

    load();
</script>

</body>
</html>
