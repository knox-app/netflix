<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hotstar - Preview</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-color: #0f1015;
      --card-bg: #151821;
      --accent-blue: #1480f0;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --border-color: rgba(255, 255, 255, 0.1);
      --btn-white: #ffffff;
      --btn-white-text: #0f1015;
      --btn-dark: #1e2230;
      --live-red: #e50914;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* ============================================================
       DESKTOP & TV LAYOUT (SCREEN WIDTH > 768px)
       ============================================================ */
    @media (min-width: 769px) {
      body {
        display: flex;
        padding-bottom: 50px;
      }

      /* Left Vertical Sidebar Navigation */
      .desktop-sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 72px;
        background: rgba(15, 16, 21, 0.95);
        backdrop-filter: blur(20px);
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 0;
        z-index: 1000;
      }
      .brand-star-icon {
        width: 32px;
        height: 32px;
        fill: #fff;
        margin-bottom: 40px;
        cursor: pointer;
      }
      .nav-icon-list {
        display: flex;
        flex-direction: column;
        gap: 28px;
        align-items: center;
        width: 100%;
      }
      .sidebar-nav-item {
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        transition: color 0.2s ease, background 0.2s ease;
      }
      .sidebar-nav-item:hover, .sidebar-nav-item.active {
        color: #fff;
        background: rgba(255, 255, 255, 0.08);
      }
      .sidebar-nav-item svg { width: 22px; height: 22px; fill: currentColor; }

      .sidebar-bottom {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
        align-items: center;
      }
      .user-avatar-pill {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, #1480f0, #ff007a);
        cursor: pointer;
      }

      /* Desktop Main Content Container */
      .desktop-content-body {
        margin-left: 72px;
        flex: 1;
        width: calc(100% - 72px);
        min-height: 100vh;
        position: relative;
      }

      /* Fullscreen Cinematic Hero Banner */
      .hero-card-box {
        position: relative;
        width: 100%;
        height: 80vh;
        min-height: 540px;
        max-height: 780px;
        overflow: hidden;
        background: #000;
      }
      .hero-banner-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center right;
        transition: opacity 0.8s ease;
      }
      .hero-trailer-host {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.8s ease;
        background: #000;
        overflow: hidden;
      }
      .hero-trailer-host.playing { opacity: 1; }
      .hero-trailer-host iframe {
        width: calc(100% + 200px) !important;
        height: calc(100% + 200px) !important;
        position: absolute !important;
        top: -100px !important;
        left: -100px !important;
        pointer-events: none;
      }
      .hero-trailer-host video { width: 100%; height: 100%; object-fit: cover; }

      /* Desktop Cinematic Shadow Gradients */
      .hero-desktop-gradient {
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, rgba(15, 16, 21, 0.98) 0%, rgba(15, 16, 21, 0.8) 35%, rgba(15, 16, 21, 0.2) 65%, transparent 100%),
                    linear-gradient(to top, #0f1015 0%, rgba(15, 16, 21, 0.6) 20%, transparent 50%);
        pointer-events: none;
        z-index: 2;
      }

      /* Left Inset Metadata Overlay on Desktop */
      .content-details-wrap {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 48%;
        min-width: 460px;
        max-width: 620px;
        padding: 60px 0 40px 60px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        text-align: left;
        z-index: 5;
      }

      .brand-logo-img {
        max-width: 320px;
        max-height: 120px;
        object-fit: contain;
        margin-bottom: 16px;
        filter: drop-shadow(0 6px 18px rgba(0,0,0,0.9));
      }
      .title-fallback-hindi {
        font-family: 'Noto Sans Devanagari', sans-serif;
        font-size: 42px;
        font-weight: 900;
        line-height: 1.15;
        margin-bottom: 14px;
        color: #ffffff;
      }

      .blue-trend-line {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 800;
        color: var(--accent-blue);
        margin-bottom: 10px;
      }

      .meta-pills-row {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 14px;
      }

      .description-para {
        font-size: 14px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.78);
        margin-bottom: 16px;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .genres-tags-line {
        font-size: 13px;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 24px;
      }
      .genres-tags-line span { color: var(--text-muted); margin: 0 6px; }

      /* Desktop Button Cluster */
      .cta-container {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 14px;
        width: 100%;
      }
      .btn-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 13px 28px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.15s ease;
        border: none;
        width: auto;
      }
      .btn-cta:active { transform: scale(0.96); }
      .btn-cta svg { width: 20px; height: 20px; fill: currentColor; }

      /* Desktop Watchlist & Share Buttons */
      .desktop-action-buttons {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .btn-circle-action {
        width: 46px;
        height: 46px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(10px);
        transition: background 0.2s ease, transform 0.1s ease;
      }
      .btn-circle-action:hover { background: rgba(255, 255, 255, 0.22); }
      .btn-circle-action:active { transform: scale(0.94); }
      .btn-circle-action svg { width: 22px; height: 22px; fill: currentColor; }
      .btn-circle-action.active { color: var(--accent-blue); }

      /* Sound Toggle in bottom right of desktop hero */
      .desktop-audio-toggle {
        position: absolute;
        bottom: 35px;
        right: 40px;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(15, 16, 21, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 10;
        backdrop-filter: blur(12px);
      }
      .desktop-audio-toggle svg { width: 20px; height: 20px; fill: #fff; }

      /* Sections below Hero */
      .section-container {
        padding: 0 60px;
        margin-top: 24px;
        margin-bottom: 36px;
      }

      /* Hide Mobile elements on Desktop */
      .mobile-only { display: none !important; }
    }

    /* ============================================================
       MOBILE & SMALL SCREENS LAYOUT (SCREEN WIDTH <= 768px)
       ============================================================ */
    @media (max-width: 768px) {
      body {
        padding: 12px 14px 90px;
      }
      .desktop-only { display: none !important; }

      .main-wrap {
        max-width: 600px;
        margin: 0 auto;
      }

      /* Top Close Button on Mobile */
      .top-close-bar {
        position: absolute;
        top: 24px;
        right: 26px;
        z-index: 50;
      }
      .close-btn {
        background: rgba(15, 16, 23, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #fff;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(10px);
      }
      .close-btn svg { width: 18px; height: 18px; fill: #fff; }

      /* Rounded Inset Card Box */
      .hero-card-box {
        position: relative;
        width: 100%;
        aspect-ratio: 16/10;
        background-color: #12141c;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 24px;
      }
      .hero-banner-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: opacity 0.5s ease;
      }
      .hero-trailer-host {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.6s ease;
        background: #000;
        overflow: hidden;
      }
      .hero-trailer-host.playing { opacity: 1; }
      .hero-trailer-host iframe {
        width: calc(100% + 140px) !important;
        height: calc(100% + 160px) !important;
        position: absolute !important;
        top: -80px !important;
        left: -70px !important;
        pointer-events: none;
      }
      .hero-trailer-host video { width: 100%; height: 100%; object-fit: cover; }

      /* Mobile Details */
      .content-details-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 6px;
      }
      .brand-logo-img {
        max-width: 230px;
        max-height: 85px;
        object-fit: contain;
        margin-bottom: 10px;
        filter: drop-shadow(0 4px 14px rgba(0,0,0,0.85));
      }
      .title-fallback-hindi {
        font-family: 'Noto Sans Devanagari', sans-serif;
        font-size: 32px;
        font-weight: 900;
        line-height: 1.2;
        margin-bottom: 10px;
        color: #ffffff;
      }
      .blue-trend-line {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 700;
        color: var(--accent-blue);
        margin-bottom: 6px;
      }
      .meta-pills-row {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 7px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 18px;
      }
      .cta-container {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }
      .btn-cta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        padding: 13px 18px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        border: none;
      }
      .btn-cta svg { width: 18px; height: 18px; fill: currentColor; }

      .genres-tags-line {
        font-size: 13px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 8px;
      }
      .genres-tags-line span { color: var(--text-muted); margin: 0 4px; }
      .description-para {
        font-size: 13px;
        line-height: 1.5;
        color: var(--text-muted);
        margin-bottom: 24px;
      }

      /* Mobile 2-item Actions Row (Watchlist & Share) */
      .action-icons-row {
        display: flex;
        justify-content: center;
        gap: 56px;
        width: 100%;
        margin-bottom: 28px;
        padding: 0 8px;
      }
      .action-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        opacity: 0.85;
      }
      .action-item svg { width: 22px; height: 22px; fill: currentColor; }
      .action-item.active { color: var(--accent-blue); }

      .section-container {
        width: 100%;
        margin-bottom: 26px;
        text-align: left;
      }

      /* Bottom Navigation Bar for Mobile */
      .bottom-app-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 60px;
        background: rgba(9, 10, 15, 0.95);
        backdrop-filter: blur(14px);
        border-top: 1px solid var(--border-color);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 100;
      }
      .nav-tab-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        text-decoration: none;
      }
      .nav-tab-item.active { color: #fff; }
      .nav-tab-item svg { width: 22px; height: 22px; fill: currentColor; }
    }

    /* ============================================================
       SHARED THEME & COMPONENT STYLES
       ============================================================ */
    .meta-pill-badge {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Subscribe Button Style: White Background with Dark Text */
    .btn-cta-subscribe, .btn-cta-primary {
      background-color: #ffffff !important;
      color: #0f1015 !important;
    }
    .btn-cta-secondary {
      background-color: var(--btn-dark) !important;
      color: #ffffff !important;
      border: 1px solid var(--border-color);
    }

    .trailer-badge {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      backdrop-filter: blur(6px);
      z-index: 10;
    }

    /* Keyframe Pop Animation for Watchlist */
    @keyframes bouncePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35) rotate(-10deg); }
      75% { transform: scale(0.9) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .animating svg {
      animation: bouncePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .section-heading {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
      color: #fff;
    }

    /* TV Show Episodes */
    .episodes-wrapper { display: none; }
    .season-tab-row {
      display: flex;
      gap: 18px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .season-tab-row::-webkit-scrollbar { display: none; }
    .season-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      padding-bottom: 6px;
    }
    .season-btn.active { color: #fff; }
    .season-btn.active::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 0;
      right: 0;
      height: 2.5px;
      background: #fff;
    }

    .episodes-list { display: flex; flex-direction: column; gap: 14px; }
    .ep-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      text-decoration: none;
      color: #fff;
    }
    .ep-card:hover { background: rgba(255, 255, 255, 0.06); }
    .ep-thumb-wrap {
      position: relative;
      width: 130px;
      min-width: 130px;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #151821;
    }
    .ep-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .ep-play-circle {
      position: absolute;
      bottom: 6px;
      left: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ep-play-circle svg { width: 10px; height: 10px; fill: #fff; margin-left: 1px; }

    .ep-info { flex: 1; min-width: 0; }
    .ep-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ep-subtext { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

    .view-more-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 140px;
      margin: 16px auto 6px;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 16:9 Recommendations Scroll */
    .rec-scroll-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 12px;
      scrollbar-width: none;
    }
    .rec-scroll-row::-webkit-scrollbar { display: none; }

    .rec-16-9-card {
      min-width: 210px;
      width: 210px;
      scroll-snap-align: start;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease;
    }
    .rec-16-9-card:hover { transform: translateY(-4px); }
    .rec-16-9-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      margin-bottom: 6px;
    }
    .rec-16-9-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .rec-title { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rec-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }

    .toast-box {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(21, 24, 33, 0.95);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .toast-box.show { opacity: 1; }

    .loader-wrap {
      text-align: center;
      padding: 140px 20px;
      color: var(--accent-blue);
      font-weight: 700;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- ================= DESKTOP SIDEBAR ================= -->
  <div class="desktop-sidebar desktop-only">
    <svg class="brand-star-icon" viewBox="0 0 24 24"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 16.8 5.8 21.3l2.4-7.4L2 9.4h7.6z"/></svg>
    <div class="nav-icon-list">
      <div class="sidebar-nav-item active" title="Home"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div>
      <div class="sidebar-nav-item" title="Search"><svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, updateDoc, arrayUnion, arrayRemove, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Content Database (internal-systems-46728)
    const contentConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };
    const contentApp = initializeApp(contentConfig, "contentApp");
    const contentDb = getFirestore(contentApp);

    // 2. User Database (question-metabase)
    const userConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase",
      storageBucket: "question-metabase.firebasestorage.app",
      messagingSenderId: "770698198753",
      appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
      measurementId: "G-6ZP1FPMKSJ"
    };
    const userApp = initializeApp(userConfig, "userApp");
    const userDb = getFirestore(userApp);

    // Runtime App State
    let currentItem = null;
    let contentType = 'movie'; 
    let currentCollection = 'Movies';
    let currentUser = null;
    let userDocRef = null;
    let userWatchlist = [];
    let userAuthorizedStudios = new Set();
    let hasAccess = false;
    let trailerTimeout = null;
    let ytTrailerPlayer = null;
    let currentSeasonKey = null;
    let showAllEpisodes = false;
    let isMuted = true;

    const urlParams = new URLSearchParams(window.location.search);
    const contentId = urlParams.get('preview') || urlParams.get('watch');

    function showToast(msg) {
      const toast = document.getElementById('toastAlert');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function safeUrl(url) {
      if (!url) return '';
      return url.trim().replace(/^http:\/\//i, 'https://');
    }

    function getHorizontalImage(c) {
      if (!c) return '';
      return safeUrl(c["Poster.h"] || c.Poster_h || c.poster_h || c.Banner || c.banner || c.Poster || c["Poster.v"] || '');
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      try {
        const u = new URL(url.trim());
        if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0];
        if (u.hostname.includes('youtube.com') || u.hostname.includes('m.youtube.com')) {
          if (u.pathname === '/watch') return u.searchParams.get('v');
          if (u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
          if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
        }
      } catch (e) {
        if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) return url.trim();
      }
      return null;
    }

    async function getHindiName(englishName) {
      if (!englishName) return "कंटेंट";
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=hi&dt=t&q=${encodeURIComponent(englishName)}`);
        const data = await res.json();
        if (data && data[0] && data[0][0] && data[0][0][0]) {
          return data[0][0][0];
        }
      } catch (e) {}
      return englishName;
    }

    // Load Plan and Studios from Firestore
    async function loadUserSubscriptionPlan() {
      try {
        const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
        currentUser = stored ? JSON.parse(stored) : null;
      } catch (e) { currentUser = null; }

      if (!currentUser) return;
      userWatchlist = Array.isArray(currentUser.Watchlist) ? currentUser.Watchlist : [];

      try {
        let uData = null;
        if (currentUser.Lotus) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Lotus", "==", currentUser.Lotus)));
          if (!snap.empty) {
            userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            uData = snap.docs[0].data();
          }
        } else if (currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id) {
          const uId = currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id;
          userDocRef = doc(userDb, "UARM", uId);
          const snap = await getDoc(userDocRef);
          if (snap.exists()) uData = snap.data();
        } else if (currentUser.Email) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Email", "==", currentUser.Email)));
          if (!snap.empty) {
            userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            uData = snap.docs[0].data();
          }
        }

        if (uData) {
          userWatchlist = Array.isArray(uData.Watchlist) ? uData.Watchlist : userWatchlist;
          currentUser = { ...currentUser, ...uData };
          localStorage.setItem('active_user', JSON.stringify(currentUser));
        }

        const userPlanIds = Array.isArray(currentUser.Plans) ? currentUser.Plans : (currentUser.Plan ? [currentUser.Plan] : []);

        const planPromises = userPlanIds.map(async (planId) => {
          if (!planId) return;
          try {
            let pSnap = await getDoc(doc(userDb, "Plans & Subscriptions", planId));
            if (!pSnap.exists()) {
              pSnap = await getDoc(doc(userDb, "Plans & Subscription", planId));
            }
            if (pSnap.exists()) {
              const pData = pSnap.data();
              const studios = Array.isArray(pData.Studio) ? pData.Studio : (pData.Studios || []);
              studios.forEach(s => userAuthorizedStudios.add(String(s).trim().toLowerCase()));
            }
          } catch (err) {}
        });

        await Promise.all(planPromises);
      } catch (err) {}
    }

    function checkContentAccess(content) {
      if (!content) return false;
      const contentStudio = String(content.Studio || content.Partner || '').trim().toLowerCase();

      if (!contentStudio || contentStudio === 'free' || contentStudio === 'open') return true;
      if (userAuthorizedStudios.has(contentStudio)) return true;

      for (const authStudio of userAuthorizedStudios) {
        if (contentStudio.includes(authStudio) || authStudio.includes(contentStudio)) {
          return true;
        }
      }
      return false;
    }

    async function fetchContentData(id) {
      const collections = ["Live TV", "Movies", "Shows"];
      let matchedDoc = null;

      for (const col of collections) {
        try {
          const snap = await getDoc(doc(contentDb, col, id));
          if (snap.exists()) {
            matchedDoc = snap.data();
            currentCollection = col;
            break;
          }
        } catch (e) {}
      }

      if (!matchedDoc) {
        document.getElementById('loader').innerText = `Content "${id}" not found.`;
        return;
      }

      currentItem = { id, ...matchedDoc };
      hasAccess = checkContentAccess(currentItem);

      const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
      if (currentCollection === "Shows" || seasons.length > 0) {
        contentType = 'show';
        currentSeasonKey = seasons[0] || 'Season 1';
      } else if (currentCollection === "Movies") {
        contentType = 'movie';
      } else {
        contentType = 'live';
      }

      await renderPreviewUI();
      scheduleTrailerPlayback();
      fetchRecommendations();
    }

    async function renderPreviewUI() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('previewMain').style.display = 'block';

      // 1. Banner
      const bannerImg = document.getElementById('heroBanner');
      const primaryBanner = getHorizontalImage(currentItem);
      const secondaryBanner = safeUrl(currentItem.Banner || currentItem.Poster || '');

      bannerImg.src = primaryBanner;
      bannerImg.onerror = () => {
        if (secondaryBanner && bannerImg.src !== secondaryBanner) {
          bannerImg.src = secondaryBanner;
        }
      };

      // 2. Logo / Hindi Fallback for Desktop & Mobile
      const logoUrl = safeUrl(currentItem.Logo || currentItem["Logo.png"] || '');
      const rawTitle = currentItem.Name || currentItem.Title || "कंटेंट";
      const hindiText = currentItem["Hindi Name"] || currentItem.Hindi_Name || await getHindiName(rawTitle);

      ['Desk', 'Mob'].forEach(target => {
        const logoEl = document.getElementById(`contentLogo${target}`);
        const titleEl = document.getElementById(`contentTitle${target}`);
        if (logoUrl) {
          logoEl.src = logoUrl;
          logoEl.style.display = 'block';
          titleEl.style.display = 'none';
          logoEl.onerror = () => {
            logoEl.style.display = 'none';
            titleEl.innerText = hindiText;
            titleEl.style.display = 'block';
          };
        } else {
          logoEl.style.display = 'none';
          titleEl.innerText = hindiText;
          titleEl.style.display = 'block';
        }
      });

      // 3. Blue Trend / Awards
      const trendText = currentItem.Trending || currentItem.Rank ? `#${currentItem.Trending || currentItem.Rank} in Hindi Today` : (currentItem.Awards || 'Emmy® Winner');
      const ratingVal = currentItem.Rating || currentItem.IMDb || currentItem.imdb;
      const ratingText = ratingVal ? `IMDb ${ratingVal}` : '';

      ['Desk', 'Mob'].forEach(target => {
        const el = document.getElementById(`blueTrendLine${target}`);
        if (trendText || ratingText) {
          el.innerHTML = `
            ${trendText ? `<span>${trendText}</span>` : ''}
            ${trendText && ratingText ? `<span class="dot">•</span>` : ''}
            ${ratingText ? `<span>${ratingText}</span>` : ''}
          `;
          el.style.display = 'flex';
        } else {
          el.style.display = 'none';
        }
      });

      // 4. Meta Pills
      const year = currentItem.Year || currentItem["Release Year"] || (contentType === 'live' ? 'LIVE' : '2025');
      const age = currentItem.Age_Rating || currentItem["Age Rating"] || currentItem.Rating || 'U/A 13+';
      const langArr = Array.isArray(currentItem.Language) ? currentItem.Language : (currentItem.Language ? [currentItem.Language] : ['English']);
      const langText = langArr.length > 1 ? `${langArr.length} Languages` : (langArr[0] || 'English');
      
      let durationOrSeasons = '';
      if (contentType === 'show') {
        const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
        durationOrSeasons = `${seasons.length || 1} Season${seasons.length > 1 ? 's' : ''}`;
      } else if (contentType === 'movie') {
        durationOrSeasons = currentItem.Duration || '1h 50m';
      }

      const metaHtml = `
        <span>${year}</span>
        <span class="meta-pill-badge">${age}</span>
        ${durationOrSeasons ? `<span>•</span><span>${durationOrSeasons}</span>` : ''}
        <span>•</span><span>${langText}</span>
      `;
      document.getElementById('metaPillsRowDesk').innerHTML = metaHtml;
      document.getElementById('metaPillsRowMob').innerHTML = metaHtml;

      // 5. Description & Genres
      const desc = currentItem.Discription || currentItem.Description || "Brave Wakandan War Dogs, of the secret organization the Hatut Zeraze, throughout history must go on dangerous missions to retrieve Vibranium artifacts.";
      document.getElementById('contentDescriptionDesk').innerText = desc;
      document.getElementById('contentDescriptionMob').innerText = desc;

      const rawGenres = currentItem.Genres || currentItem.Tags || 'Super Heroes | Action | Adventure | Science Fiction';
      const genreItems = (Array.isArray(rawGenres) ? rawGenres : String(rawGenres).split(/[,/|]+/)).map(g => g.trim()).filter(Boolean);
      const genreHtml = genreItems.map(g => `<b>${g}</b>`).join(' <span>|</span> ');
      document.getElementById('genresTagsLineDesk').innerHTML = genreHtml;
      document.getElementById('genresTagsLineMob').innerHTML = genreHtml;

      // 6. Action Buttons
      renderCTAButtons();
      updateWatchlistUI();

      // 7. Episodes (if show)
      if (contentType === 'show') {
        renderEpisodesSection();
      } else {
        document.getElementById('episodesSection').style.display = 'none';
      }
    }

    function renderCTAButtons() {
      let ctaHtml = '';

      if (!hasAccess) {
        ctaHtml = `
          <a class="btn-cta btn-cta-subscribe" href="1.html?action=subscribe&studio=${encodeURIComponent(currentItem.Studio || '')}">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            Upgrade to Watch
          </a>
        `;
      } else {
        let resumeKey = currentItem.id;
        if (contentType === 'show' && currentSeasonKey) {
          resumeKey = `${currentItem.id}_${currentSeasonKey}_ep0`;
        }
        const savedTime = parseFloat(localStorage.getItem(`progress_${resumeKey}`) || '0');
        const hasWatchedBefore = savedTime > 15;

        if (hasWatchedBefore && contentType !== 'live') {
          const subLabel = contentType === 'show' ? 'S1 E1' : '';
          ctaHtml = `
            <a class="btn-cta btn-cta-primary" href="1.html?watch=${currentItem.id}&action=resume">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              Resume ${subLabel}
            </a>
            <a class="btn-cta btn-cta-secondary" href="1.html?watch=${currentItem.id}&action=starting">
              <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
              Watch from Beginning
            </a>
          `;
        } else {
          let primaryLabel = "Watch Now";
          if (contentType === 'live') primaryLabel = "Watch Live";
          ctaHtml = `
            <a class="btn-cta btn-cta-primary" href="1.html?watch=${currentItem.id}&action=starting">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              ${primaryLabel}
            </a>
          `;
        }
      }

      document.getElementById('desktopCtaBtnBox').innerHTML = ctaHtml;
      document.getElementById('mobileCtaBtnBox').innerHTML = ctaHtml;
    }

    // Trailer Playback & Reset to Banner
    function scheduleTrailerPlayback() {
      const trailerBadge = document.getElementById('trailerBadge');
      const host = document.getElementById('heroTrailerHost');
      const trailerUrl = safeUrl(currentItem.Trailer || '');

      clearTimeout(trailerTimeout);
      trailerTimeout = setTimeout(() => {
        if (!trailerUrl) {
          trailerBadge.innerText = "UNAVAILABLE";
          trailerBadge.style.display = "block";
          return;
        }

        const ytId = extractYouTubeId(trailerUrl);
        if (ytId) {
          host.innerHTML = `<div id="ytTrailerActualPlayer"></div>`;
          host.classList.add('playing');
          trailerBadge.innerText = "TRAILER";
          trailerBadge.style.display = "block";

          ytTrailerPlayer = new YT.Player('ytTrailerActualPlayer', {
            videoId: ytId,
            playerVars: {
              autoplay: 1,
              controls: 0,
              disablekb: 1,
              fs: 0,
              rel: 0,
              modestbranding: 1,
              showinfo: 0,
              iv_load_policy: 3,
              mute: isMuted ? 1 : 0,
              playsinline: 1
            },
            events: {
              onReady: (e) => e.target.playVideo(),
              onStateChange: (e) => {
                if (e.data === YT.PlayerState.ENDED) {
                  host.classList.remove('playing');
                  trailerBadge.style.display = 'none';
                  try { ytTrailerPlayer.destroy(); } catch(err){}
                }
              },
              onError: () => {
                host.classList.remove('playing');
                trailerBadge.innerText = "UNAVAILABLE";
              }
            }
          });
        } else if (trailerUrl.endsWith('.mp4') || trailerUrl.includes('.m3u8')) {
          host.innerHTML = `<video id="videoTrailerEl" src="${trailerUrl}" autoplay ${isMuted ? 'muted' : ''} playsinline></video>`;
          host.classList.add('playing');
          trailerBadge.innerText = "TRAILER";
          trailerBadge.style.display = "block";

          const vid = document.getElementById('videoTrailerEl');
          vid.onended = () => {
            host.classList.remove('playing');
            trailerBadge.style.display = 'none';
          };
        } else {
          trailerBadge.innerText = "UNAVAILABLE";
          trailerBadge.style.display = "block";
        }
      }, 3000);
    }

    // Desktop Audio Mute / Unmute Toggle
    document.getElementById('desktopMuteBtn').onclick = () => {
      isMuted = !isMuted;
      const muteIcon = document.getElementById('muteIcon');
      if (isMuted) {
        muteIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
        if (ytTrailerPlayer && ytTrailerPlayer.mute) ytTrailerPlayer.mute();
        const vid = document.getElementById('videoTrailerEl');
        if (vid) vid.muted = true;
      } else {
        muteIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
        if (ytTrailerPlayer && ytTrailerPlayer.unMute) ytTrailerPlayer.unMute();
        const vid = document.getElementById('videoTrailerEl');
        if (vid) vid.muted = false;
      }
    };

    // TV Show Episodes Section
    function renderEpisodesSection() {
      const epWrap = document.getElementById('episodesSection');
      const tabsRow = document.getElementById('seasonTabsRow');
      const listEl = document.getElementById('episodesList');
      const viewMoreBtn = document.getElementById('btnViewMoreEpisodes');

      const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
      if (seasons.length === 0) {
        epWrap.style.display = 'none';
        return;
      }

      epWrap.style.display = 'block';
      tabsRow.innerHTML = seasons.map(s => `
        <button class="season-btn ${s === currentSeasonKey ? 'active' : ''}" onclick="window.selectSeasonTab('${s}')">
          ${s}
        </button>
      `).join('');

      const epList = currentItem[currentSeasonKey] || [];
      const seasonNum = currentSeasonKey.replace(/\D/g, '') || '1';
      const limit = showAllEpisodes ? epList.length : 5;
      const thumbUrl = getHorizontalImage(currentItem);
      const fallbackThumb = safeUrl(currentItem.Banner || currentItem.Poster || '');

      listEl.innerHTML = epList.slice(0, limit).map((ep, idx) => `
        <a class="ep-card" href="1.html?watch=${currentItem.id}&season=${encodeURIComponent(currentSeasonKey)}&ep=${idx + 1}">
          <div class="ep-thumb-wrap">
            <img src="${thumbUrl}" alt="${ep.Name}" onerror="if(this.src!=='${fallbackThumb}') this.src='${fallbackThumb}';">
            <div class="ep-play-circle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          </div>
          <div class="ep-info">
            <div class="ep-name">${ep.Name || `Episode ${idx + 1}`}</div>
            <div class="ep-subtext">S${seasonNum} E${idx + 1} • ${ep.Duration || '28m'}</div>
          </div>
        </a>
      `).join('');

      if (epList.length > 5) {
        viewMoreBtn.style.display = 'flex';
        viewMoreBtn.innerText = showAllEpisodes ? 'View Less' : 'View More';
        viewMoreBtn.onclick = () => {
          showAllEpisodes = !showAllEpisodes;
          renderEpisodesSection();
        };
      } else {
        viewMoreBtn.style.display = 'none';
      }
    }

    window.selectSeasonTab = function(seasonKey) {
      currentSeasonKey = seasonKey;
      renderEpisodesSection();
    };

    // Watchlist Updates & Animating
    function updateWatchlistUI() {
      const isAdded = userWatchlist.includes(currentItem.id);
      
      // Desktop Circle Button
      const btnDesk = document.getElementById('btnWatchlistDesk');
      btnDesk.classList.toggle('active', isAdded);
      document.getElementById('wlIconDesk').innerHTML = isAdded
        ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>'
        : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>';

      // Mobile Action Item
      const btnMob = document.getElementById('btnWatchlistMob');
      btnMob.classList.toggle('active', isAdded);
      document.getElementById('wlLabelMob').innerText = isAdded ? 'Added' : 'Watchlist';
      document.getElementById('wlIconMob').innerHTML = isAdded 
        ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>' 
        : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>';
    }

    async function toggleWatchlist(el) {
      el.classList.remove('animating');
      void el.offsetWidth;
      el.classList.add('animating');

      if (!currentUser) {
        try {
          const stored = localStorage.getItem('active_user') || localStorage.getItem('user');
          currentUser = stored ? JSON.parse(stored) : null;
        } catch (e){}
      }

      if (!currentUser) {
        showToast("Please login to save to Watchlist");
        return;
      }

      const isAdded = userWatchlist.includes(currentItem.id);

      if (isAdded) {
        userWatchlist = userWatchlist.filter(id => id !== currentItem.id);
        showToast("Removed from Watchlist");
      } else {
        userWatchlist.push(currentItem.id);
        showToast("Added to Watchlist");
      }

      currentUser.Watchlist = userWatchlist;
      localStorage.setItem('active_user', JSON.stringify(currentUser));
      updateWatchlistUI();

      try {
        if (!userDocRef && currentUser.Lotus) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Lotus", "==", currentUser.Lotus)));
          if (!snap.empty) userDocRef = doc(userDb, "UARM", snap.docs[0].id);
        }
        if (userDocRef) {
          if (isAdded) {
            await updateDoc(userDocRef, { Watchlist: arrayRemove(currentItem.id) });
          } else {
            await updateDoc(userDocRef, { Watchlist: arrayUnion(currentItem.id) });
          }
        }
      } catch (err) {}
    }

    document.getElementById('btnWatchlistDesk').onclick = () => toggleWatchlist(document.getElementById('btnWatchlistDesk'));
    document.getElementById('btnWatchlistMob').onclick = () => toggleWatchlist(document.getElementById('btnWatchlistMob'));

    // Share Action
    function handleShare() {
      const shareUrl = `${window.location.origin}${window.location.pathname}?preview=${currentItem.id}`;
      if (navigator.share) {
        try {
          navigator.share({
            title: currentItem.Name || "Hotstar",
            text: `Watch ${currentItem.Name} on Hotstar!`,
            url: shareUrl
          });
        } catch(e){}
      } else {
        navigator.clipboard.writeText(shareUrl);
        showToast("Link copied to clipboard!");
      }
    }
    document.getElementById('btnShareDesk').onclick = handleShare;
    document.getElementById('btnShareMob').onclick = handleShare;

    // 16:9 Recommendations Engine
    async function fetchRecommendations() {
      const grid = document.getElementById('recommendationsGrid');
      try {
        const snap = await getDocs(collection(contentDb, currentCollection));
        let items = [];
        snap.forEach(d => {
          if (d.id !== currentItem.id) items.push({ id: d.id, ...d.data() });
        });

        const targetGenres = String(currentItem.Genres || '').toLowerCase().split(/[,/|]+/);
        const targetStudio = String(currentItem.Studio || '').toLowerCase();
        const targetAge = String(currentItem.Age_Rating || '').toLowerCase();

        items.sort((a, b) => {
          let scoreA = 0;
          let scoreB = 0;

          const aG = String(a.Genres || '').toLowerCase();
          const bG = String(b.Genres || '').toLowerCase();
          targetGenres.forEach(g => {
            if (g && aG.includes(g.trim())) scoreA += 10;
            if (g && bG.includes(g.trim())) scoreB += 10;
          });

          if (targetStudio && String(a.Studio || '').toLowerCase().includes(targetStudio)) scoreA += 15;
          if (targetStudio && String(b.Studio || '').toLowerCase().includes(targetStudio)) scoreB += 15;

          if (targetAge && String(a.Age_Rating || '').toLowerCase() === targetAge) scoreA += 5;
          if (targetAge && String(b.Age_Rating || '').toLowerCase() === targetAge) scoreB += 5;

          return scoreB - scoreA;
        });

        grid.innerHTML = items.slice(0, 14).map(c => {
          const primary = getHorizontalImage(c);
          const fallback = safeUrl(c.Banner || c.Poster || '');
          const genres = c.Genres || c.Language || (currentCollection === 'Live TV' ? 'Live TV' : 'Movie');
          
          return `
            <a class="rec-16-9-card" href="preview.html?preview=${c.id}">
              <div class="rec-16-9-thumb">
                <img src="${primary}" alt="${c.Name || 'Title'}" loading="lazy" onerror="if(this.src!=='${fallback}') this.src='${fallback}';">
              </div>
              <div class="rec-title">${c.Name || 'Title'}</div>
              <div class="rec-sub">${genres}</div>
            </a>
          `;
        }).join('');
      } catch (err) {}
    }

    // Launch
    async function start() {
      await loadUserSubscriptionPlan();
      await fetchContentData(contentId);
    }
    start();
  </script>
