<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Previewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1014;
            --blue: #42a5f5;
            --text-dim: #a9a9a9;
            --white: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* 1. Hero Area (Banner & Trailer) */
        .hero {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        #banner-img {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 10;
            transition: opacity 1s ease;
        }

        #trailer-wrapper {
            position: absolute;
            inset: 0;
            z-index: 5;
            background: #000;
        }

        /* YouTube Crop Logic: scale and offset to hide title/logo */
        #trailer-wrapper iframe {
            position: absolute;
            top: -12%; left: -12%;
            width: 124%; height: 124%;
            pointer-events: none;
        }

        .trailer-label {
            position: absolute; top: 15px; left: 15px;
            font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.4);
            z-index: 20;
        }

        /* 2. Main Content Info (Centered) */
        .content-body {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; padding: 20px;
        }

        .main-logo {
            max-width: 180px; max-height: 90px;
            object-fit: contain; margin-bottom: 12px;
        }

        .blue-highlights {
            color: var(--blue);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .meta-data {
            font-size: 13px; color: var(--text-dim);
            display: flex; gap: 12px; margin-bottom: 25px;
        }

        .rating-badge {
            background: #3c3c3c; color: #fff; padding: 2px 6px;
            border-radius: 3px; font-weight: bold; font-size: 11px;
        }

        /* 3. Action Button */
        .btn-action {
            width: 100%; max-width: 400px;
            background: #e1e6f0; color: #000;
            border: none; padding: 15px; border-radius: 8px;
            font-size: 16px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 25px; cursor: pointer;
        }

        .genres {
            font-size: 14px; font-weight: 500; color: #fff;
            margin-bottom: 12px;
        }
        .genres span { margin: 0 8px; color: #444; }

        .description {
            font-size: 14px; color: var(--text-dim);
            line-height: 1.5; text-align: left; width: 100%;
            margin-bottom: 30px;
        }

        /* 4. Episodes Section */
        .episodes-section {
            padding: 0 20px;
            display: none; /* Only for Series */
        }

        .section-title {
            font-size: 18px; font-weight: bold; margin-bottom: 15px;
        }

        .episode-row {
            display: flex; align-items: center; gap: 15px;
            padding: 10px 0; border-bottom: 1px solid #222;
        }

        .ep-thumb {
            width: 110px; aspect-ratio: 16/9;
            border-radius: 4px; object-fit: cover;
        }

        .ep-info { flex: 1; font-size: 14px; }

        .view-more-btn {
            width: 100%; padding: 12px;
            background: transparent; color: var(--blue);
            border: 1px solid #333; border-radius: 6px;
            margin: 20px 0; cursor: pointer; font-weight: bold;
        }

        /* 5. Icons Section */
        .action-icons {
            display: flex; justify-content: space-around; width: 100%;
            max-width: 320px; margin: 30px auto 50px auto;
        }
        .icon-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 11px; color: var(--text-dim); gap: 10px;
        }
        .icon-item i { font-size: 22px; color: #fff; font-style: normal; }

    </style>
</head>
<body>

<div id="preview-app">
    <!-- Hero Area -->
    <div class="hero">
        <div class="trailer-label">TRAILER</div>
        <img id="banner-img" src="" alt="Banner">
        <div id="trailer-wrapper"></div>
    </div>

    <!-- Centered Body -->
    <div class="content-body">
        <img id="logo-img" class="main-logo" src="" alt="">
        <div class="blue-highlights" id="blue-tags"></div>
        
        <div class="meta-data" id="meta-row">
            <!-- Year, Rating, Languages -->
        </div>

        <button class="btn-action" id="main-btn">▶ Watch Now</button>

        <div class="genres" id="genres-row"></div>
        <div class="description" id="desc-text"></div>

        <!-- Action Icons -->
        <div class="action-icons">
            <div class="icon-item"><i>＋</i> Watchlist</div>
            <div class="icon-item"><i>➦</i> Share</div>
            <div class="icon-item"><i>♡</i> Rate</div>
        </div>
    </div>

    <!-- Episodes List -->
    <div class="episodes-section" id="episodes-area">
        <div class="section-title">Episodes</div>
        <div id="episodes-list"></div>
        <button class="view-more-btn" id="view-more" style="display:none;">View More</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
        authDomain: "internal-systems-46728.firebaseapp.com",
        projectId: "internal-systems-46728",
        storageBucket: "internal-systems-46728.firebasestorage.app",
        messagingSenderId: "172177452674",
        appId: "1:172177452674:web:155a2417da5531dd7ece9b",
        measurementId: "G-Y87B8VRQ1N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const watchId = urlParams.get('watch');

    async function init() {
        if(!watchId) return;
        const snap = await getDoc(doc(db, "Live TV", watchId));
        if(snap.exists()) render(snap.data());
    }

    function render(data) {
        document.getElementById('banner-img').src = data.Banner;
        document.getElementById('logo-img').src = data.Logo;
        document.getElementById('blue-tags').innerText = data['Blue Tags'] || '';
        document.getElementById('desc-text').innerText = data.Description;

        // Meta Data
        document.getElementById('meta-row').innerHTML = `
            <span>2024</span>
            <span class="rating-badge">${data['Age Rating'] || 'U/A 7+'}</span>
            <span>${data.Language || 'Hindi'}</span>
        `;

        // Genres
        if(data.Genres) {
            document.getElementById('genres-row').innerHTML = data.Genres.split(',').join(' <span>|</span> ');
        }

        // --- Series Logic ---
        if(data.Type === "Series") {
            document.getElementById('main-btn').innerText = "▶ Watch EP 1";
            document.getElementById('episodes-area').style.display = "block";
            generateEpisodes(data);
        }

        // --- Trailer Switch Logic (3 seconds) ---
        setTimeout(() => {
            const ytId = extractId(data.Trailer);
            if(ytId) {
                const wrapper = document.getElementById('trailer-wrapper');
                const banner = document.getElementById('banner-img');
                
                wrapper.innerHTML = `
                    <iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1" 
                            frameborder="0" allow="autoplay"></iframe>`;
                
                wrapper.style.zIndex = "15";
                banner.style.opacity = "0";
            }
        }, 3000);
    }

    function generateEpisodes(data) {
        const list = document.getElementById('episodes-list');
        const viewMore = document.getElementById('view-more');
        
        // Simulating episode count from your playlist field
        // In a real scenario, you'd fetch from YouTube API, here we mock 12 episodes
        const episodeCount = 12; 

        for(let i = 1; i <= episodeCount; i++) {
            const row = document.createElement('div');
            row.className = 'episode-row';
            if(i > 5) row.style.display = 'none'; // Hide episodes > 5 initially
            
            row.innerHTML = `
                <img class="ep-thumb" src="${data.Banner}" alt="">
                <div class="ep-info">
                    <div style="font-weight:bold">Episode ${i}</div>
                    <div style="color:var(--text-dim); font-size:12px">Duration: 22m</div>
                </div>
                <div style="font-size: 20px;">⇩</div>
            `;
            list.appendChild(row);
        }

        if(episodeCount > 5) {
            viewMore.style.display = 'block';
            viewMore.onclick = () => {
                const hidden = list.querySelectorAll('.episode-row[style*="display: none"]');
                hidden.forEach(el => el.style.display = 'flex');
                viewMore.style.display = 'none';
            };
        }
    }

    function extractId(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url ? url.match(regExp) : null;
        return (match && match[2].length === 11) ? match[2] : null;
    }

    init();
</script>

</body>
</html>
