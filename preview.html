<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Preview - Hotstar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://www.youtube.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api" async></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --surface-bg: #11131c;
      --card-bg: #161924;
      --accent-blue: #1480f0;
      --accent-magenta: #be0876;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.09);
      --border-hover: rgba(255, 255, 255, 0.24);
      --live-red: #e50914;
      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body.modal-open { overflow: hidden; }

    /* Sticky Top Header on Scroll */
    .sticky-top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 28px;
      transition: background-color 0.3s var(--ease-out), backdrop-filter 0.3s var(--ease-out), border-color 0.3s ease;
      pointer-events: none;
      border-bottom: 1px solid transparent;
    }
    @media (max-width: 899px) {
      .sticky-top-nav { padding: 0 16px; }
    }
    .sticky-top-nav.scrolled {
      background: rgba(9, 10, 15, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom-color: var(--border-color);
      pointer-events: auto;
    }

    .sticky-nav-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 65%;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.28s var(--ease-out), transform 0.28s var(--ease-out);
      will-change: opacity, transform;
    }
    .sticky-top-nav.scrolled .sticky-nav-title {
      opacity: 1;
      transform: translateY(0);
    }

    .nav-right-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
      pointer-events: auto;
    }

    .nav-downloads-link {
      height: 38px;
      padding: 0 14px;
      border-radius: 20px;
      background: rgba(15, 16, 23, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(12px);
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.18s var(--ease-out);
    }
    .nav-downloads-link:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.35);
      transform: scale(1.03);
    }
    .nav-downloads-link svg { width: 16px; height: 16px; fill: currentColor; }

    .nav-close-btn {
      background: rgba(15, 16, 23, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.18s var(--ease-out), background-color 0.18s ease, border-color 0.18s ease;
    }
    .nav-close-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.35);
      transform: scale(1.06);
    }
    .nav-close-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.22); }
    .nav-close-btn svg { width: 20px; height: 20px; fill: #fff; }

    /* ==========================================================
       SKELETON LOADER
       ========================================================== */
    .loader-wrap {
      min-height: 82vh;
      padding: 100px 48px 50px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 16px;
      background: radial-gradient(circle at 70% 35%, rgba(20, 128, 240, 0.08), transparent 60%);
    }
    @media (max-width: 899px) {
      .loader-wrap {
        min-height: auto;
        padding: 20px 16px;
        align-items: center;
      }
    }
    .skel {
      background: linear-gradient(90deg, #131620 25%, #1c2130 50%, #131620 75%);
      background-size: 200% 100%;
      animation: skelShimmer 1.4s infinite linear;
      border-radius: 10px;
    }
    .skel-banner-mob { display: none; }
    @media (max-width: 899px) {
      .skel-banner-mob { display: block; width: 100%; aspect-ratio: 16/10; border-radius: 18px; margin-bottom: 12px; }
    }
    .skel-logo { width: 260px; height: 64px; }
    .skel-meta { width: 220px; height: 18px; border-radius: 6px; }
    .skel-desc { width: 460px; max-width: 90%; height: 48px; }
    .skel-cta  { width: 210px; height: 52px; }
    .loader-error {
      text-align: center;
      padding: 160px 20px;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 16px;
    }
    @keyframes skelShimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    #previewMain { animation: pageReveal 0.45s var(--ease-out) forwards; }
    @keyframes pageReveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* ==========================================================
       HERO BILLBOARD SECTION
       ========================================================== */
    .hero-billboard-wrap {
      position: relative;
      width: 100%;
      min-height: 84vh;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 100px 48px 56px;
      overflow: hidden;
    }
    @media (max-width: 899px) {
      .hero-billboard-wrap {
        min-height: auto;
        flex-direction: column;
        align-items: stretch;
        padding: 14px 16px 24px;
      }
    }

    .hero-media-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0c13;
      overflow: hidden;
      z-index: 1;
    }
    @media (max-width: 899px) {
      .hero-media-box {
        position: relative;
        aspect-ratio: 16/9;
        border-radius: 18px;
        margin-bottom: 22px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      }
    }

    .hero-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 0.65s var(--ease-out), transform 0.85s var(--ease-out);
      will-change: opacity, transform;
    }
    .hero-banner-img.loaded {
      opacity: 1;
      transform: scale(1);
    }

    .hero-trailer-host {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.75s var(--ease-out);
      background: #000;
      overflow: hidden;
      will-change: opacity;
    }
    .hero-trailer-host.playing { opacity: 1; }
    .hero-trailer-host iframe {
      width: calc(100% + 140px) !important;
      height: calc(100% + 160px) !important;
      position: absolute !important;
      top: -80px !important;
      left: -70px !important;
      pointer-events: none;
      border: none;
    }
    .hero-trailer-host video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-desktop-gradient {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, #090a0f 0%, rgba(9, 10, 15, 0.94) 36%, rgba(9, 10, 15, 0.58) 60%, rgba(9, 10, 15, 0.12) 88%, transparent 100%),
        linear-gradient(0deg, #090a0f 0%, rgba(9, 10, 15, 0.72) 18%, transparent 48%),
        linear-gradient(180deg, rgba(9, 10, 15, 0.45) 0%, transparent 18%);
      pointer-events: none;
      z-index: 2;
    }
    @media (max-width: 899px) {
      .hero-desktop-gradient {
        background: linear-gradient(180deg, rgba(9, 10, 15, 0.15) 0%, transparent 45%, rgba(9, 10, 15, 0.82) 100%);
      }
    }

    .trailer-status-text {
      position: absolute;
      top: 24px;
      left: 48px;
      color: rgba(255, 255, 255, 0.92);
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0,0,0,0.8);
      z-index: 10;
      display: none;
      align-items: center;
      gap: 7px;
    }
    .trailer-status-text.live-dot::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-blue);
      box-shadow: 0 0 8px var(--accent-blue);
      animation: pulseDot 1.6s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.8); }
    }
    @media (max-width: 899px) {
      .trailer-status-text { top: 14px; left: 16px; }
    }

    .mute-toggle-btn {
      position: absolute;
      bottom: 28px;
      right: 48px;
      background: rgba(15, 16, 23, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.2);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: transform 0.18s var(--ease-out), background-color 0.18s ease, border-color 0.18s ease;
    }
    .mute-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.06);
    }
    .mute-toggle-btn:active { transform: scale(0.92); }
    .mute-toggle-btn svg { width: 18px; height: 18px; fill: #fff; }
    @media (max-width: 899px) {
      .mute-toggle-btn { bottom: 12px; right: 12px; width: 36px; height: 36px; }
      .mute-toggle-btn svg { width: 16px; height: 16px; }
    }

    /* Foreground Content Box */
    .billboard-foreground-content {
      position: relative;
      z-index: 5;
      max-width: 590px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      animation: contentSlideUp 0.55s var(--ease-out) forwards;
    }
    @keyframes contentSlideUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (max-width: 899px) {
      .billboard-foreground-content {
        max-width: 100%;
        align-items: center;
        text-align: center;
        padding: 0 6px;
      }
    }

    .brand-logo-img {
      max-width: 330px;
      max-height: 120px;
      object-fit: contain;
      object-position: left center;
      margin-bottom: 16px;
      filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.85));
    }
    @media (max-width: 899px) {
      .brand-logo-img { object-position: center; max-width: 240px; max-height: 90px; }
    }

    .title-fallback-text {
      font-size: 44px;
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 14px;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.95);
      letter-spacing: -0.6px;
    }
    @media (max-width: 899px) {
      .title-fallback-text { font-size: 30px; }
    }

    .meta-pills-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 14.5px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 14px;
      letter-spacing: 0.2px;
    }
    @media (max-width: 899px) { .meta-pills-row { justify-content: center; } }
    .meta-pills-row span.sep { color: var(--text-muted); font-size: 10px; }
    .meta-badge-pill {
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    /* Description + Inline "..more" */
    .description-para {
      font-size: 15px;
      line-height: 1.62;
      color: rgba(226, 232, 240, 0.92);
      margin-bottom: 16px;
      max-width: 540px;
    }
    .desc-more-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 14.5px;
      font-weight: 800;
      cursor: pointer;
      padding: 0 2px;
      display: inline;
      letter-spacing: 0.2px;
      transition: color 0.15s ease;
    }
    .desc-more-btn:hover { color: #60a5fa; text-decoration: underline; }

    /* Genres Only + Carousel */
    .genres-tags-line {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 24px;
      letter-spacing: 0.3px;
      max-width: 100%;
    }
    .genres-tags-line span.pipe {
      color: rgba(148, 163, 184, 0.65);
      margin: 0 8px;
      font-weight: 400;
    }
    .genres-carousel-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 560px;
      gap: 6px;
    }
    .genres-carousel-track {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      scroll-snap-type: x proximity;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 2px 4px;
      mask-image: linear-gradient(90deg, #000 0%, #000 92%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 92%, transparent 100%);
    }
    .genres-carousel-track::-webkit-scrollbar { display: none; }
    .genre-pill-chip {
      flex: 0 0 auto;
      scroll-snap-align: start;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.09);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      transition: background-color 0.18s ease, border-color 0.18s ease, transform 0.18s var(--ease-out);
    }
    .genre-pill-chip:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }
    .genre-nav-arrow {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, transform 0.15s ease;
    }
    .genre-nav-arrow:hover { background: rgba(255, 255, 255, 0.24); transform: scale(1.06); }
    .genre-nav-arrow:active { transform: scale(0.92); }
    .genre-nav-arrow svg { width: 16px; height: 16px; fill: currentColor; }
    @media (max-width: 899px) {
      .genres-carousel-wrap { max-width: 100%; justify-content: center; }
      .genre-nav-arrow { display: none; }
    }

    /* Action Buttons Row */
    .actions-row-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    @media (max-width: 899px) {
      .actions-row-container { justify-content: center; width: 100%; }
    }

    .btn-hotstar-cta {
      height: 52px;
      padding: 0 30px;
      border-radius: 10px;
      background: linear-gradient(95deg, #027bfd 0%, #0d6efd 42%, #be0876 100%);
      background-size: 140% 100%;
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.2s var(--ease-out), filter 0.2s ease, box-shadow 0.2s ease, background-position 0.3s ease;
      box-shadow: 0 8px 24px rgba(2, 123, 253, 0.32);
    }
    .btn-hotstar-cta:hover {
      transform: translateY(-2px);
      background-position: 100% 0;
      box-shadow: 0 12px 28px rgba(190, 8, 118, 0.36);
    }
    .btn-hotstar-cta:active { transform: scale(0.97); filter: brightness(0.92); }
    .btn-hotstar-cta svg { width: 18px; height: 18px; fill: currentColor; }

    .btn-hotstar-secondary {
      height: 52px;
      padding: 0 20px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.11);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.18s var(--ease-out), background-color 0.18s ease, border-color 0.18s ease;
    }
    .btn-hotstar-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    .btn-hotstar-secondary:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.22); }
    .btn-hotstar-secondary svg { width: 17px; height: 17px; fill: currentColor; }

    /* Square Companion Buttons (Watchlist, Download, Share) */
    .btn-square-companion {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(10px);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.18s var(--ease-out), color 0.2s ease;
    }
    .btn-square-companion:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }
    .btn-square-companion:active { transform: scale(0.93); background: rgba(255, 255, 255, 0.22); }
    .btn-square-companion svg { width: 22px; height: 22px; fill: currentColor; }
    .btn-square-companion.active {
      background: rgba(20, 128, 240, 0.24);
      border-color: var(--accent-blue);
      color: #60a5fa;
      box-shadow: 0 0 18px rgba(20, 128, 240, 0.22);
    }
    .btn-square-companion.downloaded {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
    }
    .dl-pct-label {
      font-size: 11px;
      font-weight: 800;
      color: #60a5fa;
      line-height: 1;
    }

    @keyframes bouncePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.32) rotate(-10deg); }
      75% { transform: scale(0.9) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .btn-square-companion.animating svg {
      animation: bouncePop 0.42s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Lower Flow */
    .lower-content-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1380px;
      margin: 28px auto 64px;
      padding: 0 48px;
      content-visibility: auto;
      contain-intrinsic-size: 500px;
    }
    @media (max-width: 899px) {
      .lower-content-container { padding: 0 16px; margin: 16px auto 44px; }
    }

    .section-container { width: 100%; margin-bottom: 38px; text-align: left; }
    .section-heading {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #fff;
      letter-spacing: -0.2px;
    }

    /* TV Show Episodes List */
    .episodes-wrapper { display: none; }
    .season-tab-row {
      display: flex;
      gap: 22px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .season-tab-row::-webkit-scrollbar { display: none; }
    .season-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      padding-bottom: 6px;
      transition: color 0.18s ease;
    }
    .season-btn:hover { color: #e2e8f0; }
    .season-btn.active { color: #fff; }
    .season-btn.active::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 0;
      right: 0;
      height: 2.5px;
      border-radius: 2px;
      background: linear-gradient(90deg, var(--accent-blue), #fff);
    }

    .episodes-list { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 960px) {

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, updateDoc, arrayUnion, arrayRemove, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Register Service Worker so download.html opens even when completely offline
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // 1. Content Database (internal-systems-46728)
    const contentConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };
    const contentApp = initializeApp(contentConfig, "contentApp");
    const contentDb = getFirestore(contentApp);

    // 2. User Database (question-metabase)
    const userConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase",
      storageBucket: "question-metabase.firebasestorage.app",
      messagingSenderId: "770698198753",
      appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
      measurementId: "G-6ZP1FPMKSJ"
    };
    const userApp = initializeApp(userConfig, "userApp");
    const userDb = getFirestore(userApp);

    // ==========================================================
    // PRIVATE INDEXEDDB OFFLINE STORAGE (Invisible in Native Gallery)
    // ==========================================================
    const OFFLINE_DB_NAME = 'HotstarOfflineDB';
    const OFFLINE_STORE = 'downloads';

    function openOfflineDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(OFFLINE_DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(OFFLINE_STORE)) {
            db.createObjectStore(OFFLINE_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getOfflineVideo(id) {
      try {
        const db = await openOfflineDB();
        return new Promise((resolve) => {
          const tx = db.transaction(OFFLINE_STORE, 'readonly');
          const req = tx.objectStore(OFFLINE_STORE).get(id);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => resolve(null);
        });
      } catch (e) { return null; }
    }

    async function saveOfflineVideo(record) {
      const db = await openOfflineDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(OFFLINE_STORE, 'readwrite');
        tx.objectStore(OFFLINE_STORE).put(record);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }

    function getVideoUrl(obj) {
      if (!obj) return '';
      const raw = obj.Video || obj.video || obj.Video_Url || obj.VideoUrl || obj.video_url ||
                  obj.Stream || obj.stream || obj.Link || obj.link || obj.URL || obj.url ||
                  obj.File || obj.file || obj.Movie || obj.movie || '';
      return safeUrl(raw);
    }

    async function downloadVideoToPrivateStorage({ downloadId, title, subtext, description, videoUrl, thumbUrl, type, onProgress }) {
      if (!videoUrl) {
        throw new Error('Video source URL not found on this item.');
      }
      if (extractYouTubeId(videoUrl)) {
        throw new Error('YouTube videos cannot be saved for offline playback.');
      }

      const response = await fetch(videoUrl, { mode: 'cors' });
      if (!response.ok) {
        throw new Error(`Download failed (${response.status})`);
      }

      const contentLength = Number(response.headers.get('content-length') || 0);
      let videoBlob = null;

      if (response.body && response.body.getReader) {
        const reader = response.body.getReader();
        const chunks = [];
        let received = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          if (onProgress) {
            const pct = contentLength ? Math.min(99, Math.round((received / contentLength) * 100)) : null;
            onProgress(pct, received);
          }
        }
        const mimeType = response.headers.get('content-type') || 'video/mp4';
        videoBlob = new Blob(chunks, { type: mimeType });
      } else {
        videoBlob = await response.blob();
      }

      // Also cache thumbnail Blob so it shows when offline
      let thumbBlob = null;
      if (thumbUrl) {
        try {
          const tRes = await fetch(thumbUrl, { mode: 'cors' });
          if (tRes.ok) thumbBlob = await tRes.blob();
        } catch (e) {}
      }

      await saveOfflineVideo({
        id: downloadId,
        contentId: currentItem.id,
        title: title || 'Untitled',
        subtext: subtext || '',
        description: description || '',
        type: type || contentType,
        sizeBytes: videoBlob.size,
        videoBlob,
        thumbBlob,
        downloadedAt: Date.now()
      });

      return true;
    }

    // State
    let currentItem = null;
    let contentType = 'movie';
    let currentCollection = 'Movies';
    let currentUser = null;
    let userDocRef = null;
    let userProfiles = null;
    let activeProfileIndex = 0;
    let userWatchlist = [];
    let userAuthorizedStudios = new Set();
    let hasAccess = false;
    let trailerTimeout = null;
    let ytTrailerPlayer = null;
    let currentSeasonKey = null;
    let showAllEpisodes = false;
    let isMuted = true;
    let watchlistPending = false;
    let isDownloadingMain = false;

    const urlParams = new URLSearchParams(window.location.search);
    const contentId = urlParams.get('preview') || urlParams.get('watch');

    let scrollTicking = false;
    window.addEventListener('scroll', () => {
      if (!scrollTicking) {
        requestAnimationFrame(() => {
          const topNav = document.getElementById('stickyTopNav');
          if (window.scrollY > 90) topNav.classList.add('scrolled');
          else topNav.classList.remove('scrolled');
          scrollTicking = false;
        });
        scrollTicking = true;
      }
    }, { passive: true });

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toastAlert');
      toast.innerText = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function safeUrl(url) {
      if (!url) return '';
      return String(url).trim().replace(/^http:\/\//i, 'https://');
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getBannerImage(c) {
      if (!c) return '';
      return safeUrl(c.Banner || c.banner || c.Backdrop || c.backdrop || '');
    }

    function getHorizontalImage(c) {
      if (!c) return '';
      return safeUrl(c["Poster.h"] || c.Poster_h || c.poster_h || c.Banner || c.banner || c.Poster || c["Poster.v"] || '');
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      try {
        const u = new URL(url.trim());
        if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0];
        if (u.hostname.includes('youtube.com') || u.hostname.includes('m.youtube.com')) {
          if (u.pathname === '/watch') return u.searchParams.get('v');
          if (u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
          if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
        }
      } catch (e) {
        if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) return url.trim();
      }
      return null;
    }

    // Modal Open / Close Helpers
    function openDescriptionModal(title, metaText, fullDesc, genreItems) {
      const overlay = document.getElementById('descModalOverlay');
      document.getElementById('descModalTitle').innerText = title || 'Overview';
      const metaEl = document.getElementById('descModalMeta');
      metaEl.innerText = metaText || '';
      metaEl.style.display = metaText ? 'block' : 'none';
      document.getElementById('descModalBody').innerText = fullDesc;

      const genresWrap = document.getElementById('descModalGenres');
      if (Array.isArray(genreItems) && genreItems.length > 0) {
        genresWrap.innerHTML = genreItems.map(g => `<span class="genre-pill-chip">${escapeHtml(g)}</span>`).join('');
        genresWrap.style.display = 'flex';
      } else {
        genresWrap.style.display = 'none';
      }

      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
    }

    function closeDescriptionModal() {
      const overlay = document.getElementById('descModalOverlay');
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');

    function resolveActiveProfileIndex(profiles) {
      if (!Array.isArray(profiles) || profiles.length === 0) return -1;

      const idxKeys = ['active_profile_index', 'activeProfileIndex', 'profile_index', 'selected_profile_index'];
      for (const k of idxKeys) {
        const val = localStorage.getItem(k);
        if (val !== null && val !== '' && !isNaN(Number(val))) {
          const parsed = Number(val);
          if (parsed >= 0 && parsed < profiles.length) return parsed;
        }
      }

      const profKeys = ['active_profile', 'selected_profile', 'current_profile', 'hotstar_profile'];
      for (const k of profKeys) {
        try {
          const raw = localStorage.getItem(k);
          if (!raw) continue;
          const obj = JSON.parse(raw);
          if (obj && typeof obj === 'object') {
            const matchIdx = profiles.findIndex(p =>
              (obj.Name && p.Name === obj.Name && (!obj.App || p.App === obj.App)) ||
              (obj.Avatar && p.Avatar === obj.Avatar)
            );
            if (matchIdx !== -1) return matchIdx;
          }
        } catch (e) {}
      }

      const hotstarIdx = profiles.findIndex(p => String(p?.App || '').toLowerCase() === 'hotstar');
      return hotstarIdx !== -1 ? hotstarIdx : 0;
    }

    function syncLocalWatchlist(profiles, idx, watchlistArr) {
      if (!currentUser) return;
      if (Array.isArray(profiles) && idx >= 0 && profiles[idx]) {
        profiles[idx].Watchlist = watchlistArr;
        currentUser.Profiles = profiles;
        try {
          const rawActiveProf = localStorage.getItem('active_profile');
          if (rawActiveProf) {
            const parsed = JSON.parse(rawActiveProf);
            parsed.Watchlist = watchlistArr;
            localStorage.setItem('active_profile', JSON.stringify(parsed));
          }
        } catch (e) {}
      } else {
        currentUser.Watchlist = watchlistArr;
      }
      localStorage.setItem('active_user', JSON.stringify(currentUser));
    }

    async function loadUserSubscriptionPlan() {
      try {
        const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
        currentUser = stored ? JSON.parse(stored) : null;
      } catch (e) { currentUser = null; }

      if (!currentUser) return;

      if (Array.isArray(currentUser.Profiles) && currentUser.Profiles.length > 0) {
        userProfiles = currentUser.Profiles;
        activeProfileIndex = resolveActiveProfileIndex(userProfiles);
        const prof = userProfiles[activeProfileIndex];
        userWatchlist = Array.isArray(prof?.Watchlist) ? [...prof.Watchlist] : [];
      } else {
        userWatchlist = Array.isArray(currentUser.Watchlist) ? [...currentUser.Watchlist] : [];
      }

      try {
        let uData = null;

        if (currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id) {
          const uId = currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id;
          userDocRef = doc(userDb, "UARM", uId);
          const snap = await getDoc(userDocRef);
          if (snap.exists()) uData = snap.data();
        } else if (currentUser.Lotus) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Lotus", "==", currentUser.Lotus)));
          if (!snap.empty) {
            userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            uData = snap.docs[0].data();
          }
        } else if (currentUser.Email) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Email", "==", currentUser.Email)));
          if (!snap.empty) {
            userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            uData = snap.docs[0].data();
          }
        }

        if (uData) {
          currentUser = { ...currentUser, ...uData };
          if (Array.isArray(uData.Profiles) && uData.Profiles.length > 0) {
            userProfiles = uData.Profiles;
            activeProfileIndex = resolveActiveProfileIndex(userProfiles);
            const prof = userProfiles[activeProfileIndex];
            userWatchlist = Array.isArray(prof?.Watchlist) ? [...prof.Watchlist] : [];
          } else {
            userProfiles = null;
            userWatchlist = Array.isArray(uData.Watchlist) ? [...uData.Watchlist] : userWatchlist;
          }
          localStorage.setItem('active_user', JSON.stringify(currentUser));
        }

        const userPlanIds = Array.isArray(currentUser.Plans) ? currentUser.Plans : (currentUser.Plan ? [currentUser.Plan] : []);

        const planPromises = userPlanIds.map(async (planId) => {
          if (!planId) return;
          try {
            let pSnap = await getDoc(doc(userDb, "Plans & Subscriptions", planId));
            if (!pSnap.exists()) {
              pSnap = await getDoc(doc(userDb, "Plans & Subscription", planId));
            }
            if (pSnap.exists()) {
              const pData = pSnap.data();
              const studios = Array.isArray(pData.Studio) ? pData.Studio : (pData.Studios || []);
              studios.forEach(s => userAuthorizedStudios.add(String(s).trim().toLowerCase()));
            }
          } catch (err) {}
        });

        await Promise.all(planPromises);
      } catch (err) {}
    }

    function checkContentAccess(content) {
      if (!content) return false;
      const contentStudio = String(content.Studio || content.Partner || content.Channel || content["Channel"] || '').trim().toLowerCase();

      if (!contentStudio || contentStudio === 'free' || contentStudio === 'open') return true;
      if (userAuthorizedStudios.has(contentStudio)) return true;

      for (const authStudio of userAuthorizedStudios) {
        if (contentStudio.includes(authStudio) || authStudio.includes(contentStudio)) {
          return true;
        }
      }
      return false;
    }

    async function fetchContentData(id) {
      if (!id) {
        const loader = document.getElementById('loader');
        loader.className = 'loader-error';
        loader.innerText = 'No content ID specified.';
        return null;
      }

      const collections = ["Movies", "TV Shows", "Shows", "Live TV", "Digital-Feed", "Sports"];
      const results = await Promise.all(
        collections.map(async (col) => {
          try {
            const snap = await getDoc(doc(contentDb, col, id));
            if (snap.exists()) return { col, data: snap.data() };
          } catch (e) {}
          return null;
        })
      );

      const match = results.find(Boolean);
      if (!match) {
        const loader = document.getElementById('loader');
        loader.className = 'loader-error';
        loader.innerText = `Content "${id}" not found.`;
        return null;
      }

      currentCollection = match.col;
      currentItem = { id, ...match.data };

      const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
      if (currentCollection === "TV Shows" || currentCollection === "Shows" || seasons.length > 0) {
        contentType = 'show';
        currentSeasonKey = seasons[0] || 'Season 1';
      } else if (currentCollection === "Movies") {
        contentType = 'movie';
      } else {
        contentType = 'live';
      }

      return currentItem;
    }

    function scheduleTrailerPlayback() {
      const trailerStatusText = document.getElementById('trailerStatusText');
      const host = document.getElementById('heroTrailerHost');
      const trailerUrl = safeUrl(currentItem.Trailer || '');

      clearTimeout(trailerTimeout);
      trailerTimeout = setTimeout(() => {
        if (!trailerUrl) {
          trailerStatusText.innerText = "TRAILER UNAVAILABLE";
          trailerStatusText.classList.remove('live-dot');
          trailerStatusText.style.display = "flex";
          return;
        }

        const ytId = extractYouTubeId(trailerUrl);

        if (ytId) {
          if (typeof YT === 'undefined' || !YT.Player) {
            trailerStatusText.innerText = "TRAILER UNAVAILABLE";
            trailerStatusText.style.display = "flex";
            return;
          }

          host.innerHTML = `<div id="ytTrailerActualPlayer"></div>`;
          host.classList.add('playing');
          trailerStatusText.innerText = "TRAILER";
          trailerStatusText.classList.add('live-dot');
          trailerStatusText.style.display = "flex";

          ytTrailerPlayer = new YT.Player('ytTrailerActualPlayer', {
            videoId: ytId,
            playerVars: {
              autoplay: 1, controls: 0, disablekb: 1, fs: 0, rel: 0,
              modestbranding: 1, showinfo: 0, iv_load_policy: 3,
              mute: isMuted ? 1 : 0, playsinline: 1
            },
            events: {
              onReady: (e) => e.target.playVideo(),
              onStateChange: (e) => {
                if (e.data === YT.PlayerState.ENDED) {
                  host.classList.remove('playing');
                  trailerStatusText.style.display = 'none';
                  try { ytTrailerPlayer.destroy(); } catch (err) {}
                }
              },
              onError: () => {
                host.classList.remove('playing');
                trailerStatusText.classList.remove('live-dot');
                trailerStatusText.innerText = "TRAILER UNAVAILABLE";
              }
            }
          });
        } else if (trailerUrl.endsWith('.mp4') || trailerUrl.includes('.m3u8')) {
          host.innerHTML = `<video id="videoTrailerEl" src="${trailerUrl}" autoplay ${isMuted ? 'muted' : ''} playsinline></video>`;
          host.classList.add('playing');
          trailerStatusText.innerText = "TRAILER";
          trailerStatusText.classList.add('live-dot');
          trailerStatusText.style.display = "flex";

          const vid = document.getElementById('videoTrailerEl');
          vid.onended = () => {
            host.classList.remove('playing');
            trailerStatusText.style.display = 'none';
          };
        } else {
          trailerStatusText.innerText = "TRAILER UNAVAILABLE";
          trailerStatusText.classList.remove('live-dot');
          trailerStatusText.style.display = "flex";
        }
      }, 2400);
    }

            </a>
            ${hasAccess ? `
            <button type="button" class="ep-dl-btn ${isDl ? 'downloaded' : ''}" data-ep-idx="${idx}" data-dl-id="${epDlId}" title="${isDl ? 'Saved Offline' : 'Download Episode'}">
              ${isDl
                ? '<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>'
                : '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18v10.17l3.59-3.58L17 10l-5 5-5-5 1.41-1.41L11 12.17V2h1z"/></svg>'
              }
            </button>` : ''}
          </div>
        `;
      }).join('');

      listEl.querySelectorAll('.ep-dl-btn').forEach(btn => {
        btn.onclick = async () => {
          const idx = Number(btn.dataset.epIdx);
          const dlId = btn.dataset.dlId;
          const existing = await getOfflineVideo(dlId);
          if (existing) {
            window.location.href = `download.html?play=${encodeURIComponent(dlId)}`;
            return;
          }
          const ep = epList[idx];
          const epVideoUrl = getVideoUrl(ep);
          const epThumb = safeUrl(ep?.Thumbnail || ep?.Poster || thumbUrl);
          try {
            btn.disabled = true;
            btn.innerText = '0%';
            await downloadVideoToPrivateStorage({
              downloadId: dlId,
              title: `${currentItem.Name || 'Show'} - ${ep?.Name || `Episode ${idx + 1}`}`,
              subtext: `S${seasonNum} E${idx + 1}${ep?.Duration ? ` • ${ep.Duration}` : ''}`,
              description: ep?.Description || currentItem.Description || currentItem.Discription || '',
              videoUrl: epVideoUrl,
              thumbUrl: epThumb,
              type: 'episode',
              onProgress: (pct) => {
                btn.innerText = pct !== null ? `${pct}%` : '...';
              }
            });
            btn.classList.add('downloaded');
            btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>';
            showToast('Episode saved to offline Downloads!');
          } catch (err) {
            btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18v10.17l3.59-3.58L17 10l-5 5-5-5 1.41-1.41L11 12.17V2h1z"/></svg>';
            showToast(err.message || 'Unable to download episode');
          } finally {
            btn.disabled = false;
          }
        };
      });

      if (epList.length > 6) {
        viewMoreBtn.style.display = 'flex';
        viewMoreBtn.innerText = showAllEpisodes ? 'View Less' : 'View More';
        viewMoreBtn.onclick = () => {
          showAllEpisodes = !showAllEpisodes;
          renderEpisodesSection();
        };
      } else {
        viewMoreBtn.style.display = 'none';
      }
    }

    window.selectSeasonTab = function(seasonKey) {
      currentSeasonKey = seasonKey;
      renderEpisodesSection();
    };

    function updateWatchlistButtonState() {
      const btn = document.getElementById('btnWatchlist');
      if (!btn || !currentItem) return;
      const isAdded = userWatchlist.includes(currentItem.id);
      btn.classList.toggle('active', isAdded);
      btn.title = isAdded ? 'Remove from Watchlist' : 'Add to Watchlist';
      document.getElementById('wlIcon').innerHTML = isAdded
        ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>'
        : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>';
    }

    function attachActionListeners() {
      const wlBtn = document.getElementById('btnWatchlist');
      if (wlBtn) {
        wlBtn.onclick = async () => {
          if (watchlistPending) return;

          wlBtn.classList.remove('animating');
          void wlBtn.offsetWidth;
          wlBtn.classList.add('animating');

          if (!currentUser) {
            try {
              const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
              currentUser = stored ? JSON.parse(stored) : null;
            } catch (e) {}
          }

          if (!currentUser) {
            showToast("Please login to save to Watchlist");
            return;
          }

          const isAdded = userWatchlist.includes(currentItem.id);
          const updatedWatchlist = isAdded
            ? userWatchlist.filter(id => id !== currentItem.id)
            : [...new Set([...userWatchlist, currentItem.id])];

          userWatchlist = updatedWatchlist;
          syncLocalWatchlist(userProfiles, activeProfileIndex, userWatchlist);
          updateWatchlistButtonState();
          showToast(isAdded ? "Removed from Watchlist" : "Added to Watchlist");

          watchlistPending = true;
          try {
            if (!userDocRef) {
              if (currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id) {
                userDocRef = doc(userDb, "UARM", currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id);
              } else if (currentUser.Lotus) {
                const snap = await getDocs(query(collection(userDb, "UARM"), where("Lotus", "==", currentUser.Lotus)));
                if (!snap.empty) userDocRef = doc(userDb, "UARM", snap.docs[0].id);
              } else if (currentUser.Email) {
                const snap = await getDocs(query(collection(userDb, "UARM"), where("Email", "==", currentUser.Email)));
                if (!snap.empty) userDocRef = doc(userDb, "UARM", snap.docs[0].id);
              }
            }

            if (userDocRef) {
              const freshSnap = await getDoc(userDocRef);
              if (freshSnap.exists()) {
                const freshData = freshSnap.data();
                if (Array.isArray(freshData.Profiles) && freshData.Profiles.length > 0) {
                  const idx = (activeProfileIndex >= 0 && activeProfileIndex < freshData.Profiles.length)
                    ? activeProfileIndex
                    : resolveActiveProfileIndex(freshData.Profiles);
                  activeProfileIndex = idx;

                  const updatedProfiles = freshData.Profiles.map((p, i) => {
                    if (i !== idx) return p;
                    const baseList = Array.isArray(p.Watchlist) ? p.Watchlist : [];
                    const nextList = isAdded
                      ? baseList.filter(id => id !== currentItem.id)
                      : [...new Set([...baseList, currentItem.id])];
                    return { ...p, Watchlist: nextList };
                  });

                  await updateDoc(userDocRef, { Profiles: updatedProfiles });
                  userProfiles = updatedProfiles;
                  userWatchlist = updatedProfiles[idx].Watchlist;
                  syncLocalWatchlist(userProfiles, idx, userWatchlist);
                  updateWatchlistButtonState();
                } else {
                  await updateDoc(userDocRef, {
                    Watchlist: isAdded ? arrayRemove(currentItem.id) : arrayUnion(currentItem.id)
                  });
                }
              }
            }
          } catch (err) {
            console.error("Watchlist sync failed:", err);
          } finally {
            watchlistPending = false;
          }
        };
      }

      const dlBtn = document.getElementById('btnDownload');
      if (dlBtn) {
        dlBtn.onclick = async () => {
          if (isDownloadingMain) return;
          const existing = await getOfflineVideo(currentItem.id);
          if (existing) {
            window.location.href = `download.html?play=${encodeURIComponent(currentItem.id)}`;
            return;
          }

          const videoUrl = getVideoUrl(currentItem);
          const thumbUrl = getHorizontalImage(currentItem) || getBannerImage(currentItem);
          const metaParts = [
            currentItem.Release_Date || currentItem.Year || '',
            currentItem.Duration || '',
            Array.isArray(currentItem.Language) ? currentItem.Language.join(', ') : (currentItem.Language || '')
          ].filter(Boolean);

          isDownloadingMain = true;
          dlBtn.innerHTML = `<span class="dl-pct-label">0%</span>`;
          showToast("Downloading for offline playback...");

          try {
            await downloadVideoToPrivateStorage({
              downloadId: currentItem.id,
              title: currentItem.Name || currentItem.Title || 'Movie',
              subtext: metaParts.join(' • '),
              description: currentItem.Discription || currentItem.Description || currentItem.description || '',
              videoUrl,
              thumbUrl,
              type: contentType,
              onProgress: (pct) => {
                dlBtn.innerHTML = `<span class="dl-pct-label">${pct !== null ? `${pct}%` : '...'}</span>`;
              }
            });
            dlBtn.classList.add('downloaded');
            dlBtn.title = 'Downloaded — View in Downloads';
            dlBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>';
            showToast("Saved! Available offline in Downloads");
          } catch (err) {
            dlBtn.innerHTML = '<svg id="dlIcon" viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18v10.17l3.59-3.58L17 10l-5 5-5-5 1.41-1.41L11 12.17V2h1z"/></svg>';
            showToast(err.message || "Download failed (check CORS or video URL)");
          } finally {
            isDownloadingMain = false;
          }
        };
      }

      const shareBtn = document.getElementById('btnShare');
      if (shareBtn) {
        shareBtn.onclick = async () => {
          const shareUrl = `${window.location.origin}${window.location.pathname}?preview=${currentItem.id}`;
          if (navigator.share) {
            try {
              await navigator.share({
                title: currentItem.Name || "Hotstar",
                text: `Watch ${currentItem.Name} on Hotstar!`,
                url: shareUrl
              });
            } catch (e) {}
          } else if (navigator.clipboard) {
            await navigator.clipboard.writeText(shareUrl);
            showToast("Link copied to clipboard!");
          }
        };
      }
    }

    async function fetchRecommendations() {
      const grid = document.getElementById('recommendationsGrid');
      try {
        const snap = await getDocs(collection(contentDb, currentCollection));
        let items = [];
        snap.forEach(d => {
          if (d.id !== currentItem.id) items.push({ id: d.id, ...d.data() });
        });

        const targetGenres = String(currentItem.Genres || currentItem.genres || '').toLowerCase().split(/[,/|]+/).map(s => s.trim()).filter(Boolean);
        const targetStudio = String(currentItem.Studio || currentItem.Channel || '').toLowerCase();
        const targetAge = String(currentItem.Age_Rating || '').toLowerCase();

        items.sort((a, b) => {
          let scoreA = 0;
          let scoreB = 0;

          const aG = String(a.Genres || a.genres || '').toLowerCase();
          const bG = String(b.Genres || b.genres || '').toLowerCase();
          for (const g of targetGenres) {
            if (aG.includes(g)) scoreA += 10;
            if (bG.includes(g)) scoreB += 10;
          }

          if (targetStudio && String(a.Studio || a.Channel || '').toLowerCase().includes(targetStudio)) scoreA += 15;
          if (targetStudio && String(b.Studio || b.Channel || '').toLowerCase().includes(targetStudio)) scoreB += 15;

          if (targetAge && String(a.Age_Rating || '').toLowerCase() === targetAge) scoreA += 5;
          if (targetAge && String(b.Age_Rating || '').toLowerCase() === targetAge) scoreB += 5;

          return scoreB - scoreA;
        });

        grid.innerHTML = items.slice(0, 14).map(c => {
          const primary = getHorizontalImage(c);
          const fallback = safeUrl(c.Banner || c.Poster || '');
          const genres = c.Genres || c.genres || c.Language || '';

          return `
            <a class="rec-16-9-card" href="preview.html?preview=${c.id}">
              <div class="rec-16-9-thumb">
                <img src="${primary}" alt="${escapeHtml(c.Name || 'Title')}" loading="lazy" decoding="async" onerror="if(this.src!=='${fallback}') this.src='${fallback}';">
              </div>
              <div class="rec-title">${escapeHtml(c.Name || 'Title')}</div>
              ${genres ? `<div class="rec-sub">${escapeHtml(genres)}</div>` : ''}
            </a>
          `;
        }).join('');
      } catch (err) {}
    }

    async function start() {
      const [, item] = await Promise.all([
        loadUserSubscriptionPlan(),
        fetchContentData(contentId)
      ]);

      if (!item) return;

      hasAccess = checkContentAccess(currentItem);
      renderPreviewUI();
      scheduleTrailerPlayback();
      fetchRecommendations();
    }
    start();
  </script>
