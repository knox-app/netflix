<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaviewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1014;
            --blue-accent: #42a5f5;
            --text-dim: #a9a9a9;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: #fff;
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* 1. HERO AREA */
        .hero-section {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        #banner-img {
            position: absolute;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 10;
            transition: opacity 1s ease;
        }

        #trailer-container {
            position: absolute;
            inset: 0;
            z-index: 5; /* Starts behind banner */
            background: #000;
        }

        /* Cropping YouTube UI */
        #trailer-container iframe {
            position: absolute;
            top: -12%; left: -12%;
            width: 124%; height: 124%;
            pointer-events: none;
        }

        .trailer-label {
            position: absolute; top: 15px; left: 15px;
            font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,0.4);
            z-index: 20;
        }

        /* 2. CENTERED CONTENT */
        .content-main {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; padding: 0 20px;
            margin-top: 20px;
        }

        .main-logo {
            max-width: 180px; max-height: 90px;
            object-fit: contain; margin-bottom: 12px;
        }

        /* BLUE TAGS FROM FIREBASE */
        .blue-tags-row {
            color: var(--blue-accent);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .meta-data {
            font-size: 13px; color: var(--text-dim);
            display: flex; gap: 12px; margin-bottom: 25px;
        }
        .rating-box {
            background: #3c3c3c; color: #fff; padding: 2px 6px;
            border-radius: 3px; font-weight: bold; font-size: 11px;
        }

        /* 3. ACTION BUTTON */
        .action-btn {
            width: 100%; max-width: 400px;
            background: #e1e6f0; color: #000;
            border: none; padding: 15px; border-radius: 8px;
            font-size: 16px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            gap: 12px; margin-bottom: 30px; cursor: pointer;
        }
        .btn-sub { color: #666; font-weight: 400; font-size: 14px; }

        .description {
            font-size: 14px; color: var(--text-dim);
            line-height: 1.5; text-align: left; width: 100%;
            margin-bottom: 40px;
        }

        /* 4. ICONS */
        .action-icons {
            display: flex; justify-content: space-around; width: 100%;
            max-width: 320px; padding-bottom: 50px;
        }
        .icon-box {
            display: flex; flex-direction: column; align-items: center;
            font-size: 11px; color: var(--text-dim); gap: 10px;
        }
        .icon-box span { font-size: 22px; color: #fff; }
    </style>
</head>
<body>

<div id="app">
    <div class="hero-section">
        <div class="trailer-label">TRAILER</div>
        <img id="banner-img" src="" alt="">
        <div id="trailer-container"></div>
    </div>

    <div class="content-main">
        <img id="logo-img" class="main-logo" src="" alt="">
        
        <!-- Field: Blue Tags -->
        <div class="blue-tags-row" id="blue-tags"></div>

        <div class="meta-data" id="meta-row"></div>

        <button class="action-btn">
            <span style="font-size: 18px;">▶</span> 
            <span id="btn-label">Watch Now</span> 
            <span id="btn-subtext" class="btn-sub"></span>
        </button>

        <div class="description" id="desc-text"></div>

        <div class="action-icons">
            <div class="icon-box"><span>＋</span> Watchlist</div>
            <div class="icon-box"><span>➦</span> Share</div>
            <div class="icon-box"><span>♡</span> Rate</div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
        authDomain: "internal-systems-46728.firebaseapp.com",
        projectId: "internal-systems-46728",
        storageBucket: "internal-systems-46728.firebasestorage.app",
        messagingSenderId: "172177452674",
        appId: "1:172177452674:web:155a2417da5531dd7ece9b",
        measurementId: "G-Y87B8VRQ1N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const watchId = params.get('watch'); // e.g. ?watch=sony-yay

    async function init() {
        if(!watchId) return;

        try {
            // Updated collection path to 'Live TV'
            const snap = await getDoc(doc(db, "Live TV", watchId));
            if(snap.exists()) {
                render(snap.data());
            } else {
                console.error("No document found for ID:", watchId);
            }
        } catch (e) { console.error(e); }
    }

    function render(data) {
        const banner = document.getElementById('banner-img');
        banner.src = data.Banner || '';
        document.getElementById('logo-img').src = data.Logo || '';
        document.getElementById('desc-text').innerText = data.Description || '';

        // Correct Field: Blue Tags
        document.getElementById('blue-tags').innerText = data['Blue Tags'] || '';

        // Meta Row
        document.getElementById('meta-row').innerHTML = `
            <span>2024</span>
            <span class="rating-box">${data['Age Rating'] || 'U/A 7+'}</span>
            <span>${data.Language || 'Hindi'}</span>
        `;

        // Button Label Logic
        const btnMain = document.getElementById('btn-label');
        const btnSub = document.getElementById('btn-subtext');
        
        // Check for specific type or partner to determine button text
        if(data.Partner === "YouTube" || data.Type === "Series") {
            btnMain.innerText = "Watch Latest Season";
            btnSub.innerText = "S1 E1";
        }

        // --- TRAILER REPAIR ---
        setTimeout(() => {
            // Get URL from the specific 'Trailer' field in your screenshot
            const trailerUrl = data.Trailer || "";
            const ytId = extractId(trailerUrl);

            if(ytId) {
                const container = document.getElementById('trailer-container');
                
                // Set Up Video
                container.innerHTML = `
                    <iframe 
                        src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1" 
                        frameborder="0" 
                        allow="autoplay; encrypted-media">
                    </iframe>`;
                
                // CHANGE LAYERING: Bring video to front, hide banner
                container.style.zIndex = "15"; 
                banner.style.opacity = "0";
                console.log("Trailer playing ID:", ytId);
            } else {
                console.warn("Field 'Trailer' is empty or invalid YouTube link.");
            }
        }, 3000);
    }

    function extractId(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : null;
    }

    init();
</script>

</body>
</html>
