<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Preview - Hotstar</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #151821;
      --accent-blue: #1480f0;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
      --live-red: #e50914;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* Sticky Top Header on Scroll */
    .sticky-top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      transition: background-color 0.3s ease, backdrop-filter 0.3s ease, border-color 0.3s ease;
      pointer-events: none;
    }
    .sticky-top-nav.scrolled {
      background: rgba(9, 10, 15, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
      pointer-events: auto;
    }

    .sticky-nav-title {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 75%;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.25s ease, transform 0.25s ease;
    }
    .sticky-top-nav.scrolled .sticky-nav-title {
      opacity: 1;
      transform: translateY(0);
    }

    .nav-close-btn {
      background: rgba(15, 16, 23, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      pointer-events: auto;
      margin-left: auto;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .nav-close-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
    .nav-close-btn svg { width: 20px; height: 20px; fill: #fff; }

    /* ==========================================================
       HERO BILLBOARD SECTION
       ========================================================== */
    .hero-billboard-wrap {
      position: relative;
      width: 100%;
      min-height: 82vh;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 90px 48px 50px;
    }

    @media (max-width: 899px) {
      .hero-billboard-wrap {
        min-height: auto;
        flex-direction: column;
        padding: 14px 16px 24px;
      }
    }

    /* Background Media Box */
    .hero-media-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #0b0c13;
      overflow: hidden;
      z-index: 1;
    }

    @media (max-width: 899px) {
      .hero-media-box {
        position: relative;
        aspect-ratio: 16/10;
        border-radius: 18px;
        margin-bottom: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    }

    .hero-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center right;
      transition: opacity 0.6s ease;
    }

    .hero-trailer-host {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      background: #000;
      overflow: hidden;
    }
    .hero-trailer-host.playing { opacity: 1; }
    .hero-trailer-host iframe {
      width: calc(100% + 140px) !important;
      height: calc(100% + 160px) !important;
      position: absolute !important;
      top: -80px !important;
      left: -70px !important;
      pointer-events: none;
      border: none;
    }
    .hero-trailer-host video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Hotstar Left & Bottom Dark Vignette Overlay */
    .hero-desktop-gradient {
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(90deg, #090a0f 0%, rgba(9, 10, 15, 0.95) 38%, rgba(9, 10, 15, 0.6) 62%, transparent 88%),
        linear-gradient(0deg, #090a0f 0%, rgba(9, 10, 15, 0.6) 18%, transparent 45%);
      pointer-events: none;
      z-index: 2;
    }

    @media (max-width: 899px) {
      .hero-desktop-gradient {
        background: linear-gradient(180deg, transparent 50%, rgba(9, 10, 15, 0.8) 100%);
      }
    }

    /* Top Left Trailer Text */
    .trailer-status-text {
      position: absolute;
      top: 24px;
      left: 48px;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0,0,0,0.8);
      z-index: 10;
      display: none;
    }
    @media (max-width: 899px) {
      .trailer-status-text {
        top: 14px;
        left: 16px;
      }
    }

    /* Sound Mute Toggle */
    .mute-toggle-btn {
      position: absolute;
      bottom: 28px;
      right: 48px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.18);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .mute-toggle-btn svg { width: 18px; height: 18px; fill: #fff; }

    /* Foreground Content Box */
    .billboard-foreground-content {
      position: relative;
      z-index: 5;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    @media (max-width: 899px) {
      .billboard-foreground-content {
        max-width: 100%;
        align-items: center;
        text-align: center;
        padding: 0 6px;
      }
    }

    /* Logo & Title */
    .brand-logo-img {
      max-width: 320px;
      max-height: 120px;
      object-fit: contain;
      object-position: left center;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.85));
    }
    @media (max-width: 899px) {
      .brand-logo-img {
        object-position: center;
        max-width: 240px;
        max-height: 90px;
      }
    }

    .title-fallback-text {
      font-size: 44px;
      font-weight: 900;
      line-height: 1.18;
      margin-bottom: 14px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.95);
      letter-spacing: -0.5px;
    }
    @media (max-width: 899px) {
      .title-fallback-text {
        font-size: 30px;
      }
    }

    /* Metadata Line (Release_Date • Age_Rating • Language • Rating) */
    .meta-pills-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 14px;
      letter-spacing: 0.2px;
    }
    .meta-pills-row span.sep {
      color: var(--text-muted);
      font-size: 11px;
    }

    /* Description */
    .description-para {
      font-size: 14.5px;
      line-height: 1.6;
      color: #e2e8f0;
      margin-bottom: 16px;
      max-width: 540px;
    }

    /* Tags / Genres with Pipes */
    .genres-tags-line {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 22px;
      letter-spacing: 0.3px;
    }
    .genres-tags-line span.pipe {
      color: var(--text-muted);
      margin: 0 8px;
      font-weight: 400;
    }

    /* Action Buttons Row */
    .actions-row-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Hotstar Blue-to-Magenta CTA Button */
    .btn-hotstar-cta {
      height: 52px;
      padding: 0 28px;
      border-radius: 8px;
      background: linear-gradient(90deg, #027bfd 0%, #0d6efd 35%, #be0876 100%);
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.15s ease, filter 0.15s ease;
      box-shadow: 0 4px 16px rgba(0, 123, 253, 0.35);
    }
    .btn-hotstar-cta:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }
    .btn-hotstar-cta svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .btn-hotstar-secondary {
      height: 52px;
      padding: 0 20px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-hotstar-secondary:active { background: rgba(255, 255, 255, 0.22); }
    .btn-hotstar-secondary svg { width: 17px; height: 17px; fill: currentColor; }

    /* Square Companion Buttons ([ + ] Watchlist & Share) */
    .btn-square-companion {
      width: 52px;
      height: 52px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, color 0.15s ease;
    }
    .btn-square-companion:active {
      transform: scale(0.94);
      background: rgba(255, 255, 255, 0.2);
    }
    .btn-square-companion svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
    .btn-square-companion.active {
      background: rgba(20, 128, 240, 0.3);
      border-color: var(--accent-blue);
      color: var(--accent-blue);
    }

    @keyframes bouncePop {
      0% { transform: scale(1); }
      40% { transform: scale(1.3) rotate(-10deg); }
      75% { transform: scale(0.92) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .btn-square-companion.animating svg {
      animation: bouncePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Lower Flow (Episodes & More Like This) */
    .lower-content-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1320px;
      margin: 40px auto 60px;
      padding: 0 48px;
    }
    @media (max-width: 899px) {
      .lower-content-container {
        padding: 0 16px;
        margin: 20px auto 40px;
      }
    }

    .section-container {
      width: 100%;
      margin-bottom: 34px;
      text-align: left;
    }
    .section-heading {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 16px;
      color: #fff;
    }

    /* TV Show Episodes List */
    .episodes-wrapper { display: none; }
    .season-tab-row {
      display: flex;
      gap: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .season-tab-row::-webkit-scrollbar { display: none; }
    .season-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      padding-bottom: 6px;
    }
    .season-btn.active { color: #fff; }
    .season-btn.active::after {
      content: '';
      position: absolute;
      bottom: -11px;
      left: 0;
      right: 0;
      height: 2.5px;
      background: #fff;
    }

    .episodes-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ep-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: background 0.15s ease;
    }
    .ep-card:active { background: rgba(255, 255, 255, 0.08); }
    .ep-thumb-wrap {
      position: relative;
      width: 135px;
      min-width: 135px;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #151821;
    }
    .ep-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .ep-play-circle {
      position: absolute;
      bottom: 6px;
      left: 6px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ep-play-circle svg { width: 11px; height: 11px; fill: #fff; margin-left: 1px; }

    .ep-info { flex: 1; min-width: 0; }
    .ep-name {
      font-size: 14.5px;
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-subtext {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .view-more-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 140px;
      margin: 18px auto 6px;
      padding: 9px 16px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* 16:9 Recommendations */
    .rec-scroll-row {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 12px;
      scrollbar-width: none;
    }
    .rec-scroll-row::-webkit-scrollbar { display: none; }

    .rec-16-9-card {
      min-width: 230px;
      width: 230px;
      scroll-snap-align: start;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s ease;
    }
    .rec-16-9-card:active { transform: scale(0.96); }
    
    .rec-16-9-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      margin-bottom: 8px;
    }
    .rec-16-9-thumb img { width: 100%; height: 100%; object-fit: cover; }
    
    .rec-title {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rec-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .toast-box {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(21, 24, 33, 0.95);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 9px 20px;
      border-radius: 20px;
      font-size: 13.5px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .toast-box.show { opacity: 1; }

    .loader-wrap {
      text-align: center;
      padding: 160px 20px;
      color: var(--accent-blue);
      font-weight: 700;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- Sticky Top Header -->
  <div class="sticky-top-nav" id="stickyTopNav">
    <div class="sticky-nav-title" id="stickyNavTitle"></div>
    <button class="nav-close-btn" onclick="window.history.back()" title="Close">
      <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <div id="loader" class="loader-wrap">Loading content...</div>

  <div id="previewMain" style="display: none;">
    
    <!-- Hero Billboard Section -->
    <div class="hero-billboard-wrap">
      
      <!-- Background Media Box -->
      <div class="hero-media-box" id="heroMediaBox">
        <img id="heroBanner" class="hero-banner-img" src="" alt="Banner">
        <div id="heroTrailerHost" class="hero-trailer-host"></div>
        <div class="hero-desktop-gradient"></div>

        <!-- Top Left Trailer Text Without Background Layer -->
        <div class="trailer-status-text" id="trailerStatusText"></div>
        
        <!-- Audio Mute Toggle Button -->
        <button class="mute-toggle-btn" id="muteToggleBtn" title="Toggle Sound">
          <svg id="muteIcon" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
      </div>

      <!-- Foreground Content Box -->
      <div class="billboard-foreground-content">
        <!-- 1. Real Logo (or Title Fallback) -->
        <img id="contentLogo" class="brand-logo-img" src="" alt="Logo" style="display: none;">
        <h1 id="contentTitle" class="title-fallback-text" style="display: none;"></h1>

        <!-- 2. Real Metadata Line (Release_Date • Age_Rating • Language • Rating) -->
        <div class="meta-pills-row" id="metaPillsRow"></div>

        <!-- 3. Real Description from Document -->
        <div class="description-para" id="contentDescription" style="display: none;"></div>

        <!-- 4. Real Tags / Genres from Document -->
        <div class="genres-tags-line" id="genresTagsLine" style="display: none;"></div>

        <!-- 5. Dynamic Action Buttons -->
        <div class="actions-row-container" id="ctaContainer"></div>
      </div>

    </div>

    <!-- Lower Content (Episodes & Recommendations) Strictly Follows Below -->
    <div class="lower-content-container">
      
      <!-- TV Shows Episodes Section -->
      <div class="section-container episodes-wrapper" id="episodesSection">
        <div class="section-heading">Episodes</div>
        <div class="season-tab-row" id="seasonTabsRow"></div>
        <div class="episodes-list" id="episodesList"></div>
        <button class="view-more-btn" id="btnViewMoreEpisodes" style="display: none;">View More</button>
      </div>

      <!-- 16:9 Recommendations -->
      <div class="section-container">
        <div class="section-heading">More Like This</div>
        <div class="rec-scroll-row" id="recommendationsGrid"></div>
      </div>

    </div>

  </div>

  <div class="toast-box" id="toastAlert"></div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, updateDoc, arrayUnion, arrayRemove, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Content Database (internal-systems-46728)
    const contentConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };
    const contentApp = initializeApp(contentConfig, "contentApp");
    const contentDb = getFirestore(contentApp);

    // 2. User Database (question-metabase)
    const userConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase",
      storageBucket: "question-metabase.firebasestorage.app",
      messagingSenderId: "770698198753",
      appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
      measurementId: "G-6ZP1FPMKSJ"
    };
    const userApp = initializeApp(userConfig, "userApp");
    const userDb = getFirestore(userApp);

    // State
    let currentItem = null;
    let contentType = 'movie'; 
    let currentCollection = 'Movies';
    let currentUser = null;
    let userDocRef = null;
    let userWatchlist = [];
    let userAuthorizedStudios = new Set();
    let hasAccess = false;
    let trailerTimeout = null;
    let ytTrailerPlayer = null;
    let currentSeasonKey = null;
    let showAllEpisodes = false;
    let isMuted = true;

    const urlParams = new URLSearchParams(window.location.search);
    const contentId = urlParams.get('preview') || urlParams.get('watch');

    window.addEventListener('scroll', () => {
      const topNav = document.getElementById('stickyTopNav');
      if (window.scrollY > 90) {
        topNav.classList.add('scrolled');
      } else {
        topNav.classList.remove('scrolled');
      }
    }, { passive: true });

    function showToast(msg) {
      const toast = document.getElementById('toastAlert');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function safeUrl(url) {
      if (!url) return '';
      return url.trim().replace(/^http:\/\//i, 'https://');
    }

    // Horizontal Banner / Poster resolver
    function getHorizontalImage(c) {
      if (!c) return '';
      return safeUrl(c["Poster.h"] || c.Poster_h || c.poster_h || c.Banner || c.banner || c.Poster || c["Poster.v"] || '');
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      try {
        const u = new URL(url.trim());
        if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0];
        if (u.hostname.includes('youtube.com') || u.hostname.includes('m.youtube.com')) {
          if (u.pathname === '/watch') return u.searchParams.get('v');
          if (u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
          if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
        }
      } catch (e) {
        if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) return url.trim();
      }
      return null;
    }

    // Load User Plan & Subscribed Studios
    async function loadUserSubscriptionPlan() {
      try {
        const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
        currentUser = stored ? JSON.parse(stored) : null;
      } catch (e) { currentUser = null; }

      if (!currentUser) return;

      userWatchlist = Array.isArray(currentUser.Watchlist) ? currentUser.Watchlist : [];

      try {
        let uData = null;

        if (currentUser.Lotus) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Lotus", "==", currentUser.Lotus)));
          if (!snap.empty) {
            userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            uData = snap.docs[0].data();
          }
        } else if (currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id) {
          const uId = currentUser["UARMS ID"] || currentUser.UARMS_ID || currentUser.id;
          userDocRef = doc(userDb, "UARM", uId);
          const snap = await getDoc(userDocRef);
          if (snap.exists()) uData = snap.data();
        } else if (currentUser.Email) {
          const snap = await getDocs(query(collection(userDb, "UARM"), where("Email", "==", currentUser.Email)));
          if (!snap.empty) {
            userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            uData = snap.docs[0].data();
          }
        }

        if (uData) {
          userWatchlist = Array.isArray(uData.Watchlist) ? uData.Watchlist : userWatchlist;
          currentUser = { ...currentUser, ...uData };
          localStorage.setItem('active_user', JSON.stringify(currentUser));
        }

        const userPlanIds = Array.isArray(currentUser.Plans) ? currentUser.Plans : (currentUser.Plan ? [currentUser.Plan] : []);

        const planPromises = userPlanIds.map(async (planId) => {
          if (!planId) return;
          try {
            let pSnap = await getDoc(doc(userDb, "Plans & Subscriptions", planId));
            if (!pSnap.exists()) {
              pSnap = await getDoc(doc(userDb, "Plans & Subscription", planId));
            }
            if (pSnap.exists()) {
              const pData = pSnap.data();
              const studios = Array.isArray(pData.Studio) ? pData.Studio : (pData.Studios || []);
              studios.forEach(s => userAuthorizedStudios.add(String(s).trim().toLowerCase()));
            }
          } catch (err) {}
        });

        await Promise.all(planPromises);
      } catch (err) {}
    }

    // Access Check (Studio, Partner, Channel)
    function checkContentAccess(content) {
      if (!content) return false;
      const contentStudio = String(content.Studio || content.Partner || content.Channel || content["Channel"] || '').trim().toLowerCase();

      if (!contentStudio || contentStudio === 'free' || contentStudio === 'open') return true;
      if (userAuthorizedStudios.has(contentStudio)) return true;

      for (const authStudio of userAuthorizedStudios) {
        if (contentStudio.includes(authStudio) || authStudio.includes(contentStudio)) {
          return true;
        }
      }
      return false;
    }

    // Search document across all collections
    async function fetchContentData(id) {
      const collections = ["Movies", "TV Shows", "Shows", "Live TV", "Digital-Feed", "Sports"];
      let matchedDoc = null;

      for (const col of collections) {
        try {
          const snap = await getDoc(doc(contentDb, col, id));
          if (snap.exists()) {
            matchedDoc = snap.data();
            currentCollection = col;
            break;
          }
        } catch (e) {}
      }

      if (!matchedDoc) {
        document.getElementById('loader').innerText = `Content "${id}" not found.`;
        return;
      }

      currentItem = { id, ...matchedDoc };
      hasAccess = checkContentAccess(currentItem);

      const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
      if (currentCollection === "TV Shows" || currentCollection === "Shows" || seasons.length > 0) {
        contentType = 'show';
        currentSeasonKey = seasons[0] || 'Season 1';
      } else if (currentCollection === "Movies") {
        contentType = 'movie';
      } else {
        contentType = 'live';
      }

      renderPreviewUI();
      scheduleTrailerPlayback();
      fetchRecommendations();
    }

    function renderPreviewUI() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('previewMain').style.display = 'block';

      const showName = currentItem.Name || currentItem.Title || "";
      document.getElementById('stickyNavTitle').innerText = showName;

      // 1. Banner
      const bannerImg = document.getElementById('heroBanner');
      const primaryBanner = getHorizontalImage(currentItem);
      const secondaryBanner = safeUrl(currentItem.Banner || currentItem.Poster || '');

      bannerImg.src = primaryBanner;
      bannerImg.onerror = () => {
        if (secondaryBanner && bannerImg.src !== secondaryBanner) {
          bannerImg.src = secondaryBanner;
        }
      };

      // 2. Real Logo from Document (or Name)
      const logoImg = document.getElementById('contentLogo');
      const titleFallback = document.getElementById('contentTitle');
      const logoUrl = safeUrl(currentItem.Logo || currentItem["Logo.png"] || '');

      if (logoUrl) {
        logoImg.src = logoUrl;
        logoImg.style.display = 'block';
        titleFallback.style.display = 'none';
        logoImg.onerror = () => {
          logoImg.style.display = 'none';
          if (showName) {
            titleFallback.innerText = showName;
            titleFallback.style.display = 'block';
          }
        };
      } else if (showName) {
        logoImg.style.display = 'none';
        titleFallback.innerText = showName;
        titleFallback.style.display = 'block';
      }

      // 3. Exact Metadata from Document (Release_Date, Age_Rating, Language, Rating)
      const metaRow = document.getElementById('metaPillsRow');
      const metaParts = [];

      // Release Date (supporting Release_Date, Release_date, Release Year, Year)
      const releaseYear = currentItem.Release_Date || currentItem.Release_date || currentItem["Release Date"] || currentItem.Year || currentItem["Release Year"];
      if (releaseYear) {
        metaParts.push(`<span>${releaseYear}</span>`);
      }

      // Age Rating
      const age = currentItem.Age_Rating || currentItem["Age Rating"] || currentItem.AgeRating;
      if (age) {
        metaParts.push(`<span>${age}</span>`);
      }

      // TV Show Seasons count
      if (contentType === 'show') {
        const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
        if (seasons.length > 0) {
          metaParts.push(`<span>${seasons.length} Season${seasons.length > 1 ? 's' : ''}</span>`);
        }
      }

      // Duration (Only if exists in Firestore)
      const duration = currentItem.Duration || currentItem.duration || currentItem.Runtime || currentItem.runtime;
      if (duration) {
        metaParts.push(`<span>${duration}</span>`);
      }

      // Language
      const lang = Array.isArray(currentItem.Language) ? currentItem.Language.join(', ') : currentItem.Language;
      if (lang) {
        metaParts.push(`<span>${lang}</span>`);
      }

      // Rating (e.g. 7.6)
      const rating = currentItem.Rating || currentItem.rating || currentItem.IMDb || currentItem.imdb;
      if (rating) {
        metaParts.push(`<span>★ ${rating}</span>`);
      }

      metaRow.innerHTML = metaParts.join(' <span class="sep">•</span> ');

      // 4. Description (Strictly from document)
      const descEl = document.getElementById('contentDescription');
      const desc = currentItem.Discription || currentItem.Description || currentItem.description || '';
      if (desc) {
        descEl.innerText = desc;
        descEl.style.display = 'block';
      } else {
        descEl.style.display = 'none';
      }

      // 5. Tags / Genres with Pipes (Strictly from document)
      const tagsEl = document.getElementById('genresTagsLine');
      const rawTags = currentItem.Tags || currentItem.Genres || currentItem.Channel || '';
      if (rawTags) {
        const tagItems = (Array.isArray(rawTags) ? rawTags : String(rawTags).split(/[,/|]+/)).map(t => t.trim()).filter(Boolean);
        if (tagItems.length > 0) {
          tagsEl.innerHTML = tagItems.join(' <span class="pipe">|</span> ');
          tagsEl.style.display = 'block';
        } else {
          tagsEl.style.display = 'none';
        }
      } else {
        tagsEl.style.display = 'none';
      }

      // 6. Action Buttons
      renderCTAButtons();

      // 7. Watchlist state
      updateWatchlistButtonState();

      // 8. TV Shows Episodes
      if (contentType === 'show') {
        renderEpisodesSection();
      } else {
        document.getElementById('episodesSection').style.display = 'none';
      }
    }

    function scheduleTrailerPlayback() {
      const trailerStatusText = document.getElementById('trailerStatusText');
      const host = document.getElementById('heroTrailerHost');
      const trailerUrl = safeUrl(currentItem.Trailer || '');

      clearTimeout(trailerTimeout);
      trailerTimeout = setTimeout(() => {
        if (!trailerUrl) {
          trailerStatusText.innerText = "TRAILER UNAVAILABLE";
          trailerStatusText.style.display = "block";
          return;
        }

        const ytId = extractYouTubeId(trailerUrl);

        if (ytId) {
          host.innerHTML = `<div id="ytTrailerActualPlayer"></div>`;
          host.classList.add('playing');
          trailerStatusText.innerText = "TRAILER";
          trailerStatusText.style.display = "block";

          ytTrailerPlayer = new YT.Player('ytTrailerActualPlayer', {
            videoId: ytId,
            playerVars: {
              autoplay: 1,
              controls: 0,
              disablekb: 1,
              fs: 0,
              rel: 0,
              modestbranding: 1,
              showinfo: 0,
              iv_load_policy: 3,
              mute: 1,
              playsinline: 1
            },
            events: {
              onReady: (e) => e.target.playVideo(),
              onStateChange: (e) => {
                if (e.data === YT.PlayerState.ENDED) {
                  host.classList.remove('playing');
                  trailerStatusText.style.display = 'none';
                  try { ytTrailerPlayer.destroy(); } catch(err){}
                }
              },
              onError: () => {
                host.classList.remove('playing');
                trailerStatusText.innerText = "TRAILER UNAVAILABLE";
              }
            }
          });
        } else if (trailerUrl.endsWith('.mp4') || trailerUrl.includes('.m3u8')) {
          host.innerHTML = `<video id="videoTrailerEl" src="${trailerUrl}" autoplay muted playsinline></video>`;
          host.classList.add('playing');
          trailerStatusText.innerText = "TRAILER";
          trailerStatusText.style.display = "block";

          const vid = document.getElementById('videoTrailerEl');
          vid.onended = () => {
            host.classList.remove('playing');
            trailerStatusText.style.display = 'none';
          };
        } else {
          trailerStatusText.innerText = "TRAILER UNAVAILABLE";
          trailerStatusText.style.display = "block";
        }
      }, 3000);
    }

    // TV Show Episodes Section
    function renderEpisodesSection() {
      const epWrap = document.getElementById('episodesSection');
      const tabsRow = document.getElementById('seasonTabsRow');
      const listEl = document.getElementById('episodesList');
      const viewMoreBtn = document.getElementById('btnViewMoreEpisodes');

      const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
      if (seasons.length === 0) {
        epWrap.style.display = 'none';
        return;
      }

      epWrap.style.display = 'block';
      tabsRow.innerHTML = seasons.map(s => `
        <button class="season-btn ${s === currentSeasonKey ? 'active' : ''}" onclick="window.selectSeasonTab('${s}')">
          ${s}
        </button>
      `).join('');

      const epList = currentItem[currentSeasonKey] || [];
      const seasonNum = currentSeasonKey.replace(/\D/g, '') || '1';
      const limit = showAllEpisodes ? epList.length : 5;
      const thumbUrl = getHorizontalImage(currentItem);
      const fallbackThumb = safeUrl(currentItem.Banner || currentItem.Poster || '');

      listEl.innerHTML = epList.slice(0, limit).map((ep, idx) => `
        <a class="ep-card" href="1.html?watch=${currentItem.id}&season=${encodeURIComponent(currentSeasonKey)}&ep=${idx + 1}">
          <div class="ep-thumb-wrap">
            <img src="${thumbUrl}" alt="${ep.Name || ''}" onerror="if(this.src!=='${fallbackThumb}') this.src='${fallbackThumb}';">
            <div class="ep-play-circle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          </div>
          <div class="ep-info">
            <div class="ep-name">${ep.Name || `Episode ${idx + 1}`}</div>
            <div class="ep-subtext">S${seasonNum} E${idx + 1}${ep.Duration ? ` • ${ep.Duration}` : ''}</div>
          </div>
        </a>
      `).join('');

      if (epList.length > 5) {
        viewMoreBtn.style.display = 'flex';
        viewMoreBtn.innerText = showAllEpisodes ? 'View Less' : 'View More';
        viewMoreBtn.onclick = () => {
          showAllEpisodes = !showAllEpisodes;
          renderEpisodesSection();
        };
      } else {
        viewMoreBtn.style.display = 'none';
      }
    }

    window.selectSeasonTab = function(seasonKey) {
      currentSeasonKey = seasonKey;
      renderEpisodesSection();
    };

    function updateWatchlistButtonState() {
      const btn = document.getElementById('btnWatchlist');
      if (!btn) return;
      const isAdded = userWatchlist.includes(currentItem.id);
      btn.classList.toggle('active', isAdded);
      document.getElementById('wlIcon').innerHTML = isAdded 
        ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>' 
        : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>';
    }

    function attachActionListeners() {
      const wlBtn = document.getElementById('btnWatchlist');
      if (wlBtn) {
        wlBtn.onclick = async () => {
          wlBtn.classList.remove('animating');
          void wlBtn.offsetWidth;
          wlBtn.classList.add('animating');

          if (!currentUser) {
            try {
              const stored = localStorage.getItem('active_user') || localStorage.getItem('user');
              currentUser = stored ? JSON.parse(stored) : null;
            } catch (e){}
          }

          if (!currentUser) {
            showToast("Please login to save to Watchlist");
            return;
          }

          const isAdded = userWatchlist.includes(currentItem.id);

          if (isAdded) {
            userWatchlist = userWatchlist.filter(id => id !== currentItem.id);
            showToast("Removed from Watchlist");
          } else {
            userWatchlist.push(currentItem.id);
            showToast("Added to Watchlist");
          }
          currentUser.Watchlist = userWatchlist;
          localStorage.setItem('active_user', JSON.stringify(currentUser));
          updateWatchlistButtonState();

          try {
            if (!userDocRef && currentUser.Lotus) {
              const snap = await getDocs(query(collection(userDb, "UARM"), where("Lotus", "==", currentUser.Lotus)));
              if (!snap.empty) userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            }

            if (userDocRef) {
              if (isAdded) {
                await updateDoc(userDocRef, { Watchlist: arrayRemove(currentItem.id) });
              } else {
                await updateDoc(userDocRef, { Watchlist: arrayUnion(currentItem.id) });
              }
            }
          } catch (err) {}
        };
      }

      const shareBtn = document.getElementById('btnShare');
      if (shareBtn) {
        shareBtn.onclick = async () => {
          const shareUrl = `${window.location.origin}${window.location.pathname}?preview=${currentItem.id}`;
          if (navigator.share) {
            try {
              await navigator.share({
                title: currentItem.Name || "Hotstar",
                text: `Watch ${currentItem.Name} on Hotstar!`,
                url: shareUrl
              });
            } catch(e){}
          } else {
            navigator.clipboard.writeText(shareUrl);
            showToast("Link copied to clipboard!");
          }
        };
      }
    }

    async function fetchRecommendations() {
      const grid = document.getElementById('recommendationsGrid');
      try {
        const snap = await getDocs(collection(contentDb, currentCollection));
        let items = [];
        snap.forEach(d => {
          if (d.id !== currentItem.id) items.push({ id: d.id, ...d.data() });
        });

        const targetGenres = String(currentItem.Genres || currentItem.Tags || currentItem.Channel || '').toLowerCase().split(/[,/|]+/);
        const targetStudio = String(currentItem.Studio || currentItem.Channel || '').toLowerCase();
        const targetAge = String(currentItem.Age_Rating || '').toLowerCase();

        items.sort((a, b) => {
          let scoreA = 0;
          let scoreB = 0;

          const aG = String(a.Genres || a.Tags || a.Channel || '').toLowerCase();
          const bG = String(b.Genres || b.Tags || b.Channel || '').toLowerCase();
          targetGenres.forEach(g => {
            if (g && aG.includes(g.trim())) scoreA += 10;
            if (g && bG.includes(g.trim())) scoreB += 10;
          });

          if (targetStudio && String(a.Studio || a.Channel || '').toLowerCase().includes(targetStudio)) scoreA += 15;
          if (targetStudio && String(b.Studio || b.Channel || '').toLowerCase().includes(targetStudio)) scoreB += 15;

          if (targetAge && String(a.Age_Rating || '').toLowerCase() === targetAge) scoreA += 5;
          if (targetAge && String(b.Age_Rating || '').toLowerCase() === targetAge) scoreB += 5;

          return scoreB - scoreA;
        });

        grid.innerHTML = items.slice(0, 14).map(c => {
          const primary = getHorizontalImage(c);
          const fallback = safeUrl(c.Banner || c.Poster || '');
          const genres = c.Genres || c.Tags || c.Channel || c.Language || '';
          
          return `
            <a class="rec-16-9-card" href="preview.html?preview=${c.id}">
              <div class="rec-16-9-thumb">
                <img src="${primary}" alt="${c.Name || 'Title'}" loading="lazy" onerror="if(this.src!=='${fallback}') this.src='${fallback}';">
              </div>
              <div class="rec-title">${c.Name || 'Title'}</div>
              ${genres ? `<div class="rec-sub">${genres}</div>` : ''}
            </a>
          `;
        }).join('');
      } catch (err) {}
    }

    async function start() {
      await loadUserSubscriptionPlan();
      await fetchContentData(contentId);
    }
    start();
  </script>
