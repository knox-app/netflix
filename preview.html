<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Previewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1014;
            --text-main: #ffffff;
            --text-dim: #a9a9a9;
            --blue-accent: #007aff;
            --tag-bg: rgba(0, 122, 255, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            padding-bottom: 100px; /* Space for bottom bar */
        }

        /* --- Hero / Trailer Section --- */
        .hero-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 11;
            background-color: #000;
        }

        #banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 1s;
        }

        .trailer-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            z-index: 2;
        }

        .status-msg {
            position: absolute;
            top: 20px; left: 20px;
            font-size: 10px; font-weight: 800;
            color: rgba(255,255,255,0.4);
            letter-spacing: 1.5px;
            display: none;
            z-index: 5;
        }

        .hero-gradient {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 60%;
            background: linear-gradient(to top, var(--bg-color) 10%, transparent);
            z-index: 3;
        }

        /* --- Content Area --- */
        .content-main {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            margin-top: -40px;
            position: relative;
            z-index: 10;
        }

        .logo-box {
            height: 70px;
            width: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .meta-text {
            font-size: 13px;
            color: var(--text-dim);
            margin-bottom: 25px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .age-rating {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
        }

        /* --- Buttons --- */
        .btn-play {
            width: 100%;
            max-width: 450px;
            background: #fff;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .btn-play span { color: #666; font-weight: 400; font-size: 14px; }

        /* Blue Progress Bar on Button */
        .btn-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            width: 40%; /* Mock progress */
            background: var(--blue-accent);
        }

        /* --- Blue Tags Section --- */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .blue-tag {
            background: var(--tag-bg);
            color: var(--blue-accent);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(0, 122, 255, 0.3);
        }

        .genres-row {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 15px;
            text-align: center;
        }

        .desc-box {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.5;
            text-align: left;
            width: 100%;
            margin-bottom: 30px;
        }

        /* --- Bottom Blue Divider Bar --- */
        .bottom-nav-spacer {
            position: fixed;
            bottom: 60px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--blue-accent), transparent);
            box-shadow: 0 0 15px var(--blue-accent);
            z-index: 100;
        }

        /* --- Episode Section --- */
        .section-header { padding: 0 20px; margin: 20px 0; font-size: 18px; }
        
        .ep-card {
            display: flex;
            padding: 10px 20px;
            gap: 15px;
            align-items: center;
        }

        .ep-img {
            width: 130px; aspect-ratio: 16/9;
            background: #222; border-radius: 6px; object-fit: cover;
        }

        #loader {
            position: fixed; inset:0; background: #000; 
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
    </style>
</head>
<body>

    <div id="loader">Loading...</div>

    <div id="preview-app" style="display:none;">
        <div class="hero-container">
            <div id="trailer-status" class="status-msg">TRAILER UNAVAILABLE</div>
            <img id="banner-img" src="">
            <div id="trailer-player" class="trailer-overlay"></div>
            <div class="hero-gradient"></div>
        </div>

        <div class="content-main">
            <div class="logo-box">
                <img id="content-logo" src="">
            </div>

            <div class="meta-text" id="meta-data">
                <!-- Year, Rating, etc -->
            </div>

            <button class="btn-play" id="action-btn">
                ▶ <div id="main-btn-text">Watch Now</div> <span id="sub-btn-text"></span>
                <div class="btn-progress"></div>
            </button>

            <!-- Blue Tags -->
            <div class="tags-container" id="blue-tags"></div>

            <div class="genres-row" id="genre-list"></div>

            <div class="desc-box" id="content-desc"></div>
        </div>

        <div id="episodes-area" style="display:none;">
            <h3 class="section-header">Episodes</h3>
            <div id="ep-list"></div>
        </div>

        <!-- The Blue Accent Line from Design -->
        <div class="bottom-nav-spacer"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
            authDomain: "internal-systems-46728.firebaseapp.com",
            projectId: "internal-systems-46728",
            storageBucket: "internal-systems-46728.firebasestorage.app",
            messagingSenderId: "172177452674",
            appId: "1:172177452674:web:155a2417da5531dd7ece9b",
            measurementId: "G-Y87B8VRQ1N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const watchId = params.get('watch');

        async function init() {
            if(!watchId) return;

            try {
                // Adjusting to your collection name seen in screenshot "Live TV"
                const docRef = doc(db, "Live TV", watchId);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const data = snap.data();
                    renderPreview(data);
                }
            } catch (err) { console.error(err); }
        }

        function renderPreview(data) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('preview-app').style.display = 'block';

            document.getElementById('banner-img').src = data.Banner || '';
            document.getElementById('content-logo').src = data.Logo || '';
            document.getElementById('content-desc').innerText = data.Description || '';

            // Meta Data
            document.getElementById('meta-data').innerHTML = `
                <span>2024</span>
                <span class="age-rating">${data['Age Rating'] || 'U'}</span>
                <span>${data.Type === 'Series' ? '3 Seasons' : ''}</span>
                <span>${data.Language || 'Hindi'}</span>
            `;

            // Button Config
            const btnLabel = document.getElementById('main-btn-text');
            const btnSub = document.getElementById('sub-btn-text');
            if(data.Type === 'Series') {
                btnLabel.innerText = "Watch Latest Season";
                btnSub.innerText = "S3 E1";
                renderEpisodes(data);
            } else if (data.Type === 'Live') {
                btnLabel.innerText = "Watch Live";
            }

            // Blue Tags logic
            const tagsWrap = document.getElementById('blue-tags');
            if(data.Tags && Array.isArray(data.Tags)) {
                data.Tags.forEach(t => {
                    const el = document.createElement('div');
                    el.className = 'blue-tag';
                    el.innerText = t;
                    tagsWrap.appendChild(el);
                });
            }

            // Genres logic (The pipe separated white text)
            if(data.Genres) {
                document.getElementById('genre-list').innerText = data.Genres.split(',').join('  |  ');
            }

            // Trailer Timer
            setTimeout(() => {
                if(data.Stream && data.Stream.includes('youtube')) {
                    const player = document.getElementById('trailer-player');
                    player.style.display = 'block';
                    document.getElementById('banner-img').style.opacity = '0';
                    let vid = data.Stream.split('v=')[1] || data.Stream.split('/').pop();
                    player.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&controls=0" frameborder="0" allow="autoplay"></iframe>`;
                } else {
                    document.getElementById('trailer-status').style.display = 'block';
                }
            }, 3000);
        }

        function renderEpisodes(data) {
            document.getElementById('episodes-area').style.display = 'block';
            const list = document.getElementById('ep-list');
            for(let i=1; i<=3; i++) {
                const div = document.createElement('div');
                div.className = 'ep-card';
                div.innerHTML = `
                    <img class="ep-img" src="${data.Banner}">
                    <div style="flex-grow:1">Episode ${i} Title</div>
                    <div style="font-size:20px">⇩</div>
                `;
                list.appendChild(div);
            }
        }

        init();
    </script>
</body>
</html>
