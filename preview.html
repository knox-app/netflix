<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Previewer - Hotstar Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1014;
            --blue-gradient: linear-gradient(90deg, #0a58ca 0%, #d63384 100%);
            --text-dim: #a9a9a9;
            --white: #ffffff;
            --sidebar-width: 80px;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* 1. Left Sidebar Mockup (Desktop Only) */
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0;
            width: var(--sidebar-width);
            background: rgba(0,0,0,0.4);
            display: none; flex-direction: column; align-items: center;
            padding-top: 30px; z-index: 100;
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .sidebar-item { margin-bottom: 35px; color: #777; cursor: pointer; font-size: 20px; }
        .sidebar-item:hover { color: #fff; }

        /* 2. Hero Section (Full Screen Banner) */
        .hero {
            position: relative;
            width: 100%;
            height: 85vh;
            background: #000;
            overflow: hidden;
        }

        #banner-img {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
            transition: opacity 1.5s ease;
        }

        #trailer-wrapper {
            position: absolute; inset: 0;
            z-index: 0; background: #000;
        }

        #trailer-wrapper iframe {
            position: absolute; top: -12%; left: -12%;
            width: 124%; height: 124%; pointer-events: none;
        }

        /* Gradients to make text readable */
        .v-gradient {
            position: absolute; inset: 0;
            background: linear-gradient(to top, var(--bg) 5%, transparent 60%);
            z-index: 2;
        }

        .h-gradient {
            position: absolute; inset: 0;
            background: linear-gradient(to right, var(--bg) 10%, transparent 80%);
            z-index: 3;
            display: none;
        }

        /* 3. Main Content Content Overlay */
        .main-wrapper {
            position: relative;
            z-index: 10;
            padding: 0 20px;
            margin-top: -15vh; /* Pull content up for mobile */
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
        }

        .content-logo {
            max-width: 220px; max-height: 120px;
            object-fit: contain; margin-bottom: 15px;
        }

        .meta-row {
            display: flex; gap: 12px; font-size: 14px;
            font-weight: 500; color: var(--text-dim); margin-bottom: 20px;
        }

        .description {
            font-size: 14px; line-height: 1.6; color: #ccc;
            max-width: 600px; margin-bottom: 15px;
        }

        .genres-row {
            font-size: 13px; font-weight: bold; color: #fff;
            margin-bottom: 30px; letter-spacing: 0.5px;
        }

        /* 4. Action Buttons (Hotstar Style) */
        .button-group {
            display: flex; gap: 15px; width: 100%; justify-content: center;
            margin-bottom: 40px;
        }

        .watch-btn {
            background: var(--blue-gradient);
            color: #fff; border: none; border-radius: 6px;
            padding: 12px 35px; font-size: 16px; font-weight: bold;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            flex-grow: 1; max-width: 300px;
        }
        .watch-btn span.date { font-weight: 400; font-size: 14px; margin-left: 10px; opacity: 0.9; }

        .plus-btn {
            background: rgba(255,255,255,0.1);
            color: #fff; border: none; border-radius: 6px;
            width: 50px; font-size: 24px; cursor: pointer;
        }

        /* 5. Episode List Section */
        .episodes-area {
            max-width: 1200px; margin: 40px auto; padding: 0 20px;
            display: none;
        }
        .section-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .ep-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .ep-card {
            display: flex; gap: 15px; background: rgba(255,255,255,0.03);
            padding: 12px; border-radius: 8px; align-items: center;
        }
        .ep-thumb { width: 130px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; background: #333; }
        .ep-title { font-weight: bold; font-size: 14px; flex: 1; }

        /* --- DESKTOP VIEWPORT --- */
        @media (min-width: 1024px) {
            .sidebar { display: flex; }
            .h-gradient { display: block; }
            .hero { height: 100vh; }
            
            .main-wrapper {
                position: absolute; top: 0; left: var(--sidebar-width);
                width: 50%; height: 100vh;
                padding-left: 60px; padding-top: 50px;
                align-items: flex-start; text-align: left;
                justify-content: center; margin-top: 0;
            }

            .content-logo { max-width: 400px; max-height: 180px; }
            .description { font-size: 16px; max-width: 550px; }
            .button-group { justify-content: flex-start; }
            .ep-grid { grid-template-columns: 1fr 1fr; }
            .watch-btn { flex-grow: 0; }
        }
    </style>
</head>
<body>

<!-- Navigation Sidebar -->
<div class="sidebar">
    <div class="sidebar-item">🏠</div>
    <div class="sidebar-item">🔍</div>
    <div class="sidebar-item">📺</div>
    <div class="sidebar-item">🎬</div>
    <div class="sidebar-item">⚽</div>
    <div class="sidebar-item">👤</div>
</div>

<div id="preview-page">
    <div class="hero">
        <img id="banner-img" src="" alt="Banner">
        <div id="trailer-wrapper"></div>
        <div class="v-gradient"></div>
        <div class="h-gradient"></div>
    </div>

    <div class="main-wrapper">
        <img id="logo-img" class="content-logo" src="" alt="Logo">
        
        <div class="meta-row" id="meta-data"></div>

        <div class="description" id="desc-text"></div>

        <div class="genres-row" id="genres-row"></div>

        <div class="button-group">
            <button class="watch-btn" id="main-play-btn">
                <span style="font-size: 20px;">▶</span> 
                <span>Watch Latest Episode</span> 
                <span class="date" id="btn-date"></span>
            </button>
            <button class="plus-btn">＋</button>
        </div>
    </div>

    <!-- Episode List Section -->
    <div class="episodes-area" id="series-section">
        <div class="section-title">Season 1 Episodes</div>
        <div class="ep-grid" id="ep-list"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
        authDomain: "internal-systems-46728.firebaseapp.com",
        projectId: "internal-systems-46728",
        storageBucket: "internal-systems-46728.firebasestorage.app",
        messagingSenderId: "172177452674",
        appId: "1:172177452674:web:155a2417da5531dd7ece9b",
        measurementId: "G-Y87B8VRQ1N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const watchId = urlParams.get('watch');

    async function init() {
        if(!watchId) return;

        // Try Series collection first
        let snap = await getDoc(doc(db, "Series", watchId));
        if(!snap.exists()) {
            snap = await getDoc(doc(db, "Live TV", watchId));
        }

        if(snap.exists()) {
            renderPage(snap.data());
        }
    }

    function renderPage(data) {
        document.getElementById('banner-img').src = data.Banner || '';
        document.getElementById('logo-img').src = data.Logo || '';
        document.getElementById('desc-text').innerText = data.Description || '';

        // Meta (Year, Age, Lang)
        document.getElementById('meta-data').innerHTML = `
            <span>2024</span> • 
            <span>${data['Age Rating'] || 'U/A 13+'}</span> • 
            <span>${data.Language || 'Hindi'}</span>
        `;

        // Genres Row
        if(data.Genres) {
            document.getElementById('genres-row').innerText = data.Genres.split(',').join(' | ');
        }

        // Series Logic: Check for Season 1 structure
        const season1 = data['Season 1'];
        if(season1 && season1.Episodes) {
            document.getElementById('series-section').style.display = 'block';
            document.getElementById('btn-date').innerText = "17 Aug"; // Demo date
            renderEpisodes(season1.Episodes, data.Banner);
        } else {
            // Adjust button for Movie/Live
            document.getElementById('main-play-btn').querySelector('span:nth-child(2)').innerText = "Watch Now";
        }

        // --- TRAILER REPAIR (3 seconds delay) ---
        setTimeout(() => {
            const ytId = extractID(data.Trailer);
            if(ytId) {
                const wrapper = document.getElementById('trailer-wrapper');
                const banner = document.getElementById('banner-img');
                wrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1" frameborder="0" allow="autoplay"></iframe>`;
                wrapper.style.zIndex = "5";
                banner.style.opacity = "0";
            }
        }, 3000);
    }

    function renderEpisodes(arr, thumb) {
        const list = document.getElementById('ep-list');
        arr.forEach((ep, i) => {
            const card = document.createElement('div');
            card.className = 'ep-card';
            card.innerHTML = `
                <img class="ep-thumb" src="${thumb}">
                <div class="ep-info">
                    <div class="ep-title">${i+1}. ${ep.Tittle || 'New Episode'}</div>
                </div>
                <div style="font-size: 20px; cursor:pointer" onclick="window.open('${ep.Stream || '#'}','_blank')">▶</div>
            `;
            list.appendChild(card);
        });
    }

    function extractID(url) {
        const reg = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const m = url ? url.match(reg) : null;
        return (m && m[2].length === 11) ? m[2] : null;
    }

    init();
</script>

</body>
</html>
