<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Previewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Inter:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1014;
            --blue-pink-gradient: linear-gradient(90deg, #0a58ca 0%, #d63384 100%);
            --text-dim: #a9a9a9;
            --white: #ffffff;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        /* 1. Hero Section (Banner & Trailer) */
        .hero {
            position: relative;
            width: 100%;
            height: 56.25vw; /* 16:9 ratio */
            max-height: 85vh;
            background: #000;
            overflow: hidden;
        }

        #banner-img {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover; z-index: 1;
            transition: opacity 1.5s ease;
        }

        #trailer-wrapper {
            position: absolute; inset: 0;
            z-index: 0; background: #000;
        }

        /* YouTube UI Cropping Logic */
        #trailer-wrapper iframe {
            position: absolute; top: -12%; left: -12%;
            width: 124%; height: 124%; pointer-events: none;
        }

        /* Cinematic Gradients */
        .v-gradient {
            position: absolute; inset: 0;
            background: linear-gradient(to top, var(--bg) 8%, transparent 60%);
            z-index: 2;
        }
        .h-gradient { display: none; } /* Only for Desktop */

        /* 2. Main Content Overlay */
        .main-wrapper {
            position: relative;
            z-index: 10;
            padding: 0 20px;
            margin-top: -10vh; /* Overlap gradient for mobile */
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
        }

        /* Logo vs Title Styling */
        #logo-img {
            max-width: 220px; max-height: 120px;
            object-fit: contain; margin-bottom: 15px;
            display: none; /* Shown only if URL exists */
        }

        #fallback-title {
            font-family: 'Inter', sans-serif;
            font-size: 32px; font-weight: 800;
            margin: 0 0 15px 0;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            display: none; /* Shown only if Logo is missing */
        }

        .meta-row {
            display: flex; gap: 12px; font-size: 14px;
            font-weight: 500; color: var(--text-dim); margin-bottom: 20px;
        }

        .description {
            font-size: 14px; line-height: 1.6; color: #ccc;
            max-width: 600px; margin-bottom: 20px;
        }

        .genres-row {
            font-size: 13px; font-weight: bold; color: #fff;
            margin-bottom: 30px;
        }

        /* 3. Action Buttons */
        .btn-group {
            display: flex; gap: 12px; width: 100%; justify-content: center;
            margin-bottom: 40px;
        }

        .watch-btn {
            background: var(--blue-pink-gradient);
            color: #fff; border: none; border-radius: 6px;
            padding: 14px 30px; font-size: 16px; font-weight: bold;
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            flex-grow: 1; max-width: 350px;
        }
        .watch-btn .sub-info { font-weight: 400; font-size: 14px; margin-left: auto; opacity: 0.8; }

        .add-btn {
            background: rgba(255,255,255,0.1);
            color: #fff; border: none; border-radius: 6px;
            width: 50px; font-size: 24px; cursor: pointer;
        }

        /* 4. Episode List */
        .episodes-area {
            max-width: 1200px; margin: 40px auto; padding: 0 20px;
            display: none;
        }
        .section-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; }
        .ep-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .ep-card {
            display: flex; gap: 15px; background: rgba(255,255,255,0.03);
            padding: 12px; border-radius: 8px; align-items: center;
        }
        .ep-thumb { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; background: #333; }
        .ep-info { flex: 1; font-size: 14px; }
        .ep-title { font-weight: bold; margin-bottom: 4px; }

        /* --- DESKTOP VIEWPORT --- */
        @media (min-width: 1024px) {
            .hero { height: 85vh; }
            .h-gradient {
                display: block; position: absolute; inset: 0;
                background: linear-gradient(to right, var(--bg) 10%, transparent 70%);
                z-index: 3;
            }
            .main-wrapper {
                position: absolute; top: 0; left: 0;
                width: 50%; height: 85vh;
                padding-left: 60px; padding-top: 50px;
                align-items: flex-start; text-align: left;
                justify-content: center; margin-top: 0;
            }
            #fallback-title { font-size: 56px; max-width: 600px; }
            #logo-img { max-width: 380px; max-height: 180px; }
            .description { font-size: 16px; max-width: 550px; }
            .btn-group { justify-content: flex-start; }
            .watch-btn { flex-grow: 0; width: 320px; }
            .ep-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Hero (Visuals) -->
    <div class="hero">
        <img id="banner-img" src="" alt="">
        <div id="trailer-wrapper"></div>
        <div class="v-gradient"></div>
        <div class="h-gradient"></div>
    </div>

    <!-- Info Overlay -->
    <div class="main-wrapper">
        <!-- Brand Logic: Image or Text -->
        <img id="logo-img" src="" alt="">
        <h1 id="fallback-title"></h1>
        
        <div class="meta-row" id="meta-data"></div>
        <div class="description" id="desc-text"></div>
        <div class="genres-row" id="genres-row"></div>

        <div class="btn-group">
            <button class="watch-btn" id="main-play">
                <span style="font-size: 20px;">▶</span> 
                <span id="btn-label">Watch Now</span> 
                <span class="sub-info" id="btn-date"></span>
            </button>
            <button class="add-btn">＋</button>
        </div>
    </div>

    <!-- Series Episodes -->
    <div class="episodes-area" id="episodes-section">
        <div class="section-title">Season 1 Episodes</div>
        <div class="ep-grid" id="ep-list"></div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
        authDomain: "internal-systems-46728.firebaseapp.com",
        projectId: "internal-systems-46728",
        storageBucket: "internal-systems-46728.firebasestorage.app",
        messagingSenderId: "172177452674",
        appId: "1:172177452674:web:155a2417da5531dd7ece9b",
        measurementId: "G-Y87B8VRQ1N"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const watchId = urlParams.get('watch');

    async function init() {
        if(!watchId) return;

        // Try Series then Live TV
        let snap = await getDoc(doc(db, "Series", watchId));
        if(!snap.exists()) {
            snap = await getDoc(doc(db, "Live TV", watchId));
        }

        if(snap.exists()) {
            renderContent(snap.data());
        }
    }

    function renderContent(data) {
        document.getElementById('banner-img').src = data.Banner || '';
        document.getElementById('desc-text').innerText = data.Description || '';

        // Branding Logic: Logo vs Name
        const logoEl = document.getElementById('logo-img');
        const titleEl = document.getElementById('fallback-title');

        if(data.Logo && data.Logo.trim() !== "") {
            logoEl.src = data.Logo;
            logoEl.style.display = 'block';
            titleEl.style.display = 'none';
        } else {
            titleEl.innerText = data.Name || data.Title || "Stream Content";
            titleEl.style.display = 'block';
            logoEl.style.display = 'none';
        }

        // Meta (Year, Age, Language)
        document.getElementById('meta-data').innerHTML = `
            <span>2024</span> • 
            <span>${data['Age Rating'] || 'U/A 13+'}</span> • 
            <span>${data.Language || 'Hindi'}</span>
        `;

        // Genres
        if(data.Genres) {
            document.getElementById('genres-row').innerText = data.Genres.split(',').join(' | ');
        }

        // Series Logic
        const season1 = data['Season 1'];
        if(season1 && season1.Episodes) {
            document.getElementById('episodes-section').style.display = 'block';
            document.getElementById('btn-label').innerText = "Watch Latest Episode";
            document.getElementById('btn-date').innerText = "17 Aug";
            renderEpisodes(season1.Episodes, data.Banner);
        }

        // --- YouTube Trailer (3s delay) ---
        setTimeout(() => {
            const ytId = getYTID(data.Trailer);
            if(ytId) {
                const wrapper = document.getElementById('trailer-wrapper');
                const banner = document.getElementById('banner-img');
                wrapper.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&mute=1&controls=0&modestbranding=1&rel=0&iv_load_policy=3&disablekb=1" frameborder="0" allow="autoplay"></iframe>`;
                wrapper.style.zIndex = "5";
                banner.style.opacity = "0";
            }
        }, 3000);
    }

    function renderEpisodes(arr, thumb) {
        const list = document.getElementById('ep-list');
        arr.forEach((ep, i) => {
            const div = document.createElement('div');
            div.className = 'ep-card';
            div.innerHTML = `
                <img class="ep-thumb" src="${thumb}">
                <div class="ep-info">
                    <div class="ep-title">${i+1}. ${ep.Tittle || 'New Episode'}</div>
                </div>
                <div style="font-size: 20px; cursor:pointer" onclick="window.open('${ep.Stream || '#'}','_blank')">▶</div>
            `;
            list.appendChild(div);
        });
    }

    function getYTID(url) {
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
        const match = url ? url.match(regExp) : null;
        return (match && match[2].length === 11) ? match[2] : null;
    }

    init();
</script>

</body>
    </html>
