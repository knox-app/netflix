<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Previewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1014;
            --text-main: #ffffff;
            --text-dim: #a9a9a9;
            --accent: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        /* Top Banner Area */
        .hero-section {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            background-color: #000;
            overflow: hidden;
        }

        #banner-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.8s ease;
        }

        #trailer-wrap {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
        }

        .status-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.6);
            z-index: 10;
            display: none;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 24px;
            color: #fff;
            cursor: pointer;
            z-index: 10;
        }

        /* Gradient to blend image into background */
        .hero-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to top, var(--bg-color), transparent);
        }

        /* Content Info */
        .main-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
            margin-top: -30px; /* Pull content up over gradient */
            position: relative;
            z-index: 5;
        }

        .content-logo {
            max-width: 180px;
            max-height: 80px;
            margin-bottom: 15px;
            object-fit: contain;
        }

        .meta-row {
            display: flex;
            gap: 12px;
            font-size: 13px;
            color: var(--text-dim);
            align-items: center;
            margin-bottom: 20px;
        }

        .rating-box {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            color: #fff;
            font-weight: bold;
            font-size: 11px;
        }

        /* Fixed Button Style */
        .action-button {
            width: 100%;
            max-width: 400px;
            background-color: #fff;
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .action-button span {
            color: #666;
            font-weight: 400;
        }

        .tags-row {
            font-size: 13px;
            color: var(--text-main);
            font-weight: 600;
            margin-bottom: 10px;
            text-align: center;
        }

        .description {
            font-size: 13px;
            color: var(--text-dim);
            text-align: left;
            width: 100%;
            line-height: 1.4;
            margin-bottom: 25px;
        }

        /* Icon Buttons (Watchlist, Share, Rate) */
        .icon-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 300px;
            margin-bottom: 30px;
        }

        .icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            color: var(--text-dim);
            gap: 8px;
        }

        /* Season Tabs */
        .tabs-container {
            display: flex;
            gap: 25px;
            padding: 0 20px;
            border-bottom: 1px solid #222;
            margin-bottom: 15px;
            overflow-x: auto;
        }

        .tab {
            padding-bottom: 10px;
            font-size: 14px;
            color: var(--text-dim);
            white-space: nowrap;
            cursor: pointer;
        }

        .tab.active {
            color: #fff;
            border-bottom: 2px solid #fff;
            font-weight: bold;
        }

        /* Episode List */
        .episode-item {
            display: flex;
            padding: 10px 20px;
            gap: 15px;
            align-items: center;
        }

        .ep-thumb-wrap {
            position: relative;
            width: 120px;
            aspect-ratio: 16/9;
            flex-shrink: 0;
        }

        .ep-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        .ep-title {
            font-size: 14px;
            flex-grow: 1;
        }

        .download-icon { color: #fff; font-size: 18px; }

        #loading {
            position: fixed; inset: 0; background: #000; 
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading">Loading...</div>

    <div id="app" style="display:none;">
        <section class="hero-section">
            <div id="trailer-status" class="status-overlay">TRAILER UNAVAILABLE</div>
            <div class="close-btn">✕</div>
            <img id="banner-img" src="" alt="">
            <div id="trailer-wrap"></div>
        </section>

        <div class="main-info">
            <img id="main-logo" class="content-logo" src="" alt="Logo">
            
            <div class="meta-row" id="meta-row">
                <!-- Year, Rating, Seasons, Language dynamically inserted -->
            </div>

            <button class="action-button" id="main-action">
                ▶ <span id="btn-text">Watch Now</span> <span id="btn-subtext"></span>
            </button>

            <div class="tags-row" id="tags-row"></div>
            <div class="description" id="desc-text"></div>

            <div class="icon-bar">
                <div class="icon-item"><span>＋</span> Watchlist</div>
                <div class="icon-item"><span>➦</span> Share</div>
                <div class="icon-item"><span>♡</span> Rate</div>
            </div>
        </div>

        <div id="series-content" style="display:none;">
            <div class="tabs-container" id="season-tabs">
                <!-- Tabs generated here -->
            </div>
            <div id="episodes-list">
                <!-- Episodes generated here -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
            authDomain: "internal-systems-46728.firebaseapp.com",
            projectId: "internal-systems-46728",
            storageBucket: "internal-systems-46728.firebasestorage.app",
            messagingSenderId: "172177452674",
            appId: "1:172177452674:web:155a2417da5531dd7ece9b",
            measurementId: "G-Y87B8VRQ1N"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        const watchId = urlParams.get('watch');

        async function loadContent() {
            if(!watchId) {
                document.getElementById('loading').innerText = "No ID provided.";
                return;
            }

            try {
                // Change "Live TV" to your collection name if it's different
                const docRef = doc(db, "Live TV", watchId);
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    renderUI(snap.data());
                } else {
                    document.getElementById('loading').innerText = "Content not found.";
                }
            } catch (e) {
                console.error(e);
            }
        }

        function renderUI(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('app').style.display = 'block';

            // Banner & Logo
            document.getElementById('banner-img').src = data.Banner || '';
            document.getElementById('main-logo').src = data.Logo || '';
            document.getElementById('desc-text').innerText = data.Description || '';

            // Meta Row (Year, Rating, etc)
            const meta = document.getElementById('meta-row');
            meta.innerHTML = `
                <span>2024</span> 
                <span class="rating-box">${data['Age Rating'] || 'U'}</span>
                <span>${data.Type === 'Series' ? '3 Seasons' : ''}</span>
                <span>${data.Language || 'English'}</span>
            `;

            // Action Button Logic
            const btnText = document.getElementById('btn-text');
            const subText = document.getElementById('btn-subtext');
            
            if(data.Type === 'Live') btnText.innerText = "Watch Live";
            else if(data.Type === 'Movie') btnText.innerText = "Watch Now";
            else if(data.Type === 'Series') {
                btnText.innerText = "Watch Latest Season";
                subText.innerText = "S3 E1";
                setupSeriesView(data);
            }

            // Tags (Array to String with Separators)
            if(data.Tags) {
                document.getElementById('tags-row').innerText = data.Tags.join('  |  ');
            }

            // Trailer Logic
            setTimeout(() => {
                if (data.Stream && data.Stream.includes('youtube')) {
                    const wrap = document.getElementById('trailer-wrap');
                    wrap.style.display = 'block';
                    document.getElementById('banner-img').style.opacity = '0';
                    let vidId = data.Stream.split('v=')[1] || data.Stream.split('/').pop();
                    wrap.innerHTML = `<iframe width="100%" height="100%" src="https://www.youtube.com/embed/${vidId}?autoplay=1&mute=1&controls=0" frameborder="0" allow="autoplay"></iframe>`;
                } else {
                    document.getElementById('trailer-status').style.display = 'block';
                }
            }, 3000);
        }

        function setupSeriesView(data) {
            document.getElementById('series-content').style.display = 'block';
            const tabContainer = document.getElementById('season-tabs');
            const epList = document.getElementById('episodes-list');

            // Generate mock seasons based on your image
            ['Season 1', 'Season 2', 'Season 3'].forEach((name, i) => {
                const t = document.createElement('div');
                t.className = `tab ${i === 2 ? 'active' : ''}`;
                t.innerText = name;
                tabContainer.appendChild(t);
            });

            // Mock Episodes (Replace with real data or YouTube Playlist fetcher if needed)
            for(let i=1; i<=3; i++) {
                const item = document.createElement('div');
                item.className = 'episode-item';
                item.innerHTML = `
                    <div class="ep-thumb-wrap">
                        <img class="ep-thumb" src="${data.Banner}" alt="">
                    </div>
                    <div class="ep-title">Episode ${i} Title</div>
                    <div class="download-icon">⇩</div>
                `;
                epList.appendChild(item);
            }
        }

        loadContent();
    </script>
</body>
</html>
