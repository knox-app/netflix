<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Disney+ Hotstar Player</title>
  <!-- HLS.js Library -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <!-- JWPlayer Library (Exact Library for DASH MPD) -->
  <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>

  <style>
    :root {
      --bg-dark: #000000;
      --accent-blue: #0072ef;
      --live-red: #e50914;
      --text-main: #ffffff;
      --text-muted: #9aa0a6;
      --border-color: #262933;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; user-select: none; }

    /* Top Nav (Portrait Only) */
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: #0c0d12; border-bottom: 1px solid var(--border-color);
    }
    .top-nav .brand { font-size: 17px; font-weight: 800; color: #fff; }
    .top-nav .brand span { color: var(--accent-blue); }
    .user-pill { font-size: 11px; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; }

    .main-wrapper { max-width: 1100px; margin: 0 auto; padding-bottom: 30px; }

    /* Player Container */
    .player-container {
      position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden;
    }

    /* M3U8 Video Aspect Modes */
    video {
      width: 100%; height: 100%; border: none; object-fit: contain;
      transition: object-fit 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    video.fill-screen {
      object-fit: cover !important;
    }

    /* Clean Zero-Flash YouTube Frame Host Wrapper */
    #ytFrameHost {
      position: absolute; inset: 0; display: none; overflow: hidden; pointer-events: none;
      background: #000; opacity: 0;
      transition: opacity 0.4s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #ytFrameHost.ready { opacity: 1 !important; }

    #ytFrameHost iframe {
      width: calc(100% + 160px) !important;
      height: calc(100% + 220px) !important;
      position: absolute !important;
      top: -110px !important; left: -80px !important;
      pointer-events: none; transform: scale(1.05);
      transform-origin: center center; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    #ytFrameHost.fill-screen iframe { transform: scale(1.35) !important; }

    /* JWPlayer Host Wrapper for MPD ClearKey DRM */
    #jwHost {
      position: absolute; inset: 0; display: none; width: 100%; height: 100%;
    }
    #jwHost.fill-screen {
      transform: scale(1.15);
    }

    iframe#iframePlayer { width: 100%; height: 100%; border: none; }

    /* Mobile Landscape Fullscreen Layout */
    body.landscape-mode .top-nav, body.landscape-mode .details-wrapper { display: none !important; }
    body.landscape-mode .player-container {
      position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 99999; aspect-ratio: auto;
    }

    /* Toast Alert */
    .toast-alert {
      position: absolute; top: 18%; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 12px; font-weight: 600;
      z-index: 40; pointer-events: none; opacity: 0; transition: opacity 0.3s;
    }
    .toast-alert.show { opacity: 1; }

    /* Controls Overlay */
    .controls-overlay {
      position: absolute; inset: 0; z-index: 20;
      background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.85) 100%);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 14px 18px; opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
    }
    .controls-overlay.show { opacity: 1; pointer-events: auto; }

    /* Top Controls Bar */
    .ctrl-top { display: flex; align-items: center; justify-content: space-between; }
    .ctrl-top-left { display: flex; align-items: center; gap: 12px; }
    .ctrl-title { font-size: 15px; font-weight: 600; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctrl-top-right { display: flex; align-items: center; gap: 16px; }

    .icon-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* Portrait Rule: Show ONLY Settings and Fullscreen in vertical mode */
    body:not(.landscape-mode) .btn-cast,
    body:not(.landscape-mode) #lockBtn {
      display: none !important;
    }

    /* Center Controls */
    .ctrl-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: flex; align-items: center; gap: 45px;
    }
    .ctrl-center .icon-btn svg { width: 32px; height: 32px; }
    .btn-main-play svg { width: 38px; height: 38px; fill: #fff; }

    /* Bottom Timeline Controls */
    .ctrl-bottom { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .timeline-row { display: flex; align-items: center; gap: 12px; }

    .progress-bar {
      width: 100%; height: 4px; -webkit-appearance: none; appearance: none;
      background: var(--accent-blue); outline: none; cursor: pointer; border-radius: 4px;
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: #ffffff; box-shadow: 0 0 10px rgba(0, 114, 239, 0.8); cursor: pointer;
    }

    .time-val { font-size: 12px; font-weight: 700; color: #ffffff; white-space: nowrap; letter-spacing: 0.5px; }

    .action-bar-row { display: flex; align-items: center; justify-content: space-between; }
    .action-btn {
      background: none; border: none; color: #fff; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 6px; cursor: pointer; opacity: 0.9;
    }
    .action-btn-watch-next { display: none; }
    body.landscape-mode .action-btn-watch-next { display: flex; }

    /* Go Live Button */
    .btn-go-live {
      background: rgba(229, 9, 20, 0.25); color: var(--live-red); border: 1px solid var(--live-red);
      font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 12px; cursor: pointer;
      display: none; align-items: center; gap: 5px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .btn-go-live .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live-red); }

    /* Watch Next Overlay Tray */
    .watch-next-overlay {
      position: absolute; inset: 0; z-index: 35; background: rgba(0, 0, 0, 0.95);
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      transform: translateY(0);
    }
    .watch-next-overlay.show { opacity: 1; pointer-events: auto; }

    .watch-next-drag-handle {
      width: 40px; height: 4px; background: rgba(255,255,255,0.4); border-radius: 2px; margin: 0 auto 10px;
    }

    .watch-next-header { display: flex; align-items: center; justify-content: space-between; }
    .watch-next-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    .watch-next-cards-row {
      display: flex; gap: 14px; overflow-x: auto; padding: 10px 0; scrollbar-width: none;
    }
    .watch-next-cards-row::-webkit-scrollbar { display: none; }

    .watch-card { min-width: 190px; width: 190px; text-decoration: none; color: #fff; cursor: pointer; }
    .watch-card-thumb-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden;
      background: #111; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.15);
    }
    .watch-card-thumb-wrap .banner-img { width: 100%; height: 100%; object-fit: cover; }
    
    .watch-card-logo-top-right {
      position: absolute; top: 6px; right: 6px; width: 28px; height: 28px;
      object-fit: contain; background: rgba(0,0,0,0.6); border-radius: 4px; padding: 2px;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .play-badge {
      position: absolute; bottom: 8px; left: 8px; width: 20px; height: 20px;
      background: rgba(0,0,0,0.7); border-radius: 50%; display: flex; align-items: center;
      justify-content: center; border: 1px solid rgba(255,255,255,0.5);
    }
    .play-badge svg { width: 9px; height: 9px; fill: #fff; margin-left: 1px; }

    .watch-card-name { font-size: 13px; font-weight: 600; line-clamp: 1; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .watch-card-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* Access Denied Overlay */
    .access-denied-box {
      position: absolute; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }
    .denied-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .denied-desc { font-size: 13px; color: var(--text-muted); max-width: 400px; margin-bottom: 18px; }
    .btn-login { background: var(--accent-blue); color: #fff; font-weight: 700; padding: 10px 22px; border-radius: 20px; text-decoration: none; }

    .lock-overlay-btn {
      position: absolute; top: 15px; left: 15px; z-index: 25; background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3); padding: 8px 14px; border-radius: 20px;
      color: #fff; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }

    /* Portrait Details Section */
    .details-wrapper { padding: 16px; }
    .ch-title-head { font-size: 20px; font-weight: 800; color: #fff; }
    .ch-lang-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .section-head { font-size: 16px; font-weight: 700; margin: 22px 0 12px; color: #fff; }
    .channel-scroll-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .channel-scroll-row::-webkit-scrollbar { display: none; }

    .card-item {
      min-width: 140px; width: 140px; background: #131722; border: 1px solid var(--border-color);
      border-radius: 10px; padding: 10px; text-decoration: none; color: #fff; display: flex;
      flex-direction: column; align-items: center; text-align: center; cursor: pointer;
    }
    .card-thumb { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; border-radius: 6px; margin-bottom: 8px; }
    .card-name { font-size: 12px; font-weight: 700; }

    .loader-box { text-align: center; padding: 50px; color: var(--accent-blue); font-weight: 600; }
  </style>
</head>
<body>

<div class="top-nav">
  <div class="brand">⚡ Hotstar<span>TV</span></div>

<div id="appContent" style="display: none;">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, collection, query, where, getDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. Channel DB
  const channelConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728",
    storageBucket: "internal-systems-46728.firebasestorage.app",
    messagingSenderId: "172177452674",
    appId: "1:172177452674:web:155a2417da5531dd7ece9b",
    measurementId: "G-Y87B8VRQ1N"
  };
  const channelApp = initializeApp(channelConfig, "channelApp");
  const channelDb = getFirestore(channelApp);

  // 2. Auth DB
  const authConfig = {
    apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
    authDomain: "question-metabase.firebaseapp.com",
    databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "question-metabase",
    storageBucket: "question-metabase.firebasestorage.app",
    messagingSenderId: "770698198753",
    appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
    measurementId: "G-6ZP1FPMKSJ"
  };
  const authApp = initializeApp(authConfig, "authApp");
  const authDb = getFirestore(authApp);

  let hlsInstance = null;
  let ytPlayerInstance = null;
  let jwPlayerInstance = null;
  let activePlayerType = null; // 'hls' | 'youtube' | 'jwplayer' | 'iframe'
  let hideControlsTimer = null;
  let isScreenLocked = false;
  let isFillScreen = false;
  let currentChannel = null;
  let isUserSeeking = false;

  let channelDocUnsub = null;
  let collectionUnsub = null;

  const urlParams = new URLSearchParams(window.location.search);
  const currentDocId = urlParams.get('watch');

  if (!currentDocId) {
    document.getElementById('loader').innerText = "URL Parameter Missing (?watch=DOCUMENT_ID)";
  } else {
    initApp(currentDocId);
  }

  // Safe HTTPS Sanitizer
  function safeUrl(url) {
    if (!url) return '';
    return url.trim().replace(/^http:\/\//i, 'https://');
  }

  function extractYouTubeId(url) {
    try {
      const u = new URL(url.trim());
      if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0];
      if (u.hostname.includes('youtube.com') || u.hostname.includes('m.youtube.com')) {
        if (u.pathname === '/watch') return u.searchParams.get('v');
        if (u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
        if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
      }
    } catch(e) {
      if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) return url.trim();
    }
    return null;
  }

  // STOP AUDIO LEAK & CLEANLY RE-HYDRATE PLAYERS
  function destroyActivePlayers() {
    if (hlsInstance) {
      hlsInstance.destroy();
      hlsInstance = null;
    }
    const video = document.getElementById('videoPlayer');
    if (video) {
      video.pause();
      video.removeAttribute('src');
      video.load();
      video.classList.remove('fill-screen');
    }
    if (ytPlayerInstance) {
      try { ytPlayerInstance.stopVideo(); ytPlayerInstance.destroy(); } catch(e){}
      ytPlayerInstance = null;
    }
    if (window.jwplayer && jwplayer("player") && jwplayer("player").getState) {
      try { jwplayer("player").remove(); } catch(e){}
      jwPlayerInstance = null;
    }
    const jwHost = document.getElementById('jwHost');
    if (jwHost) {
      jwHost.innerHTML = '<div id="player"></div>';
      jwHost.style.display = 'none';
      jwHost.classList.remove('fill-screen');
    }
    const iframe = document.getElementById('iframePlayer');
    if (iframe) {
      iframe.src = 'about:blank';
      iframe.style.display = 'none';
    }
    const ytHost = document.getElementById('ytFrameHost');
    if (ytHost) {
      ytHost.innerHTML = '';
      ytHost.style.display = 'none';
      ytHost.classList.remove('ready', 'fill-screen');
    }
    isFillScreen = false;
  }

  // Unified Pinch Zoom Handler
  function applyZoomState(fill) {
    isFillScreen = fill;
    const video = document.getElementById('videoPlayer');
    const ytHost = document.getElementById('ytFrameHost');
    const jwHost = document.getElementById('jwHost');

    if (fill) {
      video.classList.add('fill-screen');
      ytHost.classList.add('fill-screen');
      jwHost.classList.add('fill-screen');
      showToast("Zoomed to Fill Screen");
    } else {
      video.classList.remove('fill-screen');
      ytHost.classList.remove('fill-screen');
      jwHost.classList.remove('fill-screen');
      showToast("Fit to Screen (Original)");
    }
  }

  function initApp(docId) {
    const loader = document.getElementById('loader');
    const userPill = document.getElementById('userPill');

    let activeUser = null;
    try { activeUser = JSON.parse(localStorage.getItem('active_user')); } catch(e){}

    if (channelDocUnsub) channelDocUnsub();

    channelDocUnsub = onSnapshot(doc(channelDb, "Live TV", docId), async (snap) => {
      if (!snap.exists()) {
        loader.innerText = `Channel '${docId}' not found.`;
        return;
      }

      currentChannel = { id: snap.id, ...snap.data() };

      document.getElementById('chTitle').innerText = currentChannel.Name || "Live Channel";
      document.getElementById('overlayChTitle').innerText = currentChannel.Name || "Live Channel";
      document.getElementById('chLangSub').innerText = `${currentChannel.Language || 'Hindi'} • ${currentChannel.Genres || 'Live Stream'}`;

      loader.style.display = 'none';
      document.getElementById('appContent').style.display = 'block';

      if (!activeUser || (!activeUser.Email && !activeUser.Lotus)) {
        userPill.innerText = "Not Logged In";
        showDenied("Login Required", "Please sign in to watch this channel.", "Sign In", `1 (3).html?continue=${encodeURIComponent(window.location.href)}`);
        return;
      }

      userPill.innerText = activeUser["First Name"] ? `👤 ${activeUser["First Name"]}` : `👤 ${activeUser.Email}`;

      let isAuth = await verifyUserPlan(activeUser, currentChannel.Partner);

      if (isAuth) {
        document.getElementById('accessDeniedBox').style.display = 'none';
        initStreamOrMpd(currentChannel);
      } else {
        showDenied("Access Restricted", `Your subscription plan does not include content from '${currentChannel.Partner || 'this studio'}'.`, "Upgrade Plan", "1 (3).html");
      }
    });

    listenToAllChannels(docId);
  }

  async function verifyUserPlan(activeUser, channelPartnerRaw) {
    let userPlans = [];
    try {
      const q = activeUser.Lotus 
        ? query(collection(authDb, "UARM"), where("Lotus", "==", activeUser.Lotus)) 
        : query(collection(authDb, "UARM"), where("Email", "==", activeUser.Email));
      
      const uarmSnap = await getDocs(q);
      if (!uarmSnap.empty) {
        const freshData = uarmSnap.docs[0].data();
        userPlans = freshData.Plans || [];
        localStorage.setItem('active_user', JSON.stringify(freshData));
      } else {
        userPlans = activeUser.Plans || [];
      }
    } catch (e) { userPlans = activeUser.Plans || []; }

    if (!Array.isArray(userPlans) || userPlans.length === 0) return false;

    const channelPartner = (channelPartnerRaw || "").trim().toLowerCase();

    for (const planId of userPlans) {
      try {
        const planSnap = await getDoc(doc(authDb, "Plans & Subscriptions", planId));
        if (planSnap.exists()) {
          const studios = planSnap.data().Studio || [];
          if (studios.some(s => s.toLowerCase() === channelPartner)) {
            return true;
          }
        }
      } catch (err) {}
    }
    return false;
  }

  function showDenied(title, desc, btnTxt, btnUrl) {
    destroyActivePlayers();
    const box = document.getElementById('accessDeniedBox');
    document.getElementById('deniedTitle').innerText = title;
    document.getElementById('deniedDesc').innerText = desc;
    const btn = document.getElementById('deniedBtn');
    btn.innerText = btnTxt;
    btn.href = btnUrl;
    box.style.display = 'flex';

    document.getElementById('controlsOverlay').style.display = 'none';
  }

  // AUTOMATIC STREAM OR MPD ROUTER
  function initStreamOrMpd(data) {
    destroyActivePlayers();

    const video = document.getElementById('videoPlayer');
    const iframe = document.getElementById('iframePlayer');
    const overlay = document.getElementById('controlsOverlay');
    const ytHost = document.getElementById('ytFrameHost');

    const streamUrl = safeUrl(data.Stream || '');
    const mpdObj = data.mpd || data.MPD || null;

    let mpdFile = null;
    let keyId = null;
    let key = null;

    if (mpdObj && (mpdObj.File || mpdObj.file)) {
      mpdFile = safeUrl(mpdObj.File || mpdObj.file);
      keyId = mpdObj.KeyID || mpdObj.keyId || mpdObj.KeyId || mpdObj.keyid;
      key = mpdObj.Key || mpdObj.key;
    } else if (streamUrl.includes('.mpd')) {
      mpdFile = streamUrl;
      keyId = mpdObj ? (mpdObj.KeyID || mpdObj.keyId || mpdObj.KeyId) : null;
      key = mpdObj ? (mpdObj.Key || mpdObj.key) : null;
    }

    // 1. Play MPD DASH with ClearKey DRM if MPD File exists
    if (mpdFile) {
      playJWPlayerMPD(mpdFile, keyId, key);
      return;
    }

    // 2. Stream URL handling
    if (streamUrl && streamUrl !== '') {
      const ytId = extractYouTubeId(streamUrl);

      // YouTube Stream
      if (ytId) {
        activePlayerType = 'youtube';
        video.style.display = 'none';
        iframe.style.display = 'none';
        ytHost.style.display = 'block';
        overlay.style.display = 'flex';

        const div = document.createElement('div');
        div.id = 'ytActualPlayer';
        ytHost.appendChild(div);

        ytPlayerInstance = new YT.Player('ytActualPlayer', {
          videoId: ytId,
          playerVars: {
            autoplay: 1,
            controls: 0,
            disablekb: 1,
            modestbranding: 1,
            rel: 0,
            iv_load_policy: 3,
            fs: 0,
            playsinline: 1,
            origin: window.location.origin
          },
          events: {
            onReady: (e) => e.target.playVideo(),
            onStateChange: (e) => {
              const playIcon = document.getElementById('playIcon');
              const pauseIcon = document.getElementById('pauseIcon');
              if (e.data === YT.PlayerState.PLAYING) {
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                setTimeout(() => ytHost.classList.add('ready'), 400);
              } else {
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
              }
            }
          }
        });
        setupInteraction();
        return;
      }
      // HLS / M3U8 Stream
      else if (streamUrl.includes('.m3u8') || streamUrl.includes('hls')) {
        activePlayerType = 'hls';
        iframe.style.display = 'none';
        ytHost.style.display = 'none';
        video.style.display = 'block';
        overlay.style.display = 'flex';

        if (Hls.isSupported()) {
          hlsInstance = new Hls({ liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 10 });
          hlsInstance.loadSource(streamUrl);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
          video.play().catch(() => {});
        }
        setupInteraction();
        return;
      }
      // Fallback IFrame
      else {
        activePlayerType = 'iframe';
        video.style.display = 'none';
        ytHost.style.display = 'none';
        overlay.style.display = 'none';
        iframe.style.display = 'block';
        iframe.src = streamUrl;
        return;
      }
    }

    showToast("No playable stream or MPD source found.");
  }

  // EXACT WORKING JWPLAYER CLEARKEY DRM SETUP
  function playJWPlayerMPD(mpdUrl, keyId, key) {
    activePlayerType = 'jwplayer';

    const video = document.getElementById('videoPlayer');
    const iframe = document.getElementById('iframePlayer');
    const ytHost = document.getElementById('ytFrameHost');
    const jwHost = document.getElementById('jwHost');
    const overlay = document.getElementById('controlsOverlay');

    video.style.display = 'none';
    iframe.style.display = 'none';
    ytHost.style.display = 'none';
    
    // Ensure jwHost is visible and contains a fresh <div id="player">
    jwHost.style.display = 'block';
    jwHost.innerHTML = '<div id="player"></div>';
    overlay.style.display = 'flex';

    const setupConfig = {
      playlist: [{
        file: mpdUrl,
        type: "dash",
        drm: (keyId && key) ? {
          clearkey: {
            keyId: keyId.toString().trim(),
            key: key.toString().trim()
          }
        } : undefined
      }],
      autostart: true,
      mute: false,     // Explicitly request unmuted playback
      volume: 100,    // Explicitly set 100% volume
      width: "100%",
      height: "100%",
      stretching: "exactfit",
      controls: false
    };

    try {
      jwPlayerInstance = jwplayer("player").setup(setupConfig);

      jwPlayerInstance.on('play', () => {
        document.getElementById('playIcon').style.display = 'none';
        document.getElementById('pauseIcon').style.display = 'block';

        // FORCE UNMUTE & FULL VOLUME ON PLAY EVENT
        try {
          jwPlayerInstance.setMute(false);
          jwPlayerInstance.setVolume(100);
        } catch(e){}
      });

      jwPlayerInstance.on('pause', () => {
        document.getElementById('playIcon').style.display = 'block';
        document.getElementById('pauseIcon').style.display = 'none';
      });

      jwPlayerInstance.on('error', function() {
        setTimeout(() => {
          if (jwPlayerInstance) {
            try {
              jwPlayerInstance.load();
              jwPlayerInstance.play();
            } catch(e){}
          }
        }, 3000);
      });

    } catch (err) {
      console.error("JWPlayer setup error:", err);
    }

    setupInteraction();
  }

  function showToast(msg) {
    const toast = document.getElementById('toastAlert');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function setupInteraction() {
    const video = document.getElementById('videoPlayer');
    const overlay = document.getElementById('controlsOverlay');
    const playerContainer = document.getElementById('playerContainer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const lockBtn = document.getElementById('lockBtn');
    const unlockBtn = document.getElementById('unlockBtn');
    const backBtn = document.getElementById('backBtn');
    const fullscreenToggleBtn = document.getElementById('fullscreenToggleBtn');
    const progressBar = document.getElementById('progressBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const goLiveBtn = document.getElementById('goLiveBtn');
    const watchNextOverlay = document.getElementById('watchNextOverlay');

    const showControls = () => {
      if (isScreenLocked) return;
      overlay.classList.add('show');
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => {
        overlay.classList.remove('show');
      }, 3500);
    };

    // Click to Wakeup & Click to Sleep + AUTO-UNMUTE ON FIRST TAP
    playerContainer.onclick = (e) => {
      e.stopPropagation();

      // UNMUTE AUDIO ON TAP IF BROWSER MUTED AUTOPLAY
      try {
        if (activePlayerType === 'jwplayer' && jwPlayerInstance) {
          jwPlayerInstance.setMute(false);
          jwPlayerInstance.setVolume(100);
        } else if (activePlayerType === 'hls' && video) {
          video.muted = false;
          video.volume = 1.0;
        } else if (activePlayerType === 'youtube' && ytPlayerInstance) {
          ytPlayerInstance.unMute();
          ytPlayerInstance.setVolume(100);
        }
      } catch(err){}

      if (isScreenLocked) return;
      if (overlay.classList.contains('show')) {
        overlay.classList.remove('show');
        clearTimeout(hideControlsTimer);
      } else {
        showControls();
      }
    };

    const togglePlay = (e) => {
      e?.stopPropagation();
      if (activePlayerType === 'youtube' && ytPlayerInstance) {
        const state = ytPlayerInstance.getPlayerState();
        if (state === YT.PlayerState.PLAYING) ytPlayerInstance.pauseVideo();
        else ytPlayerInstance.playVideo();
      } else if (activePlayerType === 'jwplayer' && jwPlayerInstance) {
        const state = jwPlayerInstance.getState();
        if (state === 'playing') jwPlayerInstance.pause();
        else jwPlayerInstance.play();
      } else {
        if (video.paused) video.play(); else video.pause();
      }
      showControls();
    };

    playBtn.onclick = togglePlay;

    video.onplay = () => { playIcon.style.display = 'none'; pauseIcon.style.display = 'block'; };
    video.onpause = () => { playIcon.style.display = 'block'; pauseIcon.style.display = 'none'; };

    rewindBtn.onclick = (e) => {
      e.stopPropagation();
      if (activePlayerType === 'youtube' && ytPlayerInstance) {
        const cur = ytPlayerInstance.getCurrentTime() || 0;
        ytPlayerInstance.seekTo(Math.max(0, cur - 10), true);
      } else if (activePlayerType === 'jwplayer' && jwPlayerInstance) {
        const pos = jwPlayerInstance.getPosition() || 0;
        jwPlayerInstance.seek(Math.max(0, pos - 10));
      } else {
        video.currentTime -= 10;
      }
      isUserSeeking = true;
      goLiveBtn.style.display = 'flex';
      showControls();
    };

    forwardBtn.onclick = (e) => {
      e.stopPropagation();
      if (activePlayerType === 'youtube' && ytPlayerInstance) {
        const cur = ytPlayerInstance.getCurrentTime() || 0;
        ytPlayerInstance.seekTo(cur + 10, true);
      } else if (activePlayerType === 'jwplayer' && jwPlayerInstance) {
        const pos = jwPlayerInstance.getPosition() || 0;
        jwPlayerInstance.seek(pos + 10);
      } else {
        video.currentTime += 10;
      }
      showControls();
    };

    // Steady Progress Bar for HLS Live
    video.ontimeupdate = () => {
      if (activePlayerType === 'youtube' || activePlayerType === 'jwplayer') return;
      if (!isUserSeeking) {
        progressBar.value = 100;
        progressBar.style.background = 'var(--accent-blue)';
        timeDisplay.innerText = "LIVE";
        goLiveBtn.style.display = 'none';
      } else {
        if (video.duration && isFinite(video.duration)) {
          const percentage = (video.currentTime / video.duration) * 100;
          progressBar.value = percentage;
          progressBar.style.background = `linear-gradient(to right, #0072ef 0%, #0072ef ${percentage}%, rgba(255,255,255,0.25) ${percentage}%, rgba(255,255,255,0.25) 100%)`;
          const current = new Date(video.currentTime * 1000).toISOString().substr(11, 8);
          timeDisplay.innerText = current;

          if (video.duration - video.currentTime > 12) {
            goLiveBtn.style.display = 'flex';
          } else {
            isUserSeeking = false;
          }
        }
      }
    };

    progressBar.oninput = (e) => {
      e.stopPropagation();
      isUserSeeking = true;
      if (activePlayerType === 'youtube' && ytPlayerInstance) {
        const dur = ytPlayerInstance.getDuration() || 0;
        ytPlayerInstance.seekTo(dur * (progressBar.value / 100), true);
      } else if (activePlayerType === 'jwplayer' && jwPlayerInstance) {
        const dur = jwPlayerInstance.getDuration() || 0;
        jwPlayerInstance.seek(dur * (progressBar.value / 100));
      } else if (video.duration && isFinite(video.duration)) {
        video.currentTime = (progressBar.value / 100) * video.duration;
      }
      goLiveBtn.style.display = 'flex';
    };

    goLiveBtn.onclick = (e) => {
      e.stopPropagation();
      isUserSeeking = false;
      if (activePlayerType === 'youtube' && ytPlayerInstance) {
        const dur = ytPlayerInstance.getDuration() || 0;
        ytPlayerInstance.seekTo(dur - 1, true);
        ytPlayerInstance.playVideo();
      } else if (activePlayerType === 'jwplayer' && jwPlayerInstance) {
        const dur = jwPlayerInstance.getDuration() || 0;
        jwPlayerInstance.seek(dur - 1);
        jwPlayerInstance.play();
      } else {
        if (hlsInstance && hlsInstance.liveSyncPosition) {
          video.currentTime = hlsInstance.liveSyncPosition;
        } else if (video.duration) {
          video.currentTime = video.duration - 0.5;
        }
        video.play();
      }
      goLiveBtn.style.display = 'none';
      progressBar.value = 100;
      progressBar.style.background = 'var(--accent-blue)';
      timeDisplay.innerText = "LIVE";
      showToast("Live Stream Synced");
    };

    lockBtn.onclick = (e) => {
      e.stopPropagation();
      isScreenLocked = true;
      overlay.classList.remove('show');
      unlockBtn.style.display = 'flex';
    };

    unlockBtn.onclick = (e) => {
      e.stopPropagation();
      isScreenLocked = false;
      unlockBtn.style.display = 'none';
      showControls();
    };

    backBtn.onclick = (e) => { e.stopPropagation(); window.history.back(); };

    fullscreenToggleBtn.onclick = async (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        try {
          await playerContainer.requestFullscreen();
          if (screen.orientation && screen.orientation.lock) {
            await screen.orientation.lock('landscape').catch(() => {});
          }
        } catch (err) {}
      } else {
        try {
          if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
          }
        } catch (err) {}
        if (document.exitFullscreen) {
          await document.exitFullscreen().catch(() => {});
        }
        document.body.classList.remove('landscape-mode');
      }
    };

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        try { if (screen.orientation?.unlock) screen.orientation.unlock(); } catch(e){}
        if (window.innerWidth < window.innerHeight) {
          document.body.classList.remove('landscape-mode');
        }
      }
    });

    // UNIFIED SINGLE-STAGED PINCH TO ZOOM GESTURE
    let initialPinchDist = 0;
    let isPinching = false;

    playerContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        isPinching = true;
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    }, { passive: true });

    playerContainer.addEventListener('touchmove', (e) => {
      if (isPinching && e.touches.length === 2) {
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const diff = currentDist - initialPinchDist;

        if (diff > 30) {
          if (!isFillScreen) {
            applyZoomState(true);
            initialPinchDist = currentDist;
          }
        } else if (diff < -30) {
          if (isFillScreen) {
            applyZoomState(false);
            initialPinchDist = currentDist;
          }
        }
      }
    }, { passive: true });

    playerContainer.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) {
        isPinching = false;
      }
    });

    const checkOrientation = () => {
      if (window.innerWidth > window.innerHeight) {
        document.body.classList.add('landscape-mode');
      } else {
        document.body.classList.remove('landscape-mode');
        watchNextOverlay.classList.remove('show');
      }
    };
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 200));
    checkOrientation();

    document.getElementById('openWatchNextBtn').onclick = (e) => {
      e.stopPropagation();
      watchNextOverlay.classList.add('show');
    };
    document.getElementById('closeWatchNextBtn').onclick = () => watchNextOverlay.classList.remove('show');

    // Swipe-Down To Dismiss Watch Next
    let touchStartY = 0;
    let touchCurrentY = 0;

    watchNextOverlay.addEventListener('touchstart', (e) => {
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    watchNextOverlay.addEventListener('touchmove', (e) => {
      touchCurrentY = e.touches[0].clientY;
      let diffY = touchCurrentY - touchStartY;
      if (diffY > 0) {
        watchNextOverlay.style.transform = `translateY(${diffY}px)`;
        watchNextOverlay.style.transition = 'none';
      }
    }, { passive: true });

    watchNextOverlay.addEventListener('touchend', () => {
      let diffY = touchCurrentY - touchStartY;
      watchNextOverlay.style.transition = 'transform 0.3s ease';
      if (diffY > 65) {
        watchNextOverlay.classList.remove('show');
        watchNextOverlay.style.transform = '';
      } else {
        watchNextOverlay.style.transform = 'translateY(0)';
      }
      touchStartY = 0;
      touchCurrentY = 0;
    });

    showControls();
  }

  // Seamless In-Place Channel Switch
  window.switchChannelInPlace = function(newId) {
    destroyActivePlayers();
    document.getElementById('watchNextOverlay').classList.remove('show');
    window.history.pushState({}, '', `1.html?watch=${newId}`);
    initApp(newId);
  };

  function getPartnerSectionTitle(partnerRaw) {
    if (!partnerRaw) return "More Channels";
    const lower = partnerRaw.toLowerCase();
    if (lower.includes("sony")) return "More by Sony";
    if (lower.includes("disney")) return "More from Disney";
    if (lower.includes("star")) return "More by Star";
    return `More by ${partnerRaw}`;
  }

  function listenToAllChannels(excludeId) {
    if (collectionUnsub) collectionUnsub();

    const recGrid = document.getElementById('recommendationsGrid');
    const partnerGrid = document.getElementById('partnerGrid');
    const watchNextCards = document.getElementById('watchNextCards');
    const sec2Heading = document.getElementById('sec2Heading');

    collectionUnsub = onSnapshot(collection(channelDb, "Live TV"), (snap) => {
      let allChannels = [];
      snap.forEach(d => { if(d.id !== excludeId) allChannels.push({ id: d.id, ...d.data() }); });

      const targetGenre = (currentChannel?.Genres || '').toLowerCase();
      let recommended = allChannels.filter(c => targetGenre && (c.Genres || '').toLowerCase().includes(targetGenre));
      if (recommended.length === 0) recommended = allChannels;

      const targetPartner = (currentChannel?.Partner || '').toLowerCase();
      let partnerChannels = allChannels.filter(c => targetPartner && (c.Partner || '').toLowerCase().includes(targetPartner));
      if (partnerChannels.length === 0) partnerChannels = allChannels;

      sec2Heading.innerText = getPartnerSectionTitle(currentChannel?.Partner);

      const renderPortraitCard = (c) => `
        <div onclick="window.switchChannelInPlace('${c.id}')" class="card-item">
          <img src="${safeUrl(c["Logo.png"] || c.Logo || '')}" class="card-thumb" alt="${c.Name}">
          <div class="card-name">${c.Name || 'Live TV'}</div>
        </div>
      `;

      recGrid.innerHTML = recommended.map(renderPortraitCard).join('');
      partnerGrid.innerHTML = partnerChannels.map(renderPortraitCard).join('');

      watchNextCards.innerHTML = allChannels.map(c => `
        <div onclick="window.switchChannelInPlace('${c.id}')" class="watch-card">
          <div class="watch-card-thumb-wrap">
            <img class="banner-img" src="${safeUrl(c.imageUrl || c.Banner || c["Logo.png"] || c.Logo || '')}" alt="${c.Name}">
            <img class="watch-card-logo-top-right" src="${safeUrl(c["Logo.png"] || c.Logo || '')}" alt="Logo">
            <div class="play-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          </div>
          <div class="watch-card-name">${c.Name || 'TV Channel'}</div>
          <div class="watch-card-sub">${c.Genres || c.Language || 'Live Stream'}</div>
        </div>
      `).join('');
    });
  }
</script>
