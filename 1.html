<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Disney+ Hotstar OTT Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-dark: #000000;
      --accent-blue: #00d2ff;
      --text-main: #ffffff;
      --text-muted: #9aa0a6;
      --border-color: #262933;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; user-select: none; }

    /* Top Nav (Portrait Only) */
    .top-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; background: #0c0d12; border-bottom: 1px solid var(--border-color);
    }
    .top-nav .brand { font-size: 17px; font-weight: 800; color: #fff; }
    .top-nav .brand span { color: var(--accent-blue); }
    .user-pill { font-size: 11px; background: rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 20px; }

    .main-wrapper { max-width: 1100px; margin: 0 auto; padding-bottom: 30px; }

    /* Video Player Box */
    .player-container {
      position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden;
    }

    /* Video Aspect Modes (Hotstar Fill vs Fit) */
    video {
      width: 100%; height: 100%; border: none; object-fit: contain;
      transition: object-fit 0.3s ease, filter 0.2s ease;
    }
    video.fill-screen { object-fit: cover; }
    iframe { width: 100%; height: 100%; border: none; }

    /* Edge-to-Edge Mobile Landscape Fix */
    body.landscape-mode .top-nav, body.landscape-mode .details-wrapper { display: none !important; }
    body.landscape-mode .player-container {
      position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 99999; aspect-ratio: auto;
    }

    /* Toast Alert for Zoom / Actions */
    .toast-alert {
      position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 8px 18px; border-radius: 20px; font-size: 12px; font-weight: 600;
      z-index: 40; pointer-events: none; opacity: 0; transition: opacity 0.3s;
    }
    .toast-alert.show { opacity: 1; }

    /* Controls Overlay (Screenshot 2) */
    .controls-overlay {
      position: absolute; inset: 0; z-index: 20;
      background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.85) 100%);
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 14px 18px; opacity: 0; transition: opacity 0.25s ease; pointer-events: none;
    }
    .controls-overlay.show { opacity: 1; pointer-events: auto; }

    /* Top Bar Controls */
    .ctrl-top { display: flex; align-items: center; justify-content: space-between; }
    .ctrl-top-left { display: flex; align-items: center; gap: 12px; }
    .ctrl-title { font-size: 15px; font-weight: 600; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctrl-top-right { display: flex; align-items: center; gap: 16px; }

    .icon-btn { background: none; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }

    /* Left Side Brightness Control (Screenshot 2 Left Bar) */
    .brightness-slider-wrap {
      position: absolute; left: 20px; top: 32%; display: flex; flex-direction: column; align-items: center; gap: 8px; z-index: 22;
    }
    .brightness-icon { font-size: 14px; opacity: 0.8; }
    .brightness-slider {
      -webkit-appearance: none; appearance: none; width: 3px; height: 100px;
      background: rgba(255, 255, 255, 0.3); outline: none; border-radius: 2px;
      writing-mode: bt-lr; -webkit-appearance: slider-vertical;
    }

    /* Center Controls */
    .ctrl-center {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      display: flex; align-items: center; gap: 45px;
    }
    .ctrl-center .icon-btn svg { width: 32px; height: 32px; }
    .btn-main-play svg { width: 42px; height: 42px; }

    /* Bottom Timeline & Controls Bar */
    .ctrl-bottom { display: flex; flex-direction: column; gap: 10px; width: 100%; }

    .timeline-row { display: flex; align-items: center; gap: 12px; }
    .progress-bar {
      width: 100%; height: 3px; -webkit-appearance: none; appearance: none;
      background: rgba(255, 255, 255, 0.3); outline: none; cursor: pointer; border-radius: 3px;
    }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 6px rgba(255,255,255,0.8); cursor: pointer;
    }
    .time-val { font-size: 12px; font-weight: 600; color: #d0d0d0; white-space: nowrap; }

    .action-bar-row { display: flex; align-items: center; justify-content: space-between; }
    .action-btn {
      background: none; border: none; color: #fff; font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 6px; cursor: pointer; opacity: 0.9;
    }
    .action-btn:hover { opacity: 1; color: var(--accent-blue); }

    /* Watch Next Overlay Tray (Screenshot 1) */
    .watch-next-overlay {
      position: absolute; inset: 0; z-index: 35; background: rgba(0, 0, 0, 0.95);
      display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    .watch-next-overlay.show { opacity: 1; pointer-events: auto; }

    .watch-next-header { display: flex; align-items: center; justify-content: space-between; }
    .watch-next-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }

    .watch-next-cards-row {
      display: flex; gap: 14px; overflow-x: auto; padding: 10px 0; scrollbar-width: none;
    }
    .watch-next-cards-row::-webkit-scrollbar { display: none; }

    .watch-card {
      min-width: 180px; width: 180px; text-decoration: none; color: #fff; cursor: pointer;
    }
    .watch-card-thumb-wrap {
      position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden;
      background: #111; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1);
    }
    .watch-card-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .play-badge {
      position: absolute; bottom: 8px; left: 8px; width: 22px; height: 22px;
      background: rgba(0,0,0,0.6); border-radius: 50%; display: flex; align-items: center;
      justify-content: center; border: 1px solid rgba(255,255,255,0.4);
    }
    .play-badge svg { width: 10px; height: 10px; fill: #fff; margin-left: 2px; }

    .watch-card-name { font-size: 13px; font-weight: 600; line-clamp: 1; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
    .watch-card-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    /* Access Denied Card Overlay */
    .access-denied-box {
      position: absolute; inset: 0; z-index: 30; background: rgba(0, 0, 0, 0.95);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }
    .denied-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .denied-desc { font-size: 13px; color: var(--text-muted); max-width: 400px; margin-bottom: 18px; }
    .btn-login { background: var(--accent-blue); color: #000; font-weight: 700; padding: 10px 22px; border-radius: 20px; text-decoration: none; }

    /* Lock Screen Button */
    .lock-overlay-btn {
      position: absolute; top: 15px; left: 15px; z-index: 25; background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.3); padding: 8px 14px; border-radius: 20px;
      color: #fff; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }

    /* Portrait Details (Photo 4) */
    .details-wrapper { padding: 16px; }
    .ch-title-head { font-size: 20px; font-weight: 800; color: #fff; }
    .ch-lang-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .section-head { font-size: 16px; font-weight: 700; margin: 22px 0 12px; color: #fff; }
    .channel-scroll-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
    .channel-scroll-row::-webkit-scrollbar { display: none; }

    .card-item {
      min-width: 140px; width: 140px; background: #131722; border: 1px solid var(--border-color);
      border-radius: 10px; padding: 10px; text-decoration: none; color: #fff; display: flex;
      flex-direction: column; align-items: center; text-align: center;
    }
    .card-thumb { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #000; border-radius: 6px; margin-bottom: 8px; }
    .card-name { font-size: 12px; font-weight: 700; }

    .loader-box { text-align: center; padding: 50px; color: var(--accent-blue); font-weight: 600; }
  </style>
</head>
<body>

<div class="top-nav">
  <div class="brand">⚡ Hotstar<span>TV</span></div>
  <div class="user-pill" id="userPill">Checking User...</div>
</div>

<div id="loader" class="loader-box">Connecting Stream...</div>

<div id="appContent" style="display: none;">
  <div class="main-wrapper">
    
    <!-- Player Container -->
    <div class="player-container" id="playerContainer">
      
      <!-- Toast Alert -->
      <div class="toast-alert" id="toastAlert">Zoomed to Fill Screen</div>

      <!-- Access Denied Overlay -->
      <div class="access-denied-box" id="accessDeniedBox" style="display: none;">
        <div style="font-size:36px; margin-bottom:10px;">🔒</div>
        <div class="denied-title" id="deniedTitle">Access Restricted</div>
        <div class="denied-desc" id="deniedDesc">Please log in to watch.</div>
        <a class="btn-login" id="deniedBtn" href="1 (3).html">Sign In</a>
      </div>

      <!-- Video Element -->
      <video id="videoPlayer" playsinline crossorigin="anonymous"></video>
      <iframe id="iframePlayer" style="display: none;" allowfullscreen allow="autoplay"></iframe>

      <!-- Unlock Button when Locked -->
      <div class="lock-overlay-btn" id="unlockBtn" style="display: none;">
        🔓 Tap to Unlock Controls
      </div>

      <!-- Disney+ Hotstar Overlay Controls (Screenshot 2) -->
      <div class="controls-overlay" id="controlsOverlay">
        
        <!-- Top Bar -->
        <div class="ctrl-top">
          <div class="ctrl-top-left">
            <button class="icon-btn" id="backBtn" title="Back">
              <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div class="ctrl-title" id="overlayChTitle">Channel Name</div>
          </div>
          <div class="ctrl-top-right">
            <button class="icon-btn" id="lockBtn" title="Lock Screen">
              <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </button>
            <button class="icon-btn" id="settingsBtn" title="Settings">
              <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>
            <!-- Hotstar Scale / Fill Screen Toggle Button -->
            <button class="icon-btn" id="aspectBtn" title="Fill Screen Mode">
              <svg viewBox="0 0 24 24"><path d="M15 3l2.3 2.3-2.89 2.87 1.42 1.42L18.7 6.7 21 9V3h-6zM3 9l2.3-2.3 2.87 2.89 1.42-1.42L6.7 5.3 9 3H3v6zm6 12l-2.3-2.3 2.89-2.87-1.42-1.42L5.3 17.3 3 15v6h6zm12-6l-2.3 2.3-2.87-2.89-1.42 1.42 2.89 2.87L15 21h6v-6z"/></svg>
            </button>
          </div>
        </div>

        <!-- Left Vertical Brightness Slider -->
        <div class="brightness-slider-wrap">
          <span class="brightness-icon">☀️</span>
          <input type="range" id="brightnessSlider" class="brightness-slider" min="0.2" max="1.5" step="0.05" value="1">
        </div>

        <!-- Center Controls -->
        <div class="ctrl-center">
          <button class="icon-btn" id="rewindBtn">
            <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
          </button>
          
          <button class="icon-btn btn-main-play" id="playBtn">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>

          <button class="icon-btn" id="forwardBtn">
            <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
          </button>
        </div>

        <!-- Bottom Timeline & Action Bar -->
        <div class="ctrl-bottom">
          <div class="timeline-row">
            <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
            <span class="time-val" id="timeDisplay">00:00:00</span>
          </div>
          
          <div class="action-bar-row">
            <button class="action-btn" id="openWatchNextBtn">
              🧭 Watch Next
            </button>
            <div style="display:flex; gap:16px;">
              <button class="action-btn" id="speedBtn">⏱ Speed 1x</button>
              <button class="action-btn" id="rateBtn">♡ Rate</button>
            </div>
          </div>
        </div>

      </div>

      <!-- Watch Next Tray Overlay (Screenshot 1) -->
      <div class="watch-next-overlay" id="watchNextOverlay">
        <div class="watch-next-header">
          <div class="watch-next-title">Watch Next ˅</div>
          <button class="icon-btn" id="closeWatchNextBtn" style="font-size:22px;">✕</button>
        </div>
        <div class="watch-next-cards-row" id="watchNextCards"></div>
      </div>

    </div>

    <!-- Portrait Details (Screenshot 4) -->
    <div class="details-wrapper">
      <div class="ch-title-head" id="chTitle">Live Channel</div>
      <div class="ch-lang-sub" id="chLangSub">हिंदी • Live News</div>

      <div class="section-head">Live News</div>
      <div class="channel-scroll-row" id="newsGrid"></div>

      <div class="section-head">Live Business News</div>
      <div class="channel-scroll-row" id="businessGrid"></div>
    </div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. Channel DB
  const channelConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728",
    storageBucket: "internal-systems-46728.firebasestorage.app",
    messagingSenderId: "172177452674",
    appId: "1:172177452674:web:155a2417da5531dd7ece9b",
    measurementId: "G-Y87B8VRQ1N"
  };
  const channelApp = initializeApp(channelConfig, "channelApp");
  const channelDb = getFirestore(channelApp);

  // 2. Auth DB
  const authConfig = {
    apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
    authDomain: "question-metabase.firebaseapp.com",
    databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "question-metabase",
    storageBucket: "question-metabase.firebasestorage.app",
    messagingSenderId: "770698198753",
    appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
    measurementId: "G-6ZP1FPMKSJ"
  };
  const authApp = initializeApp(authConfig, "authApp");
  const authDb = getFirestore(authApp);

  const urlParams = new URLSearchParams(window.location.search);
  const currentDocId = urlParams.get('watch');

  let hlsInstance = null;
  let hideControlsTimer = null;
  let isScreenLocked = false;
  let currentSpeedIndex = 0;
  const speeds = [1, 1.25, 1.5, 2, 0.5];

  if (!currentDocId) {
    document.getElementById('loader').innerText = "URL Parameter Missing (?watch=DOCUMENT_ID)";
  } else {
    initApp(currentDocId);
  }

  async function initApp(docId) {
    const loader = document.getElementById('loader');
    const userPill = document.getElementById('userPill');

    let activeUser = null;
    try { activeUser = JSON.parse(localStorage.getItem('active_user')); } catch(e){}

    let channel = null;
    try {
      const snap = await getDoc(doc(channelDb, "Live TV", docId));
      if (!snap.exists()) {
        loader.innerText = `Channel '${docId}' not found.`;
        return;
      }
      channel = snap.data();
    } catch (e) {
      loader.innerText = "Error loading channel: " + e.message;
      return;
    }

    document.getElementById('chTitle').innerText = channel.Name || "Live Channel";
    document.getElementById('overlayChTitle').innerText = channel.Name || "Live Channel";
    document.getElementById('chLangSub').innerText = `${channel.Language || 'Hindi'} • ${channel.Genres || 'Live News'}`;

    loader.style.display = 'none';
    document.getElementById('appContent').style.display = 'block';

    if (!activeUser || (!activeUser.Email && !activeUser.Lotus)) {
      userPill.innerText = "Not Logged In";
      showDenied("Login Required", "Please sign in to watch this channel.", "Sign In", `1 (3).html?continue=${encodeURIComponent(window.location.href)}`);
      loadCategoryRows(docId);
      return;
    }

    userPill.innerText = activeUser["First Name"] ? `👤 ${activeUser["First Name"]}` : `👤 ${activeUser.Email}`;

    let userPlans = [];
    try {
      const q = activeUser.Lotus ? query(collection(authDb, "UARM"), where("Lotus", "==", activeUser.Lotus)) : query(collection(authDb, "UARM"), where("Email", "==", activeUser.Email));
      const uarmSnap = await getDocs(q);
      if (!uarmSnap.empty) userPlans = uarmSnap.docs[0].data().Plans || [];
    } catch (e) { userPlans = activeUser.Plans || []; }

    if (!Array.isArray(userPlans) || userPlans.length === 0) {
      showDenied("No Subscription Plan", "Your account has no active plan. Please subscribe.", "View Plans", "1 (3).html");
      loadCategoryRows(docId);
      return;
    }

    const channelPartner = (channel.Partner || "").trim().toLowerCase();
    let isAuthorized = false;

    for (const planId of userPlans) {
      try {
        const planSnap = await getDoc(doc(authDb, "Plans & Subscriptions", planId));
        if (planSnap.exists()) {
          const studios = planSnap.data().Studio || [];
          if (studios.some(s => s.toLowerCase() === channelPartner)) {
            isAuthorized = true;
            break;
          }
        }
      } catch (err) {}
    }

    if (isAuthorized) {
      initStreamPlayer(channel.Stream);
    } else {
      showDenied("Access Restricted", `Your subscription plan does not include content from '${channel.Partner || 'this studio'}'.`, "Upgrade Plan", "1 (3).html");
    }

    loadCategoryRows(docId);
  }

  function showDenied(title, desc, btnTxt, btnUrl) {
    const box = document.getElementById('accessDeniedBox');
    document.getElementById('deniedTitle').innerText = title;
    document.getElementById('deniedDesc').innerText = desc;
    const btn = document.getElementById('deniedBtn');
    btn.innerText = btnTxt;
    btn.href = btnUrl;
    box.style.display = 'flex';

    document.getElementById('controlsOverlay').style.display = 'none';
    document.getElementById('videoPlayer').style.display = 'none';
  }

  function initStreamPlayer(streamUrl) {
    const video = document.getElementById('videoPlayer');
    const iframe = document.getElementById('iframePlayer');
    const overlay = document.getElementById('controlsOverlay');

    if (!streamUrl) return;

    if (streamUrl.includes('youtube.com') || streamUrl.includes('youtu.be')) {
      let embedUrl = streamUrl;
      if (streamUrl.includes('watch?v=')) embedUrl = `https://www.youtube.com/embed/${streamUrl.split('v=')[1].split('&')[0]}?autoplay=1`;
      else if (streamUrl.includes('youtu.be/')) embedUrl = `https://www.youtube.com/embed/${streamUrl.split('youtu.be/')[1].split('?')[0]}?autoplay=1`;
      
      video.style.display = 'none';
      overlay.style.display = 'none';
      iframe.style.display = 'block';
      iframe.src = embedUrl;
    } else if (streamUrl.includes('.m3u8') || streamUrl.includes('hls')) {
      iframe.style.display = 'none';
      video.style.display = 'block';

      if (Hls.isSupported()) {
        hlsInstance = new Hls();
        hlsInstance.loadSource(streamUrl);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play().catch(() => {});
      }
      setupInteraction(video);
    } else {
      video.style.display = 'none';
      overlay.style.display = 'none';
      iframe.style.display = 'block';
      iframe.src = streamUrl;
    }
  }

  function showToast(msg) {
    const toast = document.getElementById('toastAlert');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function setupInteraction(video) {
    const overlay = document.getElementById('controlsOverlay');
    const playerContainer = document.getElementById('playerContainer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const lockBtn = document.getElementById('lockBtn');
    const unlockBtn = document.getElementById('unlockBtn');
    const backBtn = document.getElementById('backBtn');
    const aspectBtn = document.getElementById('aspectBtn');
    const progressBar = document.getElementById('progressBar');
    const timeDisplay = document.getElementById('timeDisplay');
    const brightnessSlider = document.getElementById('brightnessSlider');
    const speedBtn = document.getElementById('speedBtn');
    const watchNextOverlay = document.getElementById('watchNextOverlay');

    const showControls = () => {
      if (isScreenLocked) return;
      overlay.classList.add('show');
      clearTimeout(hideControlsTimer);
      hideControlsTimer = setTimeout(() => {
        overlay.classList.remove('show');
      }, 3500);
    };

    playerContainer.onclick = (e) => {
      e.stopPropagation();
      showControls();
    };

    // Play/Pause
    const togglePlay = (e) => {
      e?.stopPropagation();
      if (video.paused) video.play(); else video.pause();
      showControls();
    };

    playBtn.onclick = togglePlay;
    video.onplay = () => { playIcon.style.display = 'none'; pauseIcon.style.display = 'block'; };
    video.onpause = () => { playIcon.style.display = 'block'; pauseIcon.style.display = 'none'; };

    // Rewind / Forward
    rewindBtn.onclick = (e) => { e.stopPropagation(); video.currentTime -= 10; showControls(); };
    forwardBtn.onclick = (e) => { e.stopPropagation(); video.currentTime += 10; showControls(); };

    // Progress Bar & Time
    video.ontimeupdate = () => {
      if (video.duration) {
        progressBar.value = (video.currentTime / video.duration) * 100;
        const current = new Date(video.currentTime * 1000).toISOString().substr(11, 8);
        timeDisplay.innerText = current;
      }
    };
    progressBar.oninput = (e) => {
      e.stopPropagation();
      if (video.duration) video.currentTime = (progressBar.value / 100) * video.duration;
    };

    // Brightness Control
    brightnessSlider.oninput = (e) => {
      e.stopPropagation();
      video.style.filter = `brightness(${brightnessSlider.value})`;
    };

    // Speed Controller
    speedBtn.onclick = (e) => {
      e.stopPropagation();
      currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
      const speed = speeds[currentSpeedIndex];
      video.playbackRate = speed;
      speedBtn.innerText = `⏱ Speed ${speed}x`;
      showToast(`Playback Speed: ${speed}x`);
    };

    // Lock Screen
    lockBtn.onclick = (e) => {
      e.stopPropagation();
      isScreenLocked = true;
      overlay.classList.remove('show');
      unlockBtn.style.display = 'flex';
    };

    unlockBtn.onclick = (e) => {
      e.stopPropagation();
      isScreenLocked = false;
      unlockBtn.style.display = 'none';
      showControls();
    };

    backBtn.onclick = (e) => { e.stopPropagation(); window.history.back(); };

    // Aspect Scale Toggle (Fit vs Fill)
    const toggleAspect = (e) => {
      e?.stopPropagation();
      if (video.classList.contains('fill-screen')) {
        video.classList.remove('fill-screen');
        showToast("Fit to Screen");
      } else {
        video.classList.add('fill-screen');
        showToast("Zoomed to Fill Screen");
      }
    };
    aspectBtn.onclick = toggleAspect;

    // Disney+ Hotstar Touch Pinch-to-Zoom Gesture Detection
    let initialPinchDist = 0;
    playerContainer.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        initialPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
      }
    });

    playerContainer.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2 && initialPinchDist > 0) {
        const dist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        if (dist - initialPinchDist > 35) {
          if (!video.classList.contains('fill-screen')) {
            video.classList.add('fill-screen');
            showToast("Zoomed to Fill Screen");
          }
        } else if (initialPinchDist - dist > 35) {
          if (video.classList.contains('fill-screen')) {
            video.classList.remove('fill-screen');
            showToast("Fit to Screen");
          }
        }
      }
    });

    // Orientation Logic for Mobile Auto-Landscape Fullscreen
    const checkOrientation = () => {
      if (window.innerWidth > window.innerHeight) {
        document.body.classList.add('landscape-mode');
      } else {
        document.body.classList.remove('landscape-mode');
      }
    };
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 200));
    checkOrientation();

    // Watch Next Overlay Actions
    document.getElementById('openWatchNextBtn').onclick = (e) => {
      e.stopPropagation();
      watchNextOverlay.classList.add('show');
    };
    document.getElementById('closeWatchNextBtn').onclick = () => watchNextOverlay.classList.remove('show');

    showControls();
  }

  // Load Categories & Watch Next Tray
  async function loadCategoryRows(excludeId) {
    const newsGrid = document.getElementById('newsGrid');
    const businessGrid = document.getElementById('businessGrid');
    const watchNextCards = document.getElementById('watchNextCards');

    try {
      const snap = await getDocs(collection(channelDb, "Live TV"));
      let channels = [];
      snap.forEach(d => { if(d.id !== excludeId) channels.push({ id: d.id, ...d.data() }); });

      const renderCard = (c) => `
        <a href="1.html?watch=${c.id}" class="card-item">
          <img src="${c["Logo.png"] || c.Logo || ''}" class="card-thumb" alt="${c.Name}">
          <div class="card-name">${c.Name || 'Live TV'}</div>
        </a>
      `;

      newsGrid.innerHTML = channels.map(renderCard).join('');
      businessGrid.innerHTML = channels.map(renderCard).join('');

      // Populate Watch Next Tray Cards (Screenshot 1)
      watchNextCards.innerHTML = channels.map(c => `
        <a href="1.html?watch=${c.id}" class="watch-card">
          <div class="watch-card-thumb-wrap">
            <img src="${c["Logo.png"] || c.Logo || ''}" alt="${c.Name}">
            <div class="play-badge"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          </div>
          <div class="watch-card-name">${c.Name || 'TV Channel'}</div>
          <div class="watch-card-sub">${c.Genres || 'Kids · Animation'}</div>
        </a>
      `).join('');

    } catch (e) {
      newsGrid.innerHTML = `<p style="font-size:12px; color:var(--text-muted);">Failed to load.</p>`;
    }
  }
</script>
