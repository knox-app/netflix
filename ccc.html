<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hotstar Video Player</title>
  
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>

  <style>
    :root {
      --bg-dark: #0f1015;
      --player-bg: #000000;
      --accent-blue: #0072ef;
      --live-red: #e50914;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --border-color: #1e2230;
      --card-bg: #161822;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent !important;
      outline: none !important;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    .main-wrapper { max-width: 1200px; margin: 0 auto; }

    .player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      overflow: hidden;
    }

    body.landscape-mode .details-wrapper { display: none !important; }
    body.landscape-mode .player-container,
    .player-container:fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw !important;
      height: 100vh !important;
      aspect-ratio: auto;
      z-index: 99999;
    }

    video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 1;
      background: #000;
    }

    #ytFrameHost {
      position: absolute;
      inset: 0;
      display: none;
      overflow: hidden;
      pointer-events: none;
      z-index: 2;
      background: #000;
    }
    #ytFrameHost iframe {
      width: calc(100% + 140px) !important;
      height: calc(100% + 200px) !important;
      position: absolute !important;
      top: -100px !important;
      left: -70px !important;
      pointer-events: none;
    }

    #jwHost {
      position: absolute;
      inset: 0;
      display: none;
      width: 100%;
      height: 100%;
      z-index: 2;
    }

    iframe#iframePlayer { width: 100%; height: 100%; border: none; z-index: 2; }

    .toast-alert {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 20, 26, 0.95);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 7px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      z-index: 45;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .toast-alert.show { opacity: 1; }

    .controls-overlay {
      position: absolute;
      inset: 0;
      z-index: 25;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, transparent 28%, transparent 68%, rgba(0,0,0,0.92) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      pointer-events: none;
    }
    .controls-overlay.show { opacity: 1; pointer-events: auto; }

    .ctrl-top { display: flex; align-items: center; justify-content: space-between; }
    .ctrl-top-left { display: flex; align-items: center; gap: 12px; max-width: 65%; }
    .ctrl-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctrl-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .ctrl-top-right { display: flex; align-items: center; gap: 16px; margin-left: auto; }

    body:not(.landscape-mode) .ctrl-top-left { display: none !important; }

    .icon-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
    }
    .icon-btn:active { background: rgba(255,255,255,0.15); transform: scale(0.92); }
    .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }

    .ctrl-center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 48px;
    }
    .ctrl-center .icon-btn svg { width: 34px; height: 34px; }
    .btn-main-play svg { width: 44px; height: 44px; fill: #ffffff; }

    .ctrl-bottom { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .timeline-container { position: relative; display: flex; align-items: center; width: 100%; height: 20px; }
    .timeline-track-wrap { position: relative; width: 100%; height: 3.5px; background: rgba(255, 255, 255, 0.25); border-radius: 2px; }
    .timeline-fill { position: absolute; top: 0; left: 0; height: 100%; background: var(--accent-blue); border-radius: 2px; width: 100%; }
    .progress-bar-input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5; }
    .timeline-thumb-indicator { position: absolute; top: 50%; left: 100%; transform: translate(-50%, -50%); width: 12px; height: 12px; background: #ffffff; border-radius: 50%; pointer-events: none; }
    .time-val { font-size: 12px; font-weight: 700; margin-left: 14px; font-variant-numeric: tabular-nums; }

    /* Cast Devices Modal */
    .cast-modal {
      position: absolute;
      inset: 0;
      z-index: 60;
      background: rgba(0, 0, 0, 0.94);
      backdrop-filter: blur(16px);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .cast-modal.active { display: flex; }
    .cast-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 22px;
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }
    .cast-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 12px; }
    .cast-header h3 { font-size: 16px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 8px; }
    .cast-device-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
    .device-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      cursor: pointer;
    }
    .device-item:hover, .device-item:active { background: rgba(0,114,239,0.2); border-color: var(--accent-blue); }
    .device-item svg { width: 24px; height: 24px; fill: var(--accent-blue); flex-shrink: 0; }

    /* Details Section */
    .details-wrapper { padding: 18px 16px; }
    .ch-title-head { font-size: 20px; font-weight: 800; }
    .ch-lang-sub { font-size: 13px; color: var(--text-muted); margin-top: 6px; }
    .meta-actions-bar { display: flex; gap: 32px; margin: 18px 0 22px; }
    .meta-action-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .meta-action-item svg { width: 22px; height: 22px; fill: currentColor; }

    .loader-box { text-align: center; padding: 60px; color: var(--accent-blue); font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>

<div id="loader" class="loader-box">Connecting stream & account sync...</div>

<div id="appContent" style="display: none;">
  <div class="main-wrapper">
    <div class="player-container" id="playerContainer">
      <div class="toast-alert" id="toastAlert">Pinch to Zoom</div>

      <video id="nativeVideoPlayer" playsinline crossorigin="anonymous"></video>
      <div id="ytFrameHost"></div>
      <div id="jwHost"><div id="jwActualContainer"></div></div>
      <iframe id="iframePlayer" style="display: none;" allowfullscreen allow="autoplay"></iframe>

      <!-- Controls Overlay -->
      <div class="controls-overlay" id="controlsOverlay">
        <div class="ctrl-top">
          <div class="ctrl-top-left">
            <button class="icon-btn" id="backBtn"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
            <div>
              <div class="ctrl-title" id="overlayTitle">Title</div>
              <div class="ctrl-subtitle" id="overlaySubtitle">Live Stream</div>
            </div>
          </div>
          <div class="ctrl-top-right">
            <button class="icon-btn" id="castBtn" title="Cast Screen">
              <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            </button>
            <button class="icon-btn" id="fullscreenToggleBtn">
              <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
            </button>
          </div>
        </div>

        <div class="ctrl-center">
          <button class="icon-btn" id="rewindBtn"><svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg></button>
          <button class="icon-btn btn-main-play" id="playBtn">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
          </button>
          <button class="icon-btn" id="forwardBtn"><svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg></button>
        </div>

        <div class="ctrl-bottom">
          <div class="timeline-container">
            <div class="timeline-track-wrap"><div class="timeline-fill" id="timelineFill"></div><div class="timeline-thumb-indicator" id="thumbIndicator"></div></div>
            <input type="range" id="progressBarInput" class="progress-bar-input" value="100" min="0" max="100" step="0.1">
            <span class="time-val" id="timeDisplay">LIVE</span>
          </div>
        </div>
      </div>

      <!-- Cast Modal -->
      <div class="cast-modal" id="castModal">
        <div class="cast-card">
          <div class="cast-header">
            <h3><svg style="width:20px;height:20px;fill:var(--accent-blue);" viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg> Cast Screen</h3>
            <button class="icon-btn" id="closeCastBtn">✕</button>
          </div>
          <div class="cast-device-list" id="castDeviceList"></div>
        </div>
      </div>
    </div>

    <!-- Details -->
    <div class="details-wrapper">
      <div class="ch-title-head" id="chTitle">Title</div>
      <div class="ch-lang-sub" id="chLangSub">Video</div>
      <div class="meta-actions-bar">
        <div class="meta-action-item" id="actionCastBottom">
          <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
          <span>Screen Cast</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getDatabase, ref, set, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const channelConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728"
  };
  const channelApp = initializeApp(channelConfig, "channelApp");
  const channelDb = getFirestore(channelApp);

  const authConfig = {
    apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
    authDomain: "question-metabase.firebaseapp.com",
    databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "question-metabase"
  };
  const authApp = initializeApp(authConfig, "authApp");
  const rtdb = getDatabase(authApp);

  let currentUser = null;
  try {
    const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
    currentUser = stored ? JSON.parse(stored) : null;
  } catch(e) { currentUser = null; }

  // Unified canonical Account Key
  function getCanonicalUserKey() {
    if (!currentUser) return "shared_account";
    let k = currentUser["Lotus"] || currentUser["lotus"] || currentUser["Email"] || currentUser["email"] || currentUser["id"];
    return String(k).trim().toLowerCase().replace(/[^a-zA-Z0-9_-]/g, '_');
  }

  // Persistent Device ID
  let myDeviceId = localStorage.getItem('global_cast_device_id');
  if (!myDeviceId) {
    myDeviceId = 'dev_' + Math.random().toString(36).substring(2, 9);
    localStorage.setItem('global_cast_device_id', myDeviceId);
  }

  function getDeviceType() {
    const ua = navigator.userAgent;
    if (/SmartTV|Tizen|Web0S|BRAVIA|Android TV/i.test(ua)) return "Living Room TV";
    if (/iPad|Tablet/i.test(ua)) return "Tablet Screen";
    if (/iPhone/i.test(ua)) return "iPhone Player";
    if (/Android/i.test(ua)) return "Android Screen";
    return "Web Player";
  }

  const urlParams = new URLSearchParams(window.location.search);
  let currentDocId = urlParams.get('watch') || "LIVE_DEFAULT";
  let isLiveTV = true;

  function showToast(msg) {
    const toast = document.getElementById('toastAlert');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  /* Reliable 0-Latency Device Presence Registration */
  function startPresence(channelName) {
    const userKey = getCanonicalUserKey();
    const connectedRef = ref(rtdb, ".info/connected");
    const deviceRef = ref(rtdb, `devices/${userKey}/${myDeviceId}`);

    onValue(connectedRef, (snap) => {
      if (snap.val() === true) {
        const payload = {
          id: myDeviceId,
          name: getDeviceType(),
          online: true,
          watchId: currentDocId,
          title: channelName || "Live TV",
          contentType: isLiveTV ? 'live' : 'movie',
          lastSeen: Date.now()
        };

        set(deviceRef, payload);
        onDisconnect(deviceRef).remove();
      }
    });

    // Heartbeat every 15s
    setInterval(() => {
      set(ref(rtdb, `devices/${userKey}/${myDeviceId}/lastSeen`), Date.now());
    }, 15000);
  }

  /* 0-Latency Remote Command Dispatcher */
  function listenToRemoteCommands() {
    const userKey = getCanonicalUserKey();
    const cmdRef = ref(rtdb, `commands/${userKey}/${myDeviceId}`);

    onValue(cmdRef, (snap) => {
      const cmd = snap.val();
      if (!cmd || !cmd.action) return;

      const video = document.getElementById('nativeVideoPlayer');
      switch (cmd.action) {
        case 'PLAY':
          if (video) video.play();
          showToast("Play");
          break;
        case 'PAUSE':
          if (video) video.pause();
          showToast("Pause");
          break;
        case 'TOGGLE_PLAY':
          if (video) {
            video.paused ? video.play() : video.pause();
            showToast(video.paused ? "Paused" : "Playing");
          }
          break;
        case 'SEEK':
          if (video && cmd.seconds) {
            video.currentTime += cmd.seconds;
            showToast(`${cmd.seconds > 0 ? '+' : ''}${cmd.seconds}s`);
          }
          break;
        case 'VOLUME':
          if (video) {
            video.volume = Math.min(1, Math.max(0, video.volume + (cmd.delta || 0.1)));
            showToast(`Volume ${Math.round(video.volume * 100)}%`);
          }
          break;
        case 'MUTE':
          if (video) {
            video.muted = !video.muted;
            showToast(video.muted ? "Muted" : "Unmuted");
          }
          break;
        case 'CAST_LOAD':
          if (cmd.watchId) {
            currentDocId = cmd.watchId;
            startPlayback(currentDocId);
          }
          break;
      }
      set(cmdRef, null); // Clear immediately for single execution
    });
  }

  async function startPlayback(docId) {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('appContent').style.display = 'block';

    const video = document.getElementById('nativeVideoPlayer');
    try {
      const snap = await getDoc(doc(channelDb, "Live TV", docId));
      const data = snap.exists() ? snap.data() : { Stream: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', Name: 'Live Stream' };
      
      const title = data.Name || data.Title || "Live Stream";
      document.getElementById('overlayTitle').innerText = title;
      document.getElementById('chTitle').innerText = title;

      startPresence(title);
      listenToRemoteCommands();

      if (data.Stream.includes('.m3u8') && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(data.Stream);
        hls.attachMedia(video);
        video.play().catch(()=>{});
      } else {
        video.src = data.Stream;
        video.play().catch(()=>{});
      }
    } catch(e) {
      video.src = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';
      video.play().catch(()=>{});
    }
  }

  startPlayback(currentDocId);

  // Cast Device Discovery
  function openCastModal() {
    const modal = document.getElementById('castModal');
    const list = document.getElementById('castDeviceList');
    modal.classList.add('active');
    list.innerHTML = '<div style="color:var(--text-muted); font-size:13px; text-align:center;">Scanning for connected screens...</div>';

    const userKey = getCanonicalUserKey();
    const devRef = ref(rtdb, `devices/${userKey}`);

    onValue(devRef, (snap) => {
      const devices = snap.val() || {};
      const activeScreens = Object.values(devices).filter(d => d.id !== myDeviceId);

      if (activeScreens.length === 0) {
        list.innerHTML = '<div style="color:var(--text-muted); font-size:13px; text-align:center; padding:16px;">No other screens connected on this account.<br><br><span style="font-size:11px;">Open Remote or Player on your TV/Phone with this account.</span></div>';
        return;
      }

      list.innerHTML = activeScreens.map(d => `
        <div class="device-item" onclick="window.castToScreen('${d.id}', '${d.name.replace(/'/g, "\\'")}')">
          <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
          <div>
            <div style="font-size:14px; font-weight:700;">${d.name}</div>
            <div style="font-size:11px; color:var(--text-muted);">Ready to Cast</div>
          </div>
        </div>
      `).join('');
    });
  }

  window.castToScreen = function(targetId, targetName) {
    const userKey = getCanonicalUserKey();
    const cmdRef = ref(rtdb, `commands/${userKey}/${targetId}`);
    
    set(cmdRef, {
      action: 'CAST_LOAD',
      watchId: currentDocId,
      timestamp: Date.now()
    });

    document.getElementById('castModal').classList.remove('active');
    showToast(`Streaming to ${targetName}...`);
  };

  document.getElementById('castBtn').onclick = (e) => { e.stopPropagation(); openCastModal(); };
  document.getElementById('actionCastBottom').onclick = openCastModal;
  document.getElementById('closeCastBtn').onclick = () => document.getElementById('castModal').classList.remove('active');
  document.getElementById('playBtn').onclick = () => {
    const video = document.getElementById('nativeVideoPlayer');
    video.paused ? video.play() : video.pause();
  };
</script>
</body>
</html>
