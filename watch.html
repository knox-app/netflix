<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Video Player - Blue Theme</title>
    <!-- Material Icons for UI -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <!-- HLS.js for m3u8 support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            /* Changed to Blue */
            --primary-color: #037ffc; 
            --bg-overlay: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 20%, rgba(0,0,0,0) 80%, rgba(0,0,0,0.85) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        #player-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Video Elements */
        video, #youtube-player-container, iframe {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            border: none;
            outline: none;
        }

        /* Force YouTube pointer events to none so our UI catches all clicks */
        #youtube-player-container {
            pointer-events: none;
        }

        /* UI Overlay Layer */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-overlay);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
            transition: opacity 0.3s ease;
        }

        #ui-layer.idle {
            opacity: 0;
            cursor: none;
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, color 0.2s;
        }

        .icon-btn:hover {
            transform: scale(1.1);
            color: var(--primary-color);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            padding: 20px 30px;
            align-items: center;
        }

        .top-bar .left, .top-bar .right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: 500;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .center-controls {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            gap: 50px;
        }

        .center-controls .material-icons-outlined {
            font-size: 3.5rem;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
            text-shadow: 0px 0px 10px rgba(0,0,0,0.5);
        }
        .center-controls .material-icons-outlined:active {
            transform: scale(0.9);
        }
        .center-controls .play-btn {
            font-size: 5rem;
        }
        .center-controls .material-icons-outlined:hover {
            color: var(--primary-color);
        }

        /* Hide brightness bar for cleaner UI, or keep if needed */
        .left-bar {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .brightness-slider {
            -webkit-appearance: none;
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(-90deg);
            border-radius: 2px;
            outline: none;
        }
        .brightness-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
        }

        .bottom-bar {
            padding: 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .progress-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .progress-bar {
            flex: 1;
            -webkit-appearance: none;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
            position: relative;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        .time-display {
            font-size: 0.9rem;
            font-variant-numeric: tabular-nums;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
        }

        .action-bar .left, .action-bar .right {
            display: flex;
            align-items: center;
            gap: 20px;
            color: #eee;
            cursor: pointer;
        }

        .action-bar .left:hover, .action-bar .right > div:hover {
            color: var(--primary-color);
        }

        .action-bar .material-icons-outlined {
            font-size: 1.2rem;
            margin-right: 5px;
            vertical-align: middle;
        }

        #settings-menu {
            position: absolute;
            top: 70px;
            right: 30px;
            background: rgba(15, 15, 15, 0.95);
            border-radius: 8px;
            padding: 10px 0;
            min-width: 220px;
            display: none;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        #settings-menu.active {
            display: flex;
        }

        .setting-item {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .setting-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--primary-color);
        }

        .setting-value {
            color: #aaa;
            font-size: 0.85rem;
        }

        /* LOCK SCREEN LOGIC */
        #ui-layer.locked .top-bar .left,
        #ui-layer.locked .top-bar .right .icon-btn:not(#lock-btn),
        #ui-layer.locked .center-controls,
        #ui-layer.locked .left-bar,
        #ui-layer.locked .bottom-bar,
        #ui-layer.locked #settings-menu {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
        }
        
        #ui-layer.locked {
            background: none;
        }
        
        #error-msg {
            position: absolute;
            z-index: 100;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 5px;
            display: none;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* Loading Spinner */
        #loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            display: none;
            pointer-events: none;
        }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    </style>
</head>
<body>

<div id="player-container">
    <div id="error-msg"></div>
    <div id="loading-spinner"></div>

    <!-- Players -->
    <video id="html5-video" style="display: none;" playsinline></video>
    
    <div id="youtube-player-container" style="display: none;">
        <div id="youtube-player"></div>
    </div>
    
    <iframe id="iframe-player" style="display: none;" allowfullscreen allow="autoplay; encrypted-media"></iframe>

    <!-- UI Layer -->
    <div id="ui-layer">
        <div class="top-bar">
            <div class="left">
                <button class="icon-btn" onclick="history.back()"><span class="material-icons-outlined">arrow_back</span></button>
                <span class="video-title" id="title-display">Player</span>
            </div>
            <div class="right">
                <button class="icon-btn" id="lock-btn"><span class="material-icons-outlined">lock_open</span></button>
                <button class="icon-btn" id="settings-btn"><span class="material-icons-outlined">settings</span></button>
                <button class="icon-btn" id="fullscreen-btn"><span class="material-icons-outlined">fullscreen</span></button>
            </div>
        </div>

        <div class="center-controls">
            <span class="material-icons-outlined" id="rewind-btn">replay_10</span>
            <span class="material-icons-outlined play-btn" id="play-pause-btn">play_arrow</span>
            <span class="material-icons-outlined" id="forward-btn">forward_10</span>
        </div>

        <div class="bottom-bar">
            <div class="progress-container">
                <input type="range" class="progress-bar" id="seek-bar" value="0" min="0" step="0.1">
                <span class="time-display" id="time-display">00:00 / 00:00</span>
            </div>
            
            <div class="action-bar">
                <div class="left">
                    <span class="material-icons-outlined">explore</span> Watch Next
                </div>
                <div class="right">
                    <div id="speed-toggle">
                        <span class="material-icons-outlined">speed</span> <span id="speed-display">1x</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Menu -->
        <div id="settings-menu">
            <div class="setting-item" id="menu-quality-btn">
                <span>Quality</span>
                <span class="setting-value" id="menu-quality-val">Auto</span>
            </div>
            <div class="setting-item" id="menu-speed-btn">
                <span>Speed</span>
                <span class="setting-value" id="menu-speed-val">Normal</span>
            </div>
        </div>
    </div>
</div>

<script>
    // --- URL PARAMETER PARSING ---
    const urlParams = new URLSearchParams(window.location.search);
    const videoUrl = urlParams.get('url');
    const syncType = urlParams.get('sync'); 

    // Elements
    const playerContainer = document.getElementById('player-container');
    const html5Video = document.getElementById('html5-video');
    const ytContainer = document.getElementById('youtube-player-container');
    const iframePlayer = document.getElementById('iframe-player');
    const errorMsg = document.getElementById('error-msg');
    const spinner = document.getElementById('loading-spinner');
    
    const uiLayer = document.getElementById('ui-layer');
    const playPauseBtn = document.getElementById('play-pause-btn');
    const lockBtn = document.getElementById('lock-btn');
    const settingsBtn = document.getElementById('settings-btn');
    const settingsMenu = document.getElementById('settings-menu');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const seekBar = document.getElementById('seek-bar');
    const timeDisplay = document.getElementById('time-display');

    // State Variables
    let isLocked = false;
    let isPlaying = false;
    let uiTimeout;
    let hlsInstance = null;
    
    // Quality Variables
    let availableQualities = [{ label: 'Auto', value: -1 }];
    let currentQualityIndex = 0;

    // YouTube Specific Variables
    let ytPlayer = null;
    let ytProgressInterval;

    function showError(msg) {
        errorMsg.innerText = msg;
        errorMsg.style.display = 'block';
        setTimeout(() => errorMsg.style.display = 'none', 5000);
    }

    function showLoading(show) {
        spinner.style.display = show ? 'block' : 'none';
    }

    // --- PLAYER INITIALIZATION ---
    function initPlayer() {
        if (!videoUrl) {
            showError("No video URL provided. Add ?url=... to the link.");
            return;
        }

        showLoading(true);

        if (syncType === 'm3u8' || !syncType) {
            html5Video.style.display = 'block';
            if (syncType === 'm3u8' && Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(videoUrl);
                hlsInstance.attachMedia(html5Video);
                
                // Parse Qualities for HLS
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
                    showLoading(false);
                    const levels = hlsInstance.levels;
                    availableQualities = [{ label: 'Auto', value: -1 }];
                    levels.forEach((level, index) => {
                        availableQualities.push({ label: level.height + 'p', value: index });
                    });
                });
            } else {
                html5Video.src = videoUrl;
                html5Video.addEventListener('loadeddata', () => showLoading(false));
            }
        } 
        else if (syncType === 'jpymtp') {
            ytContainer.style.display = 'block';
            
            let videoId = videoUrl;
            if (videoId.includes('v=')) videoId = videoId.split('v=')[1].split('&')[0];
            else if (videoId.includes('youtu.be/')) videoId = videoId.split('youtu.be/')[1].split('?')[0];

            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

            window.onYouTubeIframeAPIReady = function() {
                ytPlayer = new YT.Player('youtube-player', {
                    videoId: videoId,
                    playerVars: {
                        'controls': 0, // HIDE NATIVE CONTROLS
                        'disablekb': 1, 
                        'fs': 0,
                        'modestbranding': 1,
                        'rel': 0,
                        'playsinline': 1,
                        'iv_load_policy': 3 // Hide annotations
                    },
                    events: {
                        'onReady': onYTReady,
                        'onStateChange': onYTStateChange,
                        'onError': onYTError
                    }
                });
            };
        } 
        else if (syncType === 'sdcem') {
            // Custom Iframe
            iframePlayer.style.display = 'block';
            iframePlayer.src = videoUrl;
            document.querySelector('.center-controls').style.display = 'none';
            document.querySelector('.bottom-bar').style.display = 'none';
            showLoading(false);
        }
    }

    // --- YOUTUBE API HANDLERS ---
    function onYTReady(event) {
        showLoading(false);
        // Get YT Qualities (Note: Modern YT forces auto a lot, but we read what's available)
        const levels = ytPlayer.getAvailableQualityLevels();
        if(levels && levels.length > 0) {
            availableQualities = [{ label: 'Auto', value: 'default' }];
            levels.forEach(level => {
                if(level !== 'auto') availableQualities.push({ label: level, value: level });
            });
        }
    }

    function onYTStateChange(event) {
        if (event.data === YT.PlayerState.PLAYING) {
            isPlaying = true;
            playPauseBtn.innerText = 'pause';
            showLoading(false);
            resetUiTimeout();
            clearInterval(ytProgressInterval);
            ytProgressInterval = setInterval(updateYTProgress, 500);
        } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
            isPlaying = false;
            playPauseBtn.innerText = 'play_arrow';
            uiLayer.classList.remove('idle');
            clearInterval(ytProgressInterval);
        } else if (event.data === YT.PlayerState.BUFFERING) {
            showLoading(true);
        }
    }

    function onYTError(event) {
        showLoading(false);
        if(event.data === 150 || event.data === 101) {
            showError("YouTube blocked playback (Embed not allowed or local file path). Run on a local server.");
        }
    }

    function updateYTProgress() {
        if(ytPlayer && ytPlayer.getCurrentTime) {
            updateTimelineUI(ytPlayer.getCurrentTime(), ytPlayer.getDuration());
        }
    }


    // --- UI LOGIC & CONTROLS ---

    function resetUiTimeout() {
        if(isLocked) return;
        uiLayer.classList.remove('idle');
        clearTimeout(uiTimeout);
        uiTimeout = setTimeout(() => {
            if (isPlaying && !settingsMenu.classList.contains('active')) {
                uiLayer.classList.add('idle');
            }
        }, 3000);
    }
    
    playerContainer.addEventListener('mousemove', resetUiTimeout);
    playerContainer.addEventListener('touchstart', resetUiTimeout);

    function togglePlay() {
        if (syncType === 'jpymtp' && ytPlayer) {
            const state = ytPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
            else ytPlayer.playVideo();
        } 
        else if (syncType === 'm3u8' || !syncType) {
            html5Video.paused ? html5Video.play() : html5Video.pause();
        }
    }

    html5Video.addEventListener('play', () => { isPlaying = true; playPauseBtn.innerText = 'pause'; resetUiTimeout(); });
    html5Video.addEventListener('pause', () => { isPlaying = false; playPauseBtn.innerText = 'play_arrow'; uiLayer.classList.remove('idle'); });
    html5Video.addEventListener('waiting', () => showLoading(true));
    html5Video.addEventListener('playing', () => showLoading(false));

    playPauseBtn.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });

    // Background click to play/pause
    uiLayer.addEventListener('click', (e) => {
        if(e.target === uiLayer && !isLocked) {
            togglePlay();
            settingsMenu.classList.remove('active');
        } else {
            settingsMenu.classList.remove('active');
        }
    });

    document.getElementById('forward-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (syncType === 'jpymtp' && ytPlayer) ytPlayer.seekTo(ytPlayer.getCurrentTime() + 10, true);
        else html5Video.currentTime += 10;
        resetUiTimeout();
    });
    document.getElementById('rewind-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if (syncType === 'jpymtp' && ytPlayer) ytPlayer.seekTo(ytPlayer.getCurrentTime() - 10, true);
        else html5Video.currentTime -= 10;
        resetUiTimeout();
    });

    // Timeline Logic
    function formatTime(seconds) {
        if(isNaN(seconds)) return "00:00";
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    }

    function updateTimelineUI(current, duration) {
        seekBar.max = duration || 0;
        seekBar.value = current;
        timeDisplay.innerText = formatTime(current) + " / " + formatTime(duration);
        const percentage = (current / duration) * 100;
        seekBar.style.background = `linear-gradient(to right, var(--primary-color) ${percentage}%, rgba(255,255,255,0.2) ${percentage}%)`;
    }

    html5Video.addEventListener('timeupdate', () => updateTimelineUI(html5Video.currentTime, html5Video.duration));

    seekBar.addEventListener('input', (e) => {
        e.stopPropagation();
        if (syncType === 'jpymtp' && ytPlayer) ytPlayer.seekTo(seekBar.value, true);
        else html5Video.currentTime = seekBar.value;
    });

    // --- LOCK UI ---
    lockBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        isLocked = !isLocked;
        if (isLocked) {
            uiLayer.classList.add('locked');
            lockBtn.innerHTML = '<span class="material-icons-outlined">lock</span>';
            settingsMenu.classList.remove('active');
        } else {
            uiLayer.classList.remove('locked');
            lockBtn.innerHTML = '<span class="material-icons-outlined">lock_open</span>';
            resetUiTimeout();
        }
    });

    // --- SETTINGS MENU ---
    settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        settingsMenu.classList.toggle('active');
        resetUiTimeout();
    });

    // Quality Cycler
    document.getElementById('menu-quality-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        if(availableQualities.length <= 1) {
            showError("Quality adjustment not available for this source.");
            return;
        }

        currentQualityIndex = (currentQualityIndex + 1) % availableQualities.length;
        const selected = availableQualities[currentQualityIndex];
        
        document.getElementById('menu-quality-val').innerText = selected.label;

        if (syncType === 'm3u8' && hlsInstance) {
            hlsInstance.currentLevel = selected.value; // -1 is auto, 0, 1, 2 are indexes
        } else if (syncType === 'jpymtp' && ytPlayer) {
            ytPlayer.setPlaybackQuality(selected.value);
        }
        resetUiTimeout();
    });

    // Speed Cycler
    const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
    let currentSpeedIndex = 2; // Index of '1'

    function changeSpeed(e) {
        e.stopPropagation();
        currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
        const newSpeed = speeds[currentSpeedIndex];
        
        if (syncType === 'jpymtp' && ytPlayer) ytPlayer.setPlaybackRate(newSpeed);
        else html5Video.playbackRate = newSpeed;
        
        const speedText = newSpeed === 1 ? 'Normal' : newSpeed + 'x';
        document.getElementById('speed-display').innerText = `${newSpeed}x`;
        document.getElementById('menu-speed-val').innerText = speedText;
        resetUiTimeout();
    }
    document.getElementById('speed-toggle').addEventListener('click', changeSpeed);
    document.getElementById('menu-speed-btn').addEventListener('click', changeSpeed);


    // --- FULLSCREEN & ORIENTATION AUTO-FULLSCREEN ---
    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            playerContainer.requestFullscreen().catch(err => console.log(err));
        } else {
            document.exitFullscreen().catch(err => console.log(err));
        }
    }

    fullscreenBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleFullscreen();
    });

    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            fullscreenBtn.innerHTML = '<span class="material-icons-outlined">fullscreen_exit</span>';
        } else {
            fullscreenBtn.innerHTML = '<span class="material-icons-outlined">fullscreen</span>';
        }
    });

    // Detect device rotation (Landscape = Fullscreen, Portrait = Exit)
    window.addEventListener("orientationchange", function() {
        // orientation 90 or -90 means landscape
        if (window.orientation === 90 || window.orientation === -90) {
            if (!document.fullscreenElement) {
                try { playerContainer.requestFullscreen(); } catch(e){}
            }
        } else {
            if (document.fullscreenElement) {
                try { document.exitFullscreen(); } catch(e){}
            }
        }
    });

    // Init
    initPlayer();

</script>
</body>
</html>
