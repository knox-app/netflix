<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Watch Live TV - Premium Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-color: #090b10;
      --card-bg: #131722;
      --accent-color: #00d2ff;
      --accent-hover: #00b8e6;
      --text-main: #ffffff;
      --text-muted: #9aa0a6;
      --border-color: #232838;
      --hotstar-blue: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    /* Top Navbar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand { font-size: 18px; font-weight: 800; color: #fff; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--accent-color); }

    /* Main Container */
    .main-wrapper { max-width: 1100px; margin: 0 auto; padding-bottom: 40px; }

    /* Player Area */
    .player-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
    }

    video, iframe { width: 100%; height: 100%; border: none; object-fit: contain; }

    /* Watermark Top Right: Partner Logo | Channel Name */
    .watermark {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .watermark .partner-tag { color: var(--accent-color); text-transform: uppercase; letter-spacing: 0.5px; }
    .watermark .divider { color: rgba(255,255,255,0.4); }
    .watermark .channel-tag { color: #fff; }

    /* Custom Player Overlay Controls */
    .player-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.4) 0%, transparent 40%, transparent 60%, rgba(0,0,0,0.85) 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      opacity: 1;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    .player-container:hover .player-overlay,
    .player-overlay.active { opacity: 1; }

    .controls-bottom { display: flex; flex-direction: column; gap: 10px; }

    /* Progress Bar */
    .progress-wrap { width: 100%; display: flex; align-items: center; }
    .progress-bar {
      width: 100%; height: 5px;
      -webkit-appearance: none; appearance: none;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 5px; outline: none; cursor: pointer;
      transition: height 0.1s;
    }
    .progress-bar:hover { height: 8px; }
    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%; background: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-color);
      cursor: pointer;
    }

    /* Control Buttons */
    .btn-row { display: flex; justify-content: space-between; align-items: center; }
    .btn-left { display: flex; align-items: center; gap: 18px; }
    .ctrl-btn {
      background: none; border: none; color: #fff;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, color 0.15s;
    }
    .ctrl-btn:hover { color: var(--accent-color); transform: scale(1.1); }
    .ctrl-btn:active { transform: scale(0.95); }
    .ctrl-btn svg { width: 24px; height: 24px; fill: currentColor; }

    /* Metadata Area */
    .channel-meta { padding: 20px 15px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
    .meta-top { display: flex; align-items: center; gap: 15px; }
    .channel-logo {
      width: 65px; height: 65px; border-radius: 12px;
      object-fit: contain; background: #0f1014;
      padding: 6px; border: 1px solid var(--border-color);
    }
    .ch-name { font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 6px; }

    .badges-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .badge {
      background: rgba(0, 210, 255, 0.1);
      color: var(--accent-color);
      font-size: 11px; font-weight: 600;
      padding: 4px 10px; border-radius: 6px;
      border: 1px solid rgba(0, 210, 255, 0.25);
    }
    .badge-age { background: rgba(229, 9, 20, 0.2); color: #ff4d4d; border-color: rgba(229, 9, 20, 0.4); }
    .ch-desc { color: var(--text-muted); font-size: 14px; line-height: 1.6; margin-top: 14px; }

    /* Similar Channels Section */
    .section-title { font-size: 18px; font-weight: 700; margin: 25px 15px 15px; color: #fff; display: flex; align-items: center; gap: 8px; }
    .section-title::before { content: ''; width: 4px; height: 18px; background: var(--accent-color); border-radius: 2px; }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
      padding: 0 15px;
    }

    .channel-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      text-decoration: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }
    .channel-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-color);
      box-shadow: 0 8px 20px rgba(0, 210, 255, 0.15);
    }
    .card-img { width: 70px; height: 70px; object-fit: contain; border-radius: 8px; margin-bottom: 10px; background: #000; padding: 4px; }
    .card-title { font-size: 13px; font-weight: 600; line-clamp: 1; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .card-lang { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    .loader { text-align: center; padding: 60px 20px; color: var(--accent-color); font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>

<div class="navbar">
  <div class="brand">⚡ LiveTV <span>Stream</span></div>
</div>

<div id="loader" class="loader">Loading Channel Stream...</div>

<div id="app" style="display: none;">
  <div class="main-wrapper">
    
    <!-- Player Container -->
    <div class="player-container" id="playerContainer">
      
      <!-- Top Right Watermark -->
      <div class="watermark">
        <span class="partner-tag" id="wmPartner">Partner Logo</span>
        <span class="divider">|</span>
        <span class="channel-tag" id="wmChannel">Channel Name</span>
      </div>

      <!-- Video Element -->
      <video id="videoPlayer" playsinline crossorigin="anonymous"></video>

      <!-- Embed Fallback -->
      <iframe id="iframePlayer" style="display: none;" allowfullscreen allow="autoplay"></iframe>

      <!-- Player Custom Controls Overlay -->
      <div class="player-overlay" id="playerOverlay">
        <div></div> <!-- Spacer -->
        <div class="controls-bottom">
          <div class="progress-wrap">
            <input type="range" id="progressBar" class="progress-bar" value="0" min="0" max="100">
          </div>
          <div class="btn-row">
            <div class="btn-left">
              <!-- Play/Pause SVG -->
              <button class="ctrl-btn" id="playBtn" title="Play/Pause">
                <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              </button>
              
              <!-- Rewind 10s SVG -->
              <button class="ctrl-btn" id="rewindBtn" title="Rewind 10s">
                <svg viewBox="0 0 24 24"><path d="M12.5 3C17.15 3 21 6.85 21 11.5c0 4.65-3.85 8.5-8.5 8.5-3.32 0-6.2-1.92-7.55-4.71l1.82-.78c1.02 2.11 3.2 3.49 5.73 3.49 3.59 0 6.5-2.91 6.5-6.5S16.09 5 12.5 5c-2.02 0-3.82.93-5.02 2.39L10 10H3V3l2.81 2.81C7.32 4.19 9.77 3 12.5 3z"/></svg>
              </button>

              <!-- Forward 10s SVG -->
              <button class="ctrl-btn" id="forwardBtn" title="Forward 10s">
                <svg viewBox="0 0 24 24"><path d="M11.5 3C6.85 3 3 6.85 3 11.5 3 16.15 6.85 20 11.5 20c3.32 0 6.2-1.92 7.55-4.71l-1.82-.78c-1.02 2.11-3.2 3.49-5.73 3.49-3.59 0-6.5-2.91-6.5-6.5S7.91 5 11.5 5c2.02 0 3.82.93 5.02 2.39L14 10h7V3l-2.81 2.81C16.68 4.19 14.23 3 11.5 3z"/></svg>
              </button>
            </div>

            <div>
              <!-- Fullscreen SVG -->
              <button class="ctrl-btn" id="fullscreenBtn" title="Full Screen">
                <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Metadata Section -->
    <div class="channel-meta">
      <div class="meta-top">
        <img id="chLogo" class="channel-logo" src="" alt="Logo">
        <div>
          <div class="ch-name" id="chTitle">Channel Title</div>
          <div class="badges-row" id="badgesContainer"></div>
        </div>
      </div>
      <p class="ch-desc" id="chDesc"></p>
    </div>

    <!-- Similar Channels Section -->
    <div class="section-title">Similar Channels</div>
    <div class="channels-grid" id="similarGrid"></div>

  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
    authDomain: "internal-systems-46728.firebaseapp.com",
    projectId: "internal-systems-46728",
    storageBucket: "internal-systems-46728.firebasestorage.app",
    messagingSenderId: "172177452674",
    appId: "1:172177452674:web:155a2417da5531dd7ece9b",
    measurementId: "G-Y87B8VRQ1N"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const urlParams = new URLSearchParams(window.location.search);
  const currentDocId = urlParams.get('watch');

  if (!currentDocId) {
    document.getElementById('loader').innerText = "Parameter missing! Use URL format: 1.html?watch=DOCUMENT_ID";
  } else {
    loadCurrentChannel(currentDocId);
  }

  async function loadCurrentChannel(id) {
    try {
      const docRef = doc(db, "Live TV", id);
      const docSnap = await getDoc(docRef);

      if (!docSnap.exists()) {
        document.getElementById('loader').innerText = `Channel '${id}' not found in "Live TV" collection.`;
        return;
      }

      const channel = docSnap.data();

      // Set Metadata UI
      document.getElementById('chTitle').innerText = channel.Name || "Live Channel";
      document.getElementById('chLogo').src = channel["Logo.png"] || channel.Logo || "";
      document.getElementById('chDesc').innerText = channel.Discription || "No description available.";

      // Watermark Top-Right
      document.getElementById('wmPartner').innerText = channel.Partner || "Hotstar Logo";
      document.getElementById('wmChannel').innerText = channel.Name || "Live TV";

      // Render Badges
      const badgesContainer = document.getElementById('badgesContainer');
      badgesContainer.innerHTML = '';
      if (channel.AgeRating) badgesContainer.innerHTML += `<span class="badge badge-age">${channel.AgeRating}</span>`;
      if (channel.Language) badgesContainer.innerHTML += `<span class="badge">${channel.Language}</span>`;
      if (channel.Genres) badgesContainer.innerHTML += `<span class="badge">${channel.Genres}</span>`;

      document.getElementById('loader').style.display = 'none';
      document.getElementById('app').style.display = 'block';

      // Initialize Stream
      initPlayer(channel.Stream);

      // Fetch Similar Channels
      fetchSimilarChannels(channel.Genres, channel.Language, id);

    } catch (e) {
      document.getElementById('loader').innerText = "Error: " + e.message;
    }
  }

  function initPlayer(streamUrl) {
    const video = document.getElementById('videoPlayer');
    const iframe = document.getElementById('iframePlayer');
    const overlay = document.getElementById('playerOverlay');

    if (!streamUrl) return;

    // YouTube Stream
    if (streamUrl.includes('youtube.com') || streamUrl.includes('youtu.be')) {
      let embedUrl = streamUrl;
      if (streamUrl.includes('watch?v=')) {
        embedUrl = `https://www.youtube.com/embed/${streamUrl.split('v=')[1].split('&')[0]}?autoplay=1`;
      } else if (streamUrl.includes('youtu.be/')) {
        embedUrl = `https://www.youtube.com/embed/${streamUrl.split('youtu.be/')[1].split('?')[0]}?autoplay=1`;
      }
      video.style.display = 'none';
      overlay.style.display = 'none';
      iframe.style.display = 'block';
      iframe.src = embedUrl;
    } 
    // HLS / M3U8 Stream
    else if (streamUrl.includes('.m3u8') || streamUrl.includes('hls')) {
      iframe.style.display = 'none';
      video.style.display = 'block';
      overlay.style.display = 'flex';

      if (Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.play().catch(() => {});
      }
      bindControls(video);
    } 
    // Generic Embed Iframe
    else {
      video.style.display = 'none';
      overlay.style.display = 'none';
      iframe.style.display = 'block';
      iframe.src = streamUrl;
    }
  }

  function bindControls(video) {
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const pauseIcon = document.getElementById('pauseIcon');
    const rewindBtn = document.getElementById('rewindBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const progressBar = document.getElementById('progressBar');
    const playerContainer = document.getElementById('playerContainer');

    const togglePlay = () => {
      if (video.paused) {
        video.play();
      } else {
        video.pause();
      }
    };

    playBtn.onclick = togglePlay;
    video.onclick = togglePlay;

    video.onplay = () => {
      playIcon.style.display = 'none';
      pauseIcon.style.display = 'block';
    };

    video.onpause = () => {
      playIcon.style.display = 'block';
      pauseIcon.style.display = 'none';
    };

    rewindBtn.onclick = (e) => { e.stopPropagation(); video.currentTime -= 10; };
    forwardBtn.onclick = (e) => { e.stopPropagation(); video.currentTime += 10; };

    video.ontimeupdate = () => {
      if (video.duration) {
        progressBar.value = (video.currentTime / video.duration) * 100;
      }
    };

    progressBar.oninput = (e) => {
      e.stopPropagation();
      if (video.duration) {
        video.currentTime = (progressBar.value / 100) * video.duration;
      }
    };

    const toggleFullscreen = (e) => {
      e?.stopPropagation();
      if (!document.fullscreenElement) {
        playerContainer.requestFullscreen?.() || playerContainer.webkitRequestFullscreen?.();
      } else {
        document.exitFullscreen?.() || document.webkitExitFullscreen?.();
      }
    };

    fullscreenBtn.onclick = toggleFullscreen;

    // Mobile Automatic Fullscreen on Horizontal Rotation (Landscape)
    const handleAutoFullscreen = () => {
      if (window.matchMedia("(orientation: landscape)").matches && window.innerWidth < 1024) {
        if (!document.fullscreenElement) {
          playerContainer.requestFullscreen?.().catch(() => {});
        }
      } else {
        if (document.fullscreenElement) {
          document.exitFullscreen?.().catch(() => {});
        }
      }
    };

    window.addEventListener('orientationchange', () => setTimeout(handleAutoFullscreen, 200));
    window.matchMedia("(orientation: landscape)").addEventListener('change', handleAutoFullscreen);
  }

  // Fetch Similar Channels from "Live TV" Database
  async function fetchSimilarChannels(currentGenre, currentLang, excludeId) {
    const similarGrid = document.getElementById('similarGrid');
    try {
      const querySnapshot = await getDocs(collection(db, "Live TV"));
      let channels = [];

      querySnapshot.forEach((docSnap) => {
        if (docSnap.id !== excludeId) {
          channels.push({ id: docSnap.id, ...docSnap.data() });
        }
      });

      // Filter by matching genre or language if available
      let filtered = channels.filter(ch => {
        return (currentGenre && ch.Genres && ch.Genres.toLowerCase().includes(currentGenre.toLowerCase())) ||
               (currentLang && ch.Language && ch.Language.toLowerCase() === currentLang.toLowerCase());
      });

      // Fallback to general channels if no exact genre match
      if (filtered.length === 0) filtered = channels;

      if (filtered.length === 0) {
        similarGrid.innerHTML = `<p style="color:var(--text-muted); font-size:13px;">No other channels found.</p>`;
        return;
      }

      similarGrid.innerHTML = filtered.map(ch => `
        <a href="1.html?watch=${ch.id}" class="channel-card">
          <img src="${ch["Logo.png"] || ch.Logo || ''}" class="card-img" alt="${ch.Name}">
          <div class="card-title">${ch.Name || 'TV Channel'}</div>
          <div class="card-lang">${ch.Language || 'Live'}</div>
        </a>
      `).join('');

    } catch (e) {
      similarGrid.innerHTML = `<p style="color:var(--text-muted); font-size:13px;">Unable to load recommendations.</p>`;
    }
  }
</script>
</body>
</html>
