<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Preview - Hotstar</title>
  
  <!-- Hindi & Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <!-- YouTube IFrame API for Trailer Playback -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: #151821;
      --accent-blue: #1480f0;
      --text-main: #ffffff;
      --text-muted: #8f98b2;
      --border-color: rgba(255, 255, 255, 0.1);
      --btn-white: #ffffff;
      --btn-white-text: #090a0f;
      --btn-dark: #1e2230;
      --live-red: #e50914;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 12px 14px 90px;
      overflow-x: hidden;
      user-select: none;
    }

    .main-wrap {
      max-width: 600px;
      margin: 0 auto;
    }

    /* Floating Close Button */
    .top-close-bar {
      position: absolute;
      top: 24px;
      right: 26px;
      z-index: 50;
    }
    .close-btn {
      background: rgba(15, 16, 23, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .close-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.2); }
    .close-btn svg { width: 18px; height: 18px; fill: #fff; }

    /* Hero Box (Banner & Trailer Card) */
    .hero-card-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16/10;
      background-color: #12141c;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 24px;
    }

    .hero-banner-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease;
    }

    /* Trailer container - clips and hides YouTube default UI */
    .hero-trailer-host {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      background: #000;
      overflow: hidden;
    }
    .hero-trailer-host.playing {
      opacity: 1;
    }
    .hero-trailer-host iframe {
      width: calc(100% + 140px) !important;
      height: calc(100% + 160px) !important;
      position: absolute !important;
      top: -80px !important;
      left: -70px !important;
      pointer-events: none;
      border: none;
    }
    .hero-trailer-host video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
    }

    .trailer-badge {
      position: absolute;
      bottom: 12px;
      right: 14px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      backdrop-filter: blur(6px);
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    /* Content Details */
    .content-details-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 0 6px;
    }

    .brand-logo-img {
      max-width: 230px;
      max-height: 85px;
      object-fit: contain;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 14px rgba(0,0,0,0.85));
    }

    /* Fallback Hindi Bold Typography */
    .title-fallback-hindi {
      font-family: 'Noto Sans Devanagari', sans-serif !important;
      font-size: 32px;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 10px;
      color: #ffffff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.9);
      letter-spacing: 0.5px;
    }

    /* Trending & IMDb Blue Row */
    .blue-trend-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 6px;
    }
    .blue-trend-line span.dot {
      color: var(--text-muted);
      font-size: 10px;
    }

    /* Metadata pills */
    .meta-pills-row {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 7px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 18px;
    }
    .meta-pill-badge {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    /* Primary & Secondary CTA Buttons */
    .cta-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .btn-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      border: none;
    }
    .btn-cta:active { transform: scale(0.98); opacity: 0.9; }
    .btn-cta svg { width: 18px; height: 18px; fill: currentColor; }

    .btn-cta-primary {
      background-color: var(--btn-white);
      color: var(--btn-white-text);
    }
    .btn-cta-secondary {
      background-color: var(--btn-dark);
      color: #fff;
      border: 1px solid var(--border-color);
    }
    .btn-cta-subscribe {
      background: linear-gradient(90deg, #0072ef 0%, #00d2ff 100%);
      color: #fff;
    }

    /* Tags & Description */
    .genres-tags-line {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }
    .genres-tags-line span {
      color: var(--text-muted);
      margin: 0 4px;
    }
    .description-para {
      font-size: 13px;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* 4-Column Action Icons (Watchlist, Share, Download, Rate) */
    .action-icons-row {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin-bottom: 28px;
      padding: 0 8px;
    }
    .action-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0.85;
      transition: opacity 0.15s, transform 0.1s;
    }
    .action-item:active { transform: scale(0.92); opacity: 1; }
    .action-item.active { color: var(--accent-blue); }
    .action-item svg { width: 22px; height: 22px; fill: currentColor; }

    /* Sections */
    .section-container {
      width: 100%;
      margin-bottom: 26px;
      text-align: left;
    }
    .section-heading {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 14px;
      color: #fff;
    }

    /* Episodes List for Shows */
    .episodes-wrapper { display: none; }
    .season-tab-row {
      display: flex;
      gap: 18px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      margin-bottom: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .season-tab-row::-webkit-scrollbar { display: none; }
    .season-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      position: relative;
      padding-bottom: 6px;
    }
    .season-btn.active { color: #fff; }
    .season-btn.active::after {
      content: '';
      position: absolute;
      bottom: -9px;
      left: 0;
      right: 0;
      height: 2.5px;
      background: #fff;
    }

    .episodes-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .ep-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      text-decoration: none;
      color: #fff;
      transition: background 0.15s ease;
    }
    .ep-card:active { background: rgba(255, 255, 255, 0.08); }
    .ep-thumb-wrap {
      position: relative;
      width: 120px;
      min-width: 120px;
      aspect-ratio: 16/9;
      border-radius: 8px;
      overflow: hidden;
      background: #151821;
    }
    .ep-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .ep-play-circle {
      position: absolute;
      bottom: 6px;
      left: 6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ep-play-circle svg { width: 10px; height: 10px; fill: #fff; margin-left: 1px; }

    .ep-info { flex: 1; min-width: 0; }
    .ep-name {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .ep-subtext {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .view-more-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 140px;
      margin: 16px auto 6px;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Recommendations Grid ("More Like This") */
    .rec-grid-vertical {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .poster-card {
      position: relative;
      aspect-ratio: 2/3;
      border-radius: 10px;
      overflow: hidden;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s ease;
    }
    .poster-card:active { transform: scale(0.96); }
    .poster-card img { width: 100%; height: 100%; object-fit: cover; }

    /* Bottom App Navigation Bar */
    .bottom-app-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(9, 10, 15, 0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-tab-item.active { color: #fff; }
    .nav-tab-item svg { width: 22px; height: 22px; fill: currentColor; }

    .toast-box {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(21, 24, 33, 0.95);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .toast-box.show { opacity: 1; }

    .loader-wrap {
      text-align: center;
      padding: 120px 20px;
      color: var(--accent-blue);
      font-weight: 700;
      font-size: 16px;
    }
  </style>
</head>
<body>

      <!-- TV Shows Episodes -->
      <div class="section-container episodes-wrapper" id="episodesSection">

  <!-- Firebase Integration Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, getDocs, collection, updateDoc, arrayUnion, arrayRemove, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Content Database (internal-systems-46728)
    const contentConfig = {
      apiKey: "AIzaSyBjeUSAmhtANyIPMTK2j-x-APGOYD3D-6g",
      authDomain: "internal-systems-46728.firebaseapp.com",
      projectId: "internal-systems-46728",
      storageBucket: "internal-systems-46728.firebasestorage.app",
      messagingSenderId: "172177452674",
      appId: "1:172177452674:web:155a2417da5531dd7ece9b",
      measurementId: "G-Y87B8VRQ1N"
    };
    const contentApp = initializeApp(contentConfig, "contentApp");
    const contentDb = getFirestore(contentApp);

    // 2. User & Subscription Database (question-metabase)
    const userConfig = {
      apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
      authDomain: "question-metabase.firebaseapp.com",
      databaseURL: "https://question-metabase-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "question-metabase",
      storageBucket: "question-metabase.firebasestorage.app",
      messagingSenderId: "770698198753",
      appId: "1:770698198753:web:59ae49d78b6013bab5c1a0",
      measurementId: "G-6ZP1FPMKSJ"
    };
    const userApp = initializeApp(userConfig, "userApp");
    const userDb = getFirestore(userApp);

    // Global State
    let currentItem = null;
    let contentType = 'movie'; // 'movie' | 'show' | 'live'
    let currentCollection = 'Movies';
    let currentUser = null;
    let userDocRef = null;
    let userWatchlist = [];
    let userAuthorizedStudios = new Set();
    let hasAccess = false;
    let trailerTimeout = null;
    let ytTrailerPlayer = null;
    let currentSeasonKey = null;
    let showAllEpisodes = false;

    // URL Query Parameter: ?preview=<id> or ?watch=<id>
    const urlParams = new URLSearchParams(window.location.search);
    const contentId = urlParams.get('preview') || urlParams.get('watch');

    function showToast(msg) {
      const toast = document.getElementById('toastAlert');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function safeUrl(url) {
      if (!url) return '';
      return url.trim().replace(/^http:\/\//i, 'https://');
    }

    function normalizeText(str) {
      return String(str || '').toLowerCase().trim().replace(/[^a-z0-9]/g, '');
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      try {
        const u = new URL(url.trim());
        if (u.hostname.includes('youtu.be')) return u.pathname.slice(1).split('/')[0];
        if (u.hostname.includes('youtube.com') || u.hostname.includes('m.youtube.com')) {
          if (u.pathname === '/watch') return u.searchParams.get('v');
          if (u.pathname.startsWith('/embed/')) return u.pathname.split('/')[2];
          if (u.pathname.startsWith('/shorts/')) return u.pathname.split('/')[2];
        }
      } catch (e) {
        if (/^[a-zA-Z0-9_-]{11}$/.test(url.trim())) return url.trim();
      }
      return null;
    }

    // Dynamic Hindi Transliteration for Titles when Logo is missing
    async function getHindiTitle(englishTitle) {
      if (!englishTitle) return "कंटेंट";
      
      // Check for predefined or stored titles
      const knownTrans = {
        "michael": "माइकल",
        "encanto": "एनकैंतो",
        "eyes of wakanda": "आइज़ ऑफ़ वकांडा",
        "moana": "मोआना",
        "frozen": "फ़्रोज़न",
        "frozen 2": "फ़्रोज़न 2",
        "aladdin": "अलादीन",
        "mulan": "मुलान",
        "luca": "लूका",
        "zootopia": "ज़ूटोपिया",
        "transformers": "ट्रांसफ़ॉर्मर्स",
        "the lion king": "द लायन किंग",
        "maleficent": "मैलेफ़िसेंट",
        "jungle cruise": "जंगल क्रूज़"
      };
      
      const lower = englishTitle.toLowerCase().trim();
      if (knownTrans[lower]) return knownTrans[lower];

      // Google Transliteration API for dynamic words
      try {
        const res = await fetch(`https://inputtools.google.com/request?text=${encodeURIComponent(englishTitle)}&itc=hi-t-i0-und&num=1`);
        const data = await res.json();
        if (data && data[0] === 'SUCCESS' && data[1] && data[1][0] && data[1][0][1] && data[1][0][1][0]) {
          return data[1][0][1][0];
        }
      } catch (e) {}

      return englishTitle;
    }

    async function initPreview() {
      if (!contentId) {
        document.getElementById('loader').innerText = "URL Parameter Missing (?preview=DOCUMENT_ID)";
        return;
      }

      await loadUserSubscriptionPlan();
      await fetchContentData(contentId);
    }

    // ========================================================
    // FIXED: USER PLAN & SUBSCRIBED STUDIOS CHECKING
    // ========================================================
    async function loadUserSubscriptionPlan() {
      try {
        const stored = localStorage.getItem('active_user') || localStorage.getItem('user') || localStorage.getItem('UARM');
        currentUser = stored ? JSON.parse(stored) : null;
      } catch (e) { currentUser = null; }

      if (!currentUser) return;

      try {
        // Collect Plan IDs from local user object
        let userPlanIds = [];
        if (Array.isArray(currentUser.Plans)) {
          userPlanIds = currentUser.Plans;
        } else if (currentUser.Plan) {
          userPlanIds = [currentUser.Plan];
        }

        // Also fetch live from question-metabase UARM to ensure fresh plans
        if (currentUser.Lotus || currentUser.Email) {
          let qUser = currentUser.Lotus 
            ? query(collection(userDb, "UARM"), where("Lotus", "==", currentUser.Lotus))
            : query(collection(userDb, "UARM"), where("Email", "==", currentUser.Email));
          
          const snap = await getDocs(qUser);
          if (!snap.empty) {
            userDocRef = doc(userDb, "UARM", snap.docs[0].id);
            const liveData = snap.docs[0].data();
            userWatchlist = liveData.Watchlist || [];
            if (Array.isArray(liveData.Plans)) {
              userPlanIds = Array.from(new Set([...userPlanIds, ...liveData.Plans]));
            }
          }
        }

        // Resolve each plan document in "Plans & Subscriptions"
        for (const planId of userPlanIds) {
          if (!planId) continue;
          
          // Check "Plans & Subscriptions" collection
          let pSnap = await getDoc(doc(userDb, "Plans & Subscriptions", planId));
          if (!pSnap.exists()) {
            pSnap = await getDoc(doc(userDb, "Plans & Subscription", planId));
          }

          if (pSnap.exists()) {
            const pData = pSnap.data();
            const studios = Array.isArray(pData.Studio) ? pData.Studio : (pData.Studios || []);
            studios.forEach(s => {
              userAuthorizedStudios.add(normalizeText(s));
            });
          }
        }
      } catch (err) {
        console.warn("Auth verification error:", err);
      }
    }

    function checkContentAccess(content) {
      if (!content) return false;
      const contentStudioRaw = content.Studio || content.Partner || '';
      const contentStudio = normalizeText(contentStudioRaw);

      // 1. Content is marked free / open
      if (!contentStudio || contentStudio === 'free' || contentStudio === 'open') return true;

      // 2. User has no plans
      if (userAuthorizedStudios.size === 0) return false;

      // 3. Exact or partial match in user's authorized studios
      if (userAuthorizedStudios.has(contentStudio)) return true;

      for (const authStudio of userAuthorizedStudios) {
        if (contentStudio.includes(authStudio) || authStudio.includes(contentStudio)) {
          return true;
        }
      }

      return false;
    }

    async function fetchContentData(id) {
      const collections = ["Live TV", "Movies", "Shows"];
      let matchedDoc = null;

      for (const col of collections) {
        try {
          const snap = await getDoc(doc(contentDb, col, id));
          if (snap.exists()) {
            matchedDoc = snap.data();
            currentCollection = col;
            break;
          }
        } catch (e) {}
      }

      if (!matchedDoc) {
        document.getElementById('loader').innerText = `Content "${id}" not found.`;
        return;
      }

      currentItem = { id, ...matchedDoc };
      hasAccess = checkContentAccess(currentItem);

      const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
      if (currentCollection === "Shows" || seasons.length > 0) {
        contentType = 'show';
        currentSeasonKey = seasons[0] || 'Season 1';
      } else if (currentCollection === "Movies") {
        contentType = 'movie';
      } else {
        contentType = 'live';
      }

      await renderPreviewUI();
      scheduleTrailerPlayback();
      fetchRecommendations();
    }

    async function renderPreviewUI() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('previewMain').style.display = 'block';

      // 1. Banner
      const bannerImg = document.getElementById('heroBanner');
      const bannerUrl = safeUrl(currentItem.Banner || currentItem["Poster.h"] || currentItem.Poster || '');
      bannerImg.src = bannerUrl;

      // 2. Logo OR Bold Hindi Font Fallback (with error handling)
      const logoImg = document.getElementById('contentLogo');
      const titleFallback = document.getElementById('contentTitle');
      const logoUrl = safeUrl(currentItem.Logo || currentItem["Logo.png"] || '');

      const applyHindiFallback = async () => {
        logoImg.style.display = 'none';
        const rawName = currentItem["Hindi Name"] || currentItem.Hindi_Name || currentItem.Name || currentItem.Title || "कंटेंट";
        const hindiText = await getHindiTitle(rawName);
        titleFallback.innerText = hindiText;
        titleFallback.style.display = 'block';
      };

      if (logoUrl) {
        logoImg.src = logoUrl;
        logoImg.style.display = 'block';
        titleFallback.style.display = 'none';
        logoImg.onerror = applyHindiFallback;
      } else {
        await applyHindiFallback();
      }

      // 3. Blue Trend & Rating Line
      const blueLine = document.getElementById('blueTrendLine');
      const trendText = currentItem.Trending || currentItem.Rank ? `#${currentItem.Trending || currentItem.Rank} in Hindi Today` : '';
      const ratingVal = currentItem.Rating || currentItem.IMDb || currentItem.imdb;
      const ratingText = ratingVal ? `IMDb ${ratingVal}` : '';

      if (trendText || ratingText) {
        blueLine.innerHTML = `
          ${trendText ? `<span>${trendText}</span>` : ''}
          ${trendText && ratingText ? `<span class="dot">•</span>` : ''}
          ${ratingText ? `<span>${ratingText}</span>` : ''}
        `;
        blueLine.style.display = 'flex';
      } else {
        blueLine.style.display = 'none';
      }

      // 4. Meta Pills Row
      const metaRow = document.getElementById('metaPillsRow');
      const year = currentItem.Year || currentItem["Release Year"] || (contentType === 'live' ? 'LIVE' : '2024');
      const age = currentItem.Age_Rating || currentItem["Age Rating"] || currentItem.Rating || 'U/A 13+';
      
      const langArr = Array.isArray(currentItem.Language) ? currentItem.Language : (currentItem.Language ? [currentItem.Language] : ['Hindi']);
      const langText = langArr.length > 1 ? `${langArr.length} Languages` : (langArr[0] || 'Hindi');
      
      let durationOrSeasons = '';
      if (contentType === 'show') {
        const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
        durationOrSeasons = `${seasons.length || 1} Season${seasons.length > 1 ? 's' : ''}`;
      } else if (contentType === 'movie') {
        durationOrSeasons = currentItem.Duration || '1h 50m';
      }

      metaRow.innerHTML = `
        <span>${year}</span>
        <span class="meta-pill-badge">${age}</span>
        ${durationOrSeasons ? `<span>•</span><span>${durationOrSeasons}</span>` : ''}
        <span>•</span><span>${langText}</span>
      `;

      // 5. CTA Buttons
      renderCTAButtons();

      // 6. Genres & Description
      const genresLine = document.getElementById('genresTagsLine');
      const rawGenres = currentItem.Genres || currentItem.Tags || '';
      const genreItems = (Array.isArray(rawGenres) ? rawGenres : String(rawGenres).split(/[,/|]+/)).map(g => g.trim()).filter(Boolean);
      genresLine.innerHTML = genreItems.map(g => `<b>${g}</b>`).join(' <span>|</span> ');

      const desc = currentItem.Discription || currentItem.Description || "Enjoy full movies, shows and live TV streaming on Hotstar.";
      document.getElementById('contentDescription').innerText = desc;

      // 7. Watchlist UI state
      updateWatchlistButtonState();

      // 8. Episodes if Show
      if (contentType === 'show') {
        renderEpisodesSection();
      } else {
        document.getElementById('episodesSection').style.display = 'none';
      }
    }

    function renderCTAButtons() {
      const ctaBox = document.getElementById('ctaContainer');
      ctaBox.innerHTML = '';

      // CASE 1: User HAS NOT SUBSCRIBED or Plan does not cover this Studio
      if (!hasAccess) {
        ctaBox.innerHTML = `
          <a class="btn-cta btn-cta-subscribe" href="1.html?action=subscribe&studio=${encodeURIComponent(currentItem.Studio || '')}">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
            Subscribe to Watch
          </a>
        `;
        return;
      }

      // Check Saved Progress from localStorage
      let resumeKey = currentItem.id;
      if (contentType === 'show' && currentSeasonKey) {
        resumeKey = `${currentItem.id}_${currentSeasonKey}_ep0`;
      }
      const savedTime = parseFloat(localStorage.getItem(`progress_${resumeKey}`) || '0');
      const hasWatchedBefore = savedTime > 15;

      // CASE 2: User HAS PLAN & has previously started watching
      if (hasWatchedBefore && contentType !== 'live') {
        const subLabel = contentType === 'show' ? 'S1 E1' : '';
        ctaBox.innerHTML = `
          <a class="btn-cta btn-cta-primary" href="1.html?watch=${currentItem.id}&action=resume">
            <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            Continue Watching ${subLabel}
          </a>
          <a class="btn-cta btn-cta-secondary" href="1.html?watch=${currentItem.id}&action=starting">
            <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
            Start from Beginning ${subLabel}
          </a>
        `;
        return;
      }

      // CASE 3: Fresh Watch (Movie / Live / Show)
      let primaryLabel = "Watch Now";
      if (contentType === 'live') primaryLabel = "Watch Live";
      
      ctaBox.innerHTML = `
        <a class="btn-cta btn-cta-primary" href="1.html?watch=${currentItem.id}&action=starting">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          ${primaryLabel}
        </a>
      `;
    }

    // Trailer with Hidden Controls & End Transition back to Banner
    function scheduleTrailerPlayback() {
      const trailerBadge = document.getElementById('trailerBadge');
      const host = document.getElementById('heroTrailerHost');
      const trailerUrl = safeUrl(currentItem.Trailer || '');

      clearTimeout(trailerTimeout);
      trailerTimeout = setTimeout(() => {
        if (!trailerUrl) {
          trailerBadge.innerText = "UNAVAILABLE";
          trailerBadge.style.display = "block";
          return;
        }

        const ytId = extractYouTubeId(trailerUrl);

        if (ytId) {
          host.innerHTML = `<div id="ytTrailerActualPlayer"></div>`;
          host.classList.add('playing');
          trailerBadge.innerText = "TRAILER";
          trailerBadge.style.display = "block";

          ytTrailerPlayer = new YT.Player('ytTrailerActualPlayer', {
            videoId: ytId,
            playerVars: {
              autoplay: 1,
              controls: 0,
              disablekb: 1,
              fs: 0,
              rel: 0,
              modestbranding: 1,
              showinfo: 0,
              iv_load_policy: 3,
              mute: 1,
              playsinline: 1
            },
            events: {
              onReady: (e) => e.target.playVideo(),
              onStateChange: (e) => {
                if (e.data === YT.PlayerState.ENDED) {
                  host.classList.remove('playing');
                  trailerBadge.style.display = 'none';
                  try { ytTrailerPlayer.destroy(); } catch(err){}
                }
              },
              onError: () => {
                host.classList.remove('playing');
                trailerBadge.innerText = "UNAVAILABLE";
              }
            }
          });
        } else if (trailerUrl.endsWith('.mp4') || trailerUrl.includes('.m3u8')) {
          host.innerHTML = `<video id="videoTrailerEl" src="${trailerUrl}" autoplay muted playsinline></video>`;
          host.classList.add('playing');
          trailerBadge.innerText = "TRAILER";
          trailerBadge.style.display = "block";

          const vid = document.getElementById('videoTrailerEl');
          vid.onended = () => {
            host.classList.remove('playing');
            trailerBadge.style.display = 'none';
          };
        } else {
          trailerBadge.innerText = "UNAVAILABLE";
          trailerBadge.style.display = "block";
        }
      }, 3000);
    }

    // TV Show Episodes
    function renderEpisodesSection() {
      const epWrap = document.getElementById('episodesSection');
      const tabsRow = document.getElementById('seasonTabsRow');
      const listEl = document.getElementById('episodesList');
      const viewMoreBtn = document.getElementById('btnViewMoreEpisodes');

      const seasons = Object.keys(currentItem).filter(k => k.toLowerCase().startsWith('season'));
      if (seasons.length === 0) {
        epWrap.style.display = 'none';
        return;
      }

      epWrap.style.display = 'block';
      tabsRow.innerHTML = seasons.map(s => `
        <button class="season-btn ${s === currentSeasonKey ? 'active' : ''}" onclick="window.selectSeasonTab('${s}')">
          ${s}
        </button>
      `).join('');

      const epList = currentItem[currentSeasonKey] || [];
      const seasonNum = currentSeasonKey.replace(/\D/g, '') || '1';
      const limit = showAllEpisodes ? epList.length : 5;

      listEl.innerHTML = epList.slice(0, limit).map((ep, idx) => `
        <a class="ep-card" href="1.html?watch=${currentItem.id}&season=${encodeURIComponent(currentSeasonKey)}&ep=${idx + 1}">
          <div class="ep-thumb-wrap">
            <img src="${safeUrl(currentItem["Poster.h"] || currentItem.Banner || '')}" alt="${ep.Name}">
            <div class="ep-play-circle"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          </div>
          <div class="ep-info">
            <div class="ep-name">${ep.Name || `Episode ${idx + 1}`}</div>
            <div class="ep-subtext">S${seasonNum} E${idx + 1} • ${ep.Duration || '28m'}</div>
          </div>
        </a>
      `).join('');

      if (epList.length > 5) {
        viewMoreBtn.style.display = 'flex';
        viewMoreBtn.innerText = showAllEpisodes ? 'View Less' : 'View More';
        viewMoreBtn.onclick = () => {
          showAllEpisodes = !showAllEpisodes;
          renderEpisodesSection();
        };
      } else {
        viewMoreBtn.style.display = 'none';
      }
    }

    window.selectSeasonTab = function(seasonKey) {
      currentSeasonKey = seasonKey;
      renderEpisodesSection();
    };

    // Watchlist
    function updateWatchlistButtonState() {
      const btn = document.getElementById('btnWatchlist');
      const isAdded = userWatchlist.includes(currentItem.id);
      btn.classList.toggle('active', isAdded);
      document.getElementById('wlLabel').innerText = isAdded ? 'Added' : 'Watchlist';
      document.getElementById('wlIcon').innerHTML = isAdded 
        ? '<path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>' 
        : '<path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>';
    }

    document.getElementById('btnWatchlist').onclick = async () => {
      if (!userDocRef) {
        showToast("Please login to save to Watchlist");
        return;
      }
      const isAdded = userWatchlist.includes(currentItem.id);
      try {
        if (isAdded) {
          await updateDoc(userDocRef, { Watchlist: arrayRemove(currentItem.id) });
          userWatchlist = userWatchlist.filter(id => id !== currentItem.id);
          showToast("Removed from Watchlist");
        } else {
          await updateDoc(userDocRef, { Watchlist: arrayUnion(currentItem.id) });
          userWatchlist.push(currentItem.id);
          showToast("Added to Watchlist");
        }
        updateWatchlistButtonState();
      } catch (err) {
        showToast("Watchlist updated");
      }
    };

    // Share
    document.getElementById('btnShare').onclick = async () => {
      const shareUrl = `${window.location.origin}${window.location.pathname}?preview=${currentItem.id}`;
      if (navigator.share) {
        try {
          await navigator.share({
            title: currentItem.Name || "Hotstar",
            text: `Watch ${currentItem.Name} on Hotstar!`,
            url: shareUrl
          });
        } catch(e){}
      } else {
        navigator.clipboard.writeText(shareUrl);
        showToast("Link copied to clipboard!");
      }
    };

    // Download
    document.getElementById('btnDownload').onclick = () => {
      showToast("Download started in standard quality");
    };

    // Rate
    document.getElementById('btnRate').onclick = () => {
      const btn = document.getElementById('btnRate');
      btn.classList.toggle('active');
      showToast(btn.classList.contains('active') ? "Rated ★★★★★" : "Rating removed");
    };

    // Recommendations Engine
    async function fetchRecommendations() {
      const grid = document.getElementById('recommendationsGrid');
      try {
        const snap = await getDocs(collection(contentDb, currentCollection));
        let items = [];
        snap.forEach(d => {
          if (d.id !== currentItem.id) items.push({ id: d.id, ...d.data() });
        });

        const targetGenres = String(currentItem.Genres || '').toLowerCase().split(/[,/|]+/);
        const targetStudio = String(currentItem.Studio || '').toLowerCase();
        const targetAge = String(currentItem.Age_Rating || '').toLowerCase();

        items.sort((a, b) => {
          let scoreA = 0;
          let scoreB = 0;

          const aG = String(a.Genres || '').toLowerCase();
          const bG = String(b.Genres || '').toLowerCase();
          targetGenres.forEach(g => {
            if (g && aG.includes(g.trim())) scoreA += 10;
            if (g && bG.includes(g.trim())) scoreB += 10;
          });

          if (targetStudio && String(a.Studio || '').toLowerCase().includes(targetStudio)) scoreA += 15;
          if (targetStudio && String(b.Studio || '').toLowerCase().includes(targetStudio)) scoreB += 15;

          if (targetAge && String(a.Age_Rating || '').toLowerCase() === targetAge) scoreA += 5;
          if (targetAge && String(b.Age_Rating || '').toLowerCase() === targetAge) scoreB += 5;

          return scoreB - scoreA;
        });

        grid.innerHTML = items.slice(0, 12).map(c => {
          const vPoster = safeUrl(c["Poster.v"] || c.Poster_v || c.Poster || c.Banner || '');
          return `
            <a class="poster-card" href="preview.html?preview=${c.id}">
              <img src="${vPoster}" alt="${c.Name || 'Title'}" loading="lazy">
            </a>
          `;
        }).join('');
      } catch (err) {
        console.error("Recs error", err);
      }
    }

    // Launch
    initPreview();
  </script>
