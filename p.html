
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Custom YouTube Player</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:'Inter',sans-serif;
    width:100%;
    height:100vh;
    overflow:hidden;
}

.player-wrapper{
    width:100%;
    height:100vh;
    position:relative;
    background:#000;
}

#player{
    width:100%;
    height:100%;
}

iframe{
    width:100%;
    height:100%;
    border:none;
    pointer-events:none;
}

.controls{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    padding:18px;
    background:linear-gradient(to top, rgba(0,0,0,0.95), transparent);
    display:flex;
    flex-direction:column;
    gap:14px;
    z-index:5;
    transition:0.3s;
}

.progress{
    width:100%;
    height:5px;
    background:rgba(255,255,255,0.2);
    border-radius:100px;
    overflow:hidden;
    cursor:pointer;
}

.progress-bar{
    width:0%;
    height:100%;
    background:#fff;
}

.controls-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.left,
.right{
    display:flex;
    align-items:center;
    gap:10px;
}

button,
select{
    border:none;
    outline:none;
    background:rgba(255,255,255,0.12);
    color:#fff;
    padding:10px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
    backdrop-filter:blur(10px);
}

button:hover,
select:hover{
    background:rgba(255,255,255,0.22);
}

.time{
    color:#fff;
    font-size:14px;
}

.title{
    position:absolute;
    top:18px;
    left:18px;
    background:rgba(0,0,0,0.55);
    color:#fff;
    padding:10px 14px;
    border-radius:12px;
    z-index:5;
    backdrop-filter:blur(10px);
    font-size:15px;
    max-width:80%;
}

.hide{
    opacity:0;
    pointer-events:none;
}

@media(max-width:768px){

    .controls{
        padding:12px;
    }

    button,
    select{
        padding:8px 10px;
        font-size:12px;
    }

}

</style>
</head>
<body>

<div class="player-wrapper" id="wrapper">

    <div class="title" id="videoTitle">
        Loading...
    </div>

    <div id="player"></div>

    <div class="controls" id="controls">

        <div class="progress" id="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="controls-row">

            <div class="left">

                <button id="playBtn">▶</button>

                <div class="time" id="time">
                    0:00 / 0:00
                </div>

            </div>

            <div class="right">

                <select id="quality">
                    <option value="default">
                        Quality
                    </option>
                </select>

                <select id="speed">
                    <option value="0.25">0.25x</option>
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="1.75">1.75x</option>
                    <option value="2">2x</option>
                </select>

                <button id="captionBtn">
                    CC
                </button>

                <button id="fullscreenBtn">
                    ⛶
                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script>

const params = new URLSearchParams(window.location.search);

const ytUrl = params.get("player");

if(!ytUrl){

    document.body.innerHTML =
    "<h2 style='color:white;font-family:Inter;padding:20px'>No YouTube URL Found</h2>";

    throw new Error("No URL");

}

function getYoutubeId(url){

    const regex =
    /(?:youtube\.com\/watch\?v=|youtu\.be\/)([^&]+)/;

    const match = url.match(regex);

    return match ? match[1] : null;

}

const videoId = getYoutubeId(ytUrl);

let player;
let captionsEnabled = true;

function onYouTubeIframeAPIReady(){

    player = new YT.Player("player",{

        videoId:videoId,

        playerVars:{
            autoplay:1,
            controls:0,
            modestbranding:1,
            rel:0,
            fs:0,
            playsinline:1,
            cc_load_policy:1
        },

        events:{
            onReady:onReady,
            onStateChange:onStateChange
        }

    });

}

function onReady(){

    updateQuality();

    setInterval(updateProgress,500);

    const data = player.getVideoData();

    document.getElementById("videoTitle")
    .innerText = data.title;

}

function onStateChange(){

    const state = player.getPlayerState();

    document.getElementById("playBtn")
    .innerText = state === 1 ? "❚❚" : "▶";

}

document.getElementById("playBtn")
.addEventListener("click",()=>{

    const state = player.getPlayerState();

    if(state === 1){

        player.pauseVideo();

    }else{

        player.playVideo();

    }

});

function updateProgress(){

    if(!player || !player.getDuration) return;

    const current =
    player.getCurrentTime();

    const duration =
    player.getDuration();

    const percent =
    (current / duration) * 100;

    document.getElementById("progressBar")
    .style.width = percent + "%";

    document.getElementById("time")
    .innerText =
    format(current) + " / " + format(duration);

}

function format(sec){

    sec = Math.floor(sec);

    const m = Math.floor(sec/60);
    const s = sec % 60;

    return m + ":" + (s < 10 ? "0"+s : s);

}

document.getElementById("progress")
.addEventListener("click",(e)=>{

    const rect =
    e.currentTarget.getBoundingClientRect();

    const percent =
    (e.clientX - rect.left) / rect.width;

    const duration =
    player.getDuration();

    player.seekTo(duration * percent,true);

});

document.getElementById("speed")
.addEventListener("change",(e)=>{

    player.setPlaybackRate(
        parseFloat(e.target.value)
    );

});

function updateQuality(){

    const quality =
    document.getElementById("quality");

    const levels =
    player.getAvailableQualityLevels();

    levels.forEach(level=>{

        const option =
        document.createElement("option");

        option.value = level;
        option.innerText = level;

        quality.appendChild(option);

    });

}

document.getElementById("quality")
.addEventListener("change",(e)=>{

    player.setPlaybackQuality(
        e.target.value
    );

});

document.getElementById("captionBtn")
.addEventListener("click",()=>{

    captionsEnabled = !captionsEnabled;

    if(captionsEnabled){

        player.loadModule("captions");

    }else{

        player.unloadModule("captions");

    }

});

document.getElementById("fullscreenBtn")
.addEventListener("click",()=>{

    const wrapper =
    document.getElementById("wrapper");

    if(!document.fullscreenElement){

        wrapper.requestFullscreen();

    }else{

        document.exitFullscreen();

    }

});

const controls =
document.getElementById("controls");

let timeout;

function showControls(){

    controls.classList.remove("hide");

    clearTimeout(timeout);

    timeout = setTimeout(()=>{

        controls.classList.add("hide");

    },3000);

}

document.getElementById("wrapper")
.addEventListener("mousemove",showControls);

showControls();

</script>

</body>
</html>
```
