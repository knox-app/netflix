<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Blue Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-blue: #0056b3; --accent-blue: #007bff; }
        body { margin: 0; background: #000; font-family: sans-serif; overflow: hidden; }
        
        .video-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        #player { width: 100%; height: 100%; pointer-events: none; } /* Pointer events none prevents clicking YT logo */

        /* Custom UI Overlay */
        .controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            padding: 20px; display: flex; align-items: center; gap: 15px;
            color: white; z-index: 10; transition: opacity 0.3s;
        }

        .title-overlay {
            position: absolute; top: 20px; left: 20px; color: white;
            font-size: 20px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); z-index: 10;
        }

        .btn { background: none; border: none; color: white; cursor: pointer; font-size: 20px; }
        .btn:hover { color: var(--accent-blue); }

        .progress-container { flex-grow: 1; height: 5px; background: rgba(255,255,255,0.3); cursor: pointer; position: relative; }
        .progress-bar { height: 100%; background: var(--accent-blue); width: 0%; }

        select { background: rgba(0,0,0,0.5); color: white; border: 1px solid var(--main-blue); padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="video-container" id="videoContainer">
    <div id="titleDisplay" class="title-overlay">Loading...</div>
    <div id="player"></div>

    <div class="controls">
        <button class="btn" onclick="playPause()"><i id="playIcon" class="fas fa-play"></i></button>
        
        <div class="progress-container" onclick="seek(event)">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <select id="speed" onchange="changeSpeed(this.value)">
            <option value="0.5">0.5x</option>
            <option value="1" selected>Normal</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
        </select>

        <select id="quality" onchange="changeQuality(this.value)">
            <option value="default">Auto Quality</option>
            <option value="hd1080">1080p</option>
            <option value="hd720">720p</option>
        </select>

        <button class="btn" onclick="toggleFull()"><i class="fas fa-expand"></i></button>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let player;
    const urlParams = new URLSearchParams(window.location.search);
    const videoId = urlParams.get('v') || 'dQw4w9WgXcQ'; // Default ID if empty
    const videoTitle = urlParams.get('title') || 'Custom Video Player';

    document.getElementById('titleDisplay').innerText = videoTitle;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            videoId: videoId,
            playerVars: {
                'autoplay': 1,
                'controls': 0, // Hides original YT controls
                'modestbranding': 1,
                'rel': 0,
                'showinfo': 0,
                'iv_load_policy': 3
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function onPlayerReady(event) {
        event.target.playVideo();
        setInterval(updateProgress, 1000);
    }

    function playPause() {
        const state = player.getPlayerState();
        if (state == 1) {
            player.pauseVideo();
            document.getElementById('playIcon').className = 'fas fa-play';
        } else {
            player.playVideo();
            document.getElementById('playIcon').className = 'fas fa-pause';
        }
    }

    function updateProgress() {
        if (player && player.getDuration) {
            let perc = (player.getCurrentTime() / player.getDuration()) * 100;
            document.getElementById('progressBar').style.width = perc + '%';
        }
    }

    function seek(event) {
        const rect = event.target.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const width = rect.width;
        const newTime = (x / width) * player.getDuration();
        player.seekTo(newTime, true);
    }

    function changeSpeed(val) { player.setPlaybackRate(parseFloat(val)); }
    
    function changeQuality(val) { player.setPlaybackQuality(val); }

    function toggleFull() {
        let elem = document.getElementById('videoContainer');
        if (!document.fullscreenElement) { elem.requestFullscreen(); } 
        else { document.exitFullscreen(); }
    }

    function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.PLAYING) {
            document.getElementById('playIcon').className = 'fas fa-pause';
        }
    }
</script>
</body>
</html>
