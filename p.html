<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Player - Student</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #007bff; --dark-blue: #003366; --bg: #050a10; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
        
        /* Video Player */
        .player-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
        #yt-player { width: 100%; height: 100%; pointer-events: none; transform: scale(1.05); } /* Hide YT logo by scaling slightly */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; }
        
        .controls {
            position: absolute; bottom: 0; width: 100%; background: linear-gradient(transparent, rgba(0,51,102,0.9));
            display: flex; flex-wrap: wrap; align-items: center; padding: 10px; gap: 15px; z-index: 10; box-sizing: border-box;
        }
        .progress-container { width: 100%; height: 5px; background: rgba(255,255,255,0.2); cursor: pointer; border-radius: 5px; }
        .progress-bar { height: 100%; background: var(--blue); width: 0%; transition: width 0.2s; }
        
        .title-bar { position: absolute; top: 15px; left: 15px; font-size: 1.1rem; text-shadow: 2px 2px 4px #000; z-index: 11; font-weight: bold; }
        .btn { background: none; border: none; color: white; cursor: pointer; font-size: 1.2rem; }
        .btn:hover { color: var(--blue); }
        select { background: var(--dark-blue); color: white; border: 1px solid var(--blue); border-radius: 4px; padding: 3px; font-size: 12px; }

        /* Question Panel */
        .question-card { margin: 20px; padding: 20px; background: #111b27; border-left: 5px solid var(--blue); border-radius: 8px; display: none; }
        .opt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .opt-btn { padding: 15px; background: var(--dark-blue); border: 1px solid var(--blue); color: white; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .opt-btn:active { background: var(--blue); }
        input#stuName { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid var(--blue); background: #000; color: white; }
    </style>
</head>
<body>

<div class="player-wrapper" id="fullArea">
    <div class="title-bar" id="vTitle">Loading...</div>
    <div class="overlay"></div>
    <div id="yt-player"></div>

    <div class="controls">
        <div class="progress-container" onclick="seek(event)">
            <div class="progress-bar" id="pBar"></div>
        </div>
        <button class="btn" onclick="togglePlay()"><i id="pIcon" class="fas fa-play"></i></button>
        <select onchange="setSpeed(this.value)">
            <option value="0.5">0.5x</option>
            <option value="1" selected>Normal</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
        </select>
        <select id="quality">
            <option>Auto</option>
            <option>1080p</option>
            <option>720p</option>
        </select>
        <button class="btn" onclick="toggleCaptions()"><i class="fas fa-closed-captioning"></i></button>
        <button class="btn" style="margin-left:auto" onclick="toggleFull()"><i class="fas fa-expand"></i></button>
    </div>
</div>

<div class="question-card" id="qCard">
    <input type="text" id="stuName" placeholder="Enter Your Name to Answer">
    <h3 id="qText">Question appears here?</h3>
    <div id="qOptions" class="opt-grid"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDPm2za3Ho0Hd8Henuhq0KxAHyUQh-Hi-U",
        authDomain: "question-metabase.firebaseapp.com",
        projectId: "question-metabase",
        storageBucket: "question-metabase.firebasestorage.app",
        messagingSenderId: "770698198753",
        appId: "1:770698198753:web:59ae49d78b6013bab5c1a0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // --- URL PARAMETERS ---
    const params = new URLSearchParams(window.location.search);
    const videoUrl = params.get('p');
    const sessionId = params.get('id') || "default";
    const videoTitle = params.get('title') || "Live Class";
    document.getElementById('vTitle').innerText = videoTitle;

    function getID(url) {
        if (!url) return 'cAzn5-nZs9g';
        const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
        const liveMatch = url.match(/\/live\/([a-zA-Z0-9_-]+)/);
        if (liveMatch) return liveMatch[1];
        const match = url.match(regExp);
        return (match && match[7].length == 11) ? match[7] : 'cAzn5-nZs9g';
    }

    // --- PLAYER LOGIC ---
    let player;
    window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player('yt-player', {
            videoId: getID(videoUrl),
            playerVars: { 'autoplay': 1, 'controls': 0, 'modestbranding': 1, 'rel': 0 },
            events: { 
                'onReady': (e) => { e.target.playVideo(); setInterval(updateProg, 1000); },
                'onStateChange': (e) => { document.getElementById('pIcon').className = e.data == 1 ? 'fas fa-pause' : 'fas fa-play'; }
            }
        });
    };

    window.togglePlay = () => player.getPlayerState() == 1 ? player.pauseVideo() : player.playVideo();
    window.setSpeed = (v) => player.setPlaybackRate(parseFloat(v));
    window.toggleFull = () => { const el = document.getElementById('fullArea'); if (!document.fullscreenElement) el.requestFullscreen(); else document.exitFullscreen(); };
    function updateProg() { if(player.getDuration) document.getElementById('pBar').style.width = (player.getCurrentTime()/player.getDuration()*100) + '%'; }

    // --- REALTIME QUESTIONS ---
    const qCol = query(collection(db, `sessions/${sessionId}/questions`), orderBy("time", "desc"), limit(1));
    onSnapshot(qCol, (snap) => {
        snap.forEach(doc => {
            const data = doc.data();
            document.getElementById('qCard').style.display = "block";
            document.getElementById('qText').innerText = data.text;
            let html = "";
            if(data.type === "MCQ") {
                data.opts.forEach(o => { html += `<button class="opt-btn" onclick="sendAns('${o}', '${doc.id}')">${o}</button>`; });
            } else {
                html = `<button class="opt-btn" onclick="sendAns('True', '${doc.id}')">True</button>
                        <button class="opt-btn" onclick="sendAns('False', '${doc.id}')">False</button>`;
            }
            document.getElementById('qOptions').innerHTML = html;
        });
    });

    window.sendAns = async (val, qId) => {
        const name = document.getElementById('stuName').value || "Guest";
        const device = /Mobi|Android/i.test(navigator.userAgent) ? "Mobile" : "PC/Tablet";
        await addDoc(collection(db, `sessions/${sessionId}/answers`), {
            student: name, answer: val, qId: qId, device: device, time: Date.now()
        });
        alert("Answer Sent!");
        document.getElementById('qCard').style.display = "none";
    };
</script>
</body>
</html>
